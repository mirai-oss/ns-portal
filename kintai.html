async function api(path,opt={},token){

  const r=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.rt})});
  if(!r.ok){sess.clear();return false}
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});return true;
}

<script>
/* ==== LOGIC:BEGIN ====
   画面（DOM・通信）に依存しない計算だけを置く。test_kintai.js がこの区間を取り出してテストする（2026-11-12）。
   時刻の欄 1 つ = { hm:"HH:MM"（空なら ""）, off: 勤務日から何日ずれるか（0=当日・1=翌日・-1=前日）, src: "auto"=自動判定 / "data"=修正前の値 / "manual"=利用者が切り替えた } */
const KEYS=["cin","cout","b1s","b1e","b2s","b2e"];
const COL={cin:"clock_in",cout:"clock_out",b1s:"break_start_1",b1e:"break_end_1",b2s:"break_start_2",b2e:"break_end_2"};
const WD=["日","月","火","水","木","金","土"];
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);   // b − a（日）
const mdText=d=>{const p=String(d).split("-").map(Number);return `${p[1]}/${p[2]}`};
const mdwText=d=>`${mdText(d)}（${WD[new Date(d+"T00:00:00Z").getUTCDay()]}）`;
const fld=(hm,off,src)=>({hm:hm||"",off:off||0,src:src||"auto"});
/* "YYYY-MM-DDTHH:MM"（JST・受け口の op=day / op=alert が返す形）→ 欄。日付のずれは実際の日付から */
function fieldFromValue(date,v){if(!v||!date)return fld();const s=String(v);return fld(s.slice(11,16),dayDiff(date,s.slice(0,10)),"data");}
function timesFromRow(date,row){const T={};for(const k of KEYS)T[k]=fieldFromValue(date,row&&row[COL[k]]);return T;}
function defaultTimes(){return {cin:fld("17:00"),cout:fld("23:00"),b1s:fld(),b1e:fld(),b2s:fld(),b2e:fld()};}
/* 自動判定（今までの dt() と同じ規則）: 退勤・休憩は、出勤より早い時刻なら出勤の翌日 */
function autoOff(T,k){const c=T.cin;return c.off+((k!=="cin"&&T[k].hm&&c.hm&&T[k].hm<c.hm)?1:0);}
/* 時刻を入れた／変えた。手で切り替えた欄（manual）は日付を動かさない。出勤を変えたときは、自動判定の欄だけ判定し直す（修正前の値のままの欄は動かさない） */
function setTime(T,k,hm){
  hm=hm||"";if(T[k].hm===hm)return T;
  T[k].hm=hm;
  if(k==="cin"){for(const x of KEYS)if(x!=="cin"&&T[x].src==="auto")T[x].off=autoOff(T,x);}
  else if(!hm){T[k].off=T.cin.off;T[k].src="auto";}
  else if(T[k].src!=="manual"){T[k].off=autoOff(T,k);T[k].src="auto";}
  return T;
}
/* 日付のしるしを手で切り替える。出勤: 当日⇔前日。退勤・休憩: 出勤の日⇔その翌日 */
function toggleDay(T,k){
  if(k==="cin"){T.cin.off=T.cin.off===0?-1:0;T.cin.src="manual";for(const x of KEYS)if(x!=="cin"&&T[x].src==="auto")T[x].off=autoOff(T,x);}
  else{const base=T.cin.off;T[k].off=T[k].off>base?base:base+1;T[k].src="manual";}
  return T;
}
function fieldDt(date,f){return f&&f.hm&&date?`${addDays(date,f.off)}T${f.hm}`:null;}
function fieldMin(f){if(!f||!f.hm)return null;const p=f.hm.split(":").map(Number);return f.off*1440+p[0]*60+p[1];}
/* 勤務（出勤〜退勤）・休憩・実働（分）。出せないときは null */
function calc(T){
  const a=fieldMin(T.cin),b=fieldMin(T.cout);
  const pair=(s,e)=>{const x=fieldMin(T[s]),y=fieldMin(T[e]);return x!=null&&y!=null&&y>x?y-x:0};
  const brk=pair("b1s","b1e")+pair("b2s","b2e");
  if(a==null||b==null||b<=a||b-a-brk<0)return {span:null,brk,net:null};
  return {span:b-a,brk,net:b-a-brk};
}
/* 送信前の検査。規則と文言は RPC（sf_attendance_fix_request / sf_attendance_request_submit）と同じ。問題なければ null */
function validateTimes(T){
  const m={};for(const k of KEYS)m[k]=fieldMin(T[k]);
  if(m.cin==null||m.cout==null)return "出勤と退勤の時刻を入れてください";
  if(m.cout<=m.cin)return "退勤は出勤より後の時刻にしてください（日付をまたぐときは、退勤の「当日」を押して「翌日」にします）";
  if(m.cout-m.cin>1440)return "勤務は 24 時間以内にしてください";
  if(T.cin.off<-1||T.cin.off>1)return "出勤日が勤務日と離れすぎています";
  if((m.b1s==null)!==(m.b1e==null)||(m.b2s==null)!==(m.b2e==null))return "休憩は開始と終了の両方を入れてください";
  if(m.b1s==null&&m.b2s!=null)return "休憩2 だけは入れられません（休憩1 に入れてください）";
  let brk=0;
  if(m.b1s!=null){if(m.b1e<=m.b1s||m.b1s<m.cin||m.b1e>m.cout)return "休憩1 は出勤〜退勤の間で、終了を開始より後にしてください";brk+=m.b1e-m.b1s;}
  if(m.b2s!=null){if(m.b2e<=m.b2s||m.b2s<m.b1e||m.b2e>m.cout)return "休憩2 は休憩1 の後〜退勤の間で、終了を開始より後にしてください";brk+=m.b2e-m.b2s;}
  if(brk>240)return "休憩の合計は 4 時間以内にしてください";
  return null;
}
function validateReason(r){const n=[...String(r||"").trim()].length;return n<1?"理由を入れてください":n>300?"理由を 300 字以内で入れてください":null;}
/* 表示 */
const offMark=off=>off===0?"":off===1?"翌 ":off===-1?"前日 ":off>1?`${off}日後 `:`${-off}日前 `;
const fieldText=f=>f&&f.hm?offMark(f.off)+f.hm:"なし";
const sameField=(a,b)=>(a.hm||"")===(b.hm||"")&&(!a.hm||a.off===b.off);
const chipLabel=off=>off===0?"当日":off===1?"翌日":off===-1?"前日":off>1?`${off}日後`:`${-off}日前`;
/* 欄の下の小さな表示: 「修正前 15:00」／変えたら「修正前 15:00 → 16:00」。before が無い（勤怠追加）なら出さない */
function diffInfo(before,now){
  if(!before)return {changed:false,text:""};
  const ch=!sameField(before,now);
  return {changed:ch,text:ch?`修正前 ${fieldText(before)} → ${fieldText(now)}`:`修正前 ${fieldText(before)}`};
}
function hasChange(BT,T){return KEYS.some(k=>!sameField(BT[k],T[k]));}
const fmtDur=min=>`${Math.floor(min/60)}時間${min%60}分`;
/* 「11/10（火）17:00 〜 翌 11/11（水）01:00」。翌日であることが日付で分かるように */
function rangeText(date,T){
  if(!date||!T.cin.hm||!T.cout.hm)return "";
  const d1=addDays(date,T.cin.off),d2=addDays(date,T.cout.off);
  return `${mdwText(d1)}${T.cin.hm} 〜 ${d2===d1?"":(d2>d1?"翌 ":"")+mdwText(d2)}${T.cout.hm}`;
}
/* 修正前の実働（分）: 勤怠実績の worked_minutes（＝拘束時間。退勤−出勤）から break_minutes（休憩の合計）を引いた値。休憩が無ければ worked_minutes のまま。
   worked_minutes が無ければ修正前の時刻から計算。出せなければ null（2026-11-14: worked_minutes を拘束時間にそろえたため、実働は「拘束−休憩」で出す） */
function beforeNet(row,BT){
  if(row&&row.worked_minutes!=null&&row.worked_minutes!==""){
    const brk=row.break_minutes==null||row.break_minutes===""?0:Number(row.break_minutes);
    return Math.max(0,Number(row.worked_minutes)-(Number.isFinite(brk)?brk:0));
  }
  return BT?calc(BT).net:null;
}
/* 「勤務 ◯時間◯分 − 休憩 ◯分 ＝ 実働 ◯時間◯分（修正前 ◯時間◯分）」 */
function summaryText(T,before){   // before={row,T}（勤怠追加のときは null）
  const c=calc(T);
  const now=c.net==null?"勤務 —（出勤と退勤を正しく入れると計算します）":`勤務 ${fmtDur(c.span)} − 休憩 ${c.brk}分 ＝ 実働 ${fmtDur(c.net)}`;
  if(!before)return now;
  const b=beforeNet(before.row,before.T);
  return `${now}（修正前 ${b==null?"—":fmtDur(b)}）`;
}
/* 送信する中身。通常のフォーム＝既存の op=submit（項目は従来と同じ）／アラートから＝op=alert_fix */
function buildSubmitBody(o){   // o={kind,alertId,store,user,date,T,reason}
  const t={};for(const k of KEYS)t[COL[k]]=fieldDt(o.date,o.T[k]);
  if(o.alertId)return {op:"alert_fix",alert_id:o.alertId,...t,no_break:!t.break_start_1&&!t.break_end_1&&!t.break_start_2&&!t.break_end_2,reason:o.reason};
  return {op:"submit",kind:o.kind,store_id:o.store,user_id:o.user,work_date:o.date,...t,reason:o.reason};
}
/* アラート（op=alert の返り値）→ 画面の自動入力 */
function alertPrefill(a){
  return {kind:"fix",store:a.store_id,date:a.work_date,user:a.user_id,before:a,T:timesFromRow(a.work_date,a),beforeT:timesFromRow(a.work_date,a),showB2:!!(a.break_start_2||a.break_end_2)};
}
const alertBanner=a=>`Slack の勤怠確認から開きました: ${mdwText(a.work_date)}｜${a.store_name||"—"}｜${a.name||"—"}`;
/* 休憩の申告 */
function validateBreakDeclare(o){   // o={store,user,date,bkind,minutes,reason}
  if(!o.store||!o.user||!o.date)return "店舗・勤務日・人を選んでください";
  if(o.bkind!=="none"&&o.bkind!=="short")return "「休憩を取っていない」か「休憩が短かった」を選んでください";
  if(o.bkind==="short"){const s=String(o.minutes??"").trim(),n=Number(s);if(!/^\d+$/.test(s)||n<1||n>59)return "実際に休憩した分数を 1〜59 で入れてください";}
  return validateReason(o.reason);
}
function buildBreakBody(o){return {op:"break_declare",store_id:o.store,user_id:o.user,work_date:o.date,kind:o.bkind,minutes:o.bkind==="short"?Number(String(o.minutes).trim()):null,reason:o.reason};}
/* 受け口が古い版（新しい op を知らない）のときの文言をそろえる */
function serverError(r){
  const e=r&&r.body&&r.body.error;
  if(e&&/^op は /.test(e))return "この機能はまだ使えません（準備中です）";
  return e||("送信に失敗しました（HTTP "+(r?r.status:"?")+"）");
}
const isUuid=v=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(v||""));
/* ==== LOGIC:END ==== */
</script>
<script>
/* 状態 */
let ME=null,STORES=[],STAFF=[],KIND="fix",STORE="",USER="",Q="",DATE="",DAY=[],DAYLOAD=false,BEFORE=null;   // DATE=勤務日・DAY=その日の勤怠一覧（修正前の値）・BEFORE=選んだ人の修正前
let T=defaultTimes(),BEFORE_T=null,SHOW_B2=false,REASON="",MSG="",HIST_HTML="読み込み中…",SENDING=false;      // T=時刻の欄・BEFORE_T=修正前の欄・MSG=送信結果の表示
let ALERT=null,ALERT_MSG="",ALERT_DONE="";   // Slack の勤怠確認から開いたとき（?alert=<id>）: ALERT=対象・ALERT_MSG=開けなかった理由・ALERT_DONE=申請後の表示
let BKIND="none",BMIN="";                    // 休憩の申告: none=取っていない / short=短かった（分）
const ROLE_NAME={CEO:"社長",HQ:"本部",TEAM:"チーム長",TENCHO:"店長",SHAIN:"社員",AL:"アルバイト"};
const todayJst=()=>new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
const alertParam=()=>{const v=new URLSearchParams(location.search).get("alert");return isUuid(v)?v:"";};

function renderLogin(){$("app").innerHTML=`<div class="card"><p style="margin-bottom:10px;line-height:1.7">ログインが必要です。ポータルからログインしてから、もう一度この画面を開いてください。${alertParam()?"<br>ログインしたあと、ブラウザの「戻る」でこの画面に戻るか、Slack の「修正する」ボタンをもう一度押してください。":""}</p><a class="btn" href="index.html">← ポータルへ</a></div>`;}

function fmtRow(r){   // 一覧の 1 行: 出勤−退勤（勤務 n時間n分・休憩 …）
  const hm=t=>t?t.slice(11):"";
  const nd=(t)=>t&&r.clock_in&&t.slice(0,10)>r.clock_in.slice(0,10)?"翌":"";
  const out=r.clock_out?nd(r.clock_out)+hm(r.clock_out):"退勤なし";
  const brk=[[r.break_start_1,r.break_end_1],[r.break_start_2,r.break_end_2]].filter(x=>x[0]).map(x=>`${hm(x[0])}−${x[1]?nd(x[1])+hm(x[1]):"終了なし"}`);
  const w=r.worked_minutes==null?"":`勤務 ${Math.floor(r.worked_minutes/60)}時間${r.worked_minutes%60}分`;
  return `${hm(r.clock_in)||"-"}−${out}${w||brk.length?`（${[w,brk.length?"休憩 "+brk.join("・"):"休憩なし"].filter(Boolean).join("・")}）`:""}`;
}
function dayListHtml(){
  if(!STORE||!DATE) return `<div class="empty">先に店舗と勤務日を選んでください</div>`;
  if(DAYLOAD) return `<div class="empty">読み込み中…</div>`;
  if(!DAY.length) return `<div class="empty">この日の勤怠はありません${KIND==="fix"?"（打刻が無い日は「➕ 勤怠追加」で申請してください）":""}</div>`;
  return DAY.map(r=>KIND==="fix"
    ?`<div class="${r.user_id===USER?"sel":""}" onclick="pickRow('${r.user_id}')">${esc(r.name)}${r.pending?" <span style='font-size:12px;color:var(--bad)'>承認待ちの申請あり</span>":""}${r.locked?" <span style='font-size:12px'>🔒修正済</span>":""}<span class="sub">${esc(fmtRow(r))}</span></div>`
    :`<div class="ro">${esc(r.name)}<span class="sub">${esc(fmtRow(r))}${KIND==="add"?"（すでに勤怠あり → 直すときは「✏️ 勤怠修正」）":""}</span></div>`).join("");
}
function staffListHtml(){
  if(!STORE)return `<div class="empty">先に店舗を選んでください</div>`;
  if(STAFF.length===0)return `<div class="empty">読み込み中…または所属者がいません</div>`;
  const q=Q.trim().toLowerCase();
  const list=STAFF.filter(u=>!q||String(u.name).toLowerCase().includes(q)||String(u.name).replace(/[\s　]/g,"").toLowerCase().includes(q.replace(/[\s　]/g,"")));
  if(!list.length)return `<div class="empty">該当なし</div>`;
  return list.map(u=>`<div class="${u.id===USER?"sel":""}" onclick="setUser('${u.id}')">${esc(u.name)}${ME&&u.id===ME.id?"（自分）":""} <span style="color:var(--muted);font-size:12px">${ROLE_NAME[u.role]||u.role||""}</span></div>`).join("");
}
/* 時刻の入力（2 列）。欄ごとに: 見出し＋日付のしるし（押すと当日⇔翌日。出勤は当日⇔前日）／時刻／修正前 */
function tfHtml(k,label){
  return `<div class="tf"><div class="tl"><span>${label}</span><button type="button" class="chip" id="chip-${k}" onclick="tgl('${k}')"></button></div>`
    +`<input id="${k}" type="time" aria-label="${label}の時刻" value="${esc(T[k].hm)}" oninput="setT('${k}',this.value)" onchange="setT('${k}',this.value)"><div class="bf" id="bf-${k}"></div></div>`;
}
function timesHtml(){
  const two=SHOW_B2;
  return `<div class="grid2">${tfHtml("cin","出勤")}${tfHtml("cout","退勤")}</div>
    <div class="grid2">${tfHtml("b1s",two?"休憩1 開始":"休憩 開始")}${tfHtml("b1e",two?"休憩1 終了":"休憩 終了")}</div>
    ${two?`<div class="grid2">${tfHtml("b2s","休憩2 開始")}${tfHtml("b2e","休憩2 終了")}</div>`:""}
    <div class="brk-btns">${two?`<button type="button" class="lnk" onclick="removeB2()">休憩2 を消す</button>`:`<button type="button" class="lnk" onclick="addB2()">＋ 休憩をもう 1 回</button>`}<button type="button" class="lnk" onclick="noBreak()">休憩なしにする</button></div>
    <div class="sum" id="sum"></div>
    <div class="note">出勤より早い時刻を入れると、自動で「翌日」になります。「当日／翌日」のしるしは押すと切り替えられます（出勤は「前日」にできます）。休憩が無ければ空のままで OK です。</div>`;
}
/* 入力欄を作り直さずに、しるし・色・修正前後・実働だけ書き換える（入力中のキーボードやピッカーを閉じないため） */
function paintTimes(){
  for(const k of KEYS){
    const inp=$(k);if(!inp)continue;
    const f=T[k],d=diffInfo(BEFORE_T?BEFORE_T[k]:null,f),chip=$("chip-"+k),bf=$("bf-"+k);
    if(inp.value!==f.hm)inp.value=f.hm;
    chip.textContent=chipLabel(f.off);chip.className="chip"+(f.off!==0?" on":"");
    chip.style.visibility=(k==="cin"||f.hm)?"visible":"hidden";
    chip.setAttribute("aria-label",`日付: ${chipLabel(f.off)}（押すと切り替え）`);
    inp.classList.toggle("chg",d.changed);
    bf.textContent=d.text;bf.className="bf"+(d.changed?" chg":"");
  }
  const s=$("sum");if(!s)return;
  const rng=rangeText(DATE,T);
  s.innerHTML=`${rng?`<div class="rng">${esc(rng)}</div>`:""}<div>${esc(summaryText(T,BEFORE_T?{row:BEFORE,T:BEFORE_T}:null))}</div>`;
}
function rerenderTimes(){const el=$("times");if(el){el.innerHTML=timesHtml();paintTimes();}}
function clearErr(){if(MSG.includes("msg-err")){MSG="";const m=$("msg");if(m)m.innerHTML="";}}   // 直し始めたら、前のエラー表示は消す
function setT(k,v){setTime(T,k,v);clearErr();paintTimes();}
function tgl(k){toggleDay(T,k);clearErr();paintTimes();}
const beforeHasB2=()=>!!(BEFORE_T&&(BEFORE_T.b2s.hm||BEFORE_T.b2e.hm));
function addB2(){SHOW_B2=true;rerenderTimes();}
function removeB2(){setTime(T,"b2s","");setTime(T,"b2e","");SHOW_B2=beforeHasB2();clearErr();rerenderTimes();}
function noBreak(){for(const k of ["b1s","b1e","b2s","b2e"])setTime(T,k,"");SHOW_B2=beforeHasB2();clearErr();rerenderTimes();}
function setReason(v){REASON=v;clearErr();}
function reasonHtml(ph){return `<label>理由<span class="req">必須</span></label><textarea id="reason" rows="2" maxlength="300" placeholder="${ph}" oninput="setReason(this.value)">${esc(REASON)}</textarea>`;}

function alertHtml(){
  const a=ALERT;
  const bar=`<div class="card alertbar"><div class="ab-t">${esc(alertBanner(a))}</div>`
    +(a.changed_since_alert?`<div class="note">Slack に通知が出たあとで打刻が変わっています。下の「修正前」は、いまの打刻です。</div>`:"")
    +(a.locked?`<div class="note">🔒 この勤怠は、すでに一度修正されています。</div>`:"")+`</div>`;
  if(ALERT_DONE)return bar+`<div class="card">${ALERT_DONE}<button type="button" class="btn sub" onclick="leaveAlert()">ほかの勤怠を申請する（通常のフォームへ）</button></div>`;
  return bar+`<div class="card">
    <div style="font-weight:700;font-size:15px">✏️ 勤怠修正</div>
    <div class="note">いまの打刻が入っています。直したいところだけ変えてください。</div>
    <div id="times">${timesHtml()}</div>
    ${reasonHtml("例: 退勤の打刻忘れ")}
    <button class="btn" id="submit" onclick="submit()">修正を申請する</button>
    <div id="msg">${MSG}</div>
    <div class="note" style="margin-top:12px"><a href="kintai.html" onclick="leaveAlert();return false">この人・この日ではない勤怠を申請する（通常のフォームへ）</a></div>
  </div>`;
}
function formHtml(){
  const stOpts=STORES.map(s=>`<option value="${s.id}" ${s.id===STORE?"selected":""}>${esc(s.name)}</option>`).join("");
  const kindNote=KIND==="add"?"打刻が無かった日の勤務を新しく登録します。":KIND==="fix"?"すでにある勤務の出勤・退勤・休憩を直します。日付と店舗を選ぶとその日の勤怠が出るので、直す人を選んでください。":"休憩を取れなかった日・短かった日を申告します（この日は休憩を自動で入れません）。";
  let person,main,btn;
  if(KIND==="fix"){
    person=`<label>直す人（この日の勤怠）<span class="req">必須</span></label><div class="staff-list">${dayListHtml()}</div>`;
  }else{
    person=`<label>${KIND==="break"?"申告する人":"従業員"}<span class="req">必須</span></label>
    <input id="q" type="search" placeholder="名前で絞り込み（ひらがな・漢字どちらでも）" value="${esc(Q)}" oninput="setQ(this.value)" ${STORE?"":"disabled"}>
    <div class="staff-list" id="staff">${staffListHtml()}</div>
    ${STORE&&DATE&&(DAYLOAD||DAY.length)?`<label>${KIND==="break"?"この日の勤怠（参考）":"この日すでに勤怠がある人（参考）"}</label><div class="staff-list">${dayListHtml()}</div>`:""}`;
  }
  if(KIND==="break"){
    main=`<label>申告の内容<span class="req">必須</span></label>
    <div class="seg"><button type="button" class="${BKIND==="none"?"active":""}" onclick="setBKind('none')">休憩を取っていない</button><button type="button" class="${BKIND==="short"?"active":""}" onclick="setBKind('short')">休憩が短かった</button></div>
    ${BKIND==="short"?`<label>実際に休憩した時間（分）<span class="req">必須</span></label><input id="bmin" type="number" inputmode="numeric" min="1" max="59" step="1" placeholder="例: 20" value="${esc(BMIN)}" oninput="setBMin(this.value)"><div class="note">1〜59 分で入れてください。</div>`:""}
    ${reasonHtml("例: 人手が足りず休憩に入れなかった")}`;
    btn="休憩を申告する";
  }else if(KIND==="add"||(BEFORE&&BEFORE.user_id===USER)){
    main=`<div id="times">${timesHtml()}</div>${reasonHtml("例: 退勤の打刻忘れ")}`;
    btn=KIND==="fix"?"修正を申請する":"追加を申請する";
  }else{
    main=`<div class="note" style="margin-top:12px">上で直す人を選ぶと、いまの打刻が入った入力欄が出ます。</div>`;btn="";
  }
  return `<div class="card">
    <label style="margin-top:0">申請の種類<span class="req">必須</span></label>
    <div class="seg"><button type="button" class="${KIND==="add"?"active":""}" onclick="setKind('add')">➕ 勤怠追加</button><button type="button" class="${KIND==="fix"?"active":""}" onclick="setKind('fix')">✏️ 勤怠修正</button></div>
    <button type="button" class="mini ${KIND==="break"?"active":""}" onclick="setKind('break')">☕ 休憩の申告（取っていない・短かった）</button>
    <div class="note">${kindNote}</div>
    <label>店舗<span class="req">必須</span></label>
    <select id="store" onchange="setStore(this.value)"><option value="">選んでください</option>${stOpts}</select>
    <label>勤務日<span class="req">必須</span></label>
    <input id="date" type="date" max="${todayJst()}" value="${esc(DATE)}" onchange="setDate(this.value)">
    ${person}
    ${main}
    ${btn?`<button class="btn" id="submit" onclick="submit()">${btn}</button>`:""}
    <div id="msg">${MSG}</div>
  </div>`;
}
function render(){
  const head=`<div class="card"><h1>⏰ 勤怠の追加・修正申請</h1><div class="who">${esc(ME.name)}（${ROLE_NAME[ME.role]||ME.role}）・承認されるとスマレジと管理システムに反映されます</div></div>`;
  const body=ALERT?alertHtml():(ALERT_MSG?`<div class="card"><div class="msg-err" style="margin-top:0">${esc(ALERT_MSG)}</div><div class="note" style="margin-top:8px">下の通常のフォームから申請できます。</div></div>`:"")+formHtml();
  $("app").innerHTML=head+body+`<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:6px">最近の申請</div><div class="hist" id="hist">${HIST_HTML}</div></div>`;
  paintTimes();
}
function clearPick(){USER="";BEFORE=null;BEFORE_T=null;SHOW_B2=false;if(KIND==="fix")T=defaultTimes();}
function pickSelf(){if(KIND==="break"&&!USER&&ME&&STAFF.some(u=>u.id===ME.id))USER=ME.id;}   // 休憩の申告: 本人なら自分を選んだ状態に
function setKind(k){KIND=k;MSG="";clearPick();T=defaultTimes();pickSelf();render();}
function setDate(v){DATE=v;MSG="";clearPick();pickSelf();render();loadDay();}
async function setStore(id){STORE=id;MSG="";clearPick();STAFF=[];Q="";render();if(!id)return;
  loadDay();
  const r=await authed(FN_URL,{method:"POST",body:JSON.stringify({op:"staff",store_id:id})});
  if(id!==STORE)return;
  STAFF=(r.ok&&r.body?.staff)||[];pickSelf();
  const el=$("staff");if(el)el.innerHTML=staffListHtml();}
/* その日・その店舗の勤怠一覧（修正前の値）。店舗か勤務日が変わるたびに取り直す */
async function loadDay(){
  DAY=[];if(!STORE||!DATE){DAYLOAD=false;render();return;}
  DAYLOAD=true;render();
  const st=STORE,dt0=DATE;
  const r=await authed(FN_URL,{method:"POST",body:JSON.stringify({op:"day",store_id:st,work_date:dt0})});
  if(st!==STORE||dt0!==DATE||ALERT)return;   // 取っている間に変わっていたら捨てる
  DAYLOAD=false;DAY=(r.ok&&r.body?.rows)||[];render();
}
/* 修正する人を選ぶ: 修正前の出勤・退勤・休憩を入力欄に入れる */
function pickRow(uid){
  const r=DAY.find(x=>x.user_id===uid);if(!r)return;
  USER=uid;BEFORE=r;BEFORE_T=timesFromRow(DATE,r);T=timesFromRow(DATE,r);SHOW_B2=beforeHasB2();MSG="";render();
}
function setQ(v){Q=v;const el=$("staff");if(el)el.innerHTML=staffListHtml();}
function setUser(id){USER=id;const el=$("staff");if(el)el.innerHTML=staffListHtml();}
function setBKind(k){BKIND=k;MSG="";render();}
function setBMin(v){BMIN=v;clearErr();}

function showErr(t){MSG=`<div class="msg-err">${esc(t)}</div>`;const m=$("msg");if(m)m.innerHTML=MSG;}
async function send(body,label){
  const b=$("submit");SENDING=true;if(b){b.disabled=true;b.textContent="送信中…";}
  const r=await authed(FN_URL,{method:"POST",body:JSON.stringify(body)});
  SENDING=false;const b2=$("submit");if(b2){b2.disabled=false;b2.textContent=label;}
  return r;
}
async function submit(){
  if(SENDING)return;
  MSG="";const m=$("msg");if(m)m.innerHTML="";
  if(!ALERT&&KIND==="break")return submitBreak();
  const reason=REASON.trim();
  if(!ALERT&&(!STORE||!USER||!DATE)){showErr(KIND==="fix"?"店舗・勤務日・直す人を選んでください":"店舗・従業員・勤務日を選んでください");return;}
  const e=validateTimes(T)||validateReason(reason);
  if(e){showErr(e);return;}
  if(BEFORE_T&&!hasChange(BEFORE_T,T)){showErr("修正前から変わっていません。直すところを変えてから申請してください");return;}
  const label=ALERT||KIND==="fix"?"修正を申請する":"追加を申請する";
  const r=await send(buildSubmitBody({kind:KIND,alertId:ALERT?ALERT.id:null,store:STORE,user:USER,date:DATE,T,reason}),label);
  if(!r.ok||!r.body?.ok){showErr(serverError(r));return;}
  REASON="";
  if(ALERT){
    ALERT_DONE=`<div class="msg-ok" style="margin-top:0">✅ 修正を申請しました。マスターの承認後に管理システムとスマレジへ反映されます。<br>${esc(r.body.summary||"")}<br>→ 修正後 ${esc(r.body.proposed||"")}</div>`;
    render();return;
  }
  MSG=`<div class="msg-ok">✅ 申請しました。マスターの承認後にスマレジと管理システムへ反映されます。<br>${esc(r.body.summary)}</div>`;
  clearPick();if(KIND==="add")T=defaultTimes();   // MSG は次の操作まで残す（一覧の取り直しで画面を書き直しても消えない）
  loadHist();loadDay();
}
async function submitBreak(){
  const o={store:STORE,user:USER,date:DATE,bkind:BKIND,minutes:BMIN,reason:REASON.trim()};
  const e=validateBreakDeclare(o);if(e){showErr(e);return;}
  const r=await send(buildBreakBody(o),"休憩を申告する");
  if(!r.ok||!r.body?.ok){showErr(serverError(r));return;}
  REASON="";BMIN="";
  MSG=`<div class="msg-ok">✅ ${esc(r.body.message||"申告を受け付けました。")}</div>`;render();
}
async function loadHist(){
  const r=await authed(`/rest/v1/sf_attendance_requests?select=kind,work_date,status,reason,requested_at,smaregi_sync_status,users!sf_attendance_requests_user_id_fkey(name),stores(name)&order=requested_at.desc&limit=10`);
  if(!r.ok||!Array.isArray(r.body)||!r.body.length){HIST_HTML=`<div style="color:var(--muted)">まだありません</div>`;}
  else{
    const lab={pending:"承認待ち",approved:"承認",rejected:"却下",cancelled:"取消"};
    HIST_HTML=r.body.map(x=>`<div><span class="pill ${x.status}">${lab[x.status]||x.status}</span>${x.kind==="add"?"追加":"修正"}　${esc(x.work_date)}　${esc(x.stores?.name||"")}　${esc(x.users?.name||"")}${x.status==="approved"?(x.smaregi_sync_status==="synced"?"　<span style='color:var(--ok)'>スマレジ反映済</span>":x.smaregi_sync_status==="failed"?"　<span style='color:var(--bad)'>スマレジ失敗</span>":""):""}</div>`).join("");
  }
  const el=$("hist");if(el)el.innerHTML=HIST_HTML;
}
/* Slack の勤怠確認から開いた（?alert=<id>）: 対象者・勤務日・店舗・いまの打刻を入れた状態にする。開けないときは理由を出して通常のフォームへ */
async function openAlert(id){
  $("app").innerHTML=`<div class="card" style="text-align:center;color:var(--muted)">勤怠確認の内容を読み込み中…</div>`;
  const r=await authed(FN_URL,{method:"POST",body:JSON.stringify({op:"alert",alert_id:id})});
  if(r.ok&&r.body?.ok&&r.body.alert){
    const p=alertPrefill(r.body.alert);
    ALERT=r.body.alert;KIND=p.kind;STORE=p.store;DATE=p.date;USER=p.user;BEFORE=p.before;BEFORE_T=p.beforeT;T=p.T;SHOW_B2=p.showB2;
  }else{
    ALERT=null;ALERT_MSG="Slack の勤怠確認から開きましたが、そのまま修正できません: "+serverError(r);
  }
  render();
}
function leaveAlert(){
  ALERT=null;ALERT_MSG="";ALERT_DONE="";MSG="";REASON="";KIND="fix";STORE="";DATE=addDays(todayJst(),-1);DAY=[];STAFF=[];clearPick();T=defaultTimes();
  try{history.replaceState(null,"",location.pathname)}catch(e){}   // URL から ?alert= を外す（読み込み直しても通常のフォームのまま）
  render();
}
async function main(){
  if(!sess.get()){renderLogin();return}
  ME=await fetchMe();if(!ME||ME.is_active===false){sess.clear();renderLogin();return}
  const r=await authed(`/rest/v1/stores?select=id,name,sort_order&is_active=eq.true&order=sort_order.asc.nullslast,name.asc`);
  STORES=(r.ok&&Array.isArray(r.body)?r.body:[]).filter(s=>s.name!=="本部");
  const p=new URLSearchParams(location.search);if(p.get("kind")==="add")KIND="add";if(p.get("kind")==="break")KIND="break";
  DATE=addDays(todayJst(),-1);
  loadHist();
  const aid=alertParam();
  if(aid)await openAlert(aid);else render();
}
/* ログインして「戻る」で戻ってきたとき（ページが保存されていた場合）は読み込み直す */
window.addEventListener("pageshow",e=>{if(e.persisted&&!ME)location.reload();});
main();
</script>
