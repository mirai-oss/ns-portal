name: _p一時検証（実行後に削除）
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: run
        env:
          SR_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          U="https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-kd-refresh"
          for B in '{"op":"pl_auto_sync","dry":true}' '{"op":"pl_auto_sync","dry":true}'; do
            S=$(date +%s)
            R=$(curl -s -m 200 -X POST "$U" -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d "$B" | cut -c1-300)
            echo "== $B  $(( $(date +%s) - S ))s  $R"
          done
          S=$(date +%s)
          R=$(curl -s -m 200 -X POST "$U" -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d '{"op":"gas_sync","action":"bqSyncPL"}' | cut -c1-200)
          echo "== bqSyncPL $(( $(date +%s) - S ))s $R"
