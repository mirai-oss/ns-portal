name: keiei-api-reservation(W2版)疎通確認（service_role・送信なし・一時的）
# レーンPのW2完了報告を受けての事前検証。list/monthly_summaryが実際に正しく速く返るか確認する。
# 用が済んだら削除する。
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: mode=listを実行(直近7日)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FROM=$(date -u -d '-3 days' +%Y-%m-%d)
          TO=$(date -u -d '+7 days' +%Y-%m-%d)
          echo "range: $FROM to $TO"
          time curl -sL -X POST "https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-api-reservation" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"mode\":\"list\",\"from\":\"$FROM\",\"to\":\"$TO\",\"limit\":500,\"includeCancelled\":true,\"includeSubBrand\":false}" \
            -o /tmp/list.json
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/list.json','utf8'));
            console.log('ok:', d.ok, 'error:', d.error);
            console.log('rows:', (d.rows||[]).length, 'totalCount:', d.totalCount);
            const byStore={};
            (d.rows||[]).forEach(r=>{ byStore[r.store_name]=(byStore[r.store_name]||0)+1; });
            console.log('by store:', JSON.stringify(byStore));
            const dates=(d.rows||[]).map(r=>r.visit_date).sort();
            console.log('date range in result:', dates[0], '...', dates[dates.length-1]);
          "
      - name: mode=monthly_summaryを実行(今月)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          YM=$(date -u +%Y-%m)
          time curl -sL -X POST "https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-api-reservation" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"mode\":\"monthly_summary\",\"year_month\":\"$YM\"}" \
            -o /tmp/monthly.json
          cat /tmp/monthly.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.stringify(JSON.parse(d),null,2)));"
