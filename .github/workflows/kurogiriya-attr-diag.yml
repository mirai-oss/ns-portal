name: 黒霧屋の予約属性の実値を確認（送信なし・一時的）
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: rsv_reservationsの全列を確認(Ring-style/いちご屋がどこにあるか)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?store_account=ilike.*%E9%BB%92%E9%9C%A7%E5%B1%8B*&select=*&limit=1000" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o /tmp/kg.json
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/kg.json','utf8'));
            console.log('rows:', d.length);
            if(d[0]) console.log('columns:', Object.keys(d[0]));
            ['channel_raw','channel_normalized','course','menu','tag','store_account','source'].forEach(col=>{
              const counts={};
              d.forEach(r=>{ const v=JSON.stringify(r[col]); counts[v]=(counts[v]||0)+1; });
              console.log(col+':', JSON.stringify(counts));
            });
            const hit=d.filter(r=>JSON.stringify(r).includes('Ring-style')||JSON.stringify(r).includes('いちご屋'));
            console.log('rows containing Ring-style/いちご屋 anywhere:', hit.length);
            if(hit[0]) console.log('sample match:', JSON.stringify(hit[0],null,2));
          "
