    // invoice_emails起点：invoicesへの保存が無くても種類分類だけで一覧に出す（C-6）

        email:{subject:e.subject, from_address:e.from_address, processor:e.processor},
      };

  }else{
    const r=await authed(`/rest/v1/invoices?select=*,email:invoice_emails!inner(subject,from_address,mail_kind,processing_user_id,processor:users!invoice_emails_processing_user_id_fkey(name))&email.mail_kind=eq.${kind}&order=created_at.desc&limit=300`);
    IV_ROWS=(r.ok&&Array.isArray(r.body))?r.body:[];
  }
  $("tabbody").innerHTML=`

      <div class="card" style="margin-bottom:12px">
        <div class="iv-filterbar">
          <div class="ivf"><small>検索</small><input type="search" id="iv-f-search" placeholder="${cfg.searchPlaceholder}" value="${esc(IV_SEARCH_Q)}"></div>
          <div class="ivf"><small>${cfg.amountLabel}（下限）</small><input type="number" id="iv-f-amtmin" value="${esc(IV_AMOUNT_MIN)}"></div>
          <div class="ivf"><small>${cfg.amountLabel}（上限）</small><input type="number" id="iv-f-amtmax" value="${esc(IV_AMOUNT_MAX)}"></div>
          <div class="ivf"><small>${cfg.dateLabel}（開始）</small><input type="date" id="iv-f-duefrom" value="${esc(IV_DUE_FROM)}"></div>
          <div class="ivf"><small>${cfg.dateLabel}（終了）</small><input type="date" id="iv-f-dueto" value="${esc(IV_DUE_TO)}"></div>
          <div class="ivf"><small>状態</small><select id="iv-f-status"><option value="">すべて</option>${Object.entries(cfg.statusLabel).map(([k,l])=>`<option value="${k}" ${IV_STATUS===k?"selected":""}>${l}</option>`).join("")}</select></div>
          <button class="hq-btn" id="iv-f-clear">絞り込み解除</button>
        </div>
      </div>
      <div class="card hq-tablewrap" id="ivTableWrap">${invoiceListBodyHtml()}</div>
    </section>`;
  wireInvoiceListTable(u);
  const applyFilters=()=>{
    IV_SEARCH_Q=$("iv-f-search").value; IV_AMOUNT_MIN=$("iv-f-amtmin").value; IV_AMOUNT_MAX=$("iv-f-amtmax").value;
    IV_DUE_FROM=$("iv-f-duefrom").value; IV_DUE_TO=$("iv-f-dueto").value; IV_STATUS=$("iv-f-status").value;
    $("ivTableWrap").innerHTML=invoiceListBodyHtml();
    wireInvoiceListTable(u);
  };
  $("iv-f-search").oninput=applyFilters;
  $("iv-f-amtmin").oninput=applyFilters; $("iv-f-amtmax").oninput=applyFilters;
  $("iv-f-duefrom").onchange=applyFilters; $("iv-f-dueto").onchange=applyFilters;
  $("iv-f-status").onchange=applyFilters;
  $("iv-f-clear").onclick=()=>renderFinancialListTab(u,kind);
}

/* ============================================================
   🧾 請求書（統合請求書一覧・2026-09-03新規）
   会計・請求書処理の全面刷新。従来「請求書一覧」（メール起点のみ）と「アップロード請求書」の
   最近アップロード一覧に分かれていたものを、取得元を問わず1つの一覧に統合した。
   要確認/会計待ち/振込待ち/完了のサブタブ・AI自動判定バッジ・重複疑い/口座変更のリスク表示・
   安全な請求書だけを選ぶ一括処理を持つ。
   【一括処理の安全設計】マネーフォワードへの実際の登録には「どの事業者（テナント）に
   登録するか」の情報が必要だが、請求書には登録前の時点でテナント情報を持たせる仕組みが
   まだ無い（テナントは仕訳登録の実行時に選ぶ設計のため）。この状態で「1クリックで全部
   自動登録」を作ると、誤ったテナント・誤った金額配分で登録してしまう事故のリスクがある。
   そのため一括処理は「安全な候補を選んで、1件ずつ確認しながら開く」アシスト機能とし、
   実際のマネーフォワード登録は必ず既存の単票登録フロー（人間が内容を見て登録ボタンを押す）
   を通す。将来テナント自動判定の基盤が整えば、真の一括登録に拡張できる設計にしてある。
   ============================================================ */
// 2026-09-04: 既定タブを「要対応」に変更し先頭へ（指示書§12・42「開いたときにまず対応が
// 必要なものが目に入るように」）。ラベルも「要確認」→「要対応」に変更（内容は変わらず、
// unifiedMatchesSubTab側の"review"キー判定はそのまま）
// 2026-09-10：ユーザー要望「請求書一覧のところで給料なのか請求書なのか区別がつかないので、
// 絞り込みできるようにしてほしい」を受け、当初は「種類」絞り込み（既定で給与関連を隠しつつ
// 切り替えて含められる）を用意したが、その後「やはりわかりにくいし見ずらいから、給与は
// 請求書一覧に入れないで欲しい」との報告を受け、切り替え無しで常に除外する方式に変更した
// （unifiedFilteredRows参照。給与仕訳から自動作成される「給与：氏名（年月）」invoicesレコード
// ＝is_payroll_related=trueは、この一覧には一切出てこない。確認は給与仕訳タブで行う）
let UNIFIED_STATE={subTab:"review", search:"", yearMonth:"", reasonFilter:"", sortCol:"", sortDir:"desc", rows:[]};
const UNIFIED_SUBTABS=[["review","要対応"],["all","すべて"],["accounting","会計待ち"],["payment","振込待ち"],["done","完了"]];
const REASON_FILTER_LABELS={
  overdue:"支払期限超過", bank_change:"振込先口座変更", duplicate:"重複疑い", mf_error:"MF登録エラー",
  unknown_journal:"仕訳不明（未判定）", unknown_company:"法人不明", unknown_store:"店舗・部門不明", import_error:"取込エラー",
  payment_unverified:"振込済み・支払確認待ち",

// 2026-09-04緊急修正：「要対応」タブを既定表示にした直後、ユーザーから「今までの請求書が
// 全て消えてしまった」と報告あり。原因調査の結果、データは消えていない（DBには17件現存）が、

// 同時に解消する（未判定＝ai_match_statusがnullも要対応に含めることで、旧データも正しく拾う）
// 2026-09-04拡張：要対応の「理由」を配列で返す共通関数にした（会計ダッシュボードの
// 「要対応の内訳」カードが、ここと全く同じ判定・同じ理由分類を再利用するため＝指示書§36
// 「要対応ロジックを二重実装しない」に対応。🧾請求書一覧側は従来どおりunifiedNeedsAttention()
// （真偽値だけ）を使い続けられるよう、その関数はunifiedAttentionReasons()の薄いラッパーにした）
// 2026-09-04新規：対象店舗の複数選択対応。invoice_storesを正データとして件数・表示名を扱う
// （rowにinvoice_storesが含まれない古いクエリ結果に対しては、後方互換でstore_idを1件として扱う）
function unifiedStoreCount(r){
  if(Array.isArray(r.invoice_stores)) return r.invoice_stores.length;
  return r.store_id?1:0;
}
function unifiedStoreLabel(r){
  if(Array.isArray(r.invoice_stores)&&r.invoice_stores.length){
    const names=r.invoice_stores.map(x=>x.store&&x.store.name).filter(Boolean);
    if(!names.length) return "—";
    if(names.length===1) return esc(names[0]);
    return `${esc(names[0])} 他${names.length-1}店舗`;
  }
  return esc((r.store&&r.store.name)||"—");

// 2026-09-05修正：ユーザー報告「間違えて振込完了にしてしまった請求書が、ダッシュボード上は
// ステータス『完了』になっているが、開いてみると実際には振込のところで止まっていて『支払を
// 確認済みにする』ボタンで止まっている」に対応。従来はpayment_status==='paid'（振込済みに
// した時点）を「完了」「対象外」として扱っていたが、本当の完了は支払確認（payment_verified_at）
// まで進んだときだけ。振込済み・支払確認待ちの請求書を「完了済みだから今さら指摘しても
// 仕方ない」と要対応から除外していたのが原因で見つけにくくなっていたため、新しい理由
// payment_unverified（振込済み・支払確認待ち）を要対応に追加し、絞り込みで見つけられるようにした
function unifiedAttentionReasons(r){
  if(r.payment_verified_at) return []; // 支払確認まで終わった、本当の完了済みだけ対象外にする
  const today=new Date().toISOString().slice(0,10);
  const reasons=[];
  // 2026-09-05修正：ユーザー報告「アップロード請求書で処理した請求書が一覧に出てこない」に対応。
  // amount未入力＝カード①(請求情報)が未完了のはずなのに、法人・店舗・仕訳判定などが
  // たまたま埋まっていると要対応理由が0件になり、既定の「要対応」タブから消えてしまっていた。
  // 金額が入っていない請求書は必ず要対応として残す
  if(r.amount==null) reasons.push("incomplete_info");
  if(r.payment_status==="paid") reasons.push("payment_unverified"); // 振込済みだが支払確認が済んでいない
  if(r.duplicate_suspected) reasons.push("duplicate");
  if(r.bank_account_change_detected) reasons.push("bank_change");
  if(r.mf_registration_error) reasons.push("mf_error");
  if(r.ai_match_status==="error") reasons.push("import_error");
  else if(!r.ai_match_status) reasons.push("unknown_journal"); // 自動判定が未実施＝仕訳の当たりが付いていない
  if(!r.corporation_id) reasons.push("unknown_company");
  if(unifiedStoreCount(r)===0) reasons.push("unknown_store");
  if(r.due_date && r.due_date<today && r.payment_status!=="paid") reasons.push("overdue");
  return reasons;
}
function unifiedNeedsAttention(r){ return unifiedAttentionReasons(r).length>0; }
function unifiedMatchesSubTab(r,tab){
  if(tab==="all") return true;
  if(tab==="review") return unifiedNeedsAttention(r);
  if(tab==="accounting") return !r.mf_journal_id;
  if(tab==="payment") return !!r.mf_journal_id&&["wait","csv","processing"].includes(r.payment_status);
  if(tab==="done") return !!r.payment_verified_at; // 支払確認まで終わって初めて「完了」タブに入る
  return true;
}
function unifiedStageOf(r){
  if(!r.mf_journal_id) return "内容確認・会計待ち";
  if(r.payment_verified_at) return "完了";
  if(r.payment_status==="paid") return "支払確認待ち";
  if(["wait","csv","processing"].includes(r.payment_status)) return "振込準備";
  return "会計済み";
}

function unifiedFilteredRows(){
  let list=UNIFIED_STATE.rows.filter(r=>unifiedMatchesSubTab(r,UNIFIED_STATE.subTab));
  // 2026-09-10：給与関連（is_payroll_related）は🧾請求書一覧には常に出さない。
  // 当初は「種類」絞り込み（通常のみ/すべて/給与関連のみ、既定は通常のみ）を用意したが、
  // ユーザー報告「やはりわかりにくいし見ずらいから、給与は請求書一覧に入れないで欲しい」
  // を受け、選択肢を無くして常に除外する方式に変更した（給与関連の確認は給与仕訳タブで行う）
  list=list.filter(r=>!r.is_payroll_related);
  // 2026-09-04新規：会計ダッシュボードのカード・要対応内訳からの絞り込み遷移用
  // （overdue/bank_change/duplicate/mf_error/unknown_journal/unknown_company/unknown_store/import_error）
  if(UNIFIED_STATE.reasonFilter) list=list.filter(r=>unifiedAttentionReasons(r).includes(UNIFIED_STATE.reasonFilter));
  const q=(UNIFIED_STATE.search||"").trim().toLowerCase();
  if(q) list=list.filter(r=>[r.vendor_name,r.invoice_number,(r.vendor&&r.vendor.name),(r.corp&&r.corp.name),(r.store&&r.store.name),...(Array.isArray(r.invoice_stores)?r.invoice_stores.map(x=>x.store&&x.store.name):[])].filter(Boolean).join(" ").toLowerCase().includes(q));
  if(UNIFIED_STATE.yearMonth){
    // 支払期限があればそちらを、無ければ受領日（created_at）を対象年月として扱う
    list=list.filter(r=>{
      const d=r.due_date||r.created_at;
      return d&&String(d).slice(0,7)===UNIFIED_STATE.yearMonth;
    });
  }
  if(UNIFIED_STATE.sortCol){
    const col=UNIFIED_STATE.sortCol;
    const norm=v=>{ if(v==null) return null; return col==="amount"?Number(v):v; };
    list=[...list].sort((a,b)=>{
      const av=norm(a[col]), bv=norm(b[col]);
      if(av==null&&bv==null) return 0;
      if(av==null) return 1;
      if(bv==null) return -1;
      if(av<bv) return UNIFIED_STATE.sortDir==="asc"?-1:1;
      if(av>bv) return UNIFIED_STATE.sortDir==="asc"?1:-1;
      return 0;
    });
  }else if(UNIFIED_STATE.subTab==="review"){
    // 2026-09-08新設：ユーザー要望「振込準備にしたらすべてのタブに入ってわかりにくいから、
    // 要対応の一番上に並ぶようにして欲しい」に対応。列見出しで明示的に並び替えていない
    // （既定の受領日順の）ときだけ、要対応タブ内で「振込準備」段階の請求書を最優先で
    // 一番上にまとめる（Array.prototype.sortは安定ソートのため、振込準備どうし・
    // それ以外どうしの中の順番は元の受領日順のまま保たれる）
    list=[...list].sort((a,b)=>{
      const ap=unifiedStageOf(a)==="振込準備"?0:1, bp=unifiedStageOf(b)==="振込準備"?0:1;
      return ap-bp;
    });
  }
  return list;
}

  await authed(`/rest/v1/invoice_attachments?invoice_id=eq.${invoiceId}`,{method:"DELETE",headers:{Prefer:"return=minimal"}}).catch(()=>{});

  const r=await authed(`/rest/v1/invoices?id=eq.${invoiceId}`,{method:"DELETE",headers:{Prefer:"return=minimal"}});

function rows_for_transfer_selection(){

async function transferExportCsv(u){
  const selected=rows_for_transfer_selection();
  if(!selected.length){ $("transfer-msg").textContent="対象を選択してください"; return; }
  // 2026-09-07修正：CSV出力の対象はあくまで銀行振込（PayPay銀行）のみ。引き落とし・現金払いは
  // 銀行口座を持たないため、選択されていても静かに除外し、その旨を分かりやすく案内する
  const accountOf=r=>TRANSFERS_STATE.accountsByVendor.get(r.vendor_id);
  const withAccount=selected.filter(r=>{
    const acc=accountOf(r);
    return acc&&(acc.payment_method||"bank_transfer")==="bank_transfer"&&acc.bank_code&&acc.branch_code; // 2026-09-05：銀行コード・支店コード未登録はCSV出力対象から除外（必ずエラーになるため）
  });

  }).length;
  if(!withAccount.length){
    $("transfer-msg").textContent=nonBankCount>0
      ?`選択した${nonBankCount}件は引き落とし・現金払い・クレジット払い・他行口座から振込のためCSV出力の対象外です（振込一覧の「✅ 選択を振込済みにする」で完了にしてください）`

  }
  // 2026-09-08追加：ユーザー要望「支払い（振込）のところに法人毎で絞れるようにする」対応の一環。
  // CSVは振込依頼人名を1つだけ指定する仕組みのため、法人が異なる請求書を混ぜて出力すると、
  // 実際の振込元（銀行口座）と依頼人名が食い違ったCSVになってしまう。複数法人が混ざっている
  // ときは、そのまま進めてよいか必ず確認する（法人フィルタで絞り込んでから出す運用を促す）
  const distinctCorps=[...new Set(withAccount.map(r=>transferCorpName(r)))];
  if(distinctCorps.length>1&&!confirm(`選択した請求書に複数の法人（${distinctCorps.join("・")}）が混ざっています。\nPayPay銀行CSVは振込依頼人名を1つしか指定できないため、法人ごとに分けて出力することを推奨します。\n\nこのまま全法人まとめて1つのCSVとして出力しますか？（キャンセルすると、上の「法人で絞り込み」から1法人ずつ選び直せます）`)) return;
  const remitterName=paypayRemitterName(); // 2026-09-04追加：PayPay銀行が振込依頼人名を必須としていたため確認する
  if(remitterName===null) return; // キャンセル
  // 2026-09-05追加：ユーザー要望「当日振り込みができないので振込予定日を表示・本部タスクを
  // 自動発行してほしい（担当：青山純・原美香・齋藤隆治／工程内チェックリストに振込先の名前）」
  const transferDate=await promptTransferDateModal();
  if(transferDate===null) return; // キャンセル
  const csv=buildPaypayCsv(withAccount.map(r=>{
    const acc=TRANSFERS_STATE.accountsByVendor.get(r.vendor_id);
    return { bankCode:acc.bank_code||"", branchCode:acc.branch_code||"", accountType:acc.account_type||"1", accountNumber:acc.account_number||"", holderKana:acc.account_holder_kana||"", amount:Number(r.amount)||0 };
  }),remitterName);
  const blob=paypayCsvToBlob(csv); // 2026-09-04：Shift-JISでエンコード（PayPay銀行アップロードエラー対応）
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`paypay_transfer_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  await authed(`/rest/v1/invoices?id=in.(${withAccount.map(r=>r.id).join(",")})`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({payment_status:"csv",transfer_csv_exported_at:new Date().toISOString(),transfer_scheduled_date:transferDate})});
  // 2026-09-05修正：ユーザー指摘「本部タスクの法人がN-Style固定になっている。請求情報の
  // 対象法人で作られるようにしてほしい」に対応。選択した請求書を対象法人ごとにグループ化し、
  // 法人ごとに別々の本部タスクを作る（対象法人が未設定の請求書はN-Styleを既定値として扱う）
  const corpNameOf=r=>{
    const name=(CORP_STORE_CACHE&&CORP_STORE_CACHE.corporations||[]).find(c=>c.id===r.corporation_id);
    return (name&&name.name)||"N-Style";
  };
  const groups=new Map();
  for(const r of withAccount){
    const corp=corpNameOf(r);
    if(!groups.has(corp)) groups.set(corp,[]);
    groups.get(corp).push((r.vendor&&r.vendor.name)||r.vendor_name);
  }
  let taskOkCount=0, taskFailCount=0;
  for(const [corp,names] of groups){
    const taskR=await createTransferConfirmTask("vendor",corp,transferDate,names,corp); // scope_key=法人名（法人ごとに1つの開いているタスクとして扱う）
    if(taskR.ok) taskOkCount++; else taskFailCount++;
  }
  await renderTransfersTab(u);
  $("transfer-msg").className=taskFailCount?"err":"err msg-ok";
  $("transfer-msg").textContent=`振込予定日: ${fmtD(transferDate)}／本部タスク「振込先を確認」を${taskOkCount}件（法人ごと）作成しました。`+(taskFailCount?`⚠️${taskFailCount}件は作成に失敗しました（振込CSV自体は正常に作成されています）。`:"");
}

// 2026-09-08修正：ユーザー要望「請求書の仕訳作成・仕訳辞書テンプレートも給与仕訳と同じ
// フォーマットにしてほしい」に対応するため、勘定科目名だけの候補・勘定科目名→補助科目名
// リストのMap（選択中の勘定科目に連動して補助科目候補を絞り込むため）も一緒に構築するよう拡張。
// 戻り値に新しいフィールドを追加しているだけなので、従来どおり{map,dl}だけを使う呼び出し元
// （給与仕訳のpayrollLoad()）には影響しない
function mftBuildAccountIndex(accounts){
  const map=new Map(); let dl="";
  const accNames=new Set(); const subsByAccount=new Map(); const subNamesAll=new Set();
  for(const a of accounts){
    map.set(a.name,{account_id:a.id,sub_account_id:null,account_name:a.name,sub_account_name:null});
    dl+=`<option value="${esc(a.name)}">`;
    if(a.name) accNames.add(a.name);
    const names=[];
    for(const sa of (a.sub_accounts||[])){
      const label=`${a.name}/${sa.name}`;
      map.set(label,{account_id:a.id,sub_account_id:sa.id,account_name:a.name,sub_account_name:sa.name});
      dl+=`<option value="${esc(label)}">`;
      if(sa.name){ names.push(sa.name); subNamesAll.add(sa.name); }
    }
    if(a.name&&names.length) subsByAccount.set(a.name,names);
  }
  const accountNameDatalistHtml=[...accNames].map(n=>`<option value="${esc(n)}">`).join("");
  return {map,dl,accountNameDatalistHtml,subAccountsByAccountName:subsByAccount,subAccountNamesAll:[...subNamesAll]};
}
function mftLabelOf(side){ if(!side||!side.account_name) return ""; return side.sub_account_name?`${side.account_name}/${side.sub_account_name}`:side.account_name; }
// 2026-09-08追加：勘定科目・補助科目を「勘定科目/補助科目」形式の1本の文字列から分解する共通
// ヘルパー（給与仕訳・請求書の仕訳作成・仕訳辞書テンプレート編集の3箇所で共通利用するため、
// トップレベル関数にしてある。店舗名の補助科目自体に"/"を含む場合があるため、最初の"/"だけで
// 分割し、2つ目以降の"/"は補助科目名の一部として扱う）
function splitAccLabel(label){
  const s=String(label||""); const i=s.indexOf("/");
  return i<0?{account:s,sub:""}:{account:s.slice(0,i),sub:s.slice(i+1)};
}

async function renderMftSection(tenantId){
  const box=$("mft-box");
  if(!box) return;
  box.innerHTML="読み込み中…（連携先の事業者を確認しています）";
  const tRes=await mfCall("list_tenants");
  const tenants=(tRes.ok&&tRes.body.tenants)||[];
  const activeTenantId=tenantId||(tenants[0]&&tenants[0].id)||"default";
  MFT_STATE.tenants=tenants; MFT_STATE.activeTenantId=activeTenantId;
  box.innerHTML="読み込み中…（勘定科目・仕訳辞書を確認しています）";
  const {accounts,departments,taxes,accountsOk,accountsError}=await mftLoadAccountsAndDepts(activeTenantId);
  const {map,dl,accountNameDatalistHtml,subAccountsByAccountName,subAccountNamesAll}=mftBuildAccountIndex(accounts);
  MFT_STATE.accountLabelMap=map; MFT_STATE.accountDatalistHtml=dl; MFT_STATE.departments=departments; MFT_STATE.taxes=taxes;
  MFT_STATE.accountNameDatalistHtml=accountNameDatalistHtml; MFT_STATE.subAccountsByAccountName=subAccountsByAccountName; MFT_STATE.subAccountNamesAll=subAccountNamesAll;
  // 判定条件（取引先・対象法人・対象店舗）のプルダウン用に取得（2026-09-03・仕訳辞書の拡張）
  const [vendorsRes,corpRes,storesRes]=await Promise.all([
    vendorCall("list_vendors"),
    authed("/rest/v1/corporations?select=id,name&order=name"),
    authed("/rest/v1/stores?select=id,name&order=name"),
  ]);
  MFT_STATE.vendors=(vendorsRes.ok&&vendorsRes.body.vendors)||[];
  MFT_STATE.corporations=(corpRes.ok&&Array.isArray(corpRes.body))?corpRes.body:[];
  MFT_STATE.storesAll=(storesRes.ok&&Array.isArray(storesRes.body))?storesRes.body:[];
  const tplRes=await authed(`/rest/v1/mf_journal_templates?tenant_id=eq.${encodeURIComponent(activeTenantId)}&select=*&order=label`);
  MFT_STATE.templates=(tplRes.ok&&Array.isArray(tplRes.body))?tplRes.body:[];
  MFT_STATE.editing=null;
  MFT_STATE.accountsOk=accountsOk; MFT_STATE.accountsError=accountsError;
  mftRenderBox();
}
// box全体（事業者選択・一覧・編集フォーム）の再描画。renderMftSection()の初回読み込み後だけでなく、
// 編集を開始/キャンセルするたびにも呼び直す（2026-09-02: 編集フォームを対象行のすぐ下に差し込むため、
// 一覧ごと作り直す必要がある。ネットワーク再取得はしない＝MFT_STATEのキャッシュのみで再構築する）
function mftRenderBox(){
  const box=$("mft-box");
  if(!box) return;
  const {tenants,activeTenantId,accountsOk,accountsError,editing}=MFT_STATE;
  box.innerHTML=`
    ${tenants.length>1?`<div style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">事業者</label>
      <select id="mft-tenant">${tenants.map(t=>`<option value="${esc(t.id)}" ${t.id===activeTenantId?"selected":""}>${esc(t.label)}</option>`).join("")}</select></div>`:""}
    ${!accountsOk?`<div class="err">勘定科目の取得に失敗しました（マネーフォワード未連携の可能性）: ${esc(accountsError||"")}</div>`:`
    <input id="mft-search" placeholder="🔍 仕訳辞書の名前で検索" value="${esc(MFT_STATE.searchQuery||"")}" style="max-width:240px;margin-bottom:8px">
    <div id="mft-list">${mftListHtml()}</div>
    <button class="hq-btn" id="mft-new" style="margin-top:8px">＋ 新しい仕訳辞書を追加</button>
    ${(!editing||editing.id===null)?`<div id="mft-editor" style="margin-top:10px"></div>`:""}`}
  `;
  if(tenants.length>1) $("mft-tenant").onchange=e=>renderMftSection(e.target.value);
  if(!accountsOk) return;
  if($("mft-search")) $("mft-search").oninput=()=>{ MFT_STATE.searchQuery=$("mft-search").value; $("mft-list").innerHTML=mftListHtml(); mftWireListButtons(); };
  mftWireListButtons();
  $("mft-new").onclick=()=>mftOpenEditor(null);
  if(editing) mftRenderEditor(); // 編集中（新規／既存とも）ならその場で内容を描画
}
function mftWireListButtons(){
  document.querySelectorAll("[data-mft-edit]").forEach(el=>el.onclick=()=>mftOpenEditor(MFT_STATE.templates.find(t=>t.id===el.dataset.mftEdit)));
  document.querySelectorAll("[data-mft-del]").forEach(el=>el.onclick=async()=>{
    if(!confirm(`仕訳辞書「${el.dataset.mftLabel}」を削除しますか？`)) return;
    await authed(`/rest/v1/mf_journal_templates?id=eq.${el.dataset.mftDel}`,{method:"DELETE"});
    renderMftSection(MFT_STATE.activeTenantId);
  });

function mftListHtml(){
  let tpls=MFT_STATE.templates||[];
  const q=(MFT_STATE.searchQuery||"").trim();
  if(q) tpls=tpls.filter(t=>(t.label||"").includes(q));
  const ed=MFT_STATE.editing;
  if(!tpls.length) return `<div style="font-size:12px;color:var(--muted)">${q?"該当する仕訳辞書が見つかりません":"この事業者にはまだ仕訳辞書が登録されていません。"}</div>`;
  return tpls.map(t=>{
    const sum=(t.branches||[]).map(b=>`${mftLabelOf(b.debit)||"?"}／${mftLabelOf(b.credit)||"?"}`).join("、");
    const row=`<div class="mfj-tpl-item"><div><div class="lbl">${esc(t.label)}</div><div class="sum">${esc(sum)}（${(t.branches||[]).length}行）</div></div>
      <div style="display:flex;gap:6px"><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-mft-edit="${t.id}">編集</button><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-mft-del="${t.id}" data-mft-label="${esc(t.label)}">削除</button></div>
    </div>`;
    // 編集中の項目の直後に編集フォームの差込先を用意（2026-09-02: ユーザー報告「編集画面が一番下に
    // 出るので、その項目のすぐ下に出してほしい」に対応。新規追加時はediting.idがnullなので一覧の外＝
    // mftRenderBox()側の固定位置に出す）
    return row+((ed&&ed.id===t.id)?`<div id="mft-editor" style="margin:8px 0 14px"></div>`:"");
  }).join("");
}
function mftOpenEditor(tpl){
  // 古い仕訳辞書（借方・貸方が共通amountを持つ形式）・新しい仕訳辞書（辺ごとにvalueを持つ形式）の両方に対応

    sourceFilter: tpl?(tpl.source_filter||[]):[],
    plAccount: tpl?(tpl.pl_account||""):"",
    adTarget: tpl?!!tpl.ad_target:false,
    settlementTarget: tpl?!!tpl.settlement_target:false,
    paymentMethod: tpl?(tpl.payment_method||"bank_transfer"):"bank_transfer",
    autoApply: tpl?!!tpl.auto_apply:false,
    requireHumanReview: tpl?(tpl.require_human_review!==false):true,
    priority: tpl?(tpl.priority??100):100,
    branches: tpl?(tpl.branches||[]).map(b=>({
      debitLabel:mftLabelOf(b.debit), debitAmount:b.debit?(b.debit.value??b.amount??""):"",

      department_id:b.department_id||"", tax_id:b.tax_id||"",
      credit_department_id:b.credit_department_id||"", credit_tax_id:b.credit_tax_id||"",

  const el=$("mft-editor");
  if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
}

function mftBranchRowHtml(br,idx){
  const deptOptions=`<option value="">（指定なし）</option>`+(MFT_STATE.departments||[]).map(d=>`<option value="${esc(d.id)}" ${br.department_id===d.id?"selected":""}>${esc(d.name)}</option>`).join("");
  const creditDeptOptions=`<option value="">（指定なし）</option>`+(MFT_STATE.departments||[]).map(d=>`<option value="${esc(d.id)}" ${br.credit_department_id===d.id?"selected":""}>${esc(d.name)}</option>`).join("");
  // 税区分（2026-09-02追加）: taxes.readスコープでの再認可がまだの事業者はMFT_STATE.taxesが
  // 空になるため、その場合はプルダウンの代わりに案内文を出す
  const taxCell=(MFT_STATE.taxes&&MFT_STATE.taxes.length)
    ?`<select class="mft-tax" data-idx="${idx}"><option value="">（既定）</option>${MFT_STATE.taxes.map(t=>`<option value="${esc(t.id)}" ${br.tax_id===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>`
    :`<div style="font-size:10px;color:var(--muted)">未連携</div>`;
  const creditTaxCell=(MFT_STATE.taxes&&MFT_STATE.taxes.length)
    ?`<select class="mft-credit-tax" data-idx="${idx}"><option value="">（既定）</option>${MFT_STATE.taxes.map(t=>`<option value="${esc(t.id)}" ${br.credit_tax_id===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>`
    :`<div style="font-size:10px;color:var(--muted)">未連携</div>`;
  const accInput=side=>{
    const {account,sub}=splitAccLabel(side==="debit"?br.debitLabel:br.creditLabel);
    const subDlId=`mft-subaccount-datalist-${idx}-${side}`;
    return `<div class="pet-acc-group">
      <input list="mft-account-datalist" class="pet-acc-main mft-accmain" data-idx="${idx}" data-side="${side}" value="${esc(account)}" placeholder="${side==="debit"?"借方":"貸方"}勘定科目（空欄可）">
      <input list="${subDlId}" class="pet-acc-sub mft-accsub" data-idx="${idx}" data-side="${side}" value="${esc(sub)}" placeholder="補助科目（任意）">
      <datalist id="${subDlId}">${mftSubAccountOptionsHtml(account)}</datalist>
    </div>`;
  };
  return `<tr data-idx="${idx}">
    <td class="pet-ins"><button type="button" data-mftins="${idx}" title="この下に行を追加">＋</button></td>
    <td>${accInput("debit")}</td>
    <td><select class="mft-dept" data-idx="${idx}">${deptOptions}</select></td>
    <td>${taxCell}</td>
    <td><input type="number" class="pet-amt mft-debit-amount" data-idx="${idx}" value="${br.debitAmount??""}" placeholder="任意"></td>
    <td>${accInput("credit")}</td>
    <td><select class="mft-credit-dept" data-idx="${idx}">${creditDeptOptions}</select></td>
    <td>${creditTaxCell}</td>
    <td><input type="number" class="pet-amt mft-credit-amount" data-idx="${idx}" value="${br.creditAmount??""}" placeholder="任意"></td>
    <td><input class="pet-remark mft-remark" data-idx="${idx}" value="${esc(br.remark||"")}"></td>
    <td><select class="mft-purpose" data-idx="${idx}">
      <option value="" ${!br.purpose?"selected":""}>（手入力のまま）</option>
      <option value="base_salary" ${br.purpose==="base_salary"?"selected":""}>基本給・固定給</option>
      <option value="commute" ${br.purpose==="commute"?"selected":""}>通勤手当</option>
      <option value="deduction" ${br.purpose==="deduction"?"selected":""}>控除・預り金</option>
      <option value="net_pay" ${br.purpose==="net_pay"?"selected":""}>差引支給額</option>
    </select></td>
    <td class="pet-rm">${MFT_STATE.editing.branches.length>1?`<button data-mftrm="${idx}" title="この行を削除">✕</button>`:""}</td>
  </tr>`;
}

async function mftSaveEditor(){
  const ed=MFT_STATE.editing;
  const label=$("mft-label").value.trim();
  if(!label){ alert("名前を入力してください"); return; }
  const structured=[];
  for(const b of ed.branches){
    const debit=b.debitLabel?MFT_STATE.accountLabelMap.get(b.debitLabel):null;
    const credit=b.creditLabel?MFT_STATE.accountLabelMap.get(b.creditLabel):null;
    if(b.debitLabel&&!debit){ alert("借方はプルダウンの候補から選んでください"); return; }
    if(b.creditLabel&&!credit){ alert("貸方はプルダウンの候補から選んでください"); return; }
    if(!debit&&!credit) continue;
    structured.push({
      debit:debit?{...debit,value:Number(b.debitAmount)||null}:null,
      credit:credit?{...credit,value:Number(b.creditAmount)||null}:null,
      department_id:b.department_id||null, department_name:(MFT_STATE.departments.find(d=>d.id===b.department_id)||{}).name||null,
      tax_id:b.tax_id||null, tax_name:(MFT_STATE.taxes.find(t=>t.id===b.tax_id)||{}).name||null,
      credit_department_id:b.credit_department_id||null, credit_department_name:(MFT_STATE.departments.find(d=>d.id===b.credit_department_id)||{}).name||null,
      credit_tax_id:b.credit_tax_id||null, credit_tax_name:(MFT_STATE.taxes.find(t=>t.id===b.credit_tax_id)||{}).name||null,
      remark:b.remark||null, purpose:b.purpose||null,
    });
  }
  if(!structured.length){ alert("明細行がありません"); return; }
  $("mft-save").disabled=true;
  const splitList=s=>String(s||"").split(/[、,]/).map(x=>x.trim()).filter(Boolean);
  const payload={
    tenant_id:MFT_STATE.activeTenantId, label, branches:structured,
    vendor_id: ed.vendorId||null,
    match_keywords: splitList(ed.matchKeywords),
    match_from_addresses: splitList(ed.matchFromAddresses),
    target_corporation_id: ed.targetCorporationId||null,
    target_store_id: ed.targetStoreId||null,
    amount_min: ed.amountMin===""?null:Number(ed.amountMin),
    amount_max: ed.amountMax===""?null:Number(ed.amountMax),
    source_filter: ed.sourceFilter,
    pl_account: ed.plAccount||null,
    ad_target: ed.adTarget,
    settlement_target: ed.settlementTarget,
    payment_method: ed.paymentMethod,
    auto_apply: ed.autoApply,
    require_human_review: ed.requireHumanReview,
    priority: Number(ed.priority)||100,
  };
  const r=ed.id
    ?await authed(`/rest/v1/mf_journal_templates?id=eq.${ed.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({...payload,updated_at:new Date().toISOString()})})
    :await authed("/rest/v1/mf_journal_templates",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({...payload,created_by:ME.id})});
  if(!r.ok){ if($("mft-save")) $("mft-save").disabled=false; alert("保存に失敗しました"); return; }
  renderMftSection(MFT_STATE.activeTenantId);
}

/* ============================================================
   会計ダッシュボード（2026-09-04・確定UI版に全面置換）
   指示書「N-Style 会計ダッシュボード 確定UIへの実装指示書」対応。
   旧「月別処理一覧」中心のUI（DASH_STATE.rowFilter等・dashLoadMonthlyList/dashMonthlyListHtml、
   給与仕訳・インフォマートのクイックリンクカード）は全て削除し、確定UI（今日やること／今月の
   処理状況／今月の処理進捗／今月の支払状況／支払予定／要対応の内訳／最近の処理）に置き換えた。
   新しい別テーブル・別集計基盤は作らず、既存のinvoices（+要対応判定unifiedAttentionReasons・
   振込状態unifiedPaymentStageLabel）をこの画面用に集計するだけのView（指示書§4・§39-40）。
   日付基準は🧾請求書一覧と統一：支払期限(due_date)があればそちら、無ければ取込日(created_at)
   （invoicesのスキーマには請求日・計上日という独立列が無いため。指示書§28への回答）
   ============================================================ */
let DASH_STATE={corpId:"", yearMonth:"", allRows:null, error:null};
function dashYmDefault(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function dashDateBasis(r){ return r.due_date||r.created_at; }
function dashYmCandidates(rows){
  const set=new Set([dashYmDefault()]);
  rows.forEach(r=>{ const d=dashDateBasis(r); if(d) set.add(String(d).slice(0,7)); });
  return [...set].sort().reverse();
}
function dashScopedRows(allRows){
  let rows=allRows;
  if(DASH_STATE.corpId) rows=rows.filter(r=>r.corporation_id===DASH_STATE.corpId);
  if(DASH_STATE.yearMonth) rows=rows.filter(r=>{ const d=dashDateBasis(r); return d&&String(d).slice(0,7)===DASH_STATE.yearMonth; });
  return rows;
}
function dashAttentionCounts(rows){
  const map={};
  rows.forEach(r=>unifiedAttentionReasons(r).forEach(reason=>{ map[reason]=(map[reason]||0)+1; }));
  return map;
}
async function renderAccountingDashboardTab(u){

  const [r]=await Promise.all([
    authed(`/rest/v1/invoices?select=*,email:invoice_emails(mail_kind),corp:corporations(name),store:stores!invoices_store_id_fkey(name),invoice_stores(store:stores(name)),vendor:vendors(name)&order=created_at.desc&limit=1000`),
    ensureCorpStoreCache(),
  ]);
  if(!r.ok){
    DASH_STATE.error="取得に失敗しました";
    $("tabbody").innerHTML=`<section class="invoice-list active"><div class="card" style="padding:16px"><div class="err">データの取得に失敗しました。時間をおいて再度お試しください。</div></div></section>`;

function uploadFileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{ const s=String(reader.result||""); resolve(s.substring(s.indexOf(",")+1)); };
    reader.onerror=()=>reject(new Error("ファイルの読み込みに失敗しました"));
    reader.readAsDataURL(file);
  });
}
function wireUploadInvoiceTab(u){
  if($("upload-open-history")) $("upload-open-history").onclick=()=>{ TAB="history"; pushNav(); renderTabBody(u); };
  const drop=$("up-drop");
  const renderFileList=()=>{
    $("up-filelist").innerHTML=UPLOAD_STATE.files.length
      ? UPLOAD_STATE.files.map((f,i)=>`<div>📎 ${esc(f.name)} <button data-rmfile="${i}" style="margin-left:6px;font-size:11px">✕ 外す</button></div>`).join("")
      : "";
    document.querySelectorAll("[data-rmfile]").forEach(el=>el.onclick=()=>{ UPLOAD_STATE.files.splice(+el.dataset.rmfile,1); renderFileList(); });
  };
  const addFiles=(fileList)=>{ for(const f of fileList) UPLOAD_STATE.files.push(f); renderFileList(); };
  $("up-file").onchange=e=>addFiles(e.target.files);
  ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background="var(--m-bg,#f4f1eb)"; drop.style.borderColor="var(--accent)"; }));
  ["dragleave","dragend"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background=""; drop.style.borderColor=""; }));
  drop.addEventListener("drop",e=>{
    e.preventDefault(); drop.style.background=""; drop.style.borderColor="";
    if(e.dataTransfer.files&&e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  });
  $("up-submit").onclick=async()=>{
    // 2026-09-05修正：ユーザー報告「再試行してもエラーメッセージも何も表示されない」に対応。
    // 実データ確認の結果、再試行時にサーバー側（invoices・mf_sync_logs）に一切新しい記録が
    // 無く、リクエストが送信される前にクライアント側で処理が止まっていたと判明。
    // 従来はtry節の外側（ファイル未選択チェック・ボタン無効化）で例外が起きると画面に何も
    // 表示されず、また成功時にボタンの無効化を戻していなかったため、何らかの理由で処理が
    // 一度でも詰まるとボタンが無効のまま二度と反応しなくなる可能性があった。
    // ここから下を丸ごとtry/catch/finallyで囲み、どんな失敗でも必ず画面に表示され、
    // ボタンも必ず再び押せる状態に戻るようにする
    const msg=$("up-msg");
    const btn=$("up-submit");
    try{
      if(!UPLOAD_STATE.files.length){ msg.className="err"; msg.textContent="ファイルを選択してください"; return; }
      btn.disabled=true; msg.className="err"; msg.textContent="取込中…";
      console.log("[アップロード請求書] 取込開始",{files:UPLOAD_STATE.files.map(f=>({name:f.name,size:f.size,type:f.type}))});
      // 2026-09-06修正：請求書処理の速度改善指示への対応。複数ファイルのbase64変換
      // （ローカルのFileReader処理・ネットワーク通信ではないが互いに独立）を直列forループ
      // ではなくPromise.allで並列化。ファイル選択順（file_name表示等）は維持される
      const voucherFiles=await Promise.all(UPLOAD_STATE.files.map(async f=>({file_name:f.name, file_data:await uploadFileToBase64(f)})));
      const payload={
        vendor_name:$("up-vendor").value.trim()||null,
        corporation_id:$("up-corp").value||null,
        store_id:$("up-store").value||null,
        voucher_files:voucherFiles,
      };
      const {ok,body:j}=await perfTimed("invoice_intake_upload",()=>mfCall("intake_upload",payload));
      console.log("[アップロード請求書] intake_upload応答",{ok,body:j});
      if(!ok){ msg.textContent=(j&&j.error)||"取込に失敗しました（サーバーからの応答が異常です）"; return; }
      // 2026-09-05修正：ユーザー報告「アップロード請求書のPDFプレビューが出ない」に対応。
      // 従来は証憑の保存に失敗しても気付けなかったため、失敗があればここで明示する
      if(j.attach_errors&&j.attach_errors.length){
        msg.className="err";
        msg.textContent=`請求書は取り込みましたが、証憑ファイルの保存に失敗しました：${j.attach_errors.map(e=>`${e.file_name}（${e.error}）`).join("、")}。お手数ですが、開いた請求書詳細の「証憑プレビュー」からファイルを追加し直してください。`;
      }else{
        msg.className="err msg-ok"; msg.textContent="取り込みました。続けて請求書一覧を開きます…";
      }
      // 新規取込時のみ自動判定を実行（iv-saveの新規保存時と同じ流儀）。完了を待たずに進める
      if(j.invoice_id){
        const newId=j.invoice_id;
        fireInvoiceEvent(newId,"invoice_created").catch(()=>{});
        autoMatchCall({invoice_id:newId}).then(({ok:ok2,body:mj})=>{
          if(ok2&&mj&&mj.ai_match_status&&mj.ai_match_status!=="review"&&mj.ai_match_status!=="error"&&!mj.bank_account_change_detected&&!mj.duplicate_suspected){
            fireInvoiceEvent(newId,"invoice_review_completed").catch(()=>{});
          }
        }).catch(()=>{});
      }
      // 2026-09-06修正：請求書処理の速度改善指示への対応。従来600msの一律待ちを入れていたが
      // （メッセージを一瞬見せるためだけの演出的な待ち時間）、体感速度を優先し300msに短縮
      setTimeout(async()=>{
        TAB="unified"; await renderTabBody(u);
        if(j.invoice_id) await openInvoiceDetail(u,j.invoice_id);
      },300);
    }catch(e){
      console.error("[アップロード請求書] 取込中に例外",e);
      msg.className="err"; msg.textContent="取込中にエラーが発生しました: "+(e&&e.message?e.message:String(e));
    }finally{
      btn.disabled=false;
    }
  };
  document.querySelectorAll("[data-open-invoice]").forEach(el=>el.onclick=()=>openInvoiceDetail(u,el.dataset.openInvoice));
}

let PAYROLL_STATE={};
// 2026-09-09新設：ユーザー報告「給料確定タスクの会社名がN-Styleになっているが実際はトーホー」
// （担当EがDBで実データを確認しWORKLOGで申し送り）に対応。給料確定ボタンでhq_create_payroll_tasksを
// 呼ぶ前に、実際に振込・現金手渡し対象になる従業員の所属店舗→法人を調べ、正しい法人名を
// 自動判定する。振込対象はpayroll_bank_accounts（現金以外）、現金手渡し対象は既存の
// cash_handoff_targets RPC（nippo「現金手渡し・サイン」と同じ判定基準）をそのまま使う。
// 対象者が複数法人にまたがる場合は呼び出し元でユーザーに確認してもらう想定のため、
// 見つかった法人名の一覧（重複無し）と、所属店舗が特定できなかった人数を返すだけに留める
async function payrollDetermineTargetCorp(yearMonth){
  await ensureCorpStoreCache();
  const storeCorpName=storeId=>{
    const store=(CORP_STORE_CACHE.stores||[]).find(s=>s.id===storeId);
    if(!store) return null;
    const corp=(CORP_STORE_CACHE.corporations||[]).find(c=>c.id===store.corporation_id);
    return corp?corp.name:null;
  };
  const [bankR,cashR]=await Promise.all([
    authed(`/rest/v1/payroll_bank_accounts?payment_method=neq.cash&select=user_id,user:users!inner(is_active,user_stores(is_primary,store_id))`),
    authed("/rest/v1/rpc/cash_handoff_targets",{method:"POST",body:JSON.stringify({p_year_month:yearMonth})}),
  ]);
  const corpNames=new Set();
  let unresolved=0;
  if(bankR.ok&&Array.isArray(bankR.body)){
    for(const row of bankR.body){
      if(!row.user||!row.user.is_active) continue;
      const stores=row.user.user_stores||[];
      const primary=stores.find(s=>s.is_primary)||stores[0];
      const name=primary?storeCorpName(primary.store_id):null;
      if(name) corpNames.add(name); else unresolved++;
    }
  }
  if(cashR.ok&&Array.isArray(cashR.body)){
    for(const t of cashR.body){
      if(!t.is_active) continue;
      const name=t.store_id?storeCorpName(t.store_id):null;
      if(name) corpNames.add(name); else unresolved++;
    }
  }
  return {corpNames:[...corpNames],unresolved};
}

  // 給与データの取得に失敗した場合（トークン更新タイミング等による一時的な失敗を想定）、少し待って
  // 1回だけ自動で再試行する。ユーザー報告「タブを開き直すとKPIが0にリセットされて見づらい」対策
  if(!(syncR.ok&&Array.isArray(syncR.body))){

  const syncOk=syncR.ok&&Array.isArray(syncR.body);

  PAYROLL_STATE.records=(recR.ok&&Array.isArray(recR.body))?recR.body:[];

  PAYROLL_STATE.transferScheduledDate=(scheduleR.ok&&Array.isArray(scheduleR.body)&&scheduleR.body[0])?scheduleR.body[0].scheduled_date:null;
  {

    const {map,dl}=mftBuildAccountIndex(accountsRaw);
    PAYROLL_STATE.accountLabelMap=map; PAYROLL_STATE.accountDatalistHtml=dl;
    // 2026-09-07：担当Bスレッド経由のユーザー要望「勘定科目と補助科目を、マネーフォワード会計と
    // 同じように別々の入力欄にしてほしい（今は「雑給/04/恵比寿」のように1つに連結されている）」に

    // 2026-09-07追記：ユーザー報告「マネーフォワードのように、補助科目は選んだ勘定科目で

    PAYROLL_STATE.subAccountNamesAll=[...subNamesAll];
  }
  if(!PAYROLL_STATE.stores){
    // 2026-09-09追加：ユーザー要望「AI判定の事業所名と会計の部門名が一致しない店舗を登録して

// バケットへ{userId}/{yearMonth}.pdf・{yearMonth}_2.pdf・{yearMonth}_3.pdf...という連番規約で
// 複数枚保存できるようになっている（1枚目は既存の固定パスのまま後方互換）。従来この画面は
// 1枚目の固定パスしか見ておらず、2枚目以降の存在確認・取得・添付・削除ができなかった。
// storage.list(prefix:'{userId}/')でその従業員の全ファイルを取得し、正規表現で対象月の
// ファイル（本体＋連番）だけを絞り込む共通ヘルパーに一本化した
async function payrollListPdfFiles(userId,yearMonth){
  const s=sess.get();
  const r=await fetch(`${SUPA_URL}/storage/v1/object/list/payroll-pdfs`,{
    method:"POST",
    headers:{apikey:SUPA_KEY,Authorization:"Bearer "+(s?s.at:""),"Content-Type":"application/json"},
    body:JSON.stringify({prefix:`${userId}/`,limit:100}),
  });
  if(!r.ok) return [];
  const list=await r.json().catch(()=>[]);
  if(!Array.isArray(list)) return [];
  const re=new RegExp(`^${yearMonth.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}(?:_(\\d+))?\\.pdf$`);
  return list.filter(x=>re.test(x.name)).sort((a,b)=>{
    const na=Number((a.name.match(re)||[])[1]||1), nb=Number((b.name.match(re)||[])[1]||1);
    return na-nb;
  }).map(x=>x.name);
}

// bytes(Uint8Array)→base64（複数ファイル対応のため共通化。2026-09-07）
function bytesToBase64_(bytes){
  let binary=""; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  return btoa(binary);
}
// payroll-pdfsから指定ファイル名のPDFをbase64で取得（無ければnull）。fileNameを省略すると
// 従来どおり1枚目固定パス（{yearMonth}.pdf）を見る＝既存呼び出し元との後方互換
async function payrollFetchPdfBase64(userId,yearMonth,fileName){
  const s=sess.get();
  const r=await fetch(`${SUPA_URL}/storage/v1/object/payroll-pdfs/${userId}/${fileName||`${yearMonth}.pdf`}`,{
    headers:{apikey:SUPA_KEY,Authorization:"Bearer "+(s?s.at:"")},
  });
  if(!r.ok) return null;
  const buf=await r.arrayBuffer();
  return bytesToBase64_(new Uint8Array(buf));
}

// 仕訳登録時の証憑添付・AI読み取り（複数枚を1回のAI呼び出しでまとめて読ませる）の両方で使う
async function payrollFetchAllPdfBase64(userId,yearMonth){
  const fileNames=await payrollListPdfFiles(userId,yearMonth);

// base64のPDFデータをその場で開ける一時URL（Blob URL）に変換する（2026-09-02追加。
// ユーザー要望「PDFをここから開けるように・プレビューでも内容を見れるように」に対応。
// 署名付きURLを毎回サーバーへ取りに行く必要がなく、既に取得済みのbase64データをそのまま使い回せる）
function base64ToBytes(base64){
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}
function payrollPdfBlobUrl(base64){
  return URL.createObjectURL(new Blob([base64ToBytes(base64)],{type:"application/pdf"}));
}

// 事業所ごとに明細が分かれている従業員でも全ファイルを通して1回で集計できるようにした
async function payrollExtractStoreBreakdown(pdfFiles){
  const s=sess.get();
  let r;
  try{
    r=await fetch(`${SUPA_URL}/functions/v1/payroll-pdf-ocr`,{
      method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+(s?s.at:""),"Content-Type":"application/json"},

    });
  }catch(e){
    return {ok:false,error:"AI読み取りサービスへの接続に失敗しました"};
  }
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.success) return {ok:false,error:j.error||"読み取りに失敗しました"};

  if(!stores.length) return {ok:false,error:j.note||"勤務詳細の表が見つかりませんでした"};
  return {ok:true,totals:stores.map(st=>({store:st.store_name,amount:Number(st.amount_total)||0,commute:Number(st.commute_total)||0,count:Number(st.days_count)||0})),note:j.note};
}

// PDFファイル名から従業員を推定（氏名の空白除去・部分一致。完全な自動判定はせず、必ず人が確認・修正できる形で使う）
// PDFファイル名から従業員を推定（2026-09-02: ユーザー報告「スペースが入ったりしていて完全一致しない
// と推定されない」に対応し2段階に強化）。①区切り文字（半角/全角スペースに加えハイフン・アンダー
// スコア・中黒・ドットも除去）を取り除いた上での部分一致②それでも見つからなければ、氏名を姓・名に
// 分割し、それぞれの部分が（区切り文字の有無を問わず）ファイル名に全部含まれていれば一致とみなす
// （姓名の間に別の文字が挟まっている・順序が姓名逆等のケースに対応）
function payrollGuessEmployeeByFilename(filename){
  const stripSep=s=>String(s||"").replace(/[\s　\-_・.]/g,"");
  const n=stripSep(filename);
  let hit=(PAYROLL_STATE.rows||[]).find(r=>{
    const name=stripSep(r.user&&r.user.name);
    return name&&n.includes(name);
  });
  if(hit) return hit;
  hit=(PAYROLL_STATE.rows||[]).find(r=>{
    const parts=String((r.user&&r.user.name)||"").split(/[\s　]+/).filter(Boolean).map(stripSep).filter(Boolean);
    return parts.length>=2&&parts.every(p=>n.includes(p));
  });
  return hit||null;
}
function payrollAssignmentFor(userId){ return PAYROLL_STATE.assignments.find(a=>a.user_id===userId); }
function payrollRecordFor(userId){ return PAYROLL_STATE.records.find(r=>r.user_id===userId); }
function payrollDraftFor(userId){ return (PAYROLL_STATE.drafts||[]).find(d=>d.user_id===userId); }
function payrollFindDeptForUser(userId){
  const alloc=(PAYROLL_STATE.allocations||[]).find(a=>a.user_id===userId&&a.store_id);
  if(!alloc) return null;
  const store=PAYROLL_STATE.stores.find(s=>s.id===alloc.store_id);
  if(!store) return null;
  const norm=s=>String(s||"").replace(/\s+/g,"");
  const n=norm(store.name);
  const dept=PAYROLL_STATE.departments.find(d=>norm(d.name)===n) || PAYROLL_STATE.departments.find(d=>n.includes(norm(d.name))||norm(d.name).includes(n));
  return dept||null;
}
// テンプレートの各行に「給与仕訳での用途」タグが付いていれば、その行の金額を実際の給与データへ
// 差し替える（付いていなければテンプレートの固定金額のまま＝0円の行は除外）
// 2026-08-31: テンプレートの行が借方・貸方どちらか片方だけでもよくなったため、金額もそれぞれ独立して
// 実データに置き換える（用途タグが付いた側だけを置き換え、付いていない側は元の固定値のまま）
function payrollComputeBranches(row,template){
  const dept=payrollFindDeptForUser(row.user_id);
  const amountFor=purpose=>{
    if(purpose==="base_salary") return Math.round(Number(row.fixed_salary_amount)||0);
    if(purpose==="commute") return Math.round(Number(row.commute_allowance)||0);
    if(purpose==="deduction") return Math.round(Number(row.deduction_total)||0);
    if(purpose==="net_pay") return Math.round(Number(row.net_pay)||0);
    return null;
  };
  // 2026-09-07修正：ユーザー報告「給与仕訳で会計登録しようとすると『金額が計算できませんでした
  // （給与データを確認してください）』と出て登録が一切できない」の根本原因を特定。
  // 実データを確認したところ、mf_journal_templates（仕訳辞書）は現在46件すべて（給与仕訳の
  // テンプレートも例外なく全件）でbranches[].purposeが未設定（null）だった。設定タブの
  // 仕訳辞書エディタには各行の用途（基本給・通勤手当・控除・差引支給額）を選ぶ「mft-purpose」
  // 欄が存在するが、実際にはどのテンプレートでも一度も設定されたことが無かった（payroll_journal_
  // recordsが1件も無い＝この機能で給与仕訳が登録できたことがこれまで一度も無かったことも確認済み）。
  // purposeが無いとamountFor()がnullを返し、フォールバック先のbranches[].value（テンプレート側の
  // 固定金額）もほぼ全件nullのため、debitAmount/creditAmountが軒並み0になり、下のfilterで
  // 全行が消えてbranches.length===0→呼び出し元のalert()で完全にブロックされていた。
  // 【方針】purposeが設定されている行（今後、仕訳辞書エディタで正しく設定されれば）は従来どおり
  // 「計算結果が0円ならその行は出さない」を維持する（本来の自動計算の挙動は変えない）。
  // purposeが未設定の行（＝現状ほぼ全行）は、口座・部門・摘要などテンプレートの情報は活かしつつ
  // 金額だけ0円で残し、プレビュー画面で手入力できるようにする（今まで消えて何も編集できず
  // 完全にブロックされていたのを、少なくとも手入力で会計登録を進められる状態にする）
  // 2026-09-08追加：担当Bスレッドから受領した要望「摘要を『○月分 基本給 氏名』のように行ごとに
  // 自動入力したい」＋技術メモ（()を含む文字列テンプレートの置換は、氏名や既存の摘要に偶然()が
  // 含まれた場合に誤爆する恐れがあるため非推奨・行を生成する時点でJSのテンプレートリテラルで
  // 直接組み立てて実際の値として設定すべき、との提案）に対応。
  // 仕訳辞書（mf_journal_templates）の各行のremarkは、実データを確認したところ「月　基本給」
  // 「月　交通費」「月　所得税」「月　振込金額」のように「月」＋区切り＋ラベルという固定書式で
  // 保存されており、月の数字・従業員名はそもそも含まれていなかった（ユーザー報告の「月の数字が
  // 抜けている」は、この固定書式をテンプレートに保存した時点からそうだった、というのが実体）。
  // この書式に一致する行だけ「月」の部分を実際の対象月の数字に、末尾に従業員名を追加して
  // 組み立て直す（一致しない自由記述の摘要はそのまま尊重して変更しない）
  const employeeName=(row.user&&row.user.name)||"";
  const monthNum=Number((PAYROLL_STATE.yearMonth||"").split("-")[1])||null;
  const buildRemark=rawRemark=>{
    if(!rawRemark) return rawRemark;
    const m=String(rawRemark).match(/^月[\s　]*(.*)$/);
    if(!m) return rawRemark; // 「月」から始まらない自由記述の摘要はそのまま
    const label=m[1];
    return [monthNum?`${monthNum}月`:"月",label,employeeName].filter(Boolean).join("　");
  };
  return (template.branches||[]).map(b=>{
    const overridden=amountFor(b.purpose);
    const useDept=(b.purpose==="base_salary"||b.purpose==="commute")&&dept?dept.id:(b.department_id||null);
    const debitAmount=b.debit?(overridden!=null?overridden:(b.debit.value??b.amount??0)):null;
    const creditAmount=b.credit?(overridden!=null?overridden:(b.credit.value??b.amount??0)):null;
    return {debit:b.debit||null,credit:b.credit||null,debitAmount,creditAmount,department_id:useDept,tax_id:b.tax_id||null,credit_department_id:b.credit_department_id||null,credit_tax_id:b.credit_tax_id||null,purpose:b.purpose||null,remark:buildRemark(b.remark)};
  }).filter(b=>b.purpose?((b.debit&&b.debitAmount>0)||(b.credit&&b.creditAmount>0)):(b.debit||b.credit));
}

/* ----------------------------------------------------------
   2026-09-07新規：給与仕訳のAI自動生成（担当BスレッドWORKLOG f604e2f の6項目仕様への対応）
   -----------------------------------------------------------
   方針（ユーザー・担当Bへの説明どおり）: PDFの「支給テーブル」「控除テーブル」自体はAIで
   再読み取りしない。担当Bが「スマレジAPI自身のnetPayとの一致を全件検証済み」と明言している
   sf_payroll_sync（total_allowance/deduction_total/net_pay/deductions）を正として使う。
   AIでのPDF読み取りは、sf_payroll_syncには無い「事業所ごとの内訳」（PDF下部の勤務詳細表でしか
   分からない情報）にのみ使う。
   検算がOK（丸め差1円以内）の場合だけ、確認画面を出したうえで人が「反映する」を押して初めて
   branches配列を書き換える（自動確定はしない＝deptMismatchWarnHtmlと同じ「警告はするが
   勝手に金額を変えない」方針を踏襲）
   ---------------------------------------------------------- */
// 事業所名（AI読み取り結果）→ stores→departmentsの2段階でMF部門へ寄せる。
// payrollFindDeptForUser()と同じ「空白除去して部分一致」の正規化方式に合わせてある
function payrollMatchStoreRecord(storeName){
  const norm=s=>String(s||"").replace(/\s+/g,"");
  const n=norm(storeName);
  if(!n) return null;
  const byName=(PAYROLL_STATE.stores||[]).find(s=>norm(s.name)===n)
    || (PAYROLL_STATE.stores||[]).find(s=>n.includes(norm(s.name))||norm(s.name).includes(n));
  if(byName) return byName;
  // 2026-09-09追加：ユーザー報告「まだできない」で発覚。給与明細PDFの事業所名が店舗の正式名
  // ではなく2枚看板の別ブランド名（例:「匠味 新横浜」＝実店舗は「鶏武者 新横浜」）で書かれて
  // いる場合、店舗名同士の一致では原理的に見つからない。広告費・予約データで既に使われている
  // store_aliasesテーブル（担当G実装済み）を使い、別名からも店舗を特定できるようにする
  const aliases=PAYROLL_STATE.storeAliases||[];
  const aliasHit=aliases.find(a=>norm(a.alias)===n) || aliases.find(a=>n.includes(norm(a.alias))||norm(a.alias).includes(n));
  if(aliasHit) return (PAYROLL_STATE.stores||[]).find(s=>s.id===aliasHit.store_id)||null;
  return null;
}
function payrollMatchDeptByStoreName(storeName){
  const norm=s=>String(s||"").replace(/\s+/g,"").replace(/^\d+/,"");
  const n=norm(storeName);
  if(!n) return null;
  const store=payrollMatchStoreRecord(storeName);
  // 2026-09-09追加：ユーザー要望「AI判定の事業所名と会計の部門名が一致しない場合、その店舗を
  // 登録しておけば次回から同じ店舗と認識して反映されるようにしてほしい」に対応。
  // 例: PDFの事業所名「黒霧屋　新横浜」に対し、MF部門名は「06新横浜黒霧屋」（語順が逆）で、
  // 単純な部分一致では引っかからなかった。設定タブ「法人・店舗・部門マッピング」で店舗ごとに
  // 手動登録できるstores.mf_department_name（従来は他用途向けで、ここでは未参照だった）を
  // 最優先で見る。ここで見つかれば、語順が違う・略称が違う等どんな表記ゆれでも確実に一致する
  if(store&&store.mf_department_name){
    const mn=norm(store.mf_department_name);
    const dept=(PAYROLL_STATE.departments||[]).find(d=>norm(d.name)===mn);
    if(dept) return dept;
  }
  if(store){
    const sn=norm(store.name);
    const dept=(PAYROLL_STATE.departments||[]).find(d=>norm(d.name)===sn)
      || (PAYROLL_STATE.departments||[]).find(d=>sn.includes(norm(d.name))||norm(d.name).includes(sn));
    if(dept) return dept;
  }
  // storesテーブル経由で見つからない場合でも、部門名に直接含まれていれば拾えるようフォールバック
  return (PAYROLL_STATE.departments||[]).find(d=>{ const dn=norm(d.name); return dn&&(n.includes(dn)||dn.includes(n)); }) || null;
}
// テンプレート由来のbranches配列から「給料」「交通費」に該当する借方行を1つ探す。
// 仕訳辞書エディタでpurposeが設定されていればそれを優先し、無ければ勘定科目名のキーワードで推定する
// （現状ほぼ全テンプレートでpurpose未設定のため、実質キーワード推定が使われる）
// 2026-09-07修正：ユーザー報告「一時保存の下書きから再開した状態でAI自動生成を押すと
// 『給料に該当する借方科目が見つからない』と出る（実際には「雑給」等の科目が入っているのに）」の
// 原因を特定。一時保存の下書きは、保存時にb.debit/b.credit（解決済みのMF勘定科目オブジェクト）を
// あえて含めていない（`payrollPreviewSaveDraft`のコメント参照）ため、下書きから再開した直後は
// 全行のb.debit/b.creditがundefinedのまま（登録直前に初めてdebitLabel/creditLabelの文字列から
// 再解決される設計）。この関数がb.debitの真偽値をチェックしていたため、下書き再開後は常に
// 「1件も見つからない」扱いになっていた。b.debitではなくdebitLabel（文字列。テンプレートからの
// 初回描画時・下書き読み込み時のどちらでも必ず設定される）の有無で判定するよう修正した
function payrollFindBranchIndexByKind(branches,kind){
  const purposeKey=kind;
  let idx=branches.findIndex(b=>b.purpose===purposeKey&&(b.debitLabel||"").trim());
  if(idx>=0) return idx;
  const re=kind==="base_salary"?/給料|給与|基本給|雑給|賃金/:/旅費交通費|通勤手当|交通費/;
  return branches.findIndex(b=>(b.debitLabel||"").trim()&&re.test(b.debitLabel||""));
}
// sf_payroll_sync.deductions（控除内訳jsonb配列）のlabel文字列を、既存の貸方科目に振り分けるための
// キーワード分類。分類しきれない項目は「その他控除」に該当する科目があればそこへ、無ければ未マッチ扱い
const PAYROLL_DEDUCTION_CATS=[
  {key:"income_tax",label:"所得税",re:/所得税/},
  {key:"resident_tax",label:"住民税",re:/住民税/},
  {key:"social_insurance",label:"社会保険料",re:/社会保険|健康保険|厚生年金|介護保険/},
  {key:"employment_insurance",label:"雇用保険",re:/雇用保険/},
  {key:"other",label:"その他控除",re:/その他控除|控除/},
];
const PAYROLL_NETPAY_RE=/未払金|差引支給|普通預金|振込/;
// 検算・自動生成プランを組み立てる（実際にbranchesは書き換えない。判定結果だけを返す純粋関数）
function payrollBuildAutoJournalPlan(row,branches,storeTotals){
  const warnings=[];
  // 2026-09-07：ここで見つけた行はオブジェクト参照として保持する（indexではない）。検算結果の
  // 確認画面から実際に「反映する」を押すまでの間に、ユーザーが手動で行を追加・削除した場合でも
  // インデックスのズレで誤った行を書き換えてしまわないようにするため
  const salaryIdxTmp=payrollFindBranchIndexByKind(branches,"base_salary");
  if(salaryIdxTmp<0){
    return {ok:false,reason:"仕訳辞書（テンプレート）に「給料」に該当する借方科目が見つかりませんでした。設定タブでご確認ください",stores:[],warnings};
  }
  const salaryBranch=branches[salaryIdxTmp];
  const commuteIdxTmp=payrollFindBranchIndexByKind(branches,"commute");
  const commuteBranch=commuteIdxTmp>=0?branches[commuteIdxTmp]:null;
  // 事業所ごとの部門マッチング
  const stores=storeTotals.map(t=>{
    const dept=payrollMatchDeptByStoreName(t.store);
    return {storeName:t.store,amount:Math.round(Number(t.amount)||0),commute:Math.round(Number(t.commute)||0),dept};
  });
  const unmatchedStores=stores.filter(s=>!s.dept);
  if(unmatchedStores.length){
    warnings.push(`事業所「${unmatchedStores.map(s=>s.storeName).join("、")}」に対応する部門（勘定科目の部門マスタ）が見つかりませんでした。店舗名の表記ゆれの可能性があります`);
  }
  const totalCommuteNeeded=stores.reduce((s,x)=>s+x.commute,0);
  if(totalCommuteNeeded>0&&!commuteBranch){
    warnings.push("交通費が発生していますが、仕訳辞書に「旅費交通費」に該当する借方科目が見つかりませんでした");
  }
  const storeSum=stores.reduce((s,x)=>s+x.amount+x.commute,0);
  const hasTotalAllowance=row.total_allowance!=null&&row.total_allowance!=="";
  const expectedAllowance=Math.round(Number(hasTotalAllowance?row.total_allowance:(Number(row.fixed_salary_amount)||0)+(Number(row.commute_allowance)||0))||0);
  if(!hasTotalAllowance) warnings.push("sf_payroll_syncに支給額合計（total_allowance）が無いため、固定給＋通勤手当の合計で代用して検算しました");
  const allowanceDiff=storeSum-expectedAllowance;
  const allowanceOk=Math.abs(allowanceDiff)<=1;

  // 控除内訳のマッチング（既存の貸方科目名 ⇔ sf_payroll_sync.deductionsのlabel）。
  // ※branches配列は後段のpayrollApplyAutoJournalPlanで給料/交通費行の差し替え（splice）が
  // 発生し、そこでインデックスがずれてしまうため、ここではインデックスではなくオブジェクト
  // 参照そのものを保持する（配列が変形しても参照は追跡できる）
  // ※b.creditではなくcreditLabel（文字列）の有無で判定する（上のpayrollFindBranchIndexByKindと
  // 同じ理由＝一時保存の下書きから再開した直後はb.creditが未解決のため）
  const deductions=Array.isArray(row.deductions)?row.deductions:[];
  const catBranchRef={}; // category key -> branchオブジェクト参照
  let netPayBranch=null;
  branches.forEach((b)=>{
    if(!(b.creditLabel||"").trim()) return;
    const label=b.creditLabel||"";
    if(PAYROLL_NETPAY_RE.test(label)){ if(!netPayBranch) netPayBranch=b; return; }
    for(const cat of PAYROLL_DEDUCTION_CATS){
      if(cat.re.test(label)&&!(cat.key in catBranchRef)){ catBranchRef[cat.key]=b; break; }
    }
  });
  const catSums={}; // category key -> 合計額
  const unmatchedDeductions=[];
  for(const d of deductions){
    const amt=Math.round(Number(d.resultAmount)||0);
    const label=String(d.label||"");
    const cat=PAYROLL_DEDUCTION_CATS.find(c=>c.re.test(label));
    if(cat&&cat.key in catBranchRef){
      catSums[cat.key]=(catSums[cat.key]||0)+amt;
    }else{
      unmatchedDeductions.push({label,amount:amt});
    }
  }
  if(unmatchedDeductions.length){
    warnings.push(`控除項目「${unmatchedDeductions.map(d=>`${d.label}(${yen(d.amount)})`).join("、")}」に対応する貸方科目が仕訳辞書に見つかりませんでした`);
  }
  const deductionSum=Object.values(catSums).reduce((s,v)=>s+v,0);
  const expectedDeductionTotal=Math.round(Number(row.deduction_total)||0);
  const deductionOk=unmatchedDeductions.length===0&&Math.abs(deductionSum-expectedDeductionTotal)<=1;
  if(!netPayBranch) warnings.push("仕訳辞書に「未払金」または「差引支給額」に該当する貸方科目が見つかりませんでした");

  const ok=allowanceOk&&deductionOk&&!!netPayBranch&&unmatchedStores.length===0&&(totalCommuteNeeded===0||!!commuteBranch);
  return {
    ok, warnings,
    salaryBranch, commuteBranch,
    stores, storeSum, expectedAllowance, allowanceDiff, allowanceOk,
    catBranchRef, catSums, netPayBranch, deductionSum, expectedDeductionTotal, deductionOk,
    netPayAmount:Math.round(Number(row.net_pay)||0),
  };
}
// 検算結果の確認画面（HTML）を組み立てる。okがtrueの場合のみ「反映する」ボタンを出す
function payrollAutoJournalPlanHtml(plan){
  if(plan.reason){
    return `<div class="err">⚠️ ${esc(plan.reason)}</div>`;
  }
  const storeRows=plan.stores.map(s=>`<tr style="border-top:1px solid var(--line)">
    <td style="padding:3px 6px">${esc(s.storeName)}</td>
    <td style="text-align:right;padding:3px 6px">${yen(s.amount)}</td>
    <td style="text-align:right;padding:3px 6px">${yen(s.commute)}</td>
    <td style="padding:3px 6px">${s.dept?esc(s.dept.name):`<span style="color:var(--accent)">未マッチ</span>`}</td>
  </tr>`).join("");
  const catRows=Object.entries(plan.catSums).map(([key,amt])=>{
    const cat=PAYROLL_DEDUCTION_CATS.find(c=>c.key===key);
    return `<tr style="border-top:1px solid var(--line)"><td style="padding:3px 6px">${esc(cat?cat.label:key)}</td><td style="text-align:right;padding:3px 6px">${yen(amt)}</td></tr>`;
  }).join("");
  const warnHtml=plan.warnings.length?`<div style="font-size:11px;color:var(--m-amber);margin:6px 0">${plan.warnings.map(w=>`⚠️ ${esc(w)}`).join("<br>")}</div>`:"";
  return `<div class="card" style="padding:8px 10px">
    <div style="font-size:10px;color:var(--muted);margin-bottom:6px">🧮 AI読み取り結果とsf_payroll_sync（スマレジ実データ）を突き合わせた検算結果です</div>
    <table style="width:100%;font-size:12px;border-collapse:collapse">
      <thead><tr><th style="text-align:left;padding:3px 6px">事業所</th><th style="text-align:right;padding:3px 6px">給料相当額</th><th style="text-align:right;padding:3px 6px">交通費</th><th style="text-align:left;padding:3px 6px">部門マッチ</th></tr></thead>
      <tbody>${storeRows}</tbody>
    </table>
    <div style="font-size:12px;margin:6px 0">借方合計（AI読み取り）: <b>${yen(plan.storeSum)}</b>　支給額合計（スマレジ）: <b>${yen(plan.expectedAllowance)}</b>　${plan.allowanceOk?`<span style="color:var(--m-green)">✓一致</span>`:`<span style="color:var(--accent)">✗差額${yen(plan.allowanceDiff)}</span>`}</div>
    ${catRows?`<table style="width:100%;font-size:12px;border-collapse:collapse;margin-top:4px">
      <thead><tr><th style="text-align:left;padding:3px 6px">控除項目</th><th style="text-align:right;padding:3px 6px">金額</th></tr></thead>
      <tbody>${catRows}</tbody>
    </table>`:""}

// 検算OKのプランを実際にbranches配列へ反映する（給料・交通費は事業所別行に差し替え、
// 控除・差引支給額は既存の貸方行の金額だけを書き換える＝科目・部門・税区分等は変更しない）
function payrollApplyAutoJournalPlan(branches,plan){
  const salaryTpl=plan.salaryBranch;
  const commuteTpl=plan.commuteBranch;
  const removeObjs=[salaryTpl,commuteTpl].filter(Boolean);
  for(const obj of removeObjs){
    const i=branches.indexOf(obj);
    if(i>=0) branches.splice(i,1);
  }
  const newRows=[];
  for(const s of plan.stores){
    if(s.amount>0){
      newRows.push({debit:salaryTpl.debit||null,credit:null,debitLabel:salaryTpl.debitLabel||"",creditLabel:"",debitAmount:s.amount,creditAmount:0,department_id:s.dept?s.dept.id:null,tax_id:salaryTpl.tax_id||null,credit_department_id:null,credit_tax_id:null,purpose:null,remark:salaryTpl.remark||null});
    }
    if(s.commute>0&&commuteTpl){
      newRows.push({debit:commuteTpl.debit||null,credit:null,debitLabel:commuteTpl.debitLabel||"",creditLabel:"",debitAmount:s.commute,creditAmount:0,department_id:s.dept?s.dept.id:null,tax_id:commuteTpl.tax_id||null,credit_department_id:null,credit_tax_id:null,purpose:null,remark:commuteTpl.remark||null});
    }
  }
  branches.unshift(...newRows);
  // 控除・差引支給額は既存行の金額だけを書き換える（科目・部門・税区分は仕訳辞書の設定のまま維持）。
  // オブジェクト参照で直接書き換えるため、上のsplice/unshiftでインデックスがずれていても問題ない
  Object.entries(plan.catBranchRef).forEach(([key,b])=>{
    b.creditAmount=plan.catSums[key]||0;
  });
  if(plan.netPayBranch){
    plan.netPayBranch.creditAmount=plan.netPayAmount;
  }
}
function payrollBankFor(userId){ return (PAYROLL_STATE.bankAccounts||[]).find(b=>b.user_id===userId); }
// 一覧の並び替え・絞り込み（2026-09-01: ユーザー要望「振込済みが1番下に行くように・絞れるように」）
// 2026-09-02: この月は対象外にした人（sf_payroll_hidden・担当Bからの依頼②）は一覧から常に除外し、
// 検索キーワード（氏名の部分一致・依頼③）も同時にここで反映する
// 2026-09-10新設→同日修正：ユーザー要望「店舗毎に絞り込みできるようにしてほしい」に対応。
// 当初はsf_payroll_allocations（勤怠系の按分テーブル）から集計していたが、ユーザーから
// 「全然違うよ」「振込額は店舗別で出すことは難しいかもしれないから、会計仕訳で店舗別に
// 仕訳されてるはずだからそれをベースに見て計算すればいいのでは？」と指摘・訂正があった。
// sf_payroll_allocationsは実際に会計へ登録した仕訳の金額とは別経路のデータで、値が食い違って
// いたのが原因と判断。実際に登録済みの仕訳（mf_journal_id）を1件ずつ読み直し、部門（＝店舗）が
// 付いている借方行の金額を集計する方式に作り直した（payrollEnsureJournalDeptCache参照）。
// 部門名→店舗の突き合わせは、勘定科目・部門マッピング（stores.mf_department_name）を使う。
// 「給料」か「交通費」かは、行の摘要（payrollComputeBranchesのbuildRemarkが「◯月　基本給　氏名」
// 「◯月　交通費　氏名」のように組み立てている）に含まれる文言で判定する（所得税・振込金額等の
// 部門を持たない行は自然に対象外になる）。仕訳登録がまだの人はここでは対象にならない
// （集計の元になる会計仕訳自体がまだ無いため）。
function payrollStoreByDeptName(deptName){
  if(!deptName) return null;
  const norm=s=>String(s||"").replace(/\s+/g,"");
  const n=norm(deptName);
  if(!n) return null;
  const stores=(PAYROLL_STATE.stores||[]).filter(s=>s.mf_department_name);
  return stores.find(s=>norm(s.mf_department_name)===n)
    || stores.find(s=>n.includes(norm(s.mf_department_name))||norm(s.mf_department_name).includes(n))
    || null;
}
// 対象月の登録済み仕訳（payroll_journal_records.mf_journal_id）を持つ全員ぶん、実際にマネー
// フォワードへ問い合わせて部門別の金額を集計し、PAYROLL_STATE.journalDeptCacheへキャッシュする
// （user_id -> Map(store_id -> {salary,commute})）。件数が多いと時間がかかるため、並列数を
// 絞って呼び出し、対象月が変わったときだけ再取得する
async function payrollEnsureJournalDeptCache(){
  const ym=PAYROLL_STATE.yearMonth;
  if(PAYROLL_STATE.journalDeptCacheYm===ym&&PAYROLL_STATE.journalDeptCache) return;
  if(PAYROLL_STATE.journalDeptCacheLoading) return;
  PAYROLL_STATE.journalDeptCacheLoading=true;
  try{
    const targets=(PAYROLL_STATE.rows||[]).map(r=>({userId:r.user_id,rec:payrollRecordFor(r.user_id)})).filter(t=>t.rec&&t.rec.mf_journal_id);
    const cache=new Map();
    let idx=0;
    async function worker(){
      while(idx<targets.length){
        const my=targets[idx++];
        try{
          const r=await mfCall("get_journal",{tenant_id:my.rec.tenant_id||"default",journal_id:my.rec.mf_journal_id});
          if(!r.ok||!Array.isArray(r.body.branches)) continue;
          const byStore=new Map();
          r.body.branches.forEach(b=>{
            const d=b.debit;
            if(!d||!d.department_name||!(Number(d.value)>0)) return;
            const store=payrollStoreByDeptName(d.department_name);
            if(!store) return;
            const remark=String(b.remark||"");
            let kind=null;
            if(remark.includes("基本給")) kind="salary";
            else if(remark.includes("交通費")) kind="commute";
            if(!kind) return;
            if(!byStore.has(store.id)) byStore.set(store.id,{salary:0,commute:0});
            byStore.get(store.id)[kind]+=Number(d.value);
          });
          if(byStore.size) cache.set(my.userId,byStore);
        }catch(e){ /* 1件失敗しても他は続ける */ }
      }
    }
    await Promise.all(Array.from({length:Math.min(8,targets.length||1)},worker));
    PAYROLL_STATE.journalDeptCache=cache;
    PAYROLL_STATE.journalDeptCacheYm=ym;
  }finally{
    PAYROLL_STATE.journalDeptCacheLoading=false;
  }
}
function payrollUserHasStoreAlloc(userId,storeId){
  if(!storeId) return true;
  const cache=PAYROLL_STATE.journalDeptCache;
  if(!cache) return false; // 集計中はまだ絞り込めない（読み込み完了後に再描画される）
  const byStore=cache.get(userId);
  const v=byStore&&byStore.get(storeId);
  return !!(v&&(v.salary>0||v.commute>0));
}
function payrollSortedRows(){
  let rows=[...(PAYROLL_STATE.rows||[])];
  const hidden=PAYROLL_STATE.hiddenUserIds||new Set();
  rows=rows.filter(r=>!hidden.has(r.user_id));
  const q=(PAYROLL_STATE.searchQuery||"").trim();
  if(q) rows=rows.filter(r=>((r.user&&r.user.name)||"").includes(q));
  if(PAYROLL_STATE.storeFilter) rows=rows.filter(r=>payrollUserHasStoreAlloc(r.user_id,PAYROLL_STATE.storeFilter));
  if(PAYROLL_STATE.hidePaid){
    rows=rows.filter(r=>{ const rec=payrollRecordFor(r.user_id); return !(rec&&rec.paid_at); });
  }
  if(PAYROLL_STATE.sortMode!=="default"){
    const isPaid=r=>{ const rec=payrollRecordFor(r.user_id); return rec&&rec.paid_at?1:0; };
    rows=rows.map((r,i)=>({r,i})).sort((a,b)=>(isPaid(a.r)-isPaid(b.r))||(a.i-b.i)).map(x=>x.r); // 振込完了だけ末尾へ（安定ソート）
  }
  return rows;
}

function payrollMatchesQuick(r,q){
  const rec=payrollRecordFor(r.user_id), b=payrollBankFor(r.user_id);
  if(q==="all") return true;
  if(q==="attention") return !b || !(payrollAssignmentFor(r.user_id)&&payrollAssignmentFor(r.user_id).template_id) && !rec;
  // 2026-09-10修正：KPIカードの集計（payrollKpiCounts）を銀行振込対象（現金以外）だけに絞った
  // のに合わせ、カードをクリックしたときの絞り込みも同じ基準にする（現金支払の人は「振込データ
  // 作成待ち」等のチップをクリックしたときに混ざって出てこないように）
  const isCash=b&&b.payment_method==="cash";
  if(q==="prep-wait") return !rec&&!isCash;
  if(q==="registered") return rec&&!rec.paid_at&&!isCash;
  if(q==="paid") return rec&&rec.paid_at&&!isCash;
  if(q==="cash") return isCash;
  return true;
}

    const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`給与仕訳一覧_${PAYROLL_STATE.yearMonth}.csv`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  wirePayrollRowActions();
  $("payroll-csv-export").onclick=payrollExportCsv;
  $("payroll-pdf-match").onclick=()=>{
    const files=Array.from($("payroll-pdf-files").files||[]);
    if(!files.length){ alert("PDFファイルを選択してください"); return; }
    PAYROLL_STATE.pdfMatches=files.map(f=>{
      const guess=payrollGuessEmployeeByFilename(f.name);
      return {file:f, userId:guess?guess.user_id:""};
    });
    payrollRenderPdfMatchArea();
  };
}

async function payrollUploadPdfs(){
  const msg=$("payroll-pdf-msg"); msg.className="err"; msg.textContent="アップロード中…";
  $("payroll-pdf-upload").disabled=true;
  const matches=(PAYROLL_STATE.pdfMatches||[]).filter(m=>m.userId);
  if(!matches.length){ msg.textContent="対応付けられたファイルがありません（従業員を選んでください）"; $("payroll-pdf-upload").disabled=false; return; }
  const s=sess.get();
  let okCount=0; const fail=[];
  // 2026-09-07修正（担当Bスレッド実害報告・原因特定済み）：同じ従業員に複数ファイルを対応付けた
  // 場合（事業所ごとに明細が分かれているケース）、従来は全ファイルが同じ固定パス
  // {userId}/{yearMonth}.pdfへx-upsert:trueで上書きしていたため、最後にアップロードした
  // ファイルだけが残り、それ以前のファイルは静かに消えていた。既にStorageにある枚数を
  // 起点に、同一userIdの2件目以降は{yearMonth}_2.pdf・_3.pdf...という連番パスへ割り当てる
  const nextIndex={}; // userId -> 次に使う連番（1始まり）。既存ファイルは上書きしない
  for(const m of matches){
    if(!(m.userId in nextIndex)){
      const existing=await payrollListPdfFiles(m.userId,PAYROLL_STATE.yearMonth);
      nextIndex[m.userId]=existing.length+1;
    }
    const idx=nextIndex[m.userId]++;
    const fileName=idx===1?`${PAYROLL_STATE.yearMonth}.pdf`:`${PAYROLL_STATE.yearMonth}_${idx}.pdf`;
    const path=`${m.userId}/${fileName}`;
    const buf=await m.file.arrayBuffer();
    const r=await fetch(`${SUPA_URL}/storage/v1/object/payroll-pdfs/${path}`,{
      method:"POST",
      headers:{apikey:SUPA_KEY,Authorization:"Bearer "+(s?s.at:""),"Content-Type":"application/pdf","x-upsert":"true"},
      body:buf,
    });
    if(r.ok) okCount++; else fail.push(m.file.name);
  }
  msg.className=fail.length?"err":"err msg-ok";
  msg.textContent=`アップロード完了: ${okCount}件成功`+(fail.length?`／失敗: ${fail.join("、")}`:"")+"。一覧を更新します…";
  $("payroll-pdf-upload").disabled=false;
  setTimeout(async()=>{ await payrollLoad(); payrollRender(); },900);
}

  const HDAK_BASE="ハヒフヘホ";
  const baseMap={};
  for(let i=0;i<FULL.length;i++) baseMap[FULL[i]]=HALF[i];
  const map={};
  for(let i=0;i<FULL.length;i++) map[FULL[i]]=HALF[i];
  for(let i=0;i<DAK_FULL.length;i++) map[DAK_FULL[i]]=baseMap[DAK_BASE[i]]+"ﾞ"; // 例:ガ→ｶﾞ（2文字）
  for(let i=0;i<HDAK_FULL.length;i++) map[HDAK_FULL[i]]=baseMap[HDAK_BASE[i]]+"ﾟ"; // 例:パ→ﾊﾟ（2文字）
  return map;
}
const ZENKAKU_KANA_MAP=buildZenkakuToHankakuKanaMap();
function zenkakuToHankaku(str){
  let out="";
  for(const ch of String(str)){
    if(ZENKAKU_KANA_MAP[ch]!==undefined){ out+=ZENKAKU_KANA_MAP[ch]; continue; }
    const cp=ch.codePointAt(0);
    if(cp===0x3000){ out+=" "; continue; } // 全角スペース→半角スペース
    if(cp>=0xFF01&&cp<=0xFF5E){ out+=String.fromCodePoint(cp-0xFEE0); continue; } // 全角英数記号→半角(例:Ａ→A,１→1,－→-)
    out+=ch;
  }
  return out;
}
// PayPay銀行が受け付ける文字（半角英数字・半角カタカナ・ハイフン/ピリオド/スペース等）だけに
// なっているかを判定する。これに合わないと「入力して下さい」エラーの原因になりうるため、
// paypayRemitterNameで入力時に警告できるようにしてある
const PAYPAY_SAFE_CHARS_RE=/^[\x20-\x7E｡-ﾟ]*$/;
function paypayHasUnsafeChars(cleaned){
  return !PAYPAY_SAFE_CHARS_RE.test(cleaned);
}
// PayPay銀行「使用許容文字」ルールの自動変換（全角カナ→半角カナ・長音→ハイフン・中黒→ピリオド・
// 小文字カナ→大文字化）。それ以外の使用不可文字（漢字・ひらがな・&や!等）はそのまま残すため、
// 出力前に一覧で確認できるようにしてある
function paypayCleanKana(s){
  let t=zenkakuToHankaku(String(s||""));
  t=t.toUpperCase();
  t=t.replace(/[ーｰ]/g,"-").replace(/[･・]/g,".");
  const smallMap={"ｧ":"ｱ","ｨ":"ｲ","ｩ":"ｳ","ｪ":"ｴ","ｫ":"ｵ","ｯ":"ﾂ","ｬ":"ﾔ","ｭ":"ﾕ","ｮ":"ﾖ"};
  t=t.replace(/[ｧｨｩｪｫｯｬｭｮ]/g,c=>smallMap[c]||c);
  return t;
}
// 2026-09-04緊急修正：PayPay銀行アップロード時「受取人名を正しく入力して下さい」
// 「振込依頼人名を入力して下さい」が全件（78件）で発生した不具合の原因調査・対応。
// DBのaccount_holder_kanaを直接確認したところ、半角カタカナで正しく保存されていた
// （例:"ﾀﾏﾝﾚｽﾏｶﾗ"）ため、データの中身（全角/半角の間違い）が原因ではないと判明。
// PayPay銀行のWEB総振アップロードは、日本の銀行系CSVで一般的なShift-JISエンコーディングを
// 前提にしていると推測されるが、これまでBlobをUTF-8で作成していたため、半角カタカナ
// （UTF-8では3バイトの文字）がShift-JIS前提でバイト単位に誤読され、受取人名が壊れ、
// その影響で行内の項目区切りまでずれて末尾の振込依頼人名欄の扱いにも影響していたと考えられる。
// このアプリで実際に使う文字は「数字・半角英字・半角カタカナ・ハイフン/ピリオド」に
// 限定されており（paypayCleanKana側で変換済み）、この範囲はJIS X0201とASCIIの範囲へ
// 単純に1対1対応できるため、外部ライブラリ無しでShift-JISへ変換して出力するようにした
function toShiftJisBytes(str){
  const bytes=[];
  for(const ch of String(str)){
    const cp=ch.codePointAt(0);
    if(cp===0x00A5){ bytes.push(0x5C); } // ¥（円記号）→JIS X0201では0x5C
    else if(cp<=0x7F){ bytes.push(cp); } // ASCII（数字・英字・カンマ・CR/LF等）
    else if(cp>=0xFF61&&cp<=0xFF9F){ bytes.push(cp-0xFF61+0xA1); } // 半角カタカナ（1対1対応）
    else{ bytes.push(0x3F); } // 想定外の文字（全角等）は?に置き換える（本来ここに来ないはず）
  }
  return new Uint8Array(bytes);
}
// PayPay銀行フォーマットのCSV文字列を、正しくShift-JISでエンコードしたBlobに変換する
function paypayCsvToBlob(csvString){
  return new Blob([toShiftJisBytes(csvString)],{type:"text/csv"});
}

  for(let attempt=0;attempt<5;attempt++){
    const input=prompt("振込依頼人名（半角カタカナ・振込元の名義）を入力してください。\n例：ユウゲンガイシヤト-ホ-エ-ジエンシ-\n\n全角カタカナで入力・貼り付けしても自動で半角に変換されます。\n一度入力すると次回から自動で入力された状態になります（変更したい場合はここで書き換えてください）。",saved);
    if(input===null) return null; // キャンセル
    const cleaned=paypayCleanKana(input.trim());

    if(cleaned && paypayHasUnsafeChars(cleaned)){

// PayPay銀行指定フォーマット（CSV）どおりに振込データを組み立てる共通ヘルパー（2026-09-03・
// 会計・請求書処理の全面刷新でrenderTransfersTab（一般の取引先向け振込一覧）からも使うため、
// 元payrollExportCsv内にあった整形ロジック部分だけを切り出した。
// rows: [{bankCode,branchCode,accountType,accountNumber,holderKana,amount}]
// remitterName: 振込依頼人名（半角カナ・2026-09-04追加。未指定なら従来どおり空欄のまま）
function buildPaypayCsv(rows,remitterName){
  const remitter=remitterName?paypayCleanKana(remitterName):"";
  const dataLines=[]; let total=0, count=0;
  for(const r of rows){
    const amount=Math.round(Number(r.amount)||0);
    if(!amount||amount<=0) continue;
    dataLines.push(["1", r.bankCode, r.branchCode, r.accountType, r.accountNumber, paypayCleanKana(r.holderKana), String(amount), remitter].join(","));
    total+=amount; count++;
  }
  const trailer=["2","","","","",String(count),String(total),""].join(",");
  return [...dataLines, trailer].join("\r\n")+"\r\n";
}

    if(!bank){ skipped.push(`${name}（支払方法が未登録）`); continue; }

    csvRows.push({bankCode:bank.bank_code, branchCode:bank.branch_code, accountType:bank.account_type, accountNumber:bank.account_number, holderKana:bank.account_holder_kana, amount});
    paidNames.push(name);

  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  // 2026-09-05修正：ユーザー指摘「本部タスクの法人がN-Style固定になっている」に対応。
  // 給与仕訳はまだ有限会社トーホーエージェンシー分のみ対応（画面上部の案内文と同じ前提）のため、
  // 既定値をN-Styleからトーホーへ変更した
  const taskR=await createTransferConfirmTask("payroll",PAYROLL_STATE.yearMonth,transferDate,paidNames,"トーホー"); // scope_key=対象年月（月ごとに1つの開いているタスクとして扱う）
  await authed(`/rest/v1/payroll_transfer_schedule`,{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({
    year_month:PAYROLL_STATE.yearMonth, scheduled_date:transferDate, hq_task_id:(taskR.ok&&taskR.body)||null, created_by:ME.id, updated_at:new Date().toISOString(),

// 対象年月（"YYYY-MM"）の末日を"YYYY-MM-DD"で返す（2026-09-02追加。ユーザー要望
// 「会計計上日は対象月の末日が既定値になるように」に対応。従来は常に「今日の日付」だった）
function payrollLastDayOfMonth(ym){
  const [y,m]=String(ym||"").split("-").map(Number);
  if(!y||!m) return new Date().toISOString().slice(0,10);
  const d=new Date(y,m,0); // 月mの0日目=月m(1始まり)の末日
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
