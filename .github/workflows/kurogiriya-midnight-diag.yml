name: 黒霧屋の深夜予約(visit_date/created_at_source)を確認（送信なし・一時的）
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 8/28分(うお蔵 新横浜account)の深夜(0時台)予約を確認
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?store_account=ilike.*%E3%81%86%E3%81%8A%E8%94%B5*&visit_date=eq.2026-08-28&select=visit_date,visit_time,created_at_source,channel_raw,status_normalized&order=visit_time.asc&limit=100" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          echo ''
          echo '--- 8/29分(うお蔵)の早朝も確認 ---'
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?store_account=ilike.*%E3%81%86%E3%81%8A%E8%94%B5*&visit_date=eq.2026-08-29&visit_time=lt.06:00:00&select=visit_date,visit_time,created_at_source,channel_raw,status_normalized&order=visit_time.asc&limit=20" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
