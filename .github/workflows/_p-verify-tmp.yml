name: P一時検証(削除予定)
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: pl_monthly(洗い替え・日次起点の行作成・借入元金)
        env:
          SR_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          U=https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-kd-refresh
          curl -s -m 280 -X POST $U -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d '{"op":"pl_monthly"}' | cut -c1-500; echo
