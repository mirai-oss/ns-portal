<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📌 本部タスク — N-Styleグループ ポータル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
<style>
:root{
  --bg:#f5f4f1; --card:#ffffff; --ink:#26221e; --muted:#8a8377;
  --accent:#c8401f; --accent2:#a33318; --line:#e7e3dc; --ok:#2e7d32;
  --warn:#b58a00; --stall:#c62828;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1d1b18; --card:#282521; --ink:#f0ece5; --muted:#a29a8c; --line:#3a362f;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 60px}
a{color:inherit}
.spin{text-align:center;color:var(--muted);padding:60px 0}
.err{color:#c62828;font-size:13px}
.msg-ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit}
textarea{resize:vertical}
.btn{display:inline-block;padding:10px 18px;font-size:14px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sub{background:transparent;color:var(--muted);border:1px dashed var(--muted);font-weight:400}
.btn.sm{padding:6px 12px;font-size:13px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar h1{font-size:19px}
.topbar .who{font-size:13px;color:var(--muted)}

/* サマリー信号 */
.sig-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:600px){.sig-row{grid-template-columns:repeat(2,1fr)}}
.sig{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;transition:box-shadow .1s}
.sig:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sig.active{outline:2px solid var(--accent)}
.sig .n{font-size:24px;font-weight:700}
.sig.overdue .n{color:var(--stall)}
.sig.today .n{color:var(--warn)}
.sig.stall .n{color:var(--stall)}
.sig .l{font-size:11px;color:var(--muted);margin-top:2px}

/* 検索・絞り込み */
.searchbox{position:relative;margin-bottom:12px}
.searchbox input{padding-left:38px}
.searchbox .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-block;padding:5px 12px;font-size:12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chipcheck{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font-size:12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap;margin:0}
.chipcheck input{width:auto;margin:0;accent-color:var(--accent);cursor:pointer}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}

/* かんばん */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media(max-width:760px){
  .board{
    display:flex; grid-template-columns:none;
    overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    padding-bottom:8px; margin-left:-16px; margin-right:-16px; padding-left:16px; padding-right:16px;
  }
  .board .col{min-width:86vw; max-width:86vw; flex-shrink:0; scroll-snap-align:start}
  .board .col h2{position:sticky; top:0; background:var(--bg); padding:4px 0}
}
.col{background:transparent}
.col h2{font-size:14px;margin-bottom:8px;color:var(--muted)}
.col h2 b{color:var(--ink)}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:transform .08s}
.tcard:hover{transform:translateY(-1px)}
.tcard.stall{border-color:var(--stall);border-width:2px}
.tcard.warn{border-color:var(--warn);border-width:2px}
.tcard .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.freq{color:var(--accent);border-color:var(--accent)}
.tcard .ti{font-size:14px;font-weight:600;margin-bottom:4px}
.tcard .meta{font-size:12px;color:var(--muted);line-height:1.6}
.tcard .stall-badge{display:inline-block;font-size:11px;color:#fff;background:var(--stall);padding:1px 8px;border-radius:99px;margin-bottom:4px}
.tcard .now{font-size:12px;margin-top:4px}
.empty-col{font-size:12px;color:var(--muted);padding:10px 4px}

/* 繰り返しタブ */
.rp-table{width:100%;border-collapse:collapse;font-size:13px}
.rp-table th,.rp-table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.rp-table th{color:var(--muted);font-weight:600;font-size:12px}

/* 詳細画面 */
.dh{margin-bottom:14px}
.dh .badges{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.dh h1{font-size:20px;margin-top:4px}
.sec{margin-top:20px}
.sec h3{font-size:14px;margin-bottom:8px}
.sec-sub{font-size:12px;color:var(--muted)}
.notes-box{background:#fff8e1;border:1px solid #e6c74e;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;color:#5a4a00}
@media(prefers-color-scheme:dark){.notes-box{background:#3a3110;border-color:#6b5a1e;color:#f0dd8a}}
.step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.step.cur{border-color:var(--accent);border-width:2px}
.step .row1{display:flex;align-items:center;gap:8px;cursor:pointer}
.step .ic{font-size:16px;width:20px;text-align:center}
.step .st{flex:1;font-size:14px}
.step .meta{font-size:12px;color:var(--muted);margin-top:2px}
.step .now-tag{color:var(--stall);font-weight:600}
.step-body{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.storecheck-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.storecheck-row:last-child{border-bottom:none}
.link-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.link-row:last-child{border-bottom:none}
.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photo-grid img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.act-row{font-size:12px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--line)}
.act-row:last-child{border-bottom:none}
.act-row b{color:var(--ink);font-weight:600}
.stepform-row{display:flex;gap:8px;align-items:flex-end;margin-bottom:8px;flex-wrap:wrap}
.stepform-row .f{flex:1;min-width:120px}
.stepform-row .f label{margin:0 0 4px}
</style>
</head>
<body>
<div class="wrap">
<div id="app"><div class="spin">読み込み中…</div></div>
</div>
<script>
const SUPA_URL="https://uuvsxzhpxtghojoubjcc.supabase.co";
const SUPA_KEY="sb_publishable_MrwPJAx_Ws_fdRutprKCiQ_dg3wCiTr";
const LS_KEY="nsportal_session_v1";
const BUCKET="report-photos";
let CORPS=[];              // hq_corpsから取得 {id,name,is_active,sort_order}
const activeCorps=()=>CORPS.filter(c=>c.is_active);
const ASSIGNABLE_ROLES=["HQ","CEO","TEAM"];
const FREQ_LABEL={daily:"毎日",weekly:"毎週",monthly:"毎月",once:"単発"};
const STATUS_LABEL={todo:"未着手",doing:"進行中",done:"完了"};
const ROLE_NAME={CEO:"社長",HQ:"本部",TEAM:"チーム長",TENCHO:"店長",SHAIN:"社員",AL:"アルバイト"};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sess={get:()=>{try{return JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return null}},
            set:v=>localStorage.setItem(LS_KEY,JSON.stringify(v)),
            clear:()=>localStorage.removeItem(LS_KEY)};

async function api(path,opt={},token){
  const r=await fetch(SUPA_URL+path,{...opt,headers:{
    "apikey":SUPA_KEY,...(opt.isBinary?{}:{"Content-Type":"application/json"}),
    ...(token?{"Authorization":"Bearer "+token}:{}),...(opt.headers||{})}});
  let body=null;
  if(opt.rawResponse) return {ok:r.ok,status:r.status,raw:r};
  const tx=await r.text(); try{body=tx?JSON.parse(tx):null}catch(e){}
  return {ok:r.ok,status:r.status,body};
}
async function authed(path,opt={}){
  const s=sess.get(); if(!s) return {ok:false,status:401,body:null};
  let r=await api(path,opt,s.at);
  if(r.status===401){ if(!await refresh()) return r; r=await api(path,opt,sess.get().at); }
  return r;
}
async function refresh(){
  const s=sess.get(); if(!s?.rt) return false;
  const r=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.rt})});
  if(!r.ok){sess.clear();return false}
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});
  return true;
}
async function fetchMe(){
  const s=sess.get(); if(!s) return null;
  const r=await authed(`/rest/v1/users?id=eq.${s.uid}&select=*`);
  if(!r.ok||!Array.isArray(r.body)||!r.body[0]) return null;
  return r.body[0];
}

let ME=null, USERS=[], STORES=[];
let VIEW="board";        // board | repeat | detail | new
let TASKS=[];             // ボード表示範囲のタスク（工程埋め込み）
let SEARCHQ="";
let SEARCH_RESULTS=null;  // 検索中はこちらを表示
let FILTER={corp:null,freq:null,assignee:null,creator:null,signal:null};
let SORT_MODE=localStorage.getItem("hq_sort")||"due";  // due | created | stalled（このブラウザだけに効く。DB保存なし）
const SORT_LABEL={due:"期限が近い順（既定）",created:"作成が新しい順",stalled:"停滞が長い順"};
function sortTasks(list){
  const arr=list.slice();
  if(SORT_MODE==="created"){
    arr.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  } else if(SORT_MODE==="stalled"){
    arr.sort((a,b)=>computeSignal(b).stalledDays-computeSignal(a).stalledDays);
  } else {
    const key=t=>t.due_date?new Date(t.due_date+"T"+(t.due_time?t.due_time.slice(0,8):"23:59:59")).getTime():Infinity;
    arr.sort((a,b)=>key(a)-key(b));
  }
  return arr;
}
let CUR_TASK=null;        // 詳細表示中のタスク（工程・リンク・写真・履歴込み）
let OPEN_STEP=null;       // 詳細画面で開いている工程id
let NOTIFICATIONS=[];     // アプリ内通知（自分宛）
let NOTIF_UNREAD=0;
let BELL_OPEN=false;
const qs=new URLSearchParams(location.search);

const isMaster=u=>!!(u&&u.is_master);
const canManage=u=>!!(u&&(u.is_master||u.role==="CEO"||u.role==="HQ"));
const userName=id=>{const u=USERS.find(x=>x.id===id);return u?u.name:"—";};
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function monthStartStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";}
function fmtD(d){ if(!d) return "—"; const t=new Date(d+"T00:00:00"); return `${t.getMonth()+1}/${t.getDate()}`; }
function fmtDD(d,tm){ if(!d) return "—"; const base=fmtD(d); return tm?`${base} ${tm.slice(0,5)}`:base; }
function fmtDT(t){ if(!t) return "—"; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }

/* ---------- 工程・信号の判定（設計書 第5章） ---------- */
function sortedSteps(t){ return (t.hq_task_steps||[]).slice().sort((a,b)=>a.sort_order-b.sort_order); }
function computeSignal(t){
  const steps=sortedSteps(t);
  const cur=steps.find(s=>!s.completed_at);
  if(t.status==="done"||!cur) return {cur:null,level:"done",stalledDays:0,overdue:false,dueToday:false};
  const today=todayStr();
  const dueMs=cur.due_date?new Date(cur.due_date+"T"+(cur.due_time?cur.due_time.slice(0,8):"23:59:59")).getTime():null;
  const overdue=dueMs!==null && Date.now()>dueMs;
  const dueToday=!!(cur.due_date && cur.due_date===today && !overdue);
  const dueSoon=!!(cur.due_date && !overdue && !dueToday && (new Date(cur.due_date)-new Date(today))/86400000<=2);
  const idx=steps.indexOf(cur);
  const sinceStr=idx>0?steps[idx-1].completed_at:t.created_at;
  const stalledDays=sinceStr?Math.floor((Date.now()-new Date(sinceStr).getTime())/86400000):0;
  const stalled=overdue||stalledDays>=3;
  let level="ok"; if(stalled)level="stall"; else if(dueToday||dueSoon)level="warn";
  return {cur,level,stalledDays,overdue,dueToday};
}

/* ---------- データ取得 ---------- */
async function fetchUsers(){
  const r=await authed("/rest/v1/users?select=id,name,role,is_active,is_master&is_active=eq.true&order=name");
  USERS=(r.ok&&Array.isArray(r.body))?r.body:[];
}
const assignableUsers=()=>USERS.filter(u=>ASSIGNABLE_ROLES.includes(u.role));
async function fetchStores(){
  const r=await authed("/rest/v1/stores?select=id,name,store_no,is_active&order=sort_order");
  STORES=(r.ok&&Array.isArray(r.body))?r.body:[];
}
async function fetchCorps(){
  const r=await authed("/rest/v1/hq_corps?select=*&order=sort_order");
  CORPS=(r.ok&&Array.isArray(r.body))?r.body:[];
}
async function fetchBoard(){
  const ms=monthStartStr();
  const r=await authed(`/rest/v1/hq_tasks?select=*,hq_task_steps(*)&or=(status.neq.done,and(status.eq.done,completed_at.gte.${ms}))&order=target_date.desc`);
  TASKS=(r.ok&&Array.isArray(r.body))?r.body:[];
}
async function runSearch(q){
  if(!q||!q.trim()){ SEARCH_RESULTS=null; renderBoard(ME); return; }
  const like=`*${q.trim()}*`;
  const [byTask,byStep,byAct]=await Promise.all([
    authed(`/rest/v1/hq_tasks?or=(title.ilike.${encodeURIComponent(like)},notes.ilike.${encodeURIComponent(like)})&select=id`),
    authed(`/rest/v1/hq_task_steps?or=(title.ilike.${encodeURIComponent(like)},issue_note.ilike.${encodeURIComponent(like)})&select=task_id`),
    authed(`/rest/v1/hq_task_activity?detail.ilike.${encodeURIComponent(like)}&select=task_id`),
  ]);
  const ids=new Set();
  (byTask.body||[]).forEach(x=>ids.add(x.id));
  (byStep.body||[]).forEach(x=>ids.add(x.task_id));
  (byAct.body||[]).forEach(x=>ids.add(x.task_id));
  if(!ids.size){ SEARCH_RESULTS=[]; renderBoard(ME); return; }
  const r=await authed(`/rest/v1/hq_tasks?id=in.(${[...ids].join(",")})&select=*,hq_task_steps(*)&order=target_date.desc`);
  SEARCH_RESULTS=(r.ok&&Array.isArray(r.body))?r.body:[];
  renderBoard(ME);
}
async function fetchTaskDetail(id){
  const [t,links,photos,act]=await Promise.all([
    authed(`/rest/v1/hq_tasks?id=eq.${id}&select=*,hq_task_steps(*)`),
    authed(`/rest/v1/hq_task_links?task_id=eq.${id}&order=created_at`),
    authed(`/rest/v1/hq_task_photos?task_id=eq.${id}&order=created_at`),
    authed(`/rest/v1/hq_task_activity?task_id=eq.${id}&order=created_at.desc&limit=100`),
  ]);
  if(!t.ok||!Array.isArray(t.body)||!t.body[0]) return null;
  const task=t.body[0];
  task._links=links.ok?links.body:[];
  task._photos=photos.ok?photos.body:[];
  task._activity=act.ok?act.body:[];
  // 工程ごとの写真（step_id指定）もまとめて取得
  const stepIds=sortedSteps(task).map(s=>s.id);
  if(stepIds.length){
    const sp=await authed(`/rest/v1/hq_task_photos?step_id=in.(${stepIds.join(",")})&order=created_at`);
    task._stepPhotos=sp.ok?sp.body:[];
  } else task._stepPhotos=[];
  return task;
}

/* ---------- ボード ---------- */
function applyFilters(list){
  return list.filter(t=>{
    if(FILTER.corp && t.corp!==FILTER.corp) return false;
    if(FILTER.freq && t.freq!==FILTER.freq) return false;
    if(FILTER.assignee){
      const match=sortedSteps(t).some(s=>s.assignee_id===FILTER.assignee);
      if(!match) return false;
    }
    if(FILTER.creator && t.created_by!==FILTER.creator) return false;
    if(FILTER.signal){
      const sig=computeSignal(t);
      if(FILTER.signal==="overdue" && !sig.overdue) return false;
      if(FILTER.signal==="today" && !sig.dueToday) return false;
      if(FILTER.signal==="stall" && sig.level!=="stall") return false;
    }
    return true;
  });
}
function summaryCounts(){
  const base=TASKS.filter(t=>t.status!=="done");
  let overdue=0,today=0,stall=0;
  base.forEach(t=>{ const s=computeSignal(t); if(s.overdue)overdue++; if(s.dueToday)today++; if(s.level==="stall")stall++; });
  const doneCount=TASKS.filter(t=>t.status==="done").length;
  return {overdue,today,stall,doneCount};
}
function taskCardHtml(t){
  const sig=computeSignal(t);
  const cls=sig.level==="stall"?"stall":(sig.level==="warn"?"warn":"");
  return `<div class="tcard ${cls}" data-open="${t.id}">
    <div class="badges"><span class="tag">${esc(t.corp)}</span><span class="tag freq">${t.freq!=="once"?"🔁 "+FREQ_LABEL[t.freq]:"単発"}</span></div>
    ${sig.level==="stall"?`<div class="stall-badge">⏸ ${sig.stalledDays}日停止</div>`:""}
    <div class="ti">${esc(t.title)}</div>
    <div class="meta">対象日 ${fmtD(t.target_date)} ／ 期限 ${fmtDD(t.due_date,t.due_time)}${t.status==="done"?" ／ "+fmtD((t.completed_at||"").slice(0,10))+" 完了 ✓":""}</div>
    ${sig.cur?`<div class="now">いま: ${esc(sig.cur.title)}（${esc(userName(sig.cur.assignee_id)||"未定")}）</div>`:""}
  </div>`;
}
function renderBoard(u){
  const src=SEARCH_RESULTS!==null?SEARCH_RESULTS:TASKS;
  const list=sortTasks(applyFilters(src));
  const cols={todo:[],doing:[],done:[]};
  list.forEach(t=>cols[t.status]?.push(t));
  const cnt=summaryCounts();
  $("app").innerHTML=`
  <div class="topbar">
    <h1>📌 本部タスク</h1>
    <div class="who">
      <button class="linkbtn" id="bellbtn" style="position:relative">🔔${NOTIF_UNREAD?` <span class="tag" style="background:var(--accent);color:#fff;border-color:var(--accent)">${NOTIF_UNREAD}</span>`:""}</button>
      👤 ${esc(u.name)} ／ <a href="index.html">← ポータルへ</a>
    </div>
  </div>
  <div id="bellpanel" class="card" style="display:${BELL_OPEN?'block':'none'};margin-bottom:14px">
    ${NOTIFICATIONS.length?NOTIFICATIONS.map(n=>`<div class="act-row" style="cursor:pointer${n.read_at?'':';font-weight:600'}" data-notifopen="${n.id}" data-notiftask="${n.task_id||''}">
      <b>${fmtDT(n.created_at)}</b> ${esc(n.title)}${n.body?" — "+esc(n.body):""}
    </div>`).join(""):'<div class="meta">通知はありません</div>'}
  </div>
  <div class="sig-row">
    <div class="sig overdue ${FILTER.signal==='overdue'?'active':''}" data-sig="overdue"><div class="n">${cnt.overdue}</div><div class="l">期限超過</div></div>
    <div class="sig today ${FILTER.signal==='today'?'active':''}" data-sig="today"><div class="n">${cnt.today}</div><div class="l">今日が期限</div></div>
    <div class="sig stall ${FILTER.signal==='stall'?'active':''}" data-sig="stall"><div class="n">${cnt.stall}</div><div class="l">3日以上停止</div></div>
    <div class="sig"><div class="n">${cnt.doneCount}</div><div class="l">今月完了</div></div>
  </div>

function wireBoard(u){
  let t=null;
  $("q").oninput=e=>{ SEARCHQ=e.target.value; clearTimeout(t); t=setTimeout(()=>runSearch(SEARCHQ),350); };
  if($("clearsearch"))$("clearsearch").onclick=()=>{SEARCHQ="";SEARCH_RESULTS=null;renderBoard(u);};
  $("bellbtn").onclick=async()=>{
    BELL_OPEN=!BELL_OPEN;
    if(BELL_OPEN && NOTIF_UNREAD){ await markNotificationsRead(); }
    renderBoard(u);
  };
  document.querySelectorAll("[data-notiftask]").forEach(el=>{
    el.onclick=()=>{ if(el.dataset.notiftask) openDetail(el.dataset.notiftask); };
  });
  if($("gopast"))$("gopast").onclick=async()=>{VIEW="past"; $("app").innerHTML='<div class="spin">読み込み中…</div>'; await fetchPastMonths(); renderPast(u);};
  if($("gonotify"))$("gonotify").onclick=async()=>{VIEW="notify"; $("app").innerHTML='<div class="spin">読み込み中…</div>'; await fetchNotifySettings(); renderNotify(u);};
  if($("gocorps"))$("gocorps").onclick=()=>{VIEW="corps";renderCorps(u);};
  document.querySelectorAll("[data-corp]").forEach(c=>c.onclick=()=>{FILTER.corp=c.dataset.corp||null;renderBoard(u);});
  document.querySelectorAll("[data-freq]").forEach(c=>c.onclick=()=>{FILTER.freq=c.dataset.freq||null;renderBoard(u);});
  $("assigneesel").onchange=e=>{FILTER.assignee=e.target.value||null;renderBoard(u);};
  $("sortsel").onchange=e=>{SORT_MODE=e.target.value; localStorage.setItem("hq_sort",SORT_MODE); renderBoard(u);};
  document.querySelectorAll("[data-sig]").forEach(c=>c.onclick=()=>{
    const v=c.dataset.sig; FILTER.signal=FILTER.signal===v?null:v; renderBoard(u);
  });
  document.querySelectorAll("[data-open]").forEach(c=>c.onclick=()=>openDetail(c.dataset.open));
  $("gorepeat").onclick=()=>{VIEW="repeat";renderRepeat(u);};
  $("godaily").onclick=async()=>{VIEW="daily"; $("app").innerHTML='<div class="spin">読み込み中…</div>'; await fetchDaily(); renderDaily(u);};
  if($("gotpl"))$("gotpl").onclick=async()=>{VIEW="templates"; $("app").innerHTML='<div class="spin">読み込み中…</div>'; await fetchTemplates(); renderTemplates(u);};
  if($("newtask"))$("newtask").onclick=()=>{VIEW="new";renderNew(u);};
}

function stepOrGroupHtml(t,g,u){

    return (sa?sa.store_no:"").localeCompare(sb?sb.store_no:"");
  });
  const doneCount=sorted.filter(r=>r.completed_at).length;
  const first=sorted[0];
  return `<div class="step">
    <div style="padding:10px 12px 4px;font-weight:600">🏪 ${esc(first.title)} — ${doneCount}/${sorted.length}</div>

      const photos=stepPhotosFor(t,s.id);
      if(s.completed_at){
        const badge=s.judgement==="issue"?`<span style="color:var(--stall)">⚠ 異常あり</span>`:(s.is_binary?`<span style="color:var(--ok)">✓ OK</span>`:"✓");
        return `<div class="storecheck-row"><span style="flex:1">${esc(name)}</span>${badge}<span class="meta">${esc(s.issue_note||"—")}</span>${canTouch?`<button class="linkbtn" data-stepundo="${s.id}">↩️</button>`:""}</div>`;
      }
      if(!canTouch) return `<div class="storecheck-row"><span style="flex:1">${esc(name)}</span><span class="meta">担当: ${esc(userName(s.assignee_id)||"未定")}</span></div>`;
      const open=OPEN_STEP===s.id;
      return `<div style="border-bottom:1px solid var(--line)">
        <div class="storecheck-row" data-stepopen="${s.id}" style="cursor:pointer">
          <span style="flex:1">${esc(name)}</span><span>${open?"▲":"▼"}</span>
        </div>
        ${open?`<div class="step-body" style="padding-bottom:10px">
          ${s.is_binary?`<label>判定</label><select id="judge-${s.id}"><option value="">選択してください</option><option value="ok">OK</option><option value="issue">異常あり</option></select>
            <div id="issuewrap-${s.id}" style="display:none"><label>異常メモ（必須）</label><textarea id="issuenote-${s.id}" rows="2"></textarea></div>`:""}
          ${s.requires_photo?`<label>写真（必須）</label><input type="file" accept="image/*" capture="environment" id="stepphoto-${s.id}">

          <div class="err" id="stepmsg-${s.id}"></div>
        </div>`:""}
      </div>`;
    }).join("")}
    </div>
  </div>`;
}

      const payload={completed_at:new Date().toISOString()};
      if(step.is_binary){
        const jv=$("judge-"+sid).value;
        if(!jv){msg.textContent="判定を選択してください";return;}
        payload.judgement=jv;
        if(jv==="issue"){ const note=$("issuenote-"+sid).value.trim(); if(!note){msg.textContent="異常メモを入力してください";return;} payload.issue_note=note; }
      }
      btn.disabled=true; msg.textContent="処理中…";
      try{
        if(step.requires_photo){
          const fi=$("stepphoto-"+sid); const existing=stepPhotosFor(t,sid).length;
          if(fi&&fi.files[0]){
            const path=await uploadPhoto(fi.files[0]);
            await authed("/rest/v1/hq_task_photos",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({step_id:sid,storage_path:path,uploaded_by:ME.id})});
          } else if(!existing){ btn.disabled=false; msg.textContent="写真を選択してください"; return; }
        }
        const r=await authed(`/rest/v1/hq_task_steps?id=eq.${sid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(payload)});
        if(!r.ok){ msg.textContent="完了にできませんでした（"+(r.status===409||r.status===400?"入力を確認してください":r.status)+"）"; btn.disabled=false; return; }
        await logActivity(t.id,"step_complete",`工程「${step.title}」完了`+(payload.issue_note?` — 異常あり: ${payload.issue_note}`:""),sid);
        await notifyStepEvent(sid,"step_complete");
        if(payload.judgement==="issue") await notifyStepEvent(sid,"issue_reported");
      }catch(e){ msg.textContent="エラー: "+e.message; btn.disabled=false; return; }
      OPEN_STEP=null; CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    };
  });
  const kindSel=$("lk-kind");
  if(kindSel) kindSel.onchange=()=>{
    $("lk-urlwrap").style.display=kindSel.value==="url"?"block":"none";
    $("lk-refwrap").style.display=kindSel.value!=="url"?"block":"none";
  };
  if($("lk-add")) $("lk-add").onclick=async()=>{
    const kind=$("lk-kind").value, label=$("lk-label").value.trim();
    if(!label){$("lk-msg").textContent="ラベルを入力してください";return}
    const payload={task_id:t.id,kind,label,created_by:ME.id};
    if(kind==="url") payload.url=$("lk-url").value.trim();
    else payload.manual_ref=$("lk-ref").value.trim()||null, payload.credential_ref=kind==="credential"?($("lk-ref").value.trim()||null):null;
    $("lk-msg").textContent="追加中…";
    const r=await authed("/rest/v1/hq_task_links",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(payload)});
    if(!r.ok){$("lk-msg").textContent="追加できませんでした";return}
    await logActivity(t.id,"comment",`リンク追加: ${label}`);
    CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
  };
  document.querySelectorAll("[data-dellink]").forEach(b=>b.onclick=async()=>{
    if(!confirm("このリンクを削除しますか？"))return;
    await authed(`/rest/v1/hq_task_links?id=eq.${b.dataset.dellink}`,{method:"DELETE"});
    CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
  });
  if($("taskphoto")) $("taskphoto").onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    const msg=$("taskphotomsg"); msg.textContent="アップロード中…";
    try{
      const path=await uploadPhoto(f);
      const r=await authed("/rest/v1/hq_task_photos",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({task_id:t.id,storage_path:path,uploaded_by:ME.id})});
      if(!r.ok){msg.textContent="登録に失敗しました";return}
      await logActivity(t.id,"photo","写真を追加");
      CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    }catch(err){ msg.textContent="エラー: "+err.message; }
  };
}

function renderNewSteps(){
  $("nt-steps").innerHTML=NEW_STEPS.map((s,i)=>`
    <div class="stepform-row" data-idx="${i}">
      <div class="f"><label>工程名</label><input class="ns-title" value="${esc(s.title)}" placeholder="例: 見積回収"></div>

  });

async function submitNewTask(u){
  const title=$("nt-title").value.trim();
  const msg=$("nt-msg"); msg.className="err"; msg.textContent="";
  if(!title){msg.textContent="タイトルを入力してください";return}
  const steps=NEW_STEPS.filter(s=>s.title.trim());
  if(!steps.length){msg.textContent="工程を1つ以上入力してください";return}
  const corp=$("nt-corp").value, target_date=$("nt-target").value||todayStr();
  const visibility=$("nt-vis").value;
  const dueSorted=steps.filter(s=>s.due_date).sort((a,b)=>(a.due_date+(a.due_time||"23:59")).localeCompare(b.due_date+(b.due_time||"23:59")));
  const lastDue=dueSorted[dueSorted.length-1]||null;
  const due_date=lastDue?lastDue.due_date:null, due_time=lastDue?(lastDue.due_time||null):null;
  $("nt-send").disabled=true; msg.textContent="作成中…";
  const tr=await authed("/rest/v1/hq_tasks",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({
    title,corp,freq:"once",target_date,due_date,due_time,notes:$("nt-notes").value.trim(),visibility,created_by:ME.id
  })});
  if(!tr.ok||!tr.body||!tr.body[0]){ msg.textContent="作成できませんでした（"+tr.status+"）"; $("nt-send").disabled=false; return; }
  const taskId=tr.body[0].id;
  await authed("/rest/v1/hq_task_steps",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(
    steps.map((s,i)=>({task_id:taskId,title:s.title.trim(),assignee_id:s.assignee_id||null,due_date:s.due_date||null,due_time:s.due_time||null,sort_order:(i+1)*10,kind:"step"}))
  )});
  if(visibility==="members"){
    const sel=[...$("nt-members").selectedOptions].map(o=>o.value);
    if(sel.length) await authed("/rest/v1/hq_task_members",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(sel.map(uid=>({task_id:taskId,user_id:uid})))});
  }
  await logActivity(taskId,"create",`${u.name}さんが単発タスクを作成`);
  await fetchBoard();
  openDetail(taskId);
}

/* ---------- 今日の毎日タスク（シンプルUI・第2.5章） ---------- */
let DAILY_TASKS=[];
let OPEN_DAILY=null;
let DAILY_MINE=false;
async function fetchDaily(){
  const today=todayStr();
  const r=await authed(`/rest/v1/hq_tasks?freq=eq.daily&or=(target_date.eq.${today},status.neq.done)&select=*,hq_task_steps(*)&order=target_date.asc`);
  DAILY_TASKS=(r.ok&&Array.isArray(r.body))?r.body:[];
}
function groupStoreSteps(steps){
  const map=new Map(), order=[];
  steps.forEach(s=>{
    const key=(s.store_id&&s.template_step_id)?("g:"+s.template_step_id):("s:"+s.id);
    if(!map.has(key)){ map.set(key,{isGroup:!!(s.store_id&&s.template_step_id),rows:[],sort_order:s.sort_order}); order.push(key); }
    map.get(key).rows.push(s);
  });
  return order.map(k=>map.get(k)).sort((a,b)=>a.sort_order-b.sort_order);
}
async function ensureTodayGenerated(){
  try{ await authed("/rest/v1/rpc/hq_generate_today",{method:"POST",body:JSON.stringify({})}); }catch(e){}
}
function renderDaily(u){
  const today=todayStr();
  const todays=DAILY_TASKS.filter(t=>t.target_date===today);
  const pastDue=DAILY_TASKS.filter(t=>t.target_date<today && t.status!=="done");
  const visible=t=>!DAILY_MINE || sortedSteps(t).some(s=>s.assignee_id===u.id) || t.created_by===u.id;
  const todaysV=todays.filter(visible), pastV=pastDue.filter(visible);
  const doneCount=todaysV.filter(t=>t.status==="done").length;
  const d=new Date(today+"T00:00:00");
  const wd=["日","月","火","水","木","金","土"][d.getDay()];
  $("app").innerHTML=`
  <div class="topbar"><h1>今日の毎日タスク ${d.getMonth()+1}/${d.getDate()}(${wd})</h1><div class="who"><button class="linkbtn" id="back">← ボードへ戻る</button></div></div>
  <div class="toprow"><div><b>${doneCount}/${todaysV.length} 完了</b></div>
    <div class="chiprow"><span class="chip ${!DAILY_MINE?'active':''}" id="dm-all">全員分</span><span class="chip ${DAILY_MINE?'active':''}" id="dm-mine">👤 自分の分</span></div>
  </div>
  ${pastV.length?`<div class="notes-box" style="margin-bottom:14px">🌅 休み明けです。${pastV.length}件たまっています。今日中に完了すればすべて「期限内」になります。</div>`:""}
  <div id="daily-list">
    ${pastV.map(t=>dailyRowHtml(t,u,true)).join("")}
    ${todaysV.map(t=>dailyRowHtml(t,u,false)).join("")||'<div class="card">今日の毎日タスクはありません</div>'}
  </div>`;
  $("back").onclick=()=>{VIEW="board";renderBoard(u);};
  $("dm-all").onclick=()=>{DAILY_MINE=false;renderDaily(u);};
  $("dm-mine").onclick=()=>{DAILY_MINE=true;renderDaily(u);};
  wireDaily(u);
}
function dailyRowHtml(t,u,isPast){
  const steps=sortedSteps(t);
  const groups=groupStoreSteps(steps);
  const done=steps.filter(s=>s.completed_at).length;
  const open=OPEN_DAILY===t.id;
  return `<div class="step ${t.status==='done'?'':'cur'}" style="margin-bottom:10px">
    <div class="row1" data-dailyopen="${t.id}">
      <span class="ic">${t.status==="done"?"✓":"▶"}</span>
      <div class="st">${esc(t.title)}${isPast?`<span class="tag" style="margin-left:6px">${fmtD(t.target_date)}分</span>`:""}
        <div class="meta">${done}/${steps.length} 完了${t.due_date?" ／ 期限 "+fmtDD(t.due_date,t.due_time):""}</div>
      </div>
      <span>${open?"▲":"▼"}</span>
    </div>
    ${open?`<div class="step-body">
      ${t.notes?`<div class="notes-box" style="margin-bottom:10px">📖 ${esc(t.notes)}</div>`:""}
      ${(t._links||[]).map(l=>linkHtml(l,false)).join("")}
      ${groups.map(g=>dailyGroupHtml(g,u)).join("")}
    </div>`:""}
  </div>`;
}
function dailyGroupHtml(g,u){
  const canDo=s=>canManage(u)||s.assignee_id===u.id||!s.assignee_id;
  if(!g.isGroup){
    const s=g.rows[0];
    if(s.completed_at){
      return `<div class="storecheck-row"><span>✓</span><span style="flex:1">${esc(s.title)}</span><span class="meta">${esc(userName(s.completed_by))} ／ ${fmtDT(s.completed_at)}</span>${canDo(s)?`<button class="linkbtn" data-stepundo="${s.id}">↩️ 取り消す</button>`:""}</div>`;
    }
    if(!canDo(s)) return `<div class="storecheck-row"><span>○</span><span style="flex:1">${esc(s.title)}</span><span class="meta">担当: ${esc(userName(s.assignee_id)||"未定")}</span></div>`;
    return `<div class="card" style="margin:8px 0">
      <div style="margin-bottom:6px">${esc(s.title)}${s.due_date?` <span class="meta">期限 ${fmtDD(s.due_date,s.due_time)}</span>`:""}</div>
      ${s.is_binary?`<label>判定</label><select id="djudge-${s.id}"><option value="">選択してください</option><option value="ok">OK</option><option value="issue">異常あり</option></select>
        <div id="dissuewrap-${s.id}" style="display:none"><label>異常メモ（必須）</label><textarea id="dissuenote-${s.id}" rows="2"></textarea></div>`:""}
      ${s.requires_photo?`<label>写真（必須）</label><input type="file" accept="image/*" capture="environment" id="dphoto-${s.id}">`:""}
      <button class="btn sm" style="margin-top:8px" data-dcomplete="${s.id}">完了にする</button>
      <div class="err" id="dmsg-${s.id}"></div>
    </div>`;
  }
  const allDone=g.rows.every(r=>r.completed_at);
  return `<div style="margin:10px 0">
    <div style="font-weight:600;margin-bottom:4px">🏪 店舗別チェック</div>
    <div class="card">
    ${g.rows.map(s=>{
      const store=STORES.find(x=>x.id===s.store_id);
      const name=store?store.name:"店舗";
      if(s.completed_at){
        const okBadge=s.judgement==="issue"?`<span style="color:var(--stall)">⚠ 異常あり</span>`:(s.is_binary?`<span style="color:var(--ok)">✓ OK</span>`:"✓");
        return `<div class="storecheck-row"><span style="flex:1">${esc(name)}</span>${okBadge}<span class="meta">${esc(s.issue_note||"—")}</span>${canDo(s)?`<button class="linkbtn" data-stepundo="${s.id}">↩️</button>`:""}</div>`;
      }
      if(!canDo(s)) return `<div class="storecheck-row"><span style="flex:1">${esc(name)}</span><span class="meta">未確認</span></div>`;
      return `<div class="storecheck-row" style="flex-wrap:wrap">
        <span style="flex:1">${esc(name)}</span>
        <select id="djudge-${s.id}" style="width:auto"><option value="">選択</option><option value="ok">OK</option><option value="issue">異常あり</option></select>
        <input type="text" id="dissuenote-${s.id}" placeholder="異常メモ必須" style="width:auto;display:none">
        ${s.requires_photo?`<input type="file" accept="image/*" capture="environment" id="dphoto-${s.id}" style="width:auto">`:""}
        <button class="btn sm" data-dcomplete="${s.id}">確定</button>
      </div>`;
    }).join("")}
    </div>
    ${allDone?"":'<div class="meta" style="margin-top:4px">※ 全店舗に「OK／異常あり」を付けるまでこのタスクは完了になりません（まとめてチェック不可）</div>'}
  </div>`;
}
function wireDaily(u){
  document.querySelectorAll("[data-dailyopen]").forEach(el=>{
    el.onclick=async()=>{
      const id=el.dataset.dailyopen;
      if(OPEN_DAILY===id){ OPEN_DAILY=null; renderDaily(u); return; }
      OPEN_DAILY=id;
      const t=DAILY_TASKS.find(x=>x.id===id);
      if(t&&!t._links){ const r=await authed(`/rest/v1/hq_task_links?task_id=eq.${id}&order=created_at`); t._links=r.ok?r.body:[]; }
      renderDaily(u);
    };
  });
  document.querySelectorAll("select[id^='djudge-']").forEach(sel=>{
    sel.onchange=()=>{
      const sid=sel.id.replace("djudge-","");
      const w=$("dissuewrap-"+sid); if(w) w.style.display=sel.value==="issue"?"block":"none";
      const inline=$("dissuenote-"+sid); if(inline&&!w) inline.style.display=sel.value==="issue"?"inline-block":"none";
    };
  });
  document.querySelectorAll("[data-stepundo]").forEach(btn=>{
    btn.onclick=async()=>{
      const sid=btn.dataset.stepundo;
      let step=null,parentTask=null;
      for(const t2 of DAILY_TASKS){ const s=sortedSteps(t2).find(x=>x.id===sid); if(s){step=s;parentTask=t2;break;} }
      if(!step)return;
      const r=await authed(`/rest/v1/hq_task_steps?id=eq.${sid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({completed_at:null,judgement:null,issue_note:null})});
      if(!r.ok){ alert("取り消せませんでした（権限がない可能性があります）"); return; }
      await logActivity(parentTask.id,"step_reopen",`「${step.title}」の完了を取り消し`,sid);
      await fetchDaily(); renderDaily(u);
    };
  });
  document.querySelectorAll("[data-dcomplete]").forEach(btn=>{
    btn.onclick=async()=>{
      const sid=btn.dataset.dcomplete;
      let step=null,parentTask=null;
      for(const t of DAILY_TASKS){ const s=sortedSteps(t).find(x=>x.id===sid); if(s){step=s;parentTask=t;break;} }
      if(!step)return;
      const payload={completed_at:new Date().toISOString()};
      if(step.is_binary){
        const jv=$("djudge-"+sid)?.value;
        if(!jv){ alert("判定（OK・異常あり）を選択してください"); return; }
        payload.judgement=jv;
        if(jv==="issue"){
          const note=($("dissuenote-"+sid)?.value||"").trim();
          if(!note){ alert("異常メモを入力してください"); return; }
          payload.issue_note=note;
        }
      }
      btn.disabled=true;
      try{
        if(step.requires_photo){
          const fi=$("dphoto-"+sid);
          if(fi&&fi.files[0]){
            const path=await uploadPhoto(fi.files[0]);
            await authed("/rest/v1/hq_task_photos",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({step_id:sid,storage_path:path,uploaded_by:ME.id})});
          } else { alert("写真を選択してください"); btn.disabled=false; return; }
        }
        const r=await authed(`/rest/v1/hq_task_steps?id=eq.${sid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(payload)});
        if(!r.ok){ alert("完了にできませんでした"); btn.disabled=false; return; }
        await logActivity(parentTask.id,"step_complete",`「${step.title}」完了`+(payload.issue_note?` — 異常あり: ${payload.issue_note}`:""),sid);
        await notifyStepEvent(sid,"step_complete");
        if(payload.judgement==="issue") await notifyStepEvent(sid,"issue_reported");
      }catch(e){ alert("エラー: "+e.message); btn.disabled=false; return; }
      await fetchDaily(); renderDaily(u);
    };
  });
}

function tplRowHtml(tpl){
  const freqLabel = tpl.freq==="weekly" ? `毎週${["日","月","火","水","木","金","土"][tpl.weekly_dow]}曜`
    : tpl.freq==="monthly" ? `毎月${tpl.monthly_dom}日` : FREQ_LABEL[tpl.freq];
  return `<div class="card" style="margin-bottom:10px">
    <div class="badges"><span class="tag">${esc(tpl.corp)}</span><span class="tag freq">🔁 ${esc(freqLabel)}</span>${tpl.is_active?"":'<span class="tag">停止中</span>'}</div>
    <div style="font-weight:600;margin:4px 0">${esc(tpl.title)}</div>
    <div class="meta">期限: 対象日+${tpl.due_offset_days}日 ／ 公開範囲: ${tpl.visibility==="all"?"本部全員":"指定した人だけ"}</div>
    <button class="linkbtn" data-tpledit="${tpl.id}">編集</button>
    <button class="linkbtn" data-tpldel="${tpl.id}">削除</button>
  </div>`;
}
async function openTplEdit(u,tpl){
  TPL_EDIT=tpl?{...tpl}:null;
  if(tpl){
    const r=await authed(`/rest/v1/hq_task_template_steps?template_id=eq.${tpl.id}&order=sort_order`);
    TPL_STEPS=(r.ok&&Array.isArray(r.body))?r.body:[];
    if(tpl.visibility==="members"){
      const rm=await authed(`/rest/v1/hq_task_members?template_id=eq.${tpl.id}&select=user_id`);
      TPL_EDIT._members=(rm.ok&&Array.isArray(rm.body))?rm.body.map(x=>x.user_id):[];
    } else TPL_EDIT._members=[];
  } else {
    TPL_STEPS=[{title:"",assignee_id:"",offset_days:0,due_time:"",kind:"step",store_scope:"",is_binary:false,requires_photo:false}];
  }
  renderTplEdit(u);
}

async function saveTemplate(u){
  const title=$("tp-title").value.trim();
  const msg=$("tp-msg"); msg.className="err"; msg.textContent="";
  if(!title){msg.textContent="タイトルを入力してください";return}
  const steps=TPL_STEPS.filter(s=>s.title.trim());
  if(!steps.length){msg.textContent="工程を1つ以上入力してください";return}
  const freq=$("tp-freq").value;
  const payload={
    title, corp:$("tp-corp").value, freq,
    weekly_dow: freq==="weekly"?+$("tp-dow").value:null,
    monthly_dom: freq==="monthly"?+$("tp-dom").value:null,
    due_offset_days: +$("tp-offset").value||0,
    due_time: $("tp-duetime").value||null,
    notes: $("tp-notes").value.trim(),
    visibility: $("tp-vis").value,
    alert_before3: $("tp-a3").checked, alert_before1: $("tp-a1").checked, alert_due: $("tp-a0").checked, alert_overdue_daily: $("tp-aod").checked,
    alert_recipient: $("tp-recipient").value,
    alert_channels: [$("tp-cin").checked?"inapp":null, $("tp-clark").checked?"lark":null].filter(Boolean),
    created_by: ME.id,
  };
  $("tp-save").disabled=true; msg.textContent="保存中…";
  let tplId=TPL_EDIT&&TPL_EDIT.id;
  let r;
  if(tplId){
    r=await authed(`/rest/v1/hq_task_templates?id=eq.${tplId}`,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify({...payload,updated_at:new Date().toISOString()})});
  } else {
    r=await authed("/rest/v1/hq_task_templates",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(payload)});
  }
  if(!r.ok||!r.body||!r.body[0]){ msg.textContent="保存できませんでした（"+r.status+"）"; $("tp-save").disabled=false; return; }
  tplId=r.body[0].id;
  if(TPL_EDIT&&TPL_EDIT.id){
    await authed(`/rest/v1/hq_task_template_steps?template_id=eq.${tplId}`,{method:"DELETE"});
  }
  await authed("/rest/v1/hq_task_template_steps",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(
    steps.map((s,i)=>({template_id:tplId,title:s.title.trim(),assignee_id:s.assignee_id||null,offset_days:s.offset_days||0,due_time:s.due_time||null,sort_order:(i+1)*10,kind:s.kind||"step",store_scope:s.store_scope||null,is_binary:!!s.is_binary,requires_photo:!!s.requires_photo}))
  )});
  await authed(`/rest/v1/hq_task_members?template_id=eq.${tplId}`,{method:"DELETE"});
  if(payload.visibility==="members"){
    const sel=[...$("tp-members").selectedOptions].map(o=>o.value);
    if(sel.length) await authed("/rest/v1/hq_task_members",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(sel.map(uid=>({template_id:tplId,user_id:uid})))});
  }
  await fetchTemplates();
  VIEW="templates"; renderTemplates(u);
}

/* ---------- 通知（アプリ内ベル・Lark） ---------- */
async function fetchNotifications(){
  const r=await authed(`/rest/v1/hq_notifications?recipient_id=eq.${ME.id}&order=created_at.desc&limit=30`);
  NOTIFICATIONS=(r.ok&&Array.isArray(r.body))?r.body:[];
  NOTIF_UNREAD=NOTIFICATIONS.filter(n=>!n.read_at).length;
}
async function markNotificationsRead(){
  const unreadIds=NOTIFICATIONS.filter(n=>!n.read_at).map(n=>n.id);
  if(!unreadIds.length)return;
  await authed(`/rest/v1/hq_notifications?id=in.(${unreadIds.join(",")})`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({read_at:new Date().toISOString()})});
  NOTIFICATIONS.forEach(n=>{ if(!n.read_at) n.read_at=new Date().toISOString(); });
  NOTIF_UNREAD=0;
}
async function sendLark(items){
  for(const it of (items||[])){
    if(!it||!it.webhook_url) continue;
    const text=(it.keyword?`[${it.keyword}] `:"")+it.title+(it.body?`\n${it.body}`:"");
    try{ await fetch(it.webhook_url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({msg_type:"text",content:{text}})}); }
    catch(e){ /* Lark送信の失敗は握りつぶす（アプリ内通知は既に記録済み） */ }
  }
}
async function notifyStepEvent(stepId,event){
  const r=await authed("/rest/v1/rpc/hq_notify_step_event",{method:"POST",body:JSON.stringify({p_step_id:stepId,p_event:event})});
  if(r.ok&&Array.isArray(r.body)) await sendLark(r.body);
}
async function runAlertChecks(){
  try{
    const r=await authed("/rest/v1/rpc/hq_check_alerts",{method:"POST",body:JSON.stringify({})});
    if(r.ok&&Array.isArray(r.body)) await sendLark(r.body);
  }catch(e){}
}

/* ---------- 通知設定（チャンネル登録・ルール） ---------- */
let NOTIFY_CHANNELS=[];
let NOTIFY_RULES=[];
const EVENT_LABEL={due_alert:"期限アラート（3日前・前日・当日・超過）",stalled:"⏸ 3日以上停止",step_complete:"工程完了のたび",issue_reported:"異常ありが付いたとき"};
async function fetchNotifySettings(){
  const [c,r]=await Promise.all([
    authed("/rest/v1/hq_notify_channels?select=*&order=created_at"),
    authed("/rest/v1/hq_notify_rules?select=*&order=sort_order"),
  ]);
  NOTIFY_CHANNELS=(c.ok&&Array.isArray(c.body))?c.body:[];
  NOTIFY_RULES=(r.ok&&Array.isArray(r.body))?r.body:[];
}

function chRowHtml(c){
  return `<div class="link-row"><span>${c.kind==="lark_webhook"?"💬":"🔔"}</span><div style="flex:1">${esc(c.name)}${c.kind==="lark_webhook"?` <span class="meta">Lark Webhook${c.keyword?"／キーワード: "+esc(c.keyword):""}</span>`:' <span class="meta">アプリ内通知</span>'}</div><button class="linkbtn" data-chdel="${c.id}">削除</button></div>`;
}
function ruleRowHtml(r){
  const chNames=(r.channel_ids||[]).map(id=>{const c=NOTIFY_CHANNELS.find(x=>x.id===id);return c?c.name:"?"}).join("、");
  const target=[r.target_corp||"すべての法人",r.target_freq?FREQ_LABEL[r.target_freq]:"すべての頻度"].join(" ／ ");
  return `<div class="link-row"><div style="flex:1"><b>${esc(r.name)}</b><div class="meta">${esc(target)} ／ ${esc(EVENT_LABEL[r.event]||r.event)} → ${esc(chNames)}</div></div><button class="linkbtn" data-ruledel="${r.id}">削除</button></div>`;
}

/* ---------- 過去タスク（月別・無期限保存） ---------- */
let PAST_MONTHS=[];
let PAST_MONTH=null;
let PAST_TASKS=[];
async function fetchPastMonths(){
  const monthStart=monthStartStr();
  const r=await authed(`/rest/v1/hq_tasks?status=eq.done&completed_at=lt.${monthStart}&select=completed_at&order=completed_at.desc&limit=1000`);
  const set=new Set();
  if(r.ok&&Array.isArray(r.body)) r.body.forEach(t=>{ set.add(t.completed_at.slice(0,7)); });
  PAST_MONTHS=[...set].sort().reverse();
  if(!PAST_MONTH||!PAST_MONTHS.includes(PAST_MONTH)) PAST_MONTH=PAST_MONTHS[0]||null;
  if(PAST_MONTH) await fetchPastTasks(PAST_MONTH);
}
async function fetchPastTasks(ym){
  const start=ym+"-01";
  const d=new Date(start+"T00:00:00"); d.setMonth(d.getMonth()+1);
  const next=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-01";
  const r=await authed(`/rest/v1/hq_tasks?status=eq.done&completed_at=gte.${start}&completed_at=lt.${next}&select=*,hq_task_steps(*)&order=completed_at.desc`);
  PAST_TASKS=(r.ok&&Array.isArray(r.body))?r.body:[];
}
function renderPast(u){
  $("app").innerHTML=`
  <div class="topbar"><h1>📁 過去タスク</h1><div class="who"><button class="linkbtn" id="back">← ボードへ戻る</button></div></div>
  <div class="chiprow">${PAST_MONTHS.map(m=>`<span class="chip ${PAST_MONTH===m?'active':''}" data-month="${m}">${m.replace("-","年")}月</span>`).join("")||'<span class="meta">過去の完了タスクはまだありません</span>'}</div>
  <div class="board" style="display:block;margin-top:14px">
    ${PAST_TASKS.map(taskCardHtml).join("")||'<div class="card">この月の完了タスクはありません</div>'}
  </div>`;
  $("back").onclick=()=>{VIEW="board";renderBoard(u);};
  document.querySelectorAll("[data-month]").forEach(c=>c.onclick=async()=>{ PAST_MONTH=c.dataset.month; $("app").innerHTML='<div class="spin">読み込み中…</div>'; await fetchPastTasks(PAST_MONTH); renderPast(u); });
  document.querySelectorAll("[data-open]").forEach(c=>c.onclick=()=>openDetail(c.dataset.open));
}

/* ---------- 法人管理 ---------- */
function renderCorps(u){
  $("app").innerHTML=`
  <div class="topbar"><h1>🏢 法人管理</h1><div class="who"><button class="linkbtn" id="back">← ボードへ戻る</button></div></div>
  <div class="card">
    <div id="corps-list">${CORPS.map(c=>`<div class="link-row">
      <div style="flex:1">${esc(c.name)}${c.is_active?"":' <span class="tag">非表示</span>'}</div>
      <button class="linkbtn" data-corptoggle="${c.id}">${c.is_active?"非表示にする":"表示に戻す"}</button>
    </div>`).join("")||'<div class="meta">法人がありません</div>'}</div>
    <div style="margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)">
      <label>法人名を追加</label><input id="corp-new" placeholder="例: 新法人株式会社">
      <button class="btn sm" style="margin-top:8px" id="corp-add">追加</button>
      <div class="err" id="corp-msg"></div>
    </div>
    <div class="meta" style="margin-top:10px">非表示にした法人は新規作成時の選択肢から外れますが、既存タスクの表示・絞り込みには残ります。</div>
  </div>`;
  $("back").onclick=()=>{VIEW="board";renderBoard(u);};
  document.querySelectorAll("[data-corptoggle]").forEach(b=>b.onclick=async()=>{
    const c=CORPS.find(x=>x.id===b.dataset.corptoggle);
    await authed(`/rest/v1/hq_corps?id=eq.${c.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({is_active:!c.is_active})});
    await fetchCorps(); renderCorps(u);
  });
  $("corp-add").onclick=async()=>{
    const name=$("corp-new").value.trim();
    if(!name){$("corp-msg").textContent="法人名を入力してください";return}
    $("corp-msg").textContent="追加中…";
    const sortMax=CORPS.length?Math.max(...CORPS.map(c=>c.sort_order)):0;
    const r=await authed("/rest/v1/hq_corps",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({name,sort_order:sortMax+10})});
    if(!r.ok){$("corp-msg").textContent="追加できませんでした（同名の法人がある可能性があります）";return}
    await fetchCorps(); renderCorps(u);
  };
}

/* ---------- メイン ---------- */
function renderLogin(err){
  $("app").innerHTML=`<div class="card">
    <p style="margin-bottom:10px">ログインが必要です。ポータルからアクセスしてください。</p>
    <a class="btn" href="index.html">← ポータルへ</a>
    <div class="err">${esc(err||"")}</div>
  </div>`;
}
async function main(){
  if(!sess.get()){renderLogin();return}
  const u=await fetchMe();
  if(!u){sess.clear();renderLogin("セッションが切れました。ポータルから再度ログインしてください。");return}
  if(u.is_active===false){renderLogin("このアカウントは無効化されています。");return}
  ME=u;
  await fetchUsers(); await fetchStores(); await fetchCorps();
  await ensureTodayGenerated();
  await Promise.all([fetchBoard(), fetchNotifications()]);
  runAlertChecks();
  const openId=qs.get("task");
  if(openId){ openDetail(openId); return; }
  renderBoard(u);
}
main();
</script>
