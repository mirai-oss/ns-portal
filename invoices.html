  // （例:「雑給/04/恵比寿」）は元の行のままコピーされるが、部門プルダウンだけ正しく選び直した
  // 結果、科目名と部門が食い違ってしまうというもの。自動で直すと金額の対応関係を勝手に
  // 変えてしまう恐れがあるため、自動修正はせず、科目名と選択中の部門が食い違っていそうな
  // ときだけ⚠️で気づけるようにする（あくまで注意喚起。登録は妨げない）
  const deptMismatchWarnHtml=(label,deptId)=>{
    if(!deptId||!label||!label.includes("/")) return "";
    const dept=(PAYROLL_STATE.departments||[]).find(d=>d.id===deptId);
    if(!dept) return "";
    const deptCore=dept.name.replace(/^\d+/,"").trim();
    if(!deptCore||label.includes(deptCore)) return "";
    return `<span class="pet-warn" title="勘定科目名「${esc(label)}」と選択中の部門「${esc(dept.name)}」が一致していないかもしれません。科目名の補助科目（/以降）をご確認ください">⚠️部門と科目名が不一致かも</span>`;
  };
  const entryHtml=(b,idx)=>{
    // 表示用ラベル（初回描画時のみ）: まだ編集用ラベルが無ければ、テンプレート由来の解決済み科目名で初期化する
    if(b.debitLabel==null) b.debitLabel=b.debit?mftLabelOf(b.debit):"";
    if(b.creditLabel==null) b.creditLabel=b.credit?mftLabelOf(b.credit):"";
    // 2026-09-07書き換え：担当Bスレッド経由のユーザー要望「マネーフォワード会計と同じように、
    // 勘定科目と補助科目を別々の入力欄にしてほしい（今は『雑給/04/恵比寿』のように1つに連結されて
    // いる）」に対応。内部的には従来どおりdebitLabel/creditLabelを「勘定科目/補助科目」形式の
    // 1本の文字列として保持する（登録直前の科目解決・検算・部門不一致警告など他の処理が全てこの
    // 形式を前提にしているため、そちらは変更しない）。見た目だけ、勘定科目名（最初の"/"より前）と
    // 補助科目名（それ以降。店舗名の補助科目自体に"/"を含む場合があるため、2つ目以降の"/"は
    // 補助科目名の一部として扱う）を2つの入力欄に分けて表示し、どちらかを編集したら元の1本の
    // 文字列に組み直す（splitAccLabel()はトップレベルの共通ヘルパー。2026-09-08：請求書の
    // 仕訳作成・仕訳辞書テンプレート編集でも同じ関数を使うよう統一した）
    // 2026-09-07修正：補助科目の候補を選択中の勘定科目に連動させるため、行・借方貸方ごとに
    // 個別のdatalist要素を持たせる（勘定科目名を打ち直すたびにwireEntries側でこのdatalistの
    // 中身だけを差し替える＝入力中のフォーカスを失わせずに候補を絞り込める）
    const accInput=(side)=>{
      const {account,sub}=splitAccLabel(side==="debit"?b.debitLabel:b.creditLabel);
      const subDlId=`payroll-preview-subaccount-datalist-${idx}-${side}`;
      return `<div class="pet-acc-group">
        <input list="payroll-preview-account-datalist" class="pet-acc-main payroll-preview-accmain" data-idx="${idx}" data-side="${side}" value="${esc(account)}" placeholder="${side==="debit"?"借方":"貸方"}勘定科目（空欄可）">
        <input list="${subDlId}" class="pet-acc-sub payroll-preview-accsub" data-idx="${idx}" data-side="${side}" value="${esc(sub)}" placeholder="補助科目（任意）">
        <datalist id="${subDlId}">${subAccountOptionsHtml(account)}</datalist>
      </div>`;
    };
    const deptSelect=(side)=>`<select class="payroll-preview-dept" data-idx="${idx}" data-side="${side}">${deptOptionsHtml(side==="debit"?b.department_id:b.credit_department_id)}</select>`;
    const amtInput=(side)=>`<input type="number" class="pet-amt payroll-preview-amt" data-idx="${idx}" data-side="${side}" value="${side==="debit"?b.debitAmount:b.creditAmount}">`;
    // 2026-09-05追加：ユーザー要望「仕訳ごとに摘要を入力できるようにしてほしい」に対応。
    // 従来はb.remarkが埋まっている場合のみ読み取り専用で表示していたが、そもそも編集欄が
    // 無かった。登録時のデフォルト文言（従業員名入り）をplaceholderに出しつつ、
    // 明細行ごとに自由に上書きできるようにする
    const remarkInput=`<input class="pet-remark payroll-preview-remark" data-idx="${idx}" value="${esc(b.remark||"")}" placeholder="${esc(defaultRemark)}">`;
    // 2026-09-07書き換え：ユーザー要望「マネーフォワード会計の複合仕訳入力画面と同じような
    // 形・サイズ感・入力方法にしたい」に対応。1明細=1行、借方・貸方の科目/部門/税区分/金額を
    // 横並びにする表形式（従来は1明細ごとに「借方カード」「貸方カード」を縦に積んでいた）
    return `<tr data-row-idx="${idx}">
      <td class="pet-ins"><button type="button" data-payroll-preview-insert="${idx}" title="この下に行を追加">＋</button></td>
      <td>${accInput("debit")}</td>
      <td>${deptSelect("debit")}${deptMismatchWarnHtml(b.debitLabel,b.department_id)}</td>
      <td>${taxOptionsHtml(b.tax_id,"debit",idx)}</td>
      <td>${amtInput("debit")}</td>
      <td>${accInput("credit")}</td>
      <td>${deptSelect("credit")}${deptMismatchWarnHtml(b.creditLabel,b.credit_department_id)}</td>
      <td>${taxOptionsHtml(b.credit_tax_id,"credit",idx)}</td>
      <td>${amtInput("credit")}</td>
      <td>${remarkInput}</td>
      <td class="pet-rm">${branches.length>1?`<button data-payroll-preview-rm="${idx}" title="この行を削除">✕</button>`:""}</td>
    </tr>`;
  };
  const entries=branches.map(entryHtml).join("");

  // 2026-09-02: PDFがある場合は左にPDFプレビュー・右に仕訳内容を並べる2カラム表示に
  // （ユーザー要望「プレビューでPDFの内容も見れるように」「左にPDF・右で見ながら確認できるように」
  // 「PDFをもう少し大きく見やすく」に対応。PDF側を広めの比率にし、モーダル自体も横幅を拡大）。
  // 既に取得済みのbase64をその場でBlob URLに変換するだけなので追加の通信は発生しない
  // 複数枚ある場合は、それぞれをBlob URLに変換して1枚ずつ折りたたみ表示する
  const pdfUrls=pdfFiles.map(f=>({file_name:f.file_name,url:payrollPdfBlobUrl(f.file_data)}));
  const pdfUrl=pdfUrls[0]?pdfUrls[0].url:null;
  const {debit:initDebit,credit:initCredit}=calcTotals();
  const bodyContent=`
    ${usingDraft?`<div class="err msg-ok" style="margin-bottom:8px">📝 一時保存していた下書きから再開しました（${fmtDT(draft.updated_at)}保存分）</div>`:""}
    <div class="ai-field" style="max-width:220px;margin-bottom:10px"><small>会計計上日</small><input id="payroll-date" type="date" value="${(usingDraft&&draft.transaction_date)?draft.transaction_date:payrollLastDayOfMonth(PAYROLL_STATE.yearMonth)}"></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">対象年月: <b>${esc(PAYROLL_STATE.yearMonth)}</b>　テンプレート: <b>${esc(template.label)}</b></div>
    <div style="font-size:12px;margin-bottom:8px;color:${pdfBase64?"var(--m-green)":"var(--m-amber)"}">${pdfFiles.length>1?`📎 給与明細PDFが${pdfFiles.length}枚見つかりました。登録と同時にマネーフォワードの証憑として全て添付します`:pdfBase64?"📎 給与明細PDFが見つかりました。登録と同時にマネーフォワードの証憑として添付します":"⚠️ この従業員・この月の給与明細PDFが見つかりません（未アップロード）。証憑添付なしで登録します。上の「まとめてアップロード」から追加できます"}</div>
    <div class="mfj-balance" style="margin:0 0 10px">
      <div class="box"><small>借方合計</small><b id="payroll-preview-debit-total">${yen(initDebit)}</b></div>
      <div class="box"><small>貸方合計</small><b id="payroll-preview-credit-total">${yen(initCredit)}</b></div>
      <div class="box ${initDebit===initCredit?"ok":"ng"}" id="payroll-preview-diff-box"><small>差額</small><b id="payroll-preview-diff-amt">${yen(initDebit-initCredit)}</b></div>
    </div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:6px">💡 金額はPDFと見比べて違っていればここで直接修正できます（例: 端数調整や個別の手当漏れ等）</div>
    <datalist id="payroll-preview-acc-datalist">${PAYROLL_STATE.accountDatalistHtml||""}</datalist>
    <datalist id="payroll-preview-account-datalist">${PAYROLL_STATE.accountNameDatalistHtml||""}</datalist>
    <!-- 補助科目のdatalistは行・借方貸方ごとに個別（payroll-preview-subaccount-datalist-{idx}-{side}）に
         生成している（accInput参照）。選択中の勘定科目に応じて候補を絞り込むため -->
    <div style="margin-bottom:10px">
      <button type="button" id="payroll-voucher-toggle" style="font-size:12px">📋 伝票プレビューを見る（借方・貸方を伝票のような形で確認）</button>
      <div id="payroll-voucher-preview" hidden></div>
    </div>
    <div style="overflow-x:auto">
      <table class="payroll-edit-table">
        <thead>
          <tr><th class="pet-ins"></th><th colspan="4" class="pet-debit-head">借方</th><th colspan="4" class="pet-credit-head">貸方</th><th>摘要</th><th class="pet-rm"></th></tr>
          <tr><th></th><th>勘定科目</th><th>部門</th><th>税区分</th><th>金額</th><th>勘定科目</th><th>部門</th><th>税区分</th><th>金額</th><th></th><th></th></tr>
        </thead>
        <tbody id="payroll-preview-entries">${entries}</tbody>
      </table>
    </div>
    <div class="mail-actions" style="margin-top:6px"><button id="payroll-preview-addrow">＋ 明細行を末尾に追加</button></div>
    <div class="err" id="payrollPreviewMsg" style="margin-top:6px"></div>
    <div class="mail-actions" style="margin-top:12px">
      <button id="payrollPreviewBack">← 閉じる</button>
      <button id="payrollPreviewSaveDraft">💾 一時保存</button>
      <button class="primary" id="payrollPreviewSubmit">✅ この内容で登録</button>
    </div>
  `;
  const modal=document.createElement("div");
  modal.className="modal-bg mail-shell"; modal.id="payrollPreviewModal";
  // 2026-09-07修正：ユーザー報告「表が横幅を必要とするため、PDFと横並び（左右2カラム）だと
  // UIが崩れる（PDFが極端に細くなり、表もはみ出す）」に対応。ユーザー提案どおり、PDFと
  // 会計入力を左右ではなく上下に並べる1カラム構成に変更（PDF→折りたたみ可能な明細PDF、
  // その下に会計入力の表）。表がmin-width:1080pxを必要とするため、PDF有無どちらの場合も
  // モーダル自体の横幅を広めに確保する
  modal.innerHTML=`<div class="modal" style="max-width:${pdfUrl?"1300px":"1200px"}">
    <div class="mhead"><h2>🧾 給与仕訳プレビュー — ${esc(name)}</h2><button class="linkbtn" id="payrollPreviewClose" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px">閉じる ×</button></div>
    ${pdfUrl?`<details open style="margin-bottom:14px">
      <summary style="cursor:pointer;font-size:12px;color:var(--muted);font-weight:700">📎 給与明細PDF${pdfUrls.length>1?`（${pdfUrls.length}枚。見ながら金額を確認できます・クリックで折りたたみ）`:"（見ながら金額を確認できます・クリックで折りたたみ）"}</summary>
      ${pdfUrls.map((f,i)=>`${pdfUrls.length>1?`<div style="font-size:11px;color:var(--muted);margin-top:${i===0?"8":"14"}px">${i+1}枚目：${esc(f.file_name)}</div>`:""}<iframe src="${esc(f.url)}" title="給与明細PDF ${i+1}" style="width:100%;height:${pdfUrls.length>1?"36vh":"50vh"};border:1px solid var(--line);border-radius:8px;margin-top:4px"></iframe>`).join("")}
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button id="payroll-preview-ocr">🤖 AIで事業所別の金額・交通費を読み取る（参考値）</button>
        <button id="payroll-preview-autogen" title="スマレジの支給額合計・控除内訳（sf_payroll_sync）を正として、PDFのAI読み取り結果と検算したうえで、一致する場合のみ仕訳の借方・貸方を自動で組み立てます">🧮 AIで仕訳を自動生成する（検算OKの場合のみ）</button>
      </div>
      <div id="payroll-preview-ocr-result" style="margin-top:6px"></div>
      <div id="payroll-preview-autogen-result" style="margin-top:6px"></div>
    </details>${bodyContent}`:bodyContent}
  </div>`;
  document.body.appendChild(modal);
  pushNav({modal:true});
  modal.onclick=e=>{ if(e.target===modal) history.back(); };
  if(pdfUrls.length){
    const revoke=()=>pdfUrls.forEach(f=>URL.revokeObjectURL(f.url));
    $("payrollPreviewClose").addEventListener("click",revoke);
    $("payrollPreviewBack").addEventListener("click",revoke);
  }
  $("payrollPreviewClose").onclick=()=>history.back();
  $("payrollPreviewBack").onclick=()=>history.back();
  // 差額表示の更新（金額編集のたびに呼ぶ）
  const refreshTotals=()=>{
    const t=calcTotals();
    $("payroll-preview-debit-total").textContent=yen(t.debit);
    $("payroll-preview-credit-total").textContent=yen(t.credit);
    $("payroll-preview-diff-amt").textContent=yen(t.debit-t.credit);
    $("payroll-preview-diff-box").className=`box ${t.debit===t.credit?"ok":"ng"}`;
    refreshVoucherPreview();
  };
  // 2026-09-05新規：ユーザー要望「仕訳の内容（借方・貸方）自体を、フォーム入力欄の羅列ではなく
  // 伝票のような読みやすい形で確認できるプレビューが欲しい」に対応。上の入力フォームとは別に、
  // 現在の入力内容をそのまま「借方｜貸方」の伝票形式の表で読み取り専用表示するだけの機能
  // （マネーフォワードへの登録内容自体には影響しない、あくまで見た目の確認用）
  const refreshVoucherPreview=()=>{
    const box=$("payroll-voucher-preview");
    if(!box||box.hidden) return;
    const deptName=id=>id?(((PAYROLL_STATE.departments||[]).find(d=>d.id===id)||{}).name||""):"";
    const rowsHtml=branches.map((b,i)=>{
      const debitOn=!!(b.debitLabel&&Number(b.debitAmount)>0), creditOn=!!(b.creditLabel&&Number(b.creditAmount)>0);
      if(!debitOn&&!creditOn) return "";
      return `<tr>
        <td style="padding:6px 8px;border:1px solid var(--line)">${debitOn?esc(b.debitLabel):""}</td>
        <td style="padding:6px 8px;border:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums">${debitOn?yen(b.debitAmount):""}</td>
        <td style="padding:6px 8px;border:1px solid var(--line);font-size:11px;color:var(--muted)">${debitOn?esc(deptName(b.department_id)):""}</td>
        <td style="padding:6px 8px;border:1px solid var(--line)">${creditOn?esc(b.creditLabel):""}</td>
        <td style="padding:6px 8px;border:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums">${creditOn?yen(b.creditAmount):""}</td>
        <td style="padding:6px 8px;border:1px solid var(--line);font-size:11px;color:var(--muted)">${creditOn?esc(deptName(b.credit_department_id)):""}</td>
        <td style="padding:6px 8px;border:1px solid var(--line);font-size:11px;color:var(--muted)">${esc(b.remark||defaultRemark)}</td>
      </tr>`;
    }).join("");
    const t=calcTotals();
    box.innerHTML=`<div style="overflow-x:auto;margin-top:6px">
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:var(--panel-2,#f5f5f5)">
          <th colspan="3" style="padding:6px 8px;border:1px solid var(--line)">借方</th>
          <th colspan="3" style="padding:6px 8px;border:1px solid var(--line)">貸方</th>
          <th style="padding:6px 8px;border:1px solid var(--line)">摘要</th>
        </tr></thead>
        <tbody>${rowsHtml||`<tr><td colspan="7" style="padding:8px;text-align:center;color:var(--muted)">まだ入力がありません</td></tr>`}</tbody>
        <tfoot><tr style="font-weight:700">
          <td style="padding:6px 8px;border:1px solid var(--line)">合計</td>
          <td style="padding:6px 8px;border:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums">${yen(t.debit)}</td>
          <td style="padding:6px 8px;border:1px solid var(--line)"></td>
          <td style="padding:6px 8px;border:1px solid var(--line)">合計</td>
          <td style="padding:6px 8px;border:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums">${yen(t.credit)}</td>
          <td colspan="2" style="padding:6px 8px;border:1px solid var(--line)"></td>
        </tr></tfoot>
      </table>
    </div>`;
  };
  $("payroll-voucher-toggle").onclick=()=>{
    const box=$("payroll-voucher-preview");
    box.hidden=!box.hidden;
    $("payroll-voucher-toggle").textContent=box.hidden?"📋 伝票プレビューを見る（借方・貸方を伝票のような形で確認）":"📋 伝票プレビューを閉じる";
    if(!box.hidden) refreshVoucherPreview();
  };
  // entries部分の再描画（明細行の追加・削除のたびに呼ぶ）＋配線のやり直し
  const rerenderEntries=()=>{
    $("payroll-preview-entries").innerHTML=branches.map(entryHtml).join("");
    wireEntries();
    refreshTotals();
  };
  function wireEntries(){
    // 2026-09-02: 金額を直接編集できるように。編集のたびに合計・差額表示をその場で更新する
    document.querySelectorAll(".payroll-preview-amt").forEach(el=>el.oninput=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      const val=Number(el.value)||0;
      if(side==="debit") branches[idx].debitAmount=val; else branches[idx].creditAmount=val;
      refreshTotals();
    });
    // 2026-09-07書き換え：勘定科目・補助科目の入力欄を分けたことに伴い、どちらかを編集したら
    // 同じ行のもう片方の欄の値と組み合わせて、内部で使う1本の文字列（debitLabel/creditLabel、
    // 「勘定科目/補助科目」形式）へ書き戻す。空欄にするとその側は合計から除外される＝refreshTotals()で反映
    const combineAccLabel=(idx,side)=>{
      const row=document.querySelector(`tr[data-row-idx="${idx}"]`);
      if(!row) return "";
      const main=row.querySelector(`.payroll-preview-accmain[data-side="${side}"]`);
      const sub=row.querySelector(`.payroll-preview-accsub[data-side="${side}"]`);
      const mainVal=(main&&main.value||"").trim(), subVal=(sub&&sub.value||"").trim();
      return subVal?`${mainVal}/${subVal}`:mainVal;
    };
    // 勘定科目（主）の入力：内部のラベル文字列を組み直すのに加え、ユーザー報告「マネーフォワードの
    // ように、補助科目の候補は選んだ勘定科目に登録済みのものだけに絞り込んでほしい」に対応するため、
    // 同じ行の補助科目datalistの中身をその場で差し替える（rerenderEntries()で全体を作り直すと、
    // 入力中のテキスト欄がフォーカスを失いカーソル位置も飛んでしまうため、datalistの中身だけを
    // ピンポイントで更新する）
    document.querySelectorAll(".payroll-preview-accmain").forEach(el=>el.oninput=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      const label=combineAccLabel(idx,side);
      if(side==="debit") branches[idx].debitLabel=label; else branches[idx].creditLabel=label;
      const dl=document.getElementById(`payroll-preview-subaccount-datalist-${idx}-${side}`);
      if(dl) dl.innerHTML=subAccountOptionsHtml(el.value);
      refreshTotals();
    });
    // 補助科目（従）の入力：ラベル文字列の組み直しのみ
    document.querySelectorAll(".payroll-preview-accsub").forEach(el=>el.oninput=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      const label=combineAccLabel(idx,side);
      if(side==="debit") branches[idx].debitLabel=label; else branches[idx].creditLabel=label;
      refreshTotals();
    });
    document.querySelectorAll(".payroll-preview-dept").forEach(el=>el.onchange=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      if(side==="debit") branches[idx].department_id=el.value; else branches[idx].credit_department_id=el.value;
      // 2026-09-07追加：ユーザー報告「勘定科目名と選んだ部門がずれてしまう」対応の一環。
      // 部門を変えた直後に⚠️不一致警告をその場で更新できるよう再描画する（プルダウンの
      // 選択操作自体は完了しているため、テキスト入力中と違いフォーカスを失っても実害が無い）
      rerenderEntries();
    });
    document.querySelectorAll(".payroll-preview-tax").forEach(el=>el.onchange=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      if(side==="debit") branches[idx].tax_id=el.value; else branches[idx].credit_tax_id=el.value;
    });
    // 2026-09-05追加：摘要欄の入力を保持（refreshTotals()内でrefreshVoucherPreview()も呼ばれ、伝票プレビューにも反映される）
    document.querySelectorAll(".payroll-preview-remark").forEach(el=>el.oninput=()=>{
      branches[+el.dataset.idx].remark=el.value;
      refreshTotals();
    });
    document.querySelectorAll("[data-payroll-preview-rm]").forEach(el=>el.onclick=()=>{
      branches.splice(+el.dataset.payrollPreviewRm,1);
      rerenderEntries();
    });
    // 2026-09-07追加：ユーザー要望「（末尾だけでなく）間にも行を追加できるようにしてほしい」に対応。
    // 「＋」を押した行のすぐ下に空の明細行を挿入する（末尾に足すだけの既存ボタンとは別に用意）
    document.querySelectorAll("[data-payroll-preview-insert]").forEach(el=>el.onclick=()=>{
      const idx=+el.dataset.payrollPreviewInsert;
      branches.splice(idx+1,0,{debit:null,credit:null,debitLabel:"",creditLabel:"",debitAmount:0,creditAmount:0,department_id:null,tax_id:null,credit_department_id:null,credit_tax_id:null,remark:""});
      rerenderEntries();
    });
  }
  wireEntries();
  // 2026-09-07：「参考値を読む」ボタンと「仕訳を自動生成する」ボタンの両方でPDFのAI読み取りを
  // 使うため、同じ結果を使い回せるようキャッシュする（両方押してもAI呼び出しは1回で済む）
  let storeBreakdownCache=null;
  const runStoreBreakdown=async()=>{
    if(storeBreakdownCache) return storeBreakdownCache;
    const res=await payrollExtractStoreBreakdown(pdfFiles);
    if(res.ok) storeBreakdownCache=res;
    return res;
  };
  // 2026-09-02: ユーザー要望「事業所ごとの金額と交通費だけでもOCRで読み込んで表示させることは
  // できないか」に対応。あくまで参考値の表示のみ（仕訳金額への自動反映はしない）
  if($("payroll-preview-ocr")) $("payroll-preview-ocr").onclick=async()=>{
    const btn=$("payroll-preview-ocr"), el=$("payroll-preview-ocr-result");
    btn.disabled=true; btn.textContent="読み取り中…";
    const res=await runStoreBreakdown();
    btn.disabled=false; btn.textContent="🤖 AIで事業所別の金額・交通費を読み取る（参考値）";
    if(!res.ok){ el.innerHTML=`<div class="err">⚠️ ${esc(res.error)}</div>`; return; }
    el.innerHTML=`<div class="card" style="padding:8px 10px">
      <div style="font-size:10px;color:var(--muted);margin-bottom:6px">📊 PDFから読み取った参考値です（勤務詳細表の合計）。実際の仕訳金額とは自動連携していません。ご自身で確認のうえ、必要なら上の金額欄を修正してください</div>
      <table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead><tr><th style="text-align:left;padding:3px 6px">事業所</th><th style="text-align:right;padding:3px 6px">金額合計</th><th style="text-align:right;padding:3px 6px">交通費合計</th></tr></thead>
        <tbody>${res.totals.map(t=>`<tr style="border-top:1px solid var(--line)"><td style="padding:3px 6px">${esc(t.store)}</td><td style="text-align:right;padding:3px 6px">${yen(Math.round(t.amount))}</td><td style="text-align:right;padding:3px 6px">${yen(t.commute)}</td></tr>`).join("")}</tbody>
      </table>
    </div>`;
  };
  // 2026-09-07新規：担当Bスレッドから受領した仕様「AIで支給・控除・勤務詳細を読み取り、仕訳候補を
  // 自動生成する」に対応。ただし支給テーブル・控除テーブル自体は、担当Bが検証済みと明言している
  // sf_payroll_sync（スマレジAPI由来のtotal_allowance/deduction_total/net_pay/deductions）を
  // 正とし、AIでの再読み取りはしない（同じ数字を2回読み取るのは冗長かつ余計な誤読リスクを増やすだけ
  // のため）。AIでの読み取りは、sf_payroll_syncには無い「事業所ごとの内訳」（勤務詳細表でしか
  // 分からない情報）にのみ使う。検算（AIの事業所別合計 = sf_payroll_syncの支給額合計、かつ
  // 控除内訳が全項目テンプレートの科目にマッチ）がOKの場合だけ、確認画面を出したうえで反映する
  // （自動確定はしない＝必ず人が「反映する」ボタンを押す一手間を挟む）
  if($("payroll-preview-autogen")) $("payroll-preview-autogen").onclick=async()=>{
    const btn=$("payroll-preview-autogen"), el=$("payroll-preview-autogen-result");
    btn.disabled=true; btn.textContent="読み取り・検算中…";
    const bres=await runStoreBreakdown();
    btn.disabled=false; btn.textContent="🧮 AIで仕訳を自動生成する（検算OKの場合のみ）";
    if(!bres.ok){ el.innerHTML=`<div class="err">⚠️ ${esc(bres.error)}</div>`; return; }
    const plan=payrollBuildAutoJournalPlan(row,branches,bres.totals);
    el.innerHTML=payrollAutoJournalPlanHtml(plan);
    if(plan.ok){
      const applyBtn=$("payroll-autogen-apply");
      if(applyBtn) applyBtn.onclick=()=>{
        payrollApplyAutoJournalPlan(branches,plan);
        rerenderEntries();
        el.innerHTML=`<div class="err msg-ok">✅ 自動生成した内容を上の表に反映しました。登録前に一度ご確認ください</div>`;
      };
    }
  };
  // 2026-09-02: ユーザー要望「明細を追加できるようにしてほしい」に対応。空の行を追加し、
  // 借方・貸方どちらの勘定科目も入力補完（既に取得済みのPAYROLL_STATE.accountLabelMap）から選べる
  $("payroll-preview-addrow").onclick=()=>{
    branches.push({debit:null,credit:null,debitLabel:"",creditLabel:"",debitAmount:0,creditAmount:0,department_id:null,tax_id:null,credit_department_id:null,credit_tax_id:null,remark:""});
    rerenderEntries();
  };
  // 2026-09-02: ユーザー要望「途中で消えてしまうこともあるから一時保存を」に対応。
  // 編集中のbranches（勘定科目名・金額・部門・税区分等すべて）をそのままJSONで保存する。
  // マネーフォワードへの実登録（payroll_journal_records）はしないため、状態は「下書き」のまま
  $("payrollPreviewSaveDraft").onclick=async()=>{
    const pmsg=$("payrollPreviewMsg");
    $("payrollPreviewSaveDraft").disabled=true;
    pmsg.className="err"; pmsg.textContent="一時保存中…";
    const draftPayload={
      user_id:userId, year_month:PAYROLL_STATE.yearMonth, template_id:template.id,
      branches: branches.map(({debit,credit,...rest})=>rest), // 解決済みaccountオブジェクトは保存せず、ラベル等の入力値だけ保存（次回開いたときに再解決する）
      transaction_date: $("payroll-date").value||null,
      updated_by:ME.id, updated_at:new Date().toISOString(),
    };
    const r=await authed("/rest/v1/payroll_journal_drafts",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(draftPayload)});
    $("payrollPreviewSaveDraft").disabled=false;
    if(!r.ok){ pmsg.textContent="一時保存に失敗しました"; return; }
    pmsg.className="err msg-ok"; pmsg.textContent="一時保存しました。閉じても内容は残ります（次にこの従業員のプレビューを開くと続きから編集できます）";
    const existing=PAYROLL_STATE.drafts.find(d=>d.user_id===userId);
    if(existing) Object.assign(existing,draftPayload); else PAYROLL_STATE.drafts.push(draftPayload);
    payrollRender(); // 一覧の状態表示（下書き保存中）を更新
  };
  $("payrollPreviewSubmit").onclick=async()=>{
    const pmsg=$("payrollPreviewMsg");
    // 2026-09-02: 勘定科目名（テキスト）をプルダウンの候補から選んだ勘定科目オブジェクトへ解決してから
    // 送信する（mft/mfjの仕訳辞書エディタと同じ方式）。テンプレート由来の行も含め全行が編集可能なため、
    // 全行について毎回この解決をやり直す
    for(const [i,b] of branches.entries()){
      const debitLabel=(b.debitLabel||"").trim(), creditLabel=(b.creditLabel||"").trim();
      if(debitLabel){
        const acc=PAYROLL_STATE.accountLabelMap.get(debitLabel);
        if(!acc){ pmsg.className="err"; pmsg.textContent=`${i+1}行目・借方の勘定科目「${debitLabel}」が候補にありません。一覧から選び直してください`; return; }
        b.debit=acc;
      }else{ b.debit=null; }
      if(creditLabel){
        const acc=PAYROLL_STATE.accountLabelMap.get(creditLabel);
        if(!acc){ pmsg.className="err"; pmsg.textContent=`${i+1}行目・貸方の勘定科目「${creditLabel}」が候補にありません。一覧から選び直してください`; return; }
        b.credit=acc;
      }else{ b.credit=null; }
      if(!b.debit&&!b.credit){ pmsg.className="err"; pmsg.textContent=`${i+1}行目に借方・貸方どちらも入力されていません（不要ならこの行を削除してください）`; return; }
    }
    const {debit:totalDebit,credit:totalCredit}=calcTotals();
    if(totalDebit!==totalCredit){ pmsg.className="err"; pmsg.textContent=`借方合計（${yen(totalDebit)}）と貸方合計（${yen(totalCredit)}）が一致していません。金額を確認してください`; return; }
    $("payrollPreviewSubmit").disabled=true;
    pmsg.className="err"; pmsg.textContent="登録中…";
    const payload={
      tenant_id:"default", vendor_name:`給与：${name}（${PAYROLL_STATE.yearMonth}）`,
      branches: branches.map(b=>({
        debit:b.debit?{account_id:b.debit.account_id,sub_account_id:b.debit.sub_account_id||undefined,value:b.debitAmount}:undefined,
        credit:b.credit?{account_id:b.credit.account_id,sub_account_id:b.credit.sub_account_id||undefined,value:b.creditAmount}:undefined,
        department_id:b.department_id||null, tax_id:b.tax_id||null,
        credit_department_id:b.credit_department_id||null, credit_tax_id:b.credit_tax_id||null,
        remark:b.remark||defaultRemark,
      })),
      transaction_date: $("payroll-date").value,
      remark:`${PAYROLL_STATE.yearMonth}分給与（${name}）`,
      // 2026-09-07：複数枚ある場合は全て証憑として添付する（従来は1枚目のみ）
      voucher_files: pdfFiles.map((f,i)=>({file_name:`給与明細_${name}_${PAYROLL_STATE.yearMonth}${pdfFiles.length>1?`_${i+1}`:""}.pdf`,file_data:f.file_data})),
    };
    const {ok,body:j}=await mfCall("create_standalone",payload);
    if(!ok){ pmsg.textContent=j.error||"登録に失敗しました"; $("payrollPreviewSubmit").disabled=false; return; }
    // 2026-09-10追加：ユーザー報告「請求書一覧のところで給料なのか請求書なのか区別がつかない」に
    // 対応。給与仕訳から証憑添付のために自動作成される「給与：氏名（年月）」invoicesレコードに、
    // is_payroll_relatedフラグを立てておく（🧾請求書一覧の絞り込みで使う）。
    // 2026-09-10追加（続き）：ユーザー要望「給料は全てトーホーだから、法人のところも、トーホーと
    // 自動で連携されるようにしてほしい」に対応。給与仕訳タブ自体が「有限会社トーホーエージェンシー
    // 分のみ対応」と明記されている（対象法人を選ぶ仕組みが元々無い）ため、法人名で引いたトーホーの
    // corporation_idをあわせて設定する（見つからない場合は法人未設定のまま・実害なく続行）
    if(j.invoice_id){
      await ensureCorpStoreCache();
      const tohoCorp=(CORP_STORE_CACHE&&CORP_STORE_CACHE.corporations||[]).find(c=>c.name==="トーホー");
      const patchBody={is_payroll_related:true};
      if(tohoCorp) patchBody.corporation_id=tohoCorp.id;
      authed(`/rest/v1/invoices?id=eq.${j.invoice_id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(patchBody)}).catch(()=>{});
    }
    const recR=await authed("/rest/v1/payroll_journal_records",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({
      user_id:userId, year_month:PAYROLL_STATE.yearMonth, tenant_id:"default", template_id:template.id,
      mf_journal_id:j.journal_id, mf_journal_number:j.journal_number, mf_journal_created_at:new Date().toISOString(),
      invoice_id:j.invoice_id, created_by:ME.id,
    })});
    // 2026-09-02: 実際に登録できたら一時保存の下書きは不要になるため削除する（「登録になるまで
    // 完了にならない」＝逆に言えば登録できたら下書き扱いのままにしない、という要望に対応）
    await authed(`/rest/v1/payroll_journal_drafts?user_id=eq.${userId}&year_month=eq.${PAYROLL_STATE.yearMonth}`,{method:"DELETE"});
    pmsg.className="err msg-ok";
    const voucherNote=j.voucher_attached?`。証憑PDFも添付しました`:(j.voucher_error?`（証憑添付: ${j.voucher_error}）`:"");
    pmsg.textContent=recR.ok
      ?`登録しました（伝票番号: ${j.journal_number??"-"}）${voucherNote}。画面を更新します…`
      :`マネーフォワードへの登録は成功しました（伝票番号: ${j.journal_number??"-"}）${voucherNote}が、進捗の記録に失敗しました。再度この従業員を登録しようとすると重複する可能性があるため、マネーフォワード側の実際の登録状況を確認してください。`;
    setTimeout(async()=>{ history.back(); await payrollLoad(); payrollRender(); },1400);
  };
}

// PL連携対象科目のCRUD（設定タブ・ラウンド5指示書§6.1／設計書_広告費自動連携_§5・2026-09-01）
// 2026-09-03追加: 「勘定科目名」が自由入力だとMFの実際の科目名と1文字でも違えば静かに一致しなくなる
// （ユーザー指摘: 「自由入力だと間違えてしまう恐れがあるので、選択できるように。検索して候補が
// 表示されるように」）。マネーフォワードの実際の勘定科目一覧を取得し、datalist（入力しながら
// 絞り込める・自由入力欄と同じ見た目のまま候補選択もできる）で候補を出す。仕訳辞書編集の
// mft-acc-datalistと同じ仕組み。PL上での表示名は選ぶ元データが無い（ユーザーが自由に決める
// ラベルのため）ので従来どおり自由入力のまま
async function renderPlFeeAccountsSection(){
  const box=$("plfee-accounts-box");
  if(!box) return;
  box.innerHTML=`<div style="font-size:12px;color:var(--muted)">読み込み中…</div>`;
  PL_FEE_TARGET_ACCOUNTS=null; // 設定タブを開くたびに最新を取り直す
  const [accounts,tRes]=await Promise.all([plFeeTargetAccounts(), mfCall("list_tenants")]);
  const tenants=(tRes.ok&&tRes.body.tenants)||[];
  const tenantId=PLFEE_ACC_STATE.tenantId||(tenants[0]&&tenants[0].id)||"default";
  PLFEE_ACC_STATE.tenantId=tenantId; PLFEE_ACC_STATE.tenants=tenants;
  const accRes=await mfCall("accounts",{tenant_id:tenantId});
  const mfAccounts=(accRes.ok&&accRes.body.accounts)||[];
  // 2026-09-10修正：ユーザー要望「PLマッピングもマネーフォワード会計と同じようになってない」
  // 「勘定科目と補助科目を分けて、マネーフォワードの勘定科目と補助科目と同じように連動して
  // ほしい（API連携）」に対応。従来は「勘定科目/補助科目」を1本のテキスト欄（結合文字列）で
  // 登録していたが、会計入力・仕訳辞書と同じ.pet-acc-group形式（勘定科目→補助科目の2段・
  // 補助科目は選択中の勘定科目に連動してMFの実データから絞り込み）に変更した
  const idx=mftBuildAccountIndex(mfAccounts);
  box.innerHTML=`
    ${tenants.length>1?`<div style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">事業者</label>
      <select id="plfee-acc-tenant">${tenants.map(t=>`<option value="${esc(t.id)}" ${t.id===tenantId?"selected":""}>${esc(t.label)}</option>`).join("")}</select></div>`:""}
    ${!accRes.ok?`<div class="err" style="margin-bottom:8px">勘定科目の取得に失敗しました（マネーフォワード未連携の可能性）: ${esc((accRes.body&&accRes.body.error)||"")}。下の欄は手入力になります（MFの表記と完全に一致させてください）</div>`:""}
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px">
      <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">勘定科目・補助科目（候補から選択・入力すると絞り込めます）</label>
        <div class="pet-acc-group">
          <input id="plfee-acc-name" class="pet-acc-main" list="plfee-acc-datalist" placeholder="例: 支払手数料">
          <input id="plfee-acc-sub" class="pet-acc-sub" list="plfee-acc-subdatalist" placeholder="補助科目（無ければ空欄のまま）">
        </div>
        <datalist id="plfee-acc-datalist">${idx.accountNameDatalistHtml}</datalist>
        <datalist id="plfee-acc-subdatalist"></datalist>
      </div>
      <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">PL上での表示名（任意）</label>
        <input id="plfee-acc-label" placeholder="省略時は科目名と同じ"></div>
      <button class="hq-btn primary" id="plfee-acc-add">＋ 追加</button>
    </div>
    <div class="err" id="plfee-acc-msg" style="margin-bottom:8px"></div>
    <div class="hq-tablewrap">
      <table class="invoice-table">
        <thead><tr><th>勘定科目</th><th>補助科目</th><th>PL表示名</th><th></th></tr></thead>
        <tbody>${accounts.map(a=>`<tr>
          <td><b>${esc(a.account_name)}</b></td>
          <td>${esc(a.sub_account_name||"—")}</td>
          <td>${esc(a.pl_label||a.account_name)}</td>
          <td><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-plfee-acc-del="${esc(a.id)}">削除</button></td>
        </tr>`).join("")||'<tr><td colspan="4">登録されていません</td></tr>'}</tbody>
      </table>
    </div>`;
  if(tenants.length>1) $("plfee-acc-tenant").onchange=e=>{ PLFEE_ACC_STATE.tenantId=e.target.value; renderPlFeeAccountsSection(); };
  const refreshSubDl=()=>{
    const dl=$("plfee-acc-subdatalist");
    if(dl) dl.innerHTML=plfeeSettingsSubAccountOptionsHtml(idx,$("plfee-acc-name").value.trim());
  };
  $("plfee-acc-name").oninput=refreshSubDl;
  $("plfee-acc-add").onclick=async()=>{
    const name=$("plfee-acc-name").value.trim();
    const sub=$("plfee-acc-sub").value.trim();
    const label=$("plfee-acc-label").value.trim();
    const msg=$("plfee-acc-msg");
    if(!name){ msg.textContent="勘定科目名を選択してください"; return; }
    if(accRes.ok&&!idx.map.has(name)){ msg.textContent="候補一覧に無い勘定科目名です。候補から選び直してください（誤字防止のため）"; return; }
    if(accRes.ok&&sub&&!(idx.subAccountsByAccountName.get(name)||[]).includes(sub)){ msg.textContent="その勘定科目に登録が無い補助科目です。候補から選び直してください（誤字防止のため）"; return; }
    msg.className="err"; msg.textContent="追加中…";
    const r=await plFeeCall("add_target_account",{account_name:name,sub_account_name:sub,pl_label:label});
    if(!r.ok){ msg.textContent=r.body.error||"追加できませんでした"; return; }
    await renderPlFeeAccountsSection();
  };
  document.querySelectorAll("[data-plfee-acc-del]").forEach(el=>el.onclick=async()=>{
    if(!confirm("この科目をPL連携対象から外しますか？（過去に反映済みの記録は消えません）")) return;
    await plFeeCall("remove_target_account",{id:el.dataset.plfeeAccDel});
    await renderPlFeeAccountsSection();
  });
}

function vendorFilteredList(){

  else if(status==="inactive") list=list.filter(v=>v.is_active===false);

function vendorWireInfoSupplierLink(ed){
  const searchBox=$("vendor-info-supplier-search-box");
  if($("vendor-info-supplier-relink-toggle")) $("vendor-info-supplier-relink-toggle").onclick=()=>{
    if(searchBox) searchBox.style.display=searchBox.style.display==="none"?"block":"none";
  };
  if($("vendor-info-supplier-unlink")) $("vendor-info-supplier-unlink").onclick=()=>{
    ed.infoSupplierId=""; ed.infoSupplier=null;
    vendorRenderEditor();
  };
  const input=$("vendor-info-supplier-search");
  if(!input) return;
  let debounceTimer=null;
  const runSearch=async q=>{
    const box=$("vendor-info-supplier-results");
    if(!q.trim()){ box.innerHTML=""; return; }
    box.innerHTML="検索中…";
    const r=await vendorCall("search_info_suppliers",{q:q.trim()});
    const suppliers=(r.ok&&r.body.suppliers)||[];
    box.innerHTML=suppliers.length
      ?suppliers.map(s=>`<div class="ai-field" style="padding:6px 8px;margin-bottom:4px;border:1px solid var(--line);border-radius:6px">
          <b>${esc(s.name)}</b>${s.kind?`（${esc(s.kind)}）`:""}${s.status?` <span class="invoice-status gray">${esc(s.status)}</span>`:""}
          ${s.contact_name||s.phone?`<div class="meta" style="color:var(--muted);font-size:11px">${s.contact_name?"担当: "+esc(s.contact_name)+"　":""}${s.phone?esc(s.phone):""}</div>`:""}
          <button class="hq-btn" data-vendor-info-supplier-pick="${esc(s.id)}" style="font-size:11px;margin-top:4px">この取引先に紐付ける</button>
        </div>`).join("")
      :`<div style="color:var(--muted)">該当する取引先が見つかりません</div>`;
    document.querySelectorAll("[data-vendor-info-supplier-pick]").forEach(btn=>btn.onclick=()=>{
      const picked=suppliers.find(s=>s.id===btn.dataset.vendorInfoSupplierPick);
      if(!picked) return;
      ed.infoSupplierId=picked.id; ed.infoSupplier=picked;
      vendorRenderEditor();
    });
  };
  input.oninput=()=>{ clearTimeout(debounceTimer); const q=input.value; debounceTimer=setTimeout(()=>runSearch(q),350); };
  // 初回表示時、取引先の正式名称で自動的に候補を検索しておく（未紐付けのときだけ）
  if(!ed.infoSupplier&&ed.name){ input.value=ed.name; runSearch(ed.name); }
}
// 2026-09-05新規：取引先マスタの編集画面に統合した振込先口座のCRUD。旧「支払先・銀行口座」

  box.innerHTML=`<div class="hq-tablewrap"><table class="invoice-table">
    <thead><tr><th>支払方法</th><th>銀行コード</th><th>銀行</th><th>支店コード</th><th>支店</th><th>種別</th><th>口座番号</th><th>名義</th><th>状態</th><th>最終確認日</th><th></th></tr></thead>
    <tbody>${accounts.length?accounts.map(a=>{
      const method=a.payment_method||"bank_transfer";

      // 2026-09-08修正：他行口座から振込（other_bank_transfer）は銀行口座情報を持つため、

      if(!paymentMethodHasBankInfo(method)){
        return `<tr><td><span class="invoice-status check">${esc(PAYMENT_METHOD_LABEL[method]||method)}</span></td><td colspan="7" style="color:var(--muted)">口座登録不要</td>

          <td>${a.confirmed_at?fmtD(a.confirmed_at):"—"}</td><td>${actionsHtml}</td></tr>`;
      }
      return `<tr>
      <td><span class="invoice-status gray">${esc(PAYMENT_METHOD_LABEL[method]||method)}</span></td>
      <td>${a.bank_code?esc(a.bank_code):'<span class="invoice-status err">未登録</span>'}</td><td>${esc(a.bank_name||"—")}</td>
      <td>${a.branch_code?esc(a.branch_code):'<span class="invoice-status err">未登録</span>'}</td><td>${esc(a.branch_name||"—")}</td>
      <td>${a.account_type==="2"?"当座":a.account_type==="4"?"貯蓄":"普通"}</td>
      <td>${esc(a.account_number||"—")}</td><td>${esc(a.account_holder_kana||"—")}</td>
      <td>${a.is_current?'<span class="invoice-status done">現在有効</span>':'<span class="invoice-status gray">過去口座</span>'}</td>
      <td>${a.confirmed_at?fmtD(a.confirmed_at):"—"}</td>

    }).join(""):'<tr><td colspan="11">登録済みの口座はありません</td></tr>'}</tbody>
  </table></div>
  <div class="meta" style="color:var(--muted);font-size:11px;margin-top:6px">💡 新しく「支払方法・口座を追加」すると、以前の口座は「過去口座」として履歴に残ったまま、新しい方が自動的に「現在有効」になります（削除しなくても最新の口座として使われます）。内容を直したいだけの場合は、削除せずに該当行の「✏️編集」をお使いください。</div>

  });
  document.querySelectorAll("[data-vb-delete]").forEach(el=>el.onclick=async()=>{
    const acc=VB_STATE.accounts.find(a=>a.id===el.dataset.vbDelete);

}
let VB_STATE={vendorId:null,accounts:[]};
// 2026-09-08新規：口座の登録・編集フォーム（vb-addボタンの中に埋め込まれていたものを、
// 編集ボタンからも同じフォームを呼び出せるよう関数として独立させた。existingAccountが

  $("vb-editor").innerHTML=`<div class="card" style="padding:12px;border-color:var(--m-blue)">

    <div class="ai-field" style="margin-bottom:10px"><small>支払方法</small>
      <select id="vb-method">

        <option value="other_bank_transfer" ${method0==="other_bank_transfer"?"selected":""}>他行口座から振込（PayPay銀行CSVの対象外・手動で振込）</option>

        <option value="cash" ${method0==="cash"?"selected":""}>現金払い（銀行口座の登録は不要です）</option>
        <option value="credit_card" ${method0==="credit_card"?"selected":""}>クレジット払い（銀行口座の登録は不要です）</option>

    <div id="vb-bank-fields">

      <div class="ai-field"><small>銀行名（任意・表示用）</small><input id="vb-name" value="${esc((existingAccount&&existingAccount.bank_name)||"")}" placeholder="例: PayPay銀行"></div>
      <div class="ai-field"><small>支店コード（3桁の数字）</small><input id="vb-branchcode" value="${esc((existingAccount&&existingAccount.branch_code)||"")}" placeholder="例: 003" maxlength="3"></div>

      <div class="ai-field"><small>口座種別</small><select id="vb-type">${["1","2","4"].map(t=>`<option value="${t}" ${(existingAccount?existingAccount.account_type:"1")===t?"selected":""}>${t==="1"?"普通":t==="2"?"当座":"貯蓄"}</option>`).join("")}</select></div>
      <div class="ai-field"><small>口座番号</small><input id="vb-number" value="${esc((existingAccount&&existingAccount.account_number)||"")}" maxlength="7"></div>
      <div class="ai-field full"><small>名義（カナ）</small><input id="vb-holder" value="${esc((existingAccount&&existingAccount.account_holder_kana)||"")}"></div>

    </div>

    <div class="err" id="vb-msg" style="margin-top:6px"></div>
  </div>`;
  // 2026-09-08修正：他行口座から振込（other_bank_transfer）も銀行口座情報が必要な支払方法として扱う
  const toggleVbBankFields=()=>{ $("vb-bank-fields").style.display=paymentMethodHasBankInfo($("vb-method").value)?"block":"none"; };
  toggleVbBankFields();
  $("vb-method").onchange=toggleVbBankFields;
  $("vb-cancel").onclick=()=>{ $("vb-editor").innerHTML=""; };
  $("vb-save").onclick=async()=>{
    const msg=$("vb-msg"); msg.className="err";
    const method=$("vb-method").value;
    let account;
    if(!paymentMethodHasBankInfo(method)){
      // 2026-09-07追加：引き落とし・現金払い・クレジット払いは銀行口座情報が不要
      account={ vendor_id: vendorId, payment_method: method, bank_code:null,bank_name:null,branch_code:null,branch_name:null,account_number:null,account_holder_kana:null, account_type:"1" };
    }else{
      const bankCode=$("vb-code").value.trim(), branchCode=$("vb-branchcode").value.trim();

    await vbLoadAccountsForVendor(vendorId);
  };
}

/* ---- 従業員振込口座（一覧・read only。2026-09-05新規。担当Bスレッドからの依頼＝
   WORKLOG「担当C・担当Fへ依頼: 振込口座まわりのUI整理」コミットc6a93cf ②③に対応。
   人を選ぶドロップダウン式ではなく、全従業員をずらっと一覧表示するだけの画面にした。
   編集は従来どおり給与仕訳タブ（payrollBankModal）・本人からの個人情報変更申請の承認
   経由のみで、ここでは新しいテーブル・書き込み経路は一切作っていない（read-only）。
   変更があれば、この一覧を開き直すたびに同じpayroll_bank_accountsを読み直すため、
   アカウント管理（nippo）の従業員詳細と常に同じ内容になる ---- */
async function renderSettingsPayrollBank(){
  $("settingsBody").innerHTML=`<div class="spin">読み込み中…</div>`;
  const r=await authed(`/rest/v1/payroll_bank_accounts?select=*,owner:users!payroll_bank_accounts_user_id_fkey(name)`);
  const rows=(r.ok&&Array.isArray(r.body))?r.body:[];
  rows.sort((a,b)=>((a.owner&&a.owner.name)||"").localeCompare((b.owner&&b.owner.name)||"","ja"));
  const methodLabel={bank_transfer:"銀行振込",cash:"現金手渡し"};
  $("settingsBody").innerHTML=`<div class="card" style="padding:16px">
    <h3 style="font-size:14px;margin-bottom:6px">👥 従業員振込口座（${rows.length}件）</h3>
    <div class="meta" style="color:var(--muted);font-size:12px;margin-bottom:10px">給与仕訳タブでの登録、または本人からの個人情報変更申請が承認されたものが、どちらもここに集約されます（アカウント管理の従業員詳細と同じ内容です）。ここでは参照のみで、編集は給与仕訳タブ、または本人からの申請経由で行ってください。</div>
    <input type="search" id="pb-search" placeholder="🔎 氏名で検索" style="max-width:280px;margin-bottom:10px">
    <div class="hq-tablewrap"><table class="invoice-table">
      <thead><tr><th>氏名</th><th>支払方法</th><th>銀行コード</th><th>銀行</th><th>支店コード</th><th>支店</th><th>種別</th><th>口座番号</th><th>名義</th><th>最終更新</th></tr></thead>
      <tbody id="pb-rows">${rows.map(a=>payrollBankRowHtml(a,methodLabel)).join("")||'<tr><td colspan="10">登録がありません</td></tr>'}</tbody>
    </table></div>
  </div>`;
  $("pb-search").oninput=()=>{
    const q=$("pb-search").value.trim().toLowerCase();
    const filtered=rows.filter(a=>!q||((a.owner&&a.owner.name)||"").toLowerCase().includes(q));
    $("pb-rows").innerHTML=filtered.map(a=>payrollBankRowHtml(a,methodLabel)).join("")||'<tr><td colspan="10">該当する従業員はいません</td></tr>';
  };
}
function payrollBankRowHtml(a,methodLabel){
  if(a.payment_method==="cash"){
    return `<tr><td><b>${esc((a.owner&&a.owner.name)||"—")}</b></td><td><span class="invoice-status gray">現金手渡し</span></td><td colspan="7" style="color:var(--muted)">口座登録不要</td></tr>`;
  }
  const hasCodes=a.bank_code&&a.branch_code;
  return `<tr>
    <td><b>${esc((a.owner&&a.owner.name)||"—")}</b></td>
    <td><span class="invoice-status ${hasCodes?"done":"err"}">${esc(methodLabel[a.payment_method]||"未登録")}</span></td>
    <td>${a.bank_code?esc(a.bank_code):'<span class="invoice-status err">未登録</span>'}</td>
    <td>${esc(a.bank_name||"—")}</td>
    <td>${a.branch_code?esc(a.branch_code):'<span class="invoice-status err">未登録</span>'}</td>
    <td>${esc(a.branch_name||"—")}</td>
    <td>${a.account_type==="2"?"当座":a.account_type==="4"?"貯蓄":"普通"}</td>
    <td>${esc(a.account_number||"—")}</td>
    <td>${esc(a.account_holder_kana||"—")}</td>
    <td>${a.updated_at?fmtD(a.updated_at):"—"}</td>
  </tr>`;
}

/* ---- 勘定科目マッピング（マネーフォワード本体の一覧の参照のみ・2026-09-03新規） ---- */
let ACCOUNTS_STATE={};
async function renderSettingsAccounts(){
  $("settingsBody").innerHTML=`<div class="spin">読み込み中…</div>`;
  const tRes=await mfCall("list_tenants");
  const tenants=(tRes.ok&&tRes.body.tenants)||[];
  if(!tenants.length){ $("settingsBody").innerHTML=`<div class="card" style="padding:16px"><div class="err">マネーフォワードと連携している事業者がありません</div></div>`; return; }
  const tenantId=ACCOUNTS_STATE.tenantId||tenants[0].id;
  ACCOUNTS_STATE.tenantId=tenantId;
  const accRes=await mfCall("accounts",{tenant_id:tenantId});
  const accounts=(accRes.ok&&accRes.body.accounts)||[];
  $("settingsBody").innerHTML=`<div class="card" style="padding:16px">
    <h3 style="font-size:14px;margin-bottom:6px">💹 勘定科目マッピング</h3>
    <div class="meta" style="color:var(--muted);font-size:12px;margin-bottom:10px">マネーフォワード本体に登録されている勘定科目・補助科目の一覧です（参照のみ。追加・変更はマネーフォワード本体で行ってください。ここでの反映は次回このタブを開いたときです）。</div>
    ${tenants.length>1?`<select id="accounts-tenant" style="margin-bottom:10px">${tenants.map(t=>`<option value="${esc(t.id)}" ${t.id===tenantId?"selected":""}>${esc(t.label)}</option>`).join("")}</select>`:""}
    <div class="hq-tablewrap"><table class="invoice-table">
      <thead><tr><th>勘定科目</th><th>補助科目</th></tr></thead>
      <tbody>${accounts.length?accounts.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc((a.sub_accounts||[]).map(s=>s.name).join("、")||"—")}</td></tr>`).join(""):'<tr><td colspan="2">取得できませんでした</td></tr>'}</tbody>
    </table></div>
  </div>`;
  if(tenants.length>1) $("accounts-tenant").onchange=e=>{ ACCOUNTS_STATE.tenantId=e.target.value; renderSettingsAccounts(); };
}

/* ---- 法人・店舗・部門マッピング（2026-09-03新規。店舗↔MF部門名の紐付けのみ編集可） ---- */
async function renderSettingsMapping(){
  $("settingsBody").innerHTML=`<div class="spin">読み込み中…</div>`;
  const [storeRes,corpRes]=await Promise.all([
    authed("/rest/v1/stores?select=id,name,corporation_id,mf_department_name&order=name"),
    authed("/rest/v1/corporations?select=id,name&order=name"),
  ]);
  const stores=(storeRes.ok&&Array.isArray(storeRes.body))?storeRes.body:[];
  const corps=(corpRes.ok&&Array.isArray(corpRes.body))?corpRes.body:[];
  $("settingsBody").innerHTML=`<div class="card" style="padding:16px">
    <h3 style="font-size:14px;margin-bottom:6px">🏬 法人・店舗・部門マッピング</h3>
    <div class="meta" style="color:var(--muted);font-size:12px;margin-bottom:10px">法人・店舗そのものの登録・編集は社内情報管理システム側で行います。ここでは各店舗に対応するマネーフォワードの「部門」名だけを紐付けます（仕訳の店舗別金額を自動集計するときに使う参照情報です）。</div>
    <div class="hq-tablewrap"><table class="invoice-table">
      <thead><tr><th>店舗</th><th>法人</th><th>マネーフォワード部門名</th><th></th></tr></thead>
      <tbody>${stores.map(s=>{
        const corpName=(corps.find(c=>c.id===s.corporation_id)||{}).name||"—";
        return `<tr>
          <td><b>${esc(s.name)}</b></td>
          <td>${esc(corpName)}</td>
          <td><input class="mapping-dept" data-store="${s.id}" value="${esc(s.mf_department_name||"")}" placeholder="MF側の部門名と完全一致させてください"></td>
          <td><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-mapping-save="${s.id}">保存</button></td>
        </tr>`;
      }).join("")||'<tr><td colspan="4">店舗が登録されていません</td></tr>'}</tbody>
    </table></div>
  </div>`;
  document.querySelectorAll("[data-mapping-save]").forEach(el=>el.onclick=async()=>{
    const storeId=el.dataset.mappingSave;
    const val=document.querySelector(`.mapping-dept[data-store="${storeId}"]`).value.trim();
    el.disabled=true; el.textContent="保存中…";
    await authed(`/rest/v1/stores?id=eq.${storeId}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({mf_department_name:val||null})});
    el.disabled=false; el.textContent="✓ 保存済み";
    setTimeout(()=>{ if(el) el.textContent="保存"; },1500);
  });
}

/* ---- 自動処理ルール（2026-09-03新規） ---- */
async function renderSettingsAutomation(){
  $("settingsBody").innerHTML=`<div class="spin">読み込み中…</div>`;
  const r=await authed("/rest/v1/automation_rule_settings?select=*&order=key");
  const rules=(r.ok&&Array.isArray(r.body))?r.body:[];
  const actionLabel={auto_candidate:"✅ 自動処理候補にする",require_review:"👀 人間確認を必須にする",block:"🚫 自動処理を停止する"};
  $("settingsBody").innerHTML=`<div class="card" style="padding:16px">
    <h3 style="font-size:14px;margin-bottom:6px">🤖 自動処理ルール</h3>
    <div class="meta" style="color:var(--muted);font-size:12px;margin-bottom:10px">AIの判断ではなく、システムとして決めるルールです。ここで有効/無効・動作を切り替えられます。実際にマネーフォワードへ登録するのは、必ず一覧画面で人間がボタンを押したときだけです（このルールで自動になっても勝手には登録されません）。</div>
    <div class="hq-tablewrap"><table class="invoice-table">
      <thead><tr><th>ルール</th><th>説明</th><th>有効</th><th>動作</th><th></th></tr></thead>
      <tbody>${rules.map(x=>`<tr>
        <td><b>${esc(x.label)}</b></td>
        <td style="white-space:normal;max-width:280px">${esc(x.description||"")}</td>
        <td><input type="checkbox" class="rule-enabled" data-key="${esc(x.key)}" ${x.enabled?"checked":""}></td>
        <td><select class="rule-action" data-key="${esc(x.key)}">${Object.entries(actionLabel).map(([k,l])=>`<option value="${k}" ${x.action===k?"selected":""}>${l}</option>`).join("")}</select></td>
        <td><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-rule-save="${esc(x.key)}">保存</button></td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="err" id="automation-msg" style="margin-top:8px"></div>
  </div>`;
  document.querySelectorAll("[data-rule-save]").forEach(el=>el.onclick=async()=>{
    const key=el.dataset.ruleSave;
    const enabled=document.querySelector(`.rule-enabled[data-key="${key}"]`).checked;
    const action=document.querySelector(`.rule-action[data-key="${key}"]`).value;
    const msg=$("automation-msg"); msg.className="err"; msg.textContent="保存中…";
    const rr=await authed(`/rest/v1/automation_rule_settings?key=eq.${encodeURIComponent(key)}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({enabled,action,updated_by:ME.id,updated_at:new Date().toISOString()})});
    if(!rr.ok){ msg.textContent="保存に失敗しました"; return; }
    msg.className="err msg-ok"; msg.textContent="保存しました";
  });
}

function renderLogin(){
  $("app").innerHTML=`<div class="card" style="padding:20px;margin-top:20px">
    <p style="margin-bottom:10px">ログインが必要です。ポータルからアクセスしてください。</p>
    ${EMBED?"":'<a class="hq-btn primary" href="index.html" style="text-decoration:none;display:inline-block">← ポータルへ</a>'}
  </div>`;
}
async function main(){
  if(EMBED) document.body.classList.add("embed-mode");
  if(!sess.get()){renderLogin();return}
  const u=await fetchMe();
  if(!u){sess.clear();renderLogin();return}
  if(u.is_active===false){renderLogin();return}
  ME=u;
  history.replaceState({tab:TAB},"");
  await Promise.all([loadInboxMaster(), loadWaitingPaymentCount(), loadKpiCounts()]);
  $("app").innerHTML=shellHtml(u);
  wireShell(u);
  await renderTabBody(u);
}
main();
