name: kd_ダッシュボード集計の更新（取込完了ドリブン・毎時チェック）

# W2④（docs/設計書_表示集計層kdと高速化実行計画_2026-09-02.md §10.1）＋ラウンド6§1/§7。
# 【2026-10-03変更】ユーザー回答「売上は前日分が分かればよい。リアルタイムは不要」を受け、毎時に重いGAS呼び出しを
# 無条件に回すのをやめた。毎時（cron-job.orgの起動は従来どおり毎時0分・08:00〜23:00 JST）に最初に
# keiei-kd-refresh の op=due を呼び、「ns-daily-importの関連する取込が前回のkd_更新より新しく終わった時」
# （＋日中は前回成功から3時間たっていれば手入力反映の保険として）だけ、売上・PL・入金・予約の更新を実行する。
# home_kpi（Supabase内完結・平均3秒）とsessions_cleanupは毎回実行。判定ロジックとグループはindex.tsのDUE_GROUPS。
# 効果: GAS呼び出し（平均32秒・失敗率16%）が1日約16回→数回に減り、失敗通知も減る。取込完了から1時間以内に反映される。
#
# 実際の発火は他の日次workflowと同じく外部cron（cron-job.org）からworkflow_dispatch APIを叩く（登録済み・変更不要）。
#   POST https://api.github.com/repos/mirai-oss/ns-portal/actions/workflows/keiei-kd-hourly.yml/dispatches
# 手動実行: GitHubの Actions タブ → 本workflow → Run workflow（force=trueで判定を無視して全部実行）
on:
  workflow_dispatch:
    inputs:
      force:
        description: '動作確認用: 取込完了の判定を無視して全て実行する（通常は空欄）'
        required: false
        default: ''
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 設定チェック
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY が未設定です"
            exit 1
          fi

      - name: 今回実行するopを判定（op=due）して順に実行
        env:
          SR_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          U="https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-kd-refresh"
          PLAN=$(curl -s -m 60 -X POST "$U" -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d '{"op":"due"}')
          echo "判定: $PLAN"
          if [ "$FORCE" = "true" ]; then
            OPS="dashboard_daily store_monthly pl_monthly ad_monthly deposit_monthly reservation_daily home_kpi sessions_cleanup"
          else
            OPS=$(echo "$PLAN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);if(!j.ok)throw 0;console.log(j.due.join(' '))}catch(e){console.log('dashboard_daily store_monthly pl_monthly home_kpi sessions_cleanup')}})")
          fi
          echo "実行するop: $OPS"
          FAILED=""
          for OP in $OPS; do
            RES=$(curl -s -m 280 -w "\n%{http_code}" -X POST "$U" -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d "{\"op\":\"$OP\"}")
            CODE=$(echo "$RES" | tail -1); BODY=$(echo "$RES" | sed '$d')
            echo "== $OP (HTTP $CODE): $(echo "$BODY" | cut -c1-300)"
            if [ "$CODE" != "200" ]; then
              if [ "$OP" = "sessions_cleanup" ]; then echo "::warning::sessions_cleanup失敗（他は継続）"; else FAILED="$FAILED $OP"; fi
            fi
          done
          if [ -n "$FAILED" ]; then echo "::error::失敗したop:$FAILED"; exit 1; fi
