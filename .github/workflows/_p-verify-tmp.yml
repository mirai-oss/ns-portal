name: P一時実行(削除予定)
on:
  workflow_dispatch:
    inputs:
      from_ym:
        description: '開始年月 YYYY-MM'
        default: '2023-11'
      to_ym:
        description: '終了年月 YYYY-MM'
        default: '2026-08'
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: detail_daily 月ごとバックフィル(async→完了待ち)
        env:
          SR_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FROM_YM: ${{ github.event.inputs.from_ym }}
          TO_YM: ${{ github.event.inputs.to_ym }}
        run: |
          R=https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-kd-refresh
          post() { curl -s -m 100 -X POST $R -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d "$1"; }
          cur="$FROM_YM"
          while [ "$cur" \< "$TO_YM" ] || [ "$cur" = "$TO_YM" ]; do
            y=${cur%-*}; m=${cur#*-}
            last=$(node -e "console.log(new Date(Date.UTC($y,$((10#$m)),0)).toISOString().slice(0,10))")
            first="$cur-01"
            start=$(date +%s)
            echo "START $first..$last $(post "{\"op\":\"detail_daily\",\"async\":true,\"from\":\"$first\",\"to\":\"$last\"}" | cut -c1-120)"
            sleep 8
            for i in $(seq 1 60); do
              st=$(post '{"op":"run_status","job":"kd_detail_item_daily"}')
              state=$(echo "$st" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s).run;console.log(r.status+'|'+r.rows+'|'+(r.period_from||'')+'|'+(r.error||'').slice(0,160))}catch(e){console.log('?')}})")
              case "$state" in running*|\?) sleep 10;; *) break;; esac
            done
            echo "DONE $first..$last state=$state elapsed=$(( $(date +%s) - start ))s"
            case "$state" in failed*) echo "::warning::$first 失敗: $state";; esac
            cur=$(node -e "const d=new Date(Date.UTC($y,$((10#$m)),1));console.log(d.toISOString().slice(0,7))")
          done
