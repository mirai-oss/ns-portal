<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📨 請求書メール — N-Styleグループ ポータル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📨</text></svg>">
<style>
/* ============================================================
   配色・レイアウトはユーザー提供のUIプロトタイプ（mail-shell）に準拠
   ============================================================ */
:root{
  --bg:#f4f1eb; --panel:#fff; --ink:#231f1a; --muted:#7d756d; --line:#e4ddd4;
  --accent:#c94728; --accent-soft:#fce9e3;
  --green:#2f8f63; --green-soft:#e7f5ed;
  --amber:#b77b13; --amber-soft:#fff3d8;
  --blue:#2f6fb7; --blue-soft:#e8f0fb;
  --shadow:0 8px 28px rgba(35,31,26,.08); --radius:16px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#211d18; --panel:#2b2620; --ink:#f2ede6; --muted:#b3aa9f; --line:#433c33; --accent-soft:#4a2c22; --green-soft:#1f3a2c; --amber-soft:#3d3018; --blue-soft:#1e3049;}
  /* 2026-09-05追加：ユーザー報告「夜モードだと色が変わって見づらい」に対応。
     .step-badge.currentは続き27で赤系（--accent-soft背景＋--accentの太字）に変更したが、
     ダークモードの--accent-softは暗い赤茶色になる一方、文字色の--accentはライト/ダーク共通の
     ままだったため、コントラスト比が約2.6:1（WCAG基準4.5:1を大きく下回る）まで低下し
     「めちゃくちゃ見づらい」状態になっていた。ダークモード専用の明るい配色に差し替えて
     コントラスト比を約6.5:1まで改善した */
  .step-badge.current{background:#4a1c16;color:#ff9080}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
a{color:inherit}
button,input,select,textarea{font:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px 60px}
.spin{text-align:center;color:var(--muted);padding:60px 0}
.err{color:var(--accent);font-size:13px}
.msg-ok{color:var(--green)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.modal-bg{position:fixed;inset:0;background:rgba(20,15,8,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:var(--panel);border-radius:16px;padding:20px;max-width:520px;width:100%;margin:20px 0}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal .mhead h2{font-size:16px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.modal label:first-of-type{margin-top:0}
.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink)}
.modal textarea{min-height:120px;resize:vertical}
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:5}
.topbar h1{font-size:21px}
.topbar .who{font-size:13px;color:var(--muted)}

/* ---- mail-shell（プロトタイプ準拠） ---- */
.mail-shell{--m-line:var(--line);--m-muted:var(--muted);--m-red:var(--accent);--m-redsoft:var(--accent-soft);
  --m-green:var(--green);--m-greensoft:var(--green-soft);--m-blue:var(--blue);--m-bluesoft:var(--blue-soft);
  --m-amber:var(--amber);--m-ambersoft:var(--amber-soft);}
.mail-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.mail-kpi{padding:16px}.mail-kpi small{display:block;color:var(--m-muted);font-size:12px}.mail-kpi b{display:block;font-size:28px;margin-top:5px}
.mail-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mail-tab{border:1px solid var(--m-line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.mail-tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mail-chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.mail-chip{border:1px solid var(--m-line);background:var(--panel);border-radius:999px;padding:6px 11px;cursor:pointer;font-size:12px;color:var(--muted)}
.mail-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.bulkbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.bulk-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.bulk-actions .hq-btn{font-size:12px;padding:7px 10px}
.mail-layout{display:grid;grid-template-columns:minmax(340px,.9fr) minmax(0,1.5fr);gap:14px;align-items:start}
.mail-list-card{overflow:hidden}
.mail-toolbar{padding:12px;border-bottom:1px solid var(--m-line);display:flex;gap:8px;align-items:center}
.mail-toolbar input{flex:1;border:1px solid var(--m-line);border-radius:10px;padding:10px;background:var(--panel);color:var(--ink)}
.mail-list-scroll{max-height:74vh;overflow-y:auto}
.mail-item{padding:13px 14px 13px 36px;border-bottom:1px solid var(--m-line);cursor:pointer;background:var(--panel);position:relative}
.mail-checkwrap{position:absolute;left:10px;top:15px}
.mail-checkwrap input{width:16px;height:16px}
.mail-item:hover{background:var(--bg)}
.mail-item.active{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.mail-item.unread .mail-subject{font-weight:800}
.mail-item.locked:after{content:"処理中";position:absolute;right:12px;top:12px;background:var(--m-bluesoft);color:var(--m-blue);font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px}
.mail-item.dup:after{content:"重複疑い";position:absolute;right:12px;top:12px;background:var(--m-redsoft);color:var(--m-red);font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px}
.mail-item.completed:after{content:"完了";position:absolute;right:12px;top:12px;background:var(--m-greensoft);color:var(--m-green);font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px}
.mail-item.notapplicable:after{content:"対象外";position:absolute;right:12px;top:12px;background:var(--bg);color:var(--muted);font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px}
.mail-from{font-size:12px;color:var(--m-muted);padding-right:74px}
.mail-subject{font-size:14px;margin-top:3px;padding-right:74px}
.mail-preview{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:10px;color:var(--muted)}
.mail-detail{min-width:0}
.mail-detail-head{padding:17px 18px;border-bottom:1px solid var(--m-line)}
.mail-detail-head h2{margin:7px 0 4px;font-size:20px}
.mail-detail-head .meta{color:var(--muted);font-size:12px}
.mail-detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.mail-mini{border:1px solid var(--m-line);border-radius:10px;padding:10px;background:var(--bg)}
.mail-mini small{display:block;color:var(--m-muted);font-size:10px;margin-bottom:3px}
.mail-mini b{font-size:13px}
.mail-ownerbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.hq-badges{display:flex;gap:6px;flex-wrap:wrap}
.hq-pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.hq-pill.red{background:var(--m-redsoft);color:var(--m-red)}
.hq-pill.amber{background:var(--m-ambersoft);color:var(--m-amber)}
.hq-pill.green{background:var(--m-greensoft);color:var(--m-green)}
.hq-pill.blue{background:var(--m-bluesoft);color:var(--m-blue)}
.hq-pill.gray{background:var(--bg);color:var(--muted)}
.hq-btn{border:1px solid var(--m-line);background:var(--panel);border-radius:8px;padding:10px 16px;cursor:pointer;color:var(--ink);font-size:13px;font-weight:700}
.hq-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hq-btn.green{background:var(--green);border-color:var(--green);color:#fff}
.hq-btn:disabled{opacity:.45;cursor:not-allowed}
.mail-lock{margin:12px 18px 0;padding:12px;border:1px solid #b8d0eb;background:var(--blue-soft);border-radius:12px;color:#315c86;font-size:12px}
.mail-alert{margin:12px 18px 0;padding:12px;border:1px solid #efb7aa;background:var(--accent-soft);border-radius:12px;color:#9d3425;font-size:12px}
.mail-body{padding:18px}
.mail-body-frame{width:100%;height:260px;border:1px solid var(--m-line);border-radius:10px;background:#fff}
.invoice-attach{border:1px solid var(--m-line);border-radius:14px;padding:12px;background:var(--bg);margin-top:14px}
.invoice-attach h3{margin:0 0 8px;font-size:14px}
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.attcard{border:1px solid var(--m-line);border-radius:12px;overflow:hidden;background:var(--panel)}
.attcard-preview{height:220px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.attcard-preview iframe{width:100%;height:100%;border:none}
.attcard-preview img{max-width:100%;max-height:100%;object-fit:contain}
.attcard-preview .noprev{font-size:13px;color:var(--muted);text-align:center;padding:0 10px}
.attcard-preview .noprev .ico{font-size:34px;display:block;margin-bottom:6px}
.attcard-foot{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;border-top:1px solid var(--m-line)}
.attcard-foot .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.ai-box{border:1px solid var(--m-line);border-radius:12px;background:var(--panel);padding:12px;margin-top:14px}
.ai-box h3{margin:0 0 8px;font-size:14px}
/* 2026-09-03再調整: 参考モックアップ準拠でラベル+枠線入力のフラットな見た目に統一
   （二重枠になっていた入力欄の外枠を廃止。ai-field/ai-gridはこのアプリ全体（設定タブ・
   広告費/PL反映パネル・仕訳辞書編集等）で共通に使っている部品のため、ここを変えると
   アプリ全体の入力欄の見た目が揃って軽くなる） */
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ai-field{padding:0;border:0;background:transparent}
.ai-field small{display:block;color:var(--m-muted);font-size:11px;margin-bottom:6px;font-weight:700;letter-spacing:.01em}
.ai-field input,.ai-field select,.ai-field textarea{width:100%;border:1px solid var(--m-line);border-radius:8px;background:var(--panel);font-size:13px;font-weight:500;color:var(--ink);padding:10px;margin-top:0;-webkit-appearance:auto;appearance:auto}
.ai-field input:focus,.ai-field select:focus,.ai-field textarea:focus{outline:none;border-color:var(--m-blue);box-shadow:0 0 0 3px var(--m-bluesoft)}
/* 統合詳細モーダルの工程バー・3カラムレイアウト（証憑プレビュー／タブ／本部タスク）
   （2026-09-03新規・ユーザー要望「請求書一覧で選んだら、手順が出てきて1個ずつ処理して
   チェックをつけていく形にしたい」＋参考モックアップ準拠でUIを統一。実データが少なくても
   一目で工程・状態が分かるよう、色と太さをはっきりさせた） */
/* 2026-09-05刷新：ユーザー要望「本部タスクの工程一覧のように、今どこまで進んでいるか
   もっとはっきり分かるようにしてほしい」に対応。本部タスクの工程（サブタスク）リストと
   同じ視覚言語（緑チェック＝完了／赤枠＋「いまここ」＝現在／グレー番号＝未処理）の
   縦積みリストに変更した（旧.workflow-steps横並び小箱・wf-current-banner別枠は廃止） */
.wf-stepper{display:flex;flex-direction:column;gap:8px;margin:14px 0 18px}
.wf-steprow{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--m-line);border-radius:10px;background:var(--panel);transition:.15s}
.wf-steprow.done{background:var(--m-greensoft);border-color:var(--m-green)}
.wf-steprow.current{border-color:var(--m-red);border-width:2px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.wf-stepcircle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0}
.wf-stepcircle.done{background:var(--m-green);color:#fff}
.wf-stepcircle.current{background:var(--m-red);color:#fff}
.wf-stepcircle.wait{background:var(--m-line);color:var(--m-muted)}
.wf-steptext{flex:1;min-width:0}
.wf-steptitle{font-weight:700;font-size:13px}
.wf-stepmeta{font-size:11px;color:var(--m-muted);margin-top:2px}
.wf-nowtag{color:var(--m-red);font-weight:800;font-size:11px;white-space:nowrap}
.wf-rowtag{font-size:11px;font-weight:700;white-space:nowrap}
.wf-rowtag.done{color:var(--m-green)}
.wf-rowtag.wait{color:var(--m-muted);font-weight:600}
.detail-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
/* 処理フローの各工程カード（2026-09-03再設計→再調整。ユーザー提供の参考HTMLの枠・文字サイズ・
   色合いに合わせた：カードにうっすら影をつけて浮かせ、余白を広めに、番号は濃い円形バッジ） */
.step-card{background:var(--panel);border:1px solid var(--m-line);border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:var(--shadow)}
/* 2026-09-05追加：ユーザー要望「止まっているタスク（いまここ）をもっと強調してほしい」に対応。
   本部タスクのサブタスク一覧と同じく、現在のカードだけ赤枠で強調する */
.step-card.current{border-color:var(--m-red);border-width:2px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.step-card-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;border-bottom:1px dashed var(--m-line);padding-bottom:12px}
.step-num{background:var(--ink);color:var(--panel);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:0 0 auto}
/* 2026-09-05追加：ユーザー要望「番号が消えて緑色のチェックがつく」に対応。完了カードは丸数字の
   代わりに緑チェック、現在のカードは赤丸＋番号、未処理はグレー丸＋番号で区別する */
.step-num.done{background:var(--m-green);color:#fff}
.step-num.current{background:var(--m-red);color:#fff}
.step-num.wait{background:var(--m-line);color:var(--m-muted)}
.step-title{font-size:15px;font-weight:800;margin:0;flex:1}
.step-badge{font-size:10px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--m-line);color:var(--m-muted)}
.step-badge.done{background:var(--m-greensoft);color:var(--m-green)}
.step-badge.current{background:var(--m-redsoft);color:var(--m-red);font-weight:800}
/* 本部タスク紐付け欄（参考HTMLの.checkbox-wrap＝淡い青の枠つきボックス準拠） */
.task-link-box{background:var(--m-bluesoft);border:1px solid var(--m-blue);border-radius:8px;padding:12px}
.task-link-box>small{color:var(--m-blue)!important;font-weight:800!important}
.evidence-panel{background:#e5e0d8;border:1px solid var(--m-line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:600px}
.evidence-panel .ep-head{padding:12px 16px;font-size:12px;font-weight:800;display:flex;justify-content:space-between;align-items:center;color:var(--m-muted)}
.evidence-panel .ep-body{padding:0 16px 16px;flex:1;overflow:auto}
.evidence-panel .ep-tabs{display:flex;gap:5px;padding:0 16px 16px;overflow:auto}
.evidence-panel .ep-tabs button{border:1px solid var(--m-line);background:var(--panel);border-radius:7px;padding:6px 8px;font-size:10px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.evidence-panel .ep-tabs button.active{background:var(--ink);color:var(--panel)}
.ep-preview iframe,.ep-preview img{width:100%;min-height:420px;border:0;background:#fff;border-radius:8px}
/* 証憑プレビュー内の添付カードは「紙」らしく1枚ずつ大きく・影つきで見せる（参考HTML準拠） */
.evidence-panel .attgrid{grid-template-columns:1fr;padding-top:16px}
.evidence-panel .attcard{box-shadow:0 10px 30px rgba(0,0,0,.12);border:1px solid #ddd}
.evidence-panel .attcard-preview{height:480px}
.detail-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.detail-tabs button{border:1px solid var(--m-line);background:var(--panel);border-radius:999px;padding:8px 12px;font-size:12px;cursor:pointer;color:var(--ink);font-weight:700}
.detail-tabs button.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dtab{display:none}
.dtab.active{display:block}
.task-panel{border:1px solid var(--m-line);border-radius:12px;background:var(--panel);padding:14px;position:sticky;top:0}
.task-panel h4{margin:0 0 6px;font-size:13px}
.task-progress-num{font-size:26px;font-weight:900;margin:2px 0 10px}
.task-step{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--m-line);font-size:11px;align-items:center}
.task-step:last-child{border-bottom:0}
.task-step .icon{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--m-line);flex:0 0 auto;font-size:10px;font-weight:800;color:var(--m-muted)}
.task-step.done .icon{background:var(--m-green);border-color:var(--m-green);color:#fff}
.task-step.current .icon{background:var(--m-blue);border-color:var(--m-blue);color:#fff}
.risk-card{padding:11px;border-radius:9px;margin-bottom:8px;font-size:12px}
.risk-card.danger{background:var(--m-redsoft);border:1px solid var(--m-red)}
.risk-card h5{font-size:12px;margin:0 0 4px;font-weight:800}
.conf-row{display:grid;grid-template-columns:80px 1fr 36px;gap:8px;align-items:center;padding:4px 0;font-size:11px}
.conf-bar{height:7px;background:var(--m-line);border-radius:999px;overflow:hidden}
.conf-bar span{display:block;height:100%;background:var(--m-green)}
@media(max-width:900px){.detail-layout{grid-template-columns:1fr}}
.mail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mail-actions button{border:1px solid var(--m-line);background:var(--panel);border-radius:8px;padding:10px 16px;cursor:pointer;color:var(--ink);font-size:13px;font-weight:700}
.mail-actions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.mail-actions .green{background:var(--green);color:#fff;border-color:var(--green)}
.mail-history{margin-top:14px;border-top:1px solid var(--m-line);padding-top:12px}
.mail-history-row{display:grid;grid-template-columns:12px 1fr;gap:8px;padding:7px 0;font-size:11px;color:var(--muted)}
.mail-history-row span:first-child{width:8px;height:8px;background:#cfc6bc;border-radius:50%;margin-top:4px}
.mail-history-row.done span:first-child{background:var(--green)}
.comment-section{margin-top:14px;border-top:1px solid var(--m-line);padding-top:12px}
.comment-row{padding:8px 0;border-bottom:1px solid var(--m-line);font-size:12px}
.comment-row:last-child{border-bottom:none}
.comment-row .cmeta{color:var(--muted);font-size:10px;margin-bottom:3px}
.comment-row .cbody{white-space:pre-wrap}
.comment-form{margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.comment-form textarea{flex:1;border:1px solid var(--m-line);border-radius:8px;padding:8px;min-height:44px;background:var(--panel);color:var(--ink);resize:vertical}
.due-badge{padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;display:inline-block}
.due-badge.overdue{background:var(--accent-soft);color:var(--accent)}
.due-badge.soon{background:var(--amber-soft);color:var(--amber)}

/* 2026-09-04新規：会計ダッシュボード（確定UI版）。既存の色トークン（--accent/--green/--amber/
   --blue等）をそのまま使い、新しい配色を増やさない＝既存デザインシステムへの統合(指示書§30-31) */
.select-box{border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;background:var(--panel);color:var(--ink)}
/* 2026-09-04新規：請求書「対象店舗」の複数選択ドロップダウン */
.store-ms{position:relative}
.store-ms-toggle{width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--panel);color:var(--ink);cursor:pointer;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 2026-09-05修正：ユーザー報告「店舗選ぶときのプルダウンのUIが崩れてる」に対応。
   従来left:0;right:0だと、対象店舗欄が入っている狭いグリッド列の幅にパネルが強制的に
   合わせられ、店舗名が2行に折り返され崩れて見えていた。right:0を外しmin-widthを
   指定することで、列の幅より広く必要な分だけ広がるようにした */
.store-ms-panel{position:absolute;top:100%;left:0;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);margin-top:4px;max-height:260px;overflow-y:auto;padding:8px;min-width:260px;width:max-content;max-width:360px}
.store-ms-panel label{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:13px;cursor:pointer;border-radius:6px;white-space:nowrap}
.store-ms-panel label:hover{background:var(--bg)}
.store-ms-panel hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.store-tags{display:flex;flex-wrap:wrap;gap:5px}
.store-tag{background:var(--blue-soft);color:var(--blue);border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
/* 2026-09-04新規：請求書詳細UX整理指示書対応。折りたたみカード・単一状態バッジ・現在工程バナー */
.step-card-head{position:relative;padding-right:28px}
.step-chevron{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);cursor:pointer}
.step-summary{font-size:12px;color:var(--muted);padding:4px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step-summary-edit{background:none;border:none;color:var(--blue);cursor:pointer;font-size:11px;font-weight:700;padding:0}
/* 2026-09-05：.step-badge.currentの重複定義を整理（旧amber色はここで上書きされ実質死んでいた。
   line164の赤系定義に一本化） */
.step-badge.wait{background:var(--bg);color:var(--muted)}
.pl-state{display:inline-block;font-size:13px;font-weight:800;padding:2px 0}
.pl-state.done{color:var(--green)}
.pl-state.wait{color:var(--blue)}
.pl-state.excluded{color:var(--muted)}
.pl-state.seisan{color:var(--amber)}
.event-map-table{width:100%;border-collapse:collapse;font-size:12px}
.event-map-table th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--m-line)}
.event-map-table td{padding:8px;border-bottom:1px solid var(--m-line);vertical-align:top}
.event-map-table tr:last-child td{border-bottom:none}

/* 2026-09-04新規：給与振込タブ（ユーザー提供モックアップ準拠）。色は新規トークンを増やさず
   既存の--bg/--panel/--ink/--muted/--line/--accent/--green/--blue/--amber等をそのまま使う */
.pr-hero{display:grid;grid-template-columns:1.35fr .65fr;gap:12px;margin-bottom:14px}
.pr-hero-main{padding:18px 20px;border-left:5px solid var(--accent)}
.pr-hero-main .eyebrow{font-size:10px;color:var(--muted);font-weight:700}
.pr-hero-title{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:5px}
.pr-hero-title .month{font-size:32px;font-weight:900;letter-spacing:-.03em}
.pr-hero-title .label{padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:800}
.pr-hero-main p{font-size:10px;color:var(--muted);margin:9px 0 0}
.pr-hero-side{padding:16px}
.pr-hero-side label{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}
.pr-hero-side select,.pr-hero-side input{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}
.pr-sync-box{margin-top:10px;padding:10px;border-radius:9px;background:var(--blue-soft);border:1px solid var(--blue);color:var(--blue);font-size:9px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pr-alert-panel{padding:15px;margin-bottom:14px;border-left:5px solid var(--accent)}
.pr-alert-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
.pr-alert-head h2{font-size:16px;margin:0}
.pr-alert-total{font-size:24px;font-weight:900;color:var(--accent)}
.pr-alert-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pr-alert-item{border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;cursor:pointer;transition:.15s}
.pr-alert-item:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.pr-alert-item .name{font-size:9px;color:var(--muted)}
.pr-alert-item b{display:block;font-size:18px;margin-top:4px}
.pr-alert-item.zero{background:var(--bg);color:#aaa}
.pr-ok-banner{padding:13px;border-radius:10px;background:var(--green-soft);border:1px solid var(--green);color:var(--green);font-size:10px;margin-bottom:14px}
.pr-progress-card{padding:15px;margin-bottom:14px}
.pr-progress-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:12px}
.pr-progress-head h2{margin:0;font-size:16px}
.pr-progress-head p{margin:4px 0 0;color:var(--muted);font-size:9px}
.pr-progress-flow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.pr-pstep{border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--bg)}
.pr-pstep.done{background:var(--green-soft);border-color:var(--green)}
.pr-pstep.warn{background:var(--amber-soft);border-color:var(--amber)}
.pr-pstep.current{background:var(--blue-soft);border-color:var(--blue)}
.pr-pstep small{display:block;color:var(--muted);font-size:8px}
.pr-pstep b{display:block;font-size:13px;margin-top:3px}
.pr-pstep .count{font-size:19px;font-weight:900;margin-top:6px}
.pr-pstep .bar{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:8px}
.pr-pstep .bar span{display:block;height:100%;background:var(--blue)}
.pr-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.pr-kpi{padding:14px;cursor:pointer}
.pr-kpi small{display:block;color:var(--muted);font-size:9px}
.pr-kpi b{display:block;font-size:24px;margin-top:5px}
.pr-kpi .amount{font-size:12px;font-weight:700;margin-top:3px}
.pr-kpi .sub{font-size:8px;color:var(--muted);margin-top:4px}
.pr-kpi.total{border-top:4px solid var(--blue)}
.pr-kpi.prep{border-top:4px solid var(--amber)}
.pr-kpi.csv{border-top:4px solid #7d68bd}
.pr-kpi.paid{border-top:4px solid var(--green)}
.pr-kpi.cash{border-top:4px solid #9a7a49}
.pr-filters{padding:14px;margin-bottom:12px}
.pr-filter-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pr-filter-row select,.pr-filter-row input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;font-size:10px}
.pr-quick-filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pr-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:10px}
.pr-chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pr-chip.attn{border-color:var(--accent);color:var(--accent)}
.pr-batchbar{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--blue);background:var(--blue-soft);border-radius:10px;margin-bottom:10px;font-size:10px}
.pr-table th,.pr-table td{padding:9px;border-bottom:1px solid var(--line);font-size:10px;text-align:left;vertical-align:middle}
.pr-table th{background:var(--bg);color:var(--muted)}
.pr-status{display:inline-flex;align-items:center;gap:4px;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800}
.pr-status.ok{background:var(--green-soft);color:var(--green)}
.pr-status.wait{background:var(--blue-soft);color:var(--blue)}
.pr-status.warn{background:var(--amber-soft);color:var(--amber)}
.pr-status.err{background:var(--accent-soft);color:var(--accent)}
.pr-status.na{background:var(--bg);color:var(--muted)}
.pr-reason{display:block;color:var(--accent);font-size:9px;margin-top:4px;max-width:210px;white-space:normal;line-height:1.35}
.pr-footer-actions{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 14px;background:var(--bg);border-top:1px solid var(--line)}
.pr-footer-actions small{font-size:9px;color:var(--muted)}
@media(max-width:1200px){.pr-alert-grid,.pr-kpis,.pr-progress-flow{grid-template-columns:repeat(3,1fr)}.pr-filter-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.pr-hero,.pr-alert-grid,.pr-kpis,.pr-progress-flow,.pr-filter-row{grid-template-columns:1fr}}
.dash-section-title{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 10px 2px}
.dash-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.dash-action-card{background:var(--accent-soft);border:1px solid var(--accent);border-left:5px solid var(--accent);border-radius:10px;padding:14px;cursor:pointer;transition:.15s}
.dash-action-card:hover{transform:translateY(-2px)}
.dash-action-card.warning{background:var(--amber-soft);border-color:var(--amber);border-left-color:var(--amber)}
.dash-action-card .dtitle{font-size:13px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:3px}
.dash-action-card .dcount{font-size:17px;font-weight:800;color:var(--accent)}
.dash-action-card.warning .dcount{color:var(--amber)}
.dash-action-card .ddesc{font-size:11px;color:var(--muted)}
.dash-action-empty{background:var(--green-soft);border:1px solid var(--green);border-radius:10px;padding:14px;font-size:13px;font-weight:700;color:var(--green);grid-column:1/-1;text-align:center}
.dash-kpi-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.15s}
.dash-kpi-card:hover{background:var(--bg)}
.dash-kpi-card.alert{border-color:var(--accent);background:var(--accent-soft)}
.dash-kpi-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:4px}
.dash-kpi-val{font-size:22px;font-weight:800}
.dash-kpi-card.alert .dash-kpi-label,.dash-kpi-card.alert .dash-kpi-val{color:var(--accent)}
.dash-two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px}
.dash-progress-row{margin-bottom:14px}
.dash-progress-row:last-child{margin-bottom:0}
.dash-p-head{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:5px}
.dash-p-meta{color:var(--muted);font-size:11px;font-weight:normal}
.dash-p-bar-bg{background:var(--line);height:7px;border-radius:4px;overflow:hidden}
.dash-p-bar-fill{background:var(--blue);height:100%;border-radius:4px}
.dash-money-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;border-bottom:1px solid var(--line);padding-bottom:18px}
.dash-money-item{display:flex;flex-direction:column}
.dash-m-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.dash-m-val{font-size:18px;font-weight:700}
.dash-schedule-row{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.dash-schedule-row:hover{background:var(--bg)}
.dash-schedule-row:last-child{border:none;padding-bottom:0}
.dash-schedule-row.alert{color:var(--accent);font-weight:700}
.dash-reason-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:26px}
.dash-reason-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.dash-reason-card:hover{background:var(--amber-soft);border-color:var(--amber)}
.dash-reason-badge{background:var(--amber-soft);color:var(--amber);padding:2px 8px;border-radius:12px;font-size:11px;font-weight:800}
@media(max-width:900px){.dash-grid-4,.dash-two-col,.dash-reason-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.dash-grid-4,.dash-two-col,.dash-reason-grid{grid-template-columns:1fr}}
.iv-filterbar{padding:12px;border-bottom:1px solid var(--m-line);display:flex;gap:8px;flex-wrap:wrap;align-items:end}

.iv-filterbar .ivf small{font-size:10px;color:var(--muted)}
.iv-filterbar input,.iv-filterbar select{border:1px solid var(--m-line);border-radius:8px;padding:7px 8px;background:var(--panel);color:var(--ink);font-size:12px}

.replybox{margin-top:14px;border-top:1px solid var(--m-line);padding-top:12px;display:none}
.replybox.open{display:block}
.replybox textarea{width:100%;border:1px solid var(--m-line);border-radius:10px;padding:10px;min-height:100px;background:var(--panel);color:var(--ink)}
.confirmbox{background:var(--bg);border:1px solid var(--m-line);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;white-space:pre-wrap}

</div>
<script>
/* ============================================================
   認証・セッション（index.html / expenses.html と同一実装）
   ============================================================ */
const SUPA_URL="https://uuvsxzhpxtghojoubjcc.supabase.co";
const SUPA_KEY="sb_publishable_MrwPJAx_Ws_fdRutprKCiQ_dg3wCiTr";
const LS_KEY="nsportal_session_v1";
const BUCKET="invoice-files";
// 統合ポータルシェル(portal.html)からiframe埋め込みされる際、自前のヘッダー（タイトル・
// 「←ポータルへ」リンク）を隠す＝担当F(F-3)からの依頼対応。同一オリジンのためログイン
// セッション(localStorage)はportal.htmlと共有され、埋め込み時も自動ログインされる想定
const EMBED=new URLSearchParams(location.search).get("embed")==="1";

const MAIL_STATUS_LABEL={unread:"未処理",read:"未処理",processing:"処理中",completed:"完了",archived:"対象外",standalone:"取込済み"};
const MAIL_STATUS_PILL={unread:"red",read:"red",processing:"blue",completed:"green",archived:"gray",standalone:"gray"};
const INVOICE_STATUS_LABEL={draft:"下書き",registered:"確認中",duplicate_suspected:"重複疑い",waiting_payment:"支払待ち",paid:"完了",cancelled:"取消"};
const INVOICE_STATUS_CLASS={draft:"gray",registered:"check",duplicate_suspected:"wait",waiting_payment:"wait",paid:"done",cancelled:"gray"};
// 2026-08-25 Phase1.6: メール種類（請求書/売上/契約書）。手動分類（自動判定はしない）。
// mail_kindがnull=未分類（新規取込メールの初期状態）
const MAIL_KIND_LABEL={invoice:"📄請求書",sales:"💰売上",contract:"📃契約書"};
const MAIL_KIND_ORDER=["invoice","sales","contract"];
// 売上（入金明細）は請求書と同じinvoicesテーブル・同じstatus値を使うが表示ラベルだけ変える
const SALES_STATUS_LABEL={draft:"下書き",registered:"確認中",duplicate_suspected:"重複疑い",waiting_payment:"入金待ち",paid:"入金済み",cancelled:"取消"};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sess={get:()=>{try{return JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return null}},
            set:v=>localStorage.setItem(LS_KEY,JSON.stringify(v)),
            clear:()=>localStorage.removeItem(LS_KEY)};

async function api(path,opt={},token){
  const r=await fetch(SUPA_URL+path,{...opt,headers:{
    "apikey":SUPA_KEY,...(opt.isBinary?{}:{"Content-Type":"application/json"}),
    ...(token?{"Authorization":"Bearer "+token}:{}),...(opt.headers||{})}});
  let body=null; const tx=await r.text(); try{body=tx?JSON.parse(tx):null}catch(e){}
  return {ok:r.ok,status:r.status,body};
}
async function authed(path,opt={}){
  const s=sess.get(); if(!s) return {ok:false,status:401,body:null};
  let r=await api(path,opt,s.at);
  // Supabase Storage API（例: 添付ファイルの署名URL発行）はトークン期限切れ時、
  // PostgREST/authと違い401ではなく400+code:"InvalidJWT"を返すため、その場合も再試行する
  // （2026-08-25 担当B調査→担当C対応: 添付が開けない不具合）
  if(r.status===401 || (r.status===400 && r.body?.code==="InvalidJWT")){ if(!await refresh()) return r; r=await api(path,opt,sess.get().at); }
  return r;
}
async function refresh(){
  const s=sess.get(); if(!s?.rt) return false;
  const r=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.rt})});
  if(!r.ok){sess.clear();return false}
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});
  return true;
}
async function fetchMe(){
  const s=sess.get(); if(!s) return null;
  const r=await authed(`/rest/v1/users?id=eq.${s.uid}&select=*`);
  if(!r.ok||!Array.isArray(r.body)||!r.body[0]) return null;
  return r.body[0];
}
async function signAttachmentUrls(paths){
  if(!paths.length) return {};
  const r=await authed(`/storage/v1/object/sign/${BUCKET}`,{method:"POST",body:JSON.stringify({expiresIn:3600,paths})});
  const map={};
  (Array.isArray(r.body)?r.body:[]).forEach(x=>{ if(x.path&&x.signedURL) map[x.path]=`${SUPA_URL}/storage/v1${x.signedURL}`; });
  return map;
}
function fmtDT(t){ if(!t) return "—"; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function fmtD(t){ if(!t) return "—"; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; }
function yen(n){ return n==null?"—":"¥"+Number(n).toLocaleString(); }
// 広告費として反映（C-7②・2026-08-31）: 送信元アドレスの一部から媒体名を推定するための対応表。
// ここに無い媒体の請求書が来るようになったら、この対応表に追記すれば拾えるようになる
// （担当Cに「〇〇からの請求書も広告費として認識してほしい」と伝えてもらえれば追記対応する）
const AD_MEDIA_DOMAIN_MAP=[
  {domain:"tabelog.com",media:"食べログ"},
  {domain:"kakaku.co.jp",media:"食べログ"},
  {domain:"gnavi.co.jp",media:"ぐるなび"},
  {domain:"hotpepper.jp",media:"ホットペッパー"},
  {domain:"recruit.co.jp",media:"ホットペッパー"},
  {domain:"retty.me",media:"Retty"},
  {domain:"google.com",media:"Google広告"},
  {domain:"line.me",media:"LINE広告"},
];
function adcostGuessMedia(fromAddress,subject){
  const from=(fromAddress||"").toLowerCase();
  const hit=AD_MEDIA_DOMAIN_MAP.find(m=>from.includes(m.domain));
  if(hit) return hit.media;
  // ドメインで拾えない場合は件名からのゆるい推測（サブブランド・別ドメインからの請求も拾う保険）
  const subj=(subject||"");
  for(const m of AD_MEDIA_DOMAIN_MAP){ if(subj.includes(m.media)) return m.media; }
  return null;
}
// マネーフォワード連携Edge Function（mf-journal）への共通呼び出し。仕訳作成モーダル（openMailDetail内）と
// 設定タブの仕訳辞書管理の両方から使うため、トップレベルに置く（2026-08-31）
async function mfCall(action,extra={}){
  const s=sess.get();
  const r=await fetch(SUPA_URL+"/functions/v1/mf-journal",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({action,...extra})});
  const j=await r.json().catch(()=>({}));
  return {ok:r.ok,body:j};
}
// MF仕訳→PL自動反映（手数料等・ラウンド5指示書§6.1）。pl-fee-reflect Edge Functionの薄いラッパー
async function plFeeCall(action,extra={}){
  const s=sess.get();
  const r=await fetch(SUPA_URL+"/functions/v1/pl-fee-reflect",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({action,...extra})});
  const j=await r.json().catch(()=>({}));
  return {ok:r.ok,body:j};
}
// 取引先マスタ・銀行口座・自動判定（会計・請求書処理の全面刷新・2026-09-03）のEdge Function呼び出し
async function vendorCall(action,extra={}){
  const s=sess.get();
  const r=await fetch(SUPA_URL+"/functions/v1/vendor-master",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({action,...extra})});
  const j=await r.json().catch(()=>({}));
  return {ok:r.ok,body:j};
}
async function autoMatchCall(extra={}){
  const s=sess.get();
  const r=await fetch(SUPA_URL+"/functions/v1/invoice-auto-match",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify(extra)});
  const j=await r.json().catch(()=>({}));
  return {ok:r.ok,body:j};
}
// 2026-09-04新規：本部タスクevent_type連携（指示書②③④⑤）。invoice_id×event_typeで
// 冪等に発火するRPCの薄いラッパー。マッピングが無ければ何も完了させずskipped_no_mappingが
// 返るだけ＝呼ぶだけなら常に安全（結果を確認して画面に反映するかは呼び出し元の任意）
async function fireInvoiceEvent(invoiceId,eventType){
  if(!invoiceId) return {ok:false,body:{error:"invoice_idがありません"}};
  const r=await authed("/rest/v1/rpc/invoice_fire_task_event",{method:"POST",body:JSON.stringify({p_invoice_id:invoiceId,p_event_type:eventType})});
  return {ok:r.ok,body:r.body};
}
let PL_FEE_TARGET_ACCOUNTS=null; // PL連携対象科目のキャッシュ（設定タブで増減したらnullに戻して再取得する）
async function plFeeTargetAccounts(){
  if(PL_FEE_TARGET_ACCOUNTS) return PL_FEE_TARGET_ACCOUNTS;
  const r=await plFeeCall("list_target_accounts");
  PL_FEE_TARGET_ACCOUNTS=(r.ok&&r.body.accounts)||[];
  return PL_FEE_TARGET_ACCOUNTS;
}
function plfeeFindStoreByName(stores,name){
  if(!name||!stores) return null;
  const norm=s=>String(s||"").replace(/\s+/g,"");
  const n=norm(name);
  return stores.find(s=>norm(s.name)===n) || stores.find(s=>n.includes(norm(s.name))||norm(s.name).includes(n)) || null;
}
/* ============================================================
   会計仕訳→PL自動反映パネル（ラウンド5指示書§6.1／設計書_広告費自動連携_§5・2026-09-01
   →2026-09-03拡張: 「事前登録した科目だけ」から「仕訳登録済みの請求書すべて」が対象に）
   広告費（adcostbox系）と同じ骨組み。mfj（メール請求書の仕訳作成）・mfu
   （アップロード請求書＝会計タブ）の両方の画面から共通で呼べるよう、呼び出し元に依存する情報は
   すべてctxで受け取るトップレベル関数として実装する（クロージャに閉じ込めない）。
   店舗・勘定科目・補助科目は、その場の入力状態ではなく実際に登録済みの仕訳（get_journal＝
   マネーフォワード本体の内容そのもの）から毎回読み直す＝再度この画面を開いたときも正しく出る。
   ctx: {boxId, invoiceId, journalId, tenantId, fallbackAmount, onDone}
   ============================================================ */
let PLFEE_STATE={};
async function plfeeInit(ctx){
  const box=$(ctx.boxId);
  if(!box) return;
  const keepStores=PLFEE_STATE.stores; // 店舗一覧だけは使い回す（毎回引き直す必要はないため）
  PLFEE_STATE={ctx, stores:keepStores};
  box.innerHTML=`<div class="adcost-box"><div style="font-size:12px;color:var(--muted)">読み込み中…</div></div>`;
  const st=await plFeeCall("status",{invoice_id:ctx.invoiceId});
  if(!st.ok){ box.innerHTML=`<div class="adcost-box"><div class="err">PL反映状況の取得に失敗しました: ${esc(st.body.error||"")}</div></div>`; return; }
  PLFEE_STATE.excludedAt=st.body.excluded_at||null;
  PLFEE_STATE.reflections=Array.isArray(st.body.reflections)?st.body.reflections:[];
  if(!PLFEE_STATE.stores){
    // seisan_target=精算対象店舗。精算書に入力すれば別途PLへ自動連携される仕組みが既にあるため、
    // ここ（請求書仕訳→PL直接反映）の対象からは外す＝二重計上防止（ユーザー指摘・2026-09-03）
    const r=await authed("/rest/v1/stores?select=id,name,seisan_target&order=name");
    PLFEE_STATE.stores=(r.ok&&Array.isArray(r.body))?r.body:[];
  }
  if(!PLFEE_STATE.yearMonth){
    const d=new Date();
    PLFEE_STATE.yearMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
  }
  PLFEE_STATE.groups=null; PLFEE_STATE.selectedGroupIdx=0; PLFEE_STATE.manualGroup=false; PLFEE_STATE.rows=null; PLFEE_STATE.skippedSeisan=null;
  if(!PLFEE_STATE.excludedAt) await plfeeLoadJournalGroups();
  plfeeRenderPanel();
}
// 実際に登録済みの仕訳（get_journal）を読み直し、借方科目ごと（勘定科目×補助科目）にグループ化する。
// PL科目に限定（設定タブ「PL連携対象科目」に登録済みの科目のみ）し、既にPL反映済みの科目
// （PLFEE_STATE.reflections）も候補から除外する（ユーザー指摘・2026-09-03: 前払費用等の
// 資産科目まで無条件にPLへ載せてしまわないようにするため）
async function plfeeLoadJournalGroups(){
  const ctx=PLFEE_STATE.ctx;
  if(!ctx.journalId){ PLFEE_STATE.groups=[]; return; }
  const [r,targets]=await Promise.all([
    mfCall("get_journal",{journal_id:ctx.journalId, tenant_id:ctx.tenantId||"default"}),
    plFeeTargetAccounts(),
  ]);
  const branches=(r.ok&&Array.isArray(r.body.branches))?r.body.branches:[];
  const already=new Set((PLFEE_STATE.reflections||[]).map(x=>(x.account_name||"")+""+(x.sub_account_name||"")));
  const map=new Map();
  for(const b of branches){
    const d=b.debit;
    if(!d||!d.account_name||!(Number(d.value)>0)) continue;
    if(!targets.some(t=>t.account_name===d.account_name)) continue; // PL科目として未登録の科目は対象外
    const key=d.account_name+""+(d.sub_account_name||"");
    if(already.has(key)) continue;
    if(!map.has(key)) map.set(key,{accountName:d.account_name, subAccountName:d.sub_account_name||"", branches:[]});
    map.get(key).branches.push(d);
  }
  PLFEE_STATE.groups=Array.from(map.values());
}
async function plfeeComputeAllocation(group){
  const total=group.branches.reduce((s,d)=>s+Number(d.value),0);
  PLFEE_STATE.total=total;
  const withDept=group.branches.filter(d=>d.department_name);
  if(withDept.length){
    // 精算対象店舗（stores.seisan_target）は精算書経由で別途PLへ自動連携される仕組みが既にあるため、
    // ここでは選ばせない＝二重計上防止（ユーザー指摘・2026-09-03）。skippedに理由つきで記録しておき、
    // パネルに案内を出す
    const rows=[]; const skipped=[];
    for(const d of withDept){
      const store=plfeeFindStoreByName(PLFEE_STATE.stores,d.department_name);
      if(!store||!(Number(d.value)>0)) continue;
      if(store.seisan_target){ skipped.push({name:store.name,amount:Math.round(Number(d.value))}); continue; }
      rows.push({store_id:store.id,store_name:store.name,amount:Math.round(Number(d.value))});
    }
    PLFEE_STATE.skippedSeisan=skipped.length?skipped:null;
    if(rows.length){ PLFEE_STATE.rows=rows; PLFEE_STATE.source="mf_department"; return; }
    if(skipped.length){ PLFEE_STATE.rows=[]; PLFEE_STATE.source="all_seisan"; return; } // 全て精算対象店舗だった
  }
  // 前月・同科目（補助科目まで一致）で反映済みの実績があれば、その店舗比率で今回の金額を按分する
  const cur=new Date(PLFEE_STATE.yearMonth);
  const prev=new Date(cur.getFullYear(),cur.getMonth()-1,1);
  const prevYm=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}-01`;
  const subFilter=group.subAccountName?`&sub_account_name=eq.${encodeURIComponent(group.subAccountName)}`:`&sub_account_name=is.null`;
  const r=await authed(`/rest/v1/invoice_pl_reflections?account_name=eq.${encodeURIComponent(group.accountName)}${subFilter}&year_month=eq.${prevYm}&select=allocations`);
  const prevRows=(r.ok&&Array.isArray(r.body))?r.body:[];
  const sums=new Map(); let grand=0;
  for(const row of prevRows) for(const a of (row.allocations||[])){
    const amt=Number(a.amount)||0; grand+=amt;
    const c=sums.get(a.store_id)||{store_name:a.store_name,amount:0}; c.amount+=amt; sums.set(a.store_id,c);
  }
  if(grand>0){
    const rows=Array.from(sums,([store_id,v])=>({store_id,store_name:v.store_name,amount:Math.round(total*(v.amount/grand))}));
    const sum=rows.reduce((s,x)=>s+x.amount,0);
    if(rows.length) rows[rows.length-1].amount+=(total-sum); // 端数調整
    PLFEE_STATE.rows=rows; PLFEE_STATE.source="prev_month_ratio";
    return;
  }
  PLFEE_STATE.rows=[{store_id:"",store_name:"",amount:total}];
  PLFEE_STATE.source="manual";
}
async function plfeeSelectGroup(idx,manual){
  PLFEE_STATE.selectedGroupIdx=idx; PLFEE_STATE.manualGroup=!!manual; PLFEE_STATE.rows=null;
  if(manual){
    PLFEE_STATE.currentAccount=""; PLFEE_STATE.currentSubAccount="";
    PLFEE_STATE.total=Number(PLFEE_STATE.ctx.fallbackAmount)||0;
    PLFEE_STATE.rows=[{store_id:"",store_name:"",amount:PLFEE_STATE.total}];
    PLFEE_STATE.source="manual";
  }else{
    const g=PLFEE_STATE.groups[idx];
    PLFEE_STATE.currentAccount=g.accountName; PLFEE_STATE.currentSubAccount=g.subAccountName;
    await plfeeComputeAllocation(g);
  }
  plfeeRenderPanel();
}
function plfeeSourceLabel(){
  return {
    mf_department:"📊 今回登録した仕訳の部門（店舗）別金額から自動で割り振りました。",
    prev_month_ratio:"📊 店舗別の内訳が仕訳に無かったため、前月の同科目の店舗比率から按分しています。",
    manual:"📊 参考にできる情報が無かったため、店舗を選んで金額を入力してください。",
  }[PLFEE_STATE.source]||"";
}
function plfeeSkippedSeisanHtml(){
  const skipped=PLFEE_STATE.skippedSeisan;
  if(!skipped||!skipped.length) return "";
  const list=skipped.map(s=>`${esc(s.name)}（${yen(s.amount)}）`).join("・");
  return `<div class="adcost-source" style="color:var(--amber)">⚠️ ${list}は精算対象店舗のため、ここでは反映していません。精算書に入力してください（自動でPLにも反映されます・二重計上防止のため）。</div>`;
}
function plfeeReflectedCardHtml(row){
  const a=row.allocations||[];
  const ym=(row.year_month||"").slice(0,7);
  const label=row.account_name+(row.sub_account_name?"/"+row.sub_account_name:"");
  const total=a.reduce((s,x)=>s+(Number(x.amount)||0),0);

  return `<div class="adcost-badge-row" style="margin-bottom:6px">

function plfeeUpdateTotals(){
  const total=PLFEE_STATE.rows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const baseAmt=Number(PLFEE_STATE.total)||0;
  const diff=baseAmt-total;
  if($("plfee-total-sum")) $("plfee-total-sum").textContent=yen(total);
  const diffBox=$("plfee-diff-box");
  if(diffBox){ diffBox.className=diff===0?"adcost-diff-ok":"adcost-diff-ng"; diffBox.innerHTML=`差額 <b>${yen(diff)}</b> ${diff===0?"✓":""}`; }
}
function plfeeGroupPickerHtml(){

function plfeeRenderPanel(){
  const box=$(PLFEE_STATE.ctx.boxId);
  if(!box) return;
  // 2026-09-05新規：反映履歴の「取り消す」ボタン配線（4つある描画分岐すべてに履歴表示が
  // 含まれるため、box全体へのイベント委任で1箇所だけ書けば済むようにした）
  box.onclick=async(e)=>{
    const btn=e.target.closest("[data-plfee-unconfirm]");
    if(!btn) return;
    if(!confirm("このPL反映を取り消しますか？\n\nシート（Google Sheets）側の数字は、正しい内容で再度反映するまでは古いまま残ります（削除ではなく上書き方式のため）。金額や科目を直したい場合は、取り消した後にもう一度正しい内容で「PLに反映」してください。")) return;
    btn.disabled=true; btn.textContent="取り消し中…";
    const r=await plFeeCall("unconfirm",{invoice_id:PLFEE_STATE.ctx.invoiceId,reflection_id:btn.dataset.plfeeUnconfirm});
    if(!r.ok){ alert(r.body.error||"取り消しに失敗しました"); btn.disabled=false; btn.textContent="↩️ 取り消す"; return; }
    await plfeeInit(PLFEE_STATE.ctx);
  };
  // 2026-09-04：請求書詳細UX整理指示書対応。「現在の状態」と「過去の反映履歴」が混在して
  // 矛盾して見える（指示書の指摘）ため、履歴は折りたたみの別枠にし、現在の状態・操作と
  // 混ぜて表示しないようにした
  const reflections=PLFEE_STATE.reflections||[];
  const reflectedHtml=reflections.length?`<details style="margin-bottom:10px"><summary style="cursor:pointer;font-size:12px;color:var(--muted);font-weight:700">▼ 反映履歴（${reflections.length}件）</summary><div style="margin-top:6px">${reflections.map(plfeeReflectedCardHtml).join("")}</div></details>`:"";

  if(PLFEE_STATE.excludedAt){
    box.innerHTML=`<div class="adcost-box">
      <h3>📊 PL反映</h3>
      ${reflectedHtml}
      <div class="adcost-badge-row">🚫 対象外にしました（この請求書はPLに反映しません）　${fmtDT(PLFEE_STATE.excludedAt)}</div>
      <div class="mail-actions" style="margin-top:8px"><button id="plfee-unexclude">🔄 取り消してPLに反映する</button></div>
    </div>`;
    $("plfee-unexclude").onclick=plfeeUnexclude;
    return;
  }

  const groups=PLFEE_STATE.groups||[];
  if(!groups.length && !PLFEE_STATE.manualGroup){
    box.innerHTML=`<div class="adcost-box">
      <h3>📊 PLへ反映しますか？</h3>
      ${reflectedHtml}
      <div class="adcost-sub">${reflections.length?"この仕訳から他に自動検出できる科目はありませんでした。":"この仕訳の借方からPLに反映できる科目を自動検出できませんでした。"}</div>
      <div class="mail-actions" style="margin-top:8px">
        <button id="plfee-manual-start">✏️ 手動で科目を指定して反映する</button>
        <button id="plfee-exclude">🚫 この請求書はPLに反映しない（対象外にする）</button>
      </div>
      <div class="err" id="plfee-msg" style="margin-top:6px"></div>
    </div>`;
    $("plfee-manual-start").onclick=()=>plfeeSelectGroup(0,true);
    $("plfee-exclude").onclick=plfeeExclude;
    return;
  }

  if(PLFEE_STATE.rows==null){ plfeeSelectGroup(0,false); return; } // 初回は先頭の候補を自動選択

  if(PLFEE_STATE.source==="all_seisan"){
    // この科目は検出できた店舗が全て精算対象店舗だった＝ここでは反映できない
    box.innerHTML=`<div class="adcost-box">
      <h3>📊 PLへ反映しますか？</h3>
      ${reflectedHtml}
      ${plfeeSkippedSeisanHtml()}
      <div class="adcost-sub">この科目（${esc(PLFEE_STATE.currentAccount)}${PLFEE_STATE.currentSubAccount?"/"+esc(PLFEE_STATE.currentSubAccount):""}）は精算対象店舗のみだったため、この画面では反映できません。精算書側で入力してください。</div>
      <div class="mail-actions" style="margin-top:8px">
        ${groups.length>1?plfeeGroupPickerHtml():""}
        <button id="plfee-exclude">🚫 この請求書はこれ以上PLに反映しない（対象外にする）</button>
      </div>
      <div class="err" id="plfee-msg" style="margin-top:6px"></div>
    </div>`;
    const picker0=$("plfee-group-pick");
    if(picker0) picker0.onchange=()=>{ picker0.value==="manual"?plfeeSelectGroup(0,true):plfeeSelectGroup(+picker0.value,false); };
    $("plfee-exclude").onclick=plfeeExclude;
    return;
  }

  const total=PLFEE_STATE.rows.reduce((s,r)=>s+(Number(r.amount)||0),0);
  const baseAmt=Number(PLFEE_STATE.total)||0;
  const diff=baseAmt-total;
  const accLabel=PLFEE_STATE.manualGroup?"（手動指定）":esc(PLFEE_STATE.currentAccount)+(PLFEE_STATE.currentSubAccount?"/"+esc(PLFEE_STATE.currentSubAccount):"");
  box.innerHTML=`<div class="adcost-box">
    <h3>📊 PLへ反映しますか？ <span class="hq-pill amber">対象科目：${accLabel}</span></h3>
    ${reflectedHtml}
    <div class="adcost-sub">今回登録した仕訳の内容から、店舗ごとのPLへ反映します。内容をご確認のうえ「この内容でPLに反映」を押してください。</div>
    ${groups.length>1||PLFEE_STATE.manualGroup?plfeeGroupPickerHtml():""}
    ${plfeeManualAccountHtml()}
    <div class="ai-grid">
      <div class="ai-field"><small>対象年月</small><input id="plfee-ym" type="month" value="${PLFEE_STATE.yearMonth.slice(0,7)}"></div>
    </div>
    <div class="adcost-source">${plfeeSourceLabel()}</div>
    ${plfeeSkippedSeisanHtml()}
    <table class="adcost-table">
      <thead><tr><th>店舗</th><th style="text-align:right">金額</th><th></th></tr></thead>
      <tbody id="plfee-rows">${PLFEE_STATE.rows.map((r,i)=>plfeeRowHtml(r,i)).join("")}</tbody>
    </table>
    <div class="mail-actions" style="margin-top:6px">
      <button id="plfee-add-row">＋ 店舗を追加</button>
      ${PLFEE_STATE.manualGroup?"":`<button id="plfee-recalc">🔄 割り振りを再計算</button>`}
    </div>
    <div class="adcost-total">
      <span>対象科目の合計 <b>${yen(baseAmt)}</b></span>
      <span>割り振り合計 <b id="plfee-total-sum">${yen(total)}</b></span>
      <span id="plfee-diff-box" class="${diff===0?"adcost-diff-ok":"adcost-diff-ng"}">差額 <b>${yen(diff)}</b> ${diff===0?"✓":""}</span>
    </div>
    <div class="mail-actions" style="margin-top:10px">
      <button class="primary" id="plfee-confirm">📊 この内容でPLに反映</button>
      <button id="plfee-exclude">🚫 これ以上は反映しない（対象外にする）</button>
    </div>
    <div class="adcost-hint">💡 ここに反映できるのはPL科目（設定タブ「PL連携対象科目」に登録済みの科目）のみです。精算対象店舗は選べません（精算書に入力すると自動でPLにも反映されるため、二重計上防止でここでは除外しています）。反映後も「反映履歴」から取り消して内容を直せます（シート側は正しい内容で再度反映するまで古いまま残ります）。</div>
    <div class="err" id="plfee-msg" style="margin-top:6px"></div>
  </div>`;
  $("plfee-ym").onchange=()=>{ PLFEE_STATE.yearMonth=$("plfee-ym").value+"-01"; };
  const picker=$("plfee-group-pick");
  if(picker) picker.onchange=()=>{ picker.value==="manual"?plfeeSelectGroup(0,true):plfeeSelectGroup(+picker.value,false); };
  if($("plfee-acc-name")) $("plfee-acc-name").oninput=()=>{ PLFEE_STATE.currentAccount=$("plfee-acc-name").value; };
  if($("plfee-sub-name")) $("plfee-sub-name").oninput=()=>{ PLFEE_STATE.currentSubAccount=$("plfee-sub-name").value; };
  document.querySelectorAll(".plfee-store").forEach(el=>el.onchange=()=>{
    const idx=+el.dataset.idx, s=PLFEE_STATE.stores.find(x=>x.id===el.value);
    PLFEE_STATE.rows[idx].store_id=el.value; PLFEE_STATE.rows[idx].store_name=s?s.name:"";
  });
  document.querySelectorAll(".plfee-amount").forEach(el=>el.oninput=()=>{
    PLFEE_STATE.rows[+el.dataset.idx].amount=el.value; plfeeUpdateTotals();
  });
  document.querySelectorAll("[data-plfeerm]").forEach(el=>el.onclick=()=>{ PLFEE_STATE.rows.splice(+el.dataset.plfeerm,1); plfeeRenderPanel(); });
  $("plfee-add-row").onclick=()=>{ PLFEE_STATE.rows.push({store_id:"",store_name:"",amount:0}); plfeeRenderPanel(); };
  if($("plfee-recalc")) $("plfee-recalc").onclick=async()=>{ PLFEE_STATE.rows=null; await plfeeComputeAllocation(PLFEE_STATE.groups[PLFEE_STATE.selectedGroupIdx]); plfeeRenderPanel(); };
  $("plfee-confirm").onclick=plfeeConfirm;
  $("plfee-exclude").onclick=plfeeExclude;
}
async function plfeeExclude(){
  if(!confirm("この請求書はPLに反映しない、という記録を残します。よろしいですか？（あとで取り消せます）")) return;
  const r=await plFeeCall("exclude",{invoice_id:PLFEE_STATE.ctx.invoiceId});
  if(!r.ok){ alert(r.body.error||"処理に失敗しました"); return; }
  await plfeeInit(PLFEE_STATE.ctx);
}
async function plfeeUnexclude(){
  const r=await plFeeCall("unexclude",{invoice_id:PLFEE_STATE.ctx.invoiceId});
  if(!r.ok){ alert(r.body.error||"処理に失敗しました"); return; }
  await plfeeInit(PLFEE_STATE.ctx);
}
async function plfeeConfirm(){
  const ctx=PLFEE_STATE.ctx;
  const msg=$("plfee-msg"); msg.className="err"; msg.textContent="";
  const accountName=(PLFEE_STATE.currentAccount||"").trim();
  const subAccountName=(PLFEE_STATE.currentSubAccount||"").trim();
  if(!accountName){ msg.textContent="勘定科目を入力してください"; return; }
  const rows=PLFEE_STATE.rows.filter(r=>r.store_id&&Number(r.amount)>0);
  if(!rows.length){ msg.textContent="店舗と金額を入力してください"; return; }
  const total=rows.reduce((s,r)=>s+Number(r.amount),0);
  const baseAmt=Number(PLFEE_STATE.total)||0;
  if(baseAmt>0 && total!==baseAmt && !confirm(`割り振り合計（${yen(total)}）が対象科目の合計（${yen(baseAmt)}）と一致していません。このまま反映しますか？`)) return;
  $("plfee-confirm").disabled=true; msg.textContent="反映中…";
  const r=await plFeeCall("confirm",{
    invoice_id:ctx.invoiceId, account_name:accountName, sub_account_name:subAccountName||undefined, year_month:PLFEE_STATE.yearMonth,
    allocations:rows.map(r=>({store_id:r.store_id,store_name:r.store_name,amount:Number(r.amount)})),
  });
  if(!r.ok){ msg.textContent=r.body.error||"反映に失敗しました"; $("plfee-confirm").disabled=false; return; }
  msg.className="err msg-ok";
  msg.textContent=r.body.sheet_synced?"PLに反映しました（BigQueryにも書き込み済みです）":"反映内容を記録しました。PLへの書き込みでエラーが出ています："+(r.body.sheet_error||"");
  setTimeout(async()=>{
    await plfeeInit(ctx);
    if(!(PLFEE_STATE.groups||[]).length && ctx.onDone) ctx.onDone(); // もう反映できる科目が無ければ呼び出し元の後処理へ
  },1200);
}

// 本文中のリンクをクリックできるようにする（スクリプトは実行させない=XSS対策は維持）。
// iframeはsandbox="allow-popups allow-popups-to-escape-sandbox"のみ許可＝
// リンクを新しいタブで開くことだけを許し、iframe内でのスクリプト実行・トップ画面遷移は禁止のまま。
function prepareBodyHtml(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  doc.querySelectorAll("script,style,iframe,object,embed").forEach(el=>el.remove());
  doc.querySelectorAll("a[href]").forEach(a=>{ a.setAttribute("target","_blank"); a.setAttribute("rel","noopener noreferrer"); });
  return doc.body ? doc.body.innerHTML : html;
}
function linkifyText(text){
  const e=esc(text);
  return e.replace(/(https?:\/\/[^\s<>"'）】]+)/g, url => `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`);
}

function pushNav(extra){ history.pushState(Object.assign({tab:TAB},extra||{}),""); }

  if(st.tab && st.tab!==TAB){

async function loadInboxMaster(){
  // 2026-08-24: limitが500件のままだと総件数がそれを超えたときに古いメールが
  // 一覧・絞り込みから欠落する（KPIバッジとの件数不一致の指摘で発覚）。
  // 実運用の総件数(1000件強)を見込んで余裕を持たせた
  const r=await authed(`/rest/v1/invoice_emails?select=id,from_address,subject,body_text,received_at,mail_status,mail_kind,duplicate_suspected,is_important,processing_user_id,completed_at,updated_at,processor:users!invoice_emails_processing_user_id_fkey(name),atts:invoice_attachments(id)&order=received_at.desc&limit=5000`);
  MASTER_MAILS=(r.ok&&Array.isArray(r.body))?r.body:[];
}
// KPIカード（未処理・処理中・今月完了）は、MASTER_MAILSがlimitで切り詰められる可能性を
// 考慮せず常に正確な値を出すため、一覧とは別にDBへ直接件数を問い合わせて求める
// （ポータル側の未処理件数バッジと同じ方式に統一＝表示がズレていた問題への対応）
let KPI_COUNTS={unprocessed:0,processing:0,completedThisMonth:0};
async function loadKpiCounts(){
  const now=new Date();
  const startOfMonth=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  const [unprocR,procR,doneR]=await Promise.all([
    authed(`/rest/v1/invoice_emails?mail_status=in.(unread,read)&select=id`),
    authed(`/rest/v1/invoice_emails?mail_status=eq.processing&select=id`),
    authed(`/rest/v1/invoice_emails?mail_status=eq.completed&completed_at=gte.${startOfMonth}&select=id`),
  ]);
  KPI_COUNTS={
    unprocessed:(unprocR.ok&&Array.isArray(unprocR.body))?unprocR.body.length:0,
    processing:(procR.ok&&Array.isArray(procR.body))?procR.body.length:0,
    completedThisMonth:(doneR.ok&&Array.isArray(doneR.body))?doneR.body.length:0,
  };
}
function kpiCounts(){ return KPI_COUNTS; }
function filteredMails(){
  let list=MASTER_MAILS;
  if(CHIP==="unprocessed") list=list.filter(m=>m.mail_status==="unread"||m.mail_status==="read");
  else if(CHIP==="processing") list=list.filter(m=>m.mail_status==="processing");
  else if(CHIP==="completed") list=list.filter(m=>m.mail_status==="completed");
  if(KIND_FILTER==="unclassified") list=list.filter(m=>!m.mail_kind);
  else if(KIND_FILTER!=="all") list=list.filter(m=>m.mail_kind===KIND_FILTER);
  if(SEARCH_Q.trim()){
    // 2026-08-24 Phase1.5: 件名・送信元に加え本文も検索対象にする（フリーワード検索強化）
    const q=SEARCH_Q.trim().toLowerCase();
    list=list.filter(m=>(m.from_address||"").toLowerCase().includes(q)
      ||(m.subject||"").toLowerCase().includes(q)
      ||(m.body_text||"").toLowerCase().includes(q));
  }
  if(DATE_FROM) list=list.filter(m=>m.received_at && m.received_at.slice(0,10)>=DATE_FROM);
  if(DATE_TO) list=list.filter(m=>m.received_at && m.received_at.slice(0,10)<=DATE_TO);
  return list;
}

function payrollSummaryHtml(){
  const rows=(PAYROLL_STATE&&PAYROLL_STATE.rows)||[];

  // この月は対象外にした人（2026-09-02）はKPIの人数・件数にも数えない
  const payable=rows.filter(r=>Number(r.net_pay)>0&&!hidden.has(r.user_id));
  const cashRows=payable.filter(r=>{ const b=payrollBankFor(r.user_id); return b&&b.payment_method==="cash"; });
  const transferCount=payable.filter(r=>{ const b=payrollBankFor(r.user_id); return b&&b.payment_method!=="cash"; }).length;
  const cashTotal=cashRows.reduce((s,r)=>s+(Number(r.net_pay)||0),0);

  const doneCount=payable.filter(r=>{ const rec=payrollRecordFor(r.user_id); return rec&&rec.paid_at; }).length;

  `;
}

async function openComposeModal(u){
  const r=await authed("/rest/v1/rpc/invoice_recipient_suggestions",{method:"POST",body:"{}"});
  const suggestions=(r.ok&&Array.isArray(r.body))?r.body.map(x=>x.to_address):[];

  const modal=document.createElement("div");
  modal.className="modal-bg mail-shell"; modal.id="composeModal";
  modal.innerHTML=`<div class="modal">
    <div class="mhead"><h2>✏️ 新規メール作成</h2><button class="linkbtn" id="composeClose" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px">閉じる ×</button></div>
    <label>宛先</label>
    <input id="cp-to" list="cp-suggestions" placeholder="例: info@example.com">
    <datalist id="cp-suggestions">${suggestions.map(a=>`<option value="${esc(a)}">`).join("")}</datalist>
    <label>件名</label>
    <input id="cp-subject" placeholder="件名">
    <label>本文</label>
    <textarea id="cp-body"></textarea>
    <button class="hq-btn primary" style="margin-top:10px;width:100%" id="cp-confirm-btn">確認画面へ</button>
    <div id="cp-confirmbox" style="display:none">
      <div class="confirmbox">宛先: <span id="cp-preview-to"></span>
件名: <span id="cp-preview-subject"></span>
本文:
<span id="cp-preview-body"></span></div>
      <button class="hq-btn primary" style="margin-top:8px;width:100%" id="cp-send-btn">送信する</button>
      <button class="hq-btn" style="margin-top:8px;width:100%" id="cp-back-btn">戻る</button>
    </div>
    <div class="err" id="cp-msg" style="margin-top:8px"></div>
  </div>`;
  document.body.appendChild(modal);
  pushNav({modal:true});
  modal.onclick=e=>{ if(e.target===modal) history.back(); };
  $("composeClose").onclick=()=>history.back();

  $("cp-confirm-btn").onclick=()=>{
    const to=$("cp-to").value.trim(), subject=$("cp-subject").value.trim(), body=$("cp-body").value.trim();
    const msg=$("cp-msg"); msg.textContent="";
    if(!to){ msg.textContent="宛先を入力してください"; return; }
    if(!body){ msg.textContent="本文を入力してください"; return; }
    $("cp-preview-to").textContent=to;
    $("cp-preview-subject").textContent=subject||"（件名なし）";
    $("cp-preview-body").textContent=body;
    $("cp-confirmbox").style.display="block";
  };
  $("cp-back-btn").onclick=()=>{ $("cp-confirmbox").style.display="none"; };
  $("cp-send-btn").onclick=async()=>{
    $("cp-send-btn").disabled=true; $("cp-msg").className="err"; $("cp-msg").textContent="送信中…";
    const to=$("cp-to").value.trim(), subject=$("cp-subject").value.trim(), body=$("cp-body").value.trim();
    const qr=await authed("/rest/v1/rpc/invoice_queue_compose",{method:"POST",body:JSON.stringify({p_to_address:to,p_subject:subject,p_body:body})});
    if(!qr.ok){ $("cp-msg").textContent=(qr.body&&qr.body.message)||"送信予約に失敗しました"; $("cp-send-btn").disabled=false; return; }
    const outboxId=qr.body;
    const s=sess.get();
    const sr=await fetch(SUPA_URL+"/functions/v1/invoice-send",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({outbox_id:outboxId})});
    const sj=await sr.json().catch(()=>({}));
    $("cp-msg").className="err msg-ok";
    $("cp-msg").textContent=(sr.ok&&sj.success)?"送信しました":"送信予約は完了しました。数分以内に自動で再送されます。";
    setTimeout(()=>history.back(),1200);
  };
}

async function runBulkAction(u,action,confirmMsg){
  if(!BULK_SELECTED.size) return;
  if(!confirm(confirmMsg)) return;
  const msg=$("bulk-msg"); msg.className="err"; msg.textContent="処理中…";
  const r=await authed("/rest/v1/rpc/invoice_bulk_action",{method:"POST",body:JSON.stringify({p_email_ids:[...BULK_SELECTED],p_action:action})});
  if(!r.ok){ msg.textContent=(r.body&&r.body.message)||"失敗しました"; return; }
  const skipped=(r.body&&r.body.skipped)||[];
  msg.className="err msg-ok";
  msg.textContent=`${r.body.success_count}件完了`+(skipped.length?`／${skipped.length}件スキップ（他の人が処理中等）`:"");
  BULK_SELECTED.clear();
  await loadInboxMaster(); await loadWaitingPaymentCount(); await loadKpiCounts();
  updateMailSummaryBar();
  renderMailListOnly();
}
function mailItemHtml(m){
  const cls=["mail-item"];
  if(m.mail_status==="unread") cls.push("unread");
  if(m.mail_status==="processing") cls.push("locked");
  if(m.mail_status==="completed") cls.push("completed");
  if(m.mail_status==="archived") cls.push("notapplicable");
  if(m.duplicate_suspected) cls.push("dup");
  if(m.id===SELECTED_ID) cls.push("active");
  const preview=(m.body_text||"").replace(/\s+/g," ").trim().slice(0,60);
  const metaLeft=m.mail_status==="processing"&&m.processor?`担当：${esc(m.processor.name)}`:((m.atts&&m.atts.length)?`添付 ${m.atts.length}件`:"添付なし");
  return `<div class="${cls.join(' ')}" data-openmail="${m.id}">
    <label class="mail-checkwrap"><input type="checkbox" data-bulkcheck="${m.id}" ${BULK_SELECTED.has(m.id)?"checked":""}></label>
    <div class="mail-from">${esc(m.from_address||"—")}</div>
    <div class="mail-subject">${m.mail_kind?MAIL_KIND_LABEL[m.mail_kind]+" ":"❔ "}${m.is_important?"⭐ ":""}${esc(m.subject||"（件名なし）")}</div>
    <div class="mail-preview">${esc(preview)}</div>
    <div class="mail-meta"><span>${metaLeft}</span><span>${fmtDT(m.received_at)}</span></div>
  </div>`;
}

async function openMailDetail(u,emailId,skipHighlight){
  SELECTED_ID=emailId;
  if(!skipHighlight){
    document.querySelectorAll(".mail-item").forEach(el=>el.classList.toggle("active",el.dataset.openmail===emailId));
  }
  $("mailDetail").innerHTML='<div class="spin">読み込み中…</div>';

  const [mr,ar,rr,lr,ivr,cr]=await Promise.all([
    authed(`/rest/v1/invoice_emails?id=eq.${emailId}&select=*,processor:users!invoice_emails_processing_user_id_fkey(name),completer:users!invoice_emails_completed_by_fkey(name)`),
    authed(`/rest/v1/invoice_attachments?email_id=eq.${emailId}&select=*&order=created_at`),
    authed(`/rest/v1/invoice_email_reads?email_id=eq.${emailId}&select=opened_at,reader:users(name)&order=opened_at.asc&limit=1`),
    authed(`/rest/v1/invoice_audit_logs?entity_id=eq.${emailId}&select=*,actor:users(name)&order=created_at.asc&limit=50`),
    authed(`/rest/v1/invoices?email_id=eq.${emailId}&select=*,vendor:vendors(name,vendor_bank_accounts(id,bank_name,branch_name,account_type,account_number,account_holder_kana,is_current)),linked_step:hq_task_steps!linked_hq_step_id(id,title,task:hq_tasks(title,corp)),linked_step_payment:hq_task_steps!linked_hq_step_id_payment(id,title,task:hq_tasks(title,corp)),invoice_stores(store_id)&order=created_at`),
    authed(`/rest/v1/invoice_comments?email_id=eq.${emailId}&select=*,author:users(name)&order=created_at.asc`),
  ]);
  if(!mr.ok||!mr.body||!mr.body[0]){ $("mailDetail").innerHTML='<div class="empty">読み込みに失敗しました</div>'; return; }
  const mail=mr.body[0];
  const atts=(ar.ok&&Array.isArray(ar.body))?ar.body:[];
  const firstRead=(rr.ok&&Array.isArray(rr.body)&&rr.body[0])?rr.body[0]:null;
  const logs=(lr.ok&&Array.isArray(lr.body))?lr.body:[];
  // C-8（ラウンド5指示書§6.1・2026-09-01）: 1メールに複数の請求書が来る場合があるため全件保持する。
  // invoiceは従来どおり「1件目（最初に処理した請求書）」を指す＝既存コードとの後方互換用エイリアス。
  // 2件目以降はSELECTED.invoicesで扱い、renderMailDetail内の「➕他の請求書」セクションで表示する
  const invoices=(ivr.ok&&Array.isArray(ivr.body))?ivr.body:[];
  const invoice=invoices[0]||null;
  const comments=(cr.ok&&Array.isArray(cr.body))?cr.body:[];
  SELECTED={mail,atts,firstRead,logs,invoice,invoices,comments};

  // 開封記録（unread→readの遷移のみ。何度呼んでも安全）
  authed("/rest/v1/rpc/invoice_record_read",{method:"POST",body:JSON.stringify({p_email_id:emailId})}).then(()=>{
    const m=MASTER_MAILS.find(x=>x.id===emailId);
    if(m&&m.mail_status==="unread"){ m.mail_status="read"; }
  });

  // ユーザー要望「今のままだとどこの法人の処理かがわからない」（2026-09-03）に対応するため、
  // 請求書情報パネルで対象法人・対象店舗を直接選べるようにする。法人・店舗一覧は
  // ほぼ変わらないため、初回だけ取得してキャッシュする（renderMailDetailは同期関数のため、
  // renderMailDetailを呼ぶ前にここで取得を終わらせておく必要がある）。
  // 取引先マスタ一覧（VENDOR_CACHE）も同じ理由で事前取得しておく（2026-09-05・取引先紐付け機能）
  await Promise.all([ensureCorpStoreCache(),ensureVendorCache()]);

  renderMailDetail(u);

  // スマホ幅では一覧を隠して詳細だけ全画面表示にする（下スクロールしないと詳細が
  // 見えない問題への対応）。PC幅では常に左右並びのまま何もしない。
  // skipHighlight=trueのとき（モーダル経由・再描画時の復元）は既にpushNav済みか
  // 単なる再描画なので、ここでは新規クリック（skipHighlight=false）のときだけ積む
  if(isMobileWidth()){
    if(!skipHighlight) pushNav({modal:false});
    MOBILE_VIEW="detail";
    const layout=$("mailLayout"); if(layout) layout.classList.add("mobile-detail");
    window.scrollTo({top:0,behavior:"instant"});
  }
}

// そのまま使うため、会計・仕訳／PL・広告・精算書／振込／本部タスク連携のロジックは完全に共通
async function openInvoiceDetail(u,invoiceId){
  DETAIL_MODE="process";
  await Promise.all([ensureCorpStoreCache(),ensureVendorCache()]);
  const ivr=await authed(`/rest/v1/invoices?id=eq.${invoiceId}&select=*,vendor:vendors(name,vendor_bank_accounts(id,bank_name,branch_name,account_type,account_number,account_holder_kana,is_current)),linked_step:hq_task_steps!linked_hq_step_id(id,title,task:hq_tasks(title,corp)),linked_step_payment:hq_task_steps!linked_hq_step_id_payment(id,title,task:hq_tasks(title,corp)),invoice_stores(store_id)`);
  const inv=(ivr.ok&&Array.isArray(ivr.body)&&ivr.body[0])||null;

// 対になる関数。実在のメールが無い代わりに、必要最小限を埋めた疑似mailオブジェクトを使う
// ことで、renderMailDetail/wireDetailActionsの分岐（mail.xxx参照）をそのまま動かす
async function loadStandaloneIntoSelected(u,inv){
  const [attR,cmR,logR]=await Promise.all([
    authed(`/rest/v1/invoice_attachments?invoice_id=eq.${inv.id}&select=*&order=created_at`),
    authed(`/rest/v1/invoice_comments?invoice_id=eq.${inv.id}&select=*,author:users(name)&order=created_at.asc`),
    authed(`/rest/v1/invoice_audit_logs?entity_id=eq.${inv.id}&select=*,actor:users(name)&order=created_at.asc&limit=50`),
  ]);
  const atts=(attR.ok&&Array.isArray(attR.body))?attR.body:[];
  const comments=(cmR.ok&&Array.isArray(cmR.body))?cmR.body:[];
  const logs=(logR.ok&&Array.isArray(logR.body))?logR.body:[];
  const syntheticMail={
    id:null, subject:(inv.vendor_name?inv.vendor_name+"の請求書":"アップロード請求書"),
    from_address:"（アップロード）", to_address:"", mail_kind:"invoice",
    mail_status:"standalone", processing_user_id:null, processor:null, is_important:false,
    duplicate_suspected:!!inv.duplicate_suspected, received_at:inv.created_at,
    body_text:"アップロードされた請求書です（メール本文はありません）。内容は右の「請求情報」や証憑プレビューで確認してください。",
    body_html:null,
  };
  SELECTED={mail:syntheticMail,atts,firstRead:null,logs,invoice:inv,invoices:[inv],comments};
}

// 追加する（指示書§5-8。ZIPの中の実際の請求書PDFを証憑として正しく紐付けるための入口処理）
function attCardHtml(a){
  const isPdf=a.mime_type==="application/pdf";
  const isImg=(a.mime_type||"").indexOf("image/")===0;
  const isZip=(a.mime_type||"").includes("zip")||/\.zip$/i.test(a.file_name||"");
  const preview=isPdf
    ? `<iframe data-attpreview="${esc(a.storage_path)}" title="${esc(a.file_name)}"></iframe>`
    : isImg
      ? `<img data-attpreview="${esc(a.storage_path)}" alt="${esc(a.file_name)}">`
      : `<div class="noprev"><span class="ico">${isZip?"📦":"📄"}</span>プレビュー非対応<br>（開いて確認してください）</div>`;
  return `<div class="attcard">
    <div class="attcard-preview">${preview}</div>
    <div class="attcard-foot">
      <span class="fname">${esc(a.file_name)}</span>
      <a data-attpath="${esc(a.storage_path)}" download="${esc(a.file_name)}" href="#" target="_blank" rel="noopener">開く</a>
    </div>
    ${isZip?(a.zip_extracted_at
      ?`<div class="meta" style="color:var(--muted);font-size:11px;padding:0 10px 8px">📦 展開済み（中のファイルはこのリストに個別に追加されています）</div>`

function invoiceWorkflowSteps(invoice,mail){
  const steps=[

    {key:"accounting",label:"会計・仕訳",done:!!(invoice&&invoice.mf_journal_id)},

    {key:"verified",label:"支払確認",done:!!(invoice&&invoice.payment_verified_at)},

  const dupBlock=!invoice.bank_account_change_detected&&!noAccountBlock&&invoice.payment_status==="not_ready"&&invoice.duplicate_suspected;
  if(invoice.bank_account_change_detected){
    stateLine=`<span class="pl-state excluded">！口座変更未承認</span>`;
    actionHtml=`<div class="risk-card danger"><h5>⚠️ 口座変更未承認</h5><p>振込先口座の変更が未承認のため、振込一覧に追加できません。下の「取引先・振込先口座」、または設定タブ「支払先・銀行口座」で承認してください。</p></div>`;

    stateLine=`<span class="pl-state excluded">！振込先口座未登録</span>`;

    stateLine=`<span class="pl-state excluded">！重複請求の疑い</span>`;
    actionHtml=`<div class="risk-card danger"><h5>🚨 重複請求の疑いが解消されていません</h5><p>①請求情報カードの「重複でないと確認する」で解除してから振込一覧に追加してください。</p></div>`;
  }else if(invoice.payment_status==="not_ready"){
    stateLine=`<span class="pl-state wait">●振込待ち</span>`;
    actionHtml=`<div class="mail-actions"><button id="payment-add-transfer">🏦 振込一覧へ追加</button></div>`;

    actionHtml=`<div class="meta" style="color:var(--muted);font-size:12px;margin-bottom:8px">実際の着金・支払完了を確認できたら、下のボタンを押してください。</div>
      <div class="mail-actions"><button id="payment-verify">✅ 支払を確認済みにする</button></div>`;
  }else if(invoice.payment_verified_at){
    stateLine=`<span class="pl-state done">✓支払確認済み</span>`;
    actionHtml=`<div class="meta" style="color:var(--muted);font-size:12px">${fmtDT(invoice.payment_verified_at)}に確認済みにしました。</div>`;
  }else{
    stateLine=`<span class="pl-state wait">●振込準備完了／振込一覧に登録済み</span>`;
    actionHtml=`<div class="mail-actions"><button id="dash-go-transfers-from-invoice">🏦 振込一覧を開く →</button></div>`;
  }
  const vendorLinkedName=(invoice.vendor&&invoice.vendor.name)||invoice.vendor_name||"";
  const acc=currentVendorAccount(invoice);
  let bankBoxHtml;
  if(!invoice.vendor_id){
    bankBoxHtml=`<div class="ai-field" style="margin-bottom:10px" id="pay-bankbox"><small>取引先・振込先口座</small>
      <div class="risk-card danger"><h5>⚠️ 取引先マスタ未登録</h5><p>この請求書の取引先「${esc(vendorLinkedName||"（未入力）")}」は取引先マスタに登録されていないため、振込先口座を登録できません。</p></div>
      ${ivVendorLinkHtml(invoice)}
    </div>`;
  }else if(acc){
    bankBoxHtml=`<div class="ai-field" style="margin-bottom:10px" id="pay-bankbox"><small>取引先・振込先口座</small>
      <b>${esc(vendorLinkedName)}</b>
      <div class="meta" style="color:var(--muted);font-size:12px;margin-top:2px">${esc(acc.bank_name||"—")} ${esc(acc.branch_name||"")} ${BANK_TYPE_LABEL[acc.account_type]||"普通"} ${esc(acc.account_number||"—")}（${esc(acc.account_holder_kana||"—")}）</div>
      <div class="mail-actions" style="margin-top:6px"><button class="hq-btn" id="pay-bank-edit">✏️ 口座情報を編集する</button></div>
      <div id="pay-bank-editor" style="margin-top:8px"></div>
    </div>`;
  }else{
    bankBoxHtml=`<div class="ai-field" style="margin-bottom:10px" id="pay-bankbox"><small>取引先・振込先口座</small>
      <div class="risk-card danger"><h5>⚠️ 振込先口座 未登録</h5><p>取引先「${esc(vendorLinkedName)}」の振込先口座がまだ登録されていません。</p><button class="hq-btn" id="pay-bank-edit" style="margin-top:6px">＋ 口座を登録する</button></div>
      <div id="pay-bank-editor" style="margin-top:8px"></div>
    </div>`;
  }
  let html=`${bankBoxHtml}<div class="ai-field" style="margin-bottom:10px"><small>現在の状態</small>${stateLine}<div class="meta" style="color:var(--muted);font-size:11px;margin-top:2px">${amtLabel.slice(1)}${dueLabel}</div></div>${actionHtml}`;
  if(invoice.linked_step_payment){
    html+=`<div class="meta" style="color:var(--muted);font-size:11px;margin-top:10px">🔗 振込完了時の本部タスク連携あり（設定は⑤本部タスク連携カードで確認できます）</div>`;
  }
  return html;
}
function taskPanelHtml(invoice,steps){
  const doneCount=steps.filter(s=>s.done).length;
  const step=invoice&&invoice.linked_step;
  return `<h4>📌 本部タスク連携</h4>
    <div class="task-progress-num">${doneCount}/${steps.length}</div>
    ${steps.map((s,i)=>`<div class="task-step ${s.done?"done":s.current?"current":""}"><div class="icon">${s.done?"✓":i+1}</div><div><b>${esc(s.label)}</b></div></div>`).join("")}
    ${step?`<div class="meta" style="color:var(--muted);font-size:11px;margin-top:8px">${esc((step.task&&step.task.corp)||"")} ${esc((step.task&&step.task.title)||"")} ／ ${esc(step.title)}</div><a class="hq-btn" style="display:block;text-align:center;margin-top:8px;text-decoration:none" href="tasks.html" target="_blank">本部タスクを開く</a>`
      :`<div class="meta" style="color:var(--muted);font-size:11px;margin-top:8px">紐付けられた本部タスクはありません（請求情報タブから紐付けできます）</div>`}
  `;
}
function wireDetailTabs(){
  document.querySelectorAll("[data-dtab]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".dtab").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll("[data-dtab]").forEach(x=>x.classList.remove("active"));
    const el=$("dtab-"+b.dataset.dtab); if(el) el.classList.add("active");
    b.classList.add("active");
  });
}

  // 差し替え、メール（またはアップロードの取込情報）そのものは「取得元情報」という
