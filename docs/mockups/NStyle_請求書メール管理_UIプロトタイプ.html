<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N-Style Portal UI Prototype</title>
<style>
  :root{
    --bg:#f4f1eb;
    --panel:#ffffff;
    --ink:#231f1a;
    --muted:#7d756d;
    --line:#e4ddd4;
    --nav:#211d18;
    --nav2:#2e2923;
    --accent:#c94728;
    --accent-soft:#fce9e3;
    --green:#2f8f63;
    --green-soft:#e7f5ed;
    --amber:#b77b13;
    --amber-soft:#fff3d8;
    --blue:#2f6fb7;
    --blue-soft:#e8f0fb;
    --shadow:0 8px 28px rgba(35,31,26,.08);
    --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
  button,input{font:inherit}
  .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  .sidebar{background:var(--nav);color:#fff;padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;gap:12px;align-items:center;padding:4px 4px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:18px}
  .brand-badge{width:42px;height:42px;border-radius:12px;background:#f0c24f;display:grid;place-items:center;font-size:22px}
  .brand strong{display:block;font-size:18px}.brand small{color:#bdb6ad}
  .section-title{font-size:11px;color:#8f887f;text-transform:uppercase;letter-spacing:.12em;margin:22px 10px 8px}
  .nav-item,.nav-group-head{width:100%;border:0;background:transparent;color:#ddd6cf;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .nav-item:hover,.nav-group-head:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:#3a342e;color:#fff;font-weight:700}
  .nav-item .count{margin-left:auto;background:#c94728;color:#fff;border-radius:99px;padding:2px 7px;font-size:11px}
  .nav-group-head{font-weight:700;color:#fff}
  .chev{margin-left:auto;transition:.2s}.nav-group.open .chev{transform:rotate(90deg)}
  .subnav{display:none;padding:2px 0 6px 14px}.nav-group.open .subnav{display:block}
  .subnav .nav-item{font-size:14px;padding:9px 10px}
  .userbox{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:#cfc7bd}
  .main{min-width:0}
  .topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}
  .topbar h1{font-size:22px;margin:0}.topbar .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .top-actions{display:flex;gap:10px;align-items:center}
  .search{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;min-width:320px}
  .iconbtn,.modebtn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;cursor:pointer}
  .content{padding:26px 30px 46px;max-width:1500px;margin:0 auto}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .metric{padding:18px}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:32px;font-weight:800;margin-top:8px}
  .pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}
  .p-green{background:var(--green-soft);color:var(--green)}.p-red{background:var(--accent-soft);color:var(--accent)}.p-amber{background:var(--amber-soft);color:var(--amber)}.p-blue{background:var(--blue-soft);color:var(--blue)}
  .two{display:grid;grid-template-columns:1.5fr .9fr;gap:16px;margin-top:16px}
  .card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .card-body{padding:20px}
  .chart{height:280px;display:flex;align-items:flex-end;gap:18px;padding:20px 10px 10px;border-bottom:1px dashed var(--line)}
  .bar{flex:1;background:linear-gradient(#cf4d2f,#e99b87);border-radius:10px 10px 0 0;min-width:24px;position:relative}
  .bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
  .todo{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.todo:last-child{border:0}
  .todo .dot{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center}
  .todo b{font-size:14px}.todo p{margin:3px 0 0;color:var(--muted);font-size:12px}
  .page-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
  .page-title h2{margin:0;font-size:28px}.page-title p{margin:6px 0 0;color:var(--muted)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .tablewrap{overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:#faf8f5;color:#6a625b;font-size:12px}
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
  .field textarea{min-height:110px;resize:vertical}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px;text-align:left;cursor:pointer}
  .quick button:hover{border-color:#cfc5ba;transform:translateY(-1px)}
  .quick strong{display:block;font-size:16px}.quick small{color:var(--muted)}
  .mobilebar{display:none}
  @media(max-width:1050px){
    .app{grid-template-columns:88px 1fr}.sidebar{padding:18px 10px}.brand .txt,.section-title,.nav-item span.label,.nav-group-head span.label,.userbox{display:none}.brand{justify-content:center}.nav-item,.nav-group-head{justify-content:center}.subnav{padding-left:0}.search{min-width:180px}.grid4{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:760px){
    .app{display:block}.sidebar{display:none}.topbar{padding:0 16px;height:68px}.search{display:none}.content{padding:18px 14px 88px}.grid4,.two,.form-grid,.quick{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:8px}.mobilebar button{border:0;background:transparent;font-size:12px;color:#655d55}
  }


/* ===== HQ TASK MODULE (scoped) ===== */
.hq-shell{--hq-bg:#f4f1eb;--hq-panel:#fff;--hq-ink:#231f1a;--hq-muted:#7d756d;--hq-line:#e4ddd4;--hq-red:#c93f2b;--hq-redsoft:#fde9e4;--hq-green:#2f8f63;--hq-greensoft:#e8f5ee;--hq-amber:#b77b13;--hq-ambersoft:#fff3d8;--hq-blue:#2f6fb7;--hq-bluesoft:#e8f0fb;--hq-shadow:0 8px 24px rgba(35,31,26,.06);color:var(--hq-ink)}
.hq-shell *{box-sizing:border-box}
.hq-shell button,.hq-shell input,.hq-shell select,.hq-shell textarea{font:inherit}
.hq-shell button{cursor:pointer}
.hq-card{background:#fff;border:1px solid var(--hq-line);border-radius:16px;box-shadow:var(--hq-shadow)}
.hq-btn{border:1px solid var(--hq-line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}
.hq-btn.primary{background:#c94728;border-color:#c94728;color:#fff}
.hq-btn.green{background:var(--hq-green);border-color:var(--hq-green);color:#fff}
.hq-btn:disabled{opacity:.45;cursor:not-allowed}
.hq-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.hq-metric{padding:18px;min-width:0}
.hq-metric .l{font-size:13px;color:var(--hq-muted)}
.hq-metric .v{font-size:32px;font-weight:900;margin-top:7px}
.hq-metric .s{font-size:12px;color:var(--hq-muted);margin-top:4px}
.hq-toolbar{margin-top:16px;padding:16px}
.hq-toolbar-top{display:grid;grid-template-columns:minmax(260px,1fr) auto auto;gap:10px;align-items:center}
.hq-search{width:100%;border:1px solid var(--hq-line);border-radius:10px;padding:11px 13px;background:#fff}
.hq-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hq-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hq-chip{border:1px solid var(--hq-line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;color:#655d55}
.hq-chip.active{background:#211d18;color:#fff;border-color:#211d18}
.hq-views{display:flex;border:1px solid var(--hq-line);border-radius:12px;overflow:hidden;white-space:nowrap}
.hq-views button{border:0;background:#fff;padding:10px 12px;cursor:pointer}
.hq-views button.active{background:#211d18;color:#fff}
.hq-area{margin-top:16px}
.hq-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hq-colhead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.hq-count{font-size:12px;color:var(--hq-muted)}
.hq-task{padding:15px;margin-bottom:12px;transition:.15s;cursor:pointer;overflow:hidden}
.hq-task:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(35,31,26,.09)}
.hq-task.overdue{border-color:#e49a8c;box-shadow:0 0 0 1px #e49a8c inset}
.hq-badges{display:flex;gap:6px;flex-wrap:wrap}
.hq-pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.hq-pill.red{background:var(--hq-redsoft);color:var(--hq-red)}
.hq-pill.amber{background:var(--hq-ambersoft);color:var(--hq-amber)}
.hq-pill.green{background:var(--hq-greensoft);color:var(--hq-green)}
.hq-pill.blue{background:var(--hq-bluesoft);color:var(--hq-blue)}
.hq-pill.gray{background:#f2efeb;color:#736b63}
.hq-task h3{margin:10px 0 6px;font-size:16px;overflow-wrap:anywhere}
.hq-task p{margin:4px 0;font-size:13px;color:#655d55;line-height:1.55}
.hq-important{color:var(--hq-red);font-weight:800}
.hq-foot{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--hq-muted)}
.hq-list,.hq-calendar{display:none}
.hq-listhead,.hq-listrow{display:grid;grid-template-columns:minmax(220px,2fr) .8fr .8fr .8fr .9fr .7fr;gap:10px;align-items:center}
.hq-listhead{padding:0 14px 8px;color:var(--hq-muted);font-size:12px}
.hq-listrow{background:#fff;padding:14px;border-top:1px solid var(--hq-line);cursor:pointer}
.hq-calendargrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.hq-day{min-height:128px;background:#fff;border:1px solid var(--hq-line);border-radius:12px;padding:10px;overflow:hidden}
.hq-day.today{box-shadow:0 0 0 2px #c94728 inset}
.hq-date{font-size:12px;color:var(--hq-muted);margin-bottom:8px}
.hq-ctask{font-size:11px;padding:7px 8px;border-radius:8px;margin-bottom:6px;background:#f7f3ee;cursor:pointer;overflow-wrap:anywhere}
.hq-ctask.red{background:var(--hq-redsoft);color:#9f2f20}
.hq-ctask.blue{background:var(--hq-bluesoft);color:#245b94}
.hq-ctask.green{background:var(--hq-greensoft);color:#246d4d}
.hq-hidden{display:none!important}
.hq-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:16px}
.hq-pad{padding:20px}
.hq-title{font-size:26px;font-weight:900;margin:12px 0 8px;overflow-wrap:anywhere}
.hq-desc{color:#655d55;line-height:1.7}
.hq-progress{height:10px;background:#eee8e0;border-radius:999px;overflow:hidden;margin:12px 0 6px}
.hq-progress span{display:block;height:100%;background:#c94728}
.hq-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hq-mini{border:1px solid var(--hq-line);border-radius:12px;padding:13px;min-width:0}
.hq-mini small{display:block;color:var(--hq-muted);margin-bottom:4px}
.hq-mini b{font-size:16px}
.hq-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:16px;margin-top:16px}
.hq-head{padding:16px 18px;border-bottom:1px solid var(--hq-line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.hq-body{padding:18px}
.hq-process{border:1px solid var(--hq-line);border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fff}
.hq-process.current{border-color:#e7a093;box-shadow:0 0 0 1px #e7a093 inset}
.hq-process.completed{border-color:#b9ddca;background:#fbfefc}
.hq-process-head{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px;cursor:pointer}
.hq-num{width:34px;height:34px;border-radius:10px;background:#f4efe9;display:grid;place-items:center;font-weight:900}
.hq-process.current .hq-num{background:var(--hq-redsoft);color:var(--hq-red)}
.hq-process.completed .hq-num{background:var(--hq-greensoft);color:var(--hq-green)}
.hq-process-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--hq-muted)}
.hq-process-body{display:none;padding:0 14px 14px}
.hq-process.open .hq-process-body{display:block}
.hq-ownerline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:12px 0}
.hq-fieldbox{border:1px solid var(--hq-line);border-radius:10px;padding:10px;background:#faf8f5}
.hq-fieldbox small{display:block;color:var(--hq-muted);font-size:11px;margin-bottom:5px}
.hq-fieldbox select,.hq-fieldbox input{width:100%;border:0;background:transparent;outline:none;font-weight:700;min-width:0}
.hq-checklist{margin-top:12px;border-top:1px solid var(--hq-line);padding-top:10px}
.hq-checkitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee8e0}
.hq-checkitem input{width:18px;height:18px}
.hq-resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.hq-resource{border:1px solid var(--hq-line);border-radius:12px;padding:12px;background:#faf8f5;min-width:0}
.hq-resource b{display:block;font-size:13px}
.hq-resource small{color:var(--hq-muted);overflow-wrap:anywhere}
.hq-proc-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.hq-completebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;border:1px solid var(--hq-line);border-radius:14px;background:#fff}
.hq-audit{margin-top:18px}
.hq-activity{font-size:12px;color:var(--hq-muted)}
.hq-activity-row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--hq-line)}
.hq-dot{width:9px;height:9px;border-radius:50%;background:#cfc6bc;margin-top:5px}
.hq-dot.green{background:var(--hq-green)}
.hq-template{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.hq-form-card{padding:18px}
.hq-field{margin-bottom:14px}
.hq-field label{display:block;font-size:12px;color:var(--hq-muted);font-weight:700;margin-bottom:6px}
.hq-field input,.hq-field textarea,.hq-field select{width:100%;border:1px solid var(--hq-line);border-radius:10px;padding:10px;background:#fff;min-width:0}
.hq-field textarea{min-height:82px}
.hq-step-block{border:1px solid var(--hq-line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}
.hq-step-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.hq-checkbuilder .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:8px}
.hq-addrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.hq-addrow button{border:1px solid var(--hq-line);background:#fff;border-radius:9px;padding:9px;font-size:12px}
.hq-preview{position:sticky;top:94px;height:max-content}
.hq-preview .pstep{border-left:3px solid #ddd2c7;padding:8px 0 8px 12px;margin:8px 0}
.hq-preview .pstep.current{border-left-color:#c94728}
.hq-tablewrap{overflow:auto}
.hq-table{width:100%;border-collapse:collapse}
.hq-table th,.hq-table td{padding:12px 14px;border-bottom:1px solid var(--hq-line);text-align:left;font-size:13px;white-space:nowrap}
.hq-table th{background:#faf8f5;color:var(--hq-muted)}
.hq-modal{position:fixed;inset:0;background:#14110e66;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.hq-modal.open{display:flex}
.hq-modalbox{width:min(720px,96vw);background:#fff;border-radius:18px;box-shadow:0 30px 100px #0004;max-height:90vh;overflow:auto}
.hq-modalhead{padding:16px 18px;border-bottom:1px solid var(--hq-line);display:flex;justify-content:space-between}
.hq-modalbody{padding:18px}
#printSheet{display:none}
@media print{
  body *{visibility:hidden!important}
  #printSheet,#printSheet *{visibility:visible!important}
  #printSheet{display:block!important;position:absolute;left:0;top:0;width:100%;background:#fff;color:#000;padding:24px}
  .printTask{margin:0 0 18px;border:1px solid #ccc;padding:14px;border-radius:8px}
  .printCheck{margin:7px 0}
}
@media(max-width:1150px){
  .hq-toolbar-top{grid-template-columns:1fr}
  .hq-actions{justify-content:flex-start}
  .hq-board{grid-template-columns:1fr}
  .hq-hero,.hq-layout,.hq-template{grid-template-columns:1fr}
  .hq-preview{position:static}
}
@media(max-width:760px){
  .hq-metrics,.hq-summary,.hq-ownerline,.hq-step-grid,.hq-resources,.hq-addrow{grid-template-columns:1fr}
  .hq-calendargrid{grid-template-columns:1fr}
  .hq-listhead{display:none}
  .hq-listrow{grid-template-columns:1fr 1fr}
}

/* ===== Mobile polish ===== */
.mobilebar{
  display:none;
}
.mobile-header-actions{
  display:none;
}
@media(max-width:760px){
  body{
    background:#f6f3ee;
    overflow-x:hidden;
  }
  .app{
    display:block!important;
    min-height:100vh;
  }
  .sidebar{
    display:none!important;
  }
  .main{
    width:100%;
    min-width:0;
  }
  .topbar{
    height:auto!important;
    min-height:64px;
    padding:12px 14px!important;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);
  }
  .topbar h1{
    font-size:18px!important;
    line-height:1.25;
  }
  .topbar .meta{
    font-size:11px!important;
    line-height:1.35;
    margin-top:2px!important;
  }
  .top-actions{
    display:none!important;
  }
  .content{
    width:100%!important;
    max-width:none!important;
    padding:14px 12px 92px!important;
    margin:0!important;
  }
  .page-title{
    margin-bottom:12px!important;
    align-items:flex-start!important;
  }
  .page-title h2{
    font-size:22px!important;
  }
  .page-title p{
    font-size:12px!important;
    line-height:1.5;
  }
  .grid4{
    grid-template-columns:1fr 1fr!important;
    gap:10px!important;
  }
  .metric{
    padding:14px!important;
  }
  .metric .value{
    font-size:24px!important;
  }
  .two,
  .form-grid,
  .quick{
    grid-template-columns:1fr!important;
    gap:10px!important;
  }
  .card{
    border-radius:14px!important;
    box-shadow:0 5px 16px rgba(35,31,26,.05)!important;
  }
  .card-head{
    padding:14px!important;
  }
  .card-body{
    padding:14px!important;
  }
  .quick button{
    padding:15px!important;
  }
  .search{
    min-width:0!important;
    width:100%!important;
  }
  .toolbar{
    overflow-x:auto;
    flex-wrap:nowrap!important;
    -webkit-overflow-scrolling:touch;
    padding-bottom:4px;
  }
  table{
    font-size:12px!important;
  }
  th,td{
    padding:11px 10px!important;
  }

  /* HQ overview */
  .hq-metrics{
