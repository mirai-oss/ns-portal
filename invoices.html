          const intakeFormHtml=invoice?"":`<div class="step-card" id="step-info">
              <div class="step-card-head"><h3 class="step-title">請求情報の入力</h3></div>
              <div class="meta" style="color:var(--muted);font-size:11px;margin-bottom:8px">💡 自動で内容が抽出されるわけではありません。「🤖AIで自動入力」を押すか、下の欄に直接入力して保存すると、請求書として取り込まれます。</div>
              <div class="ai-grid">
                <div class="ai-field"><small>${isSales?"入金元":"請求元"}</small><input id="iv-vendor" value="${esc(invoice&&invoice.vendor_name||"")}"></div>
                <div class="ai-field"><small>${isSales?"明細番号":"請求書番号"}</small><input id="iv-number" value="${esc(invoice&&invoice.invoice_number||"")}"></div>
                <div class="ai-field"><small>${isSales?"入金額":"金額"}</small><input id="iv-amount" type="number" value="${invoice&&invoice.amount!=null?invoice.amount:""}"></div>
                <div class="ai-field"><small>${isSales?"入金予定日":"支払期限"}</small><input id="iv-duedate" type="date" value="${invoice&&invoice.due_date||""}"></div>
                <div class="ai-field"><small>状態</small><select id="iv-status">${Object.entries(isSales?SALES_STATUS_LABEL:INVOICE_STATUS_LABEL).map(([k,l])=>`<option value="${k}" ${(invoice?invoice.invoice_status:"draft")===k?"selected":""}>${l}</option>`).join("")}</select></div>
                <div class="ai-field"><small>対象法人</small><select id="iv-corp"><option value="">（未設定）</option>${(CORP_STORE_CACHE&&CORP_STORE_CACHE.corporations||[]).map(c=>`<option value="${esc(c.id)}" ${invoice&&invoice.corporation_id===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
                <div class="ai-field"><small>対象店舗（複数選択可）</small>
                  <div class="store-ms" id="iv-store-ms">
                    <button type="button" class="store-ms-toggle" id="iv-store-toggle">店舗を選択</button>
                    <div class="store-ms-panel" id="iv-store-panel" hidden></div>
                  </div>
                </div>
              </div>
              <div class="mail-actions">
                ${atts.length?`<button id="iv-ai-fill">🤖 AIで${isSales?"入金情報":"請求書情報"}を自動入力</button>`:""}
                <button id="iv-save">💾 ${isSales?"入金情報":"請求書情報"}を保存（請求書として取込む）</button>
              </div>
              <div class="err" id="iv-msg" style="margin-top:6px"></div>
              <div id="iv-ocr-extras"></div>
              ${isSales?"":ivExtraSectionHtml(invoices,mail.id)}
            </div>`;
          const ctaHtml=invoice
            ?`<div class="task-link-box"><b style="font-size:13px">🧾 請求書として取込みました</b>
                <div class="meta" style="color:var(--muted);font-size:12px;margin-top:4px">会計登録・PL反映・広告費反映・精算書連携・振込などの処理は、すべて「🧾請求書」一覧から行います。ここ（受信トレイ）では、内容の確認・添付ファイルの確認・種類の分類のみを行ってください。</div>
                <button class="hq-btn primary" style="margin-top:10px" id="goto-invoice-process">🧾 請求書一覧で確認・処理する →</button>
              </div>`
            :"";
          return intakeFormHtml+ctaHtml+historyCommentsHtml;
        }
        // 2026-09-03新規: ユーザー要望「請求書一覧で選んだら、手順が出てきて1個ずつ処理して
        // チェックをつけていく形にしたい」に対応。工程バー＋タブ（請求情報/AI判定/会計・仕訳/
        // PL・広告・精算書/振込/履歴・監査）＋本部タスク進捗パネルの3点セット。
        // 既存のai-box内の各ボックス（adcostbox/plfeebox/mfjournalbox等）はIDをそのまま維持し、
        // タブの中に配置場所を移しただけ＝wireDetailActions側のロジックは無改修で動く
        const evidenceHtml=`<div class="evidence-panel">
          <div class="ep-head"><span>📄 証憑プレビュー</span><span>${atts.length}ファイル</span></div>
          <div class="ep-body">
            <div class="attgrid" id="attlist">${atts.map(attCardHtml).join("")||'<div class="meta" style="color:var(--muted);font-size:12px">添付はありません</div>'}</div>
            <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--m-line)">
              <label style="font-size:11px;color:var(--muted);display:block;margin-bottom:6px">ダウンロードリンク式の請求書はここから追加できます</label>
              <div id="manual-att-drop" style="border:2px dashed var(--m-line);border-radius:10px;padding:12px;text-align:center;font-size:11px;color:var(--muted)">
                ここにファイルをドラッグ＆ドロップ、または<br>
                <input type="file" id="manual-att-file" style="font-size:11px;margin-top:6px">
              </div>
              <button class="hq-btn" style="margin-top:6px;width:100%" id="manual-att-upload">＋ このメールに紐付けて追加</button>
              <div class="err" id="manual-att-msg" style="margin-top:6px"></div>
            </div>
          </div>
        </div>`;
        // AI判定のリスク（重複・口座変更）だけは、見落とし防止のため独立タブではなく
        // 工程カードの一番上に警告バナーとして常時表示する（参考モックアップ準拠）
        const riskBannerHtml=(invoice&&(invoice.duplicate_suspected||invoice.bank_account_change_detected))?invoiceAiTabHtml(invoice):"";
        const aiConfidenceBadge=invoice&&invoice.ai_match_status?`<span class="step-badge ${invoice.ai_match_status==="auto"?"done":"current"}">🤖 ${({auto:"自動判定済",review:"要確認",error:"エラー"})[invoice.ai_match_status]||invoice.ai_match_status}</span>`:"";
        let stepNo=0;
        // 2026-09-05再修正：続き23で「本部タスクの工程一覧のように進捗が分かるように」との
        // 要望を受けて追加した縦積みステッパー（wf-stepper）だが、実機で見たユーザーから
        // 「（下のアコーディオンと内容が重複していて）いらないのでは？」との指摘を受け削除した。
        // その後改めて「番号が消えて緑チェックになる／止まっているタスクをもっと強調してほしい」
        // との要望（本部タスクのサブタスク一覧の見た目を参考画像で提示）があったため、別枠に
        // 重複表示するのではなく、各カード自身の丸数字とカード外枠に同じ視覚言語
        // （緑チェック=完了／赤枠+番号=いまここ／グレー番号=未処理）を直接適用する形にした
        const infoDone=!!(invoice&&invoice.amount!=null);
        const accountingDone=!!(invoice&&invoice.mf_journal_id);
        const plDoneForCard=!!(invoice&&(invoice.pl_fee_reflected_at||invoice.pl_fee_excluded_at))||invoiceSeisanStores(invoice).length>0;
        const paymentDoneForCard=!!(invoice&&invoice.payment_verified_at);
        let currentCardKey=null;
        for(const[k,d]of[["info",infoDone],["accounting",accountingDone],["pl",plDoneForCard],["payment",paymentDoneForCard]]){ if(!d){ currentCardKey=k; break; } }
        const stepNumHtml=(key,n,done)=>{
          const state=done?"done":(key===currentCardKey?"current":"wait");
          return `<div class="step-num ${state}">${done?"✓":n}</div>`;
        };
        const stepCardClass=key=>key===currentCardKey?" current":"";
        return `<div class="detail-layout">
          ${evidenceHtml}
          <div>
            ${riskBannerHtml}

            <div class="step-card${stepCardClass("info")}" id="step-info">
              <div class="step-card-head" data-cardtoggle="info">${stepNumHtml("info",++stepNo,infoDone)}<h3 class="step-title">${isSales?"入金情報":"請求情報"}</h3>${invoice&&invoice.amount!=null?'<span class="step-badge done">✓ 対応完了</span>':'<span class="step-badge current">いまここ・要対応</span>'}${aiConfidenceBadge}<span class="step-chevron" id="chev-info">${(invoice&&invoice.amount!=null)?"▼":"▲"}</span></div>
              ${(invoice&&invoice.amount!=null)?(()=>{
                // corp:corporations(name)埋め込みが無いクエリ経由でも法人名が出るよう、
                // CORP_STORE_CACHE（常に事前ロード済み）からも引けるようにする
                const corpName=(invoice.corp&&invoice.corp.name)||((CORP_STORE_CACHE&&CORP_STORE_CACHE.corporations||[]).find(c=>c.id===invoice.corporation_id)||{}).name;
                return `<div class="step-summary" id="summary-info">${esc((invoice.vendor&&invoice.vendor.name)||invoice.vendor_name||"（請求元未入力）")}｜${yen(invoice.amount)}${invoice.due_date?"｜支払期限"+esc(fmtD(invoice.due_date)):""}${corpName?"｜"+esc(corpName):""}${Array.isArray(invoice.invoice_stores)&&invoice.invoice_stores.length?"｜"+unifiedStoreLabel(invoice):""} <button class="step-summary-edit" data-cardtoggle="info">詳細を見る▼</button></div>`;
              })():""}
              <div class="step-card-body" id="body-info" ${(invoice&&invoice.amount!=null)?"hidden":""}>
              <div class="ai-grid">
                <div class="ai-field"><small>${isSales?"入金元":"請求元"}</small><input id="iv-vendor" value="${esc(invoice&&invoice.vendor_name||"")}"></div>
                <div class="ai-field"><small>${isSales?"明細番号":"請求書番号"}</small><input id="iv-number" value="${esc(invoice&&invoice.invoice_number||"")}"></div>
                <div class="ai-field"><small>${isSales?"入金額":"金額"}</small><input id="iv-amount" type="number" value="${invoice&&invoice.amount!=null?invoice.amount:""}"></div>
                <div class="ai-field"><small>${isSales?"入金予定日":"支払期限"}</small><input id="iv-duedate" type="date" value="${invoice&&invoice.due_date||""}"></div>
                <div class="ai-field"><small>状態</small><select id="iv-status">${Object.entries(isSales?SALES_STATUS_LABEL:INVOICE_STATUS_LABEL).map(([k,l])=>`<option value="${k}" ${(invoice?invoice.invoice_status:"draft")===k?"selected":""}>${l}</option>`).join("")}</select></div>
                <div class="ai-field"><small>対象法人</small><select id="iv-corp"><option value="">（未設定）</option>${(CORP_STORE_CACHE&&CORP_STORE_CACHE.corporations||[]).map(c=>`<option value="${esc(c.id)}" ${invoice&&invoice.corporation_id===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
                <div class="ai-field"><small>対象店舗（複数選択可）</small>
                  <div class="store-ms" id="iv-store-ms">
                    <button type="button" class="store-ms-toggle" id="iv-store-toggle">店舗を選択</button>
                    <div class="store-ms-panel" id="iv-store-panel" hidden></div>
                  </div>
                </div>
              </div>
              <div class="meta" style="color:var(--muted);font-size:11px;margin-top:4px">💡 対象法人・対象店舗を設定すると、「🧾請求書」一覧で法人ごとに絞り込めるようになります（未設定でも仕訳登録自体は今までどおり行えます）。</div>
              ${isSales?"":`<div class="meta" style="color:var(--muted);font-size:11px;margin-top:8px">🔗 本部タスクとの連携設定は⑤本部タスク連携カードにまとめました${invoice&&invoice.linked_step?"（設定あり）":""}。取引先マスタ・振込先口座との紐付けは④振込カードにまとめました。</div>`}
              <div class="mail-actions">
                ${atts.length?`<button id="iv-ai-fill">🤖 AIで${isSales?"入金情報":"請求書情報"}を自動入力</button>`:""}
                <button id="iv-save">💾 ${isSales?"入金情報":"請求書情報"}を保存</button>
                ${invoice?`<button id="iv-delete" style="margin-left:auto;color:var(--m-red)">🗑 この請求書を削除</button>`:""}
              </div>
              <div class="err" id="iv-msg" style="margin-top:6px"></div>
              <div id="iv-ocr-extras"></div>
              ${isSales?"":ivExtraSectionHtml(invoices,mail.id)}
              </div>
            </div>

            <div class="step-card${stepCardClass("accounting")}" id="step-accounting">
              <div class="step-card-head" data-cardtoggle="accounting">${stepNumHtml("accounting",++stepNo,accountingDone)}<h3 class="step-title">会計・仕訳</h3>${invoice&&invoice.mf_journal_id?'<span class="step-badge done">✓ 対応完了</span>':(invoice&&invoice.amount!=null?'<span class="step-badge current">いまここ・要対応</span>':'<span class="step-badge wait">○未処理</span>')}<span class="step-chevron" id="chev-accounting">${(invoice&&invoice.mf_journal_id)?"▼":"▲"}</span></div>
              ${(invoice&&invoice.mf_journal_id)?`<div class="step-summary" id="summary-accounting">伝票番号: ${esc(String(invoice.mf_journal_number??"-"))} <button class="step-summary-edit" data-cardtoggle="accounting">詳細を見る▼</button></div>`:""}
              <div class="step-card-body" id="body-accounting" ${(invoice&&invoice.mf_journal_id)?"hidden":""}>
              <div class="mail-actions" style="margin-top:0">
                ${(invoice&&invoice.amount!=null)?(invoice.mf_journal_id
                  ?`<button data-journal-view="${esc(invoice.mf_journal_id)}" data-journal-tenant="${esc(invoice.mf_tenant_id||"default")}" title="クリックすると登録した仕訳の内容を確認できます">✅ 仕訳登録済み（伝票番号: ${esc(String(invoice.mf_journal_number??"-"))}）🔍</button>`
                  :`<button id="mfj-open">🧾 仕訳を作成</button>`):`<div class="meta" style="color:var(--muted);font-size:12px">先に上の「請求情報」で金額を保存してください</div>`}
              </div>
              <div class="replybox" id="mfjournalbox">
                <b style="font-size:12px">🧾 マネーフォワードへ仕訳を登録</b>
                <div id="mfj-body" style="margin-top:8px;font-size:12px;color:var(--muted)">読み込み中…</div>
              </div>
              </div>
            </div>

            ${isSales?"":(()=>{
              const seisanStores=invoiceSeisanStores(invoice);
              const plDone=!!(invoice&&(invoice.pl_fee_reflected_at||invoice.pl_fee_excluded_at));
              // 「現在状態は必ず一つだけ」（指示書）：優先順位を決めて1行に確定する
              let plStateHtml;
              if(!invoice||invoice.mf_journal_id==null) plStateHtml=`<span class="pl-state wait">○ 会計登録後に判断</span>`;
              else if(invoice.pl_fee_excluded_at) plStateHtml=`<span class="pl-state excluded">－ PL対象外</span>`;
              else if(invoice.pl_fee_reflected_at) plStateHtml=`<span class="pl-state done">✓ PL反映済み</span>`;
              else if(seisanStores.length) plStateHtml=`<span class="pl-state seisan">🧮 業務委託精算対象</span>`;
              else plStateHtml=`<span class="pl-state wait">○ PL反映待ち</span>`;
              const cardDone=plDone||seisanStores.length>0;
              return `<div class="step-card${stepCardClass("pl")}" id="step-pl">
              <div class="step-card-head" data-cardtoggle="pl">${stepNumHtml("pl",++stepNo,cardDone)}<h3 class="step-title">PL・広告・業務委託精算</h3>${cardDone?'<span class="step-badge done">✓ 対応完了</span>':'<span class="step-badge current">いまここ・要対応</span>'}<span class="step-chevron" id="chev-pl">${cardDone?"▼":"▲"}</span></div>
              ${cardDone?`<div class="step-summary" id="summary-pl">${plStateHtml} <button class="step-summary-edit" data-cardtoggle="pl">詳細を見る▼</button></div>`:""}
              <div class="step-card-body" id="body-pl" ${cardDone?"hidden":""}>
              <div class="ai-field" style="margin-bottom:10px"><small>現在の状態</small>${plStateHtml}</div>
              ${seisanStores.length?`<div class="task-link-box" style="margin-top:0;margin-bottom:12px"><small>🧮 業務委託精算対象店舗：${seisanStores.map(s=>esc(s.name)).join("・")}</small>
                <div style="font-size:12px;color:var(--m-blue);margin-top:4px">この請求書は業務委託精算書経由でPLへ反映するルートです（請求書から直接のPL反映はできません＝二重計上防止のため選択肢から除外されます）。以下の内容を「精算管理」の店舗チェック／業務委託精算書の入力画面へ転記してください：</div>
                <div class="ai-grid" style="margin-top:8px">
                  <div class="ai-field"><small>店舗</small><b>${seisanStores.map(s=>esc(s.name)).join("・")}</b></div>
                  <div class="ai-field"><small>対象月</small><b>${esc((invoice.due_date||invoice.created_at||"").slice(0,7))}</b></div>
                  <div class="ai-field"><small>金額（税込）</small><b>${yen(invoice.amount)}</b></div>
                  <div class="ai-field"><small>取引先</small><b>${esc((invoice.vendor&&invoice.vendor.name)||invoice.vendor_name||"—")}</b></div>
                </div>
                <div class="meta" style="color:var(--muted);font-size:11px;margin-top:8px">⚠️ 正直な注記：現在このアプリ（ns-portal）から精算書（別システム・別リポジトリseisan-dashboard）へ自動で明細を書き込む仕組みはまだありません。上記の内容を精算書側の画面で入力してください。振込済み確定後に精算書側からPLへ自動反映されます（既存の仕組み・変更していません）。</div>
              </div>`:`
              ${(invoice&&invoice.amount!=null)?`<div id="adcostbox"></div>`:`<div class="meta" style="color:var(--muted);font-size:12px">先に上の「請求情報」で金額を保存してください</div>`}
              ${(invoice&&invoice.mf_journal_id)?`<div id="plfeebox"></div>`:`<div class="meta" style="color:var(--muted);font-size:12px;margin-top:8px">PLへの反映は会計・仕訳の登録後に行えます</div>`}
              `}
              </div>
            </div>`;
            })()}

            ${isSales?"":(()=>{
              const payDone=!!(invoice&&invoice.payment_verified_at);
              const payBadge=invoice&&invoice.payment_verified_at?'<span class="step-badge done">✓ 対応完了</span>':(invoice&&invoice.payment_status==="paid"?'<span class="step-badge current">いまここ・要対応</span>':(invoice&&invoice.mf_journal_id?'<span class="step-badge current">いまここ・振込待ち</span>':'<span class="step-badge wait">○未処理</span>'));
              return `<div class="step-card${stepCardClass("payment")}" id="step-payment">
              <div class="step-card-head" data-cardtoggle="payment">${stepNumHtml("payment",++stepNo,payDone)}<h3 class="step-title">振込</h3>${payBadge}<span class="step-chevron" id="chev-payment">${payDone?"▼":"▲"}</span></div>
              ${payDone?`<div class="step-summary" id="summary-payment">${yen(invoice.amount)}｜${fmtDT(invoice.payment_verified_at)}支払確認済み <button class="step-summary-edit" data-cardtoggle="payment">詳細を見る▼</button></div>`:""}
              <div class="step-card-body" id="body-payment" ${payDone?"hidden":""}>
              ${invoicePaymentTabHtml(invoice)}
              </div>
            </div>`;
            })()}

            ${isSales?"":(()=>{
              const hasAnyLink=!!(invoice&&(invoice.linked_step||invoice.linked_step_payment||(invoice.event_task_links&&Object.keys(invoice.event_task_links).length)));
              return `<div class="step-card" id="step-events">
              <div class="step-card-head" data-cardtoggle="events">${stepNumHtml("events",++stepNo,hasAnyLink)}<h3 class="step-title">本部タスク連携</h3>${hasAnyLink?'<span class="step-badge done">✓ 設定あり</span>':'<span class="step-badge wait">連携なし</span>'}<span class="step-chevron" id="chev-events">▲</span></div>
              <div class="step-card-body" id="body-events">
              <div class="meta" style="color:var(--muted);font-size:11px;margin-bottom:10px">この請求書の処理イベントが起きたとき、どの本部タスク工程を自動完了させるかの設定です。ここは「①〜④のこの請求書自体の処理状態」とは別物＝「このinvoiceのイベントで、別の本部タスク工程を自動完了させる設定」です。未設定のイベントは何も完了させません。</div>
              <div class="hq-tablewrap"><table class="event-map-table">
                <thead><tr><th>N-Styleイベント</th><th>連携する本部タスク工程</th><th>実際の完了状況</th></tr></thead>
                <tbody id="event-map-tbody">
                  <tr><td>請求書取込</td><td colspan="2" id="evrow-invoice_created">読み込み中…</td></tr>
                  <tr><td>内容確認</td><td colspan="2" id="evrow-invoice_review_completed">読み込み中…</td></tr>
                  <tr><td>会計登録</td><td id="evrow-mf_journal_created"><div id="hqlink-box"></div></td><td id="evstatus-mf_journal_created">—</td></tr>
                  <tr><td>振込準備</td><td colspan="2" id="evrow-payment_ready">読み込み中…</td></tr>
                  <tr><td>振込完了</td><td id="evrow-payment_completed"><div id="pay-hqlink-box"></div></td><td id="evstatus-payment_completed">—</td></tr>
                  <tr><td>支払確認</td><td colspan="2" id="evrow-payment_verified">読み込み中…</td></tr>
                </tbody>
              </table></div>
              </div>
            </div>`;
            })()}

            <div class="step-card" id="step-audit">
              <div class="step-card-head"><div class="step-num">${++stepNo}</div><h3 class="step-title">履歴・監査</h3></div>
              ${historyCommentsHtml}
            </div>
          </div>

     広告費として反映（C-7②・2026-08-31）
     設計書_広告費自動連携と精算書PL科目連携_2026-08-31.md §4のとおり:
     店舗×金額の割り振りは a)今組んでいる仕訳の部門別金額 → b)前月・同媒体の店舗比率 → c)手入力、の優先順。

  let ADCOST_STATE={};
  async function adcostInit(){
    if(isSales||!invoice||invoice.amount==null) return; // 入金メール・請求書情報未保存のときは対象外

  async function adcostRenderPanel(){
    const box=$("adcostbox");

      ADCOST_STATE.yearMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;

  function adcostFindStoreByName(name){
    if(!name||!ADCOST_STATE.stores) return null;
    const norm=s=>String(s||"").replace(/\s+/g,"");
    const n=norm(name);
    return ADCOST_STATE.stores.find(s=>norm(s.name)===n)
      || ADCOST_STATE.stores.find(s=>n.includes(norm(s.name))||norm(s.name).includes(n))
      || null;
  }
  async function adcostComputeAllocation(){
    const total=Number(invoice.amount)||0;
    // a) 今組んでいる仕訳（🧾仕訳を作成）の明細行に部門（店舗）が設定されていれば、それをそのまま使う
    // （2026-08-31: 借方・貸方が別々の金額を持てるようになったため、部門が付く側＝通常は借方の金額を使う）
    const branchesWithDept=(MFJ_STATE.branches||[]).filter(b=>b.department_id&&(Number(b.debitAmount)>0||Number(b.creditAmount)>0));
    if(branchesWithDept.length){
      const rows=[];
      for(const b of branchesWithDept){
        const dept=(MFJ_STATE.departments||[]).find(d=>d.id===b.department_id);
        const store=dept?adcostFindStoreByName(dept.name):null;
        const amt=Number(b.debitAmount)>0?Number(b.debitAmount):Number(b.creditAmount)||0;
        if(store&&amt>0) rows.push({store_id:store.id,store_name:store.name,amount:Math.round(amt)});
      }
      if(rows.length){ ADCOST_STATE.rows=rows; ADCOST_STATE.source="mf_department"; return; }
    }
    // b) 前月・同媒体で反映済みの請求書があれば、その店舗比率で今回の金額を按分する
    if(ADCOST_STATE.media){
      const cur=new Date(ADCOST_STATE.yearMonth);
      const prev=new Date(cur.getFullYear(),cur.getMonth()-1,1);
      const prevYm=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}-01`;
      const r=await authed(`/rest/v1/invoices?ad_cost_reflected_at=not.is.null&ad_cost_media=eq.${encodeURIComponent(ADCOST_STATE.media)}&ad_cost_year_month=eq.${prevYm}&select=ad_cost_allocations`);
      const prevRows=(r.ok&&Array.isArray(r.body))?r.body:[];
      const sums=new Map(); let grand=0;
      for(const row of prevRows) for(const a of (row.ad_cost_allocations||[])){
        const amt=Number(a.amount)||0; grand+=amt;
        const c=sums.get(a.store_id)||{store_name:a.store_name,amount:0}; c.amount+=amt; sums.set(a.store_id,c);
      }
      if(grand>0){
        const rows=Array.from(sums,([store_id,v])=>({store_id,store_name:v.store_name,amount:Math.round(total*(v.amount/grand))}));
        const sum=rows.reduce((s,x)=>s+x.amount,0);
        if(rows.length) rows[rows.length-1].amount+=(total-sum); // 端数調整
        ADCOST_STATE.rows=rows; ADCOST_STATE.source="prev_month_ratio";
        return;
      }
    }
    // c) 参考になる情報が無ければ、店舗を手で選んでもらう1行だけ用意する
    ADCOST_STATE.rows=[{store_id:"",store_name:"",amount:total}];
    ADCOST_STATE.source="manual";
  }

      prev_month_ratio:"📊 店舗別の内訳が請求書に無かったため、前月の同媒体の店舗比率から按分しています。",
      manual:"📊 参考にできる情報が無かったため、店舗を選んで金額を入力してください。",

      </div>
      <div class="mail-actions" style="margin-top:10px"><button class="primary" id="adcost-confirm">📢 この内容で広告費に反映</button></div>
      <div class="adcost-hint">💡 反映は「🧾仕訳を作成」で仕訳登録するのと同時に行うのが基本ですが、先にこちらだけ確定しても構いません。広告費用対効果_管理シートとBigQueryへの実際の書き込みは担当Aの対応が完了してから有効になります（それまでは反映内容の記録のみです）。</div>
      <div class="err" id="adcost-msg" style="margin-top:6px"></div>
    </div>`;
    $("adcost-media").onchange=()=>{ ADCOST_STATE.media=$("adcost-media").value; };
    $("adcost-ym").onchange=()=>{ ADCOST_STATE.yearMonth=$("adcost-ym").value+"-01"; };
    document.querySelectorAll(".adcost-store").forEach(el=>el.onchange=()=>{
      const idx=+el.dataset.idx, s=ADCOST_STATE.stores.find(x=>x.id===el.value);
      ADCOST_STATE.rows[idx].store_id=el.value; ADCOST_STATE.rows[idx].store_name=s?s.name:"";
    });
    document.querySelectorAll(".adcost-amount").forEach(el=>el.oninput=()=>{
      ADCOST_STATE.rows[+el.dataset.idx].amount=el.value; adcostUpdateTotals();
    });
    document.querySelectorAll("[data-adcostrm]").forEach(el=>el.onclick=()=>{ ADCOST_STATE.rows.splice(+el.dataset.adcostrm,1); adcostRenderForm(); });
    $("adcost-add-row").onclick=()=>{ ADCOST_STATE.rows.push({store_id:"",store_name:"",amount:0}); adcostRenderForm(); };
    $("adcost-recalc").onclick=async()=>{ ADCOST_STATE.rows=null; await adcostComputeAllocation(); adcostRenderForm(); };
    $("adcost-confirm").onclick=adcostConfirm;
  }
  async function adcostConfirm(){
    const msg=$("adcost-msg"); msg.className="err"; msg.textContent="";

  // 勘定科目の検索用インデックスを構築（datalistの表示名→id の逆引き用）
  function mfjBuildAccountIndex(){
    const map=new Map(); // label -> {account_id, sub_account_id, account_name, sub_account_name}
    let dl="";
    for(const a of (MFJ_STATE.accounts||[])){
      map.set(a.name,{account_id:a.id,sub_account_id:null,account_name:a.name,sub_account_name:null});
      dl+=`<option value="${esc(a.name)}">`;
      for(const sa of (a.sub_accounts||[])){
        const label=`${a.name}/${sa.name}`;
        map.set(label,{account_id:a.id,sub_account_id:sa.id,account_name:a.name,sub_account_name:sa.name});
        dl+=`<option value="${esc(label)}">`;
      }
    }
    MFJ_STATE.accountLabelMap=map;
    MFJ_STATE.accountDatalistHtml=dl;
  }
  function mfjLabelOf(side){ // {account_name, sub_account_name} -> 表示名
    if(!side||!side.account_name) return "";
    return side.sub_account_name?`${side.account_name}/${side.sub_account_name}`:side.account_name;
  }

  // 会社名の表記ゆれを吸収して比較するための正規化（法人格・全角/半角スペース等を除去）
  function mfjNormCompanyName(s){
    return String(s||"").replace(/株式会社|有限会社|合同会社|（株）|（有）|\(株\)|\(有\)|御中|様/g,"").replace(/\s+/g,"").toLowerCase();
  }
  function mfjMatchTenant(addressee,tenants){
    const norm=mfjNormCompanyName(addressee);
    if(!norm) return null;
    const hits=tenants.filter(t=>{
      const tn=mfjNormCompanyName(t.label);
      return tn&&(norm.includes(tn)||tn.includes(norm));
    });
    return hits.length===1?hits[0]:null; // 複数/0件は自動選択しない（誤登録防止）
  }

  // 仕訳辞書（事業者ごとに登録した仕訳テンプレート。設定タブでも管理できる）を取得
  async function mfjFetchTemplates(tenantId){
    const r=await authed(`/rest/v1/mf_journal_templates?tenant_id=eq.${encodeURIComponent(tenantId)}&select=id,label,branches&order=label`);

  async function mfjLoadForTenant(tenantId,tenants,autoMatchedFrom){
    const body=$("mfj-body");
    body.innerHTML="読み込み中…（勘定科目・過去の仕訳・仕訳辞書を確認しています）";
    const inv=SELECTED.invoice;
    const vendorName=(inv&&inv.vendor_name)||"";
    // 同時に呼ぶとマネーフォワード側のトークン更新が競合することがあるため直列で呼ぶ
    const accRes=await mfjCall("accounts",{tenant_id:tenantId});
    if(!accRes.ok){ body.innerHTML=`<div class="err">勘定科目の取得に失敗しました: ${esc(accRes.body.error||"")}${accRes.body.detail?"（詳細: "+esc(JSON.stringify(accRes.body.detail))+"）":""}<br><button id="mfj-retry" style="margin-top:8px">🔄 もう一度試す</button></div>`; if($("mfj-retry")) $("mfj-retry").onclick=mfjRenderInitial; return; }
    const sugRes=await mfjCall("suggest",{vendor_name:vendorName,tenant_id:tenantId});
    const listRes=await mfjCall("list_journals",{keyword:vendorName,tenant_id:tenantId});
    // suggestが（vendor_name空欄等で）部門を返せなかった場合は、部門専用の問い合わせで代用する
    const deptRes=(sugRes.ok&&sugRes.body.departments&&sugRes.body.departments.length)?sugRes:await mfjCall("list_departments",{tenant_id:tenantId});
    const templates=await mfjFetchTemplates(tenantId);
    const tenantLabel=(tenants||[]).find(t=>t.id===tenantId)?.label||tenantId;
    MFJ_STATE={
      tenantId, tenantLabel, tenants: tenants||[], autoMatchedFrom: autoMatchedFrom||null,
      mode:"journal", // 既定は①仕訳日記帳から選ぶ。候補が無ければ②仕訳辞書→③直接入力の順で切替
      accounts: accRes.body.accounts||[],
      departments: (deptRes.ok&&deptRes.body.departments)||[],
      taxes: (deptRes.ok&&deptRes.body.taxes)||[],
      journalResults: (listRes.ok&&listRes.body.results)||[],
      journalKeyword: vendorName,
      templates,
      branches: [], // 確定した明細行（複数行=複合仕訳/振替伝票）
      amount: (inv&&inv.amount!=null)?inv.amount:0,
      remark: vendorName,
      date: (inv&&inv.due_date)||new Date().toISOString().slice(0,10),
    };
    mfjBuildAccountIndex();
    // 過去の仕訳の候補が1件も無ければ、仕訳辞書があればそちらを優先→どちらも無ければ直接入力へ
    if(!MFJ_STATE.journalResults.length) MFJ_STATE.mode=MFJ_STATE.templates.length?"dict":"manual";
    if(MFJ_STATE.mode==="manual") mfjAddBranchRow();
    mfjRenderForm();
  }

  // 2026-08-31: 借方・貸方を1行=同額のペアに固定していたのをやめ、行ごとに借方だけ・貸方だけでも
  // よい形に変更（ユーザー報告「借方2行(手数料1900+100)を貸方1行(買掛金2000)にまとめたい」に対応）。
  // マネーフォワードの公式API仕様（CRUDJournalLine）でcreditor/debitorがどちらもrequiredでない
  // ことを確認済み。貸借バランスは行ごとではなく全行の合計で見る
  function mfjAddBranchRow(){
    const isFirst=!MFJ_STATE.branches.length;
    const amt=isFirst?MFJ_STATE.amount:"";
    MFJ_STATE.branches.push({debitLabel:"",debitAmount:amt,creditLabel:"",creditAmount:amt,department_id:"",remark:""});

  // 仕訳辞書・過去の仕訳の複数行をまとめて明細行エディタへ反映し、直接入力モードへ切り替える
  function mfjApplyBranches(branches){

    MFJ_STATE.mode="manual";
    mfjRenderForm();
  }

  // 振替伝票入力（マネーフォワードの入力画面と同じ、借方/貸方を横に並べた表形式）の1行分。
  // 借方・貸方どちらか片方だけの入力も可（空欄のまま登録すればその行はその側を持たない明細になる）
  function mfjBranchRowHtml(br,idx){
    const deptOptions=`<option value="">（指定なし）</option>`+MFJ_STATE.departments.map(d=>`<option value="${esc(d.id)}" ${br.department_id===d.id?"selected":""}>${esc(d.name)}</option>`).join("");
    return `<tr class="mfj-branch-row" data-idx="${idx}">
      <td class="mfj-rmcell">${MFJ_STATE.branches.length>1?`<button data-mfjrm="${idx}" title="この行を削除">−</button>`:""}</td>
      <td>
        <input list="mfj-acc-datalist" class="mfj-branch-debit" data-idx="${idx}" value="${esc(br.debitLabel||"")}" placeholder="借方勘定科目（空欄可）">
        <select class="mfj-branch-dept" data-idx="${idx}" style="margin-top:4px">${deptOptions}</select>
      </td>
      <td><input type="number" class="mfj-branch-debit-amount mfj-amt" data-idx="${idx}" value="${br.debitAmount??""}" placeholder="金額"></td>
      <td><input list="mfj-acc-datalist" class="mfj-branch-credit" data-idx="${idx}" value="${esc(br.creditLabel||"")}" placeholder="貸方勘定科目（空欄可）"></td>
      <td><input type="number" class="mfj-branch-credit-amount mfj-amt" data-idx="${idx}" value="${br.creditAmount??""}" placeholder="金額"></td>
      <td><textarea class="mfj-branch-remark" data-idx="${idx}" placeholder="行ごとの摘要（空欄なら全体の摘要を使用）">${esc(br.remark||"")}</textarea></td>
    </tr>`;
  }

  function mfjUpdateBalance(){
    const totalDebit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.debitAmount)||0),0);
    const totalCredit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.creditAmount)||0),0);
    if($("mfj-debit-total")) $("mfj-debit-total").textContent=yen(totalDebit);
    if($("mfj-credit-total")) $("mfj-credit-total").textContent=yen(totalCredit);
    if($("mfj-diff-amt")) $("mfj-diff-amt").textContent=yen(totalDebit-totalCredit);
    if($("mfj-diff-box")) $("mfj-diff-box").className="box "+(totalDebit===totalCredit?"ok":"ng");
  }

  function mfjWireBranchRows(){
    document.querySelectorAll(".mfj-branch-debit").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].debitLabel=el.value; });
    document.querySelectorAll(".mfj-branch-credit").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].creditLabel=el.value; });
    document.querySelectorAll(".mfj-branch-dept").forEach(el=>el.onchange=()=>{ MFJ_STATE.branches[+el.dataset.idx].department_id=el.value; });
    document.querySelectorAll(".mfj-branch-remark").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].remark=el.value; });
    document.querySelectorAll(".mfj-branch-debit-amount").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].debitAmount=el.value; mfjUpdateBalance(); });
    document.querySelectorAll(".mfj-branch-credit-amount").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].creditAmount=el.value; mfjUpdateBalance(); });
    document.querySelectorAll("[data-mfjrm]").forEach(el=>el.onclick=()=>{ MFJ_STATE.branches.splice(+el.dataset.mfjrm,1); mfjRenderForm(); });
  }

  async function mfjRunJournalSearch(kw){
    $("mfj-journal-results").innerHTML="検索中…";
    const r=await mfjCall("list_journals",{keyword:kw,tenant_id:MFJ_STATE.tenantId});
    MFJ_STATE.journalResults=(r.ok&&r.body.results)||[];
    MFJ_STATE.journalKeyword=kw;
    mfjRenderJournalResults();
  }
  function mfjRenderJournalResults(){
    const el=$("mfj-journal-results");
    if(!el) return;
    const rs=MFJ_STATE.journalResults;
    el.innerHTML=rs.length?rs.map((r,i)=>`<div class="ai-field" style="margin-bottom:4px"><small>${esc(r.transaction_date||"")}</small>${esc(r.summary)}<div class="mail-actions" style="margin-top:4px"><button data-mfjpick="${i}" style="font-size:12px">この仕訳を使う</button></div></div>`).join("")
      :`<div style="font-size:12px;color:var(--muted)">${MFJ_STATE.journalKeyword?"該当する過去の仕訳が見つかりませんでした":"キーワードを入力して検索してください"}</div>`;
    document.querySelectorAll("[data-mfjpick]").forEach(btn=>btn.onclick=()=>{
      const r=MFJ_STATE.journalResults[+btn.dataset.mfjpick];
      const amt=MFJ_STATE.amount||(r.template.debit&&r.template.debit.value)||(r.template.credit&&r.template.credit.value)||"";
      mfjApplyBranches([{
        debitLabel:mfjLabelOf(r.template.debit), debitAmount:r.template.debit?amt:"",
        creditLabel:mfjLabelOf(r.template.credit), creditAmount:r.template.credit?amt:"",
        department_id:(r.template.debit&&r.template.debit.department_id)||"", tax_id:(r.template.debit&&r.template.debit.tax_id)||"",
        credit_department_id:(r.template.credit&&r.template.credit.department_id)||"", credit_tax_id:(r.template.credit&&r.template.credit.tax_id)||"",
        remark:r.template.remark||"",
      }]);
    });
  }

  // 仕訳辞書（管理システム内で登録したテンプレート。1件で複数の明細行を持てる＝振替伝票まるごと保存できる）
  function mfjRenderTemplateResults(){
    const el=$("mfj-tpl-results");
    if(!el) return;
    const all=MFJ_STATE.templates||[];
    const q=(MFJ_STATE.tplSearchQuery||"").trim();
    const tpls=q?all.filter(t=>(t.label||"").includes(q)):all;
    el.innerHTML=tpls.length?tpls.map(t=>{
      const sum=(t.branches||[]).map(b=>`${mfjLabelOf(b.debit)||"?"}／${mfjLabelOf(b.credit)||"?"}`).join("、");
      return `<div class="mfj-tpl-item"><div><div class="lbl">${esc(t.label)}</div><div class="sum">${esc(sum)}（${(t.branches||[]).length}行）</div></div><button data-mfjtpluse="${esc(t.id)}" style="font-size:12px;white-space:nowrap">この仕訳辞書を使う</button></div>`;
    }).join("")
      :(q?`<div style="font-size:12px;color:var(--muted)">該当する仕訳辞書が見つかりません</div>`:`<div style="font-size:12px;color:var(--muted)">この事業者にはまだ仕訳辞書が登録されていません。「🔧 直接入力」で内容を作ってから「💾 仕訳辞書に登録」で追加できます（設定タブでも管理できます）。</div>`);
    if($("mfj-tpl-search")) $("mfj-tpl-search").oninput=()=>{ MFJ_STATE.tplSearchQuery=$("mfj-tpl-search").value; mfjRenderTemplateResults(); };
    document.querySelectorAll("[data-mfjtpluse]").forEach(btn=>btn.onclick=()=>{
      const t=MFJ_STATE.templates.find(x=>x.id===btn.dataset.mfjtpluse);
      // 古い仕訳辞書（貸借同額の共通amount形式）・新しい仕訳辞書（辺ごとにvalueを持つ形式）の両方に対応
      const branches=(t.branches||[]).map(b=>({
        debitLabel:mfjLabelOf(b.debit), debitAmount:b.debit?(b.debit.value??b.amount??MFJ_STATE.amount??""):"",
        creditLabel:mfjLabelOf(b.credit), creditAmount:b.credit?(b.credit.value??b.amount??MFJ_STATE.amount??""):"",
        department_id:b.department_id||"", tax_id:b.tax_id||"",
        credit_department_id:b.credit_department_id||"", credit_tax_id:b.credit_tax_id||"",
        remark:b.remark||"",
      }));
      mfjApplyBranches(branches);
    });
  }

  // 今組んでいる明細行を仕訳辞書として保存（次回から「📗 仕訳辞書から選ぶ」に出てくる）
  async function mfjSaveAsTemplate(){
    const label=(prompt("仕訳辞書として登録する名前を入力してください（例: 【未払金】アルバイト給与）")||"").trim();
    if(!label) return;
    const structured=[];
    for(const b of MFJ_STATE.branches){
      const debit=b.debitLabel?MFJ_STATE.accountLabelMap.get(b.debitLabel):null;
      const credit=b.creditLabel?MFJ_STATE.accountLabelMap.get(b.creditLabel):null;
      if(b.debitLabel&&!debit){ alert("借方はプルダウンの候補から選んでから登録してください"); return; }
      if(b.creditLabel&&!credit){ alert("貸方はプルダウンの候補から選んでから登録してください"); return; }
      if(!debit&&!credit) continue;
      structured.push({
        debit:debit?{...debit,value:Number(b.debitAmount)||null}:null,
        credit:credit?{...credit,value:Number(b.creditAmount)||null}:null,
        department_id:b.department_id||null, department_name:(MFJ_STATE.departments.find(d=>d.id===b.department_id)||{}).name||null,
        tax_id:b.tax_id||null, tax_name:(MFJ_STATE.taxes.find(t=>t.id===b.tax_id)||{}).name||null,
        credit_department_id:b.credit_department_id||null, credit_department_name:(MFJ_STATE.departments.find(d=>d.id===b.credit_department_id)||{}).name||null,
        credit_tax_id:b.credit_tax_id||null, credit_tax_name:(MFJ_STATE.taxes.find(t=>t.id===b.credit_tax_id)||{}).name||null,
        remark:b.remark||null,
      });
    }
    if(!structured.length){ alert("明細行がありません"); return; }
    const msg=$("mfj-msg");
    const r=await authed("/rest/v1/mf_journal_templates",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({tenant_id:MFJ_STATE.tenantId,label,branches:structured,created_by:ME.id})});
    if(!r.ok){ msg.className="err"; msg.textContent="仕訳辞書への登録に失敗しました"; return; }
    msg.className="err msg-ok"; msg.textContent=`仕訳辞書「${label}」に登録しました`;
    MFJ_STATE.templates=await mfjFetchTemplates(MFJ_STATE.tenantId);
  }

  function mfjRenderForm(){
    const body=$("mfj-body");
    const mode=MFJ_STATE.mode;
    const totalDebit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.debitAmount)||0),0);
    const totalCredit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.creditAmount)||0),0);
    body.innerHTML=`
      <datalist id="mfj-acc-datalist">${MFJ_STATE.accountDatalistHtml||""}</datalist>
      ${MFJ_STATE.tenants&&MFJ_STATE.tenants.length>1?`<div class="ai-field" style="margin-bottom:6px;font-size:11px;color:${MFJ_STATE.autoMatchedFrom?"var(--accent)":"var(--muted)"}">登録先: <b>${esc(MFJ_STATE.tenantLabel||"")}</b> <button id="mfj-change-tenant" style="font-size:10px">変更</button>${MFJ_STATE.autoMatchedFrom?`<br>⚠️ 宛先「${esc(MFJ_STATE.autoMatchedFrom)}」から自動選択しました。<b>本当にこの事業者で合っていますか？</b>違う場合は「変更」から選び直してください`:""}</div>`:""}
      <div class="mail-actions" style="margin-bottom:8px">
        <button data-mfjmode="journal" ${mode==="journal"?'class="primary"':""}>📖 過去の仕訳から選ぶ</button>
        <button data-mfjmode="dict" ${mode==="dict"?'class="primary"':""}>📗 仕訳辞書から選ぶ${MFJ_STATE.templates.length?`（${MFJ_STATE.templates.length}）`:""}</button>
        <button data-mfjmode="manual" ${mode==="manual"?'class="primary"':""}>🔧 直接入力</button>
      </div>
      ${mode==="journal"?`<div id="mfj-journal-picker">
        <input id="mfj-journal-search" placeholder="会社名や勘定科目名で検索" value="${esc(MFJ_STATE.journalKeyword||"")}">
        <div id="mfj-journal-results" style="margin-top:6px"></div>
      </div>`:mode==="dict"?`<div id="mfj-tpl-picker">
        <input id="mfj-tpl-search" placeholder="🔍 仕訳辞書の名前で検索" value="${esc(MFJ_STATE.tplSearchQuery||"")}" style="max-width:240px;margin-bottom:8px">
        <div id="mfj-tpl-results"></div>
      </div>`:`
      <div class="mfj-balance">
        <div class="box"><small>借方合計</small><b id="mfj-debit-total">${yen(totalDebit)}</b></div>
        <div class="box"><small>貸方合計</small><b id="mfj-credit-total">${yen(totalCredit)}</b></div>
        <div class="box ${totalDebit===totalCredit?"ok":"ng"}" id="mfj-diff-box"><small>差額</small><b id="mfj-diff-amt">${yen(totalDebit-totalCredit)}</b></div>
      </div>
      <div class="mfj-gridwrap">
        <table class="mfj-grid">
          <thead>
            <tr><th rowspan="2" style="width:26px"></th><th colspan="2" class="side">借方</th><th colspan="2" class="side" style="background:var(--m-greensoft);color:var(--m-green)">貸方</th><th rowspan="2">摘要（行ごと・任意）</th></tr>
            <tr><th>勘定科目・部門</th><th>金額</th><th>勘定科目</th><th>金額</th></tr>
          </thead>
          <tbody id="mfj-branch-rows">${MFJ_STATE.branches.map((br,i)=>mfjBranchRowHtml(br,i)).join("")}</tbody>
        </table>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px">💡 各行は借方・貸方のどちらか片方だけでも登録できます（例: 借方2行に分けて、貸方は1行にまとめる）。借方合計と貸方合計さえ一致していれば登録できます</div>
      <div class="mail-actions" style="margin-top:6px">
        <button id="mfj-add-row">＋ 明細行を追加（振替伝票・複合仕訳の場合）</button>
        <button id="mfj-save-template">💾 この内容を仕訳辞書に登録</button>
      </div>
      <div class="ai-grid" style="margin-top:8px">
        <div class="ai-field"><small>日付（会計計上日・自由に変更可）</small><input id="mfj-date" type="date" value="${esc(MFJ_STATE.date)}"></div>
        <div class="ai-field"><small>摘要（全体・行ごとの摘要が空の場合に使われます）</small><input id="mfj-remark" value="${esc(MFJ_STATE.remark)}"></div>
      </div>
      ${(SELECTED.atts&&SELECTED.atts.length)?`<div class="ai-field" style="margin-top:8px"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="mfj-attach-files" checked>📎 メールの添付ファイル（${SELECTED.atts.length}件）もマネーフォワードへ証憑として添付する</label></div>`:""}
      <div class="mail-actions" style="margin-top:8px">
        <button class="primary" id="mfj-confirm">👁 プレビュー・確認画面へ</button>
      </div>`}
      <div class="err" id="mfj-msg" style="margin-top:6px"></div>
    `;
    document.querySelectorAll("[data-mfjmode]").forEach(btn=>btn.onclick=()=>{
      MFJ_STATE.mode=btn.dataset.mfjmode;
      if(MFJ_STATE.mode==="manual"&&!MFJ_STATE.branches.length) mfjAddBranchRow();
      mfjRenderForm();
    });
    if($("mfj-change-tenant")) $("mfj-change-tenant").onclick=()=>mfjShowTenantPicker(MFJ_STATE.tenants);
    if(mode==="journal"){
      mfjRenderJournalResults();
      let t=null;
      $("mfj-journal-search").oninput=()=>{ clearTimeout(t); const kw=$("mfj-journal-search").value.trim(); t=setTimeout(()=>mfjRunJournalSearch(kw),350); };
      return;
    }
    if(mode==="dict"){
      mfjRenderTemplateResults();
      return;
    }
    mfjWireBranchRows();
    $("mfj-add-row").onclick=()=>{ mfjAddBranchRow(); mfjRenderForm(); };
    $("mfj-save-template").onclick=mfjSaveAsTemplate;
    $("mfj-confirm").onclick=()=>mfjOpenPreview();
  }

  // プレビュー（マネーフォワード入力画面の振替伝票プレビューと同じ見た目：借方/貸方を並べたカード＋貸借バランス）
  function mfjOpenPreview(){
    const msg=$("mfj-msg"); msg.className="err"; msg.textContent="";
    const branchesPayload=[];
    let totalDebit=0, totalCredit=0;
    for(const b of MFJ_STATE.branches){
      const debit=b.debitLabel?MFJ_STATE.accountLabelMap.get(b.debitLabel):null;
      const credit=b.creditLabel?MFJ_STATE.accountLabelMap.get(b.creditLabel):null;
      if(b.debitLabel&&!debit){ msg.textContent="借方はプルダウンの候補から選択してください（自由入力のままだと登録できません）"; return; }
      if(b.creditLabel&&!credit){ msg.textContent="貸方はプルダウンの候補から選択してください（自由入力のままだと登録できません）"; return; }
      if(!debit&&!credit) continue;
      const dAmt=debit?Number(b.debitAmount):null, cAmt=credit?Number(b.creditAmount):null;
      if(debit&&(!dAmt||dAmt<=0)){ msg.textContent="借方の金額が未入力（0円）の行があります"; return; }
      if(credit&&(!cAmt||cAmt<=0)){ msg.textContent="貸方の金額が未入力（0円）の行があります"; return; }
      if(debit) totalDebit+=dAmt; if(credit) totalCredit+=cAmt;
      branchesPayload.push({debit,debitAmount:dAmt,credit,creditAmount:cAmt,department_id:b.department_id||null,tax_id:b.tax_id||null,credit_department_id:b.credit_department_id||null,credit_tax_id:b.credit_tax_id||null,remark:b.remark||""});
    }
    if(!branchesPayload.length){ msg.textContent="明細行がありません"; return; }
    if(totalDebit!==totalCredit){ msg.textContent=`借方合計（${yen(totalDebit)}）と貸方合計（${yen(totalCredit)}）が一致していません`; return; }
    const date=$("mfj-date").value, remark=$("mfj-remark").value;
    const entries=branchesPayload.map(b=>{
      const deptName=(MFJ_STATE.departments.find(d=>d.id===b.department_id)||{}).name||"";
      return `<div class="mfj-preview-entry">
        <div class="mfj-preview-head"><div>借方</div><div>貸方</div></div>
        <div class="mfj-preview-body">
          <div class="mfj-preview-side"><div class="acc">${b.debit?esc(mfjLabelOf(b.debit)):"—"}</div><div class="sub">${esc(deptName)}</div><div class="money">${b.debit?yen(b.debitAmount):"—"}</div></div>
          <div class="mfj-preview-side"><div class="acc">${b.credit?esc(mfjLabelOf(b.credit)):"—"}</div><div class="sub"></div><div class="money">${b.credit?yen(b.creditAmount):"—"}</div></div>
        </div>
        ${b.remark?`<div class="mfj-preview-remark">${esc(b.remark)}</div>`:""}
      </div>`;
    }).join("");

    const modal=document.createElement("div");
    modal.className="modal-bg mail-shell"; modal.id="mfjPreviewModal";
    modal.innerHTML=`<div class="modal" style="max-width:820px">
      <div class="mhead"><h2>🧾 振替伝票プレビュー</h2><button class="linkbtn" id="mfjPreviewClose" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px">閉じる ×</button></div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">登録先: <b>${esc(MFJ_STATE.tenantLabel||MFJ_STATE.tenantId)}</b>　日付: <b>${esc(date)}</b>　全体の摘要: <b>${esc(remark||"（なし）")}</b></div>
      <div class="mfj-balance" style="margin:0 0 10px">
        <div class="box"><small>借方合計</small><b>${yen(totalDebit)}</b></div>
        <div class="box"><small>貸方合計</small><b>${yen(totalCredit)}</b></div>
        <div class="box ok"><small>差額</small><b>¥0</b></div>
      </div>
      ${entries}
      <div class="err" id="mfjPreviewMsg" style="margin-top:6px"></div>
      <div class="mail-actions" style="margin-top:12px">
        <button id="mfjPreviewBack">← 戻って修正</button>
        <button class="primary" id="mfjPreviewSubmit">✅ この内容で登録</button>
      </div>
    </div>`;
    document.body.appendChild(modal);
    pushNav({modal:true});
    modal.onclick=e=>{ if(e.target===modal) history.back(); };
    $("mfjPreviewClose").onclick=()=>history.back();
    $("mfjPreviewBack").onclick=()=>history.back();
    $("mfjPreviewSubmit").onclick=async()=>{
      $("mfjPreviewSubmit").disabled=true;
      const pmsg=$("mfjPreviewMsg"); pmsg.className="err"; pmsg.textContent="登録中…";
      const payload={
        invoice_id: SELECTED.invoice.id,
        tenant_id: MFJ_STATE.tenantId,
        branches: branchesPayload.map(b=>({
          debit:b.debit?{account_id:b.debit.account_id,sub_account_id:b.debit.sub_account_id||undefined,value:b.debitAmount}:undefined,
          credit:b.credit?{account_id:b.credit.account_id,sub_account_id:b.credit.sub_account_id||undefined,value:b.creditAmount}:undefined,
          department_id:b.department_id||null, tax_id:b.tax_id||null,
          credit_department_id:b.credit_department_id||null, credit_tax_id:b.credit_tax_id||null,
          remark:b.remark||undefined,
        })),
        transaction_date: date,
        remark,
        linked_hq_step_id: LINKED_HQ_STEP?LINKED_HQ_STEP.id:null, // 保存前でも画面上の選択を優先させる（DB保存漏れ対策）
        attach_files: $("mfj-attach-files")?$("mfj-attach-files").checked:false,
        // PL連携対象科目かどうかの判定用（手数料等→PL自動反映・ラウンド5指示書§6.1）。MF送信には使わない
        debit_account_names: branchesPayload.filter(b=>b.debit).map(b=>mfjLabelOf(b.debit)),
      };
      const {ok,body:j}=await mfjCall("create",payload);
      if(!ok){ pmsg.textContent=j.error||"登録に失敗しました"; $("mfjPreviewSubmit").disabled=false; return; }
      pmsg.className="err msg-ok";
      pmsg.textContent=`登録しました（伝票番号: ${j.journal_number??"-"}）`
        +(j.voucher_attached?`。添付ファイルも${j.voucher_attached}件添付しました`:j.voucher_error?`（添付: ${j.voucher_error}）`:"")
        +(LINKED_HQ_STEP?(j.hq_step_completed?"。紐付けた本部タスクの工程も完了にしました":j.hq_step_error?`（本部タスクの自動完了には失敗: ${j.hq_step_error}）`:""):"")
        +"。画面を更新します…";
      setTimeout(()=>{ history.back(); reloadDetail(); },900);
    };
  }

  // ダウンロードリンク＋パスワード式などメールに直接添付がない請求書を、ダウンロード後に
  // 手動でアップロードしてこのメールへ紐付ける（ファイルはユーザー自身のJWTでstorageへ直接
  // アップロードし、invoice_attach_manual_file RPCでメタデータ登録＋監査ログに記録）
  // 2026-09-04新規：ZIP添付の展開ボタン（指示書§5-8）。展開後は同じ画面を再読込し、
  // 個別ファイルとして追加された証憑が一覧に増える（それ以降の「請求書として確定」判断は
  // 既存のAI自動入力＋C-8「➕他の請求書」機能に委ねる＝ここでは会計処理を一切行わない）
  document.querySelectorAll("[data-zipextract]").forEach(el=>el.onclick=async()=>{
    el.disabled=true; el.textContent="展開中…";
    const s=sess.get();
    const r=await fetch(SUPA_URL+"/functions/v1/invoice-zip-extract",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({attachment_id:el.dataset.zipextract})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.success){ alert(j.error||"ZIPの展開に失敗しました"); el.disabled=false; el.textContent="📦 ZIPを展開する"; return; }
    const skippedNote=(j.skipped&&j.skipped.length)?`（${j.skipped.length}件はPDF・画像以外のためスキップしました）`:"";
    alert(`${j.extracted.length}件のファイルを取り出しました${skippedNote}。内容を確認し、必要なら「🤖AIで自動入力」または「➕他の請求書」から請求書として追加してください。`);
    await reloadDetail();
  });
  if($("manual-att-drop")){
    const drop=$("manual-att-drop");
    ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background="var(--m-bg,#f4f1eb)"; drop.style.borderColor="var(--accent)"; }));
    ["dragleave","dragend"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background=""; drop.style.borderColor=""; }));
    drop.addEventListener("drop",e=>{
      e.preventDefault(); drop.style.background=""; drop.style.borderColor="";
      const f=e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f) $("manual-att-file").files=e.dataTransfer.files;
    });
  }
  $("manual-att-upload").onclick=async()=>{
    const msg=$("manual-att-msg");
    const f=$("manual-att-file").files[0];
    if(!f){ msg.textContent="ファイルを選択してください"; return; }
    $("manual-att-upload").disabled=true; msg.className="err"; msg.textContent="アップロード中…";
    try{
      const buf=await f.arrayBuffer();
      const hashBuf=await crypto.subtle.digest("SHA-256",buf);
      const hash=Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,"0")).join("");
      const ext=(f.name.split(".").pop()||"").toLowerCase().replace(/[^a-z0-9]/g,"");
      // 2026-09-04: 共通invoice詳細への統合。メールが実在しない（アップロード等）場合は
      // invoice.idを使ったパス・紐付けにする（emailIdはnull）
      const path=emailId?`${emailId}/manual_${Date.now()}${ext?"."+ext:""}`:`standalone/${invoice.id}/manual_${Date.now()}${ext?"."+ext:""}`;
      const s=sess.get();
      const upRes=await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${path}`,{
        method:"POST",
        headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:""),"Content-Type":f.type||"application/octet-stream"},
        body:buf
      });
      if(!upRes.ok) throw new Error("アップロードに失敗しました");
      const r=await authed("/rest/v1/rpc/invoice_attach_manual_file",{method:"POST",body:JSON.stringify({
        p_email_id:emailId||null, p_invoice_id:emailId?null:invoice.id, p_file_name:f.name, p_mime_type:f.type||null, p_storage_path:path, p_file_hash:hash, p_size_bytes:f.size
      })});
      if(!r.ok) throw new Error((r.body&&r.body.message)||"登録に失敗しました");
      msg.className="err msg-ok"; msg.textContent="追加しました";
      await reloadDetail();
    }catch(e){
      msg.textContent="エラー: "+e.message; $("manual-att-upload").disabled=false;
    }
  };

  if($("comment-add")) $("comment-add").onclick=async()=>{
    const body=$("comment-body").value.trim();
    const msg=$("comment-msg");
    if(!body){ msg.textContent="コメントを入力してください"; return; }
    $("comment-add").disabled=true; msg.className="err"; msg.textContent="追加中…";
    const r=await authed("/rest/v1/rpc/invoice_add_comment",{method:"POST",body:JSON.stringify({p_email_id:emailId||null,p_invoice_id:emailId?null:(invoice&&invoice.id),p_body:body})});
    if(!r.ok){ msg.textContent=(r.body&&r.body.message)||"追加できませんでした"; $("comment-add").disabled=false; return; }
    await reloadDetail();
  };

  // 2026-09-04: 返信機能はメールが実在する場合のみ（isStandalone＝アップロード等では
  // #reply-openなどのDOM自体がrenderMailDetail側で出力されないため、ここもガードする）
  if($("reply-open")) $("reply-open").onclick=()=>{ $("replybox").classList.toggle("open"); };
  if($("reply-confirm")) $("reply-confirm").onclick=()=>{
    const body=$("reply-body").value.trim();
    if(!body){ $("reply-msg").textContent="本文を入力してください"; return; }
    $("reply-preview").textContent=body;
    $("replyconfirm").style.display="block";
  };
  if($("reply-cancel")) $("reply-cancel").onclick=()=>{ $("replyconfirm").style.display="none"; };
  if($("reply-send")) $("reply-send").onclick=async()=>{
    $("reply-send").disabled=true; $("reply-msg").textContent="送信中…";
    const body=$("reply-body").value.trim();
    const qr=await authed("/rest/v1/rpc/invoice_queue_reply",{method:"POST",body:JSON.stringify({p_email_id:emailId,p_body:body})});
    if(!qr.ok){ $("reply-msg").textContent=(qr.body&&qr.body.message)||"送信予約に失敗しました"; $("reply-send").disabled=false; return; }
    const outboxId=qr.body;
    const s=sess.get();
    const sr=await fetch(SUPA_URL+"/functions/v1/invoice-send",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({outbox_id:outboxId})});
    const sj=await sr.json().catch(()=>({}));
    $("reply-msg").className="err msg-ok";
    $("reply-msg").textContent=(sr.ok&&sj.success)?"送信しました":"送信予約は完了しました。数分以内に自動で再送されます。";
    await reloadDetail();
  };
  wireJournalViewButtons(); // 2026-09-03: 「✅仕訳登録済み」をクリックすると内容を確認できるように
}

function dueBadgeHtml(row){
  const label=fmtD(row.due_date);
  if(!row.due_date||["paid","cancelled"].includes(row.invoice_status)) return esc(label);
  const today=new Date(); today.setHours(0,0,0,0);
  const due=new Date(row.due_date+"T00:00:00");
  const diffDays=Math.round((due-today)/86400000);
  if(diffDays<0) return `<span class="due-badge overdue">⚠️ ${esc(label)}（超過）</span>`;
  if(diffDays<=7) return `<span class="due-badge soon">${esc(label)}（あと${diffDays}日）</span>`;
  return esc(label);
}
function filteredSortedInvoiceRows(){
  let list=IV_ROWS;
  if(IV_STATUS) list=list.filter(r=>r.invoice_status===IV_STATUS);
  if(IV_AMOUNT_MIN!=="") list=list.filter(r=>r.amount!=null&&r.amount>=+IV_AMOUNT_MIN);
  if(IV_AMOUNT_MAX!=="") list=list.filter(r=>r.amount!=null&&r.amount<=+IV_AMOUNT_MAX);
  if(IV_DUE_FROM) list=list.filter(r=>r.due_date&&r.due_date>=IV_DUE_FROM);
  if(IV_DUE_TO) list=list.filter(r=>r.due_date&&r.due_date<=IV_DUE_TO);
  if(IV_SEARCH_Q.trim()){
    const q=IV_SEARCH_Q.trim().toLowerCase();
    list=list.filter(r=>(r.vendor_name||"").toLowerCase().includes(q)
      ||(r.invoice_number||"").toLowerCase().includes(q)
      ||(r.email&&r.email.subject||"").toLowerCase().includes(q)
      ||(r.email&&r.email.from_address||"").toLowerCase().includes(q));
  }
  if(IV_SORT_COL){
    // amountはPostgRESTがnumericを文字列で返す場合があるため数値化してから比較
    const norm=v=>{ if(v==null) return null; return IV_SORT_COL==="amount"?Number(v):v; };
    list=[...list].sort((a,b)=>{
      const av=norm(a[IV_SORT_COL]), bv=norm(b[IV_SORT_COL]);
      if(av==null&&bv==null) return 0;
      if(av==null) return 1; // nullは常に末尾
      if(bv==null) return -1;
      if(av<bv) return IV_SORT_DIR==="asc"?-1:1;
      if(av>bv) return IV_SORT_DIR==="asc"?1:-1;
      return 0;
    });
  }
  return list;
}
function invoiceListBodyHtml(){
  const cfg=LIST_KIND_CONFIG[LIST_KIND];
  const list=filteredSortedInvoiceRows();
  const arrow=col=>IV_SORT_COL===col?(IV_SORT_DIR==="asc"?" ▲":" ▼"):"";
  return `<table class="invoice-table">
    <thead><tr>
      <th>${cfg.vendorLabel}</th><th>${cfg.numberLabel}</th>
      <th data-sort="amount">${cfg.amountLabel}${arrow("amount")}</th>
      <th data-sort="due_date">${cfg.dateLabel}${arrow("due_date")}</th>

      ${list.map(row=>`<tr data-openmail="${row.email_id}">
        <td><b>${esc(row.vendor_name||(row.email&&row.email.from_address)||"—")}</b></td>
        <td>${esc(row.invoice_number||"—")}</td>
        <td>${yen(row.amount)}</td>
        <td>${dueBadgeHtml(row)}</td>
        <td>${esc(row.email&&row.email.processor&&row.email.processor.name||"—")}</td>

      </tr>`).join("")||`<tr><td colspan="6">${cfg.emptyLabel}</td></tr>`}
    </tbody>
  </table>`;
}

  document.querySelectorAll("[data-openmail]").forEach(el=>el.onclick=()=>{ DETAIL_MODE="process"; openMailDetailModal(u,el.dataset.openmail); });

const AI_STATUS_LABEL={auto:["自動判定済","check"],review:["要確認","wait"],error:["エラー","err"]};
const PAYMENT_STATUS_LABEL={not_ready:["—","gray"],wait:["振込待ち","wait"],csv:["CSV出力済","check"],processing:["振込処理中","wait"],paid:["振込済","done"],blocked:["確認停止","err"]};
// 2026-09-04新規：🧾請求書一覧の振込状態を分かりやすい6段階にする（指示書⑥）。新しい別管理は
// 作らず、既存のmf_journal_id/payment_status/bank_account_change_detected/payment_verified_at
// から判定するだけ（共通ロジック）
function unifiedPaymentStageLabel(r){
  if(r.bank_account_change_detected) return ["要確認（口座変更）","err"];
  if(!r.mf_journal_id) return ["振込対象外","gray"];
  if(r.payment_verified_at) return ["支払確認済","done"];
  if(r.payment_status==="paid") return ["振込済","done"];
  if(["wait","csv","processing"].includes(r.payment_status)) return ["振込準備完了","check"];
  return ["振込準備前","wait"];
}
function unifiedIsHighRisk(r){ return !!(r.duplicate_suspected||r.bank_account_change_detected||r.ai_match_status==="review"||r.ai_match_status==="error"); }
// 2026-09-04緊急修正：「要対応」タブを既定表示にした直後、ユーザーから「今までの請求書が
// 全て消えてしまった」と報告あり。原因調査の結果、データは消えていない（DBには17件現存）が、
// 旧来のinvoice-auto-match未実施の請求書はai_match_statusがnull（"review"/"error"どちらでもない）
// のため、旧いunifiedMatchesSubTab("review")の条件に一切当てはまらず、既定タブが空に見えて
// いたことが判明。ユーザー指示「重複疑い・取込エラー・法人不明・店舗/部門不明・仕訳不明
// （未判定）・口座変更・支払期限超過なども要対応に集約」に沿って条件を拡張し、この不具合も
// 同時に解消する（未判定＝ai_match_statusがnullも要対応に含めることで、旧データも正しく拾う）
// 2026-09-04拡張：要対応の「理由」を配列で返す共通関数にした（会計ダッシュボードの
// 「要対応の内訳」カードが、ここと全く同じ判定・同じ理由分類を再利用するため＝指示書§36
// 「要対応ロジックを二重実装しない」に対応。🧾請求書一覧側は従来どおりunifiedNeedsAttention()
// （真偽値だけ）を使い続けられるよう、その関数はunifiedAttentionReasons()の薄いラッパーにした）
// 2026-09-04新規：対象店舗の複数選択対応。invoice_storesを正データとして件数・表示名を扱う
// （rowにinvoice_storesが含まれない古いクエリ結果に対しては、後方互換でstore_idを1件として扱う）
function unifiedStoreCount(r){
  if(Array.isArray(r.invoice_stores)) return r.invoice_stores.length;
  return r.store_id?1:0;
}
function unifiedStoreLabel(r){
  if(Array.isArray(r.invoice_stores)&&r.invoice_stores.length){
    const names=r.invoice_stores.map(x=>x.store&&x.store.name).filter(Boolean);
    if(!names.length) return "—";
    if(names.length===1) return esc(names[0]);
    return `${esc(names[0])} 他${names.length-1}店舗`;
  }
  return esc((r.store&&r.store.name)||"—");
}
function unifiedAttentionReasons(r){
  if(r.payment_status==="paid") return []; // 完了済みは対象外（今さら指摘しても仕方ないため）
  const today=new Date().toISOString().slice(0,10);
  const reasons=[];
  if(r.duplicate_suspected) reasons.push("duplicate");
  if(r.bank_account_change_detected) reasons.push("bank_change");
  if(r.mf_registration_error) reasons.push("mf_error");
  if(r.ai_match_status==="error") reasons.push("import_error");
  else if(!r.ai_match_status) reasons.push("unknown_journal"); // 自動判定が未実施＝仕訳の当たりが付いていない
  if(!r.corporation_id) reasons.push("unknown_company");
  if(unifiedStoreCount(r)===0) reasons.push("unknown_store");
  if(r.due_date && r.due_date<today && r.payment_status!=="paid") reasons.push("overdue");
  return reasons;
}
function unifiedNeedsAttention(r){ return unifiedAttentionReasons(r).length>0; }
function unifiedMatchesSubTab(r,tab){
  if(tab==="all") return true;
  if(tab==="review") return unifiedNeedsAttention(r);
  if(tab==="accounting") return !r.mf_journal_id;
  if(tab==="payment") return !!r.mf_journal_id&&["wait","csv","processing"].includes(r.payment_status);
  if(tab==="done") return r.payment_status==="paid";
  return true;
}
function unifiedStageOf(r){
  if(!r.mf_journal_id) return "内容確認・会計待ち";
  if(r.payment_status==="paid") return "完了";
  if(["wait","csv","processing"].includes(r.payment_status)) return "振込準備";
  return "会計済み";
}

    ensureCorpStoreCache(),

async function unifiedSetCorporation(u,invoiceId,corporationId){
  const row=UNIFIED_STATE.rows.find(r=>r.id===invoiceId);
  if(!row) return;
  const corp=(UNIFIED_STATE.corporations||[]).find(c=>c.id===corporationId);
  await authed(`/rest/v1/invoices?id=eq.${invoiceId}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({corporation_id:corporationId||null,updated_at:new Date().toISOString()})});
  row.corporation_id=corporationId||null;
  row.corp=corp?{name:corp.name}:null;
  unifiedRender(u);
}
function unifiedFilteredRows(){
  let list=UNIFIED_STATE.rows.filter(r=>unifiedMatchesSubTab(r,UNIFIED_STATE.subTab));
  // 2026-09-04新規：会計ダッシュボードのカード・要対応内訳からの絞り込み遷移用
  // （overdue/bank_change/duplicate/mf_error/unknown_journal/unknown_company/unknown_store/import_error）
  if(UNIFIED_STATE.reasonFilter) list=list.filter(r=>unifiedAttentionReasons(r).includes(UNIFIED_STATE.reasonFilter));
  const q=(UNIFIED_STATE.search||"").trim().toLowerCase();
  if(q) list=list.filter(r=>[r.vendor_name,r.invoice_number,(r.vendor&&r.vendor.name),(r.corp&&r.corp.name),(r.store&&r.store.name),...(Array.isArray(r.invoice_stores)?r.invoice_stores.map(x=>x.store&&x.store.name):[])].filter(Boolean).join(" ").toLowerCase().includes(q));
  if(UNIFIED_STATE.yearMonth){
    // 支払期限があればそちらを、無ければ受領日（created_at）を対象年月として扱う
    list=list.filter(r=>{
      const d=r.due_date||r.created_at;
      return d&&String(d).slice(0,7)===UNIFIED_STATE.yearMonth;
    });
  }
  if(UNIFIED_STATE.sortCol){
    const col=UNIFIED_STATE.sortCol;
    const norm=v=>{ if(v==null) return null; return col==="amount"?Number(v):v; };
    list=[...list].sort((a,b)=>{
      const av=norm(a[col]), bv=norm(b[col]);
      if(av==null&&bv==null) return 0;
      if(av==null) return 1;
      if(bv==null) return -1;
      if(av<bv) return UNIFIED_STATE.sortDir==="asc"?-1:1;
      if(av>bv) return UNIFIED_STATE.sortDir==="asc"?1:-1;
      return 0;
    });
  }
  return list;
}

async function deleteInvoiceRecord(invoiceId,opts){
  await authed(`/rest/v1/invoice_pl_reflections?invoice_id=eq.${invoiceId}`,{method:"DELETE",headers:{Prefer:"return=minimal"}}).catch(()=>{});
  await authed(`/rest/v1/vendor_bank_account_change_requests?invoice_id=eq.${invoiceId}`,{method:"DELETE",headers:{Prefer:"return=minimal"}}).catch(()=>{});
  const r=await authed(`/rest/v1/invoices?id=eq.${invoiceId}`,{method:"DELETE",headers:{Prefer:"return=minimal"}});
  return r;
}
async function unifiedDeleteInvoice(u,invoiceId){
  const row=UNIFIED_STATE.rows.find(r=>r.id===invoiceId);
  const name=(row&&((row.vendor&&row.vendor.name)||row.vendor_name))||"この請求書";
  let msg=`「${esc(name)}」を削除します。元のメール・添付は削除されません（メールはまた「未処理」として残ります）。よろしいですか？`;
  if(row&&row.mf_journal_id) msg=`⚠️「${esc(name)}」は既にマネーフォワードへ仕訳登録済み（伝票番号: ${row.mf_journal_number??"-"}）です。この削除ではマネーフォワード側の仕訳は取り消されません（ローカルの記録だけが消え、追跡できなくなります）。テスト登録の後片付け以外では使わないでください。本当に削除しますか？`;
  if(!confirm(msg)) return;
  const r=await deleteInvoiceRecord(invoiceId);
  if(!r.ok){ alert("削除に失敗しました"); return; }
  await renderUnifiedInvoiceTab(u);
}

function rows_for_transfer_selection(){

async function transferExportCsv(u){
  const selected=rows_for_transfer_selection();
  if(!selected.length){ $("transfer-msg").textContent="対象を選択してください"; return; }
  const withAccount=selected.filter(r=>TRANSFERS_STATE.accountsByVendor.has(r.vendor_id));
  if(!withAccount.length){ $("transfer-msg").textContent="選択した請求書に振込先口座の登録がありません（設定タブで登録してください）"; return; }
  const remitterName=paypayRemitterName(); // 2026-09-04追加：PayPay銀行が振込依頼人名を必須としていたため確認する
  if(remitterName===null) return; // キャンセル
  const csv=buildPaypayCsv(withAccount.map(r=>{
    const acc=TRANSFERS_STATE.accountsByVendor.get(r.vendor_id);
    return { bankCode:acc.bank_code||"", branchCode:acc.branch_code||"", accountType:acc.account_type||"1", accountNumber:acc.account_number||"", holderKana:acc.account_holder_kana||"", amount:Number(r.amount)||0 };
  }),remitterName);
  const blob=paypayCsvToBlob(csv); // 2026-09-04：Shift-JISでエンコード（PayPay銀行アップロードエラー対応）
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`paypay_transfer_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  await authed(`/rest/v1/invoices?id=in.(${withAccount.map(r=>r.id).join(",")})`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({payment_status:"csv",transfer_csv_exported_at:new Date().toISOString()})});
  await renderTransfersTab(u);
}
async function transferMarkPaid(u){
  const selected=rows_for_transfer_selection();

  // 2026-09-04：振込完了イベント→本部タスク工程の自動完了。invoice_fire_task_event RPC経由に
  // 統一（invoice_id×event_typeの冪等性＋invoice_task_eventsへの監査記録がRPC側で保証される）
  await Promise.all(selected.map(r=>fireInvoiceEvent(r.id,"payment_completed").catch(()=>{})));
  await renderTransfersTab(u);
}

let MFT_STATE={};
async function mftLoadAccountsAndDepts(tenantId){
  const [accRes,deptRes]=await Promise.all([mfCall("accounts",{tenant_id:tenantId}),mfCall("list_departments",{tenant_id:tenantId})]);
  return {accounts:(accRes.ok&&accRes.body.accounts)||[], departments:(deptRes.ok&&deptRes.body.departments)||[], taxes:(deptRes.ok&&deptRes.body.taxes)||[], accountsOk:accRes.ok, accountsError:accRes.body&&accRes.body.error};
}
function mftBuildAccountIndex(accounts){
  const map=new Map(); let dl="";
  for(const a of accounts){
    map.set(a.name,{account_id:a.id,sub_account_id:null,account_name:a.name,sub_account_name:null});
    dl+=`<option value="${esc(a.name)}">`;
    for(const sa of (a.sub_accounts||[])){
      const label=`${a.name}/${sa.name}`;
      map.set(label,{account_id:a.id,sub_account_id:sa.id,account_name:a.name,sub_account_name:sa.name});
      dl+=`<option value="${esc(label)}">`;
    }
  }
  return {map,dl};
}
function mftLabelOf(side){ if(!side||!side.account_name) return ""; return side.sub_account_name?`${side.account_name}/${side.sub_account_name}`:side.account_name; }

// 登録済み仕訳の内容をクリックして確認できるプレビュー（2026-09-03追加。ユーザー要望

  modal.innerHTML=`<div class="modal" style="max-width:820px">

    <div id="mfjJournalViewBody"><div class="spin">読み込み中…</div></div>
  </div>`;
  document.body.appendChild(modal);
  pushNav({modal:true});
  modal.onclick=e=>{ if(e.target===modal) history.back(); };
  $("mfjJournalViewClose").onclick=()=>history.back();
  const {ok,body:j}=await mfCall("get_journal",{tenant_id:tenantId,journal_id:journalId});
  const box=$("mfjJournalViewBody");
  if(!ok){ box.innerHTML=`<div class="err">取得に失敗しました: ${esc((j&&j.error)||"")}</div>`; return; }
  const entries=(j.branches||[]).map(b=>{
    const deptName=(b.debit&&b.debit.department_name)||"";

    return `<div class="mfj-preview-entry">
      <div class="mfj-preview-head"><div>借方</div><div>貸方</div></div>
      <div class="mfj-preview-body">
        <div class="mfj-preview-side"><div class="acc">${b.debit?esc(mftLabelOf(b.debit)):"—"}</div><div class="sub">${esc(deptName)}</div><div class="money">${b.debit?yen(b.debit.value):"—"}</div></div>
        <div class="mfj-preview-side"><div class="acc">${b.credit?esc(mftLabelOf(b.credit)):"—"}</div><div class="sub">${esc(creditDeptName)}</div><div class="money">${b.credit?yen(b.credit.value):"—"}</div></div>
      </div>
      ${b.remark?`<div class="mfj-preview-remark">${esc(b.remark)}</div>`:""}
    </div>`;
  }).join("");
  box.innerHTML=`
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">伝票番号: <b>${esc(String(j.journal_number??"-"))}</b>　会計計上日: <b>${esc(j.transaction_date||"—")}</b></div>

  document.querySelectorAll("[data-mft-del]").forEach(el=>el.onclick=async()=>{
    if(!confirm(`仕訳辞書「${el.dataset.mftLabel}」を削除しますか？`)) return;
    await authed(`/rest/v1/mf_journal_templates?id=eq.${el.dataset.mftDel}`,{method:"DELETE"});
    renderMftSection(MFT_STATE.activeTenantId);

}
function mftListHtml(){
  let tpls=MFT_STATE.templates||[];
  const q=(MFT_STATE.searchQuery||"").trim();
  if(q) tpls=tpls.filter(t=>(t.label||"").includes(q));
  const ed=MFT_STATE.editing;
  if(!tpls.length) return `<div style="font-size:12px;color:var(--muted)">${q?"該当する仕訳辞書が見つかりません":"この事業者にはまだ仕訳辞書が登録されていません。"}</div>`;
  return tpls.map(t=>{
    const sum=(t.branches||[]).map(b=>`${mftLabelOf(b.debit)||"?"}／${mftLabelOf(b.credit)||"?"}`).join("、");
    const row=`<div class="mfj-tpl-item"><div><div class="lbl">${esc(t.label)}</div><div class="sum">${esc(sum)}（${(t.branches||[]).length}行）</div></div>
      <div style="display:flex;gap:6px"><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-mft-edit="${t.id}">編集</button><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-mft-del="${t.id}" data-mft-label="${esc(t.label)}">削除</button></div>
    </div>`;
    // 編集中の項目の直後に編集フォームの差込先を用意（2026-09-02: ユーザー報告「編集画面が一番下に
    // 出るので、その項目のすぐ下に出してほしい」に対応。新規追加時はediting.idがnullなので一覧の外＝
    // mftRenderBox()側の固定位置に出す）
    return row+((ed&&ed.id===t.id)?`<div id="mft-editor" style="margin:8px 0 14px"></div>`:"");
  }).join("");
}

function mftBranchRowHtml(br,idx){
  const deptOptions=`<option value="">（指定なし）</option>`+(MFT_STATE.departments||[]).map(d=>`<option value="${esc(d.id)}" ${br.department_id===d.id?"selected":""}>${esc(d.name)}</option>`).join("");

  // 税区分（2026-09-02追加。2026-09-02追記: 貸方側にも同様に追加＝ユーザー報告
  // 「貸方のほうは部門とか税率とか出てこない」に対応）: taxes.readスコープでの再認可がまだの
  // 事業者はMFT_STATE.taxesが空になるため、その場合はプルダウンの代わりに案内文を出す
  const taxCell=(MFT_STATE.taxes&&MFT_STATE.taxes.length)
    ?`<select class="mft-tax" data-idx="${idx}" style="margin-top:4px"><option value="">（勘定科目の既定のまま）</option>${MFT_STATE.taxes.map(t=>`<option value="${esc(t.id)}" ${br.tax_id===t.id?"selected":""}>${esc(t.name)}${t.tax_rate!=null?`（${Math.round(t.tax_rate*100)}%）`:""}</option>`).join("")}</select>`
    :`<div style="font-size:10px;color:var(--muted);margin-top:4px">税率連携が未完了です（設定タブ下部の再認可リンクから）</div>`;
  const creditTaxCell=(MFT_STATE.taxes&&MFT_STATE.taxes.length)
    ?`<select class="mft-credit-tax" data-idx="${idx}" style="margin-top:4px"><option value="">（勘定科目の既定のまま）</option>${MFT_STATE.taxes.map(t=>`<option value="${esc(t.id)}" ${br.credit_tax_id===t.id?"selected":""}>${esc(t.name)}${t.tax_rate!=null?`（${Math.round(t.tax_rate*100)}%）`:""}</option>`).join("")}</select>`
    :`<div style="font-size:10px;color:var(--muted);margin-top:4px">税率連携が未完了です</div>`;
  return `<tr data-idx="${idx}">
    <td class="mfj-rmcell">${MFT_STATE.editing.branches.length>1?`<button data-mftrm="${idx}" title="この行を削除">−</button>`:""}</td>
    <td><input list="mft-acc-datalist" class="mft-debit" data-idx="${idx}" value="${esc(br.debitLabel||"")}" placeholder="借方勘定科目（空欄可）"><select class="mft-dept" data-idx="${idx}" style="margin-top:4px">${deptOptions}</select>${taxCell}</td>
    <td><input type="number" class="mft-debit-amount" data-idx="${idx}" value="${br.debitAmount??""}" placeholder="任意"></td>
    <td><input list="mft-acc-datalist" class="mft-credit" data-idx="${idx}" value="${esc(br.creditLabel||"")}" placeholder="貸方勘定科目（空欄可）"><select class="mft-credit-dept" data-idx="${idx}" style="margin-top:4px">${creditDeptOptions}</select>${creditTaxCell}</td>
    <td><input type="number" class="mft-credit-amount" data-idx="${idx}" value="${br.creditAmount??""}" placeholder="任意"></td>
    <td><textarea class="mft-remark" data-idx="${idx}">${esc(br.remark||"")}</textarea></td>
    <td><select class="mft-purpose" data-idx="${idx}">
      <option value="" ${!br.purpose?"selected":""}>（手入力のまま）</option>
      <option value="base_salary" ${br.purpose==="base_salary"?"selected":""}>基本給・固定給</option>
      <option value="commute" ${br.purpose==="commute"?"selected":""}>通勤手当</option>
      <option value="deduction" ${br.purpose==="deduction"?"selected":""}>控除・預り金</option>
      <option value="net_pay" ${br.purpose==="net_pay"?"selected":""}>差引支給額</option>
    </select></td>
  </tr>`;
}

  document.querySelectorAll(".mft-debit").forEach(elx=>elx.oninput=()=>{ ed.branches[+elx.dataset.idx].debitLabel=elx.value; });
  document.querySelectorAll(".mft-credit").forEach(elx=>elx.oninput=()=>{ ed.branches[+elx.dataset.idx].creditLabel=elx.value; });

  $("mft-priority").oninput=()=>{ ed.priority=$("mft-priority").value; };
  $("mft-keywords").oninput=()=>{ ed.matchKeywords=$("mft-keywords").value; };
  $("mft-from").oninput=()=>{ ed.matchFromAddresses=$("mft-from").value; };
  $("mft-amt-min").oninput=()=>{ ed.amountMin=$("mft-amt-min").value; };
  $("mft-amt-max").oninput=()=>{ ed.amountMax=$("mft-amt-max").value; };
  document.querySelectorAll(".mft-source").forEach(elx=>elx.onchange=()=>{
    ed.sourceFilter=[...document.querySelectorAll(".mft-source:checked")].map(x=>x.value);
  });
  $("mft-corp").onchange=()=>{ ed.targetCorporationId=$("mft-corp").value; };
  $("mft-store").onchange=()=>{ ed.targetStoreId=$("mft-store").value; };
  $("mft-pl-account").oninput=()=>{ ed.plAccount=$("mft-pl-account").value; };
  $("mft-payment-method").onchange=()=>{ ed.paymentMethod=$("mft-payment-method").value; };
  $("mft-ad-target").onchange=()=>{ ed.adTarget=$("mft-ad-target").checked; };
  $("mft-settlement-target").onchange=()=>{ ed.settlementTarget=$("mft-settlement-target").checked; };
  $("mft-auto-apply").onchange=()=>{ ed.autoApply=$("mft-auto-apply").checked; };
  $("mft-require-review").onchange=()=>{ ed.requireHumanReview=$("mft-require-review").checked; };
}
async function mftSaveEditor(){
  const ed=MFT_STATE.editing;
  const label=$("mft-label").value.trim();
  if(!label){ alert("名前を入力してください"); return; }
  const structured=[];
  for(const b of ed.branches){
    const debit=b.debitLabel?MFT_STATE.accountLabelMap.get(b.debitLabel):null;
    const credit=b.creditLabel?MFT_STATE.accountLabelMap.get(b.creditLabel):null;
    if(b.debitLabel&&!debit){ alert("借方はプルダウンの候補から選んでください"); return; }
    if(b.creditLabel&&!credit){ alert("貸方はプルダウンの候補から選んでください"); return; }
    if(!debit&&!credit) continue;
    structured.push({
      debit:debit?{...debit,value:Number(b.debitAmount)||null}:null,
      credit:credit?{...credit,value:Number(b.creditAmount)||null}:null,
      department_id:b.department_id||null, department_name:(MFT_STATE.departments.find(d=>d.id===b.department_id)||{}).name||null,
      tax_id:b.tax_id||null, tax_name:(MFT_STATE.taxes.find(t=>t.id===b.tax_id)||{}).name||null,
      credit_department_id:b.credit_department_id||null, credit_department_name:(MFT_STATE.departments.find(d=>d.id===b.credit_department_id)||{}).name||null,
      credit_tax_id:b.credit_tax_id||null, credit_tax_name:(MFT_STATE.taxes.find(t=>t.id===b.credit_tax_id)||{}).name||null,
      remark:b.remark||null, purpose:b.purpose||null,
    });
  }
  if(!structured.length){ alert("明細行がありません"); return; }
  $("mft-save").disabled=true;
  const splitList=s=>String(s||"").split(/[、,]/).map(x=>x.trim()).filter(Boolean);
  const payload={
    tenant_id:MFT_STATE.activeTenantId, label, branches:structured,
    vendor_id: ed.vendorId||null,
    match_keywords: splitList(ed.matchKeywords),
    match_from_addresses: splitList(ed.matchFromAddresses),
    target_corporation_id: ed.targetCorporationId||null,
    target_store_id: ed.targetStoreId||null,
    amount_min: ed.amountMin===""?null:Number(ed.amountMin),
    amount_max: ed.amountMax===""?null:Number(ed.amountMax),
    source_filter: ed.sourceFilter,
    pl_account: ed.plAccount||null,
    ad_target: ed.adTarget,
    settlement_target: ed.settlementTarget,
    payment_method: ed.paymentMethod,
    auto_apply: ed.autoApply,
    require_human_review: ed.requireHumanReview,
    priority: Number(ed.priority)||100,
  };
  const r=ed.id
    ?await authed(`/rest/v1/mf_journal_templates?id=eq.${ed.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({...payload,updated_at:new Date().toISOString()})})
    :await authed("/rest/v1/mf_journal_templates",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({...payload,created_by:ME.id})});
  if(!r.ok){ if($("mft-save")) $("mft-save").disabled=false; alert("保存に失敗しました"); return; }
  renderMftSection(MFT_STATE.activeTenantId);
}

   処理状況／今月の処理進捗／今月の支払状況／支払予定／要対応の内訳／最近の処理）に置き換えた。
   新しい別テーブル・別集計基盤は作らず、既存のinvoices（+要対応判定unifiedAttentionReasons・
   振込状態unifiedPaymentStageLabel）をこの画面用に集計するだけのView（指示書§4・§39-40）。
   日付基準は🧾請求書一覧と統一：支払期限(due_date)があればそちら、無ければ取込日(created_at)
   （invoicesのスキーマには請求日・計上日という独立列が無いため。指示書§28への回答）
   ============================================================ */
let DASH_STATE={corpId:"", yearMonth:"", allRows:null, error:null};
function dashYmDefault(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; }
function dashDateBasis(r){ return r.due_date||r.created_at; }
function dashYmCandidates(rows){
  const set=new Set([dashYmDefault()]);
  rows.forEach(r=>{ const d=dashDateBasis(r); if(d) set.add(String(d).slice(0,7)); });
  return [...set].sort().reverse();
}
function dashScopedRows(allRows){
  let rows=allRows;
  if(DASH_STATE.corpId) rows=rows.filter(r=>r.corporation_id===DASH_STATE.corpId);
  if(DASH_STATE.yearMonth) rows=rows.filter(r=>{ const d=dashDateBasis(r); return d&&String(d).slice(0,7)===DASH_STATE.yearMonth; });
  return rows;
}
function dashAttentionCounts(rows){
  const map={};
  rows.forEach(r=>unifiedAttentionReasons(r).forEach(reason=>{ map[reason]=(map[reason]||0)+1; }));
  return map;
}
async function renderAccountingDashboardTab(u){

  const [r]=await Promise.all([
    authed(`/rest/v1/invoices?select=*,email:invoice_emails(mail_kind),corp:corporations(name),store:stores!invoices_store_id_fkey(name),invoice_stores(store:stores(name)),vendor:vendors(name)&order=created_at.desc&limit=1000`),
    ensureCorpStoreCache(),
  ]);
  if(!r.ok){
    DASH_STATE.error="取得に失敗しました";
    $("tabbody").innerHTML=`<section class="invoice-list active"><div class="card" style="padding:16px"><div class="err">データの取得に失敗しました。時間をおいて再度お試しください。</div></div></section>`;
    return;
  }
  // 🧾請求書一覧（renderUnifiedInvoiceTab）と全く同じ対象定義（メール起点は種類=請求書のみ・
  // アップロード等は全て対象）。ここが違うと「請求書一覧は7件・ダッシュボードは6件」のような
  // 不整合（指示書§36が最も懸念している事態）が起きるため、意図的に同じフィルタにしている
  DASH_STATE.allRows=(r.body||[]).filter(row=>!row.email||row.email.mail_kind==="invoice");
  DASH_STATE.error=null;
  if(!DASH_STATE.yearMonth) DASH_STATE.yearMonth=dashYmDefault();
  dashRenderBody(u);
}

  const today=new Date().toISOString().slice(0,10);
  const reasonCounts=dashAttentionCounts(rows);

  // ---- ①今日やること：緊急性の高い例外だけ ----
  const todoDefs=[

  const reviewDoneCount=rows.filter(r=>!unifiedNeedsAttention(r)).length; // 内容確認＝要対応でない
  const accountingDoneCount=rows.filter(r=>r.mf_journal_id).length; // 会計対象外フラグが現状無いため、対象＝全件（正直な簡略化）
  const paymentTargetRows=rows.filter(r=>r.mf_journal_id); // 振込は会計登録済みのものだけが対象（payment_method等の除外は未実装）
  const paymentDoneCount=paymentTargetRows.filter(r=>r.payment_status==="paid").length;

  // ---- ④今月の支払状況（金額4項目） ----
  const totalAmount=rows.reduce((s,r)=>s+(Number(r.amount)||0),0);

  const monthEndStr=monthEndDate.toISOString().slice(0,10);
  const unpaidDue=paymentTargetRows.filter(r=>r.payment_status!=="paid"&&r.due_date);
  const schedule=[

  ].filter(([,,list])=>list.length||true); // 0件でも行としては出す（confirmed UIどおり）

  // ---- ⑥要対応の内訳（1件以上のみ表示） ----
  const reasonRows=Object.entries(reasonCounts).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]);

  const pct=(num,den)=>den>0?Math.round(num/den*100):null;

    const p=pct(num,den);
    return `<div class="dash-progress-row">

            <select id="dash-ym" class="select-box">

            </select>
          </div>
        </div>
      </div>

      <div class="dash-section-title">① 今日やること（要対応アクション）</div>
      ${todoCards.length?`<div class="dash-grid-4">${todoCards.map(([key,label,desc,warn])=>`
        <div class="dash-action-card${warn?" warning":""}" data-dash-goto="${key}">

          <div class="ddesc">${esc(desc)} →</div>

        :`<div class="dash-action-empty" style="margin-bottom:26px">✓ 現在、優先対応が必要な項目はありません</div>`}

      <div class="dash-section-title">② 今月の処理状況</div>
      <div class="dash-grid-4">
        <div class="dash-kpi-card" data-dash-goto="__review"><div class="dash-kpi-label">要対応</div><div class="dash-kpi-val">${needsAttentionCount}<span style="font-size:12px;font-weight:normal;color:var(--muted)"> 件</span></div></div>
        <div class="dash-kpi-card" data-dash-goto="__accounting"><div class="dash-kpi-label">会計待ち</div><div class="dash-kpi-val">${accountingWaitingCount}<span style="font-size:12px;font-weight:normal;color:var(--muted)"> 件</span></div></div>
        <div class="dash-kpi-card" data-dash-goto="__payment"><div class="dash-kpi-label">振込待ち</div><div class="dash-kpi-val">${paymentWaitingCount}<span style="font-size:12px;font-weight:normal;color:var(--muted)"> 件</span></div></div>
        <div class="dash-kpi-card${overdueCount?" alert":""}" data-dash-goto="overdue"><div class="dash-kpi-label">期限超過</div><div class="dash-kpi-val">${overdueCount}<span style="font-size:12px;font-weight:normal"> 件</span></div></div>
      </div>
