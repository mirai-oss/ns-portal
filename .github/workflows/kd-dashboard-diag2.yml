name: kd_dashboard_daily_summary再検証(修正後・送信なし・一時的)
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 直近30日+全カラムを確認
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FROM=$(date -u -d '-30 days' +%Y-%m-%d)
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/kd_dashboard_daily_summary?period_date=gte.$FROM&select=*&order=period_date.desc&limit=5" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -o /tmp/kdd.json
          node -e "
            const d=JSON.parse(require('fs').readFileSync('/tmp/kdd.json','utf8'));
            console.log('rows:', d.length);
            if(d[0]) console.log('columns:', Object.keys(d[0]));
            console.log('sample:', JSON.stringify(d[0],null,2));
          "
          echo '--- total count ---'
          curl -sI "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/kd_dashboard_daily_summary?select=id&period_date=gte.$FROM" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Prefer: count=exact" | grep -i content-range
