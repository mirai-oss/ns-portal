function automationEventRows(){
  const runEvents=AUTOMATION_STATE.runs.map(r=>({
    at:r.finished_at||r.started_at,
    target:`${intakeScheduleLabel(r.job)}${r.target_ym?" "+r.target_ym:""}`,
    event:"import_run（"+esc(r.kind||r.job||"")+"）",
    result:r.status==="success"?["成功","done"]:r.status==="failed"?["失敗","err"]:r.status==="partial"?["一部成功","wait"]:["実行中","gray"],
    human:"不要",
    detail:r.error||r.detail||"—",
  }));
  const actEvents=AUTOMATION_STATE.activity.map(a=>{
    const t=AUTOMATION_STATE.exceptionTasks.find(x=>x.id===a.task_id);
    return {
      at:a.created_at,
      target:(t&&t.title)||"—",
      event:a.kind==="create"?"exception_task_created":a.kind,
      result:["要確認","wait"],
      human:"タスク発行",
      detail:a.detail||"—",
    };
  });
  return [...runEvents,...actEvents].filter(e=>e.at).sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,60);
}
function automationRender(u){
  const kpi=automationKpis();

   売上入金（Step4・2026-09-11新設）
   PayPay等の決済入金を「売上発生→入金予定→実入金→照合→消込」で管理する新機能。
   データ源: ar_receivables（正規化済み入金予定。担当Dの取込元別生データ―
   import_paypay_settlement等―から取込む設計。現状はまだ生データ0件のため空表示になる）、
   ar_deposits（実入金）、ar_matching（消込結果・差異ログ）。指示書§9-8/9-9対応。
   ============================================================ */
function receivableYmDefault(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
let RECEIVABLE_STATE={yearMonth:"",storeFilter:"",subTab:"pending",receivables:[],deposits:[],matches:[]};
async function renderReceivableTab(u){
  $("tabbody").innerHTML=`<section class="invoice-list active"><div class="card" style="padding:16px"><div class="spin" style="padding:20px 0">読み込み中…</div></div></section>`;
  if(!RECEIVABLE_STATE.yearMonth) RECEIVABLE_STATE.yearMonth=receivableYmDefault();
  await Promise.all([ensureCorpStoreCache(),receivableLoad()]);
  receivableRender(u);
}
async function receivableLoad(){
  const ym=RECEIVABLE_STATE.yearMonth;
  const r=await authed(`/rest/v1/ar_receivables?year_month=eq.${encodeURIComponent(ym)}&select=*&order=expected_date.asc.nullslast&limit=500`);
  const receivables=(r.ok&&Array.isArray(r.body))?r.body:[];
  RECEIVABLE_STATE.receivables=receivables;
  const ids=receivables.map(x=>x.id);
  if(!ids.length){ RECEIVABLE_STATE.deposits=[]; RECEIVABLE_STATE.matches=[]; return; }
  const [dr,mr]=await Promise.all([
    authed(`/rest/v1/ar_deposits?receivable_id=in.(${ids.join(",")})&select=*`),
    authed(`/rest/v1/ar_matching?receivable_id=in.(${ids.join(",")})&select=*&order=created_at.desc`),
  ]);
  RECEIVABLE_STATE.deposits=(dr.ok&&Array.isArray(dr.body))?dr.body:[];
  RECEIVABLE_STATE.matches=(mr.ok&&Array.isArray(mr.body))?mr.body:[];
}
// 各入金予定行の内部タブ判定（指示書§9-8の想定フローに沿って5状態に分類）。
// ar_receivables.statusを主軸に、入金済（ar_deposits登録あり）だけはmatches優先で見分ける
function receivableRowState(row){
  if(row.status==="matched") return "matched"; // 消込完了
  if(row.status==="diff"||row.status==="manual_review") return "diff"; // 差異あり
  const hasDeposit=RECEIVABLE_STATE.deposits.some(d=>d.receivable_id===row.id);
  if(hasDeposit) return "deposited"; // 入金済（消込はまだ）
  const today=new Date().toISOString().slice(0,10);
  if(row.expected_date&&row.expected_date<today) return "overdue"; // 未入金（予定日超過）
  return "pending"; // 入金予定
}
const RECEIVABLE_SUBTABS=[
  ["pending","入金予定"],
  ["overdue","未入金"],
  ["diff","差異あり"],
  ["deposited","入金済"],
  ["matched","消込完了"],
];
function receivableFilteredRows(){
  let rows=RECEIVABLE_STATE.receivables;
  if(RECEIVABLE_STATE.storeFilter) rows=rows.filter(r=>r.store_id===RECEIVABLE_STATE.storeFilter);
  return rows.filter(r=>receivableRowState(r)===RECEIVABLE_STATE.subTab);
}
function receivableStoreName(storeId){
  if(!storeId) return "（共通費）";
  const s=(CORP_STORE_CACHE&&CORP_STORE_CACHE.stores||[]).find(x=>x.id===storeId);
  return s?s.name:"（不明な店舗）";
}
function receivableRowHtml(r){
  const st=receivableRowState(r);
  const deposit=RECEIVABLE_STATE.deposits.find(d=>d.receivable_id===r.id);
  const lastMatch=RECEIVABLE_STATE.matches.find(m=>m.receivable_id===r.id);
  const statusLabel={pending:["予定","gray"],overdue:["未入金","err"],diff:["差異あり","err"],deposited:["入金済","check"],matched:["消込完了","done"]}[st];
  return `<tr>
    <td>${esc(r.source_name||"—")}</td>
    <td>${esc(receivableStoreName(r.store_id))}${r.is_common_cost?' <span class="hq-pill blue">共通費</span>':''}</td>
    <td>${yen(r.gross_amount)}</td>
    <td>${yen(r.fee_amount)}</td>
    <td>${yen(r.expected_amount)}</td>
    <td>${deposit?yen(deposit.amount):"—"}</td>
    <td>${lastMatch?yen(lastMatch.diff_amount):(deposit?yen((Number(deposit.amount)||0)-(Number(r.expected_amount)||0)):"—")}</td>
    <td>${fmtD(r.expected_date)}</td>
    <td><span class="invoice-status ${statusLabel[1]}">${esc(statusLabel[0])}</span></td>
    <td>${esc(r.note||"—")}</td>
  </tr>`;
}
function receivableKpis(){
  const rows=RECEIVABLE_STATE.storeFilter?RECEIVABLE_STATE.receivables.filter(r=>r.store_id===RECEIVABLE_STATE.storeFilter):RECEIVABLE_STATE.receivables;
  const byState=k=>rows.filter(r=>receivableRowState(r)===k);
  const sum=list=>list.reduce((s,r)=>s+(Number(r.expected_amount)||0),0);
  const matchedRows=byState("matched");
  const matchedIds=new Set(matchedRows.map(r=>r.id));
  const autoMatched=RECEIVABLE_STATE.matches.filter(m=>matchedIds.has(m.receivable_id)&&m.matched_by==="auto").length;
  const rate=matchedRows.length?Math.round((autoMatched/matchedRows.length)*100):0;
  return {
    pending:{n:byState("pending").length,amt:sum(byState("pending"))},
    overdue:{n:byState("overdue").length,amt:sum(byState("overdue"))},
    diff:{n:byState("diff").length,amt:sum(byState("diff"))},
    autoMatched:{n:autoMatched},
    matched:{n:matchedRows.length,amt:sum(matchedRows)},
    rate,
  };
}

function wireBulkBar(u){
  updateBulkBar();
  $("bulk-selectall").onchange=e=>{
    const list=filteredMails();
    if(e.target.checked) list.forEach(m=>BULK_SELECTED.add(m.id)); else BULK_SELECTED.clear();
    document.querySelectorAll("[data-bulkcheck]").forEach(el=>{ el.checked=BULK_SELECTED.has(el.dataset.bulkcheck); });
    updateBulkBar();
  };
  $("bulk-start").onclick=()=>runBulkAction(u,"start","まとめて処理を開始します。他の人が処理中のものはスキップされます。よろしいですか？");
  $("bulk-waiting").onclick=()=>runBulkAction(u,"waiting_payment","選択したメールの請求書を「支払待ち」にします。よろしいですか？");
  $("bulk-complete").onclick=()=>runBulkAction(u,"complete","まとめて完了にします。他の人が処理中のものはスキップされます。よろしいですか？");
  $("bulk-notapplicable").onclick=()=>runBulkAction(u,"not_applicable","選択したメールをまとめて「対象外」にします（請求書ではないメール）。よろしいですか？");
  $("bulk-important").onclick=()=>runBulkAction(u,"mark_important","選択したメールをまとめて「重要」にします。よろしいですか？");
}
async function runBulkAction(u,action,confirmMsg){
  if(!BULK_SELECTED.size) return;
  if(!confirm(confirmMsg)) return;
  const msg=$("bulk-msg"); msg.className="err"; msg.textContent="処理中…";
  const r=await authed("/rest/v1/rpc/invoice_bulk_action",{method:"POST",body:JSON.stringify({p_email_ids:[...BULK_SELECTED],p_action:action})});
  if(!r.ok){ msg.textContent=(r.body&&r.body.message)||"失敗しました"; return; }
  const skipped=(r.body&&r.body.skipped)||[];
  msg.className="err msg-ok";
  msg.textContent=`${r.body.success_count}件完了`+(skipped.length?`／${skipped.length}件スキップ（他の人が処理中等）`:"");
  BULK_SELECTED.clear();
  await loadInboxMaster(); await loadWaitingPaymentCount(); await loadKpiCounts();
  updateMailSummaryBar();
  renderMailListOnly();
}
function mailItemHtml(m){
  const cls=["mail-item"];
  if(m.mail_status==="unread") cls.push("unread");
  if(m.mail_status==="processing") cls.push("locked");
  if(m.mail_status==="completed") cls.push("completed");
  if(m.mail_status==="archived") cls.push("notapplicable");
  if(m.duplicate_suspected) cls.push("dup");
  if(m.id===SELECTED_ID) cls.push("active");
  const preview=(m.body_text||"").replace(/\s+/g," ").trim().slice(0,60);
  const metaLeft=m.mail_status==="processing"&&m.processor?`担当：${esc(m.processor.name)}`:((m.atts&&m.atts.length)?`添付 ${m.atts.length}件`:"添付なし");
  return `<div class="${cls.join(' ')}" data-openmail="${m.id}">
    <label class="mail-checkwrap"><input type="checkbox" data-bulkcheck="${m.id}" ${BULK_SELECTED.has(m.id)?"checked":""}></label>
    <div class="mail-from">${esc(m.from_address||"—")}</div>
    <div class="mail-subject">${m.mail_kind?MAIL_KIND_LABEL[m.mail_kind]+" ":"❔ "}${m.is_important?"⭐ ":""}${esc(m.subject||"（件名なし）")}</div>
    <div class="mail-preview">${esc(preview)}</div>
    <div class="mail-meta"><span>${metaLeft}</span><span>${fmtDT(m.received_at)}</span></div>
  </div>`;
}

async function openMailDetail(u,emailId,skipHighlight){
  SELECTED_ID=emailId;
  if(!skipHighlight){
    document.querySelectorAll(".mail-item").forEach(el=>el.classList.toggle("active",el.dataset.openmail===emailId));
  }
  $("mailDetail").innerHTML='<div class="spin">読み込み中…</div>';

  // 2026-09-06修正：請求書処理の速度改善指示への対応。ensureCorpStoreCache()/ensureVendorCache()
  // （下の方で従来は別の直列await Promise.allとして呼ばれていた）は、ここで取得する
  // メール・請求書データと一切依存関係が無い（法人・店舗・取引先マスタは特定のemailIdに
  // 紐付かない共通マスタ）ため、同じPromise.allにまとめて最初から並列で走らせる。
  // 初回セッション（キャッシュが空の状態）で1往復分の待ち時間を削減できる
  // （2回目以降はensureCorpStoreCache/ensureVendorCache自体がキャッシュ済みで即返るため実害なし）
  const [mr,ar,rr,lr,ivr,cr]=await perfTimed("mail_detail_open",()=>Promise.all([
    authed(`/rest/v1/invoice_emails?id=eq.${emailId}&select=*,processor:users!invoice_emails_processing_user_id_fkey(name),completer:users!invoice_emails_completed_by_fkey(name)`),
    authed(`/rest/v1/invoice_attachments?email_id=eq.${emailId}&select=*&order=created_at`),
    authed(`/rest/v1/invoice_email_reads?email_id=eq.${emailId}&select=opened_at,reader:users(name)&order=opened_at.asc&limit=1`),
    authed(`/rest/v1/invoice_audit_logs?entity_id=eq.${emailId}&select=*,actor:users(name)&order=created_at.asc&limit=50`),
    authed(`/rest/v1/invoices?email_id=eq.${emailId}&select=*,vendor:vendors(name,vendor_bank_accounts(id,payment_method,bank_code,bank_name,branch_code,branch_name,account_type,account_number,account_holder_kana,is_current)),linked_step:hq_task_steps!linked_hq_step_id(id,title,task:hq_tasks(title,corp)),linked_step_payment:hq_task_steps!linked_hq_step_id_payment(id,title,task:hq_tasks(title,corp)),invoice_stores(store_id)&order=created_at`),
    authed(`/rest/v1/invoice_comments?email_id=eq.${emailId}&select=*,author:users(name)&order=created_at.asc`),
    ensureCorpStoreCache(),
    ensureVendorCache(),
  ]));
  if(!mr.ok||!mr.body||!mr.body[0]){ $("mailDetail").innerHTML='<div class="empty">読み込みに失敗しました</div>'; return; }
  const mail=mr.body[0];
  const atts=(ar.ok&&Array.isArray(ar.body))?ar.body:[];
  const firstRead=(rr.ok&&Array.isArray(rr.body)&&rr.body[0])?rr.body[0]:null;
  const logs=(lr.ok&&Array.isArray(lr.body))?lr.body:[];
  // C-8（ラウンド5指示書§6.1・2026-09-01）: 1メールに複数の請求書が来る場合があるため全件保持する。
  // invoiceは従来どおり「1件目（最初に処理した請求書）」を指す＝既存コードとの後方互換用エイリアス。
  // 2件目以降はSELECTED.invoicesで扱い、renderMailDetail内の「➕他の請求書」セクションで表示する
  const invoices=(ivr.ok&&Array.isArray(ivr.body))?ivr.body:[];
  const invoice=invoices[0]||null;
  const comments=(cr.ok&&Array.isArray(cr.body))?cr.body:[];
  SELECTED={mail,atts,firstRead,logs,invoice,invoices,comments};

  // 開封記録（unread→readの遷移のみ。何度呼んでも安全）
  authed("/rest/v1/rpc/invoice_record_read",{method:"POST",body:JSON.stringify({p_email_id:emailId})}).then(()=>{
    const m=MASTER_MAILS.find(x=>x.id===emailId);
    if(m&&m.mail_status==="unread"){ m.mail_status="read"; }
  });

  // ユーザー要望「今のままだとどこの法人の処理かがわからない」（2026-09-03）に対応するため、
  // 請求書情報パネルで対象法人・対象店舗を直接選べるようにする。法人・店舗一覧は
  // ほぼ変わらないため、初回だけ取得してキャッシュする（renderMailDetailは同期関数のため、
  // renderMailDetailを呼ぶ前にここで取得を終わらせておく必要がある）。
  // 取引先マスタ一覧（VENDOR_CACHE）も同じ理由で事前取得しておく（2026-09-05・取引先紐付け機能）。
  // 2026-09-06: 上のPromise.allに統合済み（このコメント箇所での再取得は不要）。

  renderMailDetail(u);

  // スマホ幅では一覧を隠して詳細だけ全画面表示にする（下スクロールしないと詳細が
  // 見えない問題への対応）。PC幅では常に左右並びのまま何もしない。
  // skipHighlight=trueのとき（モーダル経由・再描画時の復元）は既にpushNav済みか
  // 単なる再描画なので、ここでは新規クリック（skipHighlight=false）のときだけ積む
  if(isMobileWidth()){
    if(!skipHighlight) pushNav({modal:false});
    MOBILE_VIEW="detail";
    const layout=$("mailLayout"); if(layout) layout.classList.add("mobile-detail");
    window.scrollTo({top:0,behavior:"instant"});
  }
}

async function openInvoiceDetail(u,invoiceId){
  DETAIL_MODE="process";

  // ensureCorpStoreCache/ensureVendorCache（法人・店舗・取引先の共通マスタ。この

  const [,,ivr]=await perfTimed("invoice_detail_open",()=>Promise.all([

    authed(`/rest/v1/invoice_audit_logs?entity_id=eq.${inv.id}&select=*,actor:users(name)&order=created_at.asc&limit=50`),
  ]);
  const atts=(attR.ok&&Array.isArray(attR.body))?attR.body:[];
  const comments=(cmR.ok&&Array.isArray(cmR.body))?cmR.body:[];
  const logs=(logR.ok&&Array.isArray(logR.body))?logR.body:[];
  const syntheticMail={
    id:null, subject:(inv.vendor_name?inv.vendor_name+"の請求書":"アップロード請求書"),
    from_address:"（アップロード）", to_address:"", mail_kind:"invoice",
    mail_status:"standalone", processing_user_id:null, processor:null, is_important:false,

    body_html:null,
  };
  SELECTED={mail:syntheticMail,atts,firstRead:null,logs,invoice:inv,invoices:[inv],comments};
}

// 添付1件分のカード（プレビュー＋ファイル名＋開く）。メール由来／アップロード由来のどちらの
// 証憑グリッドでも共通で使う。2026-09-04新規：ZIPファイルには「📦 ZIPを展開する」ボタンを
// 追加する（指示書§5-8。ZIPの中の実際の請求書PDFを証憑として正しく紐付けるための入口処理）
function attCardHtml(a){
  const isPdf=a.mime_type==="application/pdf";
  const isImg=(a.mime_type||"").indexOf("image/")===0;
  const isZip=(a.mime_type||"").includes("zip")||/\.zip$/i.test(a.file_name||"");
  const preview=isPdf
    ? `<iframe data-attpreview="${esc(a.storage_path)}" title="${esc(a.file_name)}"></iframe>`
    : isImg
      ? `<img data-attpreview="${esc(a.storage_path)}" alt="${esc(a.file_name)}">`
      : `<div class="noprev"><span class="ico">${isZip?"📦":"📄"}</span>プレビュー非対応<br>（開いて確認してください）</div>`;
  return `<div class="attcard">
    <div class="attcard-preview">${preview}</div>
    <div class="attcard-foot">
      <span class="fname">${esc(a.file_name)}</span>
      <a data-attpath="${esc(a.storage_path)}" download="${esc(a.file_name)}" href="#" target="_blank" rel="noopener">開く</a>
    </div>
    ${isZip?(a.zip_extracted_at
      ?`<div class="meta" style="color:var(--muted);font-size:11px;padding:0 10px 8px">📦 展開済み（中のファイルはこのリストに個別に追加されています）</div>`
      :`<div style="padding:0 10px 8px"><button class="hq-btn" style="width:100%;font-size:11px;padding:6px 9px" data-zipextract="${esc(a.id)}">📦 ZIPを展開する</button></div>`)
      :""}
  </div>`;
}
// 2026-09-04新規：この請求書の対象店舗（invoice_stores）のうち、業務委託精算対象店舗を返す。
// 空配列なら通常の請求書→PL直接反映のルート。
// 2026-09-05修正：黒霧屋 新横浜のように「運営委託費の自動連携(seisan_target)は対象外だが、
// 個別経費のPL反映(seisan_pl_categories_target)だけは精算書経由」という店舗も、この経費PL連携の
// 文脈では精算書ルートに含める必要があるため、どちらかのフラグが立っていれば対象とする
// （設計書_業務委託精算書自動連携_2026-09-04.md §14）
function invoiceSeisanStores(invoice){
  if(!invoice||!Array.isArray(invoice.invoice_stores)) return [];
  const allStores=(CORP_STORE_CACHE&&CORP_STORE_CACHE.stores)||[];
  const ids=new Set(invoice.invoice_stores.map(x=>x.store_id));
  return allStores.filter(s=>ids.has(s.id)&&(s.seisan_target||s.seisan_pl_categories_target));
}
// 「現在：◯◯」バナー用の次アクション文言（工程キー→表示文言）
const STAGE_NEXT_ACTION={info:"請求情報の入力待ち",accounting:"会計・仕訳の登録待ち",pl:"PL・広告・精算の確認待ち",payment:"振込待ち",verified:"支払確認待ち"};
// 2026-09-04全面書き換え：請求書詳細UX整理指示書対応。5工程（①請求情報→②会計・仕訳→
// ③PL・広告・業務委託精算→④振込→⑤支払確認）に統一。旧「振込準備」「完了確認」（メールの
// 完了操作に依存していた）は廃止し、振込・支払確認の2段階だけにする（指示書の基本工程定義）
function invoiceWorkflowSteps(invoice,mail){
  const steps=[
    {key:"info",label:"請求情報",done:!!(invoice&&invoice.amount!=null)},
    {key:"accounting",label:"会計・仕訳",done:!!(invoice&&invoice.mf_journal_id)},
    {key:"pl",label:"PL・精算",done:!!(invoice&&invoice.mf_journal_id&&(invoice.pl_fee_reflected_at||invoice.pl_fee_excluded_at||invoice.ad_cost_reflected_at||invoice.pl_fee_seisan_synced_at))},
    {key:"payment",label:"振込",done:!!(invoice&&invoice.payment_status==="paid")},
    {key:"verified",label:"支払確認",done:!!(invoice&&invoice.payment_verified_at)},
  ];
  let currentSet=false;
  for(const s of steps){ if(!s.done&&!currentSet){ s.current=true; currentSet=true; } }
  return steps;
}
// 2026-09-05新規：ユーザー報告「振込先口座を登録する前に振込一覧へ送ってしまった。
// どこから登録し直せばいいか分からない」に対応。原因はvendor_idが未設定の請求書は、

function invoiceAiTabHtml(invoice){
  if(!invoice) return `<div class="meta" style="color:var(--muted);font-size:12px">請求情報を保存すると自動判定が行われます</div>`;
  const conf=invoice.ai_confidence||{};
  const statusLabel={auto:"✅ 自動判定済（自動処理候補）",review:"👀 要確認",error:"⚠️ エラー"}[invoice.ai_match_status]||"— 未判定";
  let html=`<div class="ai-field" style="margin-bottom:10px"><small>判定結果</small><b>${esc(statusLabel)}</b></div>`;
  if(invoice.duplicate_suspected){
    html+=`<div class="risk-card danger"><h5>🚨 重複請求の可能性</h5><p>取引先・金額・請求日などが過去の登録と一致しています。内容を確認し、重複でなければ下のボタンで解除してください。</p><button class="hq-btn" id="ai-resolve-dup" style="margin-top:6px">重複でないと確認する</button></div>`;
  }
  if(invoice.bank_account_change_detected){
    html+=`<div class="risk-card danger"><h5>⚠️ 振込先口座変更を検知</h5><p>請求書に記載の口座が、登録済みの口座と異なります。設定タブ「取引先マスタ」で承認するまで振込一覧には追加できません。</p><button class="hq-btn" id="ai-goto-bank" style="margin-top:6px">設定タブで確認する</button></div>`;
  }
  if(invoice.ai_match_reasons&&invoice.ai_match_reasons.length){
    html+=`<div class="ai-field" style="margin-bottom:10px"><small>判定理由</small>${invoice.ai_match_reasons.map(r=>esc(r)).join("・")}</div>`;
  }
  const confRows=[["取引先",conf.vendor],["法人",conf.corporation],["店舗",conf.store],["仕訳辞書",conf.account]].filter(([,v])=>v!=null);
  if(confRows.length) html+=confRows.map(([l,v])=>`<div class="conf-row"><span>${esc(l)}</span><div class="conf-bar"><span style="width:${v}%"></span></div><b>${v}%</b></div>`).join("");
  if(!invoice.duplicate_suspected&&!invoice.bank_account_change_detected&&!(invoice.ai_match_reasons&&invoice.ai_match_reasons.length)&&!confRows.length){
    html+=`<div class="meta" style="color:var(--muted);font-size:12px">まだ自動判定が実行されていません（新規作成時のみ自動実行されます）</div>`;
  }
  return html;
}
// 2026-09-05新規：invoice.vendor.vendor_bank_accountsの埋め込み結果から「現在有効な口座」を
// 1件だけ取り出す共通ヘルパー（1取引先につきis_current=trueは常に高々1件のDB制約がある）
function currentVendorAccount(invoice){
  const accs=(invoice&&invoice.vendor&&Array.isArray(invoice.vendor.vendor_bank_accounts))?invoice.vendor.vendor_bank_accounts:[];
  return accs.find(a=>a.is_current)||null;
}

function taskPanelHtml(invoice,steps){
  const doneCount=steps.filter(s=>s.done).length;
  const step=invoice&&invoice.linked_step;
  return `<h4>📌 本部タスク連携</h4>
    <div class="task-progress-num">${doneCount}/${steps.length}</div>
    ${steps.map((s,i)=>`<div class="task-step ${s.done?"done":s.current?"current":""}"><div class="icon">${s.done?"✓":i+1}</div><div><b>${esc(s.label)}</b></div></div>`).join("")}
    ${step?`<div class="meta" style="color:var(--muted);font-size:11px;margin-top:8px">${esc((step.task&&step.task.corp)||"")} ${esc((step.task&&step.task.title)||"")} ／ ${esc(step.title)}</div><a class="hq-btn" style="display:block;text-align:center;margin-top:8px;text-decoration:none" href="tasks.html" target="_blank">本部タスクを開く</a>`
      :`<div class="meta" style="color:var(--muted);font-size:11px;margin-top:8px">紐付けられた本部タスクはありません（請求情報タブから紐付けできます）</div>`}
  `;
}
function wireDetailTabs(){
  document.querySelectorAll("[data-dtab]").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".dtab").forEach(d=>d.classList.remove("active"));
    document.querySelectorAll("[data-dtab]").forEach(x=>x.classList.remove("active"));
    const el=$("dtab-"+b.dataset.dtab); if(el) el.classList.add("active");
    b.classList.add("active");
  });
}

          const ctaHtml=invoice

        // 2026-09-03新規: ユーザー要望「請求書一覧で選んだら、手順が出てきて1個ずつ処理して

        const evidenceHtml=`<div class="evidence-panel">
          <div class="ep-head"><span>📄 証憑プレビュー</span><span>${atts.length}ファイル</span></div>

            </div>

        </div>`;
        // AI判定のリスク（重複・口座変更）だけは、見落とし防止のため独立タブではなく
        // 工程カードの一番上に警告バナーとして常時表示する（参考モックアップ準拠）
        const riskBannerHtml=(invoice&&(invoice.duplicate_suspected||invoice.bank_account_change_detected))?invoiceAiTabHtml(invoice):"";
        const aiConfidenceBadge=invoice&&invoice.ai_match_status?`<span class="step-badge ${invoice.ai_match_status==="auto"?"done":"current"}">🤖 ${({auto:"自動判定済",review:"要確認",error:"エラー"})[invoice.ai_match_status]||invoice.ai_match_status}</span>`:"";

        // 2026-09-05再修正：続き23で「本部タスクの工程一覧のように進捗が分かるように」との
        // 要望を受けて追加した縦積みステッパー（wf-stepper）だが、実機で見たユーザーから

        // その後改めて「番号が消えて緑チェックになる／止まっているタスクをもっと強調してほしい」

        // （緑チェック=完了／赤枠+番号=いまここ／グレー番号=未処理）を直接適用する形にした
        const infoDone=!!(invoice&&invoice.amount!=null);

        // 2026-09-05修正：業務委託精算書自動連携の実装前は「精算対象店舗が含まれる」というだけで
        // このカードを対応完了扱いにしていたが、実際には何も登録されていなかった（本当の完了を

        // までは未完了のままにする＝直接反映と同じ基準に統一
        const plDoneForCard=!!(invoice&&(invoice.pl_fee_reflected_at||invoice.pl_fee_excluded_at||invoice.pl_fee_seisan_synced_at));
        const paymentDoneForCard=!!(invoice&&invoice.payment_verified_at);
        let currentCardKey=null;
        for(const[k,d]of[["info",infoDone],["accounting",accountingDone],["pl",plDoneForCard],["payment",paymentDoneForCard]]){ if(!d){ currentCardKey=k; break; } }

          return `<div class="step-num ${state}">${done?"✓":n}</div>`;
        };
        const stepCardClass=key=>key===currentCardKey?" current":"";
        return `<div class="detail-layout">
          ${evidenceHtml}
          <div>
            ${riskBannerHtml}

            <div class="step-card${stepCardClass("info")}" id="step-info">
              <div class="step-card-head" data-cardtoggle="info">${stepNumHtml("info",++stepNo,infoDone)}<h3 class="step-title">${isSales?"入金情報":"請求情報"}</h3>${invoice&&invoice.amount!=null?'<span class="step-badge done">✓ 対応完了</span>':'<span class="step-badge current">いまここ・要対応</span>'}${aiConfidenceBadge}<span class="step-chevron" id="chev-info">${(invoice&&invoice.amount!=null)?"▼":"▲"}</span></div>
              ${(invoice&&invoice.amount!=null)?(()=>{
                // corp:corporations(name)埋め込みが無いクエリ経由でも法人名が出るよう、
                // CORP_STORE_CACHE（常に事前ロード済み）からも引けるようにする
                const corpName=(invoice.corp&&invoice.corp.name)||((CORP_STORE_CACHE&&CORP_STORE_CACHE.corporations||[]).find(c=>c.id===invoice.corporation_id)||{}).name;
                return `<div class="step-summary" id="summary-info">${esc((invoice.vendor&&invoice.vendor.name)||invoice.vendor_name||"（請求元未入力）")}｜${yen(invoice.amount)}${invoice.due_date?"｜支払期限"+esc(fmtD(invoice.due_date)):""}${corpName?"｜"+esc(corpName):""}${Array.isArray(invoice.invoice_stores)&&invoice.invoice_stores.length?"｜"+unifiedStoreLabel(invoice):""} <button class="step-summary-edit" data-cardtoggle="info">詳細を見る▼</button></div>`;

                <div class="ai-field"><small>${isSales?"入金額":"金額"}</small><input id="iv-amount" type="number" value="${invoice&&invoice.amount!=null?invoice.amount:""}"></div>
                <div class="ai-field"><small>${isSales?"入金予定日":"支払期限"}</small><input id="iv-duedate" type="date" value="${invoice&&invoice.due_date||""}"></div>
                <div class="ai-field"><small>状態</small><select id="iv-status">${Object.entries(isSales?SALES_STATUS_LABEL:INVOICE_STATUS_LABEL).map(([k,l])=>`<option value="${k}" ${(invoice?invoice.invoice_status:"draft")===k?"selected":""}>${l}</option>`).join("")}</select></div>
                <div class="ai-field"><small>対象法人</small><select id="iv-corp"><option value="">（未設定）</option>${(CORP_STORE_CACHE&&CORP_STORE_CACHE.corporations||[]).map(c=>`<option value="${esc(c.id)}" ${invoice&&invoice.corporation_id===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>
                <div class="ai-field"><small>対象店舗（複数選択可）</small>
                  <div class="store-ms" id="iv-store-ms">

                    <div class="store-ms-panel" id="iv-store-panel" hidden></div>
                  </div>
                </div>
              </div>
              <div class="meta" style="color:var(--muted);font-size:11px;margin-top:4px">💡 対象法人・対象店舗を設定すると、「🧾請求書」一覧で法人ごとに絞り込めるようになります（未設定でも仕訳登録自体は今までどおり行えます）。</div>
              ${isSales?"":`<div class="ai-field" style="margin-top:8px"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px"><input type="checkbox" id="iv-payroll-related" ${invoice&&invoice.is_payroll_related?"checked":""}> 🧑‍💼 給与関連の請求書（人材紹介・派遣費用など）</label>

              </div>`}
              ${isSales?"":`<div class="meta" style="color:var(--muted);font-size:11px;margin-top:8px">🔗 本部タスクとの連携設定は⑤本部タスク連携カードにまとめました${invoice&&invoice.linked_step?"（設定あり）":""}。取引先マスタ・振込先口座との紐付けは④振込カードにまとめました。</div>`}
              <div class="mail-actions">
                ${atts.length?`<button id="iv-ai-fill">🤖 AIで${isSales?"入金情報":"請求書情報"}を自動入力</button>`:""}

              </div>
              <div class="err" id="iv-msg" style="margin-top:6px"></div>
              <div id="iv-ocr-extras"></div>

            <div class="step-card${stepCardClass("accounting")}" id="step-accounting">

              ${(invoice&&invoice.mf_journal_id)?`<div class="step-summary" id="summary-accounting">伝票番号: ${esc(String(invoice.mf_journal_number??"-"))} <button class="step-summary-edit" data-cardtoggle="accounting">詳細を見る▼</button></div>`:""}
              <div class="step-card-body" id="body-accounting" ${(invoice&&invoice.mf_journal_id)?"hidden":""}>
              <div class="mail-actions" style="margin-top:0">
                ${(invoice&&invoice.amount!=null)?(invoice.mf_journal_id
                  ?`<button data-journal-view="${esc(invoice.mf_journal_id)}" data-journal-tenant="${esc(invoice.mf_tenant_id||"default")}" data-journal-invoice="${esc(invoice.id)}" title="クリックすると登録した仕訳の内容を確認できます">✅ 仕訳登録済み（伝票番号: ${esc(String(invoice.mf_journal_number??"-"))}）🔍</button>`
                  :`<button id="mfj-open">🧾 仕訳を作成</button>`):`<div class="meta" style="color:var(--muted);font-size:12px">先に上の「請求情報」で金額を保存してください</div>`}

              <div class="replybox" id="mfjournalbox">
                <b style="font-size:12px">🧾 マネーフォワードへ仕訳を登録</b>

              </div>
              </div>
            </div>

            ${isSales?"":(()=>{
              const seisanStores=invoiceSeisanStores(invoice);
              // 2026-09-05修正：ユーザー報告「業務委託精算書へ反映したつもりなのに『PLに反映済み』
              // と出てややこしい」に対応。従来はpl_fee_reflected_atだけを見て「✓ PL反映済み」と
              // 表示していたが、seisanルート（業務委託精算書へ登録）はまだ実際にPLへは入っていない
              // （振込確定・次回同期を待つ状態）ため、「PL反映済み」と名乗るのは不正確だった。
              // 統合請求書一覧の「精算書」列が既に使っているinvoices.pl_fee_seisan_synced_at
              // （以前から用意されていたが今まで実際には書き込んでいなかった列）を、
              // seisan_confirm成功時にきちんと記録するよう修正し、ここでも区別する
              const plDone=!!(invoice&&(invoice.pl_fee_reflected_at||invoice.pl_fee_excluded_at||invoice.pl_fee_seisan_synced_at));
              const hasDirect=!!(invoice&&invoice.pl_fee_reflected_at), hasSeisan=!!(invoice&&invoice.pl_fee_seisan_synced_at);
              // 「現在状態は必ず一つだけ」（指示書）：優先順位を決めて1行に確定する
              let plStateHtml;
              if(!invoice||invoice.mf_journal_id==null) plStateHtml=`<span class="pl-state wait">○ 会計登録後に判断</span>`;
              else if(invoice.pl_fee_excluded_at) plStateHtml=`<span class="pl-state excluded">－ PL対象外</span>`;
              else if(hasDirect&&hasSeisan) plStateHtml=`<span class="pl-state done">✓ PL反映済み</span>　<span class="pl-state seisan">🧮 業務委託精算書へも登録済み（PL反映は振込確定後）</span>`;
              else if(hasSeisan) plStateHtml=`<span class="pl-state seisan">🧮 業務委託精算書へ登録済み（PL反映は振込確定・次回同期後）</span>`;
              else if(hasDirect) plStateHtml=`<span class="pl-state done">✓ PL反映済み</span>`;
              else if(seisanStores.length) plStateHtml=`<span class="pl-state seisan">🧮 業務委託精算対象</span>`;
              else plStateHtml=`<span class="pl-state wait">○ PL反映待ち</span>`;
              // 2026-09-05修正：業務委託精算書自動連携の実装により、対象店舗があるというだけで
              // 「対応完了」扱いにしていた従来のロジックをやめ、実際に登録（direct/seisanいずれか）
              // されるまではcardDoneにしない（plDoneのみで判定＝直接反映と同じ基準に統一）
              const cardDone=plDone;
              return `<div class="step-card${stepCardClass("pl")}" id="step-pl">

              <div class="step-card-body" id="body-pl" ${cardDone?"hidden":""}>
              <div class="ai-field" style="margin-bottom:10px"><small>現在の状態</small>${plStateHtml}</div>
              ${(()=>{
                // 2026-09-08修正：ユーザー要望「黒霧屋はPLに反映させるか、精算書に反映させるか選べて、
                // 精算書に反映しないで直でPLに反映させるようにできるようにして欲しい。請求書がトーホーに
                // なってる場合にはトーホーで支払いしてるから精算書には入れない、請求書がN styleになって
                // いたら立替払いしてるから精算書に入れる、の定義です」に対応。黒霧屋のような「使い分け」
                // 店舗（seisan_pl_categories_targetのみ）は、ユーザーが自由に両方から選べるのではなく、
                // 請求書の対象法人（invoice.corporation_id）から自動的にPL直接反映／業務委託精算書登録の
                // どちらか片方に決まる（plfeeSeisanRoute()で判定）。案内文もそれに合わせて分ける
                const corpId=invoice&&invoice.corporation_id;
                const seisanRoute=seisanStores.filter(s=>plfeeSeisanRoute(s,corpId)==="seisan");
                const directRoute=seisanStores.filter(s=>plfeeSeisanRoute(s,corpId)==="direct");
                if(!seisanRoute.length&&!directRoute.length) return "";
                return `<div class="task-link-box" style="margin-top:0;margin-bottom:12px">
                  ${seisanRoute.length?`<small>🧮 業務委託精算対象店舗：${seisanRoute.map(s=>esc(s.name)).join("・")}</small>
                  <div style="font-size:12px;color:var(--m-blue);margin-top:4px">この請求書は業務委託精算書経由でPLへ反映するルートです（請求書から直接のPL反映はできません＝二重計上防止のため選択肢から除外されます）。下の「PLへ反映しますか？」欄で自動検出された精算対象店舗分は、そのまま「業務委託精算書へ登録」できます。</div>`:""}
                  ${directRoute.length?`<small${seisanRoute.length?' style="margin-top:8px;display:block"':""}>🧮 精算対象店舗（今回はPLへ直接反映）：${directRoute.map(s=>esc(s.name)).join("・")}</small>
                  <div style="font-size:12px;color:var(--m-blue);margin-top:4px">この店舗はこの請求書の対象法人（運営元法人と同じ）では直接支払い扱いのため、業務委託精算書には登録できません（下の「PLへ反映しますか？」欄から直接PLに反映してください）。対象法人が異なる請求書（立替払い）の場合は、代わりに精算書への登録が必要になります。</div>`:""}
                </div>`;
              })()}
              ${(invoice&&invoice.amount!=null)?`<div id="adcostbox"></div>`:`<div class="meta" style="color:var(--muted);font-size:12px">先に上の「請求情報」で金額を保存してください</div>`}
              ${(invoice&&invoice.mf_journal_id)?`<div id="plfeebox"></div>`:`<div class="meta" style="color:var(--muted);font-size:12px;margin-top:8px">PLへの反映は会計・仕訳の登録後に行えます</div>`}
              </div>
            </div>`;
            })()}

            ${isSales?"":(()=>{
              const payDone=!!(invoice&&invoice.payment_verified_at);

              return `<div class="step-card${stepCardClass("payment")}" id="step-payment">
              <div class="step-card-head" data-cardtoggle="payment">${stepNumHtml("payment",++stepNo,payDone)}<h3 class="step-title">振込</h3>${payBadge}<span class="step-chevron" id="chev-payment">${payDone?"▼":"▲"}</span></div>
              ${payDone?`<div class="step-summary" id="summary-payment">${yen(invoice.amount)}｜${fmtDT(invoice.payment_verified_at)}支払確認済み <button class="step-summary-edit" data-cardtoggle="payment">詳細を見る▼</button></div>`:""}

              ${invoicePaymentTabHtml(invoice)}

  let ADCOST_STATE={};

  function adcostFindStoreByName(name){
    if(!name||!ADCOST_STATE.stores) return null;
    const norm=s=>String(s||"").replace(/\s+/g,"");
    const n=norm(name);
    return ADCOST_STATE.stores.find(s=>norm(s.name)===n)
      || ADCOST_STATE.stores.find(s=>n.includes(norm(s.name))||norm(s.name).includes(n))
      || null;
  }
  async function adcostComputeAllocation(){
    const total=Number(invoice.amount)||0;
    // a) 今組んでいる仕訳（🧾仕訳を作成）の明細行に部門（店舗）が設定されていれば、それをそのまま使う
    // （2026-08-31: 借方・貸方が別々の金額を持てるようになったため、部門が付く側＝通常は借方の金額を使う）
    const branchesWithDept=(MFJ_STATE.branches||[]).filter(b=>b.department_id&&(Number(b.debitAmount)>0||Number(b.creditAmount)>0));
    if(branchesWithDept.length){
      const rows=[];
      for(const b of branchesWithDept){
        const dept=(MFJ_STATE.departments||[]).find(d=>d.id===b.department_id);
        const store=dept?adcostFindStoreByName(dept.name):null;
        const amt=Number(b.debitAmount)>0?Number(b.debitAmount):Number(b.creditAmount)||0;
        if(store&&amt>0) rows.push({store_id:store.id,store_name:store.name,amount:Math.round(amt)});
      }
      if(rows.length){ ADCOST_STATE.rows=rows; ADCOST_STATE.source="mf_department"; return; }
    }
    // b) 前月・同媒体で反映済みの請求書があれば、その店舗比率で今回の金額を按分する
    if(ADCOST_STATE.media){
      const cur=new Date(ADCOST_STATE.yearMonth);
      const prev=new Date(cur.getFullYear(),cur.getMonth()-1,1);
      const prevYm=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}-01`;
      const r=await authed(`/rest/v1/invoices?ad_cost_reflected_at=not.is.null&ad_cost_media=eq.${encodeURIComponent(ADCOST_STATE.media)}&ad_cost_year_month=eq.${prevYm}&select=ad_cost_allocations`);
      const prevRows=(r.ok&&Array.isArray(r.body))?r.body:[];
      const sums=new Map(); let grand=0;
      for(const row of prevRows) for(const a of (row.ad_cost_allocations||[])){
        const amt=Number(a.amount)||0; grand+=amt;
        const c=sums.get(a.store_id)||{store_name:a.store_name,amount:0}; c.amount+=amt; sums.set(a.store_id,c);
      }
      if(grand>0){
        const rows=Array.from(sums,([store_id,v])=>({store_id,store_name:v.store_name,amount:Math.round(total*(v.amount/grand))}));
        const sum=rows.reduce((s,x)=>s+x.amount,0);
        if(rows.length) rows[rows.length-1].amount+=(total-sum); // 端数調整
        ADCOST_STATE.rows=rows; ADCOST_STATE.source="prev_month_ratio";
        return;
      }
    }
    // c) 参考になる情報が無ければ、店舗を手で選んでもらう1行だけ用意する
    ADCOST_STATE.rows=[{store_id:"",store_name:"",amount:total}];
    ADCOST_STATE.source="manual";
  }

      prev_month_ratio:"📊 店舗別の内訳が請求書に無かったため、前月の同媒体の店舗比率から按分しています。",

  async function adcostConfirm(){
    const msg=$("adcost-msg"); msg.className="err"; msg.textContent="";
    const media=($("adcost-media")?.value||"").trim();
    if(!media){ msg.textContent="媒体を選んでください"; return; }
    const rows=ADCOST_STATE.rows.filter(r=>r.store_id&&Number(r.amount)>0);
    if(!rows.length){ msg.textContent="店舗と金額を入力してください"; return; }
    const total=rows.reduce((s,r)=>s+Number(r.amount),0);
    const invAmt=Number(invoice.amount)||0;
    if(total!==invAmt && !confirm(`割り振り合計（${yen(total)}）が請求書合計（${yen(invAmt)}）と一致していません。このまま反映しますか？`)) return;
    $("adcost-confirm").disabled=true; msg.textContent="反映中…";
    const s=sess.get();
    const r=await fetch(SUPA_URL+"/functions/v1/ad-cost-reflect",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({
      action:"confirm", invoice_id:invoice.id, media, year_month:ADCOST_STATE.yearMonth,
      allocations:rows.map(r=>({store_id:r.store_id,store_name:r.store_name,amount:Number(r.amount)})),

      // 2026-09-04変更：新規作成時はreturn=representationにし、直後にinvoice_set_stores RPCを
      // 呼ぶための新規invoice.idをここで受け取れるようにした（従来はreturn=minimalで、
      // 新規IDが分かるのはreloadDetail()後だけだった）
      r=await authed("/rest/v1/invoices",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({...payload,email_id:emailId,intake_source:"mail"})});
    }
    if(!r.ok){
      // 2026-09-04追加：原因調査用に詳細をブラウザのコンソールへ残す（一般ユーザーには出さない）。
      // ユーザー向けメッセージも「再読み込みして試す」という具体的な次の一手を添える
      console.error("[iv-save失敗]",{mail_id:emailId,invoice_id:SELECTED.invoice&&SELECTED.invoice.id,isNew,status:r.status,body:r.body});
      msg.className="err"; msg.textContent="保存できませんでした。ページを再読み込みしてもう一度お試しください（続く場合は開発担当へご連絡ください）";
      return;
    }
    // 2026-08-27: 保存成功後にSELECTED.invoiceを更新しないまま同じ画面でもう一度保存すると、
    // SELECTED.invoiceが古い（nullの）ままPOST（新規行）が再度走り、同じメールに請求書情報が
    // 2行できてしまう不具合があったため、保存のたびに詳細を再読込してSELECTED.invoiceを最新化する
    // 2026-09-04追加：対象店舗（複数）をinvoice_set_stores RPCで保存する。invoice本体の保存
    // （上のPATCH/POST）とは別のリクエストになるが、RPC内部はDELETE+INSERT+store_idミラーを
    // 1トランザクションで行うため、少なくとも「invoice_storesだけ中途半端に更新される」ことはない
    // （指示書§16）。保存後にreloadDetail()で最新のinvoice.idを確定させてから呼ぶ
    const savedInvoiceId=(SELECTED.invoice&&SELECTED.invoice.id)||(isNew&&Array.isArray(r.body)&&r.body[0]&&r.body[0].id);
    if(savedInvoiceId){
      const sr=await authed("/rest/v1/rpc/invoice_set_stores",{method:"POST",body:JSON.stringify({p_invoice_id:savedInvoiceId,p_store_ids:[...STORE_MS_STATE.selected]})});
      if(!sr.ok) console.error("[invoice_set_stores失敗]",{invoice_id:savedInvoiceId,status:sr.status,body:sr.body});
    }
    await reloadDetail();
    const freshMsg=$("iv-msg");
    if(freshMsg){
      // 2026-09-05修正：ユーザー報告「アップロード請求書で保存しても次のタスクへ進まない」に対応。
      // 金額が未入力のまま保存すると①請求情報カードが完了扱いにならず「いまここ」バッジが
      // 消えないため、原因（金額欄が空のまま）をその場で伝える
      if(!isSales&&SELECTED.invoice&&SELECTED.invoice.amount==null){
        freshMsg.className="err";
        freshMsg.textContent="保存しましたが、金額が未入力のため次の工程へ進めません。証憑からのAI自動入力に失敗している場合があるので、上の「金額」欄に手入力してもう一度保存してください。";
      }else{
        freshMsg.className="err msg-ok"; freshMsg.textContent="保存しました";
      }
    }
    await loadWaitingPaymentCount();
    // 新規作成のときだけ自動判定を実行（会計・請求書処理の全面刷新・2026-09-03）。取引先マッチ・
    // 仕訳辞書の自動照合・重複/口座変更等のリスク判定を行い、統合請求書一覧のAI判定バッジに反映する。
    // 完了を待たずに進める（失敗しても保存自体は成功しているため、ユーザーの作業を止めない）
    if(isNew&&!isSales&&SELECTED.invoice&&SELECTED.invoice.id){
      const newId=SELECTED.invoice.id;
      // 2026-09-04追加：invoice_created（取込完了）イベントを発火。自動判定の結果、
      // リスクが何も無ければinvoice_review_completed（確認完了）も続けて発火する
      fireInvoiceEvent(newId,"invoice_created").catch(()=>{});
      autoMatchCall({invoice_id:newId}).then(({ok,body:mj})=>{
        if(ok&&mj&&mj.ai_match_status&&mj.ai_match_status!=="review"&&mj.ai_match_status!=="error"&&!mj.bank_account_change_detected&&!mj.duplicate_suspected){
          fireInvoiceEvent(newId,"invoice_review_completed").catch(()=>{});
        }
      }).catch(()=>{});
    }
  };
  // C-8: ➕他の請求書セクションの配線（2026-09-01）
  // 2026-09-01緊急修正: ここは`invoices`（複数形）ではなくSELECTED.invoicesを参照する必要があった
  // （renderMailDetail()とwireDetailActions()のスコープ違い。上のinvoice単数形と同じ原因）
  if($("iv-extra-add")) $("iv-extra-add").onclick=()=>ivOpenExtraInvoiceModal(emailId,null);
  document.querySelectorAll("[data-iv-extra-edit]").forEach(el=>el.onclick=()=>{
    const iv=(SELECTED.invoices||[]).find(x=>x.id===el.dataset.ivExtraEdit);
    ivOpenExtraInvoiceModal(emailId,iv);
  });

  if($("mfj-open")) $("mfj-open").onclick=async()=>{
    const box=$("mfjournalbox"); box.classList.toggle("open");
    if(box.classList.contains("open")) await mfjRenderInitial();
  };

  const mfjCall=mfCall; // 設定タブと共通化（2026-08-31。トップレベルのmfCall()を参照するだけ）

  // 勘定科目の検索用インデックスを構築（datalistの表示名→id の逆引き用）
  // 2026-09-08修正：ユーザー要望「請求書の仕訳入力も給与仕訳と同じフォーマットにしてほしい」に
  // 対応するため、勘定科目名だけの候補・勘定科目名→補助科目名リストのMap（選択中の勘定科目に
  // 連動して補助科目の候補を絞り込むため。payrollOpenPreview()と同じ設計）も一緒に構築する
  function mfjBuildAccountIndex(){
    const map=new Map(); // label -> {account_id, sub_account_id, account_name, sub_account_name}
    let dl="";
    const accNames=new Set();
    const subsByAccount=new Map();
    const subNamesAll=new Set();
    for(const a of (MFJ_STATE.accounts||[])){
      map.set(a.name,{account_id:a.id,sub_account_id:null,account_name:a.name,sub_account_name:null});
      dl+=`<option value="${esc(a.name)}">`;
      if(a.name) accNames.add(a.name);
      const names=[];
      for(const sa of (a.sub_accounts||[])){
        const label=`${a.name}/${sa.name}`;
        map.set(label,{account_id:a.id,sub_account_id:sa.id,account_name:a.name,sub_account_name:sa.name});
        dl+=`<option value="${esc(label)}">`;
        if(sa.name){ names.push(sa.name); subNamesAll.add(sa.name); }
      }
      if(a.name&&names.length) subsByAccount.set(a.name,names);
    }
    MFJ_STATE.accountLabelMap=map;
    MFJ_STATE.accountDatalistHtml=dl;
    MFJ_STATE.accountNameDatalistHtml=[...accNames].map(n=>`<option value="${esc(n)}">`).join("");
    MFJ_STATE.subAccountsByAccountName=subsByAccount;
    MFJ_STATE.subAccountNamesAll=[...subNamesAll];
  }
  // 選択中の勘定科目に紐づく補助科目候補（無ければ全科目横断のフォールバック）
  function mfjSubAccountOptionsHtml(accountName){
    const perAccount=MFJ_STATE.subAccountsByAccountName&&MFJ_STATE.subAccountsByAccountName.get((accountName||"").trim());
    const names=(perAccount&&perAccount.length)?perAccount:(MFJ_STATE.subAccountNamesAll||[]);
    return names.map(n=>`<option value="${esc(n)}">`).join("");
  }
  function mfjLabelOf(side){ // {account_name, sub_account_name} -> 表示名
    if(!side||!side.account_name) return "";
    return side.sub_account_name?`${side.account_name}/${side.sub_account_name}`:side.account_name;
  }

  // 会社名の表記ゆれを吸収して比較するための正規化（法人格・全角/半角スペース等を除去）
  function mfjNormCompanyName(s){
    return String(s||"").replace(/株式会社|有限会社|合同会社|（株）|（有）|\(株\)|\(有\)|御中|様/g,"").replace(/\s+/g,"").toLowerCase();
  }
  function mfjMatchTenant(addressee,tenants){
    const norm=mfjNormCompanyName(addressee);
    if(!norm) return null;
    const hits=tenants.filter(t=>{
      const tn=mfjNormCompanyName(t.label);
      return tn&&(norm.includes(tn)||tn.includes(norm));
    });
    return hits.length===1?hits[0]:null; // 複数/0件は自動選択しない（誤登録防止）
  }

  function mfjShowTenantPicker(tenants){
    const body=$("mfj-body");
    body.innerHTML=`<div class="ai-field"><small>登録先の事業者を選んでください</small>
      <div class="mail-actions" style="margin-top:6px">${tenants.map(t=>`<button data-mfjtenant="${esc(t.id)}">${esc(t.label)}</button>`).join("")}</div>
    </div>`;
    document.querySelectorAll("[data-mfjtenant]").forEach(btn=>btn.onclick=()=>mfjLoadForTenant(btn.dataset.mfjtenant,tenants));
  }

  async function mfjRenderInitial(){
    const body=$("mfj-body");
    body.innerHTML="読み込み中…（連携先の事業者を確認しています）";
    const tRes=await mfjCall("list_tenants");
    const tenants=(tRes.ok&&tRes.body.tenants)||[];
    if(tenants.length>1){
      // AI自動入力で宛先会社名が読み取れていれば、事業者ラベルと突き合わせて自動選択を試みる
      // （読み取り違いのリスクがあるため、選んだ後も画面に「自動選択」の旨と変更ボタンを必ず出す）
      const autoMatch=mfjMatchTenant(SELECTED._aiAddressee,tenants);
      if(autoMatch){ mfjLoadForTenant(autoMatch.id,tenants,SELECTED._aiAddressee); return; }
      mfjShowTenantPicker(tenants);
      return;
    }
    mfjLoadForTenant(tenants[0]?tenants[0].id:"default",tenants);
  }

  // 仕訳辞書（事業者ごとに登録した仕訳テンプレート。設定タブでも管理できる）を取得
  async function mfjFetchTemplates(tenantId){
    const r=await authed(`/rest/v1/mf_journal_templates?tenant_id=eq.${encodeURIComponent(tenantId)}&select=id,label,branches&order=label`);
    return (r.ok&&Array.isArray(r.body))?r.body:[];
  }

  async function mfjLoadForTenant(tenantId,tenants,autoMatchedFrom){
    const body=$("mfj-body");
    body.innerHTML="読み込み中…（勘定科目・過去の仕訳・仕訳辞書を確認しています）";
    const inv=SELECTED.invoice;
    const vendorName=(inv&&inv.vendor_name)||"";
    // 2026-09-06修正：請求書処理の速度改善指示（レーンP経由）への対応。
    // 従来はaccounts→suggest→list_journals→（部門が空なら）list_departmentsの4呼び出しを
    // すべて直列（1つ終わってから次を呼ぶ）で行っていた。うちsuggest/list_journals/
    // list_departmentsの3つは「同じ最大1000件のマネーフォワード仕訳履歴を取得してスキャン」
    // という同じ重い処理を3回繰り返していただけだったため、mf-journal側に新設した
    // journal_search（1回の取得・1回のスキャンでmatch/departments/taxes/resultsを
    // まとめて返す）に統合し、呼び出し回数を4→2に削減。さらに、直列にしていた本来の理由
    // 「同時に呼ぶとマネーフォワード側のトークン更新が競合することがある」は、_shared/mf.tsの
    // getValidAccessToken()に既に競合時の待機・再読込フォールバックが入っており、かつ
    // 設定タブの仕訳辞書編集（mftLoadAccountsAndDepts）では実際にaccounts/list_departmentsを
    // Promise.allで並列に呼んでいて問題が出ていない実績があるため、ここも並列化する。
    // 仕訳辞書（mf_journal_templates）取得はマネーフォワードのトークンと無関係のプレーンな
    // Supabase REST呼び出しのため、そもそも競合の心配なく並列にできる
    const [accRes,searchRes,templates]=await perfTimed("mfj_load_for_tenant",()=>Promise.all([
      mfjCall("accounts",{tenant_id:tenantId}),
      mfjCall("journal_search",{vendor_name:vendorName,tenant_id:tenantId}),
      mfjFetchTemplates(tenantId),
    ]));
    if(!accRes.ok){ body.innerHTML=`<div class="err">勘定科目の取得に失敗しました: ${esc(accRes.body.error||"")}${accRes.body.detail?"（詳細: "+esc(JSON.stringify(accRes.body.detail))+"）":""}<br><button id="mfj-retry" style="margin-top:8px">🔄 もう一度試す</button></div>`; if($("mfj-retry")) $("mfj-retry").onclick=mfjRenderInitial; return; }
    if(!searchRes.ok){ body.innerHTML=`<div class="err">過去の仕訳の取得に失敗しました: ${esc(searchRes.body.error||"")}${searchRes.body.detail?"（詳細: "+esc(JSON.stringify(searchRes.body.detail))+"）":""}<br><button id="mfj-retry" style="margin-top:8px">🔄 もう一度試す</button></div>`; if($("mfj-retry")) $("mfj-retry").onclick=mfjRenderInitial; return; }
    const tenantLabel=(tenants||[]).find(t=>t.id===tenantId)?.label||tenantId;
    // 2026-09-08追加：ユーザー要望「摘要も給料仕分けと同じく、その請求書の○月分　会社名を
    // 入れて欲しい」に対応。会計計上日（従来どおり支払期限を既定値に使う）の月を使って
    // 「○月分　会社名」を組み立てる（給与仕訳のbuildRemark()と同じ考え方）。手入力で
    // 自由に書き換えることもできる（あくまで初期値としての自動入力）
    const date=(inv&&inv.due_date)||new Date().toISOString().slice(0,10);
    const monthNum=Number((date||"").split("-")[1])||null;
    MFJ_STATE={
      tenantId, tenantLabel, tenants: tenants||[], autoMatchedFrom: autoMatchedFrom||null,
      mode:"journal", // 既定は①仕訳日記帳から選ぶ。候補が無ければ②仕訳辞書→③直接入力の順で切替
      accounts: accRes.body.accounts||[],
      departments: searchRes.body.departments||[],
      taxes: searchRes.body.taxes||[],
      journalResults: searchRes.body.results||[],
      journalKeyword: vendorName,
      templates,
      branches: [], // 確定した明細行（複数行=複合仕訳/振替伝票）
      amount: (inv&&inv.amount!=null)?inv.amount:0,
      remark: vendorName?(monthNum?`${monthNum}月分　${vendorName}`:vendorName):"",
      date,
    };
    mfjBuildAccountIndex();
    // 過去の仕訳の候補が1件も無ければ、仕訳辞書があればそちらを優先→どちらも無ければ直接入力へ
    if(!MFJ_STATE.journalResults.length) MFJ_STATE.mode=MFJ_STATE.templates.length?"dict":"manual";
    if(MFJ_STATE.mode==="manual") mfjAddBranchRow();
    mfjRenderForm();
  }

  // 2026-08-31: 借方・貸方を1行=同額のペアに固定していたのをやめ、行ごとに借方だけ・貸方だけでも
  // よい形に変更（ユーザー報告「借方2行(手数料1900+100)を貸方1行(買掛金2000)にまとめたい」に対応）。
  // マネーフォワードの公式API仕様（CRUDJournalLine）でcreditor/debitorがどちらもrequiredでない
  // ことを確認済み。貸借バランスは行ごとではなく全行の合計で見る
  function mfjAddBranchRow(){
    const isFirst=!MFJ_STATE.branches.length;
    const amt=isFirst?MFJ_STATE.amount:"";
    MFJ_STATE.branches.push({debitLabel:"",debitAmount:amt,creditLabel:"",creditAmount:amt,department_id:"",tax_id:"",credit_department_id:"",credit_tax_id:"",remark:""});
  }
  // 仕訳辞書・過去の仕訳の複数行をまとめて明細行エディタへ反映し、直接入力モードへ切り替える
  function mfjApplyBranches(branches){
    MFJ_STATE.branches=branches.length?branches:[{debitLabel:"",debitAmount:MFJ_STATE.amount||"",creditLabel:"",creditAmount:MFJ_STATE.amount||"",department_id:"",tax_id:"",credit_department_id:"",credit_tax_id:"",remark:""}];
    MFJ_STATE.mode="manual";
    mfjRenderForm();

  // 振替伝票入力の1行分。2026-09-08書き換え：ユーザー要望「会計の入力フォーマットが変わって
  // やりやすくなったので、請求書の仕訳作成も同じフォーマットにしてほしい」に対応し、給与仕訳
  // （.payroll-edit-table）と全く同じ、マネーフォワード本体の複合仕訳画面に近い表形式
  // （勘定科目・補助科目・部門・税区分・金額を借方/貸方それぞれ横並びにする）に作り替えた。
  // 借方・貸方どちらか片方だけの入力も可（空欄のまま登録すればその行はその側を持たない明細になる）
  function mfjBranchRowHtml(br,idx){
    const deptOptions=`<option value="">（指定なし）</option>`+MFJ_STATE.departments.map(d=>`<option value="${esc(d.id)}" ${br.department_id===d.id?"selected":""}>${esc(d.name)}</option>`).join("");
    const creditDeptOptions=`<option value="">（指定なし）</option>`+MFJ_STATE.departments.map(d=>`<option value="${esc(d.id)}" ${br.credit_department_id===d.id?"selected":""}>${esc(d.name)}</option>`).join("");
    const taxOptionsHtml=(selectedId,side)=>(MFJ_STATE.taxes&&MFJ_STATE.taxes.length)?`<select class="mfj-branch-tax" data-idx="${idx}" data-side="${side}">${`<option value="">（既定）</option>`+MFJ_STATE.taxes.map(t=>`<option value="${esc(t.id)}" ${selectedId===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>`:"";
    const accInput=side=>{
      const {account,sub}=splitAccLabel(side==="debit"?br.debitLabel:br.creditLabel);
      const subDlId=`mfj-subaccount-datalist-${idx}-${side}`;
      return `<div class="pet-acc-group">
        <input list="mfj-account-datalist" class="pet-acc-main mfj-branch-accmain" data-idx="${idx}" data-side="${side}" value="${esc(account)}" placeholder="${side==="debit"?"借方":"貸方"}勘定科目（空欄可）">
        <input list="${subDlId}" class="pet-acc-sub mfj-branch-accsub" data-idx="${idx}" data-side="${side}" value="${esc(sub)}" placeholder="補助科目（任意）">
        <datalist id="${subDlId}">${mfjSubAccountOptionsHtml(account)}</datalist>
      </div>`;
    };
    return `<tr class="mfj-branch-row" data-idx="${idx}">
      <td class="pet-ins"><button type="button" data-mfjins="${idx}" title="この下に行を追加">＋</button></td>
      <td>${accInput("debit")}</td>
      <td><select class="mfj-branch-dept" data-idx="${idx}">${deptOptions}</select></td>
      <td>${taxOptionsHtml(br.tax_id,"debit")}</td>
      <td><input type="number" class="pet-amt mfj-branch-debit-amount mfj-amt" data-idx="${idx}" value="${br.debitAmount??""}"></td>
      <td>${accInput("credit")}</td>
      <td><select class="mfj-branch-credit-dept" data-idx="${idx}">${creditDeptOptions}</select></td>
      <td>${taxOptionsHtml(br.credit_tax_id,"credit")}</td>
      <td><input type="number" class="pet-amt mfj-branch-credit-amount mfj-amt" data-idx="${idx}" value="${br.creditAmount??""}"></td>
      <td><input class="pet-remark mfj-branch-remark" data-idx="${idx}" value="${esc(br.remark||"")}" placeholder="行ごとの摘要（空欄なら全体の摘要を使用）"></td>
      <td class="pet-rm">${MFJ_STATE.branches.length>1?`<button data-mfjrm="${idx}" title="この行を削除">✕</button>`:""}</td>
    </tr>`;
  }

  function mfjUpdateBalance(){
    const totalDebit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.debitAmount)||0),0);
    const totalCredit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.creditAmount)||0),0);
    if($("mfj-debit-total")) $("mfj-debit-total").textContent=yen(totalDebit);
    if($("mfj-credit-total")) $("mfj-credit-total").textContent=yen(totalCredit);
    if($("mfj-diff-amt")) $("mfj-diff-amt").textContent=yen(totalDebit-totalCredit);
    if($("mfj-diff-box")) $("mfj-diff-box").className="box "+(totalDebit===totalCredit?"ok":"ng");
  }

  // 2026-09-08書き換え：勘定科目・補助科目の分離（給与仕訳と同じ方式）に伴う配線の作り直し。
  // 貸方側の部門・税区分も独立して選べるようにした（従来は借方側の部門しか選べなかった）
  function mfjWireBranchRows(){
    const combineAccLabel=(idx,side)=>{
      const row=document.querySelector(`.mfj-branch-row[data-idx="${idx}"]`);
      if(!row) return "";
      const main=row.querySelector(`.mfj-branch-accmain[data-side="${side}"]`);
      const sub=row.querySelector(`.mfj-branch-accsub[data-side="${side}"]`);
      const mainVal=(main&&main.value||"").trim(), subVal=(sub&&sub.value||"").trim();
      return subVal?`${mainVal}/${subVal}`:mainVal;
    };
    document.querySelectorAll(".mfj-branch-accmain").forEach(el=>el.oninput=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      const label=combineAccLabel(idx,side);
      if(side==="debit") MFJ_STATE.branches[idx].debitLabel=label; else MFJ_STATE.branches[idx].creditLabel=label;
      const dl=document.getElementById(`mfj-subaccount-datalist-${idx}-${side}`);
      if(dl) dl.innerHTML=mfjSubAccountOptionsHtml(el.value);
    });
    document.querySelectorAll(".mfj-branch-accsub").forEach(el=>el.oninput=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      const label=combineAccLabel(idx,side);
      if(side==="debit") MFJ_STATE.branches[idx].debitLabel=label; else MFJ_STATE.branches[idx].creditLabel=label;
    });
    document.querySelectorAll(".mfj-branch-dept").forEach(el=>el.onchange=()=>{ MFJ_STATE.branches[+el.dataset.idx].department_id=el.value; });
    document.querySelectorAll(".mfj-branch-credit-dept").forEach(el=>el.onchange=()=>{ MFJ_STATE.branches[+el.dataset.idx].credit_department_id=el.value; });
    document.querySelectorAll(".mfj-branch-tax").forEach(el=>el.onchange=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      if(side==="debit") MFJ_STATE.branches[idx].tax_id=el.value; else MFJ_STATE.branches[idx].credit_tax_id=el.value;
    });
    document.querySelectorAll(".mfj-branch-remark").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].remark=el.value; });
    document.querySelectorAll(".mfj-branch-debit-amount").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].debitAmount=el.value; mfjUpdateBalance(); });
    document.querySelectorAll(".mfj-branch-credit-amount").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].creditAmount=el.value; mfjUpdateBalance(); });
    document.querySelectorAll("[data-mfjrm]").forEach(el=>el.onclick=()=>{ MFJ_STATE.branches.splice(+el.dataset.mfjrm,1); mfjRenderForm(); });
    // 2026-09-08追加：給与仕訳と同じく、末尾だけでなく行の間にも追加できるように
    document.querySelectorAll("[data-mfjins]").forEach(el=>el.onclick=()=>{
      const idx=+el.dataset.mfjins;
      MFJ_STATE.branches.splice(idx+1,0,{debitLabel:"",debitAmount:"",creditLabel:"",creditAmount:"",department_id:"",tax_id:"",credit_department_id:"",credit_tax_id:"",remark:""});
      mfjRenderForm();
    });
  }

  async function mfjRunJournalSearch(kw){
    $("mfj-journal-results").innerHTML="検索中…";
    const r=await mfjCall("list_journals",{keyword:kw,tenant_id:MFJ_STATE.tenantId});
    MFJ_STATE.journalResults=(r.ok&&r.body.results)||[];
    MFJ_STATE.journalKeyword=kw;
    mfjRenderJournalResults();
  }
  function mfjRenderJournalResults(){
    const el=$("mfj-journal-results");
    if(!el) return;
    const rs=MFJ_STATE.journalResults;
    el.innerHTML=rs.length?rs.map((r,i)=>`<div class="ai-field" style="margin-bottom:4px"><small>${esc(r.transaction_date||"")}</small>${esc(r.summary)}<div class="mail-actions" style="margin-top:4px"><button data-mfjpick="${i}" style="font-size:12px">この仕訳を使う</button></div></div>`).join("")
      :`<div style="font-size:12px;color:var(--muted)">${MFJ_STATE.journalKeyword?"該当する過去の仕訳が見つかりませんでした":"キーワードを入力して検索してください"}</div>`;
    document.querySelectorAll("[data-mfjpick]").forEach(btn=>btn.onclick=()=>{
      const r=MFJ_STATE.journalResults[+btn.dataset.mfjpick];
      const amt=MFJ_STATE.amount||(r.template.debit&&r.template.debit.value)||(r.template.credit&&r.template.credit.value)||"";
      mfjApplyBranches([{
        debitLabel:mfjLabelOf(r.template.debit), debitAmount:r.template.debit?amt:"",
        creditLabel:mfjLabelOf(r.template.credit), creditAmount:r.template.credit?amt:"",
        department_id:(r.template.debit&&r.template.debit.department_id)||"", tax_id:(r.template.debit&&r.template.debit.tax_id)||"",
        credit_department_id:(r.template.credit&&r.template.credit.department_id)||"", credit_tax_id:(r.template.credit&&r.template.credit.tax_id)||"",
        remark:r.template.remark||"",
      }]);
    });
  }

  // 仕訳辞書（管理システム内で登録したテンプレート。1件で複数の明細行を持てる＝振替伝票まるごと保存できる）
  function mfjRenderTemplateResults(){
    const el=$("mfj-tpl-results");
    if(!el) return;
    const all=MFJ_STATE.templates||[];
    const q=(MFJ_STATE.tplSearchQuery||"").trim();
    const tpls=q?all.filter(t=>(t.label||"").includes(q)):all;
    el.innerHTML=tpls.length?tpls.map(t=>{
      const sum=(t.branches||[]).map(b=>`${mfjLabelOf(b.debit)||"?"}／${mfjLabelOf(b.credit)||"?"}`).join("、");
      return `<div class="mfj-tpl-item"><div><div class="lbl">${esc(t.label)}</div><div class="sum">${esc(sum)}（${(t.branches||[]).length}行）</div></div><button data-mfjtpluse="${esc(t.id)}" style="font-size:12px;white-space:nowrap">この仕訳辞書を使う</button></div>`;
    }).join("")
      :(q?`<div style="font-size:12px;color:var(--muted)">該当する仕訳辞書が見つかりません</div>`:`<div style="font-size:12px;color:var(--muted)">この事業者にはまだ仕訳辞書が登録されていません。「🔧 直接入力」で内容を作ってから「💾 仕訳辞書に登録」で追加できます（設定タブでも管理できます）。</div>`);
    if($("mfj-tpl-search")) $("mfj-tpl-search").oninput=()=>{ MFJ_STATE.tplSearchQuery=$("mfj-tpl-search").value; mfjRenderTemplateResults(); };
    document.querySelectorAll("[data-mfjtpluse]").forEach(btn=>btn.onclick=()=>{
      const t=MFJ_STATE.templates.find(x=>x.id===btn.dataset.mfjtpluse);
      // 古い仕訳辞書（貸借同額の共通amount形式）・新しい仕訳辞書（辺ごとにvalueを持つ形式）の両方に対応
      const branches=(t.branches||[]).map(b=>({
        debitLabel:mfjLabelOf(b.debit), debitAmount:b.debit?(b.debit.value??b.amount??MFJ_STATE.amount??""):"",
        creditLabel:mfjLabelOf(b.credit), creditAmount:b.credit?(b.credit.value??b.amount??MFJ_STATE.amount??""):"",
        department_id:b.department_id||"", tax_id:b.tax_id||"",
        credit_department_id:b.credit_department_id||"", credit_tax_id:b.credit_tax_id||"",
        remark:b.remark||"",
      }));
      mfjApplyBranches(branches);
    });
  }

  // 今組んでいる明細行を仕訳辞書として保存（次回から「📗 仕訳辞書から選ぶ」に出てくる）
  async function mfjSaveAsTemplate(){
    const label=(prompt("仕訳辞書として登録する名前を入力してください（例: 【未払金】アルバイト給与）")||"").trim();
    if(!label) return;
    const structured=[];
    for(const b of MFJ_STATE.branches){
      const debit=b.debitLabel?MFJ_STATE.accountLabelMap.get(b.debitLabel):null;
      const credit=b.creditLabel?MFJ_STATE.accountLabelMap.get(b.creditLabel):null;
      if(b.debitLabel&&!debit){ alert("借方はプルダウンの候補から選んでから登録してください"); return; }
      if(b.creditLabel&&!credit){ alert("貸方はプルダウンの候補から選んでから登録してください"); return; }
      if(!debit&&!credit) continue;
      structured.push({
        debit:debit?{...debit,value:Number(b.debitAmount)||null}:null,
        credit:credit?{...credit,value:Number(b.creditAmount)||null}:null,
        department_id:b.department_id||null, department_name:(MFJ_STATE.departments.find(d=>d.id===b.department_id)||{}).name||null,
        tax_id:b.tax_id||null, tax_name:(MFJ_STATE.taxes.find(t=>t.id===b.tax_id)||{}).name||null,
        credit_department_id:b.credit_department_id||null, credit_department_name:(MFJ_STATE.departments.find(d=>d.id===b.credit_department_id)||{}).name||null,
        credit_tax_id:b.credit_tax_id||null, credit_tax_name:(MFJ_STATE.taxes.find(t=>t.id===b.credit_tax_id)||{}).name||null,
        remark:b.remark||null,
      });
    }
    if(!structured.length){ alert("明細行がありません"); return; }
    const msg=$("mfj-msg");
    const r=await authed("/rest/v1/mf_journal_templates",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({tenant_id:MFJ_STATE.tenantId,label,branches:structured,created_by:ME.id})});
    if(!r.ok){ msg.className="err"; msg.textContent="仕訳辞書への登録に失敗しました"; return; }
    msg.className="err msg-ok"; msg.textContent=`仕訳辞書「${label}」に登録しました`;
    MFJ_STATE.templates=await mfjFetchTemplates(MFJ_STATE.tenantId);
  }

  function mfjRenderForm(){
    const body=$("mfj-body");
    const mode=MFJ_STATE.mode;
    const totalDebit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.debitAmount)||0),0);
    const totalCredit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.creditAmount)||0),0);
    body.innerHTML=`
      <datalist id="mfj-acc-datalist">${MFJ_STATE.accountDatalistHtml||""}</datalist>
      <datalist id="mfj-account-datalist">${MFJ_STATE.accountNameDatalistHtml||""}</datalist>
      <!-- 補助科目のdatalistは行・借方貸方ごとに個別（mfj-subaccount-datalist-{idx}-{side}）に
           生成している（mfjBranchRowHtml参照）。選択中の勘定科目に応じて候補を絞り込むため -->
      ${MFJ_STATE.tenants&&MFJ_STATE.tenants.length>1?`<div class="ai-field" style="margin-bottom:6px;font-size:11px;color:${MFJ_STATE.autoMatchedFrom?"var(--accent)":"var(--muted)"}">登録先: <b>${esc(MFJ_STATE.tenantLabel||"")}</b> <button id="mfj-change-tenant" style="font-size:10px">変更</button>${MFJ_STATE.autoMatchedFrom?`<br>⚠️ 宛先「${esc(MFJ_STATE.autoMatchedFrom)}」から自動選択しました。<b>本当にこの事業者で合っていますか？</b>違う場合は「変更」から選び直してください`:""}</div>`:""}
      <div class="mail-actions" style="margin-bottom:8px">
        <button data-mfjmode="journal" ${mode==="journal"?'class="primary"':""}>📖 過去の仕訳から選ぶ</button>
        <button data-mfjmode="dict" ${mode==="dict"?'class="primary"':""}>📗 仕訳辞書から選ぶ${MFJ_STATE.templates.length?`（${MFJ_STATE.templates.length}）`:""}</button>
        <button data-mfjmode="manual" ${mode==="manual"?'class="primary"':""}>🔧 直接入力</button>
      </div>
      ${mode==="journal"?`<div id="mfj-journal-picker">
        <input id="mfj-journal-search" placeholder="会社名や勘定科目名で検索" value="${esc(MFJ_STATE.journalKeyword||"")}">
        <div id="mfj-journal-results" style="margin-top:6px"></div>
      </div>`:mode==="dict"?`<div id="mfj-tpl-picker">
        <input id="mfj-tpl-search" placeholder="🔍 仕訳辞書の名前で検索" value="${esc(MFJ_STATE.tplSearchQuery||"")}" style="max-width:240px;margin-bottom:8px">
        <div id="mfj-tpl-results"></div>
      </div>`:`
      <div class="mfj-balance">
        <div class="box"><small>借方合計</small><b id="mfj-debit-total">${yen(totalDebit)}</b></div>
        <div class="box"><small>貸方合計</small><b id="mfj-credit-total">${yen(totalCredit)}</b></div>
        <div class="box ${totalDebit===totalCredit?"ok":"ng"}" id="mfj-diff-box"><small>差額</small><b id="mfj-diff-amt">${yen(totalDebit-totalCredit)}</b></div>
      </div>
      <div style="overflow-x:auto">
        <table class="mfj-edit-table">
          <thead>
            <tr><th class="pet-ins"></th><th colspan="4" class="pet-debit-head">借方</th><th colspan="4" class="pet-credit-head">貸方</th><th>摘要</th><th class="pet-rm"></th></tr>
            <tr><th></th><th>勘定科目</th><th>部門</th><th>税区分</th><th>金額</th><th>勘定科目</th><th>部門</th><th>税区分</th><th>金額</th><th></th><th></th></tr>
          </thead>
          <tbody id="mfj-branch-rows">${MFJ_STATE.branches.map((br,i)=>mfjBranchRowHtml(br,i)).join("")}</tbody>
        </table>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px">💡 各行は借方・貸方のどちらか片方だけでも登録できます（例: 借方2行に分けて、貸方は1行にまとめる）。借方合計と貸方合計さえ一致していれば登録できます</div>
      <div class="mail-actions" style="margin-top:6px">
        <button id="mfj-add-row">＋ 明細行を末尾に追加</button>
        <button id="mfj-save-template">💾 この内容を仕訳辞書に登録</button>
      </div>
      <div class="ai-grid" style="margin-top:8px">
        <div class="ai-field"><small>日付（会計計上日・自由に変更可）</small><input id="mfj-date" type="date" value="${esc(MFJ_STATE.date)}"></div>
        <div class="ai-field"><small>摘要（全体・行ごとの摘要が空の場合に使われます）</small><input id="mfj-remark" value="${esc(MFJ_STATE.remark)}"></div>
      </div>
      ${(SELECTED.atts&&SELECTED.atts.length)?`<div class="ai-field" style="margin-top:8px"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="mfj-attach-files" checked>📎 メールの添付ファイル（${SELECTED.atts.length}件）もマネーフォワードへ証憑として添付する</label></div>`:""}
      <div class="mail-actions" style="margin-top:8px">
        <button class="primary" id="mfj-confirm">👁 プレビュー・確認画面へ</button>
      </div>`}
      <div class="err" id="mfj-msg" style="margin-top:6px"></div>
    `;
    document.querySelectorAll("[data-mfjmode]").forEach(btn=>btn.onclick=()=>{
      MFJ_STATE.mode=btn.dataset.mfjmode;
      if(MFJ_STATE.mode==="manual"&&!MFJ_STATE.branches.length) mfjAddBranchRow();
      mfjRenderForm();
    });
    if($("mfj-change-tenant")) $("mfj-change-tenant").onclick=()=>mfjShowTenantPicker(MFJ_STATE.tenants);
    if(mode==="journal"){
      mfjRenderJournalResults();
      let t=null;
      $("mfj-journal-search").oninput=()=>{ clearTimeout(t); const kw=$("mfj-journal-search").value.trim(); t=setTimeout(()=>mfjRunJournalSearch(kw),350); };
      return;
    }
    if(mode==="dict"){
      mfjRenderTemplateResults();
      return;
    }
    mfjWireBranchRows();
    $("mfj-add-row").onclick=()=>{ mfjAddBranchRow(); mfjRenderForm(); };
    $("mfj-save-template").onclick=mfjSaveAsTemplate;
    $("mfj-confirm").onclick=()=>mfjOpenPreview();
  }

  // プレビュー（マネーフォワード入力画面の振替伝票プレビューと同じ見た目：借方/貸方を並べたカード＋貸借バランス）
  function mfjOpenPreview(){
    const msg=$("mfj-msg"); msg.className="err"; msg.textContent="";
    const branchesPayload=[];
    let totalDebit=0, totalCredit=0;
    for(const b of MFJ_STATE.branches){
      const debit=b.debitLabel?MFJ_STATE.accountLabelMap.get(b.debitLabel):null;
      const credit=b.creditLabel?MFJ_STATE.accountLabelMap.get(b.creditLabel):null;
      if(b.debitLabel&&!debit){ msg.textContent="借方はプルダウンの候補から選択してください（自由入力のままだと登録できません）"; return; }
      if(b.creditLabel&&!credit){ msg.textContent="貸方はプルダウンの候補から選択してください（自由入力のままだと登録できません）"; return; }
      if(!debit&&!credit) continue;
      const dAmt=debit?Number(b.debitAmount):null, cAmt=credit?Number(b.creditAmount):null;
      if(debit&&(!dAmt||dAmt<=0)){ msg.textContent="借方の金額が未入力（0円）の行があります"; return; }
      if(credit&&(!cAmt||cAmt<=0)){ msg.textContent="貸方の金額が未入力（0円）の行があります"; return; }
      if(debit) totalDebit+=dAmt; if(credit) totalCredit+=cAmt;
      branchesPayload.push({debit,debitAmount:dAmt,credit,creditAmount:cAmt,department_id:b.department_id||null,tax_id:b.tax_id||null,credit_department_id:b.credit_department_id||null,credit_tax_id:b.credit_tax_id||null,remark:b.remark||""});
    }
    if(!branchesPayload.length){ msg.textContent="明細行がありません"; return; }
    if(totalDebit!==totalCredit){ msg.textContent=`借方合計（${yen(totalDebit)}）と貸方合計（${yen(totalCredit)}）が一致していません`; return; }
    const date=$("mfj-date").value, remark=$("mfj-remark").value;
    const entries=branchesPayload.map(b=>{
      const deptName=(MFJ_STATE.departments.find(d=>d.id===b.department_id)||{}).name||"";
      return `<div class="mfj-preview-entry">
        <div class="mfj-preview-head"><div>借方</div><div>貸方</div></div>
        <div class="mfj-preview-body">
          <div class="mfj-preview-side"><div class="acc">${b.debit?esc(mfjLabelOf(b.debit)):"—"}</div><div class="sub">${esc(deptName)}</div><div class="money">${b.debit?yen(b.debitAmount):"—"}</div></div>
          <div class="mfj-preview-side"><div class="acc">${b.credit?esc(mfjLabelOf(b.credit)):"—"}</div><div class="sub"></div><div class="money">${b.credit?yen(b.creditAmount):"—"}</div></div>
        </div>
        ${b.remark?`<div class="mfj-preview-remark">${esc(b.remark)}</div>`:""}
      </div>`;
    }).join("");

    const modal=document.createElement("div");
    modal.className="modal-bg mail-shell"; modal.id="mfjPreviewModal";
    modal.innerHTML=`<div class="modal" style="max-width:820px">
      <div class="mhead"><h2>🧾 振替伝票プレビュー</h2><button class="linkbtn" id="mfjPreviewClose" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px">閉じる ×</button></div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">登録先: <b>${esc(MFJ_STATE.tenantLabel||MFJ_STATE.tenantId)}</b>　日付: <b>${esc(date)}</b>　全体の摘要: <b>${esc(remark||"（なし）")}</b></div>
      <div class="mfj-balance" style="margin:0 0 10px">
        <div class="box"><small>借方合計</small><b>${yen(totalDebit)}</b></div>
        <div class="box"><small>貸方合計</small><b>${yen(totalCredit)}</b></div>
        <div class="box ok"><small>差額</small><b>¥0</b></div>
      </div>
      ${entries}
      <div class="err" id="mfjPreviewMsg" style="margin-top:6px"></div>
      <div class="mail-actions" style="margin-top:12px">
        <button id="mfjPreviewBack">← 戻って修正</button>
        <button class="primary" id="mfjPreviewSubmit">✅ この内容で登録</button>
      </div>
    </div>`;
    document.body.appendChild(modal);
    pushNav({modal:true});
    modal.onclick=e=>{ if(e.target===modal) history.back(); };
    $("mfjPreviewClose").onclick=()=>history.back();
    $("mfjPreviewBack").onclick=()=>history.back();
    $("mfjPreviewSubmit").onclick=async()=>{
      $("mfjPreviewSubmit").disabled=true;
      const pmsg=$("mfjPreviewMsg"); pmsg.className="err"; pmsg.textContent="登録中…";
      const payload={
        invoice_id: SELECTED.invoice.id,
        tenant_id: MFJ_STATE.tenantId,
        branches: branchesPayload.map(b=>({
          debit:b.debit?{account_id:b.debit.account_id,sub_account_id:b.debit.sub_account_id||undefined,value:b.debitAmount}:undefined,
          credit:b.credit?{account_id:b.credit.account_id,sub_account_id:b.credit.sub_account_id||undefined,value:b.creditAmount}:undefined,
          department_id:b.department_id||null, tax_id:b.tax_id||null,
          credit_department_id:b.credit_department_id||null, credit_tax_id:b.credit_tax_id||null,
          remark:b.remark||undefined,
        })),
        transaction_date: date,
        remark,
        linked_hq_step_id: LINKED_HQ_STEP?LINKED_HQ_STEP.id:null, // 保存前でも画面上の選択を優先させる（DB保存漏れ対策）
        attach_files: $("mfj-attach-files")?$("mfj-attach-files").checked:false,
        // PL連携対象科目かどうかの判定用（手数料等→PL自動反映・ラウンド5指示書§6.1）。MF送信には使わない
        debit_account_names: branchesPayload.filter(b=>b.debit).map(b=>mfjLabelOf(b.debit)),
      };
      const {ok,body:j}=await perfTimed("mfj_journal_create",()=>mfjCall("create",payload));
      if(!ok){ pmsg.textContent=j.error||"登録に失敗しました"; $("mfjPreviewSubmit").disabled=false; return; }
      pmsg.className="err msg-ok";
      pmsg.textContent=`登録しました（伝票番号: ${j.journal_number??"-"}）`
        +(j.voucher_attached?`。添付ファイルも${j.voucher_attached}件添付しました`:j.voucher_error?`（添付: ${j.voucher_error}）`:"")
        +(LINKED_HQ_STEP?(j.hq_step_completed?"。紐付けた本部タスクの工程も完了にしました":j.hq_step_error?`（本部タスクの自動完了には失敗: ${j.hq_step_error}）`:""):"")
        +"。画面を更新します…";
      setTimeout(()=>{ history.back(); reloadDetail(); },900);
    };
  }

  // ダウンロードリンク＋パスワード式などメールに直接添付がない請求書を、ダウンロード後に
  // 手動でアップロードしてこのメールへ紐付ける（ファイルはユーザー自身のJWTでstorageへ直接
  // アップロードし、invoice_attach_manual_file RPCでメタデータ登録＋監査ログに記録）
  // 2026-09-04新規：ZIP添付の展開ボタン（指示書§5-8）。展開後は同じ画面を再読込し、
  // 個別ファイルとして追加された証憑が一覧に増える（それ以降の「請求書として確定」判断は
  // 既存のAI自動入力＋C-8「➕他の請求書」機能に委ねる＝ここでは会計処理を一切行わない）
  document.querySelectorAll("[data-zipextract]").forEach(el=>el.onclick=async()=>{
    el.disabled=true; el.textContent="展開中…";
    const s=sess.get();
    const r=await fetch(SUPA_URL+"/functions/v1/invoice-zip-extract",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({attachment_id:el.dataset.zipextract})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.success){ alert(j.error||"ZIPの展開に失敗しました"); el.disabled=false; el.textContent="📦 ZIPを展開する"; return; }
    const skippedNote=(j.skipped&&j.skipped.length)?`（${j.skipped.length}件はPDF・画像以外のためスキップしました）`:"";
    alert(`${j.extracted.length}件のファイルを取り出しました${skippedNote}。内容を確認し、必要なら「🤖AIで自動入力」または「➕他の請求書」から請求書として追加してください。`);
    await reloadDetail();
  });
  if($("manual-att-drop")){
    const drop=$("manual-att-drop");
    ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background="var(--m-bg,#f4f1eb)"; drop.style.borderColor="var(--accent)"; }));
    ["dragleave","dragend"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background=""; drop.style.borderColor=""; }));
    drop.addEventListener("drop",e=>{
      e.preventDefault(); drop.style.background=""; drop.style.borderColor="";
      const f=e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f) $("manual-att-file").files=e.dataTransfer.files;
    });
  }
  $("manual-att-upload").onclick=async()=>{
    // 2026-09-05修正：ユーザー報告「PDFを選択して追加すると『エラー: アップロードに失敗しました』
    // としか出ず、本当の原因が分からない」に対応。
    // 従来はSupabase StorageへのアップロードをsessionのアクセストークンでR生fetchしており、
    // ①authed()が持つ「トークン期限切れ時（401 or 400+InvalidJWT）に自動でリフレッシュして
    // 再試行する」仕組みが効いていなかった（他のAPI呼び出しは全てauthed()経由で自動リフレッシュ
    // されるため、この画面を開いたまま長時間経つとこのアップロードだけが401で落ちる、という
    // 再現しにくい不具合になっていた可能性が高い）②失敗時にSupabaseから返ってきた実際の
    // ステータスコード・エラー内容を握りつぶし「アップロードに失敗しました」で固定していたため、
    // 本当の原因（RLS拒否／トークン切れ／サイズ超過等）が全く分からなかった。
    // authed()経由に変更して自動リフレッシュを効かせ、失敗時は実際のstatus/bodyをコンソールに
    // 残した上で、画面にも詳細を表示するようにする
    const msg=$("manual-att-msg");
    const btn=$("manual-att-upload");
    try{
      const f=$("manual-att-file").files[0];
      if(!f){ msg.className="err"; msg.textContent="ファイルを選択してください"; return; }
      btn.disabled=true; msg.className="err"; msg.textContent="アップロード中…";
      const buf=await f.arrayBuffer();
      const hashBuf=await crypto.subtle.digest("SHA-256",buf);
      const hash=Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,"0")).join("");
      const ext=(f.name.split(".").pop()||"").toLowerCase().replace(/[^a-z0-9]/g,"");
      // 2026-09-04: 共通invoice詳細への統合。メールが実在しない（アップロード等）場合は
      // invoice.idを使ったパス・紐付けにする（emailIdはnull）
      const path=emailId?`${emailId}/manual_${Date.now()}${ext?"."+ext:""}`:`standalone/${invoice.id}/manual_${Date.now()}${ext?"."+ext:""}`;
      console.log("[証憑アップロード] 開始",{bucket:BUCKET,path,name:f.name,type:f.type,size:f.size});
      const upRes=await authed(`/storage/v1/object/${BUCKET}/${path}`,{
        method:"POST", isBinary:true, headers:{"Content-Type":f.type||"application/octet-stream"}, body:buf,
      });
      console.log("[証憑アップロード] Storage応答",{status:upRes.status,ok:upRes.ok,body:upRes.body});
      if(!upRes.ok){
        const detail=(upRes.body&&(upRes.body.message||upRes.body.error))||`status ${upRes.status}`;
        throw new Error(`Storageへの保存に失敗しました（${detail}）`);
      }
      const r=await authed("/rest/v1/rpc/invoice_attach_manual_file",{method:"POST",body:JSON.stringify({
        p_email_id:emailId||null, p_invoice_id:emailId?null:invoice.id, p_file_name:f.name, p_mime_type:f.type||null, p_storage_path:path, p_file_hash:hash, p_size_bytes:f.size
      })});
      console.log("[証憑アップロード] invoice_attach_manual_file応答",{status:r.status,ok:r.ok,body:r.body});
      if(!r.ok) throw new Error(`証憑の記録に失敗しました（${(r.body&&(r.body.message||r.body.error))||`status ${r.status}`}）`);
      msg.className="err msg-ok"; msg.textContent="追加しました";
      await reloadDetail();
    }catch(e){
      console.error("[証憑アップロード] 例外",e);
      msg.className="err"; msg.textContent="エラー: "+(e&&e.message?e.message:String(e));
    }finally{
      btn.disabled=false;
    }
  };

  if($("comment-add")) $("comment-add").onclick=async()=>{
    const body=$("comment-body").value.trim();
    const msg=$("comment-msg");
    if(!body){ msg.textContent="コメントを入力してください"; return; }
    $("comment-add").disabled=true; msg.className="err"; msg.textContent="追加中…";
    const r=await authed("/rest/v1/rpc/invoice_add_comment",{method:"POST",body:JSON.stringify({p_email_id:emailId||null,p_invoice_id:emailId?null:(invoice&&invoice.id),p_body:body})});
    if(!r.ok){ msg.textContent=(r.body&&r.body.message)||"追加できませんでした"; $("comment-add").disabled=false; return; }
    await reloadDetail();
  };

  // 2026-09-04: 返信機能はメールが実在する場合のみ（isStandalone＝アップロード等では
  // #reply-openなどのDOM自体がrenderMailDetail側で出力されないため、ここもガードする）
  if($("reply-open")) $("reply-open").onclick=()=>{ $("replybox").classList.toggle("open"); };
  if($("reply-confirm")) $("reply-confirm").onclick=()=>{
    const body=$("reply-body").value.trim();
    if(!body){ $("reply-msg").textContent="本文を入力してください"; return; }
    $("reply-preview").textContent=body;
    $("replyconfirm").style.display="block";
  };
  if($("reply-cancel")) $("reply-cancel").onclick=()=>{ $("replyconfirm").style.display="none"; };
  if($("reply-send")) $("reply-send").onclick=async()=>{
    $("reply-send").disabled=true; $("reply-msg").textContent="送信中…";
    const body=$("reply-body").value.trim();
    const qr=await authed("/rest/v1/rpc/invoice_queue_reply",{method:"POST",body:JSON.stringify({p_email_id:emailId,p_body:body})});
    if(!qr.ok){ $("reply-msg").textContent=(qr.body&&qr.body.message)||"送信予約に失敗しました"; $("reply-send").disabled=false; return; }
    const outboxId=qr.body;
    const s=sess.get();
    const sr=await perfTimed("invoice_send",()=>fetch(SUPA_URL+"/functions/v1/invoice-send",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({outbox_id:outboxId})}));
    const sj=await sr.json().catch(()=>({}));
    $("reply-msg").className="err msg-ok";
    $("reply-msg").textContent=(sr.ok&&sj.success)?"送信しました":"送信予約は完了しました。数分以内に自動で再送されます。";
    await reloadDetail();
  };
  wireJournalViewButtons(); // 2026-09-03: 「✅仕訳登録済み」をクリックすると内容を確認できるように
}

   2026-08-25 Phase1.6: mail_kind別（invoice/sales）に共通ロジックを流用できるようパラメータ化
   ============================================================ */
let LIST_KIND="invoice"; // invoice | sales（今どちらの一覧タブを描画中か）
// 2026-08-26 C-6: primarySource="invoice_emails"のkindは、invoicesテーブルへの保存(💾)が
// まだでも「種類を選んだ時点」で一覧に出す（未入力行はvendor_name等がnullのまま表示）。
// invoiceは既存どおりinvoicesテーブル起点（登録済みのみ表示）を維持＝851件中850件が未保存の
// 現状で挙動を変えると請求書一覧の意味が激変してしまうため、売上のみ変更する
const LIST_KIND_CONFIG={
  invoice:{statusLabel:INVOICE_STATUS_LABEL,vendorLabel:"請求元",numberLabel:"請求番号",amountLabel:"金額",dateLabel:"期限",searchPlaceholder:"🔎 請求元・番号・件名",emptyLabel:"該当する請求書はありません",primarySource:"invoices"},
  sales:{statusLabel:SALES_STATUS_LABEL,vendorLabel:"入金元",numberLabel:"明細番号",amountLabel:"入金額",dateLabel:"入金予定日",searchPlaceholder:"🔎 入金元・明細番号・件名",emptyLabel:"種類が「売上」のメールはありません",primarySource:"invoice_emails"},
};
function dueBadgeHtml(row){
  const label=fmtD(row.due_date);
  if(!row.due_date||["paid","cancelled"].includes(row.invoice_status)) return esc(label);
  const today=new Date(); today.setHours(0,0,0,0);
  const due=new Date(row.due_date+"T00:00:00");
  const diffDays=Math.round((due-today)/86400000);
  if(diffDays<0) return `<span class="due-badge overdue">⚠️ ${esc(label)}（超過）</span>`;
  if(diffDays<=7) return `<span class="due-badge soon">${esc(label)}（あと${diffDays}日）</span>`;
  return esc(label);
}
function filteredSortedInvoiceRows(){
  let list=IV_ROWS;
  if(IV_STATUS) list=list.filter(r=>r.invoice_status===IV_STATUS);
  if(IV_AMOUNT_MIN!=="") list=list.filter(r=>r.amount!=null&&r.amount>=+IV_AMOUNT_MIN);
  if(IV_AMOUNT_MAX!=="") list=list.filter(r=>r.amount!=null&&r.amount<=+IV_AMOUNT_MAX);
  if(IV_DUE_FROM) list=list.filter(r=>r.due_date&&r.due_date>=IV_DUE_FROM);
  if(IV_DUE_TO) list=list.filter(r=>r.due_date&&r.due_date<=IV_DUE_TO);
  if(IV_SEARCH_Q.trim()){
    const q=IV_SEARCH_Q.trim().toLowerCase();
    list=list.filter(r=>(r.vendor_name||"").toLowerCase().includes(q)
      ||(r.invoice_number||"").toLowerCase().includes(q)
      ||(r.email&&r.email.subject||"").toLowerCase().includes(q)
      ||(r.email&&r.email.from_address||"").toLowerCase().includes(q));
  }
  if(IV_SORT_COL){
    // amountはPostgRESTがnumericを文字列で返す場合があるため数値化してから比較
    const norm=v=>{ if(v==null) return null; return IV_SORT_COL==="amount"?Number(v):v; };
    list=[...list].sort((a,b)=>{
      const av=norm(a[IV_SORT_COL]), bv=norm(b[IV_SORT_COL]);
      if(av==null&&bv==null) return 0;
      if(av==null) return 1; // nullは常に末尾
      if(bv==null) return -1;
      if(av<bv) return IV_SORT_DIR==="asc"?-1:1;
      if(av>bv) return IV_SORT_DIR==="asc"?1:-1;
      return 0;
    });
  }
  return list;
}
function invoiceListBodyHtml(){
  const cfg=LIST_KIND_CONFIG[LIST_KIND];
  const list=filteredSortedInvoiceRows();
  const arrow=col=>IV_SORT_COL===col?(IV_SORT_DIR==="asc"?" ▲":" ▼"):"";
  return `<table class="invoice-table">
    <thead><tr>
      <th>${cfg.vendorLabel}</th><th>${cfg.numberLabel}</th>
      <th data-sort="amount">${cfg.amountLabel}${arrow("amount")}</th>
      <th data-sort="due_date">${cfg.dateLabel}${arrow("due_date")}</th>
      <th>担当</th><th>状態</th>
    </tr></thead>
    <tbody>
      ${list.map(row=>`<tr data-openmail="${row.email_id}">
        <td><b>${esc(row.vendor_name||(row.email&&row.email.from_address)||"—")}</b></td>
        <td>${esc(row.invoice_number||"—")}</td>
        <td>${yen(row.amount)}</td>
        <td>${dueBadgeHtml(row)}</td>
        <td>${esc(row.email&&row.email.processor&&row.email.processor.name||"—")}</td>
        <td><span class="invoice-status ${INVOICE_STATUS_CLASS[row.invoice_status]||'gray'}">${cfg.statusLabel[row.invoice_status]||row.invoice_status}</span>${row.mf_journal_id?' <span class="hq-pill green" style="margin-left:4px" title="会計（マネーフォワード）に仕訳登録済み">💰会計</span>':''}${row.pl_fee_reflected_at?' <span class="hq-pill green" style="margin-left:4px" title="損益（PL）に反映済み">📊PL</span>':''}</td>
      </tr>`).join("")||`<tr><td colspan="6">${cfg.emptyLabel}</td></tr>`}
    </tbody>
  </table>`;
}
function wireInvoiceListTable(u){
  document.querySelectorAll("[data-openmail]").forEach(el=>el.onclick=()=>{ DETAIL_MODE="process"; openMailDetailModal(u,el.dataset.openmail); });
  document.querySelectorAll("[data-sort]").forEach(el=>el.onclick=()=>{
    const col=el.dataset.sort;
    if(IV_SORT_COL===col) IV_SORT_DIR=IV_SORT_DIR==="asc"?"desc":"asc";
    else { IV_SORT_COL=col; IV_SORT_DIR="asc"; }
    $("ivTableWrap").innerHTML=invoiceListBodyHtml();
    wireInvoiceListTable(u);
  });
}
