<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N-Style Portal UI Prototype</title>
<style>
  :root{
    --bg:#f4f1eb;
    --panel:#ffffff;
    --ink:#231f1a;
    --muted:#7d756d;
    --line:#e4ddd4;
    --nav:#211d18;
    --nav2:#2e2923;
    --accent:#c94728;
    --accent-soft:#fce9e3;
    --green:#2f8f63;
    --green-soft:#e7f5ed;
    --amber:#b77b13;
    --amber-soft:#fff3d8;
    --blue:#2f6fb7;
    --blue-soft:#e8f0fb;
    --shadow:0 8px 28px rgba(35,31,26,.08);
    --radius:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
  button,input{font:inherit}
  .app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
  .sidebar{background:var(--nav);color:#fff;padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;gap:12px;align-items:center;padding:4px 4px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:18px}
  .brand-badge{width:42px;height:42px;border-radius:12px;background:#f0c24f;display:grid;place-items:center;font-size:22px}
  .brand strong{display:block;font-size:18px}.brand small{color:#bdb6ad}
  .section-title{font-size:11px;color:#8f887f;text-transform:uppercase;letter-spacing:.12em;margin:22px 10px 8px}
  .nav-item,.nav-group-head{width:100%;border:0;background:transparent;color:#ddd6cf;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:10px;cursor:pointer}
  .nav-item:hover,.nav-group-head:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:#3a342e;color:#fff;font-weight:700}
  .nav-item .count{margin-left:auto;background:#c94728;color:#fff;border-radius:99px;padding:2px 7px;font-size:11px}
  .nav-group-head{font-weight:700;color:#fff}
  .chev{margin-left:auto;transition:.2s}.nav-group.open .chev{transform:rotate(90deg)}
  .subnav{display:none;padding:2px 0 6px 14px}.nav-group.open .subnav{display:block}
  .subnav .nav-item{font-size:14px;padding:9px 10px}
  .userbox{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;color:#cfc7bd}
  .main{min-width:0}
  .topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}
  .topbar h1{font-size:22px;margin:0}.topbar .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .top-actions{display:flex;gap:10px;align-items:center}
  .search{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;min-width:320px}
  .iconbtn,.modebtn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;cursor:pointer}
  .content{padding:26px 30px 46px;max-width:1500px;margin:0 auto}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .metric{padding:18px}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:32px;font-weight:800;margin-top:8px}
  .pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:700}
  .p-green{background:var(--green-soft);color:var(--green)}.p-red{background:var(--accent-soft);color:var(--accent)}.p-amber{background:var(--amber-soft);color:var(--amber)}.p-blue{background:var(--blue-soft);color:var(--blue)}
  .two{display:grid;grid-template-columns:1.5fr .9fr;gap:16px;margin-top:16px}
  .card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .card-body{padding:20px}
  .chart{height:280px;display:flex;align-items:flex-end;gap:18px;padding:20px 10px 10px;border-bottom:1px dashed var(--line)}
  .bar{flex:1;background:linear-gradient(#cf4d2f,#e99b87);border-radius:10px 10px 0 0;min-width:24px;position:relative}
  .bar span{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}
  .todo{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.todo:last-child{border:0}
  .todo .dot{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center}
  .todo b{font-size:14px}.todo p{margin:3px 0 0;color:var(--muted);font-size:12px}
  .page-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}
  .page-title h2{margin:0;font-size:28px}.page-title p{margin:6px 0 0;color:var(--muted)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .tablewrap{overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{background:#faf8f5;color:#6a625b;font-size:12px}
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}
  .field textarea{min-height:110px;resize:vertical}
  .quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .quick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px;text-align:left;cursor:pointer}
  .quick button:hover{border-color:#cfc5ba;transform:translateY(-1px)}
  .quick strong{display:block;font-size:16px}.quick small{color:var(--muted)}
  .mobilebar{display:none}
  @media(max-width:1050px){
    .app{grid-template-columns:88px 1fr}.sidebar{padding:18px 10px}.brand .txt,.section-title,.nav-item span.label,.nav-group-head span.label,.userbox{display:none}.brand{justify-content:center}.nav-item,.nav-group-head{justify-content:center}.subnav{padding-left:0}.search{min-width:180px}.grid4{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:760px){
    .app{display:block}.sidebar{display:none}.topbar{padding:0 16px;height:68px}.search{display:none}.content{padding:18px 14px 88px}.grid4,.two,.form-grid,.quick{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:8px}.mobilebar button{border:0;background:transparent;font-size:12px;color:#655d55}
  }


/* ===== HQ TASK MODULE (scoped) ===== */
.hq-shell{--hq-bg:#f4f1eb;--hq-panel:#fff;--hq-ink:#231f1a;--hq-muted:#7d756d;--hq-line:#e4ddd4;--hq-red:#c93f2b;--hq-redsoft:#fde9e4;--hq-green:#2f8f63;--hq-greensoft:#e8f5ee;--hq-amber:#b77b13;--hq-ambersoft:#fff3d8;--hq-blue:#2f6fb7;--hq-bluesoft:#e8f0fb;--hq-shadow:0 8px 24px rgba(35,31,26,.06);color:var(--hq-ink)}
.hq-shell *{box-sizing:border-box}
.hq-shell button,.hq-shell input,.hq-shell select,.hq-shell textarea{font:inherit}
.hq-shell button{cursor:pointer}
.hq-card{background:#fff;border:1px solid var(--hq-line);border-radius:16px;box-shadow:var(--hq-shadow)}
.hq-btn{border:1px solid var(--hq-line);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer}
.hq-btn.primary{background:#c94728;border-color:#c94728;color:#fff}
.hq-btn.green{background:var(--hq-green);border-color:var(--hq-green);color:#fff}
.hq-btn:disabled{opacity:.45;cursor:not-allowed}
.hq-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.hq-metric{padding:18px;min-width:0}
.hq-metric .l{font-size:13px;color:var(--hq-muted)}
.hq-metric .v{font-size:32px;font-weight:900;margin-top:7px}
.hq-metric .s{font-size:12px;color:var(--hq-muted);margin-top:4px}
.hq-toolbar{margin-top:16px;padding:16px}
.hq-toolbar-top{display:grid;grid-template-columns:minmax(260px,1fr) auto auto;gap:10px;align-items:center}
.hq-search{width:100%;border:1px solid var(--hq-line);border-radius:10px;padding:11px 13px;background:#fff}
.hq-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hq-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hq-chip{border:1px solid var(--hq-line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer;color:#655d55}
.hq-chip.active{background:#211d18;color:#fff;border-color:#211d18}
.hq-views{display:flex;border:1px solid var(--hq-line);border-radius:12px;overflow:hidden;white-space:nowrap}
.hq-views button{border:0;background:#fff;padding:10px 12px;cursor:pointer}
.hq-views button.active{background:#211d18;color:#fff}
.hq-area{margin-top:16px}
.hq-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hq-colhead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}
.hq-count{font-size:12px;color:var(--hq-muted)}
.hq-task{padding:15px;margin-bottom:12px;transition:.15s;cursor:pointer;overflow:hidden}
.hq-task:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(35,31,26,.09)}
.hq-task.overdue{border-color:#e49a8c;box-shadow:0 0 0 1px #e49a8c inset}
.hq-badges{display:flex;gap:6px;flex-wrap:wrap}
.hq-pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.hq-pill.red{background:var(--hq-redsoft);color:var(--hq-red)}
.hq-pill.amber{background:var(--hq-ambersoft);color:var(--hq-amber)}
.hq-pill.green{background:var(--hq-greensoft);color:var(--hq-green)}
.hq-pill.blue{background:var(--hq-bluesoft);color:var(--hq-blue)}
.hq-pill.gray{background:#f2efeb;color:#736b63}
.hq-task h3{margin:10px 0 6px;font-size:16px;overflow-wrap:anywhere}
.hq-task p{margin:4px 0;font-size:13px;color:#655d55;line-height:1.55}
.hq-important{color:var(--hq-red);font-weight:800}
.hq-foot{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--hq-muted)}
.hq-list,.hq-calendar{display:none}
.hq-listhead,.hq-listrow{display:grid;grid-template-columns:minmax(220px,2fr) .8fr .8fr .8fr .9fr .7fr;gap:10px;align-items:center}
.hq-listhead{padding:0 14px 8px;color:var(--hq-muted);font-size:12px}
.hq-listrow{background:#fff;padding:14px;border-top:1px solid var(--hq-line);cursor:pointer}
.hq-calendargrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.hq-day{min-height:128px;background:#fff;border:1px solid var(--hq-line);border-radius:12px;padding:10px;overflow:hidden}
.hq-day.today{box-shadow:0 0 0 2px #c94728 inset}
.hq-date{font-size:12px;color:var(--hq-muted);margin-bottom:8px}
.hq-ctask{font-size:11px;padding:7px 8px;border-radius:8px;margin-bottom:6px;background:#f7f3ee;cursor:pointer;overflow-wrap:anywhere}
.hq-ctask.red{background:var(--hq-redsoft);color:#9f2f20}
.hq-ctask.blue{background:var(--hq-bluesoft);color:#245b94}
.hq-ctask.green{background:var(--hq-greensoft);color:#246d4d}
.hq-hidden{display:none!important}
.hq-hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:16px}
.hq-pad{padding:20px}
.hq-title{font-size:26px;font-weight:900;margin:12px 0 8px;overflow-wrap:anywhere}
.hq-desc{color:#655d55;line-height:1.7}
.hq-progress{height:10px;background:#eee8e0;border-radius:999px;overflow:hidden;margin:12px 0 6px}
.hq-progress span{display:block;height:100%;background:#c94728}
.hq-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hq-mini{border:1px solid var(--hq-line);border-radius:12px;padding:13px;min-width:0}
.hq-mini small{display:block;color:var(--hq-muted);margin-bottom:4px}
.hq-mini b{font-size:16px}
.hq-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:16px;margin-top:16px}
.hq-head{padding:16px 18px;border-bottom:1px solid var(--hq-line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.hq-body{padding:18px}
.hq-process{border:1px solid var(--hq-line);border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fff}
.hq-process.current{border-color:#e7a093;box-shadow:0 0 0 1px #e7a093 inset}
.hq-process.completed{border-color:#b9ddca;background:#fbfefc}
.hq-process-head{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px;cursor:pointer}
.hq-num{width:34px;height:34px;border-radius:10px;background:#f4efe9;display:grid;place-items:center;font-weight:900}
.hq-process.current .hq-num{background:var(--hq-redsoft);color:var(--hq-red)}
.hq-process.completed .hq-num{background:var(--hq-greensoft);color:var(--hq-green)}
.hq-process-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:12px;color:var(--hq-muted)}
.hq-process-body{display:none;padding:0 14px 14px}
.hq-process.open .hq-process-body{display:block}
.hq-ownerline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin:12px 0}
.hq-fieldbox{border:1px solid var(--hq-line);border-radius:10px;padding:10px;background:#faf8f5}
.hq-fieldbox small{display:block;color:var(--hq-muted);font-size:11px;margin-bottom:5px}
.hq-fieldbox select,.hq-fieldbox input{width:100%;border:0;background:transparent;outline:none;font-weight:700;min-width:0}
.hq-checklist{margin-top:12px;border-top:1px solid var(--hq-line);padding-top:10px}
.hq-checkitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee8e0}
.hq-checkitem input{width:18px;height:18px}
.hq-resources{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.hq-resource{border:1px solid var(--hq-line);border-radius:12px;padding:12px;background:#faf8f5;min-width:0}
.hq-resource b{display:block;font-size:13px}
.hq-resource small{color:var(--hq-muted);overflow-wrap:anywhere}
.hq-proc-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
.hq-completebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;border:1px solid var(--hq-line);border-radius:14px;background:#fff}
.hq-audit{margin-top:18px}
.hq-activity{font-size:12px;color:var(--hq-muted)}
.hq-activity-row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:9px 0;border-bottom:1px solid var(--hq-line)}
.hq-dot{width:9px;height:9px;border-radius:50%;background:#cfc6bc;margin-top:5px}
.hq-dot.green{background:var(--hq-green)}
.hq-template{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.hq-form-card{padding:18px}
.hq-field{margin-bottom:14px}
.hq-field label{display:block;font-size:12px;color:var(--hq-muted);font-weight:700;margin-bottom:6px}
.hq-field input,.hq-field textarea,.hq-field select{width:100%;border:1px solid var(--hq-line);border-radius:10px;padding:10px;background:#fff;min-width:0}
.hq-field textarea{min-height:82px}
.hq-step-block{border:1px solid var(--hq-line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}
.hq-step-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.hq-checkbuilder .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-bottom:8px}
.hq-addrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.hq-addrow button{border:1px solid var(--hq-line);background:#fff;border-radius:9px;padding:9px;font-size:12px}
.hq-preview{position:sticky;top:94px;height:max-content}
.hq-preview .pstep{border-left:3px solid #ddd2c7;padding:8px 0 8px 12px;margin:8px 0}
.hq-preview .pstep.current{border-left-color:#c94728}
.hq-tablewrap{overflow:auto}
.hq-table{width:100%;border-collapse:collapse}
.hq-table th,.hq-table td{padding:12px 14px;border-bottom:1px solid var(--hq-line);text-align:left;font-size:13px;white-space:nowrap}
.hq-table th{background:#faf8f5;color:var(--hq-muted)}
.hq-modal{position:fixed;inset:0;background:#14110e66;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.hq-modal.open{display:flex}
.hq-modalbox{width:min(720px,96vw);background:#fff;border-radius:18px;box-shadow:0 30px 100px #0004;max-height:90vh;overflow:auto}
.hq-modalhead{padding:16px 18px;border-bottom:1px solid var(--hq-line);display:flex;justify-content:space-between}
.hq-modalbody{padding:18px}
#printSheet{display:none}
@media print{
  body *{visibility:hidden!important}
  #printSheet,#printSheet *{visibility:visible!important}
  #printSheet{display:block!important;position:absolute;left:0;top:0;width:100%;background:#fff;color:#000;padding:24px}
  .printTask{margin:0 0 18px;border:1px solid #ccc;padding:14px;border-radius:8px}
  .printCheck{margin:7px 0}
}
@media(max-width:1150px){
  .hq-toolbar-top{grid-template-columns:1fr}
  .hq-actions{justify-content:flex-start}
  .hq-board{grid-template-columns:1fr}
  .hq-hero,.hq-layout,.hq-template{grid-template-columns:1fr}
  .hq-preview{position:static}
}
@media(max-width:760px){
  .hq-metrics,.hq-summary,.hq-ownerline,.hq-step-grid,.hq-resources,.hq-addrow{grid-template-columns:1fr}
  .hq-calendargrid{grid-template-columns:1fr}
  .hq-listhead{display:none}
  .hq-listrow{grid-template-columns:1fr 1fr}
}

/* ===== Mobile polish ===== */
.mobilebar{
  display:none;
}
.mobile-header-actions{
  display:none;
}
@media(max-width:760px){
  body{
    background:#f6f3ee;
    overflow-x:hidden;
  }
  .app{
    display:block!important;
    min-height:100vh;
  }
  .sidebar{
    display:none!important;
  }
  .main{
    width:100%;
    min-width:0;
  }
  .topbar{
    height:auto!important;
    min-height:64px;
    padding:12px 14px!important;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:40;
    background:rgba(255,255,255,.96);
    backdrop-filter:blur(12px);
  }
  .topbar h1{
    font-size:18px!important;
    line-height:1.25;
  }
  .topbar .meta{
    font-size:11px!important;
    line-height:1.35;
    margin-top:2px!important;
  }
  .top-actions{
    display:none!important;
  }
  .content{
    width:100%!important;
    max-width:none!important;
    padding:14px 12px 92px!important;
    margin:0!important;
  }
  .page-title{
    margin-bottom:12px!important;
    align-items:flex-start!important;
  }
  .page-title h2{
    font-size:22px!important;
  }
  .page-title p{
    font-size:12px!important;
    line-height:1.5;
  }
  .grid4{
    grid-template-columns:1fr 1fr!important;
    gap:10px!important;
  }
  .metric{
    padding:14px!important;
  }
  .metric .value{
    font-size:24px!important;
  }
  .two,
  .form-grid,
  .quick{
    grid-template-columns:1fr!important;
    gap:10px!important;
  }
  .card{
    border-radius:14px!important;
    box-shadow:0 5px 16px rgba(35,31,26,.05)!important;
  }
  .card-head{
    padding:14px!important;
  }
  .card-body{
    padding:14px!important;
  }
  .quick button{
    padding:15px!important;
  }
  .search{
    min-width:0!important;
    width:100%!important;
  }
  .toolbar{
    overflow-x:auto;
    flex-wrap:nowrap!important;
    -webkit-overflow-scrolling:touch;
    padding-bottom:4px;
  }
  table{
    font-size:12px!important;
  }
  th,td{
    padding:11px 10px!important;
  }

  /* HQ overview */
  .hq-metrics{

/* ===== Invoice Mail module ===== */
.mail-shell{
  --m-line:#e4ddd4;--m-muted:#7d756d;--m-red:#c93f2b;--m-redsoft:#fde9e4;
  --m-green:#2f8f63;--m-greensoft:#e8f5ee;--m-blue:#2f6fb7;--m-bluesoft:#e8f0fb;
  --m-amber:#b77b13;--m-ambersoft:#fff3d8;
}
.mail-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.mail-kpi{padding:16px}.mail-kpi small{display:block;color:var(--m-muted);font-size:12px}.mail-kpi b{display:block;font-size:28px;margin-top:5px}
.mail-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mail-tab{border:1px solid var(--m-line);background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}
.mail-tab.active{background:#211d18;color:#fff;border-color:#211d18}
.mail-layout{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(0,1.5fr);gap:14px}
.mail-list-card{overflow:hidden}
.mail-toolbar{padding:12px;border-bottom:1px solid var(--m-line);display:flex;gap:8px;align-items:center}
.mail-toolbar input{flex:1;border:1px solid var(--m-line);border-radius:10px;padding:10px}
.mail-item{padding:13px 14px;border-bottom:1px solid var(--m-line);cursor:pointer;background:#fff;position:relative}
.mail-item:hover{background:#fcfaf7}.mail-item.active{background:#f7f1eb;box-shadow:inset 3px 0 #c94728}
.mail-item.unread .mail-subject{font-weight:900}.mail-item.locked:after{content:"処理中";position:absolute;right:12px;top:12px;background:var(--m-bluesoft);color:var(--m-blue);font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px}
.mail-item.dup:after{content:"重複警告";position:absolute;right:12px;top:12px;background:var(--m-redsoft);color:var(--m-red);font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px}
.mail-from{font-size:12px;color:var(--m-muted);padding-right:74px}.mail-subject{font-size:14px;margin-top:3px;padding-right:74px}.mail-preview{font-size:11px;color:#81776e;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:10px;color:#91877e}
.mail-detail{min-width:0}.mail-detail-head{padding:17px 18px;border-bottom:1px solid var(--m-line)}
.mail-detail-head h2{margin:7px 0 4px;font-size:20px}.mail-detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.mail-mini{border:1px solid var(--m-line);border-radius:10px;padding:10px;background:#faf8f5}.mail-mini small{display:block;color:var(--m-muted);font-size:10px;margin-bottom:3px}.mail-mini b{font-size:13px}
.mail-ownerbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.mail-ownerbar select{border:1px solid var(--m-line);border-radius:9px;padding:8px;background:#fff}
.mail-lock{margin:12px 18px 0;padding:12px;border:1px solid #b8d0eb;background:#f3f7fc;border-radius:12px;color:#315c86;font-size:12px}
.mail-alert{margin:12px 18px 0;padding:12px;border:1px solid #efb7aa;background:#fff8f6;border-radius:12px;color:#9d3425;font-size:12px}
.mail-body{padding:18px}.mail-body p{line-height:1.7;color:#5f574f}
.invoice-attach{display:grid;grid-template-columns:160px 1fr;gap:12px;border:1px solid var(--m-line);border-radius:14px;padding:12px;background:#faf8f5}
.invoice-paper{height:190px;border:1px solid #d5cdc4;background:#fff;border-radius:8px;padding:14px;box-shadow:0 4px 14px #231f1a0c;font-size:9px;color:#554c44}
.invoice-paper .amount{font-size:16px;font-weight:900;text-align:right;margin-top:24px}
.ai-box{border:1px solid var(--m-line);border-radius:12px;background:#fff;padding:12px}.ai-box h3{margin:0 0 8px;font-size:14px}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ai-field{padding:9px;border:1px solid var(--m-line);border-radius:9px;background:#faf8f5}.ai-field small{display:block;color:var(--m-muted);font-size:10px}.ai-field b{font-size:13px}
.mail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.mail-actions button{border:1px solid var(--m-line);background:#fff;border-radius:10px;padding:9px 12px}.mail-actions .primary{background:#c94728;color:#fff;border-color:#c94728}.mail-actions .green{background:var(--m-green);color:#fff;border-color:var(--m-green)}
.mail-history{margin-top:14px;border-top:1px solid var(--m-line);padding-top:12px}.mail-history-row{display:grid;grid-template-columns:12px 1fr;gap:8px;padding:7px 0;font-size:11px;color:#756b62}.mail-history-row span:first-child{width:8px;height:8px;background:#cfc6bc;border-radius:50%;margin-top:4px}.mail-history-row.done span:first-child{background:var(--m-green)}
.invoice-list{display:none}.invoice-list.active{display:block}.mail-inbox.active{display:block}.mail-inbox{display:none}
.invoice-table{width:100%;border-collapse:collapse}.invoice-table th,.invoice-table td{padding:11px 12px;border-bottom:1px solid var(--m-line);text-align:left;font-size:12px}.invoice-table th{color:var(--m-muted);background:#faf8f5}
.invoice-status{padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;display:inline-block}
.invoice-status.wait{background:var(--m-ambersoft);color:var(--m-amber)}.invoice-status.done{background:var(--m-greensoft);color:var(--m-green)}.invoice-status.check{background:var(--m-bluesoft);color:var(--m-blue)}
@media(max-width:900px){.mail-layout{grid-template-columns:1fr}.mail-list-card{max-height:none}.mail-summary{grid-template-columns:1fr 1fr}.mail-detail-grid{grid-template-columns:1fr 1fr}}

  .mail-actions{display:grid;grid-template-columns:1fr 1fr}.mail-actions button{min-height:42px}.mail-actions .primary,.mail-actions .green{grid-column:1/-1}
  .invoice-table,.invoice-table tbody,.invoice-table tr,.invoice-table td{display:block;width:100%}.invoice-table thead{display:none}.invoice-table tr{border:1px solid var(--m-line);border-radius:12px;margin-bottom:8px;padding:9px;background:#fff}.invoice-table td{border:0;padding:4px}

.info-shell{
  --i-bg:#f5f3ef;--i-panel:#fff;--i-ink:#332f2b;--i-muted:#857d76;--i-line:#e6e1db;
  --i-red:#d94f4f;--i-redsoft:#fdf3f2;--i-green:#4ca173;--i-orange:#d98836;
  --i-blue:#4d78c9;--i-purple:#7254a8;--i-shadow:0 4px 20px rgba(40,35,30,.06);
}
.info-shell *{box-sizing:border-box}
.info-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.info-quick-btn{
  border:1px solid var(--i-line);background:#fff;border-radius:14px;padding:16px;text-align:left;
  box-shadow:var(--i-shadow);cursor:pointer;transition:.15s;min-height:92px
}
.info-quick-btn:hover{transform:translateY(-1px);border-color:#bcb3aa}
.info-quick-btn .ic{font-size:22px}.info-quick-btn strong{display:block;margin-top:7px;font-size:15px}
.info-quick-btn small{display:block;margin-top:4px;color:var(--i-muted);font-size:11px;line-height:1.45}
.info-alert{
  background:var(--i-redsoft);border-left:5px solid var(--i-red);border-radius:10px;padding:15px 18px;margin-bottom:18px;
  box-shadow:var(--i-shadow)
}
.info-alert-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.info-alert-head b{color:var(--i-red);font-size:14px}
.info-alert-list{margin-top:10px;display:grid;gap:8px}
.info-alert-row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid #efd1cc;border-radius:9px;padding:10px 12px}
.info-alert-row strong{font-size:13px}.info-alert-row small{display:block;color:var(--i-muted);font-size:11px;margin-top:3px}
.info-summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.info-kpi{background:#fff;border:1px solid var(--i-line);border-radius:12px;padding:14px;box-shadow:var(--i-shadow)}
.info-kpi small{display:block;color:var(--i-muted);font-size:10px}.info-kpi b{display:block;font-size:23px;margin-top:5px}
.info-accordion{display:grid;gap:9px}
.info-acc{background:#fff;border:1px solid var(--i-line);border-radius:12px;overflow:hidden;box-shadow:var(--i-shadow)}
.info-acc-head{width:100%;border:0;background:#fff;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 15px;text-align:left}
.info-acc-head:hover{background:#fcfbf9}.info-acc-icon{font-size:20px}
.info-acc-title strong{display:block;font-size:14px}.info-acc-title small{display:block;color:var(--i-muted);font-size:11px;margin-top:2px}
.info-acc-chev{transition:.18s;color:var(--i-muted)}.info-acc.open .info-acc-chev{transform:rotate(90deg)}
.info-acc-body{display:none;border-top:1px solid var(--i-line);padding:12px 14px;background:#fcfbf9}.info-acc.open .info-acc-body{display:block}
.info-subgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.info-subbtn{border:1px solid var(--i-line);background:#fff;border-radius:10px;padding:11px;text-align:left;cursor:pointer}
.info-subbtn strong{display:block;font-size:12px}.info-subbtn small{display:block;color:var(--i-muted);font-size:10px;margin-top:3px}
.info-page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:15px}
.info-page-head h2{margin:0;font-size:24px}.info-page-head p{margin:5px 0 0;color:var(--i-muted);font-size:12px}
.info-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.info-tools input,.info-tools select{border:1px solid var(--i-line);background:#fff;border-radius:9px;padding:9px 10px}
.info-card{background:#fff;border:1px solid var(--i-line);border-radius:12px;box-shadow:var(--i-shadow)}
.info-table-wrap{overflow:auto}.info-table{width:100%;border-collapse:collapse}.info-table th,.info-table td{padding:12px 14px;border-bottom:1px solid var(--i-line);text-align:left;font-size:12px;white-space:nowrap}
.info-table th{background:#faf8f5;color:var(--i-muted);font-size:10px}.info-table tr:last-child td{border-bottom:0}
.info-pill{display:inline-block;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:800}
.info-pill.red{background:#fde7e4;color:#b83828}.info-pill.orange{background:#fff0dc;color:#a76b15}.info-pill.green{background:#e8f4ed;color:#327955}
.info-pill.blue{background:#e8eefb;color:#355f9f}.info-pill.purple{background:#f0ebf8;color:#654692}.info-pill.gray{background:#efebe6;color:#766e66}
.info-emp-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.info-view-toggle{display:flex;border:1px solid var(--i-line);border-radius:9px;overflow:hidden}
.info-view-toggle button{border:0;background:#fff;padding:8px 11px}.info-view-toggle button.active{background:#332f2b;color:#fff}
.info-emp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.info-emp-card{background:#fff;border:1px solid var(--i-line);border-radius:12px;padding:14px;box-shadow:var(--i-shadow);cursor:pointer}
.info-emp-card h3{font-size:14px;margin:8px 0 4px}.info-emp-card p{font-size:11px;color:var(--i-muted);margin:3px 0}
.info-emp-list{display:none}
.info-photo-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.info-photo{height:145px;border:1px solid var(--i-line);border-radius:10px;background:linear-gradient(135deg,#e9e3dc,#faf8f5);position:relative;display:flex;align-items:end;padding:9px;overflow:hidden}
.info-photo:before{content:"📷";position:absolute;inset:0;display:grid;place-items:center;font-size:34px;opacity:.35}
.info-photo span{position:relative;background:#ffffffdf;border-radius:7px;padding:5px 6px;font-size:9px}
.info-modal{position:fixed;inset:0;background:#211d1870;display:none;align-items:center;justify-content:center;padding:20px;z-index:80;backdrop-filter:blur(3px)}
.info-modal.open{display:flex}.info-modalbox{background:#fff;width:min(740px,96vw);max-height:88vh;overflow:auto;border-radius:15px;box-shadow:0 25px 80px #0003}
.info-modalhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--i-line);padding:15px 17px;font-weight:800}
.info-modalbody{padding:17px}.info-detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.info-detail{border:1px solid var(--i-line);border-radius:9px;padding:9px;background:#faf8f5}.info-detail small{display:block;color:var(--i-muted);font-size:10px}.info-detail b{font-size:12px}
.info-file{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--i-line);border-radius:9px;padding:10px;margin-top:8px}
.info-file b{font-size:12px}.info-file small{display:block;color:var(--i-muted);font-size:10px;margin-top:2px}
.info-secret{display:flex;gap:7px;align-items:center;background:#f7f4ef;border:1px solid var(--i-line);border-radius:9px;padding:9px;margin-top:8px}
.info-secret code{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.sidebar-collapse-btn{width:100%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#cfc8c0;border-radius:9px;padding:8px;margin:0 0 12px;cursor:pointer}
.app.sidebar-mini{grid-template-columns:88px 1fr}.app.sidebar-mini .sidebar{padding:18px 10px}.app.sidebar-mini .brand .txt,.app.sidebar-mini .section-title,.app.sidebar-mini .nav-item .label,.app.sidebar-mini .nav-group-head .label,.app.sidebar-mini .userbox,.app.sidebar-mini .sidebar-collapse-btn span{display:none}
.app.sidebar-mini .brand{justify-content:center}.app.sidebar-mini .nav-item,.app.sidebar-mini .nav-group-head{justify-content:center}.app.sidebar-mini .subnav{padding-left:0}
.app.sidebar-mini .nav-item .count{position:absolute;margin-left:26px;margin-top:-25px}
@media(max-width:1100px){.info-quick{grid-template-columns:1fr 1fr}.info-summary{grid-template-columns:repeat(3,1fr)}.info-subgrid,.info-emp-grid{grid-template-columns:1fr 1fr}.info-photo-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){
 .info-quick,.info-summary{grid-template-columns:1fr 1fr}.info-subgrid,.info-emp-grid{grid-template-columns:1fr}.info-photo-grid{grid-template-columns:1fr 1fr}
 .info-page-head{align-items:flex-start}.info-page-head h2{font-size:20px}.info-table,.info-table tbody,.info-table tr,.info-table td{display:block;width:100%}
 .info-table thead{display:none}.info-table tr{border:1px solid var(--i-line);border-radius:10px;padding:8px;margin-bottom:8px;background:#fff}.info-table td{border:0;padding:4px;white-space:normal}
 .info-detailgrid{grid-template-columns:1fr}.info-alert-row{align-items:flex-start}
}
@media(max-width:390px){.info-quick,.info-summary,.info-photo-grid{grid-template-columns:1fr}}


/* ===== Critical alerts on portal home ===== */
.critical-alerts{margin-bottom:16px}
.critical-alerts-head{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:#fff4f1;border:1px solid #efc2b8;border-left:6px solid #c94728;
  border-radius:14px 14px 0 0;padding:13px 16px
}
.critical-alerts-head b{color:#b93621;font-size:15px}
.critical-alerts-head small{color:#8b746d}
.critical-alerts-body{
  background:#fff;border:1px solid #efc2b8;border-top:0;border-radius:0 0 14px 14px;padding:10px 12px
}
.critical-row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:12px 10px;border-bottom:1px solid #eee4df
}
.critical-row:last-child{border-bottom:0}
.critical-row strong{display:block;font-size:14px}
.critical-row span.meta2{display:block;color:#83766e;font-size:11px;margin-top:3px}
.critical-chip{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}
.critical-chip.red{background:#fde5df;color:#b93621}
.critical-chip.orange{background:#fff0d8;color:#a7660d}
.critical-actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:760px){
  .critical-alerts-head{align-items:flex-start}
  .critical-row{grid-template-columns:1fr}
  .critical-actions{display:grid;grid-template-columns:1fr 1fr}
}


/* Reservation dashboard */
.resv-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.resv-kpi,.resv-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(42,36,30,.06)}
.resv-kpi{padding:14px}.resv-kpi small{display:block;color:var(--muted);font-size:10px}.resv-kpi b{display:block;font-size:24px;margin-top:5px}
.resv-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.resv-toolbar>div{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.resv-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.55fr);gap:14px}
.resv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.resv-head h3{margin:0;font-size:15px}.resv-head p{margin:4px 0 0;color:var(--muted);font-size:10px}
.resv-body{padding:14px}.resv-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.resv-mini{border:1px solid var(--line);border-radius:10px;padding:10px;background:#faf8f5}.resv-mini small{display:block;color:var(--muted);font-size:9px}.resv-mini b{font-size:16px}
.resv-tablewrap{overflow:auto}.resv-table{width:100%;border-collapse:collapse}.resv-table th,.resv-table td{padding:10px 11px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;white-space:nowrap}.resv-table th{background:#faf8f5;color:var(--muted);font-size:10px}
.resv-badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:800}.resv-badge.green{background:#eaf5ef;color:#3f9569}.resv-badge.blue{background:#edf2fb;color:#4f78c7}
.resv-source{display:flex;gap:7px;align-items:center}.resv-dot{width:8px;height:8px;border-radius:50%}.hp{background:#e66c32}.tb{background:#f0b000}.gn{background:#2c9a78}.gb{background:#4285f4}.direct{background:#6d5ba7}
.resv-chart{height:240px;position:relative;padding:15px 8px 28px 40px}.resv-chart-grid{position:absolute;inset:15px 8px 28px 40px;background:repeating-linear-gradient(to bottom,#eee8e2 0,#eee8e2 1px,transparent 1px,transparent 25%)}
.resv-bars{position:absolute;left:50px;right:18px;bottom:30px;top:28px;display:grid;grid-template-columns:repeat(8,1fr);gap:18px;align-items:end}
.resv-bar-group{display:flex;justify-content:center;gap:4px;align-items:end;height:100%;position:relative}.resv-bar{width:18px;border-radius:5px 5px 0 0}.resv-bar.r{background:#4f78c7}.resv-bar.s{background:#3f9569}.resv-label{position:absolute;bottom:-18px;font-size:9px;color:var(--muted)}
.resv-legend{display:flex;gap:12px;font-size:9px;color:var(--muted)}.resv-legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}.resv-legend .r:before{background:#4f78c7}.resv-legend .s:before{background:#3f9569}
.resv-fee{display:grid;grid-template-columns:1fr 76px 105px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.resv-fee:last-child{border:0}.resv-fee input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px}
@media(max-width:1100px){.resv-kpis{grid-template-columns:repeat(3,1fr)}.resv-grid{grid-template-columns:1fr}}
@media(max-width:760px){.resv-kpis{grid-template-columns:1fr 1fr}.resv-toolbar{display:block}.resv-toolbar>div{display:grid;grid-template-columns:1fr 1fr;margin-top:7px}.resv-table,.resv-table tbody,.resv-table tr,.resv-table td{display:block;width:100%}.resv-table thead{display:none}.resv-table tr{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}.resv-table td{border:0;padding:4px;white-space:normal}}


/* ===== Reservation UI v2 enhancements ===== */
.resv-subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.resv-subtab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:11px}
.resv-subtab.active{background:#2f2a26;color:#fff;border-color:#2f2a26}
.resv-subpage{display:none}.resv-subpage.active{display:block}
.resv-filter-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 6px 24px rgba(42,36,30,.06);margin-bottom:12px}
.resv-filter-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.resv-filter-grid label{display:block;color:var(--muted);font-size:9px;margin-bottom:4px}
.resv-filter-grid input,.resv-filter-grid select{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}
.resv-view-toggle{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.resv-view-toggle button{border:0;background:#fff;padding:8px 11px}
.resv-view-toggle button.active{background:#2f2a26;color:#fff}
.resv-calendar{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(42,36,30,.06);overflow:hidden}
.resv-cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:#faf8f5;border-bottom:1px solid var(--line)}
.resv-cal-head div{padding:9px;text-align:center;font-size:10px;color:var(--muted);font-weight:700}
.resv-cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.resv-day{min-height:130px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;background:#fff}
.resv-day:nth-child(7n){border-right:0}.resv-day.muted{background:#faf8f5;color:#aaa}
.resv-date{font-size:10px;font-weight:800;margin-bottom:6px}.resv-date.today{color:#c94728}
.resv-event{border:1px solid var(--line);background:#faf8f5;border-radius:8px;padding:6px;margin-bottom:5px;font-size:9px;cursor:pointer}
.resv-event strong{display:block;font-size:10px;margin-bottom:2px}.resv-event .time{color:var(--muted)}
.resv-keyword{display:inline-block;padding:3px 6px;border-radius:999px;font-size:8px;font-weight:800;margin:3px 3px 0 0}
.resv-keyword.birthday{background:#fff0f3;color:#b64262}.resv-keyword.anniv{background:#f2edfa;color:#654692}.resv-keyword.private{background:#edf2fb;color:#43689f}.resv-keyword.vip{background:#fff4df;color:#9d6814}.resv-keyword.allergy{background:#fdf3f2;color:#b83c2f}
.resv-list-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(42,36,30,.06);overflow:hidden}
.resv-list-row{display:grid;grid-template-columns:100px 150px 110px minmax(0,1fr) 130px 120px auto;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line)}
.resv-list-row:last-child{border-bottom:0}.resv-list-row strong{font-size:11px}.resv-list-row small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.resv-course-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.resv-course-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(42,36,30,.06)}
.resv-course-card small{display:block;color:var(--muted);font-size:9px}.resv-course-card b{display:block;font-size:18px;margin-top:4px}
.resv-analysis-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.resv-analysis-box{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(42,36,30,.06);padding:14px}
.resv-analysis-box h3{margin:0 0 4px;font-size:14px}.resv-analysis-box p{margin:0;color:var(--muted);font-size:10px}
.resv-note{padding:10px 12px;background:#fffaf1;border:1px solid #eed9a9;border-radius:10px;color:#836520;font-size:10px;margin-bottom:12px}
@media(max-width:1200px){
  .resv-filter-grid{grid-template-columns:repeat(3,1fr)}
  .resv-list-row{grid-template-columns:90px 130px 100px minmax(0,1fr) 110px auto}.resv-list-row .hide-lg{display:none}
  .resv-course-summary{grid-template-columns:1fr 1fr}
}
@media(max-width:760px){
  .resv-filter-grid{grid-template-columns:1fr 1fr}
  .resv-cal-head,.resv-cal-grid{min-width:720px}.resv-calendar{overflow:auto}
  .resv-list-row{display:block}.resv-list-row>*{margin-bottom:6px}
  .resv-analysis-grid{grid-template-columns:1fr}
}


/* ===== Reservation UI v3: daily timeline / month-week calendar / period list / same-day booking ===== */
.resv-top-insight{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.resv-insight{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(42,36,30,.06)}
.resv-insight small{display:block;color:var(--muted);font-size:9px}.resv-insight b{display:block;font-size:18px;margin-top:4px}.resv-insight .sub{font-size:9px;color:var(--muted);margin-top:3px}
.resv-insight.hot{background:#fff8f5;border-color:#efc1b6}.resv-insight.hot b{color:#c94728}
.resv-prior-year{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 6px 24px rgba(42,36,30,.06);margin-bottom:12px}
.resv-prior-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.resv-prior-box{border:1px solid var(--line);border-radius:10px;padding:10px;background:#faf8f5}
.resv-prior-box small{display:block;color:var(--muted);font-size:9px}.resv-prior-box b{display:block;font-size:16px;margin-top:4px}.resv-up2{color:#3f9569;font-size:9px;font-weight:800}.resv-down2{color:#d94f4f;font-size:9px;font-weight:800}
.resv-period-switch{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.resv-period-switch button{border:0;background:#fff;padding:8px 11px;font-size:10px}.resv-period-switch button.active{background:#2f2a26;color:#fff}
.resv-view-area{display:none}.resv-view-area.active{display:block}
.resv-calendar-controls{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.resv-calendar-controls .left,.resv-calendar-controls .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.resv-timeline{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(42,36,30,.06);overflow:auto}
.resv-time-head{display:grid;grid-template-columns:105px repeat(13,minmax(68px,1fr));min-width:1030px;background:#faf8f5;border-bottom:1px solid var(--line)}
.resv-time-head div{padding:8px 3px;text-align:center;font-size:9px;color:var(--muted);border-right:1px solid var(--line)}
.resv-time-head div:first-child{text-align:left;padding-left:10px}

let currentMailType='invoice1';
let mailClaimed=false;
function switchMailTab(tab,btn){
  document.querySelectorAll('.mail-tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
  document.getElementById('mailInbox')?.classList.remove('active');
  document.getElementById('invoiceList')?.classList.remove('active');
  document.getElementById('mailHistoryTab')?.classList.remove('active');
  document.getElementById('mailSentTab')?.classList.remove('active');
  if(tab==='inbox')document.getElementById('mailInbox')?.classList.add('active');
  if(tab==='invoiceList')document.getElementById('invoiceList')?.classList.add('active');
  if(tab==='history')document.getElementById('mailHistoryTab')?.classList.add('active');
  if(tab==='sent')document.getElementById('mailSentTab')?.classList.add('active');
}
function selectMail(el,from,subject,type){
  document.querySelectorAll('.mail-item').forEach(x=>x.classList.remove('active'));el.classList.add('active');
  currentMailType=type;mailClaimed=false;
  document.getElementById('mailDetailSubject').textContent=subject;
  document.getElementById('mailDetailFrom').textContent=from+' → 請求書専用アドレス';
  document.getElementById('openedBy').textContent='未開封';
  document.getElementById('processingBy').textContent=type==='invoice2'?'齋藤':'未設定';
  document.getElementById('processingState').textContent=type==='invoice2'?'処理中':'未処理';
  document.getElementById('mailLockBanner').style.display=type==='invoice2'?'block':'none';
  document.getElementById('duplicateBanner').style.display=type==='invoice3'?'block':'none';
  document.getElementById('mailStatusPill').textContent=type==='invoice2'?'処理中':type==='invoice3'?'要確認':'未処理';
  document.getElementById('claimBtn').disabled=type==='invoice2';
  document.getElementById('claimBtn').textContent=type==='invoice2'?'齋藤が処理中':'このメールを処理する';
  document.getElementById('completeMailBtn').disabled=true;
  document.getElementById('mailHistory').innerHTML='<div class="mail-history-row"><span></span><div>メール受信</div></div>';
}
function markRead(){
  document.getElementById('openedBy').textContent='中山 俊士';
  addMailHistory('中山 俊士 がメールを開封');
}
function claimMail(){
  const owner=document.getElementById('mailOwner').value;
  if(owner==='担当者を選択'){alert('担当者を選択してください。');return}
  mailClaimed=true;
  document.getElementById('processingBy').textContent=owner;
  document.getElementById('processingState').textContent='処理中';
  document.getElementById('openedBy').textContent='中山 俊士';
  document.getElementById('mailStatusPill').textContent='処理中';
  document.getElementById('mailLockBanner').style.display='block';
  document.getElementById('lockText').textContent=owner+'さんが処理中です。';
  document.getElementById('claimBtn').disabled=true;
  document.getElementById('claimBtn').textContent=owner+'が処理中';
  document.getElementById('completeMailBtn').disabled=false;
  addMailHistory(owner+' が処理を開始');
}
function registerInvoice(){
  const tbody=document.getElementById('invoiceRows');
  if(tbody&&!document.getElementById('demoInvoiceRow')){
    const tr=document.createElement('tr');tr.id='demoInvoiceRow';
    tr.innerHTML='<td><b>東京食品株式会社</b></td><td>TF-2608-1842</td><td>¥438,900</td><td>9/10</td><td>'+(document.getElementById('processingBy').textContent||'未設定')+'</td><td><span class="invoice-status check">確認中</span></td>';
    tbody.prepend(tr);
  }
  addMailHistory('請求書一覧へ登録');
  alert('請求書一覧へ登録しました（デモ）');
}
function completeMail(){
  if(!mailClaimed){alert('先に処理担当を設定してください。');return}
  document.getElementById('processingState').textContent='完了';
  document.getElementById('mailStatusPill').textContent='完了';
  document.getElementById('mailLockBanner').style.display='none';
  document.getElementById('completeMailBtn').disabled=true;
  document.getElementById('completeMailBtn').textContent='完了 ✓';
  addMailHistory(document.getElementById('processingBy').textContent+' が処理完了');
}
function addMailHistory(text){
  const h=document.getElementById('mailHistory');if(!h)return;
  const d=document.createElement('div');d.className='mail-history-row done';d.innerHTML='<span></span><div>いま　'+text+'</div>';h.prepend(d);
}

function addResource(btn,type){const list=btn.closest('.hq-step-block').querySelector('.resource-list'),d=document.createElement('div');d.className='hq-resource';d.style.marginTop='8px';d.innerHTML=`<b>${type}</b><small>タイトル・URL・参照先を設定</small>`;list.appendChild(d)}
function addTemplateStep(){const w=document.getElementById('templateBuilder'),n=w.children.length+1,d=document.createElement('div');d.className='hq-step-block';d.innerHTML=`<div style="display:flex;justify-content:space-between"><b>工程${n}：新しい工程</b><span class="hq-pill blue">工程</span></div><div class="hq-step-grid" style="margin-top:10px"><div class="hq-field"><label>担当者</label><select><option>未設定</option><option>原 美香</option><option>齋藤</option><option>中山</option></select></div><div class="hq-field"><label>期限</label><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="date"><input type="time"></div></div></div><div class="hq-field"><label>手順</label><textarea placeholder="手順を入力"></textarea></div><div class="hq-checkbuilder"><button class="hq-btn" onclick="addCheck(this)">＋ チェック追加</button></div><div class="hq-addrow"><button onclick="addResource(this,'📄 マニュアル')">📄 マニュアル</button><button onclick="addResource(this,'🎥 動画')">🎥 動画</button><button onclick="addResource(this,'🖼️ 写真')">🖼️ 写真</button><button onclick="addResource(this,'🔗 URL')">🔗 URL</button><button onclick="addResource(this,'🔐 ID/PW')">🔐 ID/PW</button><button onclick="addResource(this,'📁 Drive')">📁 Drive</button></div><div class="resource-list"></div>`;w.appendChild(d)}
function downloadTemplatesCSV(){const csv='template_name,corporation,frequency,steps,owner\n月次 給与計算,N-Style,monthly,3,原 美香\nJ-center point,LiveGate,monthly,3,原 美香\n入金確認,N-Style,monthly,12,齋藤';const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='task_templates.csv';a.click();URL.revokeObjectURL(a.href)}
function uploadCSV(input){if(!input.files[0])return;alert('CSVを読み込みました（プロトタイプ）。本番では内容を検証して一括登録します。')}
function openSingleTaskModal(){document.getElementById('singleTaskModal')?.classList.add('open')}
function closeSingleTaskModal(){document.getElementById('singleTaskModal')?.classList.remove('open')}
function createSingleTask(){const title=document.getElementById('singleTitle')?.value||'新しい単発タスク';alert('「'+title+'」を追加しました（プロトタイプ）');closeSingleTaskModal()}
function printToday(){window.print()}

document.querySelectorAll('.nav-group-head').forEach(b=>b.addEventListener('click',()=>b.parentElement.classList.toggle('open')));
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
showView('home');
