name: P一時検証(削除予定)
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 24か月バックフィル(dashboard_daily months=26 → store_monthly → pl_monthly)
        env:
          SR_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          U=https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-kd-refresh
          for B in '{"op":"dashboard_daily","months":26}' '{"op":"store_monthly"}' '{"op":"pl_monthly"}'; do
            echo "== $B"; curl -s -m 400 -X POST $U -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d "$B" | cut -c1-400; echo
          done
