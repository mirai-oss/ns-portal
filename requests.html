<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🔁 変更申請 — N-Styleグループ ポータル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔁</text></svg>">
<style>
:root{
  --bg:#f5f4f1; --card:#ffffff; --ink:#26221e; --muted:#8a8377;
  --accent:#1f5fbf; --accent2:#184c99; --line:#e7e3dc; --ok:#2e7d32;
  --warn:#b58a00; --bad:#c62828; --soft:#f1f5f9;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1d1b18; --card:#282521; --ink:#f0ece5; --muted:#a29a8c; --line:#3a362f; --soft:#33302a;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
a{color:inherit}
.spin{text-align:center;color:var(--muted);padding:60px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}
label:first-child{margin-top:0}
.req{background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:middle}
input,select,textarea{width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit}
textarea{resize:vertical}
input[type=file]{padding:8px;font-size:12px;border-style:dashed;background:var(--card)}
.btn{display:inline-block;padding:12px 20px;font-size:15px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:10px;cursor:pointer;width:100%}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:default}
.topbar h1{font-size:19px}
.topbar .who{font-size:13px;color:var(--muted);margin-top:2px}
.tabrow{display:flex;border-bottom:2px solid var(--line);margin:-16px -18px 14px;border-radius:14px 14px 0 0;overflow:hidden}
.tabrow button{flex:1;padding:13px 8px;text-align:center;font-size:14px;font-weight:700;border:none;background:var(--soft);color:var(--muted);cursor:pointer}
.tabrow button.active{background:var(--card);color:var(--accent);border-bottom:3px solid var(--accent);margin-bottom:-2px}
.dyn{background:var(--soft);border-radius:10px;padding:14px;margin-top:10px}
.row2{display:flex;gap:8px}
.row2>div{flex:1}
.msg-err{color:var(--bad);font-size:13px;background:rgba(198,40,40,.08);border-radius:8px;padding:8px 10px;margin-top:10px}
.msg-ok{color:var(--ok);font-size:13px;background:rgba(46,125,50,.08);border-radius:8px;padding:8px 10px;margin-top:10px}
.note{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11px}
.pill.pending{background:#fdf5e0;color:var(--warn)}
.pill.approved,.pill.done{background:#e9f6ef;color:var(--ok)}
.pill.rejected{background:#fdecec;color:var(--bad)}
.hist-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist-row:last-child{border-bottom:none}
.hist-meta{color:var(--muted);font-size:11px;white-space:nowrap}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chipbar button{width:auto;padding:6px 12px;font-size:12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.chipbar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.radiorow{display:flex;gap:18px;padding:4px 0}
.radiorow label{display:flex;align-items:center;gap:6px;font-weight:400;color:var(--ink);font-size:14px;margin:0}
.pwwrap{position:relative}
.pwwrap button{position:absolute;right:8px;top:8px;width:auto;padding:4px 8px;font-size:11px;background:none;color:var(--accent);border:none;font-weight:600}
.sec-title{font-size:15px;font-weight:700;margin-bottom:4px}
.sec-sub{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
<div id="app"><div class="spin">読み込み中…</div></div>
</div>
<script>
/* ============================================================
   認証・セッション（index.html / expenses.html と同一実装。
   nsportal_session_v1 の形式は変更しない）
   ============================================================ */
const SUPA_URL="https://uuvsxzhpxtghojoubjcc.supabase.co";
const SUPA_KEY="sb_publishable_MrwPJAx_Ws_fdRutprKCiQ_dg3wCiTr";
const LS_KEY="nsportal_session_v1";
const ATT_BUCKET="employee-request-attachments";
const CHATWORK_FN_URL=SUPA_URL+"/functions/v1/notify-chatwork"; // expenses.htmlと同じ既存Edge Function
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sess={get:()=>{try{return JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return null}},
            set:v=>localStorage.setItem(LS_KEY,JSON.stringify(v)),
            clear:()=>localStorage.removeItem(LS_KEY)};

async function api(path,opt={},token){
  const r=await fetch(SUPA_URL+path,{...opt,headers:{
    "apikey":SUPA_KEY,...(opt.isBinary?{}:{"Content-Type":"application/json"}),
    ...(token?{"Authorization":"Bearer "+token}:{}),...(opt.headers||{})}});
  let body=null; const tx=await r.text(); try{body=tx?JSON.parse(tx):null}catch(e){}
  return {ok:r.ok,status:r.status,body};
}
async function authed(path,opt={}){
  const s=sess.get(); if(!s) return {ok:false,status:401,body:null};
  let r=await api(path,opt,s.at);
  if(r.status===401){ if(!await refresh()) return r; r=await api(path,opt,sess.get().at); }
  return r;
}
async function refresh(){
  const s=sess.get(); if(!s?.rt) return false;
  const r=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.rt})});
  if(!r.ok){sess.clear();return false}
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});
  return true;
}
async function fetchMe(){
  const s=sess.get(); if(!s) return null;
  const r=await authed(`/rest/v1/users?id=eq.${s.uid}&select=*`);
  if(!r.ok||!Array.isArray(r.body)||!r.body[0]) return null;
  return r.body[0];
}
// 2026-09-01: 変更申請の実体（info.employee_change_requests等）は社内情報管理システム
// （ns-info-system）と同一Supabaseプロジェクトの別スキーマ"info"にある。同じプロジェクト・
// 同じSupabase Authのため、ns-portal側からAccept-Profile/Content-Profileヘッダーで
// スキーマを指定するだけで直接読み書きできる（ユーザー要望により、社内情報管理システムへ
// リンクで飛ばさずこの画面内で完結させるためにこの方式を採用）
async function infoAuthed(path,opt={}){
  return authed(path,{...opt,headers:{"Accept-Profile":"info","Content-Profile":"info",...(opt.headers||{})}});
}
async function uploadAttachment(file){
  const s=sess.get();
  const path=`${s.uid}/${Date.now()}_${file.name}`;
  const buf=await file.arrayBuffer();
  const r=await api(`/storage/v1/object/${ATT_BUCKET}/${path}`,{method:"POST",isBinary:true,headers:{"Content-Type":file.type||"application/octet-stream"},body:buf},s.at);
  if(!r.ok) throw new Error("添付ファイルのアップロードに失敗しました");
  return path;
}
// 2026-09-01 ユーザー要望: 申請が入ったら承認者の個人Chatworkルームへ通知する。
// ルームIDは既存の本部タスクボード通知基盤(hq_user_chatwork)に登録済みのものを
// そのまま使う。通知の送信に失敗しても申請自体は成立済みなので握りつぶす。
// 2026-09-02: 個人情報変更（public.profile_change_requests）とID/PW変更申請
// （info.credential_change_requests）は承認者の定義元が違う（後者はns-info-system側の
// info.profiles/roles）ため、通知先の取得経路を分けている
async function sendChatworkToRooms(roomIds,text){
  const s=sess.get();
  for(const roomId of roomIds){
    if(!roomId) continue;
    try{
      await fetch(CHATWORK_FN_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({room_id:roomId,body:text})});
    }catch(e){ /* 握りつぶす */ }
  }
}
// 個人情報変更の承認者＝public.users.is_master or role='HQ'（ポータル自身の役職で統一）
async function notifyProfileApprovers(text){
  try{
    const ur=await authed(`/rest/v1/users?select=id&is_active=eq.true&or=(is_master.eq.true,role.eq.HQ)`);
    if(!ur.ok||!Array.isArray(ur.body)||ur.body.length===0) return;
    const ids=ur.body.map(u=>u.id);
    const cr=await authed(`/rest/v1/hq_user_chatwork?user_id=in.(${ids.join(",")})&select=room_id`);
    if(!cr.ok||!Array.isArray(cr.body)) return;
    await sendChatworkToRooms(cr.body.map(r=>r.room_id),text);
  }catch(e){ /* 握りつぶす */ }
}
// ID/PW変更申請の承認者＝ns-info-system側info.profiles/roles（マスター・役職「本部」）
async function notifyCredentialApprovers(text){
  try{
    const r=await infoAuthed("/rest/v1/rpc/get_approver_chatwork_rooms",{method:"POST",body:"{}"});
    if(!r.ok||!Array.isArray(r.body)) return;
    await sendChatworkToRooms(r.body.map(row=>row.room_id),text);
  }catch(e){ /* 握りつぶす */ }
}

/* ============================================================
   状態
   ============================================================ */
let ME=null, HAS_BANK=false, CRED_ELIGIBLE=false, CORPS=[], PROFILE_APPROVER=false, PENDING_PROFILE=null;
// portal.htmlの「申請」グループから?tab=personal/systemで初期タブを直接指定できる
let TAB=new URLSearchParams(location.search).get("tab")==="system"?"system":"personal";
let P_CATEGORY="", C_KIND="new", C_CORP="", C_LIST=null, C_CATFILTER="すべて", C_Q="", C_CREDID="", C_FIELD="secret";
const ROLE_NAME={CEO:"社長",HQ:"本部",TEAM:"チーム長",TENCHO:"店長",SHAIN:"社員",AL:"アルバイト"};

const P_CATEGORIES=[
  {v:"phone",l:"電話番号の変更"},
  {v:"name",l:"氏名の変更（結婚・改姓等）"},
  {v:"address",l:"住所の変更"},
  {v:"contact_email",l:"連絡用メールアドレスの変更"},
  {v:"bank_account",l:"振込口座情報の変更・登録"},
  {v:"id_document",l:"身分証明書の提出"},
];
const ACCOUNT_TYPES=[{v:"1",l:"普通"},{v:"2",l:"当座"},{v:"4",l:"貯蓄"}];
const ID_DOC_TYPES=["運転免許証","マイナンバーカード（表面）","健康保険証","在留カード / 特別永住者証明書"];
const CRED_FIELDS=[{v:"username",l:"ID（ログインID）"},{v:"secret",l:"パスワード"},{v:"login_url",l:"ログインURL"},{v:"status",l:"状態"},{v:"memo",l:"メモ"}];
const CRED_STATUS_VALUES=["使用中","要確認","解約済"];
const NEW_CATEGORIES=["レジ・決済","広告媒体","通信・Wi-Fi","クラウド","銀行","その他"];
const EMP_FIELD_LABELS={name:"氏名",kana:"フリガナ",phone:"電話番号",address:"住所",bank_account:"給与振込口座",contact_email:"連絡用メールアドレス",id_document:"身分証明書の提出"};
const CRED_FIELD_LABELS={username:"ID",secret:"パスワード",login_url:"ログインURL",status:"状態",memo:"メモ"};
const STATUS_PILL={pending:["承認待ち","pending"],approved:["承認済み","approved"],rejected:["却下","rejected"],done:["対応済み","done"]};

/* ============================================================
   起動
   ============================================================ */
function renderLogin(){
  $("app").innerHTML=`<div class="card">
    <p style="margin-bottom:10px">ログインが必要です。ポータルからアクセスしてください。</p>
    <a class="btn" href="index.html">← ポータルへ</a>
  </div>`;
}
async function main(){
  if(!sess.get()){renderLogin();return}
  const u=await fetchMe();
  if(!u){sess.clear();renderLogin();return}
  if(u.is_active===false){renderLogin();return}
  ME=u;
  // 2026-09-02バグ修正: 個人情報はハブのpublic.employee_profiles/usersが実体
  // （旧: info.employeesは役員名簿的な別の小さなテーブルで、一般社員は誰も
  // 紐付いておらず「従業員情報が見つかりません」になっていた）
  const [{body:bankBody},{body:eligBody},{body:corpsBody},{body:approverBody}]=await Promise.all([
    authed("/rest/v1/rpc/has_my_bank_account",{method:"POST",body:"{}"}),
    infoAuthed("/rest/v1/rpc/am_credential_eligible",{method:"POST",body:"{}"}),
    infoAuthed("/rest/v1/corporations?select=id,code,name&order=code"),
    authed("/rest/v1/rpc/is_profile_approver",{method:"POST",body:"{}"}),
  ]);
  HAS_BANK=bankBody===true;
  CRED_ELIGIBLE=eligBody===true;
  PROFILE_APPROVER=approverBody===true;
  if(TAB==="system"&&!CRED_ELIGIBLE) TAB="personal"; // 権限が無い人が?tab=systemで来た場合のフォールバック
  CORPS=Array.isArray(corpsBody)?corpsBody:[];
  if(CORPS[0]) C_CORP=CORPS[0].id;
  renderApp();
}
main();

/* ============================================================
   画面全体
   ============================================================ */
function renderApp(){
  $("app").innerHTML=`
    <div class="topbar" style="margin-bottom:14px">
      <h1>🔁 変更申請</h1>
      <div class="who">${esc(ME.name)}さん・申請した内容は本部の承認後に反映されます</div>
    </div>
    <div id="approvePanel"></div>
    <div id="bankListPanel"></div>
    <div class="card" style="padding:0;overflow:hidden">
      <div class="tabrow">
        <button id="tabPersonal" class="${TAB==='personal'?'active':''}" onclick="switchTab('personal')">自分の情報変更</button>
        ${CRED_ELIGIBLE?`<button id="tabSystem" class="${TAB==='system'?'active':''}" onclick="switchTab('system')">社内システム情報申請</button>`:""}
      </div>
      <div style="padding:16px 18px" id="tabBody"></div>
    </div>
    <div class="card">
      <div class="sec-title">📜 自分の申請履歴</div>
      <div id="histBody"><p style="color:var(--muted);font-size:13px">読み込み中…</p></div>
    </div>
  `;
  renderTabBody();
  loadHistory();
  if(PROFILE_APPROVER){ loadApprovePanel(); loadBankList(); }
}
function switchTab(t){ TAB=t; renderApp(); }

/* ============================================================
   承認パネル（本部/マスター用。個人情報変更の承認待ちをここから処理する）
   ============================================================ */
function formatFieldValue(field,value){
  if(value==null) return "（空）";
  if(field==="bank_account"){
    try{
      const b=JSON.parse(value);
      const typeLabel=({"1":"普通","2":"当座","4":"貯蓄"})[b.account_type]||b.account_type||"";
      return `${b.bank_name||b.bank_code||""} ${b.branch_name||b.branch_code||""} ${typeLabel} ${b.account_number||""}（${b.account_holder_kana||""}）`.replace(/\s+/g," ").trim();
    }catch(e){ return value; }
  }
  if(field==="id_document"){
    try{ return JSON.parse(value).doc_type||value; }catch(e){ return value; }
  }
  return value;
}
function bankAttachmentPath(field,value){
  if(field!=="bank_account"&&field!=="id_document") return null;
  try{
    const v=JSON.parse(value);
    return v.proof_file_path||v.file_path||null;
  }catch(e){ return null; }
}
async function loadApprovePanel(){
  const r=await authed(`/rest/v1/profile_change_requests?status=eq.pending&order=requested_at.asc&select=id,user_id,field,old_value,new_value,requested_at,target:users!profile_change_requests_user_id_fkey(name)`);
  PENDING_PROFILE=(r.ok&&Array.isArray(r.body))?r.body:[];
  renderApprovePanel();
}
function renderApprovePanel(){
  const el=$("approvePanel"); if(!el) return;
  if(!PENDING_PROFILE||PENDING_PROFILE.length===0){ el.innerHTML=""; return; }
  el.innerHTML=`<div class="card" style="border:2px solid var(--warn);background:#fdf5e0">
    <div class="sec-title" style="color:var(--warn)">🔁 承認待ちの個人情報変更申請（${PENDING_PROFILE.length}件）</div>
    <div id="approveMsg"></div>
    ${PENDING_PROFILE.map(r=>{
      const path=bankAttachmentPath(r.field,r.new_value);
      return `<div class="card" style="margin-top:10px">
        <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
          <b>${esc(r.target?.name||"（不明）")}</b>
          <span class="hist-meta">${EMP_FIELD_LABELS[r.field]||r.field}｜${new Date(r.requested_at).toLocaleString("ja-JP")}</span>
        </div>
        <div style="margin-top:4px;font-size:13px">
          <span style="color:var(--muted);text-decoration:line-through">${esc(formatFieldValue(r.field,r.old_value))}</span>
          → <span>${esc(formatFieldValue(r.field,r.new_value))}</span>
          ${path?`<button type="button" onclick="viewAttachment('${path.replace(/'/g,"\\'")}')" style="width:auto;padding:3px 8px;font-size:11px;border-radius:6px;border:1px solid var(--accent);color:var(--accent);background:none;margin-left:6px">📎添付を見る</button>`:""}
        </div>
        <div style="margin-top:8px;display:flex;gap:8px">
          <button class="btn" style="width:auto;padding:8px 16px;background:var(--ok)" onclick="reviewProfileRequest('${r.id}',true)">✅ 承認する</button>
          <button class="btn" style="width:auto;padding:8px 16px;background:none;color:var(--bad);border:1px solid var(--bad)" onclick="reviewProfileRequest('${r.id}',false)">却下する</button>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}
async function viewAttachment(path){
  const r=await authed(`/storage/v1/object/sign/${ATT_BUCKET}/${encodeURIComponent(path)}`,{method:"POST",body:JSON.stringify({expiresIn:60})});
  if(r.ok&&r.body?.signedURL) window.open(SUPA_URL+"/storage/v1"+r.body.signedURL,"_blank","noopener");
  else alert("添付を開けませんでした");
}
async function reviewProfileRequest(id,approve){
  if(approve&&!confirm("この内容で承認し、実際の値を書き換えますか？")) return;
  let reason=null;
  if(!approve){ reason=prompt("却下理由（任意）")||""; }
  const r=await authed("/rest/v1/rpc/review_profile_change_request",{method:"POST",body:JSON.stringify({p_request_id:id,p_approve:approve,p_reason:reason||null})});
  const msg=$("approveMsg");
  if(!r.ok){ if(msg) msg.innerHTML=`<div class="msg-err">${esc(r.body?.message||"処理できませんでした")}</div>`; return; }
  await loadApprovePanel();
}

/* ============================================================
   登録済みの振込口座一覧（本部/マスター用）
   2026-09-02 担当Cからの依頼: 給与仕訳タブで登録・または本人申請で承認された
   payroll_bank_accountsを、従業員情報を見る場所からも確認できるようにしたい、
   との要望。ns-info-system側のemployees画面（info.employees）はportal_user_id
   紐付けがほぼ無い別テーブルのためそちらに追加しても実質誰も表示されない
   （今回の緊急バグと同じ原因）。payroll_bank_accountsは元々public.users.id
   （ポータルの実アカウント）で管理されているため、この画面（requests.html）に
   一覧を追加するのが実データと正しく結びつく置き場所と判断した
   ============================================================ */
const ACCOUNT_TYPE_LABEL={"1":"普通","2":"当座","4":"貯蓄"};
const PAYMENT_METHOD_LABEL={bank_transfer:"銀行振込",cash:"現金手渡し"};
let BANK_LIST=null, BANK_Q="";
async function loadBankList(){
  const r=await authed(`/rest/v1/payroll_bank_accounts?select=user_id,bank_name,bank_code,branch_name,branch_code,account_type,account_number,account_holder_kana,payment_method,updated_at,owner:users!payroll_bank_accounts_user_id_fkey(name)`);
  BANK_LIST=(r.ok&&Array.isArray(r.body))?r.body.sort((a,b)=>(a.owner?.name||"").localeCompare(b.owner?.name||"","ja")):[];
  renderBankShell();
}
function renderBankShell(){
  const el=$("bankListPanel"); if(!el) return;
  if(BANK_LIST===null) return;
  el.innerHTML=`<div class="card">
    <div class="sec-title">🏦 登録済みの振込口座（${BANK_LIST.length}件）</div>
    <div class="sec-sub">給与仕訳タブでの登録、または本人からの変更申請が承認されたものが、どちらもここに集約されます。</div>
    <input type="search" id="bankQ" oninput="setBankQ(this.value)" placeholder="氏名で検索">
    <div id="bankResults" style="margin-top:8px"></div>
  </div>`;
  updateBankResults();
}
function setBankQ(v){ BANK_Q=v; updateBankResults(); }
function updateBankResults(){
  const el=$("bankResults"); if(!el) return;
  const q=BANK_Q.trim().toLowerCase();
  const filtered=(BANK_LIST||[]).filter(r=>!q||(r.owner?.name||"").toLowerCase().includes(q));
  if(filtered.length===0){ el.innerHTML='<p style="color:var(--muted);font-size:13px">該当する登録はありません</p>'; return; }
  el.innerHTML=filtered.map(r=>{
    const isCash=r.payment_method==="cash";
    const detail=isCash?"（現金手渡しのため口座情報なし）":
      `${r.bank_name||r.bank_code||""} ${r.branch_name||r.branch_code||""} ${ACCOUNT_TYPE_LABEL[r.account_type]||r.account_type||""} ${r.account_number||""}（${r.account_holder_kana||""}）`.replace(/\s+/g," ").trim();
    return `<div class="hist-row" style="align-items:flex-start">
      <span><b>${esc(r.owner?.name||"（不明）")}</b><br><span style="font-size:12px;color:var(--muted)">${esc(detail)}</span></span>
      <span class="hist-meta">${PAYMENT_METHOD_LABEL[r.payment_method]||r.payment_method||""}<br>${new Date(r.updated_at).toLocaleDateString("ja-JP")}更新</span>
    </div>`;
  }).join("");
}

   タブ1: 自分の情報変更
   ============================================================ */
function renderTabBody(){
  if(TAB==="personal") renderPersonalTab(); else renderSystemTab();
}
function renderPersonalTab(){
  const body=$("tabBody");
  body.innerHTML=`<div class="sec-title">自分の情報変更申請</div>
    <div class="sec-sub">変更したい項目を選択してください。今の登録内容はここには表示されません（新しい値だけ入力してください）。承認されると反映されます。</div>
    <div class="msg-ok" style="background:#e8f0fd;color:var(--accent)">「${esc(ME.name)}」さんとして申請します</div>
    <label>変更するカテゴリ<span class="req">必須</span></label>
    <select id="pCategory" onchange="onPCategoryChange(this.value)">
      <option value="">選択してください</option>
      ${P_CATEGORIES.map(c=>`<option value="${c.v}" ${P_CATEGORY===c.v?"selected":""}>${esc(c.l)}</option>`).join("")}
    </select>
    <div id="pDyn"></div>
    <div id="pMsg"></div>
    <button class="btn" style="margin-top:14px" onclick="submitPersonal()" ${P_CATEGORY?"":"disabled"} id="pSubmitBtn">変更申請を送信する</button>`;

}
function onPCategoryChange(v){ P_CATEGORY=v; $("pSubmitBtn").disabled=!v; renderPDyn(); }
function renderPDyn(){
  const el=$("pDyn"); if(!P_CATEGORY){ el.innerHTML=""; return; }
  let html="";
  if(P_CATEGORY==="phone"){
    html=`<label>新しい電話番号<span class="req">必須</span></label>
      <input type="tel" id="f_phone" placeholder="09012345678（ハイフンなし数字のみ）">`;
  } else if(P_CATEGORY==="name"){
    html=`<label>新しい氏名<span class="req">必須</span></label>
      <div class="row2"><input type="text" id="f_lastName" placeholder="姓（例: 山田）">
        <input type="text" id="f_firstName" placeholder="名（例: 太郎）"></div>
      <label>フリガナ<span class="req">必須</span></label>
      <div class="row2"><input type="text" id="f_lastKana" placeholder="セイ（例: ヤマダ）">
        <input type="text" id="f_firstKana" placeholder="メイ（例: タロウ）"></div>`;
  } else if(P_CATEGORY==="address"){
    html=`<label>郵便番号<span class="req">必須</span></label>
      <input type="text" id="f_zip" placeholder="1234567（ハイフンなし7桁）" style="max-width:200px">
      <label>新しい住所<span class="req">必須</span></label>
      <input type="text" id="f_address" placeholder="東京都目黒区〇〇 1-2-3 〇〇マンション101">`;
  } else if(P_CATEGORY==="contact_email"){
    html=`<label>新しいメールアドレス<span class="req">必須</span></label>
      <input type="email" id="f_email" placeholder="example@domain.com">
      <div class="note">※ポータル/日報のログイン用メールとは別の、連絡先としてのメールアドレスです</div>`;
  } else if(P_CATEGORY==="bank_account"){
    html=`${HAS_BANK?'<div class="note" style="margin-bottom:8px">すでに口座が登録されています。変更する項目だけでなく、口座情報はすべて入力し直してください（一部だけの上書きはできません）。</div>':""}
      <div class="row2"><div><label>銀行コード（4桁）<span class="req">必須</span></label><input type="text" inputmode="numeric" maxlength="4" id="f_bankCode"></div>
      <div><label>銀行名（任意）</label><input type="text" id="f_bankName"></div></div>
      <div class="row2"><div><label>支店コード（3桁）<span class="req">必須</span></label><input type="text" inputmode="numeric" maxlength="3" id="f_branchCode"></div>
      <div><label>支店名（任意）</label><input type="text" id="f_branchName"></div></div>
      <div class="row2"><div><label>口座種別<span class="req">必須</span></label><select id="f_acctType">${ACCOUNT_TYPES.map(t=>`<option value="${t.v}">${t.l}</option>`).join("")}</select></div>
      <div><label>口座番号（7桁）<span class="req">必須</span></label><input type="text" inputmode="numeric" maxlength="7" id="f_acctNum"></div></div>
      <label>受取人名（半角カタカナ）<span class="req">必須</span></label>
      <input type="text" id="f_acctKana" placeholder="例: ﾆｼﾞｽﾀｲﾙ ﾀﾛｳ">
      <label>通帳・キャッシュカードの写真（確認用添付・任意）</label>
      <input type="file" accept="image/*,.pdf" id="f_bankProof">
      <div class="note">※口座名義と番号が確認できる画像があれば添付してください</div>`;
  } else if(P_CATEGORY==="id_document"){
    html=`<label>提出する身分証明書の種類<span class="req">必須</span></label>
      <select id="f_idDocType"><option value="">選択してください</option>${ID_DOC_TYPES.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join("")}</select>
      <label>身分証明書の画像・PDF添付<span class="req">必須</span></label>
      <input type="file" accept="image/*,.pdf" id="f_idDocFile">
      <div class="note">※表面・裏面がある場合は1つのPDFか画像にまとめて添付してください</div>`;
  }
  el.innerHTML=`<div class="dyn">${html}</div>`;
}
async function submitPersonal(){
  const msg=$("pMsg"); msg.innerHTML=""; const btn=$("pSubmitBtn");
  try{
    let field="", value="";
    if(P_CATEGORY==="phone"){
      value=$("f_phone").value.trim(); if(!value) throw new Error("新しい電話番号を入力してください");
      field="phone";
    } else if(P_CATEGORY==="name"){
      const ln=$("f_lastName").value.trim(),fn=$("f_firstName").value.trim(),lk=$("f_lastKana").value.trim(),fk=$("f_firstKana").value.trim();
      if(!ln||!fn||!lk||!fk) throw new Error("氏名・フリガナはすべて入力してください");
      btn.disabled=true; btn.textContent="送信中…";
      await submitEmployeeChange("name",`${ln} ${fn}`);
      await submitEmployeeChange("kana",`${lk} ${fk}`);
      afterPersonalSubmit(); return;
    } else if(P_CATEGORY==="address"){
      const zip=$("f_zip").value.trim(), addr=$("f_address").value.trim();
      if(!addr) throw new Error("新しい住所を入力してください");
      field="address"; value=zip?`〒${zip} ${addr}`:addr;
    } else if(P_CATEGORY==="contact_email"){
      value=$("f_email").value.trim(); if(!value) throw new Error("新しいメールアドレスを入力してください");
      field="contact_email";
    } else if(P_CATEGORY==="bank_account"){
      const bankCode=$("f_bankCode").value.trim(), branchCode=$("f_branchCode").value.trim(),
        acctNum=$("f_acctNum").value.trim(), acctKana=$("f_acctKana").value.trim();
      if(!bankCode||!branchCode||!acctNum||!acctKana) throw new Error("銀行コード・支店コード・口座番号・受取人名（カナ）は必須です");
      btn.disabled=true; btn.textContent="送信中…";
      const proofFile=$("f_bankProof").files[0];
      let proofPath=""; if(proofFile) proofPath=await uploadAttachment(proofFile);
      const bank={bank_code:bankCode,bank_name:$("f_bankName").value.trim(),branch_code:branchCode,
        branch_name:$("f_branchName").value.trim(),account_type:$("f_acctType").value,
        account_number:acctNum,account_holder_kana:acctKana,proof_file_path:proofPath||undefined};
      await submitEmployeeChange("bank_account",JSON.stringify(bank));
      afterPersonalSubmit(); return;
    } else if(P_CATEGORY==="id_document"){
      const docType=$("f_idDocType").value; const file=$("f_idDocFile").files[0];
      if(!docType) throw new Error("身分証明書の種類を選択してください");
      if(!file) throw new Error("身分証明書の画像・PDFを添付してください");
      btn.disabled=true; btn.textContent="送信中…";
      const filePath=await uploadAttachment(file);
      await submitEmployeeChange("id_document",JSON.stringify({doc_type:docType,file_path:filePath}));
      afterPersonalSubmit(); return;
    } else {
      throw new Error("変更するカテゴリを選択してください");
    }
    btn.disabled=true; btn.textContent="送信中…";
    await submitEmployeeChange(field,value);
    afterPersonalSubmit();
  }catch(e){
    msg.innerHTML=`<div class="msg-err">${esc(e.message||"申請できませんでした")}</div>`;
    btn.disabled=false; btn.textContent="変更申請を送信する";
  }
}
async function submitEmployeeChange(field,value){
  const r=await authed("/rest/v1/rpc/submit_profile_change_request",{method:"POST",
    body:JSON.stringify({p_field:field,p_new_value:value})});
  if(!r.ok) throw new Error(r.body?.message||"申請できませんでした");
}
function afterPersonalSubmit(){
  const catLabel=P_CATEGORIES.find(c=>c.v===P_CATEGORY)?.l||P_CATEGORY;
  notifyProfileApprovers(`🔁 変更申請: ${ME.name}さんが「${catLabel}」を申請しました\nポータル→🔁申請→個人情報変更 の承認パネルからご確認ください`);
  P_CATEGORY=""; renderTabBody(); loadHistory();
  $("tabBody").insertAdjacentHTML("afterbegin",'<div class="msg-ok">申請しました。本部が承認すると反映されます。</div>');
}

   タブ2: 社内システム情報申請
   ============================================================ */
function renderSystemTab(){
  const body=$("tabBody");
  body.innerHTML=`<div class="sec-title">社内システム情報申請（社員用）</div>
    <div class="sec-sub">社内ツール・サービスのID/パスワードの新規登録または変更申請を行います。現在のID・パスワードの値はここには表示されません。</div>
    <label>申請区分<span class="req">必須</span></label>
    <div class="radiorow">
      <label><input type="radio" name="ckind" ${C_KIND==="new"?"checked":""} onchange="setCKind('new')"> 新規登録</label>
      <label><input type="radio" name="ckind" ${C_KIND==="change"?"checked":""} onchange="setCKind('change')"> 変更申請</label>
    </div>
    <label>法人<span class="req">必須</span></label>
    <select id="cCorp" onchange="setCCorp(this.value)">
      ${CORPS.map(c=>`<option value="${c.id}" ${C_CORP===c.id?"selected":""}>${esc(c.name)}</option>`).join("")}
    </select>
    <div id="cDyn"></div>
    <div id="cMsg"></div>
    <button class="btn" style="margin-top:14px" onclick="submitSystem()" id="cSubmitBtn">${C_KIND==="new"?"新規登録を申請する":"この内容で申請する"}</button>`;
  renderCDyn();
}
function setCKind(k){ C_KIND=k; C_CREDID=""; renderSystemTab(); }
function setCCorp(v){ C_CORP=v; C_LIST=null; C_CREDID=""; renderCDyn(); if(C_KIND==="change") loadCredList(); }
function renderCDyn(){
  const el=$("cDyn");
  if(C_KIND==="new"){
    el.innerHTML=`<div class="dyn">
      <label>カテゴリー<span class="req">必須</span></label>
      <select id="nCategory">${NEW_CATEGORIES.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>
      <label>対象サービス・システム名<span class="req">必須</span></label>
      <input type="text" id="nService" placeholder="例: 社内Slack、Google 広告、東京電力 など">
      <label>希望するID / ユーザー名</label>
      <input type="text" id="nUser" placeholder="例: admin_tokyo@example.com">
      <label>希望するパスワード</label>
      <div class="pwwrap"><input type="password" id="nSecret"><button type="button" onclick="togglePw('nSecret',this)">表示</button></div>
      <label>補足（任意）</label>
      <input type="text" id="nNote" placeholder="用途や利用店舗など">
      <div class="note">※新規登録は本部が内容を確認のうえ、社内システム一覧へ手動で登録します</div>
    </div>`;

  }
  el.innerHTML=`<div class="dyn" id="cDynChange">

function togglePw(id,btn){ const i=$(id); if(i.type==="password"){i.type="text";btn.textContent="隠す"}else{i.type="password";btn.textContent="表示"} }
async function loadCredList(){
  C_CATFILTER="すべて"; C_Q=""; C_CREDID="";
  const r=await infoAuthed("/rest/v1/rpc/list_credentials_for_request",{method:"POST",body:JSON.stringify({p_corp:C_CORP})});
  C_LIST=(r.ok&&Array.isArray(r.body))?r.body:[];
  if(!r.ok) C_LOAD_ERR=r.body?.message||"一覧を取得できませんでした"; else C_LOAD_ERR="";
  renderCChangeArea();
}
// 2026-09-01実機フィードバック対応: 検索入力のたびにこの領域全体を作り直していたため、
// 入力中の<input>要素自体が壊れて日本語IME入力が崩れる不具合があった（最初の1文字だけ
// ローマ字のまま残る等）。検索ボックス・カテゴリチップは「一覧を読み込んだ時」だけ作り、
// 検索・カテゴリ絞り込み・対象選択のたびに更新するのは中の#cPickAreaだけにして、
// 入力中の<input>要素そのものは触らないようにした
function renderCChangeArea(){
  const el=$("cDynChange"); if(!el) return;
  const cats=["すべて",...Array.from(new Set((C_LIST||[]).map(c=>c.category))).sort()];
  el.innerHTML=`
    ${C_LOAD_ERR?`<div class="msg-err">${esc(C_LOAD_ERR)}</div>`:""}
    <label>カテゴリで絞り込み</label>
    <div class="chipbar">${cats.map(c=>`<button class="${C_CATFILTER===c?"active":""}" onclick="setCCatFilter('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`).join("")}</div>
    <label>サービス名で検索</label>
    <input type="search" id="cQ" value="${esc(C_Q)}" oninput="setCQ(this.value)" placeholder="例: 食べログ">
    <div id="cPickArea"></div>
  `;
  updateCPickArea();
}
function updateCPickArea(){
  const el=$("cPickArea"); if(!el) return;
  const filtered=(C_LIST||[]).filter(c=>(C_CATFILTER==="すべて"||c.category===C_CATFILTER)&&(!C_Q||c.service_name.toLowerCase().includes(C_Q.toLowerCase())));
  const selected=(C_LIST||[]).find(c=>c.id===C_CREDID)||null;
  el.innerHTML=`
    <label>変更したい対象<span class="req">必須</span></label>
    <select id="cCredId" onchange="setCCredId(this.value)">
      <option value="">選択してください（${filtered.length}件）</option>
      ${filtered.map(c=>`<option value="${c.id}" ${C_CREDID===c.id?"selected":""}>[${esc(c.category)}] ${esc(c.service_name)}</option>`).join("")}
    </select>
    ${selected?`
    <label>変更したい項目<span class="req">必須</span></label>
    <select id="cField" onchange="setCField(this.value)">
      ${CRED_FIELDS.map(f=>`<option value="${f.v}" ${C_FIELD===f.v?"selected":""}>${f.l}</option>`).join("")}
    </select>
    <label>新しい値<span class="req">必須</span></label>
    ${C_FIELD==="status"?
      `<select id="cValue"><option value="">選択してください</option>${CRED_STATUS_VALUES.map(s=>`<option value="${s}">${s}</option>`).join("")}</select>`:
      `<input type="text" id="cValue" autocomplete="off">`}
    `:""}
  `;
}
function setCCatFilter(c){ C_CATFILTER=c; renderCChangeArea(); } // チップはボタンなのでIMEの心配はなく全体再描画でよい
function setCQ(v){ C_Q=v; updateCPickArea(); } // 検索input自体は再描画しない（IME入力中に壊れるため）
function setCCredId(v){ C_CREDID=v; updateCPickArea(); }
function setCField(v){ C_FIELD=v; updateCPickArea(); }
let C_LOAD_ERR="";
async function submitSystem(){
  const msg=$("cMsg"); msg.innerHTML=""; const btn=$("cSubmitBtn");
  try{
    let notifyText="";
    if(C_KIND==="new"){
      const service=$("nService").value.trim();
      if(!service) throw new Error("対象サービス・システム名を入力してください");
      btn.disabled=true; btn.textContent="送信中…";
      const r=await infoAuthed("/rest/v1/rpc/submit_credential_new_request",{method:"POST",body:JSON.stringify({
        p_corp:C_CORP,p_category:$("nCategory").value,p_service_name:service,
        p_desired_username:$("nUser").value.trim()||null,p_desired_secret:$("nSecret").value.trim()||null,
        p_note:$("nNote").value.trim()||null})});
      if(!r.ok) throw new Error(r.body?.message||"申請できませんでした");
      notifyText=`🔁 変更申請: ${ME.name}さんが社内システムの新規登録「${service}」を申請しました\nポータル→社内情報管理→ID・パスワード管理 の承認待ちからご確認ください`;
    } else {
      if(!C_CREDID) throw new Error("変更したい対象を選んでください");
      const value=$("cValue").value.trim();
      if(!value) throw new Error("新しい値を入力してください");
      btn.disabled=true; btn.textContent="送信中…";
      const r=await infoAuthed("/rest/v1/rpc/submit_credential_change_request",{method:"POST",body:JSON.stringify({
        cred_id:C_CREDID,p_field:C_FIELD,p_new_value:value})});
      if(!r.ok) throw new Error(r.body?.message||"申請できませんでした");
      const selected=(C_LIST||[]).find(c=>c.id===C_CREDID);
      notifyText=`🔁 変更申請: ${ME.name}さんが「${selected?selected.service_name:"社内システム"}」の${CRED_FIELD_LABELS[C_FIELD]||C_FIELD}変更を申請しました\nポータル→社内情報管理→ID・パスワード管理 の承認待ちからご確認ください`;
    }
    notifyCredentialApprovers(notifyText);
    C_CREDID=""; renderSystemTab(); loadHistory();
    $("tabBody").insertAdjacentHTML("afterbegin",'<div class="msg-ok">申請しました。本部が承認すると反映されます。</div>');
  }catch(e){
    msg.innerHTML=`<div class="msg-err">${esc(e.message||"申請できませんでした")}</div>`;
    btn.disabled=false; btn.textContent=C_KIND==="new"?"新規登録を申請する":"この内容で申請する";
  }
}

/* ============================================================
   自分の申請履歴（3種類まとめて新しい順）
   ============================================================ */
async function loadHistory(){
  const jobs=[
    authed(`/rest/v1/profile_change_requests?user_id=eq.${ME.id}&select=id,field,status,requested_at,reject_reason&order=requested_at.desc&limit=20`),
    infoAuthed("/rest/v1/credential_change_requests?select=id,field,status,requested_at,reject_reason&order=requested_at.desc&limit=20"),
    infoAuthed("/rest/v1/credential_new_requests?select=id,service_name,status,requested_at,reject_reason&order=requested_at.desc&limit=20"),
  ];
  const [pr,cr,nr]=await Promise.all(jobs);
  const rows=[
    ...(Array.isArray(pr.body)?pr.body:[]).map(r=>({kind:"📋",label:EMP_FIELD_LABELS[r.field]||r.field,status:r.status,at:r.requested_at,reason:r.reject_reason})),
    ...(Array.isArray(cr.body)?cr.body:[]).map(r=>({kind:"🔐",label:CRED_FIELD_LABELS[r.field]||r.field,status:r.status,at:r.requested_at,reason:r.reject_reason})),
    ...(Array.isArray(nr.body)?nr.body:[]).map(r=>({kind:"➕",label:"新規登録: "+r.service_name,status:r.status,at:r.requested_at,reason:r.reject_reason})),
  ].sort((a,b)=>a.at<b.at?1:-1);
  const el=$("histBody"); if(!el) return;
  if(rows.length===0){ el.innerHTML='<p style="color:var(--muted);font-size:13px">申請履歴はまだありません</p>'; return; }
  el.innerHTML=rows.map(r=>{
    const p=STATUS_PILL[r.status]||[r.status,""];
    return `<div class="hist-row">
      <span>${r.kind} ${esc(r.label)}${r.reason?` <span style="color:var(--bad)">（${esc(r.reason)}）</span>`:""}</span>
      <span class="hist-meta">${new Date(r.at).toLocaleDateString("ja-JP")} <span class="pill ${p[1]}">${p[0]}</span></span>
    </div>`;
  }).join("");
}
