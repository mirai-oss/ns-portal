  }
  for(let i=0;i<steps.length;i++){
    const s=steps[i];
    const body={template_id:tplId,title:s.title.trim(),assignee_id:s.assignee_id||null,offset_days:s.offset_days||0,due_time:s.due_time||null,sort_order:(i+1)*10,kind:s.kind||"step",store_scope:s.store_scope||null,store_ids:(s.store_scope==="custom"&&s.store_ids&&s.store_ids.length)?s.store_ids:null,is_binary:!!s.is_binary,requires_photo:!!s.requires_photo,procedure_note:(s.procedure_note||"").trim()||null};
    if(s.id){
      await authed(`/rest/v1/hq_task_template_steps?id=eq.${s.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});
    } else {
      await authed("/rest/v1/hq_task_template_steps",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});
    }
  }
  await authed(`/rest/v1/hq_task_members?template_id=eq.${tplId}`,{method:"DELETE"});
  if(payload.visibility==="members"){
    const sel=[...$("tp-members").selectedOptions].map(o=>o.value);
    if(sel.length) await authed("/rest/v1/hq_task_members",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(sel.map(uid=>({template_id:tplId,user_id:uid})))});
  }
  await fetchTemplates();
  goBack(u);
}

/* ---------- C-6: テンプレのCSV一括登録 ---------- */
// CSVは繰り返しテンプレの一括登録なので、期限は実日付ではなく「対象日から何日後か」で書く
// （テンプレは毎回別の対象日で生成されるため、1つの日付では表せない）。
// 旧雛形の列名「期限オフセット」も引き続き読み込めるようにしてある。
const CSV_HEADERS=["行種別","タイトル","頻度","曜日/日","法人","担当メール","期限（対象日の何日後）","時刻","注意事項","公開範囲"];
const CSV_WEEKDOW={"日":0,"月":1,"火":2,"水":3,"木":4,"金":5,"土":6};
const CSV_FREQ={"毎日":"daily","毎週":"weekly","毎月":"monthly"};
function csvEscape(v){
  const s=String(v??"");
  return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function buildTemplateCsvSample(){
  const rows=[CSV_HEADERS,
    ["template","入金確認（毎日）","毎日","","N-Style","","0","18:00","レジ締め後に確認","全員"],
    ["step","レジ金額の入力","","","","tanaka@example.com","0","18:00","",""],
    ["step","差異チェック","","","","","0","18:30","",""],
    ["template","月次精算（毎月1日）","毎月","1","LiveGate","","3","","","全員"],
    ["step","経費集計","","","","suzuki@example.com","3","",""],
  ];
  return rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
}
function downloadTextFile(filename,text,mime){
  const blob=new Blob(["﻿"+text],{type:(mime||"text/csv")+";charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
/* E-3(B2): 登録済みテンプレ一覧のCSVエクスポート（列は雛形DLと同形式＝そのまま再アップロード可能） */
const CSV_FREQ_REV={daily:"毎日",weekly:"毎週",monthly:"毎月"};
const CSV_WEEKDOW_REV=["日","月","火","水","木","金","土"];
async function exportTemplatesCsv(){
  const list=filteredTemplates();
  if(!list.length){ alert("エクスポート対象のテンプレートがありません（絞り込みを確認してください）"); return; }
  const ids=list.map(t=>t.id);
  const sr=await authed(`/rest/v1/hq_task_template_steps?template_id=in.(${ids.join(",")})&order=template_id,sort_order`);
  const stepsByTpl={};
  if(sr.ok&&Array.isArray(sr.body)) sr.body.forEach(s=>{ (stepsByTpl[s.template_id]=stepsByTpl[s.template_id]||[]).push(s); });
  const rows=[CSV_HEADERS];
  list.forEach(tpl=>{
    const dow=tpl.freq==="weekly"?(CSV_WEEKDOW_REV[tpl.weekly_dow]||""):(tpl.freq==="monthly"?String(tpl.monthly_dom||""):"");
    rows.push(["template",tpl.title,CSV_FREQ_REV[tpl.freq]||tpl.freq,dow,tpl.corp,"",String(tpl.due_offset_days||0),(tpl.due_time||"").slice(0,5),tpl.notes||"",tpl.visibility==="members"?"指定":"全員"]);
    (stepsByTpl[tpl.id]||[]).forEach(s=>{
      const email=s.assignee_id?((USERS.find(x=>x.id===s.assignee_id)||{}).email||""):"";
      rows.push(["step",s.title,"","","",email,String(s.offset_days||0),(s.due_time||"").slice(0,5),"",""]);
    });
  });
  downloadTextFile(`hq_template_export_${todayStr()}.csv`,rows.map(r=>r.map(csvEscape).join(",")).join("\r\n"));
}
function parseCsv(text){
  const rows=[]; let row=[]; let field=""; let inQuotes=false;
  const s=text.replace(/^﻿/,"");
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(inQuotes){
      if(c==='"'){ if(s[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field+=c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===","){ row.push(field); field=""; }
      else if(c==="\n"){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c==="\r"){ /* skip, \n handles the break */ }
      else field+=c;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(v=>v.trim()!==""));
}
function validateCsvRows(rows){
  if(!rows.length) return {templates:[],errors:[{line:0,reason:"データがありません"}]};
  const header=rows[0].map(h=>h.trim());
  const idx=name=>header.indexOf(name);
  const need=["行種別","タイトル"];
  for(const n of need){ if(idx(n)<0) return {templates:[],errors:[{line:1,reason:`列「${n}」が見つかりません（雛形CSVの列名を変更しないでください）`}]}; }
  const offsetIdx=idx("期限（対象日の何日後）")>=0?idx("期限（対象日の何日後）"):idx("期限オフセット");
  const col={kind:idx("行種別"),title:idx("タイトル"),freq:idx("頻度"),dow:idx("曜日/日"),corp:idx("法人"),email:idx("担当メール"),offset:offsetIdx,time:idx("時刻"),notes:idx("注意事項"),vis:idx("公開範囲")};
  const templates=[]; const errors=[]; let cur=null;
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const line=i+1;
    const kind=(r[col.kind]||"").trim();
    const title=(r[col.title]||"").trim();
    if(!kind){ continue; }
    if(kind==="template"){
      if(!title){ errors.push({line,reason:"タイトルが空です"}); cur=null; continue; }
      const freqRaw=(r[col.freq]||"").trim();
      const freq=CSV_FREQ[freqRaw]||(["daily","weekly","monthly"].includes(freqRaw)?freqRaw:null);
      if(!freq){ errors.push({line,reason:`頻度「${freqRaw}」は毎日／毎週／毎月のいずれかで指定してください`}); cur=null; continue; }
      const corp=(r[col.corp]||"").trim();
      if(!activeCorps().some(c=>c.name===corp)){ errors.push({line,reason:`法人「${corp}」が見つかりません（法人管理で有効な法人名を指定してください）`}); cur=null; continue; }
      let weekly_dow=null, monthly_dom=null;
      const dowRaw=(r[col.dow]||"").trim();
      if(freq==="weekly"){
        weekly_dow=CSV_WEEKDOW[dowRaw]??(/^[0-6]$/.test(dowRaw)?+dowRaw:null);
        if(weekly_dow===null){ errors.push({line,reason:`毎週テンプレには「曜日/日」に日〜土 または 0〜6 を指定してください`}); cur=null; continue; }
      } else if(freq==="monthly"){
        monthly_dom=/^\d+$/.test(dowRaw)?+dowRaw:null;
        if(!monthly_dom||monthly_dom<1||monthly_dom>31){ errors.push({line,reason:`毎月テンプレには「曜日/日」に1〜31の日付を指定してください`}); cur=null; continue; }
      }
      const visRaw=(r[col.vis]||"").trim();
      const visibility=(visRaw==="指定"||visRaw==="members")?"members":"all";
      cur={line,title,corp,freq,weekly_dow,monthly_dom,
        due_offset_days:+((r[col.offset]||"0").trim())||0,
        due_time:(r[col.time]||"").trim()||null,
        notes:(r[col.notes]||"").trim(),
        visibility,
        steps:[]};
      templates.push(cur);
    } else if(kind==="step"){
      if(!cur){ errors.push({line,reason:"この工程行より前にテンプレート行（行種別=template）が必要です"}); continue; }
      if(!title){ errors.push({line,reason:"工程のタイトルが空です"}); continue; }
      const emailRaw=(r[col.email]||"").trim();
      let assignee_id=null;
      if(emailRaw){
        const usr=USERS.find(x=>(x.email||"").toLowerCase()===emailRaw.toLowerCase());
        if(!usr){ errors.push({line,reason:`担当メール「${emailRaw}」に一致する本部メンバーが見つかりません`}); continue; }
        if(!ASSIGNABLE_ROLES.includes(usr.role)){ errors.push({line,reason:`担当メール「${emailRaw}」は本部・社長・チーム長以外のため指定できません`}); continue; }
        assignee_id=usr.id;
      }
      cur.steps.push({line,title,assignee_id,offset_days:+((r[col.offset]||"0").trim())||0,due_time:(r[col.time]||"").trim()||null});
    } else {
      errors.push({line,reason:`行種別「${kind}」はtemplateまたはstepで指定してください`});
    }
  }
  templates.forEach(t=>{ if(!t.steps.length) errors.push({line:t.line,reason:`テンプレート「${t.title}」に工程行がありません（1件以上必要）`}); });
  return {templates:templates.filter(t=>t.steps.length),errors};
}

async function commitCsvImport(u){
  const msg=$("csv-msg"); msg.className="err"; msg.textContent="取り込み中…";
  const btn=$("csv-commit"); btn.disabled=true;
  let ok=0,fail=0;

      title:t.title,corp:t.corp,freq:t.freq,weekly_dow:t.weekly_dow,monthly_dom:t.monthly_dom,
      due_offset_days:t.due_offset_days,due_time:t.due_time,notes:t.notes,visibility:t.visibility,created_by:ME.id
    })});
    if(!r.ok||!r.body||!r.body[0]){ fail++; continue; }
    const tplId=r.body[0].id;
    const sr=await authed("/rest/v1/hq_task_template_steps",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(
      t.steps.map((s,i)=>({template_id:tplId,title:s.title,assignee_id:s.assignee_id,offset_days:s.offset_days,due_time:s.due_time,sort_order:(i+1)*10,kind:"step"}))
    )});
    if(sr.ok) ok++; else fail++;
  }
  await fetchTemplates();
  msg.className=fail?"err":"err msg-ok";
  msg.textContent=`完了: ${ok}件のテンプレートを作成しました${fail?`（${fail}件は失敗しました）`:""}`;
  btn.disabled=false;
  setTimeout(()=>goBack(u),1200);
}

function buildPreviewTask(){
  const title=($("tp-title")?.value||"").trim()||"（無題）";
  const corp=$("tp-corp")?.value||(CORPS[0]?.name||"");
  const freq=$("tp-freq")?.value||"daily";
  const notes=($("tp-notes")?.value||"").trim();
  const due_offset=TPL_DUE_OFFSET||0;
  const due_time=$("tp-duetime")?.value||null;
  const today=todayStr();
  const addDays=(base,n)=>{ const d=new Date(base+"T00:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
  const due_date=addDays(today,due_offset);
  const steps=TPL_STEPS.filter(s=>s.title.trim()).map((s,i)=>{
    const step_due=addDays(today,s.offset_days||0);
    if(s.kind==="check" && s.store_scope){
      const list=(s.store_scope==="custom"?STORES.filter(x=>(s.store_ids||[]).includes(x.id)):(s.store_scope==="all"?STORES:STORES.filter(x=>x.is_active)));
      return list.map((store,j)=>({id:`preview-${i}-${j}`,template_step_id:`preview-tpl-${i}`,title:s.title,assignee_id:s.assignee_id||null,due_date:step_due,due_time:s.due_time||null,sort_order:(i+1)*10,kind:s.kind,is_binary:!!s.is_binary,requires_photo:!!s.requires_photo,store_id:store.id,completed_at:null}));
    }
    return [{id:`preview-${i}`,template_step_id:null,title:s.title,assignee_id:s.assignee_id||null,due_date:step_due,due_time:s.due_time||null,sort_order:(i+1)*10,kind:s.kind||"step",is_binary:!!s.is_binary,requires_photo:!!s.requires_photo,store_id:null,completed_at:null}];
  }).flat();
  return {id:"preview-task",template_id:null,title,corp,freq,target_date:today,due_date,due_time,status:"todo",notes,
    visibility:$("tp-vis")?.value||"all",completed_at:null,created_by:ME.id,created_at:new Date().toISOString(),
    hq_task_steps:steps,_links:[],_photos:[],_activity:[]};
}

async function markNotificationsRead(){

  await authed(`/rest/v1/hq_notifications?id=in.(${unreadIds.join(",")})`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({read_at:new Date().toISOString()})});
  NOTIFICATIONS.forEach(n=>{ if(!n.read_at) n.read_at=new Date().toISOString(); });
  NOTIF_UNREAD=0;

const CHATWORK_FN_URL=SUPA_URL+"/functions/v1/notify-chatwork";
async function sendNotifications(items){
  for(const it of (items||[])){
    if(!it||!it.channel_kind||!it.target) continue;
    const text=(it.keyword?`[${it.keyword}] `:"")+it.title+(it.body?`\n${it.body}`:"");
    try{
      if(it.channel_kind==="lark_webhook"){
        await fetch(it.target,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({msg_type:"text",content:{text}})});
      } else if(it.channel_kind==="chatwork"){
        const s=sess.get();
        await fetch(CHATWORK_FN_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({room_id:it.target,body:text})});
      }
    }catch(e){ /* 通知送信の失敗は握りつぶす（アプリ内通知は既に記録済み） */ }
  }
}

let PAST_MONTHS=[];

async function fetchPastMonths(){
  const monthStart=monthStartStr();
  const r=await authed(`/rest/v1/hq_tasks?status=eq.done&completed_at=lt.${monthStart}&select=completed_at&order=completed_at.desc&limit=1000`);
  const set=new Set();
  if(r.ok&&Array.isArray(r.body)) r.body.forEach(t=>{ set.add(t.completed_at.slice(0,7)); });
  PAST_MONTHS=[...set].sort().reverse();
  if(!PAST_MONTH||!PAST_MONTHS.includes(PAST_MONTH)) PAST_MONTH=PAST_MONTHS[0]||null;
  if(PAST_MONTH) await fetchPastTasks(PAST_MONTH);
}
async function fetchPastTasks(ym){

  PAST_TASKS=(r.ok&&Array.isArray(r.body))?r.body:[];
}

    const sortMax=CORPS.length?Math.max(...CORPS.map(c=>c.sort_order)):0;
    const r=await authed("/rest/v1/corporations",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({name,sort_order:sortMax+10})});
    if(!r.ok){$("corp-msg").textContent="追加できませんでした（同名の法人がある可能性があります）";return}
    await fetchCorps(); renderCorps(u);
  };
}

/* ---------- 権限設定（マスター専用） ----------
   画面のボタンを出すかどうかだけでなく、DB側のRLS（hq_feature_allowed）も
   この設定を見ている。つまりURL直打ちやAPI直叩きでも同じ制限がかかる。 */
function renderPerms(u){
  CURRENT_RENDER=()=>renderPerms(u);
  const keys=Object.keys(FEATURE_LABEL);
  $("app").innerHTML=`
  <div class="topbar"><h1>🔑 権限設定</h1><div class="who"><button class="linkbtn" id="back">← 戻る</button></div></div>
  <div class="card">
    <div class="meta" style="margin-bottom:12px">機能ごとに「どこまでの役割が使えるか」を決めます。変更できるのはマスターアカウントだけです。</div>
    ${keys.map(k=>`<div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div style="font-weight:600;margin-bottom:6px">${esc(FEATURE_LABEL[k])}</div>
      <select data-perm="${k}">
        ${Object.entries(LEVEL_LABEL).map(([lv,label])=>`<option value="${lv}" ${(FEATURE_PERMS[k]||"manage")===lv?"selected":""}>${esc(label)}</option>`).join("")}
      </select>
    </div>`).join("")}
    <button class="btn" style="margin-top:16px" id="perm-save">保存する</button>
    <div class="err" id="perm-msg"></div>
    <div class="meta" style="margin-top:12px">※ 自分のChatwork通知ルームの登録は、通知設定の権限に関係なくボード右上の「🟢 Chatwork ID」から誰でも行えます。</div>
  </div>`;
  $("back").onclick=()=>goBack(u);
  $("perm-save").onclick=async()=>{
    const msg=$("perm-msg"); msg.className="err"; msg.textContent="保存中…";
    const rows=keys.map(k=>({feature:k,min_level:document.querySelector(`[data-perm="${k}"]`).value,updated_at:new Date().toISOString(),updated_by:ME.id}));
    const r=await authed("/rest/v1/hq_feature_permissions",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
    if(!r.ok){ msg.textContent="保存できませんでした（マスターアカウントのみ変更できます）"; return; }
    await fetchFeaturePerms();
    renderPerms(u);   // 画面ごと作り直すのでメッセージは描画後にセットする
    $("perm-msg").className="err msg-ok"; $("perm-msg").textContent="保存しました";
  };
}

/* ---------- メイン ---------- */
function renderLogin(err){
  $("app").innerHTML=`<div class="card">
    <p style="margin-bottom:10px">ログインが必要です。ポータルからアクセスしてください。</p>
    <a class="btn" href="index.html">← ポータルへ</a>
    <div class="err">${esc(err||"")}</div>
  </div>`;
}
async function main(){
  if(!sess.get()){renderLogin();return}
  const u=await fetchMe();
  if(!u){sess.clear();renderLogin("セッションが切れました。ポータルから再度ログインしてください。");return}
  if(u.is_active===false){renderLogin("このアカウントは無効化されています。");return}
  ME=u;
  await fetchUsers(); await fetchStores(); await fetchCorps(); await fetchFeaturePerms();
  await ensureTodayGenerated();
  await Promise.all([fetchBoard(), fetchNotifications(), fetchMyChatwork()]);
  runAlertChecks();
  // 履歴の起点。これ以降の画面遷移はpushNav()で1階層ずつ積む（戻る操作の基準になる）
  try{ history.replaceState({hqNav:0},"","tasks.html"); }catch(e){}
  const openId=qs.get("task");
  if(openId){ openDetail(openId); return; }
  // 全面刷新Phase1: ポータルシェルの「⚙️管理」サブメニューから ?page=perms|corps|notify|past で直接開けるようにする
  // （NAV_STACKへは積まない＝「戻る」を押すと素直にボードへ戻る設計。権限が無ければ静かにボードへフォールバック）
  if(PAGE==="perms"&&isMaster(u)){ VIEW="perms"; renderPerms(u); return; }
  if(PAGE==="corps"&&canFeature(u,"corps")){ VIEW="corps"; renderCorps(u); return; }
  if(PAGE==="notify"&&canFeature(u,"notify")){ VIEW="notify"; $("app").innerHTML='<div class="spin">読み込み中…</div>'; await fetchNotifySettings(); renderNotify(u); return; }
  if(PAGE==="past"){ VIEW="past"; $("app").innerHTML='<div class="spin">読み込み中…</div>'; await fetchPastMonths(); renderPast(u); return; }
  renderBoard(u);
}
main();

/* ---------- B-5: 画面端の右スワイプで前の画面に戻る ----------
   自前のスワイプ検出は廃止。画面遷移をpushStateで履歴に積むようにしたため、
   OS標準の戻る操作（iOSの左端スワイプ・Androidの戻るジェスチャ／戻るボタン）が
   そのまま「1個前の画面」に戻る。自前検出を残すとOSの戻ると二重に発火して
   2画面分戻ってしまうため、意図的に削除している。 */
</script>
