<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>N-Styleグループ ポータル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐔</text></svg>">
<style>
:root{
  --bg:#f5f4f1; --card:#ffffff; --ink:#26221e; --muted:#8a8377;
  --accent:#c8401f; --accent2:#a33318; --line:#e7e3dc; --ok:#2e7d32;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1d1b18; --card:#282521; --ink:#f0ece5; --muted:#a29a8c; --line:#3a362f;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:32px 20px 60px}
header{text-align:center;margin-bottom:28px}
header .logo{font-size:40px}
header h1{font-size:22px;margin-top:6px;letter-spacing:.04em}
header p{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
input,select.inp{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--accent);border-color:transparent}
.btn{display:block;width:100%;margin-top:20px;padding:13px;font-size:16px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sub{background:transparent;color:var(--muted);border:1px dashed var(--muted);font-weight:400}
.err{color:#c62828;font-size:13px;margin-top:12px;text-align:center;min-height:1em}
.msg-ok{color:var(--ok)}
.userbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.userbar .who{font-size:15px}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent);color:#fff;margin-left:6px;vertical-align:1px}
.badge.master{background:#6a1b9a}
.linkbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
a.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;text-decoration:none;color:var(--ink);transition:transform .08s,box-shadow .08s}
a.tile:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.tile .ico{font-size:30px}
.tile h3{font-size:16px;margin-top:8px}
.tile p{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.tile .tag{display:inline-block;font-size:10px;margin-top:8px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tile .tag.sso{color:var(--ok);border-color:var(--ok)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:22px;line-height:1.7}
details{margin-top:26px}
summary{font-size:13px;color:var(--muted);cursor:pointer;text-align:center}
.hidden{display:none}
.spin{text-align:center;color:var(--muted);padding:60px 0}
/* 検索 */
.searchbox{position:relative;margin-bottom:18px}
.searchbox input{padding-left:42px}
.searchbox .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.sr{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:8px;overflow:hidden}
.sr a{display:flex;align-items:center;gap:10px;padding:12px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line);font-size:14px}
.sr a:last-child{border-bottom:none}
.sr a:hover{background:var(--bg)}
.sr .where{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.sr .soon{margin-left:auto;font-size:11px;color:#b58a00;white-space:nowrap}
/* お知らせ */
.posthead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.posthead h2{font-size:16px}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.post .pt{font-size:15px;font-weight:600}
.post .pm{font-size:11px;color:var(--muted);margin-top:2px}
.post .pb{font-size:14px;margin-top:8px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.post .pin{color:var(--accent);font-size:12px;margin-right:4px}
.post a.plink{color:var(--accent);font-size:13px;word-break:break-all}
.ytwrap{position:relative;padding-top:56.25%;margin-top:10px;border-radius:10px;overflow:hidden}
.ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.post .pdel{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:2px;float:right}
/* 権限設定 */
.pm-scroll{overflow-x:auto;margin-top:10px}
table.pm{border-collapse:collapse;width:100%;font-size:13px}
table.pm th,table.pm td{border:1px solid var(--line);padding:8px 6px;text-align:center;white-space:nowrap}
table.pm th:first-child,table.pm td:first-child{text-align:left;padding-left:10px}
table.pm th{background:var(--bg);font-weight:600;font-size:12px}
table.pm input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--accent);cursor:pointer}
.sec-title{font-size:15px;font-weight:600;margin:26px 0 4px}
.sec-sub{font-size:12px;color:var(--muted);line-height:1.6}
.ov-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.ov-row .nm{flex:1;min-width:120px;font-size:14px}
.ov-row select{padding:8px 10px;font-size:14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.ov-row select.ovon{border-color:var(--ok);color:var(--ok);font-weight:600}
.ov-row select.ovoff{border-color:#c62828;color:#c62828;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">🐔</div>
  <h1>N-Styleグループ ポータル</h1>
  <p>統合アカウントで各システムへ</p>
</header>
<div id="app"><div class="spin">読み込み中…</div></div>
</div>
<script>
const SUPA_URL="https://uuvsxzhpxtghojoubjcc.supabase.co";
const SUPA_KEY="sb_publishable_MrwPJAx_Ws_fdRutprKCiQ_dg3wCiTr"; // 公開用キー（秘密情報ではない）
const LS_KEY="nsportal_session_v1";
const ROLE_NAME={CEO:"社長",HQ:"本部",TEAM:"チーム長",TENCHO:"店長",SHAIN:"社員",AL:"アルバイト"};
const ROLE_ORDER=["CEO","HQ","TEAM","TENCHO","SHAIN","AL"];

const SYSTEMS=[
 {key:"hqtasks", ico:"📌", name:"本部タスク", desc:"精算・広告費など本部ルーティンの進捗管理",
  url:"tasks.html", roles:["TEAM","HQ","CEO"], login:"このアカウントでOK", sso:true},
 {key:"keiei", ico:"📊", name:"経営ダッシュボード", desc:"売上・広告・PL・入金・全店比較",
  url:"https://mirai-oss.github.io/tori-dashboard/", roles:["TENCHO","TEAM","HQ","CEO"], login:"統合ログイン対応", sso:true},
 {key:"seisan", ico:"🧾", name:"精算ダッシュボード", desc:"業務委託店舗の精算書・振込管理",
  url:"https://mirai-oss.github.io/seisan-dashboard/", roles:["HQ","CEO"], login:"統合ログイン対応", sso:true},
 {key:"joho", ico:"🗂️", name:"社内情報管理", desc:"法人・店舗・契約・口座などの重要情報",
  url:"https://ns-info-system.vercel.app", roles:["TEAM","HQ","CEO"], login:"専用アカウント（統合予定）"},
 {key:"nippo", ico:"📝", name:"日報・週報", desc:"日報の提出・確認・タスク",
  url:"https://mirai-oss.github.io/nippo/", roles:["AL","SHAIN","TENCHO","TEAM","HQ","CEO"], login:"このアカウントでOK", sso:true},
];

// 「どこで何ができるか」の案内インデックス（検索用）。準備中の機能も載せて迷子を防ぐ
const GUIDE=[
 {q:"売上 前年比 客単価 日別 月次 比較 f率 l率 原価 人件費", label:"売上・原価・人件費を見る", sys:"keiei"},
 {q:"広告 費用対効果 媒体 ホットペッパー 食べログ ぐるなび", label:"広告の費用対効果を見る・入力する", sys:"keiei"},
 {q:"入金 口座 振込 通帳 差額", label:"入金の確認・口座CSV取込", sys:"keiei"},
 {q:"予約 コース 席のみ", label:"予約データを見る", sys:"keiei"},
 {q:"口コミ レビュー 星 グーグル google", label:"Google口コミの推移を見る", sys:"keiei"},
 {q:"pl 経費 販管費 損益", label:"PL・経費を見る・入力する", sys:"keiei"},
 {q:"精算 委託 振込金額 請求 精算書", label:"業務委託店舗の精算書・振込管理", sys:"seisan"},
 {q:"契約 口座情報 賃貸 物件 仕入先 業者 id パスワード 金庫 給与 融資 借入", label:"会社の重要情報（契約・口座・仕入先など）", sys:"joho"},
 {q:"日報 週報 提出 報告", label:"日報・週報を提出する", sys:"nippo"},
 {q:"タスク 依頼 やること", label:"タスクの確認・依頼", sys:"nippo"},
 {q:"パスワード 変更", label:"パスワードを変更する（このページ下部）", sys:null},
 {q:"アカウント 発行 追加 新入社員 入社", label:"アカウント発行は本部へ連絡（日報の管理画面から発行）", sys:"nippo"},
 {q:"チェックシート オープン クローズ 清掃 ルーティン", label:"店舗チェックシート", soon:true},
 {q:"レシピ マニュアル 仕込み ドリンク 作り方 動画", label:"レシピ・マニュアル", soon:true},
 {q:"シフト 希望 人数", label:"シフト作成・シミュレーション", soon:true},
 {q:"打刻 タイムカード 出勤 退勤", label:"打刻", soon:true},
 {q:"発注 食材 仕入 数量", label:"発注管理", soon:true},
 {q:"カレンダー 予定 スケジュール", label:"カレンダー連携", soon:true},
];
let POSTS=null;   // 掲示板の投稿一覧
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sess={get:()=>{try{return JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return null}},
            set:v=>localStorage.setItem(LS_KEY,JSON.stringify(v)),
            clear:()=>localStorage.removeItem(LS_KEY)};
let ME=null;            // 自分のusers行
let PERMS=null;         // {role:{system_key:bool}} 役割の既定（DBから）
let MY_OVR={};          // 自分の例外 {system_key:bool}
let VIEW="home";        // home | settings
let USERS=[];           // 設定画面用ユーザー一覧
let OVR_USER=null;      // 設定画面で選択中のユーザーid
let OVR_MAP={};         // 選択中ユーザーの例外

async function api(path,opt={},token){
  const r=await fetch(SUPA_URL+path,{...opt,headers:{
    "apikey":SUPA_KEY,"Content-Type":"application/json",
    ...(token?{"Authorization":"Bearer "+token}:{}),...(opt.headers||{})}});
  let body=null; const tx=await r.text(); try{body=tx?JSON.parse(tx):null}catch(e){}
  return {ok:r.ok,status:r.status,body};
}
async function authed(path,opt={}){
  const s=sess.get(); if(!s) return {ok:false,status:401,body:null};
  let r=await api(path,opt,s.at);
  if(r.status===401){ if(!await refresh()) return r; r=await api(path,opt,sess.get().at); }
  return r;
}

async function login(email,pw){
  const r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password:pw})});
  if(!r.ok) throw new Error(r.body?.error_code==="invalid_credentials"?"メールアドレスまたはパスワードが違います":"ログインエラー: "+(r.body?.msg||r.status));
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});
  return r.body;
}
async function refresh(){
  const s=sess.get(); if(!s?.rt) return false;
  const r=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.rt})});
  if(!r.ok){sess.clear();return false}
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});
  return true;
}
async function fetchMe(){
  const s=sess.get(); if(!s) return null;
  const r=await authed(`/rest/v1/users?id=eq.${s.uid}&select=*`);
  if(!r.ok||!Array.isArray(r.body)||!r.body[0]) return null;
  return r.body[0];
}
async function fetchPerms(){
  // 役割の既定と自分の例外。失敗してもコード内の初期値で動く（PERMS=null）
  const s=sess.get(); if(!s) return;
  const [p,o]=await Promise.all([
    authed("/rest/v1/portal_permissions?select=role,system_key,allowed"),
    authed(`/rest/v1/portal_user_overrides?user_id=eq.${s.uid}&select=system_key,allowed`)
  ]);
  if(p.ok&&Array.isArray(p.body)&&p.body.length){
    PERMS={};
    p.body.forEach(r=>{ (PERMS[r.role]=PERMS[r.role]||{})[r.system_key]=r.allowed; });
  }
  MY_OVR={};
  if(o.ok&&Array.isArray(o.body)) o.body.forEach(r=>{ MY_OVR[r.system_key]=r.allowed; });
}
function canSee(sy,u){
  if(u.is_master) return true;
  if(sy.key in MY_OVR) return MY_OVR[sy.key];
  if(PERMS&&PERMS[u.role]&&(sy.key in PERMS[u.role])) return PERMS[u.role][sy.key];
  return sy.roles.includes(u.role); // DB未設定時の初期値
}

/* ---------- 掲示板 ---------- */
const canPost=u=>!!(u&&(u.is_master||u.role==="CEO"||u.role==="HQ"));
async function fetchPosts(){
  let r=await authed("/rest/v1/portal_posts?select=*,author:users(name)&order=pinned.desc,created_at.desc&limit=100");
  if(!r.ok) r=await authed("/rest/v1/portal_posts?select=*&order=pinned.desc,created_at.desc&limit=100");
  POSTS=(r.ok&&Array.isArray(r.body))?r.body:[];
}
function ytId(u){ const m=String(u||"").match(/(?:youtu\.be\/|[?&]v=|shorts\/|embed\/)([\w-]{11})/); return m?m[1]:null; }
function fmtD(t){ const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function postHtml(p,u){
  const yid=ytId(p.url);
  return `<div class="post" data-pid="${p.id}">
    ${canPost(u)?`<button class="pdel" data-del="${p.id}">削除</button><button class="pdel" data-edit="${p.id}">✏️ 編集</button>`:""}
    <div class="pt">${p.pinned?'<span class="pin">📌</span>':""}${esc(p.title)}</div>
    <div class="pm">${fmtD(p.created_at)}${p.author&&p.author.name?` ／ ${esc(p.author.name)}`:""}</div>
    ${p.body?`<div class="pb">${esc(p.body)}</div>`:""}
    ${yid?`<div class="ytwrap"><iframe src="https://www.youtube.com/embed/${yid}" title="動画" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`
        :(p.url?`<div style="margin-top:8px"><a class="plink" href="${esc(p.url)}" target="_blank" rel="noopener">🔗 ${esc(p.url)}</a></div>`:"")}
  </div>`;
}
let EDIT_ID=null;   // 編集中の投稿id（null=新規投稿モード）
function wirePostDeletes(u){
  document.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick=async()=>{
      if(!confirm("この投稿を削除しますか？"))return;
      const r=await authed(`/rest/v1/portal_posts?id=eq.${b.dataset.del}`,{method:"DELETE"});
      if(r.ok){ if(EDIT_ID===b.dataset.del)EDIT_ID=null; await fetchPosts(); (VIEW==="posts"?renderPosts:renderHome)(u); }
      else alert("削除できませんでした（"+r.status+"）");
    };
  });
  document.querySelectorAll("[data-edit]").forEach(b=>{
    b.onclick=()=>{ EDIT_ID=b.dataset.edit; renderPosts(u);
      setTimeout(()=>{ const f=$("np-title"); if(f)f.scrollIntoView({behavior:"smooth"}); },50); };
  });
}

/* ---------- 検索 ---------- */
function searchAll(qs,u){
  const q=qs.trim().toLowerCase();
  if(!q) return "";
  const hits=[];
  GUIDE.forEach(g=>{
    if((g.q+" "+g.label).toLowerCase().includes(q)){
      const sy=g.sys?SYSTEMS.find(s=>s.key===g.sys):null;
      if(sy&&!canSee(sy,u))return;             // 権限が無いシステムの案内は出さない
      hits.push(sy
        ?`<a href="${sy.url}" target="_blank" rel="noopener">${sy.ico} ${esc(g.label)}<span class="where">${esc(sy.name)} →</span></a>`
        :`<a href="javascript:void(0)">📍 ${esc(g.label)}${g.soon?'<span class="soon">🚧 準備中</span>':""}</a>`);
    }
  });
  (POSTS||[]).forEach(p=>{
    if((p.title+" "+(p.body||"")).toLowerCase().includes(q))
      hits.push(`<a href="javascript:void(0)" data-goto-post="${p.id}">📢 ${esc(p.title)}<span class="where">お知らせ →</span></a>`);
  });
  return hits.length?`<div class="sr">${hits.slice(0,8).join("")}</div>`
                    :`<div class="sr"><a href="javascript:void(0)">該当なし — 本部までお問い合わせください</a></div>`;
}
function wireSearch(u){
  const box=$("q"); if(!box)return;
  box.oninput=()=>{ $("qres").innerHTML=searchAll(box.value,u);
    document.querySelectorAll("[data-goto-post]").forEach(a=>{
      a.onclick=async()=>{ VIEW="posts"; renderPosts(u);
        setTimeout(()=>{ const el=document.querySelector(`[data-pid="${a.dataset.gotoPost}"]`); if(el)el.scrollIntoView({behavior:"smooth"}); },100); };
    });
  };
}

function renderLogin(err){
  VIEW="home";
  $("app").innerHTML=`<div class="card">
    <label>メールアドレス</label><input type="email" id="lemail" autocomplete="username" inputmode="email">
    <label>パスワード</label><input type="password" id="lpw" autocomplete="current-password">
    <button class="btn" id="lbtn">ログイン</button>
    <div class="err">${esc(err||"")}</div>
    <div class="note">日報・週報システムと同じメールアドレス＋パスワードです。<br>アカウントが無い方は本部までご連絡ください。</div>
  </div>`;
  const go=async()=>{
    $("lbtn").disabled=true;$("lbtn").textContent="ログイン中…";
    try{await login($("lemail").value.trim(),$("lpw").value);await main()}
    catch(e){renderLogin(e.message)}
  };
  $("lbtn").onclick=go;
  $("lpw").onkeydown=e=>{if(e.key==="Enter")go()};
}

function renderHome(u){
  const isMaster=!!u.is_master;
  const tiles=SYSTEMS.filter(sy=>canSee(sy,u));
  $("app").innerHTML=`
  <div class="userbar">
    <div class="who">👤 ${esc(u.name)}<span class="badge${isMaster?" master":""}">${isMaster?"マスター":esc(ROLE_NAME[u.role]||u.role)}</span></div>
    <div>
      ${isMaster?`<button class="linkbtn" id="gosettings">⚙️ 権限設定</button>`:""}
      <button class="linkbtn" id="lout">ログアウト</button>
    </div>
  </div>
  ${(POSTS&&POSTS.length)||canPost(u)?`
  <div class="posthead" style="margin-top:0">
    <h2>📢 お知らせ</h2>
    <button class="linkbtn" id="allposts">すべて見る${POSTS&&POSTS.length?`（${POSTS.length}）`:""} →</button>
  </div>
  ${(POSTS||[]).slice(0,3).map(p=>postHtml(p,u)).join("")||'<div class="post"><div class="pm">まだお知らせはありません</div></div>'}`:""}
  <div class="searchbox" style="margin-top:20px">
    <span class="mag">🔍</span>
    <input id="q" type="search" placeholder="やりたいこと・お知らせを検索（例: 精算 / シフト / 口コミ）">
    <div id="qres"></div>
  </div>
  <div class="grid">${tiles.map(sy=>`
    <a class="tile" href="${sy.url}" target="_blank" rel="noopener">
      <div class="ico">${sy.ico}</div><h3>${esc(sy.name)}</h3><p>${esc(sy.desc)}</p>
      <span class="tag${sy.sso?" sso":""}">${sy.sso?"✓ ":""}${esc(sy.login)}</span>
    </a>`).join("")}
  </div>
  ${tiles.length===0?'<div class="card"><p style="text-align:center">表示できるシステムがありません。本部までお問い合わせください。</p></div>':""}
  <details><summary>パスワードを変更する</summary>
    <div class="card" style="margin-top:10px">
      <label>新しいパスワード（8文字以上）</label><input type="password" id="npw" autocomplete="new-password">
      <button class="btn" id="pwbtn">変更する</button><div class="err" id="pwmsg"></div>
      <div class="note">ここで変えると日報・週報など統合アカウントを使う全システムのパスワードが変わります。</div>
    </div>
  </details>`;
  if(isMaster)$("gosettings").onclick=async()=>{VIEW="settings";await renderSettings(u)};
  if($("allposts"))$("allposts").onclick=()=>{VIEW="posts";renderPosts(u)};
  wireSearch(u); wirePostDeletes(u);
  $("lout").onclick=async()=>{const s=sess.get();if(s)await api("/auth/v1/logout",{method:"POST"},s.at).catch(()=>{});sess.clear();renderLogin()};
  $("pwbtn").onclick=async()=>{
    const pw=$("npw").value;
    if(pw.length<8){$("pwmsg").textContent="8文字以上にしてください";return}
    $("pwbtn").disabled=true;
    const r=await authed("/auth/v1/user",{method:"PUT",body:JSON.stringify({password:pw})});
    $("pwbtn").disabled=false;
    $("pwmsg").className=r.ok?"err msg-ok":"err";
    $("pwmsg").textContent=r.ok?"変更しました":"変更できませんでした: "+(r.body?.msg||r.status);
  };
}

/* ---------- お知らせ一覧・投稿 ---------- */
function renderPosts(u){
  VIEW="posts";
  $("app").innerHTML=`
  <div class="userbar">
    <div class="who">📢 お知らせ</div>
    <button class="linkbtn" id="back">← ポータルへ戻る</button>
  </div>
  ${canPost(u)?(()=>{
    const ep=EDIT_ID?(POSTS||[]).find(p=>p.id===EDIT_ID):null;
    return `
  <div class="card" style="margin-bottom:16px${ep?';outline:2px solid var(--accent)':''}">
    <div class="sec-title" style="margin-top:0">${ep?"✏️ お知らせを編集":"新しいお知らせを投稿"}</div>
    <label>タイトル</label><input id="np-title" placeholder="例: 8月の営業について" value="${ep?esc(ep.title):""}">
    <label>本文</label><textarea id="np-body" rows="4" style="width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit">${ep?esc(ep.body||""):""}</textarea>
    <label>リンク（任意。YouTubeのURLは動画として埋め込まれます）</label><input id="np-url" type="url" placeholder="https://www.youtube.com/watch?v=…" value="${ep?esc(ep.url||""):""}">
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="np-pin" ${ep&&ep.pinned?"checked":""} style="width:18px;height:18px;padding:0;accent-color:var(--accent)"> 📌 上部に固定する</label>
    <button class="btn" id="np-send">${ep?"更新する":"投稿する"}</button>
    ${ep?`<button class="btn sub" id="np-cancel">編集をやめる</button>`:""}
    <div class="err" id="np-msg"></div>
  </div>`;})():""}
  <div id="postlist">${(POSTS||[]).map(p=>postHtml(p,u)).join("")||'<div class="post"><div class="pm">まだお知らせはありません</div></div>'}</div>`;
  $("back").onclick=()=>{VIEW="home";renderHome(u)};
  wirePostDeletes(u);
  if($("np-cancel"))$("np-cancel").onclick=()=>{EDIT_ID=null;renderPosts(u)};
  if($("np-send"))$("np-send").onclick=async()=>{
    const title=$("np-title").value.trim();
    if(!title){$("np-msg").textContent="タイトルを入れてください";return}
    $("np-send").disabled=true;$("np-msg").className="err";$("np-msg").textContent=EDIT_ID?"更新中…":"投稿中…";
    const s=sess.get();
    const payload={ title, body:$("np-body").value.trim(), url:$("np-url").value.trim()||null, pinned:$("np-pin").checked };
    const r=EDIT_ID
      ?await authed(`/rest/v1/portal_posts?id=eq.${EDIT_ID}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({...payload,updated_at:new Date().toISOString()})})
      :await authed("/rest/v1/portal_posts",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({...payload,created_by:s?s.uid:null})});
    $("np-send").disabled=false;
    if(!r.ok){$("np-msg").textContent=(EDIT_ID?"更新":"投稿")+"できませんでした（"+r.status+"）";return}
    EDIT_ID=null;
    await fetchPosts(); renderPosts(u);
  };
}

/* ---------- マスター専用: 権限設定 ---------- */
async function renderSettings(u){
  $("app").innerHTML=`<div class="spin">権限設定を読み込み中…</div>`;
  const [p,us]=await Promise.all([
    authed("/rest/v1/portal_permissions?select=role,system_key,allowed"),
    authed("/rest/v1/users?select=id,name,role,is_active,is_master&order=name")
  ]);
  if(!p.ok){$("app").innerHTML=`<div class="card"><p>権限データを読み込めませんでした（${p.status}）</p><button class="btn" onclick="location.reload()">再読み込み</button></div>`;return}
  const pm={};
  (p.body||[]).forEach(r=>{ (pm[r.role]=pm[r.role]||{})[r.system_key]=r.allowed; });
  USERS=(us.body||[]).filter(x=>x.is_active&&!x.is_master);
  if(!OVR_USER&&USERS.length)OVR_USER=USERS[0].id;
  await loadOvr();

  $("app").innerHTML=`
  <div class="userbar">
    <div class="who">⚙️ 権限設定<span class="badge master">マスター</span></div>
    <button class="linkbtn" id="back">← ポータルへ戻る</button>
  </div>
  <div class="card">
    <div class="sec-title" style="margin-top:0">役割ごとの既定（チェック＝表示する）</div>
    <div class="sec-sub">役割ごとに、ポータルに表示するシステムを設定します。マスターは常に全システムが見えます。</div>
    <div class="pm-scroll"><table class="pm">
      <tr><th>システム</th>${ROLE_ORDER.map(r=>`<th>${ROLE_NAME[r]}</th>`).join("")}</tr>
      ${SYSTEMS.map(sy=>`<tr><td>${sy.ico} ${esc(sy.name)}</td>${ROLE_ORDER.map(r=>{
        const on=pm[r]?.[sy.key]??sy.roles.includes(r);
        return `<td><input type="checkbox" data-role="${r}" data-sys="${sy.key}" ${on?"checked":""}></td>`;
      }).join("")}</tr>`).join("")}
    </table></div>
    <button class="btn" id="savepm">役割の既定を保存</button>
    <div class="err" id="pmmsg"></div>

    <div class="sec-title">個人ごとの例外</div>
    <div class="sec-sub">特定の人だけ既定と変えたいときに使います。「既定に従う」に戻せば役割の設定に追従します。</div>
    <label>対象者</label>
    <select class="inp" id="ovuser">${USERS.map(x=>`<option value="${x.id}" ${x.id===OVR_USER?"selected":""}>${esc(x.name)}（${ROLE_NAME[x.role]||x.role}）</option>`).join("")}</select>
    <div id="ovlist">${ovListHtml()}</div>
    <button class="btn" id="saveov">この人の例外を保存</button>
    <div class="err" id="ovmsg"></div>
  </div>`;
  $("back").onclick=async()=>{VIEW="home";await fetchPerms();renderHome(ME)};
  $("ovuser").onchange=async e=>{OVR_USER=e.target.value;await loadOvr();$("ovlist").innerHTML=ovListHtml();wireOvSelects()};
  wireOvSelects();
  $("savepm").onclick=async()=>{
    const rows=[...document.querySelectorAll("table.pm input[type=checkbox]")].map(c=>({role:c.dataset.role,system_key:c.dataset.sys,allowed:c.checked}));
    const m=$("pmmsg");m.className="err";m.textContent="保存中…";
    const r=await authed("/rest/v1/portal_permissions",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(rows)});
    m.className=r.ok?"err msg-ok":"err";
    m.textContent=r.ok?"保存しました。次回のログイン/再読み込みから反映されます":"保存に失敗しました（"+r.status+"）";
  };
  $("saveov").onclick=async()=>{
    const m=$("ovmsg");m.className="err";m.textContent="保存中…";
    const sel=[...document.querySelectorAll("#ovlist select")];
    const ups=[],dels=[];
    sel.forEach(s=>{ if(s.value==="default")dels.push(s.dataset.sys); else ups.push({user_id:OVR_USER,system_key:s.dataset.sys,allowed:s.value==="on"}); });
    let ok=true;
    if(ups.length){ const r=await authed("/rest/v1/portal_user_overrides",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(ups)}); ok=ok&&r.ok; }
    if(dels.length){ const r=await authed(`/rest/v1/portal_user_overrides?user_id=eq.${OVR_USER}&system_key=in.(${dels.join(",")})`,{method:"DELETE"}); ok=ok&&r.ok; }
    m.className=ok?"err msg-ok":"err";
    m.textContent=ok?"保存しました":"保存に失敗しました";
  };
}
async function loadOvr(){
  OVR_MAP={};
  if(!OVR_USER)return;
  const r=await authed(`/rest/v1/portal_user_overrides?user_id=eq.${OVR_USER}&select=system_key,allowed`);
  if(r.ok&&Array.isArray(r.body))r.body.forEach(x=>{OVR_MAP[x.system_key]=x.allowed});
}
function ovListHtml(){
  return SYSTEMS.map(sy=>{
    const v=(sy.key in OVR_MAP)?(OVR_MAP[sy.key]?"on":"off"):"default";
    return `<div class="ov-row"><span class="nm">${sy.ico} ${esc(sy.name)}</span>
      <select data-sys="${sy.key}" class="${v==="on"?"ovon":v==="off"?"ovoff":""}">
        <option value="default" ${v==="default"?"selected":""}>既定に従う</option>
        <option value="on" ${v==="on"?"selected":""}>表示する</option>
        <option value="off" ${v==="off"?"selected":""}>表示しない</option>
      </select></div>`;
  }).join("");
}
function wireOvSelects(){
  document.querySelectorAll("#ovlist select").forEach(s=>{
    s.onchange=()=>{s.className=s.value==="on"?"ovon":s.value==="off"?"ovoff":""};
  });
}

async function main(){
  if(!sess.get()){renderLogin();return}
  const u=await fetchMe();
  if(!u){sess.clear();renderLogin("セッションが切れました。もう一度ログインしてください。");return}
  if(u.is_active===false){sess.clear();renderLogin("このアカウントは無効化されています。本部までお問い合わせください。");return}
  ME=u;
  await Promise.all([fetchPerms(),fetchPosts()]);
  renderHome(u);
}
main();
</script>
</body>
</html>
