<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📌 本部タスク — N-Styleグループ ポータル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
<style>
:root{
  --bg:#f5f4f1; --card:#ffffff; --ink:#26221e; --muted:#8a8377;
  --accent:#c8401f; --accent2:#a33318; --line:#e7e3dc; --ok:#2e7d32;
  --warn:#b58a00; --stall:#c62828;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1d1b18; --card:#282521; --ink:#f0ece5; --muted:#a29a8c; --line:#3a362f;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
/* 2026-08-26: ポータルシェル(portal.html)埋め込み時、サイドバー分を除いた残り幅いっぱいに
   iframeが渡されるにもかかわらずここが980pxで頭打ちになり、幅が広い画面ほど左右に大きな
   空白ができてしまうという実機フィードバック対応。デザイン案のcontent領域（サイドバー以外は
   幅いっぱいに使う）に合わせ、実用的な上限まで大きく引き上げた */
.wrap{max-width:1600px;margin:0 auto;padding:20px 16px 60px}
a{color:inherit}
.spin{text-align:center;color:var(--muted);padding:60px 0}
.err{color:#c62828;font-size:13px}
.msg-ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit}
textarea{resize:vertical}
.btn,.linkbtn,.chip,button{touch-action:manipulation}
.btn{display:inline-block;padding:10px 18px;font-size:14px;font-weight:600;color:#fff;background:var(--accent);border:none;border-radius:8px;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sub{background:transparent;color:var(--muted);border:1px dashed var(--muted);font-weight:400}
.btn.sm{padding:6px 12px;font-size:13px}
.linkbtn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline;padding:4px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar h1{font-size:19px}
.topbar .who{font-size:13px;color:var(--muted)}

/* サマリー信号 */
.sig-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:600px){.sig-row{grid-template-columns:repeat(2,1fr)}}
.sig{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center;cursor:pointer;transition:box-shadow .1s}
.sig:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sig.active{outline:2px solid var(--accent)}
.sig .n{font-size:28px;font-weight:800}
.sig.overdue .n{color:var(--stall)}
.sig.today .n{color:var(--warn)}
.sig.stall .n{color:var(--stall)}
.sig .l{font-size:11px;color:var(--muted);margin-top:2px}

/* 検索・絞り込み */
.searchbox{position:relative;margin-bottom:12px}
.searchbox input{padding-left:38px}
.searchbox .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-block;padding:5px 12px;font-size:12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chipcheck{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;font-size:12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;white-space:nowrap;margin:0}
.chipcheck input{width:auto;margin:0;accent-color:var(--accent);cursor:pointer}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
/* 2026-08-26: デザイン案のtoolbar-top（検索＋表示切替＋主要アクションを1行に並べる構成）に合わせた */
.toolbar-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar-top .searchbox{flex:1;min-width:220px;margin-bottom:0}

/* かんばん */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
@media(max-width:760px){
  .board{
    display:flex; grid-template-columns:none;
    overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    padding-bottom:8px; margin-left:-16px; margin-right:-16px; padding-left:16px; padding-right:16px;
  }
  .board .col{min-width:86vw; max-width:86vw; flex-shrink:0; scroll-snap-align:start}
  .board .col h2{position:sticky; top:0; background:var(--bg); padding:4px 0}
}
.col{background:transparent}
.col h2{font-size:14px;margin-bottom:8px;color:var(--muted)}
.col h2 b{color:var(--ink)}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:transform .08s}
.tcard:hover{transform:translateY(-1px)}
.tcard.stall{border-color:var(--stall);border-width:2px}
.tcard.warn{border-color:var(--warn);border-width:2px}
.tcard .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.freq{color:var(--accent);border-color:var(--accent)}
.tcard .ti{font-size:14px;font-weight:600;margin-bottom:4px}
.tcard .meta{font-size:12px;color:var(--muted);line-height:1.6}
.tcard .stall-badge{display:inline-block;font-size:11px;color:#fff;background:var(--stall);padding:1px 8px;border-radius:99px;margin-bottom:4px}
.due-badge{font-weight:600}
.due-badge.stall{background:var(--stall);color:#fff;border-color:var(--stall)}
.due-badge.warn{background:var(--warn);color:#fff;border-color:var(--warn)}
.tcard .now{font-size:12px;margin-top:4px}
.tcard .memo-line{font-size:12px;margin-top:4px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-col{font-size:12px;color:var(--muted);padding:10px 4px}

/* 全面刷新Phase2: ボードのカレンダー表示 */
.cal-wrap{margin-top:14px}
.cal-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cal-nav b{font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{margin-bottom:4px;font-size:12px;color:var(--muted);text-align:center}
.cal-day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:88px;overflow:hidden}
.cal-day.empty{background:transparent;border:none;min-height:0}
.cal-day.today{border-color:var(--accent);border-width:2px}
.cal-date{font-size:11px;color:var(--muted);margin-bottom:4px}
.cal-day.today .cal-date{color:var(--accent);font-weight:700}
.cal-task{font-size:11px;padding:3px 5px;border-radius:6px;margin-bottom:3px;background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cal-task.overdue{background:var(--stall);color:#fff}
.cal-task.warn{background:var(--warn);color:#fff}
.cal-task.done{background:var(--ok);color:#fff}
.cal-more{font-size:10px;color:var(--muted)}
@media(max-width:640px){
  .cal-day{min-height:60px;font-size:10px}
  .cal-head{font-size:10px}
}

/* 繰り返しタブ */
.rp-table{width:100%;border-collapse:collapse;font-size:13px}
.rp-table th,.rp-table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.rp-table th{color:var(--muted);font-weight:600;font-size:12px}

/* 詳細画面（全面刷新Phase3: デザイン案のhero/summary/layout/completebar/auditを再現） */
.dh{margin-bottom:14px}
.dh .badges{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.dh h1{font-size:20px;margin-top:4px}
.sec{margin-top:20px}
.sec h3{font-size:14px;margin-bottom:8px}
.sec-sub{font-size:12px;color:var(--muted)}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}
.hero .pad{padding:18px}
.hero .title{font-size:24px;font-weight:800;margin:10px 0 6px;text-wrap:balance}
.hero .desc{color:var(--muted);line-height:1.7;font-size:14px}
.progress{height:9px;background:var(--bg);border-radius:99px;overflow:hidden;margin:12px 0 6px}
.progress span{display:block;height:100%;background:var(--accent)}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mini{border:1px solid var(--line);border-radius:12px;padding:12px}
.mini small{display:block;color:var(--muted);margin-bottom:4px;font-size:11px}
.mini b{font-size:15px}
.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:14px;align-items:start}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.dcard .head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dcard .head b{font-size:14px}
.dcard .body{padding:16px}
.completebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.audit .activity-row{display:grid;grid-template-columns:9px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.audit .activity-row:last-child{border-bottom:none}
.audit .dot{width:8px;height:8px;border-radius:50%;background:var(--line);margin-top:5px}
.audit .dot.green{background:var(--ok)}
@media(max-width:860px){
  .hero{grid-template-columns:1fr}
  .layout{grid-template-columns:1fr}
}
/* ✅ワンクリック完了はデザイン案に無い機能のため、PCではデザイン案どおり隠し、
   モバイルだけの利便機能として残す（ユーザー指示: PCはデザイン案どおり、
   スマホは多少変えてよい） */
@media(min-width:641px){ [data-quickcomplete]{display:none} }
.notes-box{background:#fff8e1;border:1px solid #e6c74e;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;color:#5a4a00}
@media(prefers-color-scheme:dark){.notes-box{background:#3a3110;border-color:#6b5a1e;color:#f0dd8a}}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;overflow:hidden}
.step.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.step.done{background:#fbfefc;border-color:#b9ddca}
@media(prefers-color-scheme:dark){.step.done{background:#16241c;border-color:#2f5c43}}
.step .row1{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;cursor:pointer}
.step .ic{font-size:16px;text-align:center}
.step-num{width:34px;height:34px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted)}
.step.cur .step-num{background:var(--accent);color:#fff}
.step.done .step-num{background:#b9ddca;color:#1f6b45}
@media(prefers-color-scheme:dark){.step.done .step-num{background:#2f5c43;color:#8fd6ac}}
.step .st{flex:1;font-size:14px}
.step .meta{font-size:12px;color:var(--muted);margin-top:2px}
.step .now-tag{color:var(--stall);font-weight:600}
.step-body{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.storecheck-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.storecheck-row:last-child{border-bottom:none}
.link-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.link-row:last-child{border-bottom:none}
.photo-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
/* 全面刷新Phase3: デザイン案のownerline(担当・期限)／resources(添付カード)を再現 */
.ownerline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.fieldbox{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
.fieldbox label{display:block;color:var(--muted);font-size:11px;margin:0 0 4px}
.fieldbox select,.fieldbox input{width:100%;border:0;background:transparent;outline:none;font-weight:700;padding:0;font-size:14px;color:var(--ink)}
.proc-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;flex-wrap:wrap}
.resources{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.resource{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);position:relative}
.resource a{color:inherit;text-decoration:none;display:block;padding-right:18px}
.resource a:hover b{text-decoration:underline}
.resource b{display:block;font-size:13px;font-weight:600}
.resource small{color:var(--muted);font-size:11px}
.resource .del{position:absolute;top:8px;right:8px;padding:2px}
.resource-add{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);margin-top:10px}
.resource-add label{margin-top:8px}
.richbar{display:flex;gap:6px;align-items:center;margin:4px 0 2px;flex-wrap:wrap}
.richbar button{border:1px solid var(--line);border-radius:6px;padding:3px 12px;background:var(--card);cursor:pointer;font-size:13px}
.richbar select{width:auto;flex:0 0 auto;font-size:12px;padding:3px 6px;border-radius:6px}
.richbar input[type=color]{width:32px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:none}
.rich-preview{border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:4px;font-size:13.5px;color:var(--ink);background:var(--bg);min-height:18px}
.rich-preview:empty::before{content:"（プレビュー：入力すると表示されます）";color:var(--muted)}
/* 2026-08-26(Phase4): テンプレート編集画面をデザイン案の2カラム（編集フォーム＋右側に
   「従業員側プレビュー」を常時表示）へ合わせた */
.tpl-edit-layout{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.tpl-preview-panel{position:sticky;top:16px}
.pstep{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin:10px 0}
.pstep.current{border-left-color:var(--accent)}
@media(max-width:1050px){.tpl-edit-layout{grid-template-columns:1fr}.tpl-preview-panel{position:static}}
.resource-add label:first-child{margin-top:0}
/* デザイン案の.checklist/.checkitemを再現（文字サイズ・チェックボックスを大きく、行区切り線つき） */
.checklist-hd{font-weight:700;font-size:14px;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.checkitem{display:flex;align-items:center;gap:6px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}
.checkitem:last-of-type{border-bottom:none}
.checkitem label{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer}
.checkitem input{width:18px;height:18px;flex:none}
.checkitem .done{color:var(--muted);text-decoration:line-through}
.checkitem span{overflow-wrap:anywhere}
.photo-grid img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.doc-chip{width:80px;height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:22px;color:var(--muted);text-decoration:none}
.doc-chip span{font-size:11px}
.act-row{font-size:12px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--line)}
.act-row:last-child{border-bottom:none}
.act-row b{color:var(--ink);font-weight:600}
/* align-items:flex-start（bottom揃えにしない）。工程の期限日のように入力の下にヒント文が
   付く項目があると、bottom揃えでは項目ごとに高さが変わりラベルの位置がガタつくため */
.stepform-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
.stepform-row .f{flex:1;min-width:120px}
.stepform-row .f label{margin:0 0 4px}
@media(max-width:600px){
  /* 狭い画面で2列に押し込むと「担当（空欄=誰でも可）」等のラベル・日付入力が
     崩れるため、1項目1行に積む */
  .stepform-row .f{flex:1 1 100%}
}
/* チェック＋短いラベルの並び（例: 🏪店舗別チェック／⚖️2択／📷写真必須）。
   横並びのまま文字だけが折り返すと縦に潰れて読めなくなるため、
   ラベル内では折り返させず、入らなければ項目ごと次の行へ回す */
/* input,select,textareaに一律width:100%が掛かっているため、チェックボックスは
   明示的にwidth:autoで打ち消さないと行いっぱいに広がってしまう（.chipcheckと同じ対策） */
.optchk input,.optline input{width:auto}
.optchk{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;flex:0 0 auto}
/* 長文の説明つきチェック（例: 「毎日タスクの子チェックとして扱う…」）。
   文章は折り返してよいが、チェックボックスは折り返した段落の中央ではなく
   1行目の高さに揃える */
.optline{display:flex;align-items:flex-start;gap:8px;cursor:pointer}
.optline input{margin-top:3px;flex:0 0 auto}
/* flex-basis:0で「残り幅いっぱいまで伸びる」動作にする。span無し（flex-basis:auto任意）だと
   日本語テキストはどの文字の間でも改行できてしまうため、幅が足りないとき縮小方向に
   際限なく潰れて1文字ずつ縦積みになる不具合があった */
.optline span{flex:1 1 0%}
.ts-checkopts{align-items:center}
.print-task{margin-bottom:18px}
.print-task-title{font-weight:700;font-size:15px;margin-bottom:6px}
.print-table{width:100%;border-collapse:collapse;font-size:13px}
.print-table th,.print-table td{border:1px solid #999;padding:6px 8px;text-align:left}
.print-table .chk{width:60px;text-align:center;font-size:16px}
@media print{
  body *{visibility:hidden}
  #printarea,#printarea *{visibility:visible}
  #printarea{display:block;position:absolute;top:0;left:0;width:100%}
  .no-print{display:none !important}
}
</style>
</head>

<div class="wrap">
<div id="app"><div class="spin">読み込み中…</div></div>

<script>
const SUPA_URL="https://uuvsxzhpxtghojoubjcc.supabase.co";
const SUPA_KEY="sb_publishable_MrwPJAx_Ws_fdRutprKCiQ_dg3wCiTr";
const LS_KEY="nsportal_session_v1";
const BUCKET="report-photos";
let CORPS=[];              // corporations（法人マスタの正本）から取得 {id,name,is_active,sort_order}
                            // ※2026-08-17法人マスタ統一により hq_corps から切替。hq_corps自体は
                            // 互換のため残っているが新規書き込みはしない（読むだけなら自由）
let MANUAL_ITEMS=null;     // manual_items（category='本部マニュアル'・読取専用）を遅延取得しキャッシュ
const activeCorps=()=>CORPS.filter(c=>c.is_active);
const ASSIGNABLE_ROLES=["HQ","CEO","TEAM"];
const FREQ_LABEL={daily:"毎日",weekly:"毎週",monthly:"毎月",once:"単発"};
const STATUS_LABEL={todo:"未着手",doing:"進行中",done:"完了"};
const ROLE_NAME={CEO:"社長",HQ:"本部",TEAM:"チーム長",TENCHO:"店長",SHAIN:"社員",AL:"アルバイト"};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* 2026-08-26: 本部タスクにもB-4相当（太字・文字サイズ・文字色）の装飾を追加してほしいという
   ユーザー依頼（担当B→担当EへのWORKLOG申し送り）。description/notes/procedure_noteは
   nippoのマニュアルと違いプレーンな1本のtext列のため、部品配列化はせず「選択範囲を軽量マーカーで
   囲んで保存する」方式にした（**太字**／[color=#xxxxxx]…[/color]／[size=s|m|l|xl]…[/size]）。
   表示は必ずesc()で丸ごとエスケープしてから、マーカーだけを正規表現で安全な固定タグへ置換する
   （置換先はホワイトリストのタグ・値のみ・任意のHTML/属性が混ざる余地はない＝XSS対策）。 */
const RICH_SIZE_PX={s:"12px",m:"14px",l:"18px",xl:"24px"};
function richTextHtml(raw){
  let s=esc(raw||"").replace(/\n/g,"<br>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  s=s.replace(/\[color=(#[0-9a-fA-F]{3,8})\]([\s\S]*?)\[\/color\]/g,'<span style="color:$1">$2</span>');
  s=s.replace(/\[size=(s|m|l|xl)\]([\s\S]*?)\[\/size\]/g,(m,sz,inner)=>`<span style="font-size:${RICH_SIZE_PX[sz]}">${inner}</span>`);
  return s;
}
function richToolbarHtml(id){
  return `<div class="richbar" onclick="event.stopPropagation()">
    <button type="button" data-richb="${id}"><b>B</b> 太字</button>
    <select data-richsize="${id}">
      <option value="">サイズ…</option>
      <option value="s">小</option><option value="m">標準</option><option value="l">大</option><option value="xl">特大</option>
    </select>
    <input type="color" data-richcolor="${id}" value="#d63b3b" title="選択した文字の色">
  </div>`;
}
function richFieldHtml(id,label,value,rows,placeholder,extraAttrs){
  return `<label>${esc(label)}</label>
  ${richToolbarHtml(id)}
  <textarea id="${id}" rows="${rows||3}" ${placeholder?`placeholder="${esc(placeholder).replace(/\n/g,"&#10;")}"`:""} ${extraAttrs||""}>${esc(value||"")}</textarea>
  <div class="rich-preview" id="${id}-preview">${richTextHtml(value||"")}</div>`;
}
function wireRichField(id,onInput){
  const ta=document.getElementById(id); if(!ta) return;
  const preview=document.getElementById(id+"-preview");
  const sync=()=>{ if(preview) preview.innerHTML=richTextHtml(ta.value); if(onInput) onInput(ta.value); };
  ta.oninput=sync;
  const wrapSel=(before,after)=>{
    const s=ta.selectionStart, e=ta.selectionEnd;
    if(s===e){ alert("先に装飾したい文字をドラッグして選択してから押してください"); return; }
    const v=ta.value;
    ta.value=v.slice(0,s)+before+v.slice(s,e)+after+v.slice(e);
    ta.focus(); ta.setSelectionRange(s+before.length,e+before.length);
    sync();
  };
  const btn=document.querySelector(`[data-richb="${id}"]`);
  if(btn) btn.onclick=()=>wrapSel("**","**");
  const sizeSel=document.querySelector(`[data-richsize="${id}"]`);
  if(sizeSel) sizeSel.onchange=()=>{ if(sizeSel.value) wrapSel(`[size=${sizeSel.value}]`,"[/size]"); sizeSel.value=""; };
  const colorInput=document.querySelector(`[data-richcolor="${id}"]`);
  if(colorInput) colorInput.onchange=()=>wrapSel(`[color=${colorInput.value}]`,"[/color]");
}

async function api(path,opt={},token){
  const r=await fetch(SUPA_URL+path,{...opt,headers:{
    "apikey":SUPA_KEY,...(opt.isBinary?{}:{"Content-Type":"application/json"}),
    ...(token?{"Authorization":"Bearer "+token}:{}),...(opt.headers||{})}});
  let body=null;
  if(opt.rawResponse) return {ok:r.ok,status:r.status,raw:r};
  const tx=await r.text(); try{body=tx?JSON.parse(tx):null}catch(e){}
  return {ok:r.ok,status:r.status,body};
}
async function authed(path,opt={}){
  const s=sess.get(); if(!s) return {ok:false,status:401,body:null};
  let r=await api(path,opt,s.at);
  if(r.status===401){ if(!await refresh()) return r; r=await api(path,opt,sess.get().at); }
  return r;
}
async function refresh(){
  const s=sess.get(); if(!s?.rt) return false;
  const r=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.rt})});
  if(!r.ok){sess.clear();return false}
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});
  return true;
}

function fmtD(d){ if(!d) return "—"; const t=new Date(d+"T00:00:00"); return `${t.getMonth()+1}/${t.getDate()}`; }
function fmtDD(d,tm){ if(!d) return "—"; const base=fmtD(d); return tm?`${base} ${tm.slice(0,5)}`:base; }

/* ---------- 工程・信号の判定（設計書 第5章） ---------- */
function sortedSteps(t){ return (t.hq_task_steps||[]).slice().sort((a,b)=>a.sort_order-b.sort_order); }
function computeSignal(t){
  const steps=sortedSteps(t);
  const cur=steps.find(s=>!s.completed_at);
  if(t.status==="done"||!cur) return {cur:null,level:"done",stalledDays:0,overdue:false,dueToday:false};
  const today=todayStr();
  const dueMs=cur.due_date?new Date(cur.due_date+"T"+(cur.due_time?cur.due_time.slice(0,8):"23:59:59")).getTime():null;
  const overdue=dueMs!==null && Date.now()>dueMs;
  const dueToday=!!(cur.due_date && cur.due_date===today && !overdue);
  const dueSoon=!!(cur.due_date && !overdue && !dueToday && (new Date(cur.due_date)-new Date(today))/86400000<=2);
  const idx=steps.indexOf(cur);
  const sinceStr=idx>0?steps[idx-1].completed_at:t.created_at;
  const stalledDays=sinceStr?Math.floor((Date.now()-new Date(sinceStr).getTime())/86400000):0;
  const stalled=overdue||stalledDays>=3;
  let level="ok"; if(stalled)level="stall"; else if(dueToday||dueSoon)level="warn";
  return {cur,level,stalledDays,overdue,dueToday};
}

function applyFilters(list){
  return list.filter(t=>{
    if(FILTER.corp && t.corp!==FILTER.corp) return false;
    if(FILTER.freq && t.freq!==FILTER.freq) return false;
    if(FILTER.assignee){
      const match=sortedSteps(t).some(s=>s.assignee_id===FILTER.assignee);
      if(!match) return false;
    }
    if(FILTER.creator && t.created_by!==FILTER.creator) return false;
    if(FILTER.signal){
      const sig=computeSignal(t);
      if(FILTER.signal==="overdue" && !sig.overdue) return false;
      if(FILTER.signal==="today" && !sig.dueToday) return false;
      if(FILTER.signal==="stall" && sig.level!=="stall") return false;
    }
    return true;
  });
}
function summaryCounts(){

  const doneCount=TASKS.filter(t=>t.status==="done").length;
  return {overdue,today,stall,doneCount};
}

function calendarViewHtml(list){
  const [y,m]=CAL_MONTH.split("-").map(Number);

  const startDow=new Date(y,m-1,1).getDay();
  const todayS=todayStr();
  const byDate={};
  list.forEach(t=>{ const d=calendarDateOf(t); if(d) (byDate[d]=byDate[d]||[]).push(t); });

// 2026-08-21 データ基盤Day2: report-photosバケット非公開化に伴い署名URL方式へ変更。
// photoUrl()は直接は使わず、レンダリング側は data-photo-path 属性で埋め込み、
// resolveLazyPhotos()がDOM挿入後にまとめて署名URLを取得してsrc/hrefへ反映する
// （1件ずつawaitさせず、テンプレート文字列の同期組み立てを崩さないための遅延解決方式）。
function photoUrl(path){ return `${SUPA_URL}/storage/v1/object/public/${BUCKET}/${path}`; } // 後方互換のみ・非公開化後は使わない
const _signedUrlCache=new Map(); // path -> {url, exp}
let _lazyPhotoTimer=null;
function schedulePhotoResolve(){ clearTimeout(_lazyPhotoTimer); _lazyPhotoTimer=setTimeout(resolveLazyPhotos,50); }
async function resolveLazyPhotos(){
  const els=[...document.querySelectorAll('[data-photo-path]:not([data-photo-resolved])')];
  if(!els.length) return;
  els.forEach(el=>el.dataset.photoResolved="pending");
  const now=Date.now();
  const need=[]; const paths=new Set();
  els.forEach(el=>{
    const p=el.dataset.photoPath; const c=_signedUrlCache.get(p);
    if(c&&c.exp>now){ applyPhotoUrl(el,c.url); }
    else { need.push(el); paths.add(p); }
  });
  if(!paths.size) return;
  const s=sess.get(); if(!s){ need.forEach(el=>el.dataset.photoResolved=""); return; }
  const r=await authed(`/storage/v1/object/sign/${BUCKET}`,{method:"POST",body:JSON.stringify({expiresIn:3600,paths:[...paths]})});
  const map={};
  (Array.isArray(r.body)?r.body:[]).forEach(x=>{ if(x.path&&x.signedURL) map[x.path]=`${SUPA_URL}/storage/v1${x.signedURL}`; });
  need.forEach(el=>{
    const url=map[el.dataset.photoPath];
    el.dataset.photoResolved=url?"1":"";
    if(url){ _signedUrlCache.set(el.dataset.photoPath,{url,exp:now+55*60*1000}); applyPhotoUrl(el,url); }
  });
}
function applyPhotoUrl(el,url){ if(el.tagName==="IMG") el.src=url; else el.href=url; }
new MutationObserver(schedulePhotoResolve).observe(document.body,{childList:true,subtree:true});
function photoTag(path){ const p=esc(path); return `data-photo-path="${p}"`; } // imgのsrc/aのhrefは空のまま、後でresolveLazyPhotosが埋める
// 2026-08-26: 「写真」欄にPDFも添付できるようにしてほしいという実機フィードバック対応。
// PDFは<img>で読み込めない（サムネイル化されない）ため、拡張子で見分けて📄チップ表示に切り替える

}

/* E-3(B7): 工程内チェックリスト（タスク側＝手順のチェックオン/オフ＋その場で追加）

/* 全面刷新Phase3: 「📘手順書」＝チェックリストとは別の読み物の手順テキスト（デザイン案の
   process-body内<b>📘手順書</b><ol>...を再現）。1行1手順として改行で区切って番号付きリスト表示。
   チェックはしない・完了操作とは無関係の参照情報 */
function procedureHtml(s,canTouch){
  const note=s.procedure_note||"";
  const lines=note.split("\n").map(x=>x.trim()).filter(Boolean);
  // 2026-08-26: テンプレート編集画面でしか手順書を書けず、タスク側で新規作成も修正も
  // できないという実機フィードバックを受け、チェックリストと同様にその場で作成・編集
  // できるようにした（PROC_EDIT_OPENで開閉。保存はhq_task_steps.procedure_noteへPATCH）
  if(canTouch&&PROC_EDIT_OPEN.has(s.id)){
    return `<div class="resource-add" onclick="event.stopPropagation()">
      ${richFieldHtml(`procedit-${s.id}`,"📘 手順書（任意・1行1手順で改行区切り。チェックはしない読み物用の説明文）",note,4,"例:\nスマレジ勤怠データを確認する\n時給・交通費設定に差異がないか確認する",`data-procedit="${s.id}"`)}
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn sm" data-procsave="${s.id}">保存する</button>
        <button class="linkbtn" data-proccancel="${s.id}">キャンセル</button>
      </div>
    </div>`;
  }
  if(!lines.length){
    return canTouch?`<button class="linkbtn" data-procopen="${s.id}" style="margin-top:6px">＋ 手順書を作成</button>`:"";
  }
  return `<div style="margin-top:10px" onclick="event.stopPropagation()">
    <div class="checklist-hd">📘 手順書${canTouch?`<button class="linkbtn" data-procopen="${s.id}" style="margin-left:8px">✏️ 編集</button>`:""}</div>
    <ol style="padding-left:20px;line-height:1.8;color:var(--muted);font-size:13.5px">${lines.map(l=>`<li>${richTextHtml(l)}</li>`).join("")}</ol>
  </div>`;
}
function checklistStepHtml(s,items,canTouch){
  // 2026-08-25: 項目が無い工程にまで「追加」フォームを常時出すとURL添付欄と同様に画面が
  // 埋まってしまうという実機フィードバックを受け、既存項目が無いときは「＋」リンクの奥に隠すよう調整
  if(!items.length && !canTouch) return "";
  const rows=(items||[]).map(it=>`<div class="checkitem">
      <label>
        <input type="checkbox" data-chkitem="${it.id}" ${it.checked_at?"checked":""} ${canTouch?"":"disabled"} onclick="event.stopPropagation()">
        <span class="${it.checked_at?"done":""}">${esc(it.title)}</span>
      </label>
      ${canTouch?`<button class="linkbtn" data-chkedit="${it.id}" onclick="event.stopPropagation()">✏️</button><button class="linkbtn" data-chkdel="${it.id}" onclick="event.stopPropagation()">🗑</button>`:""}
    </div>`).join("");
  const addOpen=CHK_ADD_OPEN.has(s.id);
  return `<div style="padding:8px 2px 4px" onclick="event.stopPropagation()">
    ${items.length?`<div class="checklist-hd">✅ チェック</div>${rows}`:""}
    ${canTouch?(addOpen?`<div class="resource-add">
      <label>手順を追加</label>
      <input data-chknew="${s.id}" placeholder="例: 金額を確認">
      <button class="btn sm" data-chkadd="${s.id}" style="margin-top:8px">＋ 追加して保存する</button>
      <div class="meta" style="margin-top:4px">↑ このボタンを押すと保存されます</div>
    </div>`:`<button class="linkbtn" data-chkaddopen="${s.id}" style="margin-top:${items.length?"6px":"0"}">＋ 手順チェックリストを追加</button>`):""}
  </div>`;
}
function stepHtml(t,s,u){
  const canTouch=canManage(u)||s.assignee_id===u.id||(!s.assignee_id);
  // Phase3(全面刷新・修正版): デザイン案を見直すと、担当・期限の編集フォーム(ownerline)は
  // 常時表示ではなく process-body ＝工程を開いたときに出てくる折りたたみパネルの中にある
  // （行の見出しには担当・期限の「summary」テキストだけが常時出ている）。PCはデザイン案の
  // この構造どおりに合わせ、添付・チェックリストと同じ1つのパネル(STEP_ATT_OPEN)へ統合する
  const canEditAssign=canManage(u)&&!s.completed_at;
  let metaLine="";
  if(s.completed_at) metaLine=`担当: ${esc(userName(s.assignee_id)||"—")} ／ 期限 ${fmtDD(s.due_date,s.due_time)} → ${fmtDT(s.completed_at)} 完了${esc(userName(s.completed_by)?" ("+userName(s.completed_by)+")":"")}`;
  else if(s._isCurrent) metaLine=`<span class="now-tag">いまここ</span> ／ 担当: ${esc(userName(s.assignee_id)||"未定")} ／ 期限 ${fmtDD(s.due_date,s.due_time)}`;
  else metaLine=`担当: ${esc(userName(s.assignee_id)||"未定")} ／ 期限 ${fmtDD(s.due_date,s.due_time)}`;
  const photos=stepPhotosFor(t,s.id);
  const links=stepLinksFor(t,s.id);
  const checklist=stepChecklistFor(t,s.id);
  const attCanEdit=canManage(u);
  // 2026-08-25: 実機フィードバックで「工程を開く」「添付・マニュアルを開く」の2回クリックが
  // 手間だと指摘を受け、完了操作（判定・必須写真・完了ボタン）を添付・マニュアル欄と同じ
  // パネルへ統合。開閉は1つの状態（STEP_ATT_OPEN）に一本化し、行全体のクリックでも
  // 「📎添付・マニュアル」ボタンのクリックでも同じパネルが開く
  const canComplete=!s.completed_at&&canTouch;
  // 2026-08-25(続き): 判定(is_binary)も必須写真(requires_photo)も無い単純な工程は、
  // 開かなくてもその場で完了できるよう行のメタ行に「✅完了にする」を追加してほしいとの
  // 実機フィードバック対応。判定・写真が要る工程は入力が要るため従来どおりパネルを開く
  const canQuickComplete=canComplete&&!s.is_binary&&!s.requires_photo;
  const hasPanel=links.length||photos.length||attCanEdit||canComplete;
  const panelOpen=STEP_ATT_OPEN.has(s.id);
  const stepNum=sortedSteps(t).indexOf(s)+1;
  const checkedCount=checklist.filter(c=>c.checked_at).length;
  return `<div class="step ${s._isCurrent?'cur':''} ${s.completed_at?'done':''}">
    <div class="row1" ${hasPanel?`data-stepattopen="${s.id}"`:""}>
      <span class="step-num">${s.completed_at?"✓":stepNum}</span>
      <div class="st">${esc(s.title)}<div class="meta">${metaLine}${checklist.length?` ／ チェック ${checkedCount}/${checklist.length}`:""}${s.completed_at&&canTouch?` ／ <button class="linkbtn" data-stepundo="${s.id}" onclick="event.stopPropagation()">↩️ 取り消す</button>`:""}${canQuickComplete?`<button class="btn sm" data-quickcomplete="${s.id}" style="margin-left:8px;vertical-align:middle" onclick="event.stopPropagation()">✅ 完了にする</button>`:""}</div>
      </div>
      ${hasPanel?`<span>${panelOpen?"▲":"▼"}</span>`:""}
    </div>
    ${hasPanel&&panelOpen?`<div style="padding:8px 12px 4px" onclick="event.stopPropagation()">
        ${canEditAssign?`<div class="ownerline">
          <div class="fieldbox"><label>担当</label><select data-stepowner="${s.id}"><option value="">未定</option>${assignableUsers().map(x=>`<option value="${x.id}" ${s.assignee_id===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
          <div class="fieldbox"><label>工程期限</label><div style="display:flex;gap:6px"><input type="date" data-stepdue="${s.id}" value="${esc(s.due_date||"")}" style="flex:1"><input type="time" data-steptime="${s.id}" value="${esc(s.due_time||"")}" style="flex:1"></div></div>
        </div>
        <div class="err" id="stepmetamsg-${s.id}"></div>`:""}
        ${(checklist.length||canTouch)?checklistStepHtml(s,checklist,canTouch):""}
        ${procedureHtml(s,canTouch)}
        ${(s.is_binary||s.requires_photo)&&canComplete?`<div class="step-body" style="border:0;padding:10px 0 0">
          ${s.is_binary?`<label>判定</label>
            <select id="judge-${s.id}"><option value="">選択してください</option><option value="ok">OK</option><option value="issue">異常あり</option></select>
            <div id="issuewrap-${s.id}" style="display:none"><label>異常メモ（必須）</label><textarea id="issuenote-${s.id}" rows="2" placeholder="内容を記入"></textarea></div>`:""}
          ${s.requires_photo?`<label>写真（必須）</label><input type="file" accept="image/*" capture="environment" id="stepphoto-${s.id}">
            <div class="photo-grid">${photos.map(p=>`<a ${photoTag(p.storage_path)} href="#" target="_blank"><img ${photoTag(p.storage_path)} src=""></a>`).join("")}</div>`:""}
        </div>`:""}
        ${attachBoxHtml(`tsatt-${s.id}`,links,photos,attCanEdit)}
        ${canComplete?`<div class="err" id="stepmsg-${s.id}"></div>
        <div class="proc-actions">
          ${canEditAssign?`<button class="btn sm" data-stepsavemeta="${s.id}">担当・期限を保存</button>`:""}
          <button class="btn sm" data-complete="${s.id}">この工程を完了</button>
        </div>`:""}
    </div>`:""}
  </div>`;
}

/* 店舗別チェックの一括完了ボタン。
   ・写真必須の工程は1店舗ずつ写真が要る（DBトリガーが強制）ので一括対象外
   ・自分が触れない（他人が担当の）行が残っている場合も、途中まで通って残りが

   ・2択(is_binary)の工程はまとめて「OK」を付ける。異常があった店舗は

function bulkDoneBtnHtml(rows,u){
  const rest=rows.filter(s=>!s.completed_at);
  if(rest.length<2) return "";
  if(rest.some(s=>s.requires_photo)) return `<div class="meta" style="padding:0 12px 6px">※ 写真必須のため一括完了はできません（店舗ごとに写真を添付してください）</div>`;
  const canDo=s=>canManage(u)||s.assignee_id===u.id||!s.assignee_id;
  if(!rest.every(canDo)) return "";
  const binary=rest.some(s=>s.is_binary);
  return `<div style="padding:0 12px 8px">
    <button class="btn sm" data-bulkids="${rest.map(s=>s.id).join(",")}" data-bulkbinary="${binary?1:0}" data-bulklabel="${esc(rows[0].title)}">
      ☑️ 残り${rest.length}店舗をまとめて完了${binary?"（OK）":""}
    </button>
  </div>`;
}
function stepOrGroupHtml(t,g,u){
  if(!g.isGroup) return stepHtml(t,g.rows[0],u);
  const sorted=g.rows.slice().sort((a,b)=>{
    const sa=STORES.find(x=>x.id===a.store_id), sb=STORES.find(x=>x.id===b.store_id);
    return (sa?sa.store_no:"").localeCompare(sb?sb.store_no:"");
  });
  const doneCount=sorted.filter(r=>r.completed_at).length;
  const first=sorted[0];
  return `<div class="step">
    <div style="padding:10px 12px 4px;font-weight:600">🏪 ${esc(first.title)} — ${doneCount}/${sorted.length}</div>
    ${bulkDoneBtnHtml(sorted,u)}
    <div style="padding:0 12px 10px">
    ${sorted.map(s=>{
      const store=STORES.find(x=>x.id===s.store_id); const name=store?store.name:"店舗";
      const canTouch=canManage(u)||s.assignee_id===u.id||(!s.assignee_id);
      const photos=stepPhotosFor(t,s.id);
      if(s.completed_at){
        const badge=s.judgement==="issue"?`<span style="color:var(--stall)">⚠ 異常あり</span>`:(s.is_binary?`<span style="color:var(--ok)">✓ OK</span>`:"✓");
        return `<div class="storecheck-row"><span style="flex:1">${esc(name)}</span>${badge}<span class="meta">${esc(s.issue_note||"—")}</span>${canTouch?`<button class="linkbtn" data-stepundo="${s.id}">↩️</button>`:""}</div>`;
      }
      if(!canTouch) return `<div class="storecheck-row"><span style="flex:1">${esc(name)}<div class="meta">担当: ${esc(userName(s.assignee_id)||"未定")} ／ 期限 ${fmtDD(s.due_date,s.due_time)}</div></span></div>`;
      const open=OPEN_STEP===s.id;
      return `<div style="border-bottom:1px solid var(--line)">
        <div class="storecheck-row" data-stepopen="${s.id}" style="cursor:pointer">
          <span style="flex:1">${esc(name)}<div class="meta">担当: ${esc(userName(s.assignee_id)||"未定")} ／ 期限 ${fmtDD(s.due_date,s.due_time)}</div></span><span>${open?"▲":"▼"}</span>
        </div>
        ${open?`<div class="step-body" style="padding-bottom:10px">
          ${s.is_binary?`<label>判定</label><select id="judge-${s.id}"><option value="">選択してください</option><option value="ok">OK</option><option value="issue">異常あり</option></select>
            <div id="issuewrap-${s.id}" style="display:none"><label>異常メモ（必須）</label><textarea id="issuenote-${s.id}" rows="2"></textarea></div>`:""}
          ${s.requires_photo?`<label>写真（必須）</label><input type="file" accept="image/*" capture="environment" id="stepphoto-${s.id}">
            <div class="photo-grid">${photos.map(p=>`<a ${photoTag(p.storage_path)} href="#" target="_blank"><img ${photoTag(p.storage_path)} src=""></a>`).join("")}</div>`:""}
          <button class="btn sm" style="margin-top:8px" data-complete="${s.id}">この工程を完了にする</button>
          <div class="err" id="stepmsg-${s.id}"></div>
        </div>`:""}
      </div>`;
    }).join("")}
    </div>
  </div>`;

function linkHtml(l,canEdit){
  // 全面刷新Phase3: デザイン案の「リソースカード」表示に合わせ、フラットな一覧行(.link-row)から
  // カード形式(.resource)へ変更

function wireBulkDone(taskIdOf,onDone){
  document.querySelectorAll("[data-bulkids]").forEach(btn=>{
    btn.onclick=async()=>{
      const ids=btn.dataset.bulkids.split(",").filter(Boolean);

      const r=await authed(`/rest/v1/hq_task_steps?id=in.(${ids.join(",")})`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(payload)});

/* 2026-08-26: 「これをテンプレートに登録」（単発タスク→繰り返しテンプレート化）。
   実機フィードバック対応：都度作成している単発タスクを、あとから「よく使うので繰り返しにしたい」
   となったときに一から作り直さなくて済むように、工程・チェックリストごと複製してテンプレート化する。
   添付ファイル（写真・URL・マニュアル）は引き継がない（テンプレート編集画面で個別に追加してもらう想定）。
   頻度（毎日/毎週/毎月）はタスク単体には無い情報のため対象日から妥当な既定値（毎月・その日）を
   入れておき、保存後に開く編集画面（openTplEdit）でユーザーに確認・調整してもらう流れにする */
async function registerTaskAsTemplate(t,u){
  const steps=sortedSteps(t);
  if(!steps.length){ alert("工程が1つもないタスクはテンプレートに登録できません"); return; }
  if(steps.some(s=>s.store_id)){ alert("店舗別に分かれた工程を含むタスクは、いまのところこの機能でテンプレート化できません（店舗ごとに別々の工程として登録されてしまいます）。既存のテンプレートを編集してご利用ください。"); return; }
  if(!confirm(`「${t.title}」の内容（工程・チェックリスト）をもとに新しいテンプレートを作成します。\n添付ファイル（写真・URL）は引き継がれません。よろしいですか？`)) return;
  const msg=$("taskactmsg"); if(msg){ msg.className="err"; msg.textContent="テンプレートを作成中…"; }
  const base=t.target_date||todayStr();
  const baseDate=new Date(base+"T00:00:00");
  const rawOffset=t.due_date?diffDaysStr(base,t.due_date):0;
  const payload={
    title:t.title, corp:t.corp, freq:"monthly", weekly_dow:null, monthly_dom:baseDate.getDate(),
    due_offset_days:Math.max(0,rawOffset), due_time:t.due_time||null,
    notes:t.notes||"", description:t.description||null, visibility:t.visibility||"all",
    alert_before3:true, alert_before1:true, alert_due:true, alert_overdue_daily:true,
    created_by:ME.id,
  };
  const tr=await authed("/rest/v1/hq_task_templates",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(payload)});
  if(!tr.ok||!tr.body||!tr.body[0]){ if(msg) msg.textContent="テンプレートを作成できませんでした（"+tr.status+"）"; return; }
  const tpl=tr.body[0];
  for(let i=0;i<steps.length;i++){
    const s=steps[i];
    const rawStepOffset=s.due_date?diffDaysStr(base,s.due_date):0;
    const stepBody={
      template_id:tpl.id, title:s.title, assignee_id:s.assignee_id||null,
      offset_days:Math.max(0,rawStepOffset), due_time:s.due_time||null,
      sort_order:(i+1)*10, kind:s.kind||"step",
      is_binary:!!s.is_binary, requires_photo:!!s.requires_photo,
      procedure_note:s.procedure_note||null,
    };
    const sr=await authed("/rest/v1/hq_task_template_steps",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(stepBody)});
    const newStep=sr.ok&&sr.body&&sr.body[0];
    if(!newStep) continue;
    const items=stepChecklistFor(t,s.id);
    if(items.length){
      await authed("/rest/v1/hq_step_checklist_items",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(
        items.map((it,ci)=>({template_step_id:newStep.id,title:it.title,sort_order:(ci+1)*10}))
      )});
    }
  }
  await fetchTemplates();
  alert("テンプレートを作成しました。頻度（毎日・毎週・毎月）など足りない項目を確認・入力して保存してください。");
  await openTplEdit(u,tpl);
}
async function uploadPhoto(file){
  const s=sess.get();
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const path=`${s.uid}/hqtask_${todayStr().replace(/-/g,"")}_${Date.now()}_${Math.random().toString(36).slice(2,7)}.${ext}`;
  const buf=await file.arrayBuffer();
  const r=await api(`/storage/v1/object/${BUCKET}/${path}`,{method:"POST",isBinary:true,headers:{"Content-Type":file.type||"image/jpeg"},body:buf},s.at);
  if(!r.ok) throw new Error("アップロード失敗");
  return path;
}

      const sid=btn.dataset.stepundo;
      const step=sortedSteps(t).find(s=>s.id===sid);
      const r=await authed(`/rest/v1/hq_task_steps?id=eq.${sid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({completed_at:null,judgement:null,issue_note:null})});
      if(!r.ok){ alert("取り消せませんでした（権限がない可能性があります）"); return; }
      await logActivity(t.id,"step_reopen",`工程「${step.title}」の完了を取り消し`,sid);
      CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    };
  });
  /* Phase3(全面刷新): タスク詳細から工程の担当・期限を常時表示フォームでその場変更
     （保存時にhq_task_activityへ履歴を残す。E-2の✏️編集開閉式から、デザイン案どおりの
     常時表示＋保存ボタン方式へ変更） */
  document.querySelectorAll("[data-stepsavemeta]").forEach(btn=>{
    btn.onclick=async(e)=>{
      e.stopPropagation();
      const sid=btn.dataset.stepsavemeta;
      const step=sortedSteps(t).find(s=>s.id===sid);
      const msg=$("stepmetamsg-"+sid); if(msg){ msg.className="err"; msg.textContent="保存中…"; }
      const newAssignee=document.querySelector(`[data-stepowner="${sid}"]`).value||null;
      const newDue=document.querySelector(`[data-stepdue="${sid}"]`).value||null;
      const newDueTime=document.querySelector(`[data-steptime="${sid}"]`).value||null;
      btn.disabled=true;
      const r=await authed(`/rest/v1/hq_task_steps?id=eq.${sid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
        body:JSON.stringify({assignee_id:newAssignee,due_date:newDue,due_time:newDueTime})});
      if(!r.ok){ if(msg) msg.textContent="保存できませんでした"; btn.disabled=false; return; }
      const changes=[];
      if((step.assignee_id||null)!==newAssignee) changes.push(`担当: ${userName(step.assignee_id)||"未定"}→${userName(newAssignee)||"未定"}`);
      if((step.due_date||null)!==newDue||(step.due_time||null)!==newDueTime) changes.push(`期限: ${fmtDD(step.due_date,step.due_time)}→${fmtDD(newDue,newDueTime)}`);
      if(changes.length) await logActivity(t.id,"comment",`工程「${step.title}」を編集（${changes.join("・")}）`,sid);
      CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    };
  });
  /* 2026-08-25(続き): 判定・必須写真の無い工程は行から直接ワンクリックで完了（実機フィードバック対応） */
  document.querySelectorAll("[data-quickcomplete]").forEach(btn=>{
    btn.onclick=async(e)=>{
      e.stopPropagation();
      const sid=btn.dataset.quickcomplete;
      const step=sortedSteps(t).find(s=>s.id===sid);
      btn.disabled=true; btn.textContent="処理中…";
      const r=await authed(`/rest/v1/hq_task_steps?id=eq.${sid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({completed_at:new Date().toISOString()})});
      if(!r.ok){ alert("完了にできませんでした（権限を確認してください）"); btn.disabled=false; btn.textContent="✅ 完了にする"; return; }
      await logActivity(t.id,"step_complete",`工程「${step.title}」完了`,sid);
      await notifyStepEvent(sid,"step_complete");
      STEP_ATT_OPEN.delete(sid);
      CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    };
  });
  document.querySelectorAll("[data-stepopen]").forEach(el=>{
    el.onclick=()=>{ const id=el.dataset.stepopen; OPEN_STEP=OPEN_STEP===id?null:id; renderDetail(u); };
  });
  /* E-3(B7): 工程内チェックリストのチェックオン/オフ・追加 */
  document.querySelectorAll("[data-chkitem]").forEach(cb=>{
    cb.onchange=async()=>{
      const id=cb.dataset.chkitem, checked=cb.checked;
      cb.disabled=true;
      const r=await authed(`/rest/v1/hq_step_checklist_items?id=eq.${id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},
        body:JSON.stringify(checked?{checked_at:new Date().toISOString(),checked_by:ME.id}:{checked_at:null,checked_by:null})});
      if(!r.ok){ alert("更新できませんでした"); cb.disabled=false; cb.checked=!checked; return; }
      CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    };
  });
  document.querySelectorAll("[data-chkadd]").forEach(btn=>{
    btn.onclick=async()=>{
      const sid=btn.dataset.chkadd;
      const input=document.querySelector(`[data-chknew="${sid}"]`);
      const title=(input.value||"").trim();
      if(!title) return;
      btn.disabled=true;
      const r=await authed("/rest/v1/hq_step_checklist_items",{method:"POST",headers:{Prefer:"return=minimal"},
        body:JSON.stringify({step_id:sid,title,sort_order:100})});
      if(!r.ok){ alert("追加できませんでした"); btn.disabled=false; return; }
      CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    };
  });
  document.querySelectorAll("[data-chkaddopen]").forEach(btn=>{
    btn.onclick=()=>{ CHK_ADD_OPEN.add(btn.dataset.chkaddopen); renderDetail(u); };
  });
  /* 2026-08-26: チェック項目の修正・削除（実機フィードバック対応。追加とチェックのオン/オフしか
     できず、間違えた項目名を直したり不要な項目を消したりできなかったため追加） */
  document.querySelectorAll("[data-chkedit]").forEach(btn=>{
    btn.onclick=async()=>{
      const id=btn.dataset.chkedit;
      const item=(t._stepChecklist||[]).find(c=>c.id===id);
      const newTitle=prompt("チェック項目名を編集", item?item.title:"");
      if(newTitle===null) return;
      const trimmed=newTitle.trim();
      if(!trimmed) return;
      const r=await authed(`/rest/v1/hq_step_checklist_items?id=eq.${id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({title:trimmed})});
      if(!r.ok){ alert("更新できませんでした"); return; }
      CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    };
  });
  document.querySelectorAll("[data-chkdel]").forEach(btn=>{
    btn.onclick=async()=>{
      if(!confirm("このチェック項目を削除しますか？"))return;
      const id=btn.dataset.chkdel;
      const r=await authed(`/rest/v1/hq_step_checklist_items?id=eq.${id}`,{method:"DELETE"});
      if(!r.ok){ alert("削除できませんでした"); return; }
      CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    };
  });
  /* 2026-08-26: 工程ごとの「📘手順書」をタスク側でも作成・編集できるように
     （テンプレート編集画面でしか書けなかったという実機フィードバック対応） */
  document.querySelectorAll("[data-procopen]").forEach(btn=>{
    btn.onclick=(e)=>{ e.stopPropagation(); PROC_EDIT_OPEN.add(btn.dataset.procopen); renderDetail(u); };
  });
  document.querySelectorAll("[data-procedit]").forEach(ta=>wireRichField(ta.id));
  document.querySelectorAll("[data-proccancel]").forEach(btn=>{
    btn.onclick=(e)=>{ e.stopPropagation(); PROC_EDIT_OPEN.delete(btn.dataset.proccancel); renderDetail(u); };
  });
  document.querySelectorAll("[data-procsave]").forEach(btn=>{
    btn.onclick=async(e)=>{
      e.stopPropagation();
      const sid=btn.dataset.procsave;
      const ta=document.querySelector(`[data-procedit="${sid}"]`);
      const note=(ta.value||"").trim()||null;
      btn.disabled=true;
      const r=await authed(`/rest/v1/hq_task_steps?id=eq.${sid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({procedure_note:note})});
      if(!r.ok){ alert("保存できませんでした"); btn.disabled=false; return; }
      PROC_EDIT_OPEN.delete(sid);
      CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    };
  });
  /* 2026-08-25: 工程ごとの添付・完了操作パネルの開閉。行全体(row1)と「📎添付・マニュアル」
     ボタンの両方にdata-stepattopenを付け、どちらを押しても同じ1つの状態を開閉する
     （「開く操作を1回にしてほしい」という実機フィードバックへの対応） */
  document.querySelectorAll("[data-stepattopen]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.stepattopen;
      if(STEP_ATT_OPEN.has(id)) STEP_ATT_OPEN.delete(id); else STEP_ATT_OPEN.add(id);
      renderDetail(u);
    };
  });
  /* 2026-08-26: 既存タスクへの工程追加 */
  if($("stepaddopen")) $("stepaddopen").onclick=()=>{ STEP_ADD_OPEN=true; renderDetail(u); };
  if($("stepaddcancel")) $("stepaddcancel").onclick=()=>{ STEP_ADD_OPEN=false; renderDetail(u); };
  if($("stepaddsave")) $("stepaddsave").onclick=async()=>{
    const title=$("sa-title").value.trim();
    const msg=$("stepaddmsg"); msg.textContent="";
    if(!title){ msg.textContent="工程名を入力してください"; return; }
    const maxSort=Math.max(0,...sortedSteps(t).map(s=>s.sort_order||0));
    const body={task_id:t.id,title,assignee_id:$("sa-assignee").value||null,due_date:$("sa-due").value||null,due_time:$("sa-duetime").value||null,sort_order:maxSort+10,kind:"step"};
    $("stepaddsave").disabled=true; msg.textContent="追加中…";
    const r=await authed("/rest/v1/hq_task_steps",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(body)});
    if(!r.ok){ msg.textContent="追加できませんでした"; $("stepaddsave").disabled=false; return; }
    await logActivity(t.id,"comment",`工程「${title}」を追加`);
    STEP_ADD_OPEN=false;
    CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
  };
  document.querySelectorAll("select[id^='judge-']").forEach(sel=>{
    sel.onchange=()=>{ const sid=sel.id.replace("judge-",""); const w=$("issuewrap-"+sid); if(w)w.style.display=sel.value==="issue"?"block":"none"; };
  });
  document.querySelectorAll("[data-complete]").forEach(btn=>{
    btn.onclick=async()=>{
      const sid=btn.dataset.complete;
      const step=sortedSteps(t).find(s=>s.id===sid);
      const msg=$("stepmsg-"+sid); msg.className="err"; msg.textContent="";
      const payload={completed_at:new Date().toISOString()};
      if(step.is_binary){
        const jv=$("judge-"+sid).value;
        if(!jv){msg.textContent="判定を選択してください";return;}
        payload.judgement=jv;
        if(jv==="issue"){ const note=$("issuenote-"+sid).value.trim(); if(!note){msg.textContent="異常メモを入力してください";return;} payload.issue_note=note; }
      }
      btn.disabled=true; msg.textContent="処理中…";
      try{
        if(step.requires_photo){
          const fi=$("stepphoto-"+sid); const existing=stepPhotosFor(t,sid).length;
          if(fi&&fi.files[0]){
            const path=await uploadPhoto(fi.files[0]);
            await authed("/rest/v1/hq_task_photos",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({step_id:sid,storage_path:path,uploaded_by:ME.id})});
          } else if(!existing){ btn.disabled=false; msg.textContent="写真を選択してください"; return; }
        }
        const r=await authed(`/rest/v1/hq_task_steps?id=eq.${sid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(payload)});
        if(!r.ok){ msg.textContent="完了にできませんでした（"+(r.status===409||r.status===400?"入力を確認してください":r.status)+"）"; btn.disabled=false; return; }
        await logActivity(t.id,"step_complete",`工程「${step.title}」完了`+(payload.issue_note?` — 異常あり: ${payload.issue_note}`:""),sid);
        await notifyStepEvent(sid,"step_complete");
        if(payload.judgement==="issue") await notifyStepEvent(sid,"issue_reported");
      }catch(e){ msg.textContent="エラー: "+e.message; btn.disabled=false; return; }
      OPEN_STEP=null; STEP_ATT_OPEN.delete(sid); CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    };
  });
  const kindSel=$("lk-kind");
  if(kindSel){
    ensureManualItems().then(()=>fillManualSelect($("lk-manualsel"),$("lk-manualempty")));
    kindSel.onchange=()=>{
      $("lk-urlwrap").style.display=kindSel.value==="url"?"block":"none";
      $("lk-manualwrap").style.display=kindSel.value==="manual"?"block":"none";
      $("lk-refwrap").style.display=kindSel.value==="credential"?"block":"none";
    };
  }
  if($("lk-add")) $("lk-add").onclick=async()=>{
    const kind=$("lk-kind").value, label=$("lk-label").value.trim();
    const payload={task_id:t.id,kind,created_by:ME.id};
    if(kind==="url"){
      const url=$("lk-url").value.trim();
      if(!url){$("lk-msg").textContent="URLを入力してください";return}
      payload.url=url; payload.label=label||url;
    } else if(kind==="manual"){
      const sel=$("lk-manualsel").value, freeUrl=$("lk-manualurl").value.trim();
      if(sel){
        const mi=(MANUAL_ITEMS||[]).find(x=>x.id===sel);
        payload.manual_id=sel; payload.url=mi?mi.url:null; payload.label=label||(mi?mi.label:"マニュアル");
      } else if(freeUrl){
        payload.url=freeUrl; payload.label=label||"マニュアル";
      } else {
        $("lk-msg").textContent="マニュアルを選択するかURLを入力してください"; return;
      }
    } else {
      if(!label){$("lk-msg").textContent="ラベルを入力してください";return}
      payload.label=label; payload.credential_ref=$("lk-ref").value.trim()||null;
    }
    $("lk-msg").textContent="追加中…";
    const r=await authed("/rest/v1/hq_task_links",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(payload)});
    if(!r.ok){$("lk-msg").textContent="追加できませんでした";return}
    await logActivity(t.id,"comment",`リンク追加: ${payload.label}`);
    CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
  };
  document.querySelectorAll("[data-dellink]").forEach(b=>b.onclick=async()=>{
    if(!confirm("このリンクを削除しますか？"))return;
    await authed(`/rest/v1/hq_task_links?id=eq.${b.dataset.dellink}`,{method:"DELETE"});
    CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
  });
  sortedSteps(t).forEach(s=>{
    wireAttachBox(`tsatt-${s.id}`,{step_id:s.id},canManage(u),async()=>{ CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u); });
  });
  if($("taskphoto")) $("taskphoto").onchange=async e=>{
    const f=e.target.files[0]; if(!f)return;
    const msg=$("taskphotomsg"); msg.textContent="アップロード中…";
    try{
      const path=await uploadPhoto(f);
      const r=await authed("/rest/v1/hq_task_photos",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({task_id:t.id,storage_path:path,uploaded_by:ME.id})});
      if(!r.ok){msg.textContent="登録に失敗しました";return}
      await logActivity(t.id,"photo","写真を追加");
      CUR_TASK=await fetchTaskDetail(t.id); renderDetail(u);
    }catch(err){ msg.textContent="エラー: "+err.message; }
  };
}

/* テンプレートを選んで、その場で1件つくる（対象日は既定=今日） */
let TPLPICK_Q="";
function tplFreqLabel(t){
  return t.freq==="weekly"?`毎週${["日","月","火","水","木","金","土"][t.weekly_dow]}曜`
    :t.freq==="monthly"?`毎月${t.monthly_dom}日`:FREQ_LABEL[t.freq];
}
function refreshTplPickList(u){
  const q=TPLPICK_Q.trim().toLowerCase();
  const list=TEMPLATES.filter(t=>t.is_active!==false)
    .filter(t=>!q||(t.title||"").toLowerCase().includes(q)||(t.corp||"").toLowerCase().includes(q));
  $("tpk-list").innerHTML=list.map(t=>`<div class="card" style="margin-bottom:8px">
      <div class="badges"><span class="tag">${esc(t.corp)}</span><span class="tag freq">🔁 ${esc(tplFreqLabel(t))}</span></div>
      <div style="font-weight:600;margin:4px 0">${esc(t.title)}</div>
      <div class="meta">期限: 対象日${t.due_offset_days?"の"+t.due_offset_days+"日後":"の当日"}${t.due_time?" "+t.due_time.slice(0,5):""}</div>
      <button class="btn sm" style="margin-top:8px" data-tplcreate="${t.id}">このテンプレートで追加</button>
    </div>`).join("")||`<div class="card">${TEMPLATES.length?"条件に合うテンプレートはありません":"使えるテンプレートがありません"}</div>`;
  document.querySelectorAll("[data-tplcreate]").forEach(b=>b.onclick=async()=>{
    const tpl=TEMPLATES.find(x=>x.id===b.dataset.tplcreate);
    const date=$("tpk-date").value||todayStr();
    if(!confirm(`「${tpl.title}」を対象日 ${fmtD(date)} で追加します。よろしいですか？`)) return;
    const msg=$("tpk-msg"); msg.className="err"; msg.textContent="作成中…"; b.disabled=true;
    const r=await authed("/rest/v1/rpc/hq_create_from_template",{method:"POST",body:JSON.stringify({p_template_id:tpl.id,p_target_date:date})});
    const row=(r.ok&&Array.isArray(r.body))?r.body[0]:null;
    if(!row||!row.task_id){ msg.textContent="追加できませんでした（権限がない可能性があります）"; b.disabled=false; return; }
    await fetchBoard();
    if(!row.was_created) alert("この対象日のタスクはすでに作成済みです。そのタスクを開きます。");
    openDetail(row.task_id);
  });
}
function renderTplPick(u){
  CURRENT_RENDER=()=>renderTplPick(u);
  $("app").innerHTML=`
  <div class="topbar"><h1>🔁 テンプレートから追加</h1><div class="who"><button class="linkbtn" id="back">← 戻る</button></div></div>
  <div class="card" style="margin-bottom:10px">
    <label>対象日（通常は今日のままでOK）</label>
    <input id="tpk-date" type="date" value="${todayStr()}">
    <div class="meta" style="margin-top:6px">対象日を基準にテンプレの期限が計算されます。同じテンプレ・同じ対象日のタスクが二重に作られることはありません。</div>
  </div>
  <div class="searchbox"><span class="mag">🔍</span><input id="tpk-q" type="search" placeholder="テンプレート名・法人で絞り込み" value="${esc(TPLPICK_Q)}"></div>
  <div id="tpk-list"></div>
  <div class="err" id="tpk-msg"></div>`;
  $("back").onclick=()=>goBack(u);
  let tm=null;
  $("tpk-q").oninput=e=>{ TPLPICK_Q=e.target.value; clearTimeout(tm); tm=setTimeout(()=>refreshTplPickList(u),250); };
  refreshTplPickList(u);
}

async function submitNewTask(u){
  const title=$("nt-title").value.trim();
  const msg=$("nt-msg"); msg.className="err"; msg.textContent="";
  if(!title){msg.textContent="タイトルを入力してください";return}
  const steps=NEW_STEPS.filter(s=>s.title.trim());
  if(!steps.length){msg.textContent="工程を1つ以上入力してください";return}
  const corp=$("nt-corp").value, target_date=todayStr();   // 対象日=作成日（固定・選択させない）
  const visibility=$("nt-vis").value;
  const dueSorted=steps.filter(s=>s.due_date).sort((a,b)=>(a.due_date+(a.due_time||"23:59")).localeCompare(b.due_date+(b.due_time||"23:59")));
  const lastDue=dueSorted[dueSorted.length-1]||null;
  const due_date=lastDue?lastDue.due_date:null, due_time=lastDue?(lastDue.due_time||null):null;
  $("nt-send").disabled=true; msg.textContent="作成中…";
  const tr=await authed("/rest/v1/hq_tasks",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify({
    title,corp,freq:"once",target_date,due_date,due_time,notes:$("nt-notes").value.trim(),description:$("nt-desc").value.trim()||null,visibility,created_by:ME.id
  })});
  if(!tr.ok||!tr.body||!tr.body[0]){ msg.textContent="作成できませんでした（"+tr.status+"）"; $("nt-send").disabled=false; return; }
  const taskId=tr.body[0].id;
  await authed("/rest/v1/hq_task_steps",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(
    steps.map((s,i)=>({task_id:taskId,title:s.title.trim(),assignee_id:s.assignee_id||null,due_date:s.due_date||null,due_time:s.due_time||null,sort_order:(i+1)*10,kind:"step"}))
  )});
  if(visibility==="members"){
    const sel=[...$("nt-members").selectedOptions].map(o=>o.value);
    if(sel.length) await authed("/rest/v1/hq_task_members",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(sel.map(uid=>({task_id:taskId,user_id:uid})))});
  }
  await logActivity(taskId,"create",`${u.name}さんが単発タスクを作成`);
  await fetchBoard();
  openDetail(taskId);
}

let DAILY_TASKS=[];
let OPEN_DAILY=null;
let DAILY_MINE=false;
async function fetchDaily(){
  const today=todayStr();
  const r=await authed(`/rest/v1/hq_tasks?freq=eq.daily&or=(target_date.eq.${today},status.neq.done)&select=*,hq_task_steps(*)&order=target_date.asc`);
  DAILY_TASKS=(r.ok&&Array.isArray(r.body))?r.body:[];
}
function groupStoreSteps(steps){
  const map=new Map(), order=[];
  steps.forEach(s=>{
    const key=(s.store_id&&s.template_step_id)?("g:"+s.template_step_id):("s:"+s.id);
    if(!map.has(key)){ map.set(key,{isGroup:!!(s.store_id&&s.template_step_id),rows:[],sort_order:s.sort_order}); order.push(key); }
    map.get(key).rows.push(s);
  });
  return order.map(k=>map.get(k)).sort((a,b)=>a.sort_order-b.sort_order);
}
async function ensureTodayGenerated(){
  try{ await authed("/rest/v1/rpc/hq_generate_today",{method:"POST",body:JSON.stringify({})}); }catch(e){}
}
function renderDaily(u){
  CURRENT_RENDER=()=>renderDaily(u);
  const today=todayStr();
  const todays=DAILY_TASKS.filter(t=>t.target_date===today);
  const pastDue=DAILY_TASKS.filter(t=>t.target_date<today && t.status!=="done");
  const visible=t=>!DAILY_MINE || sortedSteps(t).some(s=>s.assignee_id===u.id);
  const todaysV=todays.filter(visible), pastV=pastDue.filter(visible);
  const doneCount=todaysV.filter(t=>t.status==="done").length;
  const d=new Date(today+"T00:00:00");
  const wd=["日","月","火","水","木","金","土"][d.getDay()];
  $("app").innerHTML=`
  <div class="topbar"><h1>今日の毎日タスク ${d.getMonth()+1}/${d.getDate()}(${wd})</h1><div class="who"><button class="linkbtn" id="doprint">🖨 今日の分を印刷</button><button class="linkbtn" id="back">← 戻る</button></div></div>
  <div class="toprow"><div><b>${doneCount}/${todaysV.length} 完了</b></div>
    <div class="chiprow"><span class="chip ${!DAILY_MINE?'active':''}" id="dm-all">全員分</span><span class="chip ${DAILY_MINE?'active':''}" id="dm-mine">👤 自分の分</span></div>
  </div>
  ${pastV.length?`<div class="notes-box" style="margin-bottom:14px">🌅 休み明けです。${pastV.length}件たまっています。今日中に完了すればすべて「期限内」になります。</div>`:""}
  <div id="daily-list">
    ${pastV.map(t=>dailyRowHtml(t,u,true)).join("")}
    ${todaysV.map(t=>dailyRowHtml(t,u,false)).join("")||'<div class="card">今日の毎日タスクはありません</div>'}
  </div>`;
  $("back").onclick=()=>goBack(u);
  $("doprint").onclick=()=>openPrintSelect(u,todaysV);
  $("dm-all").onclick=()=>{DAILY_MINE=false;renderDaily(u);};
  $("dm-mine").onclick=()=>{DAILY_MINE=true;renderDaily(u);};
  wireDaily(u);
}
function dailyRowHtml(t,u,isPast){

      <span class="ic">${t.status==="done"?"✓":"▶"}</span>
      <div class="st">${esc(t.title)}${isPast?`<span class="tag" style="margin-left:6px">${fmtD(t.target_date)}分</span>`:""}
        <div class="meta">${done}/${steps.length} 完了${t.due_date?" ／ 期限 "+fmtDD(t.due_date,t.due_time):""}</div>
      </div>
      <span>${open?"▲":"▼"}</span>
    </div>
    ${open?`<div class="step-body">
      ${t.notes?`<div class="notes-box" style="margin-bottom:10px">📖 ${richTextHtml(t.notes)}</div>`:""}
      ${(t._links||[]).length?`<div class="resources">${(t._links||[]).map(l=>linkHtml(l,false)).join("")}</div>`:""}
      ${groups.map(g=>dailyGroupHtml(g,u)).join("")}

}
function dailyGroupHtml(g,u){

  if(!g.isGroup){

    }
    if(!canDo(s)) return `<div class="storecheck-row"><span>○</span><span style="flex:1">${esc(s.title)}</span><span class="meta">担当: ${esc(userName(s.assignee_id)||"未定")}</span></div>`;

      <div style="margin-bottom:6px">${esc(s.title)}${s.due_date?` <span class="meta">期限 ${fmtDD(s.due_date,s.due_time)}</span>`:""}</div>
      ${s.is_binary?`<label>判定</label><select id="djudge-${s.id}"><option value="">選択してください</option><option value="ok">OK</option><option value="issue">異常あり</option></select>
        <div id="dissuewrap-${s.id}" style="display:none"><label>異常メモ（必須）</label><textarea id="dissuenote-${s.id}" rows="2"></textarea></div>`:""}

    ${g.rows.map(s=>{
      const store=STORES.find(x=>x.id===s.store_id);
      const name=store?store.name:"店舗";
      if(s.completed_at){
        const okBadge=s.judgement==="issue"?`<span style="color:var(--stall)">⚠ 異常あり</span>`:(s.is_binary?`<span style="color:var(--ok)">✓ OK</span>`:"✓");
        return `<div class="storecheck-row"><span style="flex:1">${esc(name)}</span>${okBadge}<span class="meta">${esc(s.issue_note||"—")}</span>${canDo(s)?`<button class="linkbtn" data-stepundo="${s.id}">↩️</button>`:""}</div>`;
      }
      if(!canDo(s)) return `<div class="storecheck-row"><span style="flex:1">${esc(name)}</span><span class="meta">未確認</span></div>`;

        <input type="text" id="dissuenote-${s.id}" placeholder="異常メモ必須" style="width:auto;display:none">
        ${s.requires_photo?`<input type="file" accept="image/*" capture="environment" id="dphoto-${s.id}" style="width:auto">`:""}

    }).join("")}

}
function wireDaily(u){
  wireBulkDone(sid=>{ for(const t of DAILY_TASKS){ if(sortedSteps(t).some(x=>x.id===sid)) return t.id; } return null; },
               async()=>{ await fetchDaily(); renderDaily(u); });
  document.querySelectorAll("[data-dailyopen]").forEach(el=>{
    el.onclick=async()=>{
      const id=el.dataset.dailyopen;
      if(OPEN_DAILY===id){ OPEN_DAILY=null; renderDaily(u); return; }
      OPEN_DAILY=id;
      const t=DAILY_TASKS.find(x=>x.id===id);
      if(t&&!t._links){ const r=await authed(`/rest/v1/hq_task_links?task_id=eq.${id}&order=created_at`); t._links=r.ok?r.body:[]; }
      renderDaily(u);
    };
  });
  document.querySelectorAll("select[id^='djudge-']").forEach(sel=>{
    sel.onchange=()=>{
      const sid=sel.id.replace("djudge-","");
      const w=$("dissuewrap-"+sid); if(w) w.style.display=sel.value==="issue"?"block":"none";
      const inline=$("dissuenote-"+sid); if(inline&&!w) inline.style.display=sel.value==="issue"?"inline-block":"none";
    };
  });
  document.querySelectorAll("[data-stepundo]").forEach(btn=>{
    btn.onclick=async()=>{
      const sid=btn.dataset.stepundo;
      let step=null,parentTask=null;
      for(const t2 of DAILY_TASKS){ const s=sortedSteps(t2).find(x=>x.id===sid); if(s){step=s;parentTask=t2;break;} }
      if(!step)return;
      const r=await authed(`/rest/v1/hq_task_steps?id=eq.${sid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({completed_at:null,judgement:null,issue_note:null})});
      if(!r.ok){ alert("取り消せませんでした（権限がない可能性があります）"); return; }
      await logActivity(parentTask.id,"step_reopen",`「${step.title}」の完了を取り消し`,sid);
      await fetchDaily(); renderDaily(u);
    };
  });
  document.querySelectorAll("[data-dcomplete]").forEach(btn=>{
    btn.onclick=async()=>{
      const sid=btn.dataset.dcomplete;
      let step=null,parentTask=null;
      for(const t of DAILY_TASKS){ const s=sortedSteps(t).find(x=>x.id===sid); if(s){step=s;parentTask=t;break;} }
      if(!step)return;
      const payload={completed_at:new Date().toISOString()};
      if(step.is_binary){
        const jv=$("djudge-"+sid)?.value;
        if(!jv){ alert("判定（OK・異常あり）を選択してください"); return; }
        payload.judgement=jv;
        if(jv==="issue"){
          const note=($("dissuenote-"+sid)?.value||"").trim();
          if(!note){ alert("異常メモを入力してください"); return; }
          payload.issue_note=note;
        }
      }
      btn.disabled=true;
      try{
        if(step.requires_photo){
          const fi=$("dphoto-"+sid);
          if(fi&&fi.files[0]){
            const path=await uploadPhoto(fi.files[0]);
            await authed("/rest/v1/hq_task_photos",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({step_id:sid,storage_path:path,uploaded_by:ME.id})});
          } else { alert("写真を選択してください"); btn.disabled=false; return; }
        }
        const r=await authed(`/rest/v1/hq_task_steps?id=eq.${sid}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify(payload)});
        if(!r.ok){ alert("完了にできませんでした"); btn.disabled=false; return; }
        await logActivity(parentTask.id,"step_complete",`「${step.title}」完了`+(payload.issue_note?` — 異常あり: ${payload.issue_note}`:""),sid);
        await notifyStepEvent(sid,"step_complete");
        if(payload.judgement==="issue") await notifyStepEvent(sid,"issue_reported");
      }catch(e){ alert("エラー: "+e.message); btn.disabled=false; return; }
      await fetchDaily(); renderDaily(u);
    };
  });
}

let TEMPLATES=[];
let TPL_EDIT=null;
let TPL_STEPS=[];
async function fetchTemplates(){
  // 2026-08-26(Phase4): デザイン案のテンプレート一覧（表形式・工程数列あり）に合わせるため、
  // 件数だけをPostgRESTの埋め込みcountで取得する（工程本体は編集画面を開いたときだけ取得のまま）
  const r=await authed("/rest/v1/hq_task_templates?select=*,hq_task_template_steps(count)&order=created_at.desc");
  TEMPLATES=(r.ok&&Array.isArray(r.body))?r.body:[];
}
function tplStepCount(tpl){ return tpl.hq_task_template_steps?.[0]?.count??0; }
let TPL_FILTER={freq:"",corp:"",q:""};
function filteredTemplates(){
  const q=TPL_FILTER.q.trim().toLowerCase();
  return TEMPLATES.filter(t=>{
    if(TPL_FILTER.freq && t.freq!==TPL_FILTER.freq) return false;
    if(TPL_FILTER.corp && t.corp!==TPL_FILTER.corp) return false;
    if(q && !((t.title||"").toLowerCase().includes(q)||(t.notes||"").toLowerCase().includes(q)||(t.description||"").toLowerCase().includes(q))) return false;
    return true;
  });
}
// 一覧だけ差し替える（フリーワード入力中にフォーカスが飛ばないように全体再描画はしない）
function refreshTplList(u){
  const list=filteredTemplates();
  $("tpl-count").textContent=`${list.length}/${TEMPLATES.length}件`;
  // 2026-08-26(Phase4): デザイン案の「テンプレート一覧」は表形式（テンプレート名/法人/頻度/工程数/
  // 作成者/更新日/編集）なので、既存のカード列挙から表へレイアウトを合わせた（項目・機能は維持）
  $("tpl-list").innerHTML=list.length?`<div class="card tablewrap" style="overflow-x:auto">
    <table class="rp-table"><thead><tr><th>テンプレート名</th><th>法人</th><th>頻度</th><th>工程</th><th>作成者</th><th>更新日</th><th></th></tr></thead>
    <tbody>${list.map(tplRowHtml).join("")}</tbody></table>
  </div>`:`<div class="card">${TEMPLATES.length?"条件に合うテンプレートはありません":"テンプレートはまだありません"}</div>`;
  document.querySelectorAll("[data-tpledit]").forEach(b=>b.onclick=()=>openTplEdit(u,TEMPLATES.find(x=>x.id===b.dataset.tpledit)));
  document.querySelectorAll("[data-tplcopy]").forEach(b=>b.onclick=()=>duplicateTemplate(u,TEMPLATES.find(x=>x.id===b.dataset.tplcopy)));
  document.querySelectorAll("[data-tpldel]").forEach(b=>b.onclick=async()=>{
    if(!confirm("このテンプレートを削除しますか？（生成済みのタスクは残ります）"))return;

    await fetchTemplates(); refreshTplList(u);
  });

/* E-3(B1): テンプレートの複製（工程・通知設定ごと。複製後は内容確認のため停止中で作成） */
async function duplicateTemplate(u,tpl){
  if(!confirm(`「${tpl.title}」を複製します。工程・通知設定もまるごとコピーし、複製後は内容を確認できるよう停止中の状態で作成されます。よろしいですか？`)) return;
  const stepsR=await authed(`/rest/v1/hq_task_template_steps?template_id=eq.${tpl.id}&order=sort_order`);
  const srcSteps=(stepsR.ok&&Array.isArray(stepsR.body))?stepsR.body:[];
  let memberIds=[];
  if(tpl.visibility==="members"){
    const mr=await authed(`/rest/v1/hq_task_members?template_id=eq.${tpl.id}&select=user_id`);
    memberIds=(mr.ok&&Array.isArray(mr.body))?mr.body.map(x=>x.user_id):[];
  }
  const payload={
    title:tpl.title+"のコピー", corp:tpl.corp, freq:tpl.freq,
    weekly_dow:tpl.weekly_dow, monthly_dom:tpl.monthly_dom,
    due_offset_days:tpl.due_offset_days||0, due_time:tpl.due_time||null,
    notes:tpl.notes||"", description:tpl.description||null,
    visibility:tpl.visibility,
    alert_before3:tpl.alert_before3, alert_before1:tpl.alert_before1, alert_due:tpl.alert_due, alert_overdue_daily:tpl.alert_overdue_daily,
    alert_recipient:tpl.alert_recipient, alert_extra_user_ids:tpl.alert_extra_user_ids, alert_channels:tpl.alert_channels,
    is_active:false, created_by:u.id,
  };
  const r=await authed("/rest/v1/hq_task_templates",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(payload)});
  if(!r.ok||!r.body||!r.body[0]){ alert("複製できませんでした"); return; }
  const newId=r.body[0].id;
  if(srcSteps.length){
    await authed("/rest/v1/hq_task_template_steps",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(
      srcSteps.map(s=>({template_id:newId,title:s.title,assignee_id:s.assignee_id||null,offset_days:s.offset_days||0,due_time:s.due_time||null,sort_order:s.sort_order,kind:s.kind||"step",store_scope:s.store_scope||null,store_ids:s.store_ids||null,is_binary:!!s.is_binary,requires_photo:!!s.requires_photo}))
    )});
  }
  if(memberIds.length){
    await authed("/rest/v1/hq_task_members",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify(memberIds.map(uid=>({template_id:newId,user_id:uid})))});
  }
  await fetchTemplates(); refreshTplList(u);
}

/* 期限は「対象日から何日後か」で保存する（毎回の対象日を基準に自動計算されるため）。
   ただしオフセットの数字は分かりにくいので、画面上は必ず実日付で見せる。
   その基準になるのが「次にこのテンプレから作られる対象日」= tplBaseDate()。 */
let TPL_DUE_OFFSET=0;
function tplBaseDate(){
  const today=todayStr();
  const freq=$("tp-freq")?$("tp-freq").value:(TPL_EDIT&&TPL_EDIT.freq)||"monthly";
  if(freq==="daily") return today;
  if(freq==="weekly"){
    const dow=+(($("tp-dow")&&$("tp-dow").value)??((TPL_EDIT&&TPL_EDIT.weekly_dow)||0));
    const d=new Date(today+"T00:00:00");
    return addDaysStr(today,(dow-d.getDay()+7)%7);
  }
  const domRaw=+(($("tp-dom")&&$("tp-dom").value)??((TPL_EDIT&&TPL_EDIT.monthly_dom)||1));
  const dom=Math.min(31,Math.max(1,domRaw||1));
  const d=new Date(today+"T00:00:00");
  let y=d.getFullYear(), m=d.getMonth();
  if(Math.min(dom,new Date(y,m+1,0).getDate())<d.getDate()){ m++; if(m>11){m=0;y++;} }
  return ymd(new Date(y,m,Math.min(dom,new Date(y,m+1,0).getDate())));
}
function refreshTplDueDates(){
  const base=tplBaseDate();
  if($("tp-duedate")) $("tp-duedate").value=addDaysStr(base,TPL_DUE_OFFSET);
  if($("tp-basehint")) $("tp-basehint").textContent=
    `次に作られる対象日は ${fmtD(base)} です。期限は「対象日の${TPL_DUE_OFFSET===0?"当日":TPL_DUE_OFFSET+"日後"}」として保存され、毎回の対象日に合わせて自動でずれます。`;
  TPL_STEPS.forEach((s,i)=>{
    const el=document.querySelector(`#tp-steps [data-tidx="${i}"] .ts-due`);
    if(el) el.value=addDaysStr(base,s.offset_days||0);
    const hint=document.querySelector(`#tp-steps [data-tidx="${i}"] .ts-duehint`);
    if(hint) hint.textContent=(s.offset_days||0)===0?"対象日の当日":`対象日の${s.offset_days}日後`;
  });
  renderTplPreviewPanel();
}

async function saveTemplate(u){

  const keepIds=steps.map(s=>s.id).filter(Boolean);
