name: _p一時検証（実行後に削除）
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: api
        env:
          SR_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          A="https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-api-dashboard-summary"
          for B in '{"kind":"media_daily","months":24,"limit":5000}' '{"kind":"media_daily","months":24,"limit":5000,"offset":15000}' '{"kind":"pl_entries","months":36,"limit":5000}' '{"kind":"spot","months":24,"limit":5000}' '{"kind":"loan","months":36,"limit":5000}'; do
            echo "== $B"
            curl -s -m 100 -X POST "$A" -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d "$B" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log('ok',j.ok,'rows',j.rows&&j.rows.length,'hasMore',j.hasMore,'next',j.nextOffset,'fresh',j.fresh,'sample',JSON.stringify(j.rows&&j.rows[0]),j.error||'')}catch(e){console.log(s.slice(0,300))}})"
          done
          echo "== 不正トークン(403想定)"
          curl -s -m 30 -w "\nHTTP %{http_code}\n" -X POST "https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-kd-refresh" -H "Content-Type: application/json" -d '{"op":"entries","token":"x"}'
