name: P一時検証(削除予定)
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: ページング修正後の再計算(dashboard_daily → store_monthly → pl_monthly → deposit_monthly)
        env:
          SR_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          U=https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-kd-refresh
          for B in '{"op":"dashboard_daily"}' '{"op":"store_monthly"}' '{"op":"pl_monthly"}' '{"op":"deposit_monthly"}'; do
            echo "== $B"; curl -s -m 280 -X POST $U -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d "$B" | cut -c1-260; echo
          done
