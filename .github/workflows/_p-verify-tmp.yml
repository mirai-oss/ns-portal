name: P一時検証(削除予定)
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: 明細カバレッジ
        env:
          SR_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -m 200 -X POST https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-kd-refresh -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d '{"op":"diag_detail_cov"}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);if(!j.ok){console.log('COV ERR',s.slice(0,300));return}console.log('COV header',JSON.stringify(j.header));for(const r of j.rows)console.log('COV',JSON.stringify(r))}catch(e){console.log('COV RAW',s.slice(0,300))}})"
