name: P一時検証(削除予定)
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    steps:
      - name: api-home
        env:
          SR_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -m 60 -X POST https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-api-home -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d "{}" | node -e "let s=\"\";process.stdin.on(\"data\",d=>s+=d).on(\"end\",()=>{const j=JSON.parse(s);console.log(\"HOME\",j.ok,\"asOf\",j.asOf,\"dataDate\",j.dataDate,\"monthStart\",j.monthStart,\"latestBizDate\",j.latestBizDate);const t=j.totals||{};console.log(\"HOME totals todaySales\",t.todaySales,\"mtdSales\",t.mtdSales,\"target\",t.target,\"targetRate\",t.targetRate,\"priorYearSameWeekdaySales\",t.priorYearSameWeekdaySales,\"mtdFlRate\",t.mtdFlRate);if(!j.ok)console.log(s.slice(0,300))})"
