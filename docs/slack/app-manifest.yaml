# =============================================================
# N-Style 通知Bot — Slack App Manifest（Phase 1・2026-10-29）
# 使い方: https://api.slack.com/apps → Create New App → From a manifest → YAML にこのファイルを貼り付け
# 詳細手順: docs/手順書_Slackアプリ作成とトークン保存_2026-10-29.md
#
# 設計上のポイント（docs/設計書_Slack通知基盤_Phase1_2026-10-29.md §3）
# - Socket Mode は使わない（socket_mode_enabled: false）。App Token も発行しない。
# - Interactivity（ボタン・モーダル）は最初から ON にし、Request URL を Supabase Edge Function
#   `slack-interact`（署名検証つき）に固定する。Phase 1 の通知にはボタンを付けないので、
#   この関数が未デプロイでも通知は影響を受けない（ボタン付き通知は Phase 3 以降に出す）。
# - Event Subscriptions（メッセージ受信など）は使わない。Hermes/Mirai の窓口は別アプリで載せる。
# - トークン類はこのファイルには一切含まれない（Bot Token は作成後に画面でコピー→ローカルの秘密ファイルへ）。
# =============================================================
display_information:
  name: N-Style 通知Bot
  description: 管理システム（ポータル・nippo・経営ダッシュボード・日次取込）からの業務通知
  background_color: "#2c3e50"
  long_description: >-
    N-Styleグループの社内管理システムからの通知を Slack に届ける Bot です。
    経営レポート・経理/取込の監視・開発/システム監視を Phase 1 で、
    本部メンバー個人への承認依頼や申請確認（DM）を Phase 3 で扱います。
    通知の正本は管理システム側にあり、Slack は通知と簡易操作の入口です。
features:
  bot_user:
    display_name: N-Style通知
    always_online: true
oauth_config:
  scopes:
    bot:
      # --- Phase 1（送信） ---
      - chat:write            # チャンネル/DMへメッセージ送信・自分の送信の更新(chat.update)
      - chat:write.public     # Botを招待していない公開チャンネルにも送れる（招待し忘れ対策）
      - chat:write.customize  # 送信ごとに表示名/アイコンを変えられる（「経営日報」「取込監視」など送信元を見分ける）
      - channels:read         # 公開チャンネルの一覧・ID確認（channel_key ↔ チャンネルIDの登録補助）
      - groups:read           # 非公開チャンネルの一覧・ID確認（経営レポートを非公開にする場合）
      # --- Phase 3（個人DM・自動照合）。Phase 1 の時点で付けておくと再インストールが不要 ---
      - im:write              # 個人DMを開く(conversations.open)
      - users:read            # ワークスペースのユーザー一覧
      - users:read.email      # メールアドレスで従業員マスタと自動照合する
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  interactivity:
    is_enabled: true
    # ボタン押下・モーダル送信はすべてこの1本に届く（署名検証→権限確認→既存RPC/APIの順。DB直接更新は禁止）
    request_url: https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/slack-interact
