            <tr><th>勘定科目・部門</th><th>金額</th><th>勘定科目</th><th>金額</th></tr>
          </thead>
          <tbody id="mfj-branch-rows">${MFJ_STATE.branches.map((br,i)=>mfjBranchRowHtml(br,i)).join("")}</tbody>
        </table>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px">💡 各行は借方・貸方のどちらか片方だけでも登録できます（例: 借方2行に分けて、貸方は1行にまとめる）。借方合計と貸方合計さえ一致していれば登録できます</div>
      <div class="mail-actions" style="margin-top:6px">
        <button id="mfj-add-row">＋ 明細行を追加（振替伝票・複合仕訳の場合）</button>
        <button id="mfj-save-template">💾 この内容を仕訳辞書に登録</button>
      </div>
      <div class="ai-grid" style="margin-top:8px">
        <div class="ai-field"><small>日付（会計計上日・自由に変更可）</small><input id="mfj-date" type="date" value="${esc(MFJ_STATE.date)}"></div>
        <div class="ai-field"><small>摘要（全体・行ごとの摘要が空の場合に使われます）</small><input id="mfj-remark" value="${esc(MFJ_STATE.remark)}"></div>
      </div>
      ${(SELECTED.atts&&SELECTED.atts.length)?`<div class="ai-field" style="margin-top:8px"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="mfj-attach-files" checked>📎 メールの添付ファイル（${SELECTED.atts.length}件）もマネーフォワードへ証憑として添付する</label></div>`:""}
      <div class="mail-actions" style="margin-top:8px">
        <button class="primary" id="mfj-confirm">👁 プレビュー・確認画面へ</button>
      </div>`}
      <div class="err" id="mfj-msg" style="margin-top:6px"></div>
    `;
    document.querySelectorAll("[data-mfjmode]").forEach(btn=>btn.onclick=()=>{
      MFJ_STATE.mode=btn.dataset.mfjmode;
      if(MFJ_STATE.mode==="manual"&&!MFJ_STATE.branches.length) mfjAddBranchRow();
      mfjRenderForm();
    });
    if($("mfj-change-tenant")) $("mfj-change-tenant").onclick=()=>mfjShowTenantPicker(MFJ_STATE.tenants);
    if(mode==="journal"){
      mfjRenderJournalResults();
      let t=null;
      $("mfj-journal-search").oninput=()=>{ clearTimeout(t); const kw=$("mfj-journal-search").value.trim(); t=setTimeout(()=>mfjRunJournalSearch(kw),350); };
      return;
    }
    if(mode==="dict"){
      mfjRenderTemplateResults();
      return;
    }
    mfjWireBranchRows();
    $("mfj-add-row").onclick=()=>{ mfjAddBranchRow(); mfjRenderForm(); };
    $("mfj-save-template").onclick=mfjSaveAsTemplate;
    $("mfj-confirm").onclick=()=>mfjOpenPreview();
  }

  // プレビュー（マネーフォワード入力画面の振替伝票プレビューと同じ見た目：借方/貸方を並べたカード＋貸借バランス）
  function mfjOpenPreview(){
    const msg=$("mfj-msg"); msg.className="err"; msg.textContent="";
    const branchesPayload=[];
    let totalDebit=0, totalCredit=0;
    for(const b of MFJ_STATE.branches){
      const debit=b.debitLabel?MFJ_STATE.accountLabelMap.get(b.debitLabel):null;
      const credit=b.creditLabel?MFJ_STATE.accountLabelMap.get(b.creditLabel):null;
      if(b.debitLabel&&!debit){ msg.textContent="借方はプルダウンの候補から選択してください（自由入力のままだと登録できません）"; return; }
      if(b.creditLabel&&!credit){ msg.textContent="貸方はプルダウンの候補から選択してください（自由入力のままだと登録できません）"; return; }
      if(!debit&&!credit) continue;
      const dAmt=debit?Number(b.debitAmount):null, cAmt=credit?Number(b.creditAmount):null;
      if(debit&&(!dAmt||dAmt<=0)){ msg.textContent="借方の金額が未入力（0円）の行があります"; return; }
      if(credit&&(!cAmt||cAmt<=0)){ msg.textContent="貸方の金額が未入力（0円）の行があります"; return; }
      if(debit) totalDebit+=dAmt; if(credit) totalCredit+=cAmt;
      branchesPayload.push({debit,debitAmount:dAmt,credit,creditAmount:cAmt,department_id:b.department_id||null,tax_id:b.tax_id||null,credit_department_id:b.credit_department_id||null,credit_tax_id:b.credit_tax_id||null,remark:b.remark||""});
    }
    if(!branchesPayload.length){ msg.textContent="明細行がありません"; return; }
    if(totalDebit!==totalCredit){ msg.textContent=`借方合計（${yen(totalDebit)}）と貸方合計（${yen(totalCredit)}）が一致していません`; return; }
    const date=$("mfj-date").value, remark=$("mfj-remark").value;
    const entries=branchesPayload.map(b=>{
      const deptName=(MFJ_STATE.departments.find(d=>d.id===b.department_id)||{}).name||"";
      return `<div class="mfj-preview-entry">
        <div class="mfj-preview-head"><div>借方</div><div>貸方</div></div>
        <div class="mfj-preview-body">
          <div class="mfj-preview-side"><div class="acc">${b.debit?esc(mfjLabelOf(b.debit)):"—"}</div><div class="sub">${esc(deptName)}</div><div class="money">${b.debit?yen(b.debitAmount):"—"}</div></div>
          <div class="mfj-preview-side"><div class="acc">${b.credit?esc(mfjLabelOf(b.credit)):"—"}</div><div class="sub"></div><div class="money">${b.credit?yen(b.creditAmount):"—"}</div></div>
        </div>
        ${b.remark?`<div class="mfj-preview-remark">${esc(b.remark)}</div>`:""}
      </div>`;
    }).join("");

    const modal=document.createElement("div");
    modal.className="modal-bg"; modal.id="mfjPreviewModal";
    modal.innerHTML=`<div class="modal" style="max-width:820px">
      <div class="mhead"><h2>🧾 振替伝票プレビュー</h2><button class="linkbtn" id="mfjPreviewClose" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px">閉じる ×</button></div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">登録先: <b>${esc(MFJ_STATE.tenantLabel||MFJ_STATE.tenantId)}</b>　日付: <b>${esc(date)}</b>　全体の摘要: <b>${esc(remark||"（なし）")}</b></div>
      <div class="mfj-balance" style="margin:0 0 10px">
        <div class="box"><small>借方合計</small><b>${yen(totalDebit)}</b></div>
        <div class="box"><small>貸方合計</small><b>${yen(totalCredit)}</b></div>
        <div class="box ok"><small>差額</small><b>¥0</b></div>
      </div>
      ${entries}
      <div class="err" id="mfjPreviewMsg" style="margin-top:6px"></div>
      <div class="mail-actions" style="margin-top:12px">
        <button id="mfjPreviewBack">← 戻って修正</button>
        <button class="primary" id="mfjPreviewSubmit">✅ この内容で登録</button>
      </div>
    </div>`;
    document.body.appendChild(modal);
    pushNav({modal:true});
    modal.onclick=e=>{ if(e.target===modal) history.back(); };
    $("mfjPreviewClose").onclick=()=>history.back();
    $("mfjPreviewBack").onclick=()=>history.back();
    $("mfjPreviewSubmit").onclick=async()=>{
      $("mfjPreviewSubmit").disabled=true;
      const pmsg=$("mfjPreviewMsg"); pmsg.className="err"; pmsg.textContent="登録中…";
      const payload={
        invoice_id: SELECTED.invoice.id,
        tenant_id: MFJ_STATE.tenantId,
        branches: branchesPayload.map(b=>({
          debit:b.debit?{account_id:b.debit.account_id,sub_account_id:b.debit.sub_account_id||undefined,value:b.debitAmount}:undefined,
          credit:b.credit?{account_id:b.credit.account_id,sub_account_id:b.credit.sub_account_id||undefined,value:b.creditAmount}:undefined,
          department_id:b.department_id||null, tax_id:b.tax_id||null,
          credit_department_id:b.credit_department_id||null, credit_tax_id:b.credit_tax_id||null,
          remark:b.remark||undefined,
        })),
        transaction_date: date,
        remark,
        linked_hq_step_id: LINKED_HQ_STEP?LINKED_HQ_STEP.id:null, // 保存前でも画面上の選択を優先させる（DB保存漏れ対策）
        attach_files: $("mfj-attach-files")?$("mfj-attach-files").checked:false,
        // PL連携対象科目かどうかの判定用（手数料等→PL自動反映・ラウンド5指示書§6.1）。MF送信には使わない
        debit_account_names: branchesPayload.filter(b=>b.debit).map(b=>mfjLabelOf(b.debit)),
      };
      const {ok,body:j}=await mfjCall("create",payload);
      if(!ok){ pmsg.textContent=j.error||"登録に失敗しました"; $("mfjPreviewSubmit").disabled=false; return; }
      pmsg.className="err msg-ok";
      pmsg.textContent=`登録しました（伝票番号: ${j.journal_number??"-"}）`
        +(j.voucher_attached?`。添付ファイルも${j.voucher_attached}件添付しました`:j.voucher_error?`（添付: ${j.voucher_error}）`:"")
        +(LINKED_HQ_STEP?(j.hq_step_completed?"。紐付けた本部タスクの工程も完了にしました":j.hq_step_error?`（本部タスクの自動完了には失敗: ${j.hq_step_error}）`:""):"")
        +"。画面を更新します…";
      setTimeout(()=>{ history.back(); reloadDetail(); },900);
    };
  }

  // ダウンロードリンク＋パスワード式などメールに直接添付がない請求書を、ダウンロード後に
  // 手動でアップロードしてこのメールへ紐付ける（ファイルはユーザー自身のJWTでstorageへ直接
  // アップロードし、invoice_attach_manual_file RPCでメタデータ登録＋監査ログに記録）
  if($("manual-att-drop")){
    const drop=$("manual-att-drop");
    ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background="var(--m-bg,#f4f1eb)"; drop.style.borderColor="var(--accent)"; }));
    ["dragleave","dragend"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background=""; drop.style.borderColor=""; }));
    drop.addEventListener("drop",e=>{
      e.preventDefault(); drop.style.background=""; drop.style.borderColor="";
      const f=e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f) $("manual-att-file").files=e.dataTransfer.files;
    });
  }
  $("manual-att-upload").onclick=async()=>{
    const msg=$("manual-att-msg");
    const f=$("manual-att-file").files[0];
    if(!f){ msg.textContent="ファイルを選択してください"; return; }
    $("manual-att-upload").disabled=true; msg.className="err"; msg.textContent="アップロード中…";
    try{
      const buf=await f.arrayBuffer();
      const hashBuf=await crypto.subtle.digest("SHA-256",buf);
      const hash=Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,"0")).join("");
      const ext=(f.name.split(".").pop()||"").toLowerCase().replace(/[^a-z0-9]/g,"");
      const path=`${emailId}/manual_${Date.now()}${ext?"."+ext:""}`;
      const s=sess.get();
      const upRes=await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${path}`,{
        method:"POST",
        headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:""),"Content-Type":f.type||"application/octet-stream"},
        body:buf
      });
      if(!upRes.ok) throw new Error("アップロードに失敗しました");
      const r=await authed("/rest/v1/rpc/invoice_attach_manual_file",{method:"POST",body:JSON.stringify({
        p_email_id:emailId, p_file_name:f.name, p_mime_type:f.type||null, p_storage_path:path, p_file_hash:hash, p_size_bytes:f.size
      })});
      if(!r.ok) throw new Error((r.body&&r.body.message)||"登録に失敗しました");
      msg.className="err msg-ok"; msg.textContent="追加しました";
      await openMailDetail(u,emailId,true);
    }catch(e){
      msg.textContent="エラー: "+e.message; $("manual-att-upload").disabled=false;
    }
  };

  $("comment-add").onclick=async()=>{
    const body=$("comment-body").value.trim();
    const msg=$("comment-msg");
    if(!body){ msg.textContent="コメントを入力してください"; return; }
    $("comment-add").disabled=true; msg.className="err"; msg.textContent="追加中…";
    const r=await authed("/rest/v1/rpc/invoice_add_comment",{method:"POST",body:JSON.stringify({p_email_id:emailId,p_body:body})});
    if(!r.ok){ msg.textContent=(r.body&&r.body.message)||"追加できませんでした"; $("comment-add").disabled=false; return; }
    await reloadDetail();
  };

  $("reply-open").onclick=()=>{ $("replybox").classList.toggle("open"); };
  $("reply-confirm").onclick=()=>{
    const body=$("reply-body").value.trim();
    if(!body){ $("reply-msg").textContent="本文を入力してください"; return; }
    $("reply-preview").textContent=body;
    $("replyconfirm").style.display="block";
  };
  $("reply-cancel").onclick=()=>{ $("replyconfirm").style.display="none"; };
  $("reply-send").onclick=async()=>{
    $("reply-send").disabled=true; $("reply-msg").textContent="送信中…";
    const body=$("reply-body").value.trim();
    const qr=await authed("/rest/v1/rpc/invoice_queue_reply",{method:"POST",body:JSON.stringify({p_email_id:emailId,p_body:body})});
    if(!qr.ok){ $("reply-msg").textContent=(qr.body&&qr.body.message)||"送信予約に失敗しました"; $("reply-send").disabled=false; return; }
    const outboxId=qr.body;
    const s=sess.get();
    const sr=await fetch(SUPA_URL+"/functions/v1/invoice-send",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({outbox_id:outboxId})});
    const sj=await sr.json().catch(()=>({}));
    $("reply-msg").className="err msg-ok";
    $("reply-msg").textContent=(sr.ok&&sj.success)?"送信しました":"送信予約は完了しました。数分以内に自動で再送されます。";
    await reloadDetail();
  };
}

/* ============================================================
   請求書一覧／売上一覧タブ（検索・絞り込み・ソート・期限バッジ＝2026-08-24 Phase1.5 C-2）
   2026-08-25 Phase1.6: mail_kind別（invoice/sales）に共通ロジックを流用できるようパラメータ化
   ============================================================ */
let LIST_KIND="invoice"; // invoice | sales（今どちらの一覧タブを描画中か）
// 2026-08-26 C-6: primarySource="invoice_emails"のkindは、invoicesテーブルへの保存(💾)が
// まだでも「種類を選んだ時点」で一覧に出す（未入力行はvendor_name等がnullのまま表示）。
// invoiceは既存どおりinvoicesテーブル起点（登録済みのみ表示）を維持＝851件中850件が未保存の
// 現状で挙動を変えると請求書一覧の意味が激変してしまうため、売上のみ変更する
const LIST_KIND_CONFIG={
  invoice:{statusLabel:INVOICE_STATUS_LABEL,vendorLabel:"請求元",numberLabel:"請求番号",amountLabel:"金額",dateLabel:"期限",searchPlaceholder:"🔎 請求元・番号・件名",emptyLabel:"該当する請求書はありません",primarySource:"invoices"},
  sales:{statusLabel:SALES_STATUS_LABEL,vendorLabel:"入金元",numberLabel:"明細番号",amountLabel:"入金額",dateLabel:"入金予定日",searchPlaceholder:"🔎 入金元・明細番号・件名",emptyLabel:"種類が「売上」のメールはありません",primarySource:"invoice_emails"},
};
function dueBadgeHtml(row){
  const label=fmtD(row.due_date);
  if(!row.due_date||["paid","cancelled"].includes(row.invoice_status)) return esc(label);
  const today=new Date(); today.setHours(0,0,0,0);
  const due=new Date(row.due_date+"T00:00:00");
  const diffDays=Math.round((due-today)/86400000);
  if(diffDays<0) return `<span class="due-badge overdue">⚠️ ${esc(label)}（超過）</span>`;
  if(diffDays<=7) return `<span class="due-badge soon">${esc(label)}（あと${diffDays}日）</span>`;
  return esc(label);
}
function filteredSortedInvoiceRows(){
  let list=IV_ROWS;
  if(IV_STATUS) list=list.filter(r=>r.invoice_status===IV_STATUS);
  if(IV_AMOUNT_MIN!=="") list=list.filter(r=>r.amount!=null&&r.amount>=+IV_AMOUNT_MIN);
  if(IV_AMOUNT_MAX!=="") list=list.filter(r=>r.amount!=null&&r.amount<=+IV_AMOUNT_MAX);
  if(IV_DUE_FROM) list=list.filter(r=>r.due_date&&r.due_date>=IV_DUE_FROM);
  if(IV_DUE_TO) list=list.filter(r=>r.due_date&&r.due_date<=IV_DUE_TO);
  if(IV_SEARCH_Q.trim()){
    const q=IV_SEARCH_Q.trim().toLowerCase();
    list=list.filter(r=>(r.vendor_name||"").toLowerCase().includes(q)
      ||(r.invoice_number||"").toLowerCase().includes(q)
      ||(r.email&&r.email.subject||"").toLowerCase().includes(q)
      ||(r.email&&r.email.from_address||"").toLowerCase().includes(q));
  }
  if(IV_SORT_COL){
    // amountはPostgRESTがnumericを文字列で返す場合があるため数値化してから比較
    const norm=v=>{ if(v==null) return null; return IV_SORT_COL==="amount"?Number(v):v; };
    list=[...list].sort((a,b)=>{
      const av=norm(a[IV_SORT_COL]), bv=norm(b[IV_SORT_COL]);
      if(av==null&&bv==null) return 0;
      if(av==null) return 1; // nullは常に末尾
      if(bv==null) return -1;
      if(av<bv) return IV_SORT_DIR==="asc"?-1:1;
      if(av>bv) return IV_SORT_DIR==="asc"?1:-1;
      return 0;
    });
  }
  return list;
}
function invoiceListBodyHtml(){
  const cfg=LIST_KIND_CONFIG[LIST_KIND];
  const list=filteredSortedInvoiceRows();
  const arrow=col=>IV_SORT_COL===col?(IV_SORT_DIR==="asc"?" ▲":" ▼"):"";
  return `<table class="invoice-table">
    <thead><tr>
      <th>${cfg.vendorLabel}</th><th>${cfg.numberLabel}</th>
      <th data-sort="amount">${cfg.amountLabel}${arrow("amount")}</th>
      <th data-sort="due_date">${cfg.dateLabel}${arrow("due_date")}</th>
      <th>担当</th><th>状態</th>
    </tr></thead>
    <tbody>
      ${list.map(row=>`<tr data-openmail="${row.email_id}">
        <td><b>${esc(row.vendor_name||(row.email&&row.email.from_address)||"—")}</b></td>
        <td>${esc(row.invoice_number||"—")}</td>
        <td>${yen(row.amount)}</td>
        <td>${dueBadgeHtml(row)}</td>
        <td>${esc(row.email&&row.email.processor&&row.email.processor.name||"—")}</td>
        <td><span class="invoice-status ${INVOICE_STATUS_CLASS[row.invoice_status]||'gray'}">${cfg.statusLabel[row.invoice_status]||row.invoice_status}</span>${row.mf_journal_id?' <span class="hq-pill green" style="margin-left:4px">💰会計処理済み</span>':''}</td>
      </tr>`).join("")||`<tr><td colspan="6">${cfg.emptyLabel}</td></tr>`}
    </tbody>
  </table>`;
}
function wireInvoiceListTable(u){
  document.querySelectorAll("[data-openmail]").forEach(el=>el.onclick=()=>openMailDetailModal(u,el.dataset.openmail));
  document.querySelectorAll("[data-sort]").forEach(el=>el.onclick=()=>{
    const col=el.dataset.sort;
    if(IV_SORT_COL===col) IV_SORT_DIR=IV_SORT_DIR==="asc"?"desc":"asc";
    else { IV_SORT_COL=col; IV_SORT_DIR="asc"; }
    $("ivTableWrap").innerHTML=invoiceListBodyHtml();
    wireInvoiceListTable(u);
  });
}
async function renderFinancialListTab(u,kind){
  // mail_kind別（invoice=請求書一覧／sales=売上一覧）に絞り込み。両者を混在させない
  LIST_KIND=kind;
  const cfg=LIST_KIND_CONFIG[kind];
  IV_SEARCH_Q=""; IV_STATUS=""; IV_AMOUNT_MIN=""; IV_AMOUNT_MAX=""; IV_DUE_FROM=""; IV_DUE_TO=""; IV_SORT_COL=""; IV_SORT_DIR="asc";
  if(cfg.primarySource==="invoice_emails"){
    // invoice_emails起点：invoicesへの保存が無くても種類分類だけで一覧に出す（C-6）
    const r=await authed(`/rest/v1/invoice_emails?mail_kind=eq.${kind}&select=id,subject,from_address,processing_user_id,processor:users!invoice_emails_processing_user_id_fkey(name),invoices(id,vendor_name,invoice_number,amount,due_date,invoice_status)&order=received_at.desc&limit=300`);
    const raw=(r.ok&&Array.isArray(r.body))?r.body:[];
    IV_ROWS=raw.map(e=>{
      const iv=(e.invoices&&e.invoices[0])||{};
      return {
        email_id:e.id, vendor_name:iv.vendor_name??null, invoice_number:iv.invoice_number??null,
        amount:iv.amount??null, due_date:iv.due_date??null, invoice_status:iv.invoice_status||"draft",
        email:{subject:e.subject, from_address:e.from_address, processor:e.processor},
      };
    });
  }else{
    const r=await authed(`/rest/v1/invoices?select=*,email:invoice_emails!inner(subject,from_address,mail_kind,processing_user_id,processor:users!invoice_emails_processing_user_id_fkey(name))&email.mail_kind=eq.${kind}&order=created_at.desc&limit=300`);

/* ============================================================
   設定タブ: 仕訳辞書の管理（登録・編集・削除）2026-08-31
   マネーフォワードの正式な外部連携APIには仕訳辞書を取得する機能が無いため
   （2026-08-31にユーザーへ確認済み・内部非公式APIは規約違反リスクがあり不採用）、
   管理システム自身のDB（mf_journal_templates）に登録して代用する。
   invoices.htmlの仕訳作成モーダル（openMailDetail内のmfj*関数群）とは別の、
   このタブ専用の状態（MFT_STATE）・関数群（mft*）。
   ============================================================ */
let MFT_STATE={};
async function mftLoadAccountsAndDepts(tenantId){
  const [accRes,deptRes]=await Promise.all([mfCall("accounts",{tenant_id:tenantId}),mfCall("list_departments",{tenant_id:tenantId})]);
  return {accounts:(accRes.ok&&accRes.body.accounts)||[], departments:(deptRes.ok&&deptRes.body.departments)||[], taxes:(deptRes.ok&&deptRes.body.taxes)||[], accountsOk:accRes.ok, accountsError:accRes.body&&accRes.body.error};
}
function mftBuildAccountIndex(accounts){
  const map=new Map(); let dl="";
  for(const a of accounts){
    map.set(a.name,{account_id:a.id,sub_account_id:null,account_name:a.name,sub_account_name:null});
    dl+=`<option value="${esc(a.name)}">`;
    for(const sa of (a.sub_accounts||[])){
      const label=`${a.name}/${sa.name}`;
      map.set(label,{account_id:a.id,sub_account_id:sa.id,account_name:a.name,sub_account_name:sa.name});
      dl+=`<option value="${esc(label)}">`;
    }
  }
  return {map,dl};
}
function mftLabelOf(side){ if(!side||!side.account_name) return ""; return side.sub_account_name?`${side.account_name}/${side.sub_account_name}`:side.account_name; }

async function renderMftSection(tenantId){
  const box=$("mft-box");
  if(!box) return;
  box.innerHTML="読み込み中…（連携先の事業者を確認しています）";
  const tRes=await mfCall("list_tenants");
  const tenants=(tRes.ok&&tRes.body.tenants)||[];
  const activeTenantId=tenantId||(tenants[0]&&tenants[0].id)||"default";
  MFT_STATE.tenants=tenants; MFT_STATE.activeTenantId=activeTenantId;
  box.innerHTML="読み込み中…（勘定科目・仕訳辞書を確認しています）";
  const {accounts,departments,taxes,accountsOk,accountsError}=await mftLoadAccountsAndDepts(activeTenantId);
  const {map,dl}=mftBuildAccountIndex(accounts);
  MFT_STATE.accountLabelMap=map; MFT_STATE.accountDatalistHtml=dl; MFT_STATE.departments=departments; MFT_STATE.taxes=taxes;
  const tplRes=await authed(`/rest/v1/mf_journal_templates?tenant_id=eq.${encodeURIComponent(activeTenantId)}&select=*&order=label`);
  MFT_STATE.templates=(tplRes.ok&&Array.isArray(tplRes.body))?tplRes.body:[];
  MFT_STATE.editing=null;
  MFT_STATE.accountsOk=accountsOk; MFT_STATE.accountsError=accountsError;
  mftRenderBox();
}
// box全体（事業者選択・一覧・編集フォーム）の再描画。renderMftSection()の初回読み込み後だけでなく、
// 編集を開始/キャンセルするたびにも呼び直す（2026-09-02: 編集フォームを対象行のすぐ下に差し込むため、
// 一覧ごと作り直す必要がある。ネットワーク再取得はしない＝MFT_STATEのキャッシュのみで再構築する）
function mftRenderBox(){
  const box=$("mft-box");
  if(!box) return;
  const {tenants,activeTenantId,accountsOk,accountsError,editing}=MFT_STATE;
  box.innerHTML=`
    ${tenants.length>1?`<div style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">事業者</label>
      <select id="mft-tenant">${tenants.map(t=>`<option value="${esc(t.id)}" ${t.id===activeTenantId?"selected":""}>${esc(t.label)}</option>`).join("")}</select></div>`:""}
    ${!accountsOk?`<div class="err">勘定科目の取得に失敗しました（マネーフォワード未連携の可能性）: ${esc(accountsError||"")}</div>`:`
    <input id="mft-search" placeholder="🔍 仕訳辞書の名前で検索" value="${esc(MFT_STATE.searchQuery||"")}" style="max-width:240px;margin-bottom:8px">
    <div id="mft-list">${mftListHtml()}</div>
    <button class="hq-btn" id="mft-new" style="margin-top:8px">＋ 新しい仕訳辞書を追加</button>
    ${(!editing||editing.id===null)?`<div id="mft-editor" style="margin-top:10px"></div>`:""}`}
  `;
  if(tenants.length>1) $("mft-tenant").onchange=e=>renderMftSection(e.target.value);
  if(!accountsOk) return;
  if($("mft-search")) $("mft-search").oninput=()=>{ MFT_STATE.searchQuery=$("mft-search").value; $("mft-list").innerHTML=mftListHtml(); mftWireListButtons(); };
  mftWireListButtons();
  $("mft-new").onclick=()=>mftOpenEditor(null);
  if(editing) mftRenderEditor(); // 編集中（新規／既存とも）ならその場で内容を描画
}
function mftWireListButtons(){
  document.querySelectorAll("[data-mft-edit]").forEach(el=>el.onclick=()=>mftOpenEditor(MFT_STATE.templates.find(t=>t.id===el.dataset.mftEdit)));
  document.querySelectorAll("[data-mft-del]").forEach(el=>el.onclick=async()=>{
    if(!confirm(`仕訳辞書「${el.dataset.mftLabel}」を削除しますか？`)) return;
    await authed(`/rest/v1/mf_journal_templates?id=eq.${el.dataset.mftDel}`,{method:"DELETE"});
    renderMftSection(MFT_STATE.activeTenantId);
  });
}
function mftListHtml(){
  let tpls=MFT_STATE.templates||[];
  const q=(MFT_STATE.searchQuery||"").trim();
  if(q) tpls=tpls.filter(t=>(t.label||"").includes(q));
  const ed=MFT_STATE.editing;
  if(!tpls.length) return `<div style="font-size:12px;color:var(--muted)">${q?"該当する仕訳辞書が見つかりません":"この事業者にはまだ仕訳辞書が登録されていません。"}</div>`;
  return tpls.map(t=>{
    const sum=(t.branches||[]).map(b=>`${mftLabelOf(b.debit)||"?"}／${mftLabelOf(b.credit)||"?"}`).join("、");
    const row=`<div class="mfj-tpl-item"><div><div class="lbl">${esc(t.label)}</div><div class="sum">${esc(sum)}（${(t.branches||[]).length}行）</div></div>
      <div style="display:flex;gap:6px"><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-mft-edit="${t.id}">編集</button><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-mft-del="${t.id}" data-mft-label="${esc(t.label)}">削除</button></div>
    </div>`;
    // 編集中の項目の直後に編集フォームの差込先を用意（2026-09-02: ユーザー報告「編集画面が一番下に
    // 出るので、その項目のすぐ下に出してほしい」に対応。新規追加時はediting.idがnullなので一覧の外＝
    // mftRenderBox()側の固定位置に出す）
    return row+((ed&&ed.id===t.id)?`<div id="mft-editor" style="margin:8px 0 14px"></div>`:"");
  }).join("");
}
function mftOpenEditor(tpl){
  // 古い仕訳辞書（借方・貸方が共通amountを持つ形式）・新しい仕訳辞書（辺ごとにvalueを持つ形式）の両方に対応
  MFT_STATE.editing={
    id: tpl?tpl.id:null,
    label: tpl?tpl.label:"",
    branches: tpl?(tpl.branches||[]).map(b=>({
      debitLabel:mftLabelOf(b.debit), debitAmount:b.debit?(b.debit.value??b.amount??""):"",
      creditLabel:mftLabelOf(b.credit), creditAmount:b.credit?(b.credit.value??b.amount??""):"",
      department_id:b.department_id||"", tax_id:b.tax_id||"",
      credit_department_id:b.credit_department_id||"", credit_tax_id:b.credit_tax_id||"",
      remark:b.remark||"", purpose:b.purpose||"",
    })):[{debitLabel:"",debitAmount:"",creditLabel:"",creditAmount:"",department_id:"",tax_id:"",credit_department_id:"",credit_tax_id:"",remark:"",purpose:""}],
  };
  mftRenderBox(); // 一覧を編集状態つきで再描画（編集フォームを対象行のすぐ下に差し込むため）
  const el=$("mft-editor");
  if(el) el.scrollIntoView({behavior:"smooth",block:"center"});
}
function mftRenderEditor(){
  const el=$("mft-editor");
  if(!el) return;
  const ed=MFT_STATE.editing;
  if(!ed){ el.innerHTML=""; return; }
  el.innerHTML=`
    <div class="card" style="padding:12px;border-color:var(--m-blue)">
      <div class="ai-field"><small>仕訳辞書の名前</small><input id="mft-label" value="${esc(ed.label)}" placeholder="例:【未払金】アルバイト給与（川崎）"></div>
      <datalist id="mft-acc-datalist">${MFT_STATE.accountDatalistHtml||""}</datalist>
      <div class="mfj-gridwrap" style="margin-top:8px">
        <table class="mfj-grid">
          <thead>
            <tr><th rowspan="2" style="width:26px"></th><th colspan="2" class="side">借方</th><th colspan="2" class="side" style="background:var(--m-greensoft);color:var(--m-green)">貸方</th><th rowspan="2">摘要（行ごと・任意）</th><th rowspan="2">給与仕訳での用途（任意）</th></tr>
            <tr><th>勘定科目・部門・税区分</th><th>金額（任意・空欄可）</th><th>勘定科目・部門・税区分</th><th>金額</th></tr>
          </thead>
          <tbody id="mft-branch-rows">${ed.branches.map((br,i)=>mftBranchRowHtml(br,i)).join("")}</tbody>
        </table>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px">💡 借方・貸方はどちらか片方だけの行も作れます（例: 借方2行を貸方1行にまとめる）。金額は空欄のまま登録できます（実際に使うときに毎回入力する想定の場合）。「給与仕訳での用途」を設定すると、💴給与仕訳タブでこのテンプレートを従業員に割り当てたときに、その行の金額（借方・貸方とも設定されていれば両方）を実際の給与データ（固定給・通勤手当・控除・差引支給額）へ自動で置き換えます</div>
      <div class="mail-actions" style="margin-top:6px"><button id="mft-add-row">＋ 明細行を追加</button></div>
      <div class="mail-actions" style="margin-top:10px">
        <button class="primary" id="mft-save">💾 保存</button>
        <button id="mft-cancel">キャンセル</button>
      </div>
    </div>
  `;
  mftWireEditor();
}
function mftBranchRowHtml(br,idx){

  $("mft-add-row").onclick=()=>{ ed.branches.push({debitLabel:"",debitAmount:"",creditLabel:"",creditAmount:"",department_id:"",tax_id:"",credit_department_id:"",credit_tax_id:"",remark:"",purpose:""}); mftRenderEditor(); };
  $("mft-cancel").onclick=()=>{ MFT_STATE.editing=null; mftRenderBox(); };

async function mftSaveEditor(){
  const ed=MFT_STATE.editing;
  const label=$("mft-label").value.trim();
  if(!label){ alert("名前を入力してください"); return; }
  const structured=[];
  for(const b of ed.branches){
    const debit=b.debitLabel?MFT_STATE.accountLabelMap.get(b.debitLabel):null;
    const credit=b.creditLabel?MFT_STATE.accountLabelMap.get(b.creditLabel):null;
    if(b.debitLabel&&!debit){ alert("借方はプルダウンの候補から選んでください"); return; }
    if(b.creditLabel&&!credit){ alert("貸方はプルダウンの候補から選んでください"); return; }
    if(!debit&&!credit) continue;
    structured.push({
      debit:debit?{...debit,value:Number(b.debitAmount)||null}:null,
      credit:credit?{...credit,value:Number(b.creditAmount)||null}:null,
      department_id:b.department_id||null, department_name:(MFT_STATE.departments.find(d=>d.id===b.department_id)||{}).name||null,
      tax_id:b.tax_id||null, tax_name:(MFT_STATE.taxes.find(t=>t.id===b.tax_id)||{}).name||null,
      credit_department_id:b.credit_department_id||null, credit_department_name:(MFT_STATE.departments.find(d=>d.id===b.credit_department_id)||{}).name||null,
      credit_tax_id:b.credit_tax_id||null, credit_tax_name:(MFT_STATE.taxes.find(t=>t.id===b.credit_tax_id)||{}).name||null,
      remark:b.remark||null, purpose:b.purpose||null,
    });
  }
  if(!structured.length){ alert("明細行がありません"); return; }
  $("mft-save").disabled=true;
  const payload={tenant_id:MFT_STATE.activeTenantId,label,branches:structured};
  const r=ed.id
    ?await authed(`/rest/v1/mf_journal_templates?id=eq.${ed.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({...payload,updated_at:new Date().toISOString()})})
    :await authed("/rest/v1/mf_journal_templates",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({...payload,created_by:ME.id})});
  if(!r.ok){ if($("mft-save")) $("mft-save").disabled=false; alert("保存に失敗しました"); return; }
  renderMftSection(MFT_STATE.activeTenantId);
}

let DASH_STATE={};

// C-7拡張（ラウンド5指示書§6.1・2026-09-01）: 会計ダッシュボードに月ごとの処理一覧を追加。
// 請求書（メール/アップロード）・給与仕訳を月単位で横断し、各件の状態（未処理／仕訳済み／
// 振込待ち／振込完了 等）を一覧化する。並び替え・行/列の表示非表示に対応。
// インフォマートはD-9（担当D）のデータ連携が完了するまで対象外（プレースホルダーのみ表示）
async function dashLoadMonthlyList(ym){
  const start=`${ym}-01`;
  const endDate=new Date(ym+"-01"); endDate.setMonth(endDate.getMonth()+1);
  const end=endDate.toISOString().slice(0,10);
  const [mailR,uploadR,syncR,recR]=await Promise.all([
    authed(`/rest/v1/invoices?email_id=not.is.null&created_at=gte.${start}&created_at=lt.${end}&select=id,vendor_name,amount,invoice_status,mf_journal_created_at,mf_journal_number,created_at,pl_fee_reflected_at,pl_fee_sheet_synced_at,pl_fee_seisan_synced_at,email:invoice_emails(mail_kind)&order=created_at.desc&limit=300`),
    authed(`/rest/v1/invoices?email_id=is.null&created_at=gte.${start}&created_at=lt.${end}&select=id,vendor_name,amount,invoice_status,mf_journal_created_at,mf_journal_number,created_at,pl_fee_reflected_at,pl_fee_sheet_synced_at,pl_fee_seisan_synced_at&order=created_at.desc&limit=300`),
    authed(`/rest/v1/sf_payroll_sync?year_month=eq.${ym}&select=user_id,net_pay,user:users(name)`),
    authed(`/rest/v1/payroll_journal_records?year_month=eq.${ym}&select=user_id,paid_at,mf_journal_number`),
  ]);
  // 手数料等→PL自動反映の状態バッジ（ラウンド5指示書§6.1・§5）。反映済みでもPL・精算書への
  // 実書き込み（担当A対応）が未完了なら、正直にその旨がわかる表示にする
  const plBadgeFor=r=>{
    if(!r.pl_fee_reflected_at) return "";
    return r.pl_fee_sheet_synced_at?"　📊PL反映済み":"　📊PL反映（書込待ち）";
  };
  const items=[];
  const mailRows=(mailR.ok&&Array.isArray(mailR.body))?mailR.body:[];
  for(const r of mailRows){
    if(r.email&&r.email.mail_kind&&r.email.mail_kind!=="invoice") continue; // 入金明細(sales)等はここでは対象外
    const done=!!r.mf_journal_created_at;
    items.push({type:"mail",typeLabel:"📧請求書メール",name:r.vendor_name||"（未入力）",amount:r.amount,createdAt:r.created_at,
      status:done?{label:"✅仕訳済み"+plBadgeFor(r),cls:"done"}:{label:INVOICE_STATUS_LABEL[r.invoice_status]||"未処理",cls:INVOICE_STATUS_CLASS[r.invoice_status]||"gray"},
      rank:done?2:0});
  }
  const uploadRows=(uploadR.ok&&Array.isArray(uploadR.body))?uploadR.body:[];
  for(const r of uploadRows){
    const done=!!r.mf_journal_created_at;
    items.push({type:"upload",typeLabel:"📤アップロード請求書",name:r.vendor_name||"（未入力）",amount:r.amount,createdAt:r.created_at,
      status:done?{label:"✅仕訳済み"+plBadgeFor(r),cls:"done"}:{label:"未仕訳",cls:"wait"},
      rank:done?2:0});
  }
  const payrollRows=(syncR.ok&&Array.isArray(syncR.body))?syncR.body:[];
  const payrollRecs=(recR.ok&&Array.isArray(recR.body))?recR.body:[];
  for(const r of payrollRows.filter(x=>Number(x.net_pay)>0)){
    const rec=payrollRecs.find(rc=>rc.user_id===r.user_id);
    let status,rank;
    if(rec&&rec.paid_at){ status={label:"🎉振込完了",cls:"done"}; rank=3; }
    else if(rec){ status={label:"💰仕訳登録済み・振込待ち",cls:"check"}; rank=1; }
    else{ status={label:"未登録",cls:"wait"}; rank=0; }
    items.push({type:"payroll",typeLabel:"💴給与仕訳",name:(r.user&&r.user.name)||"—",amount:r.net_pay,createdAt:`${ym}-01`,status,rank});
  }
  return items;
}

    rows=[...rows].sort((a,b)=>(Number(b.amount)||0)-(Number(a.amount)||0));

            <option value="default" ${(!DASH_STATE.sortMode||DASH_STATE.sortMode==="default")?"selected":""}>新しい順</option>

          </select>
        </label>
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="dash-f-mail" ${filter.mail?"checked":""}>📧請求書メール</label>
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="dash-f-upload" ${filter.upload?"checked":""}>📤アップロード請求書</label>
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="dash-f-payroll" ${filter.payroll?"checked":""}>💴給与仕訳</label>
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="dash-show-amount" ${showAmount?"checked":""}>金額を表示</label>
      </div>
      ${rows.length?`<table class="invoice-table">
        <thead><tr><th>種別</th><th>相手先／従業員</th>${showAmount?'<th style="text-align:right">金額</th>':''}<th>状態</th></tr></thead>
        <tbody>${rows.map(it=>`<tr>
          <td style="font-size:11px;color:var(--muted);white-space:nowrap">${it.typeLabel}</td>
          <td><b>${esc(it.name)}</b></td>
          ${showAmount?`<td style="text-align:right">${yen(it.amount)}</td>`:''}
          <td><span class="invoice-status ${it.status.cls}">${it.status.label}</span></td>
        </tr>`).join("")}</tbody>
      </table>`:`<div class="empty">該当する処理はありません（対象年月・絞り込み条件を確認してください）</div>`}
    </div>`;
}

/* ============================================================
   アップロード請求書（C-7①・2026-08-31）
   メールに来ない請求書（手渡し・現金精算・郵送のPDF等）を、メールを介さず
   直接アップロードして仕訳登録する単独画面。設計書_会計自動化_2026-08-31.md §5 Q6の
   追加要望①に対応。本部タスク連携（tasks.html・2026-08-27実装）で作った
   mf-journalの「create_standalone」actionをそのまま使うが、あちらは本部タスクの工程に
   紐付けることが必須だった。この画面は工程と無関係に単独で使うため、
   linked_hq_step_idを渡さない（Edge Function側は2026-08-31から任意化済み）。
   仕訳作成モーダル（openMailDetail内のmfj*）・仕訳辞書管理（設定タブのmft*）とは
   独立した状態（MFU_STATE）・関数群（mfu*）。表の見た目は共通のmfj-grid CSSを再利用。
   ============================================================ */
let MFU_STATE={};
async function mfuCallTenants(){
  const r=await mfCall("list_tenants");
  return (r.ok&&r.body.tenants)||[];
}
function mfuLabelOf(side){ if(!side||!side.account_name) return ""; return side.sub_account_name?`${side.account_name}/${side.sub_account_name}`:side.account_name; }
function mfuBuildAccountIndex(accounts){
  const map=new Map(); let dl="";
  for(const a of accounts){
    map.set(a.name,{account_id:a.id,sub_account_id:null,account_name:a.name,sub_account_name:null});
    dl+=`<option value="${esc(a.name)}">`;
    for(const sa of (a.sub_accounts||[])){
      const label=`${a.name}/${sa.name}`;
      map.set(label,{account_id:a.id,sub_account_id:sa.id,account_name:a.name,sub_account_name:sa.name});
      dl+=`<option value="${esc(label)}">`;
    }
  }
  return {map,dl};
}

async function mfuLoadForTenant(tenantId,tenants){
  const box=$("mfu-box");
  box.innerHTML="読み込み中…（勘定科目・仕訳辞書を確認しています）";
  const [accRes,deptRes,tplR]=await Promise.all([
    mfCall("accounts",{tenant_id:tenantId}),
    mfCall("list_departments",{tenant_id:tenantId}),
    authed(`/rest/v1/mf_journal_templates?tenant_id=eq.${encodeURIComponent(tenantId)}&select=id,label,branches&order=label`),
  ]);
  if(!accRes.ok){ box.innerHTML=`<div class="err">勘定科目の取得に失敗しました: ${esc(accRes.body.error||"")}</div>`; return; }
  const {map,dl}=mfuBuildAccountIndex(accRes.body.accounts||[]);
  const tenantLabel=(tenants||[]).find(t=>t.id===tenantId)?.label||tenantId;
  MFU_STATE={
    ...MFU_STATE,
    tenantId, tenantLabel, tenants: tenants||[],
    accounts: accRes.body.accounts||[], accountLabelMap:map, accountDatalistHtml:dl,
    departments: (deptRes.ok&&deptRes.body.departments)||[], taxes: (deptRes.ok&&deptRes.body.taxes)||[],
    templates: (tplR.ok&&Array.isArray(tplR.body))?tplR.body:[],
    mode:"manual",
    branches: [{debitLabel:"",creditLabel:"",department_id:"",amount:"",remark:""}],
    vendorName:"", date:new Date().toISOString().slice(0,10), remark:"",
    journalResults:[], journalKeyword:"",
  };
  mfuRenderForm();
}

function mfuAddBranchRow(){ MFU_STATE.branches.push({debitLabel:"",debitAmount:"",creditLabel:"",creditAmount:"",department_id:"",remark:""}); }
function mfuApplyBranches(branches){
  MFU_STATE.branches=branches.length?branches:[{debitLabel:"",debitAmount:"",creditLabel:"",creditAmount:"",department_id:"",remark:""}];
  MFU_STATE.mode="manual";
  mfuRenderForm();
}
// 2026-08-31: 借方・貸方どちらか片方だけの行にも対応（mfjと同じ拡張。詳細はmfj側のコメント参照）
function mfuBranchRowHtml(br,idx){

function mfuUpdateBalance(){
  const totalDebit=MFU_STATE.branches.reduce((s,b)=>s+(Number(b.debitAmount)||0),0);
  const totalCredit=MFU_STATE.branches.reduce((s,b)=>s+(Number(b.creditAmount)||0),0);
  if($("mfu-debit-total")) $("mfu-debit-total").textContent=yen(totalDebit);
  if($("mfu-credit-total")) $("mfu-credit-total").textContent=yen(totalCredit);
  if($("mfu-diff-amt")) $("mfu-diff-amt").textContent=yen(totalDebit-totalCredit);
  if($("mfu-diff-box")) $("mfu-diff-box").className="box "+(totalDebit===totalCredit?"ok":"ng");
}
function mfuWireBranchRows(){
  document.querySelectorAll(".mfu-debit").forEach(el=>el.oninput=()=>{ MFU_STATE.branches[+el.dataset.idx].debitLabel=el.value; });
  document.querySelectorAll(".mfu-credit").forEach(el=>el.oninput=()=>{ MFU_STATE.branches[+el.dataset.idx].creditLabel=el.value; });
  document.querySelectorAll(".mfu-dept").forEach(el=>el.onchange=()=>{ MFU_STATE.branches[+el.dataset.idx].department_id=el.value; });
  document.querySelectorAll(".mfu-remark").forEach(el=>el.oninput=()=>{ MFU_STATE.branches[+el.dataset.idx].remark=el.value; });
  document.querySelectorAll(".mfu-debit-amount").forEach(el=>el.oninput=()=>{ MFU_STATE.branches[+el.dataset.idx].debitAmount=el.value; mfuUpdateBalance(); });
  document.querySelectorAll(".mfu-credit-amount").forEach(el=>el.oninput=()=>{ MFU_STATE.branches[+el.dataset.idx].creditAmount=el.value; mfuUpdateBalance(); });
  document.querySelectorAll("[data-mfurm]").forEach(el=>el.onclick=()=>{ MFU_STATE.branches.splice(+el.dataset.mfurm,1); mfuRenderForm(); });
}

    :`<div style="font-size:12px;color:var(--muted)">${MFU_STATE.journalKeyword?"該当する過去の仕訳が見つかりませんでした":"キーワードを入力して検索してください"}</div>`;

  document.querySelectorAll("[data-mfutpluse]").forEach(btn=>btn.onclick=()=>{

    </div>`:mode==="dict"?`<div id="mfu-tpl-picker"><input id="mfu-tpl-search" placeholder="🔍 仕訳辞書の名前で検索" value="${esc(MFU_STATE.tplSearchQuery||"")}" style="max-width:240px;margin-bottom:8px"><div id="mfu-tpl-results"></div></div>`:`

async function mfuSaveAsTemplate(){
  const label=(prompt("仕訳辞書として登録する名前を入力してください（例: 【未払金】アルバイト給与）")||"").trim();
  if(!label) return;
  const structured=[];
  for(const b of MFU_STATE.branches){
    const debit=b.debitLabel?MFU_STATE.accountLabelMap.get(b.debitLabel):null;
    const credit=b.creditLabel?MFU_STATE.accountLabelMap.get(b.creditLabel):null;
    if(b.debitLabel&&!debit){ alert("借方をプルダウンの候補から選んでから登録してください"); return; }
    if(b.creditLabel&&!credit){ alert("貸方をプルダウンの候補から選んでから登録してください"); return; }
    if(!debit&&!credit) continue;
    structured.push({
      debit:debit?{...debit,value:Number(b.debitAmount)||null}:null,
      credit:credit?{...credit,value:Number(b.creditAmount)||null}:null,
      department_id:b.department_id||null, department_name:(MFU_STATE.departments.find(d=>d.id===b.department_id)||{}).name||null,
      tax_id:b.tax_id||null, tax_name:(MFU_STATE.taxes.find(t=>t.id===b.tax_id)||{}).name||null,
      credit_department_id:b.credit_department_id||null, credit_department_name:(MFU_STATE.departments.find(d=>d.id===b.credit_department_id)||{}).name||null,
      credit_tax_id:b.credit_tax_id||null, credit_tax_name:(MFU_STATE.taxes.find(t=>t.id===b.credit_tax_id)||{}).name||null,
      remark:b.remark||null,
    });
  }
  if(!structured.length){ alert("明細行がありません"); return; }
  const r=await authed("/rest/v1/mf_journal_templates",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({tenant_id:MFU_STATE.tenantId,label,branches:structured,created_by:ME.id})});
  const msg=$("mfu-msg");
  if(!r.ok){ msg.className="err"; msg.textContent="仕訳辞書への登録に失敗しました"; return; }
  msg.className="err msg-ok"; msg.textContent=`仕訳辞書「${label}」に登録しました`;
  MFU_STATE.templates=(await authed(`/rest/v1/mf_journal_templates?tenant_id=eq.${encodeURIComponent(MFU_STATE.tenantId)}&select=id,label,branches&order=label`)).body||[];
}

function mfuFileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

function mfuOpenPreview(){
  const msg=$("mfu-msg"); msg.className="err"; msg.textContent="";
  const vendorName=($("mfu-vendor")?.value||"").trim();
  if(!vendorName){ msg.textContent="取引先名を入力してください"; return; }
  const branchesPayload=[];
  let totalDebit=0, totalCredit=0;
  for(const b of MFU_STATE.branches){
    const debit=b.debitLabel?MFU_STATE.accountLabelMap.get(b.debitLabel):null;
    const credit=b.creditLabel?MFU_STATE.accountLabelMap.get(b.creditLabel):null;
    if(b.debitLabel&&!debit){ msg.textContent="借方はプルダウンの候補から選択してください（自由入力のままだと登録できません）"; return; }
    if(b.creditLabel&&!credit){ msg.textContent="貸方はプルダウンの候補から選択してください（自由入力のままだと登録できません）"; return; }
    if(!debit&&!credit) continue;
    const dAmt=debit?Number(b.debitAmount):null, cAmt=credit?Number(b.creditAmount):null;
    if(debit&&(!dAmt||dAmt<=0)){ msg.textContent="借方の金額が未入力（0円）の行があります"; return; }
    if(credit&&(!cAmt||cAmt<=0)){ msg.textContent="貸方の金額が未入力（0円）の行があります"; return; }
    if(debit) totalDebit+=dAmt; if(credit) totalCredit+=cAmt;
    branchesPayload.push({debit,debitAmount:dAmt,credit,creditAmount:cAmt,department_id:b.department_id||null,tax_id:b.tax_id||null,credit_department_id:b.credit_department_id||null,credit_tax_id:b.credit_tax_id||null,remark:b.remark||""});
  }
  if(!branchesPayload.length){ msg.textContent="明細行がありません"; return; }
  if(totalDebit!==totalCredit){ msg.textContent=`借方合計（${yen(totalDebit)}）と貸方合計（${yen(totalCredit)}）が一致していません`; return; }
  const date=$("mfu-date").value, remark=$("mfu-remark").value;
  const files=Array.from($("mfu-files").files||[]);
  const entries=branchesPayload.map(b=>{
    const deptName=(MFU_STATE.departments.find(d=>d.id===b.department_id)||{}).name||"";
    return `<div class="mfj-preview-entry">
      <div class="mfj-preview-head"><div>借方</div><div>貸方</div></div>
      <div class="mfj-preview-body">

        <div class="mfj-preview-side"><div class="acc">${b.credit?esc(mfuLabelOf(b.credit)):"—"}</div><div class="sub"></div><div class="money">${b.credit?yen(b.creditAmount):"—"}</div></div>
      </div>
      ${b.remark?`<div class="mfj-preview-remark">${esc(b.remark)}</div>`:""}
    </div>`;
  }).join("");

  const modal=document.createElement("div");
  modal.className="modal-bg"; modal.id="mfuPreviewModal";
  modal.innerHTML=`<div class="modal" style="max-width:820px">
    <div class="mhead"><h2>🧾 振替伝票プレビュー</h2><button class="linkbtn" id="mfuPreviewClose" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px">閉じる ×</button></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">登録先: <b>${esc(MFU_STATE.tenantLabel||MFU_STATE.tenantId)}</b>　取引先: <b>${esc(vendorName)}</b>　日付: <b>${esc(date)}</b>　全体の摘要: <b>${esc(remark||"（なし）")}</b>${files.length?`　添付: <b>${files.length}件</b>`:""}</div>
    <div class="mfj-balance" style="margin:0 0 10px">
      <div class="box"><small>借方合計</small><b>${yen(totalDebit)}</b></div>
      <div class="box"><small>貸方合計</small><b>${yen(totalCredit)}</b></div>
      <div class="box ok"><small>差額</small><b>¥0</b></div>
    </div>
    ${entries}
    <div class="err" id="mfuPreviewMsg" style="margin-top:6px"></div>
    <div class="mail-actions" style="margin-top:12px">
      <button id="mfuPreviewBack">← 戻って修正</button>
      <button class="primary" id="mfuPreviewSubmit">✅ この内容で登録</button>
    </div>
    <div id="plfeebox-mfu"></div>
  </div>`;
  document.body.appendChild(modal);
  pushNav({modal:true});
  modal.onclick=e=>{ if(e.target===modal) history.back(); };
  $("mfuPreviewClose").onclick=()=>history.back();
  $("mfuPreviewBack").onclick=()=>history.back();
  $("mfuPreviewSubmit").onclick=async()=>{
    $("mfuPreviewSubmit").disabled=true;
    const pmsg=$("mfuPreviewMsg"); pmsg.className="err"; pmsg.textContent="登録中…";
    let voucherFiles=[];
    try{
      voucherFiles=await Promise.all(files.slice(0,5).map(async f=>({file_name:f.name.slice(0,255),file_data:await mfuFileToBase64(f)})));
    }catch(e){ pmsg.textContent="添付ファイルの読み込みに失敗しました: "+e.message; $("mfuPreviewSubmit").disabled=false; return; }
    const debitAccountNames=branchesPayload.filter(b=>b.debit).map(b=>mfuLabelOf(b.debit));
    const payload={
      tenant_id: MFU_STATE.tenantId,
      vendor_name: vendorName,
      branches: branchesPayload.map(b=>({
        debit:b.debit?{account_id:b.debit.account_id,sub_account_id:b.debit.sub_account_id||undefined,value:b.debitAmount}:undefined,
        credit:b.credit?{account_id:b.credit.account_id,sub_account_id:b.credit.sub_account_id||undefined,value:b.creditAmount}:undefined,
        department_id:b.department_id||null, tax_id:b.tax_id||null,
        credit_department_id:b.credit_department_id||null, credit_tax_id:b.credit_tax_id||null,
        remark:b.remark||undefined,
      })),
      transaction_date: date,
      remark,
      voucher_files: voucherFiles,
      // PL連携対象科目かどうかの判定用（手数料等→PL自動反映・ラウンド5指示書§6.1）。MF送信には使わない
      debit_account_names: debitAccountNames,
    };
    const {ok,body:j}=await mfCall("create_standalone",payload);
    if(!ok){ pmsg.textContent=j.error||"登録に失敗しました"; $("mfuPreviewSubmit").disabled=false; return; }
    pmsg.className="err msg-ok";
    pmsg.textContent=`登録しました（伝票番号: ${j.journal_number??"-"}）`
      +(j.voucher_attached?`。添付ファイルも${j.voucher_attached}件添付しました`:j.voucher_error?`（添付: ${j.voucher_error}）`:"");

    // （ユーザー要望「会計アップロードのところで入力した手数料を店舗ごとにPLへ自動反映したい」）
    const targets=await plFeeTargetAccounts();
    const matched=debitAccountNames.find(name=>targets.some(t=>t.account_name===name||t.account_name===name.split("/")[0]));
    if(matched&&j.invoice_id){
      pmsg.textContent+="。この仕訳の借方に「"+matched+"」（PL連携対象科目）が含まれています。下のパネルで店舗ごとの割り振りを確認してください";
      plfeeInit({
        boxId:"plfeebox-mfu", invoiceId:j.invoice_id, debitAccountNames,
        fallbackAmount:totalDebit, deptBranches:branchesPayload, departments:MFU_STATE.departments||[],
        reflected:null, onDone:()=>{ history.back(); renderUploadInvoiceTab(); },
      });
    }else{
      pmsg.textContent+="。画面を更新します…";
      setTimeout(()=>{ history.back(); renderUploadInvoiceTab(); },900);
    }
  };
}

let PAYROLL_STATE={};
function payrollYmDefault(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
async function renderPayrollTab(u){

  await payrollLoad();

}
async function payrollLoad(){
  const ym=PAYROLL_STATE.yearMonth;
  const fetchSync=()=>authed(`/rest/v1/sf_payroll_sync?year_month=eq.${ym}&select=*,user:users(name,role,is_active)&order=user(name)`);
  let [syncR,recR,asgR,tplR,deptR,allocR,bankR,hiddenR,accR,draftR]=await Promise.all([
    fetchSync(),
    authed(`/rest/v1/payroll_journal_records?year_month=eq.${ym}&select=*`),
    authed(`/rest/v1/payroll_journal_assignments?select=*`),
    authed(`/rest/v1/mf_journal_templates?tenant_id=eq.default&select=id,label,branches&order=label`),
    mfCall("list_departments",{tenant_id:"default"}),
    authed(`/rest/v1/sf_payroll_allocations?period_key=like.${ym}*&select=user_id,store_id,kind`),
    authed(`/rest/v1/payroll_bank_accounts?select=*`),
    // nippo「給与・インセンティブ配分」画面が使っているsf_payroll_hidden（この月は対象外にした人）を
    // こちらでも参照する（2026-09-02・担当Bからの依頼②。表側の実体は共有のためテーブル新設不要）
    authed(`/rest/v1/sf_payroll_hidden?year_month=eq.${ym}&select=user_id`),
    // 2026-09-02: 給与仕訳プレビューで明細行を追加できるように、勘定科目一覧も取得しておく
    mfCall("accounts",{tenant_id:"default"}),
    // 2026-09-02: 一時保存（下書き）機能。「途中で消えてしまう」対策
    authed(`/rest/v1/payroll_journal_drafts?year_month=eq.${ym}&select=*`),
  ]);
  // 給与データの取得に失敗した場合（トークン更新タイミング等による一時的な失敗を想定）、少し待って
  // 1回だけ自動で再試行する。ユーザー報告「タブを開き直すとKPIが0にリセットされて見づらい」対策
  if(!(syncR.ok&&Array.isArray(syncR.body))){
    await new Promise(res=>setTimeout(res,800));
    syncR=await fetchSync();
  }
  const syncOk=syncR.ok&&Array.isArray(syncR.body);
  if(syncOk){
    PAYROLL_STATE.rows=syncR.body;
    PAYROLL_STATE.loadedYearMonth=ym;
    PAYROLL_STATE.loadError=false;
  }else if(PAYROLL_STATE.loadedYearMonth!==ym){
    // この年月のデータをまだ一度も正常取得できていない場合だけ空扱いにする
    // （直前に正常取得できていた別のタイミングのデータをむやみに0で上書きしない）
    PAYROLL_STATE.rows=[];
    PAYROLL_STATE.loadError=true;
  }else{
    PAYROLL_STATE.loadError=true; // 同じ年月の直前データはそのまま維持し、失敗した旨だけ画面に出す
  }
  PAYROLL_STATE.records=(recR.ok&&Array.isArray(recR.body))?recR.body:[];
  PAYROLL_STATE.assignments=(asgR.ok&&Array.isArray(asgR.body))?asgR.body:[];
  PAYROLL_STATE.templates=(tplR.ok&&Array.isArray(tplR.body))?tplR.body:[];
  PAYROLL_STATE.departments=(deptR.ok&&deptR.body.departments)||[];
  PAYROLL_STATE.taxes=(deptR.ok&&deptR.body.taxes)||[];
  PAYROLL_STATE.allocations=(allocR.ok&&Array.isArray(allocR.body))?allocR.body:[];
  PAYROLL_STATE.bankAccounts=(bankR.ok&&Array.isArray(bankR.body))?bankR.body:[];
  PAYROLL_STATE.hiddenUserIds=new Set((hiddenR.ok&&Array.isArray(hiddenR.body))?hiddenR.body.map(h=>h.user_id):[]);
  PAYROLL_STATE.drafts=(draftR.ok&&Array.isArray(draftR.body))?draftR.body:[];
  {
    const {map,dl}=mftBuildAccountIndex((accR.ok&&accR.body.accounts)||[]);
    PAYROLL_STATE.accountLabelMap=map; PAYROLL_STATE.accountDatalistHtml=dl;
  }
  if(!PAYROLL_STATE.stores){
    const r=await authed("/rest/v1/stores?select=id,name&order=name");
    PAYROLL_STATE.stores=(r.ok&&Array.isArray(r.body))?r.body:[];
  }
  // 給与明細PDF（担当Bが用意したStorageバケット payroll-pdfs・{user_id}/{year_month}.pdf規約）が
  // この月・この従業員分に既にあるかを一括で確認し、一覧に📎バッジを出せるようにする
  const pdfChecks=await Promise.all(PAYROLL_STATE.rows.map(row=>payrollCheckPdfExists(row.user_id,ym)));
  PAYROLL_STATE.rows.forEach((row,i)=>{ row._hasPdf=pdfChecks[i]; });
}
// payroll-pdfsバケット内に{userId}/{yearMonth}.pdfが存在するか（一覧表示用の軽い存在確認）
async function payrollCheckPdfExists(userId,yearMonth){
  const s=sess.get();
  const r=await fetch(`${SUPA_URL}/storage/v1/object/list/payroll-pdfs`,{
    method:"POST",
    headers:{apikey:SUPA_KEY,Authorization:"Bearer "+(s?s.at:""),"Content-Type":"application/json"},
    body:JSON.stringify({prefix:`${userId}/`,search:`${yearMonth}.pdf`}),
  });
  if(!r.ok) return false;
  const list=await r.json().catch(()=>[]);
  return Array.isArray(list)&&list.some(x=>x.name===`${yearMonth}.pdf`);
}
// payroll-pdfsから実際のPDFをbase64で取得（登録直前の証憑添付用。無ければnull）
async function payrollFetchPdfBase64(userId,yearMonth){
  const s=sess.get();
  const r=await fetch(`${SUPA_URL}/storage/v1/object/payroll-pdfs/${userId}/${yearMonth}.pdf`,{
    headers:{apikey:SUPA_KEY,Authorization:"Bearer "+(s?s.at:"")},
  });
  if(!r.ok) return null;
  const buf=await r.arrayBuffer();
  const bytes=new Uint8Array(buf);
  let binary=""; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  return btoa(binary);
}
// base64のPDFデータをその場で開ける一時URL（Blob URL）に変換する（2026-09-02追加。
// ユーザー要望「PDFをここから開けるように・プレビューでも内容を見れるように」に対応。
// 署名付きURLを毎回サーバーへ取りに行く必要がなく、既に取得済みのbase64データをそのまま使い回せる）
function base64ToBytes(base64){
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}
function payrollPdfBlobUrl(base64){
  return URL.createObjectURL(new Blob([base64ToBytes(base64)],{type:"application/pdf"}));
}
// 給与明細PDFから「事業所ごとの金額・交通費」を参考値として読み取る（2026-09-02追加・同日中に
// AI読み取り方式へ切替）。
// 当初はpdf.js＋正規表現でテキスト抽出→パターン照合していたが、実機テストで店舗名の表記ゆれ等に
// より「勤務詳細の表を読み取れませんでした」と失敗した。ユーザーから「請求書メールの請求書読み取りと
// 同じ理屈で、AIでつないでできないものなのか」との提案を受け、既存のinvoice-ocr Edge Function
// （Claude APIへPDFを直接渡して構造化抽出する方式）と全く同じ設計のpayroll-pdf-ocrへ切り替えた。
// あくまで「参考値の表示」に留め（自動で仕訳金額へ反映はしない）、読み取れなかった場合はその旨を
// 明示する（誤った金額を無言で仕訳に使ってしまう事故を避けるため）
async function payrollExtractStoreBreakdown(base64){
  const s=sess.get();
  let r;
  try{
    r=await fetch(`${SUPA_URL}/functions/v1/payroll-pdf-ocr`,{
      method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+(s?s.at:""),"Content-Type":"application/json"},
      body:JSON.stringify({pdf_base64:base64}),
    });
  }catch(e){
    return {ok:false,error:"AI読み取りサービスへの接続に失敗しました"};
  }
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.success) return {ok:false,error:j.error||"読み取りに失敗しました"};
  const stores=Array.isArray(j.stores)?j.stores:[];
  if(!stores.length) return {ok:false,error:j.note||"勤務詳細の表が見つかりませんでした"};
  return {ok:true,totals:stores.map(st=>({store:st.store_name,amount:Number(st.amount_total)||0,commute:Number(st.commute_total)||0,count:Number(st.days_count)||0})),note:j.note};
}
// payroll-pdfsから証憑を削除（添付間違い等の取り消し用。2026-09-01）
async function payrollDeletePdf(userId,yearMonth){

// PDFファイル名から従業員を推定（氏名の空白除去・部分一致。完全な自動判定はせず、必ず人が確認・修正できる形で使う）
// PDFファイル名から従業員を推定（2026-09-02: ユーザー報告「スペースが入ったりしていて完全一致しない
// と推定されない」に対応し2段階に強化）。①区切り文字（半角/全角スペースに加えハイフン・アンダー
// スコア・中黒・ドットも除去）を取り除いた上での部分一致②それでも見つからなければ、氏名を姓・名に
// 分割し、それぞれの部分が（区切り文字の有無を問わず）ファイル名に全部含まれていれば一致とみなす
// （姓名の間に別の文字が挟まっている・順序が姓名逆等のケースに対応）
function payrollGuessEmployeeByFilename(filename){
  const stripSep=s=>String(s||"").replace(/[\s　\-_・.]/g,"");
  const n=stripSep(filename);
  let hit=(PAYROLL_STATE.rows||[]).find(r=>{
    const name=stripSep(r.user&&r.user.name);
    return name&&n.includes(name);
  });
  if(hit) return hit;
  hit=(PAYROLL_STATE.rows||[]).find(r=>{
    const parts=String((r.user&&r.user.name)||"").split(/[\s　]+/).filter(Boolean).map(stripSep).filter(Boolean);
    return parts.length>=2&&parts.every(p=>n.includes(p));
  });
  return hit||null;
}
function payrollAssignmentFor(userId){ return PAYROLL_STATE.assignments.find(a=>a.user_id===userId); }
function payrollRecordFor(userId){ return PAYROLL_STATE.records.find(r=>r.user_id===userId); }
function payrollDraftFor(userId){ return (PAYROLL_STATE.drafts||[]).find(d=>d.user_id===userId); }
function payrollFindDeptForUser(userId){
  const alloc=(PAYROLL_STATE.allocations||[]).find(a=>a.user_id===userId&&a.store_id);
  if(!alloc) return null;
  const store=PAYROLL_STATE.stores.find(s=>s.id===alloc.store_id);
  if(!store) return null;
  const norm=s=>String(s||"").replace(/\s+/g,"");
  const n=norm(store.name);
  const dept=PAYROLL_STATE.departments.find(d=>norm(d.name)===n) || PAYROLL_STATE.departments.find(d=>n.includes(norm(d.name))||norm(d.name).includes(n));
  return dept||null;
}
// テンプレートの各行に「給与仕訳での用途」タグが付いていれば、その行の金額を実際の給与データへ
// 差し替える（付いていなければテンプレートの固定金額のまま＝0円の行は除外）
// 2026-08-31: テンプレートの行が借方・貸方どちらか片方だけでもよくなったため、金額もそれぞれ独立して
// 実データに置き換える（用途タグが付いた側だけを置き換え、付いていない側は元の固定値のまま）
function payrollComputeBranches(row,template){
  const dept=payrollFindDeptForUser(row.user_id);
  const amountFor=purpose=>{
    if(purpose==="base_salary") return Math.round(Number(row.fixed_salary_amount)||0);
    if(purpose==="commute") return Math.round(Number(row.commute_allowance)||0);
    if(purpose==="deduction") return Math.round(Number(row.deduction_total)||0);
    if(purpose==="net_pay") return Math.round(Number(row.net_pay)||0);
    return null;
  };
  return (template.branches||[]).map(b=>{
    const overridden=amountFor(b.purpose);
    const useDept=(b.purpose==="base_salary"||b.purpose==="commute")&&dept?dept.id:(b.department_id||null);
    const debitAmount=b.debit?(overridden!=null?overridden:(b.debit.value??b.amount??0)):null;
    const creditAmount=b.credit?(overridden!=null?overridden:(b.credit.value??b.amount??0)):null;
    return {debit:b.debit||null,credit:b.credit||null,debitAmount,creditAmount,department_id:useDept,tax_id:b.tax_id||null,credit_department_id:b.credit_department_id||null,credit_tax_id:b.credit_tax_id||null,purpose:b.purpose||null,remark:b.remark||null};
  }).filter(b=>(b.debit&&b.debitAmount>0)||(b.credit&&b.creditAmount>0));
}
function payrollBankFor(userId){ return (PAYROLL_STATE.bankAccounts||[]).find(b=>b.user_id===userId); }
// 一覧の並び替え・絞り込み（2026-09-01: ユーザー要望「振込済みが1番下に行くように・絞れるように」）
// 2026-09-02: この月は対象外にした人（sf_payroll_hidden・担当Bからの依頼②）は一覧から常に除外し、
// 検索キーワード（氏名の部分一致・依頼③）も同時にここで反映する
function payrollSortedRows(){
  let rows=[...(PAYROLL_STATE.rows||[])];
  const hidden=PAYROLL_STATE.hiddenUserIds||new Set();
  rows=rows.filter(r=>!hidden.has(r.user_id));
  const q=(PAYROLL_STATE.searchQuery||"").trim();
  if(q) rows=rows.filter(r=>((r.user&&r.user.name)||"").includes(q));
  if(PAYROLL_STATE.hidePaid){
    rows=rows.filter(r=>{ const rec=payrollRecordFor(r.user_id); return !(rec&&rec.paid_at); });
  }
  if(PAYROLL_STATE.sortMode!=="default"){
    const isPaid=r=>{ const rec=payrollRecordFor(r.user_id); return rec&&rec.paid_at?1:0; };
    rows=rows.map((r,i)=>({r,i})).sort((a,b)=>(isPaid(a.r)-isPaid(b.r))||(a.i-b.i)).map(x=>x.r); // 振込完了だけ末尾へ（安定ソート）
  }
  return rows;
}
function payrollRowHtml(row){
  const asg=payrollAssignmentFor(row.user_id);
  const rec=payrollRecordFor(row.user_id);
  const name=(row.user&&row.user.name)||"—";
  // 2026-09-02: ユーザー要望「仕分辞書は"給料"の文字が入っているものだけ表示・プルダウンではなく
  // 勘定科目のように検索できるように」に対応。既に割り当て済みのテンプレートが万一「給料」を
  // 含まない古いものだった場合でも、選択中の表示が消えて空欄に見えてしまわないよう現在値だけは例外的に残す
  const currentTpl=asg&&PAYROLL_STATE.templates.find(t=>t.id===asg.template_id);
  const patternInput=`<input list="payroll-template-datalist" class="payroll-pattern-input" data-payroll-pattern="${esc(row.user_id)}" value="${esc(currentTpl?currentTpl.label:"")}" placeholder="🔍 給料の仕訳辞書を検索" ${rec?"disabled":""}>`;
  // 状態は「パターン未設定→未登録（会計未計上）→📝下書き保存中→仕訳登録済み・振込待ち→振込完了」の
  // 5段階。2026-09-01: 会計計上（MF仕訳登録）と実際の振込は別のタイミングで完了するため区別して表示。

  const draft=payrollDraftFor(row.user_id);
  let status;
  if(rec&&rec.paid_at){ status=`<span class="invoice-status done">🎉振込完了（伝票番号:${esc(String(rec.mf_journal_number??"-"))}）</span>`; }
  else if(rec){ status=`<span class="invoice-status check">💰仕訳登録済み・振込待ち（伝票番号:${esc(String(rec.mf_journal_number??"-"))}）</span>`; }
  else if(draft){ status=`<span class="invoice-status wait" title="一時保存済み。編集を再開するには「プレビュー・登録」から開いてください">📝下書き保存中</span>`; }
  else if(asg&&asg.template_id){ status=`<span class="invoice-status wait">未登録</span>`; }
  else{ status=`<span class="invoice-status gray">パターン未設定</span>`; }
  const pdfBadge=row._hasPdf
    ?`<span title="給与明細PDFあり（登録時に証憑として添付されます）">📎</span> <button class="linkbtn" style="color:var(--blue);font-size:11px;background:none;border:none;cursor:pointer;padding:0" data-payroll-pdf-open="${esc(row.user_id)}" title="PDFを開いて内容を確認">開く</button> <button class="linkbtn" style="color:var(--accent);font-size:11px;background:none;border:none;cursor:pointer;padding:0" data-payroll-pdf-delete="${esc(row.user_id)}" title="添付を間違えたPDFを削除">削除</button>`
    :`<span style="color:var(--muted)" title="給与明細PDF未アップロード">－</span>`;
  const bank=payrollBankFor(row.user_id);
  const bankLabel=!bank?"未登録":(bank.payment_method==="cash"?"💴現金手渡し":"🏦振込");
  const bankBtn=`<button class="hq-btn" style="font-size:11px;padding:6px 9px" data-payroll-bank="${esc(row.user_id)}">${bankLabel}</button>`;
  // 操作欄: 未登録なら「プレビュー・登録」、登録済みなら振込完了ボタン＋登録解除リンクを出す
  // （2026-09-01: ユーザー要望「間違えて登録した可能性もあるので解除できるように」「振込完了も手動で押せるように」）
  // 2026-09-02: どの状態でも「この月は非表示」リンクを併設（担当Bからの依頼②。まだ仕訳未登録の人でも
  // 今月は支払い不要と分かっている場合に使う想定のため状態を問わず出す）
  const hideBtn=`<button class="linkbtn" style="font-size:11px;background:none;border:none;color:var(--muted);cursor:pointer;padding:0;text-align:left" data-payroll-hide="${esc(row.user_id)}">🚫この月は非表示</button>`;
  let actionCell;
  if(rec){
    const payBtn=rec.paid_at
      ?`<button class="linkbtn" style="font-size:11px;background:none;border:none;color:var(--muted);cursor:pointer;padding:0;text-align:left" data-payroll-unpay="${esc(row.user_id)}">振込完了を取り消す</button>`
      :`<button class="hq-btn primary" style="font-size:11px;padding:6px 9px" data-payroll-pay="${esc(row.user_id)}">💰振込完了にする</button>`;
    const unregBtn=`<button class="linkbtn" style="font-size:11px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0;text-align:left" data-payroll-unregister="${esc(row.user_id)}">仕訳登録を解除</button>`;
    actionCell=`<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-start">${payBtn}${unregBtn}${hideBtn}</div>`;
  }else if(asg&&asg.template_id){
    actionCell=`<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-start"><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-payroll-preview="${esc(row.user_id)}">プレビュー・登録</button>${hideBtn}</div>`;
  }else{
    actionCell=`<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-start">${hideBtn}</div>`;
  }
  return `<tr>
    <td><b>${esc(name)}</b></td>
    <td style="text-align:right">${yen(row.fixed_salary_amount)}</td>
    <td style="text-align:right">${yen(row.commute_allowance)}</td>
    <td style="text-align:right">${yen(row.deduction_total)}</td>
    <td style="text-align:right">${yen(row.net_pay)}</td>
    <td>${patternInput}</td>
    <td style="text-align:center">${pdfBadge}</td>
    <td>${bankBtn}</td>
    <td>${status}</td>
    <td>${actionCell}</td>
  </tr>`;
}

    const esc2=s=>`"${String(s??"").replace(/"/g,'""')}"`;

    const a=document.createElement("a");

  document.querySelectorAll("[data-payroll-pay]").forEach(el=>el.onclick=async()=>{
    const userId=el.dataset.payrollPay;
    el.disabled=true;
    const r=await authed(`/rest/v1/payroll_journal_records?user_id=eq.${userId}&year_month=eq.${PAYROLL_STATE.yearMonth}`,{
      method:"PATCH",headers:{Prefer:"return=minimal"},
      body:JSON.stringify({paid_at:new Date().toISOString(),paid_by:ME.id}),
    });
    if(!r.ok){ alert("振込完了の記録に失敗しました"); el.disabled=false; return; }

// PayPay銀行「使用許容文字」ルールの自動変換（長音→ハイフン・中黒→ピリオド・小文字カナ→大文字化）。
// それ以外の使用不可文字（&や!等）はそのまま残すため、出力前に一覧で確認できるようにしてある
function paypayCleanKana(s){
  let t=String(s||"").toUpperCase();
  t=t.replace(/ー/g,"-").replace(/･/g,".").replace(/・/g,".");
  const smallMap={"ｧ":"ｱ","ｨ":"ｲ","ｩ":"ｳ","ｪ":"ｴ","ｫ":"ｵ","ｯ":"ﾂ","ｬ":"ﾔ","ｭ":"ﾕ","ｮ":"ﾖ","ァ":"ｱ","ィ":"ｲ","ゥ":"ｳ","ェ":"ｴ","ォ":"ｵ","ッ":"ﾂ","ャ":"ﾔ","ュ":"ﾕ","ョ":"ﾖ"};
  t=t.replace(/[ｧｨｩｪｫｯｬｭｮァィゥェォッャュョ]/g,c=>smallMap[c]||c);
  return t;
}
// PayPay銀行指定フォーマット（CSV）どおりに振込データを組み立てて出力する。
// 実フォーマットはdocs/フォーマット登録_PayPay銀行WEB総振_2026-08-31.md参照（公式PDFから取得済み）。
// 振込の実行はしない＝生成したCSVをダウンロードするだけ（人が確認してPayPay銀行の画面で実行する）
function payrollExportCsv(){
  const msg=$("payroll-csv-msg"); msg.className="err"; msg.textContent="";
  const skipped=[];
  const dataLines=[];
  let total=0, count=0;
  const hidden=PAYROLL_STATE.hiddenUserIds||new Set();
  for(const row of PAYROLL_STATE.rows){
    const name=(row.user&&row.user.name)||row.user_id;
    if(hidden.has(row.user_id)) continue; // この月は対象外にした人は振込CSVにも含めない（2026-09-02）
    const amount=Math.round(Number(row.net_pay)||0);
    if(!amount||amount<=0){ skipped.push(`${name}（差引支給額が0円）`); continue; }
    const bank=payrollBankFor(row.user_id);
    if(!bank){ skipped.push(`${name}（支払方法が未登録）`); continue; }
    if(bank.payment_method==="cash"){ skipped.push(`${name}（現金手渡し・CSV対象外）`); continue; }
    const cols=["1", bank.bank_code, bank.branch_code, bank.account_type, bank.account_number, paypayCleanKana(bank.account_holder_kana), String(amount), ""];
    dataLines.push(cols.join(","));
    total+=amount; count++;
  }
  if(!count){ msg.textContent="出力できる従業員がいません（振込先口座の登録状況を確認してください）"; return; }
  const trailer=["2","","","","",String(count),String(total),""].join(",");
  const csv=[...dataLines, trailer].join("\r\n")+"\r\n";
  const blob=new Blob([csv],{type:"text/csv"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`paypay_furikomi_${PAYROLL_STATE.yearMonth}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  msg.className="err msg-ok";
  msg.textContent=`${count}件・合計${yen(total)}のCSVをダウンロードしました。`+(skipped.length?`スキップ: ${skipped.join("、")}`:"");
}
// 対象年月（"YYYY-MM"）の末日を"YYYY-MM-DD"で返す（2026-09-02追加。ユーザー要望
// 「会計計上日は対象月の末日が既定値になるように」に対応。従来は常に「今日の日付」だった）
function payrollLastDayOfMonth(ym){
  const [y,m]=String(ym||"").split("-").map(Number);
  if(!y||!m) return new Date().toISOString().slice(0,10);
  const d=new Date(y,m,0); // 月mの0日目=月m(1始まり)の末日
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

  const entryHtml=(b,idx)=>{

    const accInput=(side)=>`<input list="payroll-preview-acc-datalist" class="payroll-preview-acclabel" data-idx="${idx}" data-side="${side}" value="${esc(side==="debit"?b.debitLabel:b.creditLabel)}" placeholder="${side==="debit"?"借方":"貸方"}勘定科目（空欄可）" style="width:100%;box-sizing:border-box;font-size:14px;font-weight:700;padding:6px 8px;border:1px solid var(--line);border-radius:6px">`;
    const deptSelect=(side)=>`<select class="payroll-preview-dept" data-idx="${idx}" data-side="${side}" style="width:100%;box-sizing:border-box;margin-top:5px;font-size:13px;padding:4px">${deptOptionsHtml(side==="debit"?b.department_id:b.credit_department_id)}</select>`;
    const amtInput=(side)=>`<input type="number" class="payroll-preview-amt" data-idx="${idx}" data-side="${side}" value="${side==="debit"?b.debitAmount:b.creditAmount}" style="width:100%;box-sizing:border-box;margin-top:8px;text-align:right;font-weight:700;font-size:17px;border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-variant-numeric:tabular-nums">`;
    const hasDebit=!!b.debitLabel, hasCredit=!!b.creditLabel;
    return `<div class="mfj-preview-entry" data-row-idx="${idx}">
      <div class="payroll-preview-head"><div>借方</div><div>貸方</div></div>
      <div class="mfj-preview-body">
        <div class="mfj-preview-side">${accInput("debit")}${deptSelect("debit")}${taxOptionsHtml(b.tax_id).replace('class="payroll-preview-tax"',`class="payroll-preview-tax" data-idx="${idx}" data-side="debit"`)}${amtInput("debit")}</div>
        <div class="mfj-preview-side">${accInput("credit")}${deptSelect("credit")}${taxOptionsHtml(b.credit_tax_id).replace('class="payroll-preview-tax"',`class="payroll-preview-tax" data-idx="${idx}" data-side="credit"`)}${amtInput("credit")}</div>
      </div>
      ${b.remark?`<div class="mfj-preview-remark">${esc(b.remark)}</div>`:""}
      ${branches.length>1?`<div style="text-align:right;padding:4px 9px 6px"><button data-payroll-preview-rm="${idx}" title="この行を削除" style="background:none;border:none;color:var(--accent);font-size:11px;cursor:pointer;padding:0">✕ この行を削除</button></div>`:""}
    </div>`;
  };
  const entries=branches.map(entryHtml).join("");

  // 2026-09-02: PDFがある場合は左にPDFプレビュー・右に仕訳内容を並べる2カラム表示に
  // （ユーザー要望「プレビューでPDFの内容も見れるように」「左にPDF・右で見ながら確認できるように」
  // 「PDFをもう少し大きく見やすく」に対応。PDF側を広めの比率にし、モーダル自体も横幅を拡大）。
  // 既に取得済みのbase64をその場でBlob URLに変換するだけなので追加の通信は発生しない
  const pdfUrl=pdfBase64?payrollPdfBlobUrl(pdfBase64):null;
  const {debit:initDebit,credit:initCredit}=calcTotals();
  const bodyContent=`
    ${usingDraft?`<div class="err msg-ok" style="margin-bottom:8px">📝 一時保存していた下書きから再開しました（${fmtDT(draft.updated_at)}保存分）</div>`:""}
    <div class="ai-field" style="max-width:220px;margin-bottom:10px"><small>会計計上日</small><input id="payroll-date" type="date" value="${(usingDraft&&draft.transaction_date)?draft.transaction_date:payrollLastDayOfMonth(PAYROLL_STATE.yearMonth)}"></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">対象年月: <b>${esc(PAYROLL_STATE.yearMonth)}</b>　テンプレート: <b>${esc(template.label)}</b></div>
    <div style="font-size:12px;margin-bottom:8px;color:${pdfBase64?"var(--m-green)":"var(--m-amber)"}">${pdfBase64?"📎 給与明細PDFが見つかりました。登録と同時にマネーフォワードの証憑として添付します":"⚠️ この従業員・この月の給与明細PDFが見つかりません（未アップロード）。証憑添付なしで登録します。上の「まとめてアップロード」から追加できます"}</div>
    <div class="mfj-balance" style="margin:0 0 10px">
      <div class="box"><small>借方合計</small><b id="payroll-preview-debit-total">${yen(initDebit)}</b></div>
      <div class="box"><small>貸方合計</small><b id="payroll-preview-credit-total">${yen(initCredit)}</b></div>
      <div class="box ${initDebit===initCredit?"ok":"ng"}" id="payroll-preview-diff-box"><small>差額</small><b id="payroll-preview-diff-amt">${yen(initDebit-initCredit)}</b></div>
    </div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:6px">💡 金額はPDFと見比べて違っていればここで直接修正できます（例: 端数調整や個別の手当漏れ等）</div>
    <datalist id="payroll-preview-acc-datalist">${PAYROLL_STATE.accountDatalistHtml||""}</datalist>
    <div id="payroll-preview-entries">${entries}</div>
    <div class="mail-actions" style="margin-top:6px"><button id="payroll-preview-addrow">＋ 明細行を追加</button></div>
    <div class="err" id="payrollPreviewMsg" style="margin-top:6px"></div>
    <div class="mail-actions" style="margin-top:12px">
      <button id="payrollPreviewBack">← 閉じる</button>
      <button id="payrollPreviewSaveDraft">💾 一時保存</button>
      <button class="primary" id="payrollPreviewSubmit">✅ この内容で登録</button>
    </div>
  `;
  const modal=document.createElement("div");
  modal.className="modal-bg"; modal.id="payrollPreviewModal";
  modal.innerHTML=`<div class="modal" style="max-width:${pdfUrl?"1440px":"820px"}">
    <div class="mhead"><h2>🧾 給与仕訳プレビュー — ${esc(name)}</h2><button class="linkbtn" id="payrollPreviewClose" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px">閉じる ×</button></div>
    ${pdfUrl?`<div style="display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start">
      <div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px">📎 給与明細PDF（見ながら金額を確認できます）</div>
        <iframe src="${esc(pdfUrl)}" title="給与明細PDF" style="width:100%;height:82vh;border:1px solid var(--line);border-radius:8px"></iframe>
        <div style="margin-top:8px"><button id="payroll-preview-ocr">🤖 AIで事業所別の金額・交通費を読み取る（参考値）</button></div>
        <div id="payroll-preview-ocr-result" style="margin-top:6px"></div>
      </div>
      <div>${bodyContent}</div>
    </div>`:bodyContent}
  </div>`;
  document.body.appendChild(modal);
  pushNav({modal:true});
  modal.onclick=e=>{ if(e.target===modal) history.back(); };
  if(pdfUrl){
    const revoke=()=>URL.revokeObjectURL(pdfUrl);
    $("payrollPreviewClose").addEventListener("click",revoke);
    $("payrollPreviewBack").addEventListener("click",revoke);
  }
  $("payrollPreviewClose").onclick=()=>history.back();
  $("payrollPreviewBack").onclick=()=>history.back();
  // 差額表示の更新（金額編集のたびに呼ぶ）
  const refreshTotals=()=>{
    const t=calcTotals();
    $("payroll-preview-debit-total").textContent=yen(t.debit);
    $("payroll-preview-credit-total").textContent=yen(t.credit);
    $("payroll-preview-diff-amt").textContent=yen(t.debit-t.credit);
    $("payroll-preview-diff-box").className=`box ${t.debit===t.credit?"ok":"ng"}`;
  };
  // entries部分の再描画（明細行の追加・削除のたびに呼ぶ）＋配線のやり直し
  const rerenderEntries=()=>{
    $("payroll-preview-entries").innerHTML=branches.map(entryHtml).join("");
    wireEntries();
    refreshTotals();
  };
  function wireEntries(){
    // 2026-09-02: 金額を直接編集できるように。編集のたびに合計・差額表示をその場で更新する
    document.querySelectorAll(".payroll-preview-amt").forEach(el=>el.oninput=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      const val=Number(el.value)||0;
      if(side==="debit") branches[idx].debitAmount=val; else branches[idx].creditAmount=val;
      refreshTotals();
    });
    // 勘定科目名の入力（空欄にするとその側は合計から除外される＝refreshTotals()で反映）
    document.querySelectorAll(".payroll-preview-acclabel").forEach(el=>el.oninput=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      if(side==="debit") branches[idx].debitLabel=el.value; else branches[idx].creditLabel=el.value;
      refreshTotals();
    });
    document.querySelectorAll(".payroll-preview-dept").forEach(el=>el.onchange=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      if(side==="debit") branches[idx].department_id=el.value; else branches[idx].credit_department_id=el.value;
    });
    document.querySelectorAll(".payroll-preview-tax").forEach(el=>el.onchange=()=>{
      const idx=+el.dataset.idx, side=el.dataset.side;
      if(side==="debit") branches[idx].tax_id=el.value; else branches[idx].credit_tax_id=el.value;
    });
    document.querySelectorAll("[data-payroll-preview-rm]").forEach(el=>el.onclick=()=>{
      branches.splice(+el.dataset.payrollPreviewRm,1);
      rerenderEntries();
    });
  }
  wireEntries();
  // 2026-09-02: ユーザー要望「事業所ごとの金額と交通費だけでもOCRで読み込んで表示させることは
  // できないか」に対応。あくまで参考値の表示のみ（仕訳金額への自動反映はしない）
  if($("payroll-preview-ocr")) $("payroll-preview-ocr").onclick=async()=>{
    const btn=$("payroll-preview-ocr"), el=$("payroll-preview-ocr-result");
    btn.disabled=true; btn.textContent="読み取り中…";
    const res=await payrollExtractStoreBreakdown(pdfBase64);
    btn.disabled=false; btn.textContent="🤖 AIで事業所別の金額・交通費を読み取る（参考値）";
    if(!res.ok){ el.innerHTML=`<div class="err">⚠️ ${esc(res.error)}</div>`; return; }
    el.innerHTML=`<div class="card" style="padding:8px 10px">
      <div style="font-size:10px;color:var(--muted);margin-bottom:6px">📊 PDFから読み取った参考値です（勤務詳細表の合計）。実際の仕訳金額とは自動連携していません。ご自身で確認のうえ、必要なら上の金額欄を修正してください</div>
      <table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead><tr><th style="text-align:left;padding:3px 6px">事業所</th><th style="text-align:right;padding:3px 6px">金額合計</th><th style="text-align:right;padding:3px 6px">交通費合計</th></tr></thead>
        <tbody>${res.totals.map(t=>`<tr style="border-top:1px solid var(--line)"><td style="padding:3px 6px">${esc(t.store)}</td><td style="text-align:right;padding:3px 6px">${yen(Math.round(t.amount))}</td><td style="text-align:right;padding:3px 6px">${yen(t.commute)}</td></tr>`).join("")}</tbody>
      </table>
    </div>`;
  };
  // 2026-09-02: ユーザー要望「明細を追加できるようにしてほしい」に対応。空の行を追加し、
  // 借方・貸方どちらの勘定科目も入力補完（既に取得済みのPAYROLL_STATE.accountLabelMap）から選べる
  $("payroll-preview-addrow").onclick=()=>{
    branches.push({debit:null,credit:null,debitLabel:"",creditLabel:"",debitAmount:0,creditAmount:0,department_id:null,tax_id:null,credit_department_id:null,credit_tax_id:null,remark:""});
    rerenderEntries();
  };
  // 2026-09-02: ユーザー要望「途中で消えてしまうこともあるから一時保存を」に対応。
  // 編集中のbranches（勘定科目名・金額・部門・税区分等すべて）をそのままJSONで保存する。
  // マネーフォワードへの実登録（payroll_journal_records）はしないため、状態は「下書き」のまま
  $("payrollPreviewSaveDraft").onclick=async()=>{
    const pmsg=$("payrollPreviewMsg");
    $("payrollPreviewSaveDraft").disabled=true;
    pmsg.className="err"; pmsg.textContent="一時保存中…";
    const draftPayload={
      user_id:userId, year_month:PAYROLL_STATE.yearMonth, template_id:template.id,
      branches: branches.map(({debit,credit,...rest})=>rest), // 解決済みaccountオブジェクトは保存せず、ラベル等の入力値だけ保存（次回開いたときに再解決する）
      transaction_date: $("payroll-date").value||null,
      updated_by:ME.id, updated_at:new Date().toISOString(),
    };
    const r=await authed("/rest/v1/payroll_journal_drafts",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(draftPayload)});
    $("payrollPreviewSaveDraft").disabled=false;
    if(!r.ok){ pmsg.textContent="一時保存に失敗しました"; return; }
    pmsg.className="err msg-ok"; pmsg.textContent="一時保存しました。閉じても内容は残ります（次にこの従業員のプレビューを開くと続きから編集できます）";
    const existing=PAYROLL_STATE.drafts.find(d=>d.user_id===userId);
    if(existing) Object.assign(existing,draftPayload); else PAYROLL_STATE.drafts.push(draftPayload);
    payrollRender(); // 一覧の状態表示（下書き保存中）を更新
  };
  $("payrollPreviewSubmit").onclick=async()=>{
    const pmsg=$("payrollPreviewMsg");
    // 2026-09-02: 勘定科目名（テキスト）をプルダウンの候補から選んだ勘定科目オブジェクトへ解決してから
    // 送信する（mft/mfjの仕訳辞書エディタと同じ方式）。テンプレート由来の行も含め全行が編集可能なため、
    // 全行について毎回この解決をやり直す
    for(const [i,b] of branches.entries()){
      const debitLabel=(b.debitLabel||"").trim(), creditLabel=(b.creditLabel||"").trim();
      if(debitLabel){
        const acc=PAYROLL_STATE.accountLabelMap.get(debitLabel);
        if(!acc){ pmsg.className="err"; pmsg.textContent=`${i+1}行目・借方の勘定科目「${debitLabel}」が候補にありません。一覧から選び直してください`; return; }
        b.debit=acc;
      }else{ b.debit=null; }
      if(creditLabel){
        const acc=PAYROLL_STATE.accountLabelMap.get(creditLabel);
        if(!acc){ pmsg.className="err"; pmsg.textContent=`${i+1}行目・貸方の勘定科目「${creditLabel}」が候補にありません。一覧から選び直してください`; return; }
        b.credit=acc;
      }else{ b.credit=null; }
      if(!b.debit&&!b.credit){ pmsg.className="err"; pmsg.textContent=`${i+1}行目に借方・貸方どちらも入力されていません（不要ならこの行を削除してください）`; return; }
    }
    const {debit:totalDebit,credit:totalCredit}=calcTotals();
    if(totalDebit!==totalCredit){ pmsg.className="err"; pmsg.textContent=`借方合計（${yen(totalDebit)}）と貸方合計（${yen(totalCredit)}）が一致していません。金額を確認してください`; return; }
    $("payrollPreviewSubmit").disabled=true;
    pmsg.className="err"; pmsg.textContent="登録中…";
    const payload={
      tenant_id:"default", vendor_name:`給与：${name}（${PAYROLL_STATE.yearMonth}）`,
      branches: branches.map(b=>({
        debit:b.debit?{account_id:b.debit.account_id,sub_account_id:b.debit.sub_account_id||undefined,value:b.debitAmount}:undefined,
        credit:b.credit?{account_id:b.credit.account_id,sub_account_id:b.credit.sub_account_id||undefined,value:b.creditAmount}:undefined,
        department_id:b.department_id||null, tax_id:b.tax_id||null,
        credit_department_id:b.credit_department_id||null, credit_tax_id:b.credit_tax_id||null,
        remark:b.remark||`${PAYROLL_STATE.yearMonth}分給与`,
      })),
      transaction_date: $("payroll-date").value,
      remark:`${PAYROLL_STATE.yearMonth}分給与（${name}）`,
      voucher_files: pdfBase64?[{file_name:`給与明細_${name}_${PAYROLL_STATE.yearMonth}.pdf`,file_data:pdfBase64}]:[],
    };
    const {ok,body:j}=await mfCall("create_standalone",payload);
    if(!ok){ pmsg.textContent=j.error||"登録に失敗しました"; $("payrollPreviewSubmit").disabled=false; return; }
    const recR=await authed("/rest/v1/payroll_journal_records",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({
      user_id:userId, year_month:PAYROLL_STATE.yearMonth, tenant_id:"default", template_id:template.id,
      mf_journal_id:j.journal_id, mf_journal_number:j.journal_number, mf_journal_created_at:new Date().toISOString(),
      invoice_id:j.invoice_id, created_by:ME.id,
    })});
    // 2026-09-02: 実際に登録できたら一時保存の下書きは不要になるため削除する（「登録になるまで
    // 完了にならない」＝逆に言えば登録できたら下書き扱いのままにしない、という要望に対応）
    await authed(`/rest/v1/payroll_journal_drafts?user_id=eq.${userId}&year_month=eq.${PAYROLL_STATE.yearMonth}`,{method:"DELETE"});
    pmsg.className="err msg-ok";
    const voucherNote=j.voucher_attached?`。証憑PDFも添付しました`:(j.voucher_error?`（証憑添付: ${j.voucher_error}）`:"");
    pmsg.textContent=recR.ok
      ?`登録しました（伝票番号: ${j.journal_number??"-"}）${voucherNote}。画面を更新します…`
      :`マネーフォワードへの登録は成功しました（伝票番号: ${j.journal_number??"-"}）${voucherNote}が、進捗の記録に失敗しました。再度この従業員を登録しようとすると重複する可能性があるため、マネーフォワード側の実際の登録状況を確認してください。`;
    setTimeout(async()=>{ history.back(); await payrollLoad(); payrollRender(); },1400);
  };
}

// PL連携対象科目のCRUD（設定タブ・ラウンド5指示書§6.1／設計書_広告費自動連携_§5・2026-09-01）
async function renderPlFeeAccountsSection(){
  const box=$("plfee-accounts-box");
  if(!box) return;
  box.innerHTML=`<div style="font-size:12px;color:var(--muted)">読み込み中…</div>`;
