<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>N-Styleグループ 統合ポータル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐔</text></svg>">
<style>
/* ============================================================
   配色・サイドバー構成はユーザー提供プロトタイプ
   （NStyle_請求書メール管理_UIプロトタイプ_動作修正版.html）に準拠。
   ホームのKPI・チャート・要対応欄は index.html の既存ロジック
   （WIDGETS/DEFAULT_LAYOUT/buildAlerts等）をそのまま移植し実データ化。
   各システムの中身は既存画面をiframeで埋め込む（作り直さない）。
   参照: docs/実装指示書_統合ポータルシェル_2026-08-24.md F-1
   ============================================================ */
:root{
  --bg:#f4f1eb; --panel:#fff; --ink:#231f1a; --muted:#7d756d; --line:#e4ddd4;
  --accent:#c94728; --accent-soft:#fce9e3;
  --green:#2f8f63; --green-soft:#e7f5ed;
  --amber:#b77b13; --amber-soft:#fff3d8;
  --blue:#2f6fb7; --blue-soft:#e8f0fb;
  --red:#c94728; --red-soft:#fce9e3;
  --shadow:0 8px 28px rgba(35,31,26,.08); --radius:16px;
  --nav:#211d18; --nav-line:rgba(255,255,255,.1); --nav-ink:#ddd6cf;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#211d18; --panel:#2b2620; --ink:#f2ede6; --muted:#b3aa9f; --line:#433c33; --accent-soft:#4a2c22; --green-soft:#1f3a2c; --amber-soft:#3d3018; --blue-soft:#1e3049; --red-soft:#4a2c22;}
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-size:14px;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
button,input{font:inherit}
button{border:0;cursor:pointer;background:none;color:inherit}
a{color:inherit}
.spin{text-align:center;color:var(--muted);padding:60px 0}

/* ---------- ログイン画面（index.htmlと同一実装。認証ロジックは変更禁止） ---------- */
.authwrap{max-width:420px;margin:0 auto;padding:52px 20px 60px}
.authwrap header{text-align:center;margin-bottom:26px}
.authwrap header .logo{font-size:40px}
.authwrap header h1{font-size:21px;margin-top:6px;letter-spacing:.03em}
.authwrap header p{color:var(--muted);font-size:13px;margin-top:4px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.acard label{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
.acard input{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.acard input:focus{outline:2px solid var(--accent);border-color:transparent}
.abtn{display:block;width:100%;margin-top:20px;padding:13px;font-size:16px;font-weight:600;color:#fff;background:var(--accent);border-radius:10px}
.abtn:disabled{opacity:.5}
.anote{font-size:12px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.7}
.aerr{color:#c62828;font-size:13px;margin-top:12px;text-align:center;min-height:1em}

/* ---------- シェル本体（プロトタイプ準拠のクラス名） ---------- */
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh;transition:grid-template-columns .18s}
.app.collapsed{grid-template-columns:0 minmax(0,1fr)}
/* grid項目は既定でmin-width:autoのため、トラック幅を0にしただけでは中身の
   最小サイズ分だけ縮まずに残ってしまう（実機で.mainが0側の列に押し込まれ、
   見出しが1文字ずつ縦に折り返される崩れが発生）。min-width:0を明示して
   トラック通りに0まで縮めさせる。position:fixedにしない＝grid配置の順序を
   崩さない（.sidebarを流れから外すと.mainが繰り上がって0側の列に入ってしまう） */
.app.collapsed .sidebar{min-width:0;width:0;padding:0;border:0;overflow:hidden}
.sidebar{background:var(--nav);color:var(--nav-ink);padding:20px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;transition:width .18s,padding .18s}
.collapse-tab{display:none;position:fixed;left:0;top:14px;z-index:30;background:var(--nav);color:#fff;border:1px solid var(--nav-line);border-left:0;border-radius:0 10px 10px 0;padding:9px 7px;font-size:13px}
.app.collapsed .collapse-tab{display:block}
.sidebar-toggle{margin-left:auto;color:var(--nav-ink);font-size:15px;padding:4px 6px;border-radius:6px}
.sidebar-toggle:hover{background:rgba(255,255,255,.08);color:#fff}
@media(max-width:760px){.collapse-tab{display:none!important}}
.brand{display:flex;gap:12px;align-items:center;padding:4px 4px 18px;border-bottom:1px solid var(--nav-line);margin-bottom:14px}
.brand-badge{width:40px;height:40px;border-radius:12px;background:#f0c24f;display:grid;place-items:center;font-size:20px;flex:0 0 auto}
.brand strong{display:block;font-size:17px;color:#fff}.brand small{color:#bdb6ad;font-size:11.5px}
.section-title{font-size:10.5px;color:#8f887f;text-transform:uppercase;letter-spacing:.12em;margin:20px 10px 7px}
.nav-item,.nav-group-head{width:100%;border:0;background:transparent;color:var(--nav-ink);text-align:left;padding:10px 11px;border-radius:10px;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13.5px}
.nav-item:hover,.nav-group-head:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:#3a342e;color:#fff;font-weight:700}
.nav-item.soon{opacity:.55;cursor:default}
.nav-item .count,.nav-item .badge-soon{margin-left:auto;background:var(--accent);color:#fff;border-radius:99px;padding:2px 7px;font-size:10.5px;font-weight:700;white-space:nowrap}
.nav-item .badge-soon{background:rgba(255,255,255,.14);color:#cfc7bd}
.nav-item .ext{margin-left:auto;font-size:11px;color:#8d8271}
.nav-group-head{font-weight:700;color:#fff}
.chev{margin-left:auto;transition:.2s;color:#a89c88}.nav-group.open .chev{transform:rotate(90deg)}
.subnav{display:none;padding:2px 0 6px 12px}.nav-group.open .subnav{display:block}
.subnav .nav-item{font-size:13.5px;padding:9px 10px}
.userbox{margin-top:20px;padding-top:16px;border-top:1px solid var(--nav-line);font-size:12.5px;color:#cfc7bd;line-height:1.8}
.userbox button{color:#cfc7bd;text-decoration:underline;font-size:11.5px;display:block;padding:1px 0}
.userbox button:hover{color:#fff}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{min-height:70px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 26px;position:sticky;top:0;z-index:5;flex-wrap:wrap}
.topbar h1{font-size:20px;margin:10px 0 0}.topbar .meta{color:var(--muted);font-size:12.5px;margin:2px 0 10px}
.top-actions{display:flex;gap:9px;align-items:center;margin:10px 0;position:relative}
.search{border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:10px 13px;min-width:280px;color:var(--ink)}
.searchdrop{position:absolute;top:calc(100% + 6px);left:0;right:74px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:20;max-height:60vh;overflow-y:auto}
.searchdrop button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink)}
.searchdrop button:last-child{border-bottom:0}
.searchdrop button:hover{background:var(--bg)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:10px 12px;cursor:pointer;position:relative;color:var(--ink);white-space:nowrap}
.iconbtn:hover{background:var(--bg)}
.iconbtn .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:99px;background:var(--accent);border:2px solid var(--panel)}
.bellpanel{position:absolute;top:calc(100% + 6px);right:0;width:320px;max-width:88vw;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:20;max-height:70vh;overflow-y:auto}
.bellpanel .brow{padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.bellpanel .brow:last-child{border-bottom:none}
.bellpanel .brow b{display:block;font-size:13px;margin-bottom:2px}
.bellpanel .brow.unread{background:var(--accent-soft)}
.bellpanel .empty{padding:20px;text-align:center;color:var(--muted);font-size:12.5px}

.content{padding:22px 26px 46px;max-width:1500px;margin:0 auto;width:100%}
.framewrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:0}
.framewrap iframe{flex:1;width:100%;border:0;background:var(--panel)}

/* KPI・パネル（index.htmlのダッシュボード部品を流用） */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.dcard,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.dcard{padding:15px 17px;min-height:106px;display:grid;align-content:space-between;gap:9px}
.dcard a{color:inherit;text-decoration:none;display:block}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctitle{color:var(--muted);font-size:12px}
.badge{display:inline-flex;align-items:center;height:23px;border-radius:99px;font-size:11px;font-weight:700;padding:0 9px;white-space:nowrap}
.b-up{color:var(--green);background:var(--green-soft)} .b-warn{color:var(--amber);background:var(--amber-soft)}
.b-bad{color:var(--red);background:var(--red-soft)} .b-info{color:var(--blue);background:var(--blue-soft)}
.value{font-size:25px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:12px;line-height:1.5}
.skel{opacity:.5}
.skel .value{background:var(--bg);border-radius:6px;color:transparent}
.two{display:grid;grid-template-columns:1.5fr .9fr;gap:16px;margin-top:16px;align-items:start}

/* F-7: ホーム画面のウィジェット編集（WP/ブログ風。サイズ=小1/中2/大4カラム分） */
.home-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:16px;align-items:start}
.home-grid>*{min-width:0}
.hw-small{grid-column:span 1}
.hw-medium{grid-column:span 2}
.hw-large{grid-column:span 4}
@media(max-width:1100px){.hw-small,.hw-medium{grid-column:span 2}}
.hedit-topbtn{display:flex;justify-content:flex-end;margin-top:-4px}
.hedit-role{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.hedit-role button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 14px;font-size:13px}
.hedit-role button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hedit-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--panel)}
.hedit-row label{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:14px}
.hedit-row select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);color:var(--ink);font-size:12.5px}
.hedit-updn button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;margin-left:3px}
.hedit-updn button:disabled{opacity:.3}
.phead{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-size:15px}
.phead .sub2{color:var(--muted);font-size:12px}
.chart-area{height:250px;padding:10px 14px 16px}
canvas{width:100%;height:100%;display:block}
.item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 17px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.item:last-child{border-bottom:0}
.item strong{display:block;font-size:13px;margin-bottom:2px}
.item span{color:var(--muted);font-size:11.5px}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--bg)}
.st{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.s-ok{color:var(--green);background:var(--green-soft)} .s-bad{color:var(--red);background:var(--red-soft)}
.s-warn{color:var(--amber);background:var(--amber-soft)} .s-mut{color:var(--muted);background:var(--bg)}
.empty{padding:22px;color:var(--muted);text-align:center;font-size:12.5px}

/* よく使う機能（デスクトップ・簡易版） */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px}
.quick button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;text-align:left;cursor:pointer}
.quick button:hover{border-color:#cfc5ba}
.quick strong{display:block;font-size:14.5px}.quick small{color:var(--muted)}

/* モバイルホーム（プロトタイプ準拠） */
.mobile-home{display:none}
.mobile-home-summary{background:var(--nav);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.mobile-home-summary small{color:#cfc8c0;display:block;margin-bottom:5px}
.mobile-home-summary .sales{font-size:27px;font-weight:900}
.mobile-home-summary .delta{font-size:12px;margin-top:6px;color:#c8ead7}
.mobile-kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.mobile-kpi-row .dcard{min-height:0;padding:12px}
.mobile-kpi-row .value{font-size:19px}
.mobile-section-title{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 8px}
.mobile-section-title b{font-size:14.5px}
.mobile-section-title span{color:#8a8179;font-size:11px}
.mobile-system-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mobile-system-btn{min-height:76px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;text-align:left;cursor:pointer}
.mobile-system-btn strong{display:block;font-size:13.5px;margin-top:4px}
.mobile-system-btn small{display:block;color:var(--muted);margin-top:2px;font-size:10.5px}
.mobile-system-btn .icon{font-size:19px}
.desktop-home{display:block}

/* モバイル下部ナビ・「その他」シート */
.mobilebar{display:none}
.mobile-more{position:fixed;inset:0;z-index:60;display:none;background:rgba(20,17,14,.4);align-items:flex-end}
.mobile-more.open{display:flex}
.mobile-more-panel{width:100%;background:var(--bg);border-radius:20px 20px 0 0;padding:14px 12px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.mobile-more-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mobile-more-head b{font-size:15px}
.mobile-more-head button{border:0;background:var(--panel);width:34px;height:34px;border-radius:10px;font-size:15px}

@media(max-width:760px){
  /* display:blockだとiframeがflex:1で高さを確保する仕組み（.main→.framewrap→iframe）が
     機能せず、iframeが極端に潰れて下に背景色の余白だけ残る不具合が実機で発生したため、
     デスクトップと同じ「高さが伝わる」構造（flex column）のまま幅だけ1カラムにする */
  .app{display:flex;flex-direction:column;min-height:100vh}
  .main{flex:1;min-height:0}
  .sidebar{display:none}
  .topbar{padding:0 16px;min-height:60px}
  .top-actions{display:none}
  .content{padding:14px 12px 90px}
  .two{grid-template-columns:1fr}
  .quick{grid-template-columns:1fr}
  .desktop-home{display:none}
  .mobile-home{display:block}
  .mobilebar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:45;padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(35,31,26,.08)}
  .mobilebar button{border:0;background:transparent;color:#6d655d;font-size:10px;line-height:1.3;padding:6px 2px;border-radius:9px;text-align:center}
  .mobilebar button.active{color:var(--accent);font-weight:700}
}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;box-shadow:var(--shadow);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:760px){.toast{bottom:78px}}

.modal-bg{position:fixed;inset:0;background:rgba(20,15,8,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border-radius:16px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);max-height:80vh;overflow-y:auto}
.modal h3{margin:0 0 6px;font-size:16px}
.modal p.desc{color:var(--muted);font-size:12.5px;margin:0 0 16px;line-height:1.6}
.modal .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.modal .row:last-of-type{border-bottom:0}
.modal .row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.modal .empty{color:var(--muted);font-size:12.5px;padding:10px 0}
.modal .close{margin-top:16px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;text-align:center}
</style>
</head>

<div id="root"><div class="spin">読み込み中…</div></div>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   認証・セッション（index.htmlと完全に同一・変更禁止部分）
   nsportal_session_v1 のキー名・{at,rt,uid}の形式は
   tori/seisanダッシュボードの自動ログインが直接読みに来るため絶対に変えない。
   ============================================================ */
const SUPA_URL="https://uuvsxzhpxtghojoubjcc.supabase.co";
const SUPA_KEY="sb_publishable_MrwPJAx_Ws_fdRutprKCiQ_dg3wCiTr"; // 公開用キー（秘密情報ではない）
const LS_KEY="nsportal_session_v1";
const ROLE_NAME={CEO:"社長",HQ:"本部",TEAM:"チーム長",TENCHO:"店長",SHAIN:"社員",AL:"アルバイト"};

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sess={get:()=>{try{return JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return null}},
            set:v=>localStorage.setItem(LS_KEY,JSON.stringify(v)),
            clear:()=>localStorage.removeItem(LS_KEY)};

async function api(path,opt={},token){
  const r=await fetch(SUPA_URL+path,{...opt,headers:{
    "apikey":SUPA_KEY,"Content-Type":"application/json",
    ...(token?{"Authorization":"Bearer "+token}:{}),...(opt.headers||{})}});
  let body=null; const tx=await r.text(); try{body=tx?JSON.parse(tx):null}catch(e){}
  return {ok:r.ok,status:r.status,body};
}
async function authed(path,opt={}){
  const s=sess.get(); if(!s) return {ok:false,status:401,body:null};
  let r=await api(path,opt,s.at);
  if(r.status===401){ if(!await refresh()) return r; r=await api(path,opt,sess.get().at); }
  return r;
}
async function login(email,pw){
  const r=await api("/auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password:pw})});
  if(!r.ok) throw new Error(r.body?.error_code==="invalid_credentials"?"メールアドレスまたはパスワードが違います":"ログインエラー: "+(r.body?.msg||r.status));
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});
  return r.body;
}
async function refresh(){
  const s=sess.get(); if(!s?.rt) return false;
  const r=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.rt})});
  if(!r.ok){sess.clear();return false}
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});
  return true;
}
async function fetchMe(){
  const s=sess.get(); if(!s) return null;
  const r=await authed(`/rest/v1/users?id=eq.${s.uid}&select=*`);
  if(!r.ok||!Array.isArray(r.body)||!r.body[0]) return null;
  return r.body[0];
}

/* ============================================================
   日付・共通ヘルパー（index.htmlと同一）
   ============================================================ */
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return ymd(new Date()); }
function addDaysStr(base,n){ const d=new Date(base+"T00:00:00"); d.setDate(d.getDate()+(+n||0)); return ymd(d); }
function fmtD(t){ if(!t) return "—"; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtDT(t){ if(!t) return "—"; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function fmtTime(t){ if(!t) return "—"; const d=new Date(t); return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function yen(n){ n=Math.round(n||0); if(Math.abs(n)>=1e6) return "¥"+(n/1e6).toFixed(1)+"M"; if(Math.abs(n)>=1e4) return "¥"+Math.round(n/1e4)+"万"; return "¥"+n.toLocaleString(); }

   キーは index.html の SYSTEMS と同じ7種のみ使用＝新しい権限の仕組みは作らない）

const SYS_ROLES={
  nippo:   ["AL","SHAIN","TENCHO","TEAM","HQ","CEO"],
  keiei:   ["TENCHO","TEAM","HQ","CEO"],
  seisan:  ["HQ","CEO"],
  joho:    ["TEAM","HQ","CEO"],
  expenses:["AL","SHAIN","TENCHO","TEAM","HQ","CEO"],
  invoices:["HQ","CEO"],
  hqtasks: ["TEAM","HQ","CEO"],
  // nippoの「管理」「設定」（アカウント無効化・外部連携キー等の重い機能）用。
  // 既定は誰にも見せず、マスターと「マスターが個別に許可した本部の人」だけに
  // 見せる（ユーザー指示・2026-08-24）。既存の仕組み（portal_user_overrides）
  // をそのまま流用し、付与UIはportal.html内に自前で用意する
  // （index.htmlの設定画面はこのキーを知らないため編集不可＝index.htmlは無変更のまま）
  nippo_admin: [],
};
let PERMS=null, MY_OVR={};
async function fetchPerms(){
  const s=sess.get(); if(!s) return;
  const [p,o]=await Promise.all([
    authed("/rest/v1/portal_permissions?select=role,system_key,allowed"),
    authed(`/rest/v1/portal_user_overrides?user_id=eq.${s.uid}&select=system_key,allowed`)
  ]);
  if(p.ok&&Array.isArray(p.body)&&p.body.length){
    PERMS={};
    p.body.forEach(r=>{ (PERMS[r.role]=PERMS[r.role]||{})[r.system_key]=r.allowed; });
  }
  MY_OVR={};
  if(o.ok&&Array.isArray(o.body)) o.body.forEach(r=>{ MY_OVR[r.system_key]=r.allowed; });
}
function canSeeKey(key,u){
  if(u.is_master) return true;
  if(key in MY_OVR) return MY_OVR[key];
  if(PERMS&&PERMS[u.role]&&(key in PERMS[u.role])) return PERMS[u.role][key];
  return (SYS_ROLES[key]||[]).includes(u.role);
}
function myStoreScope(u){
  if(!u||u.is_master) return null;
  if(["CEO","HQ","TEAM"].includes(u.role)) return null;
  return ME_STORES.slice();
}
let ME_STORES=[];
async function fetchMyStores(){
  try{
    const r=await authed(`/rest/v1/user_stores?user_id=eq.${ME.id}&select=store:stores(name)`);
    ME_STORES=(r.ok&&Array.isArray(r.body))?r.body.map(x=>x.store&&x.store.name).filter(Boolean):[];

}

/* ============================================================
   ハブDB横断データ（本部タスク・チェック・日報・店舗）
   index.htmlのHUB取得ロジックをそのまま移植（読み取りのみ）
   ============================================================ */
let HUB={ hqTasks:null, checklist:null, stores:null };
function sortedSteps(t){ return (t.hq_task_steps||[]).slice().sort((a,b)=>a.sort_order-b.sort_order); }
function currentStep(t){ return sortedSteps(t).find(s=>!s.completed_at)||null; }
async function fetchHqTasks(){
  try{
    const r=await authed(`/rest/v1/hq_tasks?select=*,hq_task_steps(*)&status=neq.done`);
    HUB.hqTasks=(r.ok&&Array.isArray(r.body))?r.body:[];
  }catch(e){ HUB.hqTasks=[]; }
  return HUB.hqTasks;
}
function hqSignal(t){
  const cur=currentStep(t); const today=todayStr();
  if(!cur) return {cur:null,overdue:false,dueToday:false,stalled:false,stalledDays:0};
  const overdue=!!(cur.due_date&&cur.due_date<today);
  const dueToday=!!(cur.due_date&&cur.due_date===today);
  const steps=sortedSteps(t); const idx=steps.indexOf(cur);
  const since=idx>0?steps[idx-1].completed_at:t.created_at;
  const stalledDays=since?Math.floor((Date.now()-new Date(since).getTime())/86400000):0;
  return {cur,overdue,dueToday,stalled:overdue||stalledDays>=3,stalledDays};
}
async function fetchStores(){
  try{
    const r=await authed("/rest/v1/stores?select=id,name,store_no,is_active&is_active=eq.true&order=sort_order");
    HUB.stores=(r.ok&&Array.isArray(r.body))?r.body:[];
  }catch(e){ HUB.stores=[]; }
  return HUB.stores;
}
async function fetchChecklistToday(){
  try{
    const today=todayStr();
    const [tpl,items,checks]=await Promise.all([
      authed("/rest/v1/checklist_templates?is_active=eq.true&select=id,store_id"),
      authed("/rest/v1/checklist_items?is_active=eq.true&select=id,template_id"),
      authed(`/rest/v1/checklist_checks?work_date=eq.${today}&select=item_id,store_id`),
    ]);
    HUB.checklist={
      templates:(tpl.ok&&Array.isArray(tpl.body))?tpl.body:[],
      items:(items.ok&&Array.isArray(items.body))?items.body:[],
      checks:(checks.ok&&Array.isArray(checks.body))?checks.body:[],
    };
  }catch(e){ HUB.checklist=null; }
  return HUB.checklist;
}
function checklistPerStore(){
  const ck=HUB.checklist, stores=HUB.stores||[];
  if(!ck) return [];
  return stores.map(st=>{
    const tpls=ck.templates.filter(t=>!t.store_id||t.store_id===st.id).map(t=>t.id);
    const itemIds=ck.items.filter(i=>tpls.includes(i.template_id)).map(i=>i.id);
    const done=ck.checks.filter(c=>c.store_id===st.id&&itemIds.includes(c.item_id)).length;
    return {store:st,total:itemIds.length,done};
  });
}
let HUB_REPORTS_Y=null;
async function fetchReportsYesterday(){
  try{
    const yday=addDaysStr(todayStr(),-1);
    const t0=new Date(yday+"T00:00:00"), t1=new Date(todayStr()+"T00:00:00");
    const [stat,sub]=await Promise.all([
      authed("/rest/v1/rpc/dash_stats",{method:"POST",body:JSON.stringify({p_from:t0.toISOString(),p_to:t1.toISOString()})}),
      authed(`/rest/v1/reports?kind=eq.daily&report_date=eq.${yday}&select=author_id`),
    ]);
    const rows=(stat.ok&&Array.isArray(stat.body))?stat.body:null;
    const submitted=(sub.ok&&Array.isArray(sub.body))?new Set(sub.body.map(r=>r.author_id)):new Set();
    if(!rows) throw new Error("no data");
    const usersR=await authed("/rest/v1/users?select=id,role,name&is_active=eq.true");
    const users=(usersR.ok&&Array.isArray(usersR.body))?usersR.body:[];
    const targets=rows.map(r=>users.find(u=>u.id===r.uid)).filter(u=>u&&u.role!=="CEO");
    const missing=targets.filter(u=>!submitted.has(u.id));
    HUB_REPORTS_Y={date:yday,total:targets.length,submitted:targets.length-missing.length,missing};
  }catch(e){ HUB_REPORTS_Y=null; }
  return HUB_REPORTS_Y;
}

   通知ベル（index.htmlと同一。hq_notificationsの読み取りのみ）
   ============================================================ */
let NOTIFS=[], NOTIF_UNREAD=0, BELL_OPEN=false;
async function fetchNotifs(){
  try{
    const r=await authed(`/rest/v1/hq_notifications?recipient_id=eq.${ME.id}&order=created_at.desc&limit=20`);
    NOTIFS=(r.ok&&Array.isArray(r.body))?r.body:[];
    NOTIF_UNREAD=NOTIFS.filter(n=>!n.read_at).length;
  }catch(e){ NOTIFS=[]; NOTIF_UNREAD=0; }
}
async function markNotifsRead(){
  const ids=NOTIFS.filter(n=>!n.read_at).map(n=>n.id);
  if(!ids.length) return;
  await authed(`/rest/v1/hq_notifications?id=in.(${ids.join(",")})`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({read_at:new Date().toISOString()})});
  NOTIFS.forEach(n=>{ if(!n.read_at) n.read_at=new Date().toISOString(); });
  NOTIF_UNREAD=0;
}
function bellHtml(){
  return `<button class="iconbtn" id="bellbtn" title="通知">🔔${NOTIF_UNREAD?'<span class="dot"></span>':""}</button>
    <div class="bellpanel" id="bellpanel" style="display:${BELL_OPEN?"block":"none"}">
      ${NOTIFS.length?NOTIFS.map(n=>`<div class="brow${n.read_at?"":" unread"}" data-notif="${n.task_id||""}"><b>${esc(n.title)}</b>${esc(n.body||"")}<div style="color:var(--muted);margin-top:2px">${fmtDT(n.created_at)}</div></div>`).join("")
        :'<div class="empty">通知はありません</div>'}
    </div>`;
}
function wireBell(){
  const btn=$("bellbtn"); if(!btn) return;
  btn.onclick=async e=>{
    e.stopPropagation();
    BELL_OPEN=!BELL_OPEN;
    if(BELL_OPEN&&NOTIF_UNREAD) await markNotifsRead();
    refreshBell();
  };
  document.querySelectorAll("[data-notif]").forEach(el=>{
    el.onclick=()=>{ if(el.dataset.notif) window.open("tasks.html?task="+el.dataset.notif,"_blank"); };
  });
}
function refreshBell(){
  const wrap=$("bellwrap"); if(!wrap) return;
  wrap.innerHTML=bellHtml();
  wireBell();
}

/* ============================================================
   経営ダッシュボード連携（tori GAS。index.htmlと同一実装）
   ============================================================ */
const TORI_GAS_URL="https://script.google.com/macros/s/AKfycbz9rd37EZa6X8WRMVEBrXobN8DbYWkHRlhFNYU5rd1UZ0V8j0-6shMQjEeoi4HDWZ0B/exec";
const TORI_CACHE_KEY="portal_tori_cache";
async function toriApi(params){
  const r=await fetch(TORI_GAS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(params)});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function toriSsoLogin(){
  const s=sess.get(); if(!s?.at) throw new Error("未ログイン");
  const d=await toriApi({action:"supalogin",stoken:s.at});
  if(!d.ok) throw new Error(d.error||"経営Dへの接続に失敗しました");
  return d.token;
}
const toriNum=v=>parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,""))||0;
const toriDate=ds=>{ const m=String(ds==null?"":ds).match(/(\d{4})[\/\-年.](\d{1,2})[\/\-月.](\d{1,2})/); if(!m)return 0; const Y=+m[1],M=+m[2],Dd=+m[3]; if(!Y||!M||!Dd)return 0; return new Date(Y,M-1,Dd).getTime(); };
function toriColAny(H,kwsList){ for(const kws of kwsList){ const i=H.findIndex(h=>String(h).indexOf(kws)>=0); if(i>=0) return i; } return -1; }
function toriFindHeader(rows,kws){ for(let i=0;i<Math.min(rows.length,10);i++){ const line=rows[i].join(","); if(kws.every(k=>line.includes(k))) return i; } return 0; }
function parseToriDaily(rows){
  if(!Array.isArray(rows)||!rows.length) return [];
  const hi=toriFindHeader(rows,["店舗","純売上"]);
  const H=rows[hi].map(h=>String(h).trim());
  const iD=toriColAny(H,["日付","営業日","勤務日","年月日"]), iS=toriColAny(H,["店舗名","店舗"]),
        iSl=toriColAny(H,["純売上","総売上","売上"]), iL=toriColAny(H,["人件費合計","人件費"]), iC=toriColAny(H,["仕入金額","仕入","原価"]);
  if(iD<0||iS<0||iSl<0) return [];
  const recs=[];
  for(let i=hi+1;i<rows.length;i++){
    const c=rows[i]; const st=String(c[iS]||"").trim(); const t=toriDate(c[iD]);
    if(!st||!t) continue;
    recs.push({store:st,t,sales:toriNum(c[iSl]),labor:iL>=0?toriNum(c[iL]):0,cost:iC>=0?toriNum(c[iC]):0});
  }
  return recs;
}
function toriCacheGet(){ try{ return JSON.parse(localStorage.getItem(TORI_CACHE_KEY)); }catch(e){ return null; } }
function toriCacheSet(v){ try{ localStorage.setItem(TORI_CACHE_KEY,JSON.stringify(v)); }catch(e){} }
function toriCacheFresh(c){
  if(!c||!c.fetchedAt||!Array.isArray(c.daily)) return false;
  const fetched=new Date(c.fetchedAt), now=new Date();
  const today11=new Date(now.getFullYear(),now.getMonth(),now.getDate(),11,0,0);
  if(now<today11) return true;
  return fetched>=today11;
}
let TORI_STATE={status:"idle",daily:[],error:null};
async function ensureToriData(force){
  const cached=toriCacheGet();
  if(!force&&toriCacheFresh(cached)){ TORI_STATE={status:"ok",daily:cached.daily,error:null}; return TORI_STATE; }
  TORI_STATE={status:"loading",daily:cached?cached.daily:[],error:null};
  try{
    const token=await toriSsoLogin();
    const d=await toriApi({action:"data",token,months:13,keys:"daily"});
    if(!d.ok) throw new Error(d.error||"取得に失敗しました");
    const daily=parseToriDaily((d.sheets||{}).daily||[]);
    toriCacheSet({fetchedAt:new Date().toISOString(),daily});
    TORI_STATE={status:"ok",daily,error:null};
  }catch(e){
    TORI_STATE={status:"error",daily:cached?cached.daily:[],error:e.message||"接続できません"};
  }
  return TORI_STATE;
}
function sameDay(t,d){ const a=new Date(t); return a.getFullYear()===d.getFullYear()&&a.getMonth()===d.getMonth()&&a.getDate()===d.getDate(); }
function sameDayLastYearSameDow(t,ref){
  const a=new Date(t); if(a.getFullYear()!==ref.getFullYear()-1) return false;
  const diff=Math.abs((a-new Date(ref.getFullYear()-1,ref.getMonth(),ref.getDate()))/86400000);
  return diff<=3 && a.getDay()===ref.getDay();
}
function yoyBadge(yoy){ return yoy==null?"":`<span class="badge ${yoy>=0?"b-up":"b-bad"}">${yoy>0?"+":""}${yoy}%</span>`; }
function kpiCard(title,value,badgeHtml,sub){
  return `<article class="dcard"><div class="chead"><div class="ctitle">${esc(title)}</div>${badgeHtml||""}</div><div><div class="value">${value}</div><div class="sub">${esc(sub||"")}</div></div></article>`;
}
function kpiSkeleton(title){ return `<article class="dcard skel"><div class="chead"><div class="ctitle">${esc(title)}</div></div><div><div class="value">------</div><div class="sub">取得中…</div></div></article>`; }
function kpiOffline(title,msg,detail){ return `<article class="dcard"><div class="chead"><div class="ctitle">${esc(title)}</div><span class="badge b-warn">未接続</span></div><div><div class="value" style="font-size:14px;font-weight:600">${esc(msg)}</div><div class="sub">${esc(detail||"")}</div></div></article>`; }

async function fetchApiCostDaily(){

    return (r.ok&&Array.isArray(r.body))?r.body:[];

const monthKeyOf=dateStr=>String(dateStr||"").slice(0,7); // "YYYY-MM"（UTC暦日ベース。JSTと数日ズレる可能性がある前提で月次目安として使用）

// F-1.5（続き・2026-08-28着手）: LINE配信数・残高。新設のportal-line-usage
// Edge Function（ログイン中ユーザーのJWTで認証・マスター/HQ/CEOのみ許可）を呼ぶ
async function fetchLineUsage(){
  const s=sess.get(); if(!s?.at) return {ok:false,error:"未ログイン"};
  try{
    const r=await fetch(SUPA_URL+"/functions/v1/portal-line-usage",{
      headers:{apikey:SUPA_KEY,Authorization:"Bearer "+s.at}
    });
    const body=await r.json().catch(()=>null);
    if(!body) return {ok:false,error:"応答を読めませんでした"};
    return body;
  }catch(e){ return {ok:false,error:e.message||"通信エラー"}; }
}
function lineUsageHtml(res){
  if(!res.ok){
    return `<div class="empty" style="text-align:left;padding:16px 17px">取得できません（${esc(res.error||"不明なエラー")}）</div>`;
  }
  if(res.limitType!=="limited"||res.limit==null){
    return `<div class="item"><span class="av">📱</span><span><strong>今月の送信数</strong><span>${res.used.toLocaleString()}通（上限なしプラン）</span></span><span></span></div>`;
  }
  const pct=Math.round((res.ratio||0)*1000)/10;
  const tone=pct>=95?"b-bad":pct>=80?"b-warn":"b-up";
  return `<div class="item"><span class="av">📱</span><span><strong>今月の送信数</strong><span>${res.used.toLocaleString()} / ${res.limit.toLocaleString()}通（残り${(res.limit-res.used).toLocaleString()}通）</span></span><span class="badge ${tone}">${pct}%</span></div>`;
}

function drawTrendChart(daily,metric){
  const cv=$("trendcv"); if(!cv) return; const ctx=cv.getContext("2d");
  const rect=cv.getBoundingClientRect(), r=window.devicePixelRatio||1;
  cv.width=Math.max(500,rect.width*r); cv.height=Math.max(220,rect.height*r); ctx.scale(r,r);
  const w=cv.width/r,h=cv.height/r,pad={t:20,r:16,b:30,l:46};
  const months=[]; const now=new Date();
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push(d); }
  const data=months.map(m=>{
    const rows=daily.filter(r=>{ const d=new Date(r.t); return d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth(); });
    const sales=rows.reduce((s,r)=>s+r.sales,0);
    return Math.round(sales/1e6*10)/10;
  });
  const color="#c94728";
  const max=Math.max(...data,1)*1.15, min=Math.min(...data,0)*0.85;
  const pw=w-pad.l-pad.r, ph=h-pad.t-pad.b;
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="#eee7db"; ctx.fillStyle="#7d7466"; ctx.font="11px system-ui"; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=pad.t+ph*i/4; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke();
    ctx.fillText(String(Math.round(max-(max-min)*i/4)),6,y+4); }
  const pts=data.map((v,i)=>[pad.l+pw*i/(data.length-1),pad.t+ph-((v-min)/(max-min||1))*ph]);
  const g=ctx.createLinearGradient(0,pad.t,0,h-pad.b); g.addColorStop(0,color+"2e"); g.addColorStop(1,color+"00");
  ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
  ctx.lineTo(w-pad.r,h-pad.b); ctx.lineTo(pad.l,h-pad.b); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.stroke();
  pts.forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(x,y,3.5,0,7); ctx.fillStyle="#fff"; ctx.fill(); ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke(); });
  ctx.fillStyle="#7d7466";
  months.forEach((m,i)=>{ ctx.fillText((m.getMonth()+1)+"月",pad.l+pw*i/11-9,h-10); });
  ctx.fillText("月次売上（百万円）",pad.l,14);
}

function itemVisible(it,grp,u){
  if(u.is_master) return true;
  if(it.sysKey && !canSeeKey(it.sysKey,u)) return false;
  if(it.roles && !it.roles.includes(u.role)) return false; // 項目単位の追加ロール制限（グループ内の一部だけ絞りたい時）
  if(grp&&grp.roles && !grp.roles.includes(u.role)) return false;
  return true;
}
function findItem(key){
  for(const it of TOP_ITEMS) if(it.key===key) return {it,grp:null};
  for(const it of SYS_ITEMS) if(it.key===key) return {it,grp:null};
  for(const grp of GROUPS) for(const it of grp.items) if(it.key===key) return {it,grp};
  return null;
}
function visibleLeafItems(u){
  const out=[];
  TOP_ITEMS.forEach(it=>{ if(it.type!=="home"&&itemVisible(it,null,u)) out.push(it); });
  SYS_ITEMS.forEach(it=>{ if(itemVisible(it,null,u)) out.push(it); });
  GROUPS.forEach(grp=>grp.items.forEach(it=>{ if(!it.soon&&itemVisible(it,grp,u)) out.push(it); }));
  return out;
}

function openJohoSso(){
  const s=sess.get();
  if(!s?.at||!s?.rt){ toast("ログイン情報が見つかりません"); return; }
  const frag="access_token="+encodeURIComponent(s.at)+"&refresh_token="+encodeURIComponent(s.rt);
  window.open(JOHO_URL+"/sso#"+frag,"_blank","noopener");
}

let toastTimer=null;
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ============================================================
   マスター専用: 「管理（アカウント）」「設定（連携キー）」を見せる人の設定
   （system_key="nippo_admin"の portal_user_overrides を直接編集。
   既存の index.html 設定画面はこのキーを知らないため、ここに専用UIを用意した。
   新しい権限の"仕組み"は作らず、既存テーブルへの行の出し入れのみ行う）
   ============================================================ */
async function openAdminOverrideModal(){
  const bg=document.createElement("div");
  bg.className="modal-bg";
  bg.innerHTML=`<div class="modal">
    <h3>⚙️ 管理項目を見せる人を設定</h3>
    <p class="desc">nippoの「管理（アカウント）」「設定（連携キー）」は、マスターと下でチェックした本部の人だけに表示されます。</p>
    <div id="ovrlist"><div class="empty">読み込み中…</div></div>
    <button class="close" id="ovrclose">閉じる</button>
  </div>`;
  document.body.appendChild(bg);
  bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
  $("ovrclose").onclick=()=>bg.remove();

  const [usersR,ovrR]=await Promise.all([
    authed("/rest/v1/users?role=eq.HQ&is_active=eq.true&select=id,name&order=name"),
    authed(`/rest/v1/portal_user_overrides?system_key=eq.nippo_admin&select=user_id,allowed`),
  ]);
  const users=(usersR.ok&&Array.isArray(usersR.body))?usersR.body:[];
  const ovrMap={};
  if(ovrR.ok&&Array.isArray(ovrR.body)) ovrR.body.forEach(r=>{ ovrMap[r.user_id]=r.allowed; });
  const list=$("ovrlist");
  if(!users.length){ list.innerHTML=`<div class="empty">本部（HQ）ロールの人がいません</div>`; return; }
  list.innerHTML=users.map(x=>`<label class="row"><input type="checkbox" data-uid="${x.id}" ${ovrMap[x.id]?"checked":""}>${esc(x.name)}</label>`).join("");
  list.querySelectorAll("input[type=checkbox]").forEach(cb=>{
    cb.onchange=async()=>{
      const uid=cb.dataset.uid, allowed=cb.checked;
      cb.disabled=true;
      const r=allowed
        ? await authed("/rest/v1/portal_user_overrides",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:uid,system_key:"nippo_admin",allowed:true})})
        : await authed(`/rest/v1/portal_user_overrides?user_id=eq.${uid}&system_key=eq.nippo_admin`,{method:"DELETE"});
      cb.disabled=false;
      if(!r.ok){ cb.checked=!allowed; toast("保存できませんでした（"+r.status+"）"); }
    };
  });
}

    <header><div class="logo">🐔</div><h1>N-Styleグループ 統合ポータル</h1><p>統合アカウントで各システムへ</p></header>

      <button class="abtn" id="lbtn">ログイン</button>
      <div class="aerr">${esc(err||"")}</div>
      <div class="anote">日報・週報システムと同じメールアドレス＋パスワードです。<br>アカウントが無い方は本部までご連絡ください。</div>
    </div>
  </div>`;
  const go=async()=>{
    $("lbtn").disabled=true;$("lbtn").textContent="ログイン中…";

}

function navItemHtml(it,activeKey){

  const cnt=it.countKey==="posts"?(POSTS?POSTS.length:0):it.countKey==="hq"?NAV_HQ_CNT:it.countKey==="inv"?NAV_INV_CNT:0;
  return `<button class="nav-item${activeKey===it.key?" active":""}" data-key="${it.key}"><span>${it.ico}</span><span>${esc(it.label)}</span>${cnt?`<span class="count">${cnt}</span>`:""}${it.external?'<span class="ext">↗</span>':""}</button>`;
}
function sidebarHtml(u){
  const activeKey=VIEW==="home"?"home":CUR;
  const topHtml=TOP_ITEMS.filter(it=>it.type==="home"||itemVisible(it,null,u)).map(it=>navItemHtml(it,activeKey)).join("");
  const sysHtml=SYS_ITEMS.filter(it=>itemVisible(it,null,u)).map(it=>navItemHtml(it,activeKey)).join("");
  const groupsHtml=GROUPS.map(grp=>{
    const items=grp.items.filter(it=>itemVisible(it,grp,u));
    if(!items.length) return "";
    const isOpen=grp.cap===OPEN_GROUP;
    return `<div class="nav-group${isOpen?" open":""}" data-group="${esc(grp.cap)}">
      <button class="nav-group-head"><span>${grp.ico}</span><span>${esc(grp.cap)}</span><span class="chev">›</span></button>
      <div class="subnav">${items.map(it=>navItemHtml(it,activeKey)).join("")}</div>
    </div>`;
  }).join("");
  return `<aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-badge">🐔</div><div><strong>N-Styleグループ</strong><small>統合ポータル</small></div><button class="sidebar-toggle" id="sidebarCollapse" title="メニューをしまう">⟨⟨</button></div>
    ${topHtml}
    <div class="section-title">各システム</div>
    ${sysHtml}
    ${groupsHtml}
    ${u.is_master?`<div class="section-title">管理</div>
    <button class="nav-item" id="adminovr"><span>⚙️</span><span>管理項目を見せる人を設定</span></button>
    <button class="nav-item" id="permlink"><span>🔑</span><span>権限・画面設定（従来ポータル）</span></button>`:""}
    <div class="userbox">
      👤 ${esc(u.name)}${u.is_master?"（マスター）":`（${esc(ROLE_NAME[u.role]||u.role)}）`}
      <button id="tolegacy">← 従来のポータルへ</button>
      <button id="lout">ログアウト</button>
    </div>
  </aside>`;
}
function mobilebarHtml(u){
  const prefer=["keiei-dash","hqtasks","nippo-daily","expenses"];
  const picks=[];
  prefer.forEach(k=>{ if(picks.length>=3) return; const f=findItem(k); if(f&&itemVisible(f.it,f.grp,u)) picks.push(f.it); });
  const btns=[{key:"home",ico:"🏠",label:"ホーム"}].concat(picks.map(it=>({key:it.key,ico:it.ico,label:it.label.replace(/(ダッシュボード|メール|申請)$/,"")})));
  return `<div class="mobilebar" id="mobilebar">
    ${btns.map(b=>`<button data-key="${b.key}" class="${(VIEW==="home"?"home":CUR)===b.key?"active":""}">${b.ico}<br>${esc(b.label)}</button>`).join("")}
    <button id="moreBtn">•••<br>その他</button>
  </div>`;
}
function moreSheetHtml(u){
  const items=visibleLeafItems(u);
  return `<div class="mobile-more" id="mobileMore">
    <div class="mobile-more-panel">
      <div class="mobile-more-head"><b>すべての機能</b><button id="moreClose">×</button></div>
      <div class="mobile-system-grid">
        ${items.map(it=>`<button class="mobile-system-btn" data-key="${it.key}"><span class="icon">${it.ico}</span><strong>${esc(it.label)}</strong></button>`).join("")}
      </div>
    </div>
  </div>`;
}
function topActionsHtml(){
  return `<div class="top-actions" id="topactions">
    <label style="position:relative;display:block"><input class="search" id="q" type="search" placeholder="🔍 タスク・お知らせ・機能を検索"><div class="searchdrop" id="qdrop" style="display:none"></div></label>
    <span id="bellwrap">${bellHtml()}</span>
  </div>`;
}
function shellHtml(u){
  return `<div class="app${SIDEBAR_COLLAPSED?" collapsed":""}" id="app">
    <button class="collapse-tab" id="sidebarExpand" title="メニューを開く">☰</button>
    ${sidebarHtml(u)}
    <main class="main">
      <header class="topbar">
        <div><h1 id="pagetitle">おはようございます、${esc((u.name||"").replace(/(さん|様)$/,""))}さん</h1><div class="meta" id="pagemeta">N-Styleグループ / 統合ポータル</div></div>
        ${topActionsHtml()}
      </header>
      <div class="content" id="viewarea" style="flex:1;min-height:0;display:flex;flex-direction:column;padding:0"><div class="spin">読み込み中…</div></div>
    </main>
    ${mobilebarHtml(u)}
    ${moreSheetHtml(u)}
  </div>`;
}

function openItem(key,u){
  const found=findItem(key); if(!found) return;
  const {it,grp}=found;
  if(it.type==="home"){ VIEW="home"; CUR=null; CUR_IFRAME=null; CUR_IFRAME_SYSKEY=null; renderShellBody(u); return; }
  if(it.soon){ toast("準備中です"); return; }
  if(it.sso){ openJohoSso(); return; }
  if(it.legacyLink){ location.href="index.html"; return; } // F-6: 従来ポータルの権限設定タブへそのまま遷移（iframeにしない）
  if(it.externalPlain){ window.open(it.url,"_blank","noopener"); closeMobileMore(); return; } // D-5a: 独立した静的ページを新しいタブでそのまま開く（iframeにしない）
  if(grp) OPEN_GROUP=grp.cap; // クリックした項目のグループだけを開いた状態にする

  // 高速切替: 同じsysKeyのiframeが既に表示中で、対応済みシステムなら
  // iframeを作り直さずpostMessageでタブ/ページだけ切り替える
  if(it.sysKey && it.sysKey===CUR_IFRAME_SYSKEY && FAST_SWITCH_SYSKEYS.has(it.sysKey) && CUR_IFRAME){
    const paramName=SYS_TAB_PARAM[it.sysKey];
    const tabValue=paramName?new URL(it.url,location.href).searchParams.get(paramName):null;
    if(tabValue){
      try{
        CUR_IFRAME.contentWindow.postMessage({type:"nsPortalSetTab",tab:tabValue},CUR_IFRAME_ORIGIN);
        VIEW="frame"; CUR=key;
        $("pagetitle").textContent=it.label;
        closeMobileMore();
        refreshNavActive(u);
        return;
      }catch(e){ /* 失敗したら下の通常経路（作り直し）にフォールバック */ }
    }
  }

  VIEW="frame"; CUR=key;
  $("pagetitle").textContent=it.label;
  $("pagemeta").textContent=it.external?"新しいタブで開きます":"";
  const area=$("viewarea");
  if(it.type==="sysusage"){ // F-6/F-1.5: iframeではなくポータル内で直接描画するビュー
    area.style.padding="";
    area.innerHTML=`<div class="spin">読み込み中…</div>`;
    CUR_IFRAME=null; CUR_IFRAME_SYSKEY=null;
    renderSysUsageArea(u);
    closeMobileMore();
    refreshNavActive(u);
    return;
  }
  if(it.type==="homeedit"){ // F-7: ホーム画面編集（同上・ポータル内で直接描画）
    CUR_IFRAME=null; CUR_IFRAME_SYSKEY=null;
    renderHomeEditArea(u);
    closeMobileMore();
    refreshNavActive(u);
    return;
  }
  area.style.padding="0";
  area.innerHTML=`<div class="framewrap"></div>`;
  const iframeEl=document.createElement("iframe");
  iframeEl.src=it.url; iframeEl.setAttribute("allow","clipboard-write"); iframeEl.title=it.label;
  area.querySelector(".framewrap").appendChild(iframeEl);
  CUR_IFRAME=iframeEl; CUR_IFRAME_SYSKEY=it.sysKey||null;
  try{ CUR_IFRAME_ORIGIN=new URL(it.url,location.href).origin; }catch(e){ CUR_IFRAME_ORIGIN=null; }
  closeMobileMore();
  refreshNavActive(u);
}
function refreshNavActive(u){
  // サイドバー・下部ナビ・ページ全体を作り直さず、活性状態だけ更新する
  const sb=$("sidebar"); if(sb) sb.outerHTML=sidebarHtml(u);
  const mb=$("mobilebar"); if(mb) mb.outerHTML=mobilebarHtml(u);
  wireNav(u);
}
function closeMobileMore(){ $("mobileMore")?.classList.remove("open"); }

function wireNav(u){
  document.querySelectorAll("[data-key]").forEach(b=>{
    b.onclick=()=>openItem(b.dataset.key,u);
  });
  document.querySelectorAll("[data-soon]").forEach(b=>{ b.onclick=()=>toast("準備中です"); });
  document.querySelectorAll(".nav-group-head").forEach(b=>{
    b.onclick=()=>{
      const grp=b.parentElement, willOpen=!grp.classList.contains("open");
      // アコーディオン: 開くときは他のグループを全部閉じる（複数同時展開で
      // 見づらくなるのを防ぐ）。すでに開いているグループを押した時は単純に閉じる
      document.querySelectorAll(".nav-group").forEach(g=>g.classList.remove("open"));
      OPEN_GROUP=willOpen?grp.dataset.group:null;
      if(willOpen) grp.classList.add("open");
    };
  });
  const more=$("moreBtn"); if(more) more.onclick=()=>$("mobileMore")?.classList.add("open");
  const moreClose=$("moreClose"); if(moreClose) moreClose.onclick=closeMobileMore;
  const mm=$("mobileMore"); if(mm) mm.onclick=e=>{ if(e.target===mm) closeMobileMore(); };
  const adminovr=$("adminovr"); if(adminovr) adminovr.onclick=()=>openAdminOverrideModal();
  const permlink=$("permlink"); if(permlink) permlink.onclick=()=>{ location.href="index.html"; };
  const setCollapsed=v=>{
    SIDEBAR_COLLAPSED=v;
    try{ localStorage.setItem("portal_sidebar_collapsed", v?"1":"0"); }catch(e){}
    $("app").classList.toggle("collapsed",v);
  };
  const sc=$("sidebarCollapse"); if(sc) sc.onclick=()=>setCollapsed(true);
  const se=$("sidebarExpand"); if(se) se.onclick=()=>setCollapsed(false);
  const tolegacy=$("tolegacy"); if(tolegacy) tolegacy.onclick=()=>{ location.href="index.html"; };
  const lout=$("lout"); if(lout) lout.onclick=async()=>{
    if(!confirm("ログアウトしますか？"))return;
    const s=sess.get(); if(s)await api("/auth/v1/logout",{method:"POST"},s.at).catch(()=>{});
    sess.clear(); renderLogin();
  };
  wireBell();
  wireSearch(u);
}

/* ============================================================
   検索（MENU項目＋お知らせタイトルの単純一致検索）
   ============================================================ */
function searchAll(qs,u){
  const q=qs.trim().toLowerCase();
  if(!q) return "";
  const hits=[];
  visibleLeafItems(u).forEach(it=>{
    if(it.label.toLowerCase().includes(q)) hits.push(`<button type="button" data-key="${it.key}">${it.ico} ${esc(it.label)}</button>`);
  });
  (POSTS||[]).forEach(p=>{
    if((p.title+" "+(p.body||"")).toLowerCase().includes(q)) hits.push(`<button type="button" data-key="notice">📣 ${esc(p.title)}<span style="color:var(--muted);font-size:11px;margin-left:6px">お知らせ</span></button>`);
  });
  return hits.length?hits.slice(0,8).join(""):`<button type="button" disabled>該当なし — 本部までお問い合わせください</button>`;
}
function wireSearch(u){
  const box=$("q"); if(!box) return;
  const drop=$("qdrop");
  box.oninput=()=>{
    if(!box.value.trim()){ drop.style.display="none"; drop.innerHTML=""; return; }
    drop.innerHTML=searchAll(box.value,u); drop.style.display="block";
    drop.querySelectorAll("[data-key]").forEach(b=>{ b.onclick=()=>{ drop.style.display="none"; box.value=""; openItem(b.dataset.key,u); }; });
  };
}
document.addEventListener("click",e=>{
  const drop=$("qdrop");
  if(drop&&drop.style.display!=="none"&&!e.target.closest(".top-actions")) drop.style.display="none";
  if(BELL_OPEN&&!e.target.closest(".top-actions")&&ME){ BELL_OPEN=false; refreshBell(); }
});

/* ============================================================
   ホーム画面（デスクトップ=KPI+チャート+要対応+簡易クイック／
   モバイル=売上ヒーロー+KPI2x2+カテゴリ別クイックタイル）
   ============================================================ */
function quickTilesHtml(items,cls){
  return items.map(it=>`<button class="${cls}" data-key="${it.key}">${cls==="mobile-system-btn"?`<span class="icon">${it.ico}</span>`:""}<strong>${it.ico} ${esc(it.label)}</strong>${cls==="mobile-system-btn"?"":`<small></small>`}</button>`).join("");
}
function salesHeroHtml(ctx){
  const st=ctx.tori;
  if(st.status==="loading"&&!st.daily.length) return `<div class="mobile-home-summary"><small>今月の売上（全店）</small><div class="sales">取得中…</div></div>`;
  if(st.status==="error"&&!st.daily.length) return `<div class="mobile-home-summary"><small>今月の売上（全店）</small><div class="sales">—</div><div class="delta">経営Dに接続できません</div></div>`;
  const scoped=myStoreScope(ctx.u);
  if(scoped){
    const yday=new Date(Date.now()-86400000);
    const rows=st.daily.filter(r=>scoped.includes(r.store)&&sameDay(r.t,yday));
    const sum=rows.reduce((s,r)=>s+r.sales,0);
    return `<div class="mobile-home-summary"><small>自店の昨日売上</small><div class="sales">${yen(sum)}</div></div>`;
  }
  const now=new Date();
  const rows=st.daily.filter(r=>{ const d=new Date(r.t); return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()<=now.getDate(); });
  const sum=rows.reduce((s,r)=>s+r.sales,0);
  const prevRows=st.daily.filter(r=>{ const d=new Date(r.t); return d.getFullYear()===now.getFullYear()-1&&d.getMonth()===now.getMonth()&&d.getDate()<=now.getDate(); });
  const psum=prevRows.reduce((s,r)=>s+r.sales,0);
  const yoy=psum>0?Math.round((sum/psum-1)*1000)/10:null;
  return `<div class="mobile-home-summary"><small>今月の売上（全店）</small><div class="sales">${yen(sum)}</div>${yoy!=null?`<div class="delta">▲ 前年比 ${yoy>0?"+":""}${yoy}%</div>`:""}</div>`;
}
function homeQuickGroups(u){
  const keieiGrp=GROUPS.find(g=>g.cap==="経営管理");
  const keiei=keieiGrp.items.filter(it=>itemVisible(it,keieiGrp,u));
  const gyomu=[]; // 業務（現場・本部）
  ["hqtasks","invoices","nippo-daily","expenses"].forEach(k=>{ const f=findItem(k); if(f&&itemVisible(f.it,f.grp,u)) gyomu.push(f.it); });
  return {keiei,gyomu};
}
// デスクトップホームの「よく使う機能」3ボタン。権限が無い項目は飛ばして
// 次点候補を繰り上げる（例: バイトには本部タスクを見せない）
function quickActionsHtml(u){
  const candidates=[
    {key:"nippo-daily", ico:"📝", label:"日報を書く", sub:"日報・週報・シフト"},
    {key:"hqtasks", ico:"📌", label:"本部タスクを確認", sub:"今日・期限超過・工程"},
    {key:"invoices",ico:"✉️", label:"請求書メールを確認", sub:"受信・処理状況"},
    {key:"expenses",ico:"🧾", label:"経費を申請",       sub:"レシート→用途→送信"},
  ];
  const picks=candidates.filter(c=>{ const f=findItem(c.key); return f&&itemVisible(f.it,f.grp,u); }).slice(0,3);
  return picks.map(c=>`<button data-key="${c.key}"><strong>${c.ico} ${esc(c.label)}</strong><small>${esc(c.sub)}</small></button>`).join("");
}
// F-7: 単一の並び順リスト（items=[{key,size}]）をKPI行のHTML（モバイル用）と
// 4カラムグリッドのHTML（デスクトップ用）に変換する
function homeKpiHtml(items,ctx){ return items.filter(w=>w.key.indexOf("kpi_")===0).map(w=>WIDGETS[w.key]?WIDGETS[w.key].render(ctx):"").join(""); }
function homeGridHtml(items,ctx){
  return items.map(w=>{
    if(!WIDGETS[w.key]) return "";
    return `<div class="hw-${w.size||"medium"}">${WIDGETS[w.key].render(ctx)}</div>`;
  }).join("");
}
function homeGridAfter(items,ctx){ items.forEach(w=>{ if(WIDGETS[w.key]&&WIDGETS[w.key].after) WIDGETS[w.key].after(ctx); }); }

async function renderHomeArea(u){
  const area=$("viewarea"); if(!area) return;
  area.style.padding="";
  area.innerHTML=`<div class="desktop-home"><div class="spin">読み込み中…</div></div>`;
  const items=homeLayoutFor(roleKeyOf(u));
  const needsTori=items.some(w=>w.key==="kpi_sales"||w.key==="panel_chart");
  const needsChecklist=items.some(w=>w.key==="kpi_check");
  const needsReports=items.some(w=>w.key==="kpi_nippo");
  const jobs=[fetchMyStores(),fetchHqTasks()];
  if(needsChecklist) jobs.push(fetchStores(),fetchChecklistToday());
  if(needsReports) jobs.push(fetchReportsYesterday());
  await Promise.all(jobs);

  let toriState={status:"idle",daily:[],error:null};
  const draw=(alerts)=>{
    if(VIEW!=="home") return; // 読み込み中に他の画面へ移動していたら、後から来た結果で上書きしない
    const ctx={u,tori:toriState,alerts:alerts||[]};
    if(myStoreScope(u)){ /* hqNippoMineは下のジョブで別途セット */ }
    const kpiHtml=homeKpiHtml(items,ctx);
    const {keiei,gyomu}=homeQuickGroups(u);
    area.innerHTML=`
      <div class="mobile-home">
        ${salesHeroHtml(ctx)}
        <div class="mobile-kpi-row">${kpiHtml}</div>
        ${keiei.length?`<div class="mobile-section-title"><b>経営</b><span>よく使う画面</span></div><div class="mobile-system-grid">${keiei.map(it=>`<button class="mobile-system-btn" data-key="${it.key}"><span class="icon">${it.ico}</span><strong>${esc(it.label)}</strong></button>`).join("")}</div>`:""}
        ${gyomu.length?`<div class="mobile-section-title"><b>業務</b><span>現場・本部</span></div><div class="mobile-system-grid">${gyomu.map(it=>`<button class="mobile-system-btn" data-key="${it.key}"><span class="icon">${it.ico}</span><strong>${esc(it.label)}</strong></button>`).join("")}</div>`:""}
      </div>
      <div class="desktop-home">
        <div class="home-grid">${homeGridHtml(items,ctx)}</div>
        <div class="panel" style="margin-top:16px"><div class="phead"><h2>よく使う機能</h2><span class="sub2">30秒で完了する導線を優先</span></div>
          <div class="quick">
            ${quickActionsHtml(u)}
          </div>
        </div>
      </div>`;
    homeGridAfter(items,ctx);
    document.querySelectorAll("[data-key]").forEach(b=>{ if(!b.onclick) b.onclick=()=>openItem(b.dataset.key,u); });
    const gotoNotice=area.querySelector("[data-goto-notice]"); if(gotoNotice) gotoNotice.onclick=()=>openItem("notice",u);
  };
  draw([]);
  if(needsTori) toriState=await ensureToriData(false);

  let hqNippoMine=null;
  if(myStoreScope(u)){
    try{
      const yday=addDaysStr(todayStr(),-1);
      const r=await authed(`/rest/v1/reports?kind=eq.daily&report_date=eq.${yday}&author_id=eq.${u.id}&select=id`);
      hqNippoMine=r.ok&&Array.isArray(r.body)?r.body.length>0:null;
    }catch(e){ hqNippoMine=null; }
  }
  NAV_HQ_CNT=(HUB.hqTasks||[]).filter(t=>{ const cur=currentStep(t); return cur&&cur.assignee_id===u.id; }).length;
  const alerts=await buildAlerts(u);
  const showSync=u.is_master||["HQ","CEO"].includes(u.role);
  const syncRow=showSync?await fetchSyncStatus():null;
  if(VIEW!=="home") return; // 読み込み中に他の画面へ移動していたら、後から来た結果で上書きしない
  const ctxFinal={u,tori:toriState,alerts,hqNippoMine};
  const kpiHtml2=homeKpiHtml(items,ctxFinal);
  const {keiei,gyomu}=homeQuickGroups(u);
  area.innerHTML=`
    <div class="mobile-home">
      ${salesHeroHtml(ctxFinal)}
      <div class="mobile-kpi-row">${kpiHtml2}</div>
      ${keiei.length?`<div class="mobile-section-title"><b>経営</b><span>よく使う画面</span></div><div class="mobile-system-grid">${keiei.map(it=>`<button class="mobile-system-btn" data-key="${it.key}"><span class="icon">${it.ico}</span><strong>${esc(it.label)}</strong></button>`).join("")}</div>`:""}
      ${gyomu.length?`<div class="mobile-section-title"><b>業務</b><span>現場・本部</span></div><div class="mobile-system-grid">${gyomu.map(it=>`<button class="mobile-system-btn" data-key="${it.key}"><span class="icon">${it.ico}</span><strong>${esc(it.label)}</strong></button>`).join("")}</div>`:""}
    </div>
    <div class="desktop-home">
      <div class="home-grid">${homeGridHtml(items,ctxFinal)}</div>
      <div class="panel" style="margin-top:16px"><div class="phead"><h2>よく使う機能</h2><span class="sub2">30秒で完了する導線を優先</span></div>
        <div class="quick">
          ${quickActionsHtml(u)}
        </div>
      </div>
      ${showSync?syncStatusHtml(syncRow):""}
    </div>`;
  homeGridAfter(items,ctxFinal);
  document.querySelectorAll("[data-key]").forEach(b=>{ b.onclick=()=>openItem(b.dataset.key,u); });
  const gotoNotice2=area.querySelector("[data-goto-notice]"); if(gotoNotice2) gotoNotice2.onclick=()=>openItem("notice",u);

  // サイドバー・下部ナビのバッジ更新
  if(canSeeKey("invoices",u)){
    try{
      const invR=await authed(`/rest/v1/invoice_emails?mail_status=in.(unread,read)&select=id`);
      NAV_INV_CNT=(invR.ok&&Array.isArray(invR.body))?invR.body.length:0;
    }catch(e){ NAV_INV_CNT=0; }
  }
  refreshNavActive(u);
}

function renderShellBody(u){
  document.getElementById("root").innerHTML=shellHtml(u);
  wireNav(u);
  if(VIEW==="home") renderHomeArea(u);
}

/* ============================================================
   起動
   ============================================================ */
async function main(){
  if(!sess.get()){renderLogin();return}
  const u=await fetchMe();
  if(!u){sess.clear();renderLogin("セッションが切れました。もう一度ログインしてください。");return}
  if(u.is_active===false){sess.clear();renderLogin("このアカウントは無効化されています。本部までお問い合わせください。");return}
  ME=u;
  await Promise.all([fetchPerms(),fetchPosts(),fetchNotifs(),fetchHomeLayouts()]);
  VIEW="home"; CUR=null;
  renderShellBody(u);
}
main();
</script>
