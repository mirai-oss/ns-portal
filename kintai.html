<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>⏰ 勤怠の追加・修正申請 — N-Styleグループ ポータル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏰</text></svg>">
<style>
:root{--bg:#f5f4f1;--card:#fff;--ink:#26221e;--muted:#8a8377;--accent:#1f5fbf;--accent2:#184c99;--line:#e7e3dc;--ok:#2e7d32;--warn:#b58a00;--bad:#c62828;--soft:#f1f5f9}
@media(prefers-color-scheme:dark){:root{--bg:#1d1b18;--card:#282521;--ink:#f0ece5;--muted:#a29a8c;--line:#3a362f;--soft:#33302a}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 4px rgba(0,0,0,.04);margin-bottom:14px}
h1{font-size:19px}.who{font-size:13px;color:var(--muted);margin-top:2px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;font-weight:600}
.req{background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px;vertical-align:middle}
input,select,textarea{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit}
textarea{resize:vertical}
.btn{display:inline-block;padding:13px 20px;font-size:16px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:10px;cursor:pointer;width:100%;margin-top:16px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:12px;font-size:15px;font-weight:700;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--muted);cursor:pointer}
.seg button.active{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.row2{display:flex;gap:8px}.row2>div{flex:1}
.note{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.msg-err{color:var(--bad);font-size:13px;background:rgba(198,40,40,.08);border-radius:8px;padding:8px 10px;margin-top:10px}
.msg-ok{color:var(--ok);font-size:14px;background:rgba(46,125,50,.08);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.6}
.staff-list{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--card)}
.staff-list div{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.staff-list div:last-child{border-bottom:none}.staff-list div.sel{background:var(--soft);color:var(--accent);font-weight:700}
.staff-list .empty{color:var(--muted);cursor:default}
.hist{font-size:13px}.hist div{padding:7px 0;border-bottom:1px solid var(--line)}.hist div:last-child{border-bottom:none}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;margin-right:6px}
.pill.pending{background:#fdf5e0;color:var(--warn)}.pill.approved{background:#e9f6ef;color:var(--ok)}.pill.rejected{background:#fdecec;color:var(--bad)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:8px}.chk input{width:auto}
a{color:inherit}
</style>
</head>
<body>
<div class="wrap"><div id="app"><div class="card" style="text-align:center;color:var(--muted)">読み込み中…</div></div></div>
<script>
/* 認証・セッションは index.html / requests.html と同一実装（nsportal_session_v1 の形式は変更しない） */
const SUPA_URL="https://uuvsxzhpxtghojoubjcc.supabase.co";
const SUPA_KEY="sb_publishable_MrwPJAx_Ws_fdRutprKCiQ_dg3wCiTr";
const LS_KEY="nsportal_session_v1";
const FN_URL=SUPA_URL+"/functions/v1/attendance-request";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sess={get:()=>{try{return JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return null}},set:v=>localStorage.setItem(LS_KEY,JSON.stringify(v)),clear:()=>localStorage.removeItem(LS_KEY)};
async function api(path,opt={},token){
  const r=await fetch(path.startsWith("http")?path:SUPA_URL+path,{...opt,headers:{"apikey":SUPA_KEY,"Content-Type":"application/json",...(token?{"Authorization":"Bearer "+token}:{}),...(opt.headers||{})}});
  let body=null;const tx=await r.text();try{body=tx?JSON.parse(tx):null}catch(e){}
  return {ok:r.ok,status:r.status,body};
}
async function authed(path,opt={}){
  const s=sess.get();if(!s)return {ok:false,status:401,body:null};
  let r=await api(path,opt,s.at);
  if(r.status===401){if(!await refresh())return r;r=await api(path,opt,sess.get().at);}
  return r;
}
async function refresh(){
  const s=sess.get();if(!s?.rt)return false;
  const r=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.rt})});
  if(!r.ok){sess.clear();return false}
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});return true;
}
async function fetchMe(){const s=sess.get();if(!s)return null;const r=await authed(`/rest/v1/users?id=eq.${s.uid}&select=id,name,role,is_active`);return (r.ok&&r.body?.[0])||null;}

/* 状態 */
let ME=null,STORES=[],STAFF=[],KIND="fix",STORE="",USER="",Q="";
const ROLE_NAME={CEO:"社長",HQ:"本部",TEAM:"チーム長",TENCHO:"店長",SHAIN:"社員",AL:"アルバイト"};
const todayJst=()=>new Date(Date.now()+9*3600*1000).toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};

function renderLogin(){$("app").innerHTML=`<div class="card"><p style="margin-bottom:10px">ログインが必要です。ポータルからログインしてから、もう一度この画面を開いてください。</p><a class="btn" href="index.html">← ポータルへ</a></div>`;}

function render(){
  const stOpts=STORES.map(s=>`<option value="${s.id}" ${s.id===STORE?"selected":""}>${esc(s.name)}</option>`).join("");
  const q=Q.trim().toLowerCase();
  const list=STAFF.filter(u=>!q||String(u.name).toLowerCase().includes(q)||String(u.name).replace(/[\s　]/g,"").toLowerCase().includes(q.replace(/[\s　]/g,"")));
  $("app").innerHTML=`
  <div class="card"><h1>⏰ 勤怠の追加・修正申請</h1><div class="who">${esc(ME.name)}（${ROLE_NAME[ME.role]||ME.role}）・承認されるとスマレジと管理システムに反映されます</div></div>
  <div class="card">
    <label>申請の種類<span class="req">必須</span></label>
    <div class="seg"><button type="button" class="${KIND==="add"?"active":""}" onclick="setKind('add')">➕ 勤怠追加</button><button type="button" class="${KIND==="fix"?"active":""}" onclick="setKind('fix')">✏️ 勤怠修正</button></div>
    <div class="note">${KIND==="add"?"打刻が無かった日の勤務を新しく登録します。":"すでにある勤務の出勤・退勤・休憩を直します。"}</div>
    <label>店舗<span class="req">必須</span></label>
    <select id="store" onchange="setStore(this.value)"><option value="">選んでください</option>${stOpts}</select>
    <label>従業員<span class="req">必須</span></label>
    <input id="q" type="search" placeholder="名前で絞り込み（ひらがな・漢字どちらでも）" value="${esc(Q)}" oninput="setQ(this.value)" ${STORE?"":"disabled"}>
    <div class="staff-list">${!STORE?`<div class="empty">先に店舗を選んでください</div>`:STAFF.length===0?`<div class="empty">読み込み中…または所属者がいません</div>`:list.length===0?`<div class="empty">該当なし</div>`:list.map(u=>`<div class="${u.id===USER?"sel":""}" onclick="setUser('${u.id}')">${esc(u.name)} <span style="color:var(--muted);font-size:12px">${ROLE_NAME[u.role]||u.role||""}</span></div>`).join("")}</div>
    <label>勤務日<span class="req">必須</span></label>
    <input id="date" type="date" max="${todayJst()}" value="${$("date")?.value||addDays(todayJst(),-1)}">
    <div class="row2">
      <div><label>出勤時刻<span class="req">必須</span></label><input id="cin" type="time" value="${$("cin")?.value||"17:00"}"></div>
      <div><label>退勤時刻<span class="req">必須</span></label><input id="cout" type="time" value="${$("cout")?.value||"23:00"}"></div>
    </div>
    <div class="note">退勤が出勤より早い時刻なら翌日の退勤として扱います（例: 18:00 → 翌 02:00）。</div>
    <label>休憩1（任意）</label>
    <div class="row2"><div><input id="b1s" type="time" value="${$("b1s")?.value||""}"></div><div><input id="b1e" type="time" value="${$("b1e")?.value||""}"></div></div>
    <label>休憩2（任意）</label>
    <div class="row2"><div><input id="b2s" type="time" value="${$("b2s")?.value||""}"></div><div><input id="b2e" type="time" value="${$("b2e")?.value||""}"></div></div>
    <div class="note">休憩は開始と終了をセットで。無ければ空のままで OK（休憩なしとして申請）。</div>
    <label>理由<span class="req">必須</span></label>
    <textarea id="reason" rows="2" placeholder="例: 退勤の打刻忘れ">${esc($("reason")?.value||"")}</textarea>
    <button class="btn" id="submit" onclick="submit()">承認を依頼する</button>
    <div id="msg"></div>
  </div>
  <div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:6px">最近の申請</div><div class="hist" id="hist">読み込み中…</div></div>`;
  loadHist();
}
function setKind(k){KIND=k;render();}
async function setStore(id){STORE=id;USER="";STAFF=[];Q="";render();if(!id)return;
  const r=await authed(FN_URL,{method:"POST",body:JSON.stringify({op:"staff",store_id:id})});
  STAFF=(r.ok&&r.body?.staff)||[];render();}
function setQ(v){Q=v;const q=v.trim().toLowerCase();const el=document.querySelector(".staff-list");if(!el)return;
  const list=STAFF.filter(u=>!q||String(u.name).toLowerCase().includes(q)||String(u.name).replace(/[\s　]/g,"").toLowerCase().includes(q.replace(/[\s　]/g,"")));
  el.innerHTML=list.length?list.map(u=>`<div class="${u.id===USER?"sel":""}" onclick="setUser('${u.id}')">${esc(u.name)} <span style="color:var(--muted);font-size:12px">${ROLE_NAME[u.role]||u.role||""}</span></div>`).join(""):`<div class="empty">該当なし</div>`;}
function setUser(id){USER=id;document.querySelectorAll(".staff-list div").forEach(d=>d.classList.toggle("sel",d.getAttribute("onclick")===`setUser('${id}')`));}

/* 時刻 → "YYYY-MM-DDTHH:MM"（JST）。退勤・休憩は出勤より前の時刻なら翌日 */
function dt(date,hm,baseHm){if(!hm)return null;const nextDay=baseHm&&hm<baseHm;return `${nextDay?addDays(date,1):date}T${hm}`;}
async function submit(){
  const date=$("date").value,cin=$("cin").value,cout=$("cout").value,reason=$("reason").value.trim();
  const msg=$("msg");msg.innerHTML="";
  if(!STORE||!USER||!date||!cin||!cout||!reason){msg.innerHTML=`<div class="msg-err">店舗・従業員・勤務日・出勤・退勤・理由を入れてください</div>`;return;}
  const b1s=$("b1s").value,b1e=$("b1e").value,b2s=$("b2s").value,b2e=$("b2e").value;
  if((!!b1s)!==(!!b1e)||(!!b2s)!==(!!b2e)){msg.innerHTML=`<div class="msg-err">休憩は開始と終了の両方を入れてください</div>`;return;}
  const body={op:"submit",kind:KIND,store_id:STORE,user_id:USER,work_date:date,
    clock_in:dt(date,cin),clock_out:dt(date,cout,cin),
    break_start_1:dt(date,b1s,cin),break_end_1:dt(date,b1e,cin),break_start_2:dt(date,b2s,cin),break_end_2:dt(date,b2e,cin),reason};
  $("submit").disabled=true;$("submit").textContent="送信中…";
  const r=await authed(FN_URL,{method:"POST",body:JSON.stringify(body)});
  $("submit").disabled=false;$("submit").textContent="承認を依頼する";
  if(!r.ok||!r.body?.ok){msg.innerHTML=`<div class="msg-err">${esc(r.body?.error||("送信に失敗しました（HTTP "+r.status+"）"))}</div>`;return;}
  msg.innerHTML=`<div class="msg-ok">✅ 申請しました。マスターの承認後にスマレジと管理システムへ反映されます。<br>${esc(r.body.summary)}</div>`;
  $("reason").value="";loadHist();
}
async function loadHist(){
  const r=await authed(`/rest/v1/sf_attendance_requests?select=kind,work_date,status,reason,requested_at,smaregi_sync_status,users!sf_attendance_requests_user_id_fkey(name),stores(name)&order=requested_at.desc&limit=10`);
  const el=$("hist");if(!el)return;
  if(!r.ok||!Array.isArray(r.body)||!r.body.length){el.innerHTML=`<div style="color:var(--muted)">まだありません</div>`;return;}
  const lab={pending:"承認待ち",approved:"承認",rejected:"却下",cancelled:"取消"};
  el.innerHTML=r.body.map(x=>`<div><span class="pill ${x.status}">${lab[x.status]||x.status}</span>${x.kind==="add"?"追加":"修正"}　${esc(x.work_date)}　${esc(x.stores?.name||"")}　${esc(x.users?.name||"")}${x.status==="approved"?(x.smaregi_sync_status==="synced"?"　<span style='color:var(--ok)'>スマレジ反映済</span>":x.smaregi_sync_status==="failed"?"　<span style='color:var(--bad)'>スマレジ失敗</span>":""):""}</div>`).join("");
}
async function main(){
  if(!sess.get()){renderLogin();return}
  ME=await fetchMe();if(!ME||ME.is_active===false){sess.clear();renderLogin();return}
  const r=await authed(`/rest/v1/stores?select=id,name,sort_order&is_active=eq.true&order=sort_order.asc.nullslast,name.asc`);
  STORES=(r.ok&&Array.isArray(r.body)?r.body:[]).filter(s=>s.name!=="本部");
  const p=new URLSearchParams(location.search);if(p.get("kind")==="add")KIND="add";
  render();
}
main();
</script>
</body>
</html>
