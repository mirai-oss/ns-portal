          ${progressHtml("請求書取込",totalCount,totalCount)}
          ${progressHtml("内容確認",reviewDoneCount,totalCount)}
          ${progressHtml("会計処理",accountingDoneCount,totalCount)}
          ${progressHtml("振込処理",paymentDoneCount,paymentTargetRows.length)}
        </div>
        <div class="card" style="padding:18px">
          <div class="dash-section-title">④ 今月の支払状況・⑤ 支払予定</div>
          <div class="dash-money-grid">
            <div class="dash-money-item"><span class="dash-m-label">今月請求総額</span><span class="dash-m-val">${yen(totalAmount)}</span></div>
            <div class="dash-money-item"><span class="dash-m-label">支払済</span><span class="dash-m-val">${yen(paidAmount)}</span></div>

          <div>

              <div class="dash-schedule-row${alert&&list.length?" alert":""}" data-dash-sched="${key}">
                <span>${esc(label)}（${list.length}件）</span><span>${yen(list.reduce((s,r)=>s+(Number(r.amount)||0),0))}</span>
              </div>`).join("")}
          </div>
        </div>

      ${reasonRows.length?`<div class="dash-section-title">⑥ 要対応の内訳（クリックで絞り込み）</div>
      <div class="dash-reason-grid">
        ${reasonRows.map(([key,count])=>`<div class="dash-reason-card" data-dash-goto="${key}">${esc(REASON_FILTER_LABELS[key]||key)} <span class="dash-reason-badge">${count}件</span></div>`).join("")}

          <tbody>${recent.length?recent.map(r=>{
            const src=INTAKE_SOURCE_LABEL[r.intake_source]||(r.email_id?"メール":"手動");

            const statusLabel=reasons.length?`要対応：${esc(REASON_FILTER_LABELS[reasons[0]]||reasons[0])}`:unifiedStageOf(r);
            return `<tr>
              <td>${fmtDT(r.updated_at||r.created_at)}</td>
              <td><span class="invoice-status gray">${esc(src)}</span></td>
              <td>${esc((r.vendor&&r.vendor.name)||r.vendor_name||"—")}</td>

  $("dash-corp").onchange=()=>{ DASH_STATE.corpId=$("dash-corp").value; dashRenderBody(u); };
  $("dash-ym").onchange=()=>{ DASH_STATE.yearMonth=$("dash-ym").value; dashRenderBody(u); };
  if($("dash-go-all")) $("dash-go-all").onclick=()=>openUnifiedFiltered(u,{subTab:"all"});
  document.querySelectorAll("[data-dash-open]").forEach(el=>el.onclick=()=>openInvoiceDetail(u,el.dataset.dashOpen));
  document.querySelectorAll("[data-dash-sched]").forEach(el=>el.onclick=()=>{
    // 支払予定の各区分は「振込待ち（会計登録済み・未払い）」の絞り込みへ飛ばす（区分自体の
    // 絞り込みキーは🧾請求書一覧に無いため、一番近い既存フィルタ=payment待ちタブへ誘導する）
    openUnifiedFiltered(u,{subTab:"payment"});
  });
  document.querySelectorAll("[data-dash-goto]").forEach(el=>el.onclick=()=>{
    const key=el.dataset.dashGoto;
    if(key==="__review") return openUnifiedFiltered(u,{subTab:"review"});
    if(key==="__accounting") return openUnifiedFiltered(u,{subTab:"accounting"});
    if(key==="__payment") return openUnifiedFiltered(u,{subTab:"payment"});
    openUnifiedFiltered(u,{subTab:"review",reasonFilter:key});
  });
}

function uploadFileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{ const s=String(reader.result||""); resolve(s.substring(s.indexOf(",")+1)); };
    reader.onerror=()=>reject(new Error("ファイルの読み込みに失敗しました"));
    reader.readAsDataURL(file);
  });
}
function wireUploadInvoiceTab(u){
  const drop=$("up-drop");

    $("up-filelist").innerHTML=UPLOAD_STATE.files.length
      ? UPLOAD_STATE.files.map((f,i)=>`<div>📎 ${esc(f.name)} <button data-rmfile="${i}" style="margin-left:6px;font-size:11px">✕ 外す</button></div>`).join("")

  };
  const addFiles=(fileList)=>{ for(const f of fileList) UPLOAD_STATE.files.push(f); renderFileList(); };
  $("up-file").onchange=e=>addFiles(e.target.files);
  ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background="var(--m-bg,#f4f1eb)"; drop.style.borderColor="var(--accent)"; }));
  ["dragleave","dragend"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background=""; drop.style.borderColor=""; }));
  drop.addEventListener("drop",e=>{
    e.preventDefault(); drop.style.background=""; drop.style.borderColor="";

  });

// payroll-pdfsバケット内に{userId}/{yearMonth}.pdfが存在するか（一覧表示用の軽い存在確認）
async function payrollCheckPdfExists(userId,yearMonth){
  const s=sess.get();
  const r=await fetch(`${SUPA_URL}/storage/v1/object/list/payroll-pdfs`,{
    method:"POST",
    headers:{apikey:SUPA_KEY,Authorization:"Bearer "+(s?s.at:""),"Content-Type":"application/json"},

  });
  if(!r.ok) return false;

  return Array.isArray(list)&&list.some(x=>x.name===`${yearMonth}.pdf`);
}
// payroll-pdfsから実際のPDFをbase64で取得（登録直前の証憑添付用。無ければnull）
async function payrollFetchPdfBase64(userId,yearMonth){
  const s=sess.get();
  const r=await fetch(`${SUPA_URL}/storage/v1/object/payroll-pdfs/${userId}/${yearMonth}.pdf`,{
    headers:{apikey:SUPA_KEY,Authorization:"Bearer "+(s?s.at:"")},
  });
  if(!r.ok) return null;
  const buf=await r.arrayBuffer();
  const bytes=new Uint8Array(buf);
  let binary=""; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  return btoa(binary);
}
// base64のPDFデータをその場で開ける一時URL（Blob URL）に変換する（2026-09-02追加。
// ユーザー要望「PDFをここから開けるように・プレビューでも内容を見れるように」に対応。
// 署名付きURLを毎回サーバーへ取りに行く必要がなく、既に取得済みのbase64データをそのまま使い回せる）
function base64ToBytes(base64){
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}
function payrollPdfBlobUrl(base64){
  return URL.createObjectURL(new Blob([base64ToBytes(base64)],{type:"application/pdf"}));
}

// PDFファイル名から従業員を推定（氏名の空白除去・部分一致。完全な自動判定はせず、必ず人が確認・修正できる形で使う）

// と推定されない」に対応し2段階に強化）。①区切り文字（半角/全角スペースに加えハイフン・アンダー
// スコア・中黒・ドットも除去）を取り除いた上での部分一致②それでも見つからなければ、氏名を姓・名に
// 分割し、それぞれの部分が（区切り文字の有無を問わず）ファイル名に全部含まれていれば一致とみなす
// （姓名の間に別の文字が挟まっている・順序が姓名逆等のケースに対応）
function payrollGuessEmployeeByFilename(filename){
  const stripSep=s=>String(s||"").replace(/[\s　\-_・.]/g,"");
  const n=stripSep(filename);
  let hit=(PAYROLL_STATE.rows||[]).find(r=>{
    const name=stripSep(r.user&&r.user.name);
    return name&&n.includes(name);
  });
  if(hit) return hit;
  hit=(PAYROLL_STATE.rows||[]).find(r=>{
    const parts=String((r.user&&r.user.name)||"").split(/[\s　]+/).filter(Boolean).map(stripSep).filter(Boolean);
    return parts.length>=2&&parts.every(p=>n.includes(p));
  });
  return hit||null;
}
function payrollAssignmentFor(userId){ return PAYROLL_STATE.assignments.find(a=>a.user_id===userId); }

function payrollFindDeptForUser(userId){
  const alloc=(PAYROLL_STATE.allocations||[]).find(a=>a.user_id===userId&&a.store_id);
  if(!alloc) return null;
  const store=PAYROLL_STATE.stores.find(s=>s.id===alloc.store_id);
  if(!store) return null;
  const norm=s=>String(s||"").replace(/\s+/g,"");
  const n=norm(store.name);
  const dept=PAYROLL_STATE.departments.find(d=>norm(d.name)===n) || PAYROLL_STATE.departments.find(d=>n.includes(norm(d.name))||norm(d.name).includes(n));
  return dept||null;
}
// テンプレートの各行に「給与仕訳での用途」タグが付いていれば、その行の金額を実際の給与データへ
// 差し替える（付いていなければテンプレートの固定金額のまま＝0円の行は除外）
// 2026-08-31: テンプレートの行が借方・貸方どちらか片方だけでもよくなったため、金額もそれぞれ独立して
// 実データに置き換える（用途タグが付いた側だけを置き換え、付いていない側は元の固定値のまま）
function payrollComputeBranches(row,template){
  const dept=payrollFindDeptForUser(row.user_id);
  const amountFor=purpose=>{
    if(purpose==="base_salary") return Math.round(Number(row.fixed_salary_amount)||0);
    if(purpose==="commute") return Math.round(Number(row.commute_allowance)||0);
    if(purpose==="deduction") return Math.round(Number(row.deduction_total)||0);
    if(purpose==="net_pay") return Math.round(Number(row.net_pay)||0);
    return null;
  };
  return (template.branches||[]).map(b=>{
    const overridden=amountFor(b.purpose);
    const useDept=(b.purpose==="base_salary"||b.purpose==="commute")&&dept?dept.id:(b.department_id||null);
    const debitAmount=b.debit?(overridden!=null?overridden:(b.debit.value??b.amount??0)):null;
    const creditAmount=b.credit?(overridden!=null?overridden:(b.credit.value??b.amount??0)):null;
    return {debit:b.debit||null,credit:b.credit||null,debitAmount,creditAmount,department_id:useDept,tax_id:b.tax_id||null,credit_department_id:b.credit_department_id||null,credit_tax_id:b.credit_tax_id||null,purpose:b.purpose||null,remark:b.remark||null};
  }).filter(b=>(b.debit&&b.debitAmount>0)||(b.credit&&b.creditAmount>0));
}
function payrollBankFor(userId){ return (PAYROLL_STATE.bankAccounts||[]).find(b=>b.user_id===userId); }
// 一覧の並び替え・絞り込み（2026-09-01: ユーザー要望「振込済みが1番下に行くように・絞れるように」）
// 2026-09-02: この月は対象外にした人（sf_payroll_hidden・担当Bからの依頼②）は一覧から常に除外し、
// 検索キーワード（氏名の部分一致・依頼③）も同時にここで反映する
function payrollSortedRows(){
  let rows=[...(PAYROLL_STATE.rows||[])];
  const hidden=PAYROLL_STATE.hiddenUserIds||new Set();
  rows=rows.filter(r=>!hidden.has(r.user_id));
  const q=(PAYROLL_STATE.searchQuery||"").trim();
  if(q) rows=rows.filter(r=>((r.user&&r.user.name)||"").includes(q));
  if(PAYROLL_STATE.hidePaid){
    rows=rows.filter(r=>{ const rec=payrollRecordFor(r.user_id); return !(rec&&rec.paid_at); });
  }
  if(PAYROLL_STATE.sortMode!=="default"){
    const isPaid=r=>{ const rec=payrollRecordFor(r.user_id); return rec&&rec.paid_at?1:0; };
    rows=rows.map((r,i)=>({r,i})).sort((a,b)=>(isPaid(a.r)-isPaid(b.r))||(a.i-b.i)).map(x=>x.r); // 振込完了だけ末尾へ（安定ソート）
  }
  return rows;
}

  // 今月は支払い不要と分かっている場合に使う想定のため状態を問わず出す）

// 2026-09-04全面書き換え：ユーザー提供モックアップ（給与振込 完成版UIモック）準拠のUIへ刷新。
// 見た目・文字サイズ・表現をモックアップに合わせつつ、データはすべて既存のPAYROLL_STATE
// （sf_payroll_sync・payroll_journal_records・payroll_journal_assignments・
// payroll_bank_accounts等）から算出する（新しい別データ構造は作っていない）。
// 【正直な簡略化】モックアップの「給与状態（給与未確定）」「口座変更確認」「支払確認」
// 「CSV作成履歴」「法人/事業所列」に対応する実データはこのアプリに存在しないため、
// 前者3つは常に0名（該当なし）、支払確認は振込完了と同じ扱い、CSV履歴・法人/事業所列は
// 今回表示していない（正直に省略。実装完了報告に記載）
function payrollAlertCounts(rows){
  const bankMissing=rows.filter(r=>!payrollBankFor(r.user_id)).length;
  const patternMissing=rows.filter(r=>{
    const asg=payrollAssignmentFor(r.user_id), rec=payrollRecordFor(r.user_id);
    return !rec&&!(asg&&asg.template_id);
  }).length;
  return {bankMissing,patternMissing};
}
function payrollKpiCounts(rows){
  const registered=rows.filter(r=>payrollRecordFor(r.user_id));
  const paid=registered.filter(r=>{const rec=payrollRecordFor(r.user_id);return rec&&rec.paid_at;});
  const cash=rows.filter(r=>{const b=payrollBankFor(r.user_id);return b&&b.payment_method==="cash";});
  const sum=list=>list.reduce((s,r)=>s+(Number(r.net_pay)||0),0);
  return {
    total:{n:rows.length,amt:sum(rows)},
    prep:{n:rows.length-registered.length,amt:sum(rows.filter(r=>!payrollRecordFor(r.user_id)))},
    registered:{n:registered.length-paid.length,amt:sum(registered.filter(r=>{const rec=payrollRecordFor(r.user_id);return!rec.paid_at;}))},
    paid:{n:paid.length,amt:sum(paid)},
    cash:{n:cash.length,amt:sum(cash)},
  };
}
function payrollStatusPill(r){
  const rec=payrollRecordFor(r.user_id), asg=payrollAssignmentFor(r.user_id), draft=payrollDraftFor(r.user_id);
  if(rec&&rec.paid_at) return '<span class="pr-status ok">✓ 振込済</span>';
  if(rec) return '<span class="pr-status wait">● 仕訳登録済み・振込待ち</span>';
  if(draft) return '<span class="pr-status warn">📝下書き保存中</span>';
  if(asg&&asg.template_id) return '<span class="pr-status wait">● パターン設定済み・未登録</span>';
  return '<span class="pr-status na">－ パターン未設定</span>';
}
function payrollBankPill(r){
  const b=payrollBankFor(r.user_id);
  if(!b) return '<span class="pr-status err">！口座未登録</span>';
  if(b.payment_method==="cash") return '<span class="pr-status na">－ 現金（口座不要）</span>';
  return '<span class="pr-status ok">✓ 口座登録済</span>';
}
function payrollMatchesQuick(r,q){
  const rec=payrollRecordFor(r.user_id), b=payrollBankFor(r.user_id);
  if(q==="all") return true;
  if(q==="attention") return !b || !(payrollAssignmentFor(r.user_id)&&payrollAssignmentFor(r.user_id).template_id) && !rec;
  if(q==="prep-wait") return !rec;
  if(q==="registered") return rec&&!rec.paid_at;
  if(q==="paid") return rec&&rec.paid_at;
  if(q==="cash") return b&&b.payment_method==="cash";
  return true;
}

      lines.push([r.user&&r.user.name,r.fixed_salary_amount,r.commute_allowance,r.deduction_total,r.net_pay,bankText(r),statusText(r)].map(esc2).join(","));
    });
    const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`給与仕訳一覧_${PAYROLL_STATE.yearMonth}.csv`; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  wirePayrollRowActions();
  $("payroll-csv-export").onclick=payrollExportCsv;
  $("payroll-pdf-match").onclick=()=>{
    const files=Array.from($("payroll-pdf-files").files||[]);
    if(!files.length){ alert("PDFファイルを選択してください"); return; }
    PAYROLL_STATE.pdfMatches=files.map(f=>{
      const guess=payrollGuessEmployeeByFilename(f.name);
      return {file:f, userId:guess?guess.user_id:""};
    });
    payrollRenderPdfMatchArea();
  };
}

async function payrollUploadPdfs(){
  const msg=$("payroll-pdf-msg"); msg.className="err"; msg.textContent="アップロード中…";
  $("payroll-pdf-upload").disabled=true;
  const matches=(PAYROLL_STATE.pdfMatches||[]).filter(m=>m.userId);
  if(!matches.length){ msg.textContent="対応付けられたファイルがありません（従業員を選んでください）"; $("payroll-pdf-upload").disabled=false; return; }
  const s=sess.get();
  let okCount=0; const fail=[];
  for(const m of matches){
    const path=`${m.userId}/${PAYROLL_STATE.yearMonth}.pdf`;
    const buf=await m.file.arrayBuffer();
    const r=await fetch(`${SUPA_URL}/storage/v1/object/payroll-pdfs/${path}`,{
      method:"POST",
      headers:{apikey:SUPA_KEY,Authorization:"Bearer "+(s?s.at:""),"Content-Type":"application/pdf","x-upsert":"true"},
      body:buf,
    });
    if(r.ok) okCount++; else fail.push(m.file.name);
  }
  msg.className=fail.length?"err":"err msg-ok";
  msg.textContent=`アップロード完了: ${okCount}件成功`+(fail.length?`／失敗: ${fail.join("、")}`:"")+"。一覧を更新します…";
  $("payroll-pdf-upload").disabled=false;
  setTimeout(async()=>{ await payrollLoad(); payrollRender(); },900);
}

// 2026-09-04追加：全角カタカナ→半角カタカナの変換テーブル。
// 「振込依頼人名を入力して下さい」エラーが依頼人名を入力しても解消しなかった件を調査したところ、
// 従来のpaypayCleanKanaは全角カタカナを一切変換していなかったことが判明（濁点・半濁点を含む
// 全角カタカナはtoShiftJisBytesの対象範囲(半角カナ0xFF61-0xFF9F)に入らず、"?"に置換されて
// しまい、PayPay銀行側からは実質空欄と同じ扱いになっていたと考えられる）。ユーザーが
// 「口座に載っているカタカナをそのままコピーした」場合、多くの銀行画面は全角カタカナで
// 表示するため、これが今回のエラーの直接原因である可能性が高い。
function buildZenkakuToHankakuKanaMap(){
  const FULL="ヲァィゥェォャュョッアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン";
  const HALF="ｦｧｨｩｪｫｬｭｮｯｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
  const DAK_FULL="ガギグゲゴザジズゼゾダヂヅデドバビブベボヴ"; // 濁点つき
  const DAK_BASE="カキクケコサシスセソタチツテトハヒフヘホウ"; // ↑の清音（濁点なし）版
  const HDAK_FULL="パピプペポ"; // 半濁点つき
  const HDAK_BASE="ハヒフヘホ";
  const baseMap={};
  for(let i=0;i<FULL.length;i++) baseMap[FULL[i]]=HALF[i];
  const map={};
  for(let i=0;i<FULL.length;i++) map[FULL[i]]=HALF[i];
  for(let i=0;i<DAK_FULL.length;i++) map[DAK_FULL[i]]=baseMap[DAK_BASE[i]]+"ﾞ"; // 例:ガ→ｶﾞ（2文字）
  for(let i=0;i<HDAK_FULL.length;i++) map[HDAK_FULL[i]]=baseMap[HDAK_BASE[i]]+"ﾟ"; // 例:パ→ﾊﾟ（2文字）
  return map;
}
const ZENKAKU_KANA_MAP=buildZenkakuToHankakuKanaMap();
function zenkakuToHankaku(str){
  let out="";
  for(const ch of String(str)){
    if(ZENKAKU_KANA_MAP[ch]!==undefined){ out+=ZENKAKU_KANA_MAP[ch]; continue; }
    const cp=ch.codePointAt(0);
    if(cp===0x3000){ out+=" "; continue; } // 全角スペース→半角スペース
    if(cp>=0xFF01&&cp<=0xFF5E){ out+=String.fromCodePoint(cp-0xFEE0); continue; } // 全角英数記号→半角(例:Ａ→A,１→1,－→-)
    out+=ch;
  }
  return out;
}
// PayPay銀行が受け付ける文字（半角英数字・半角カタカナ・ハイフン/ピリオド/スペース等）だけに
// なっているかを判定する。これに合わないと「入力して下さい」エラーの原因になりうるため、
// paypayRemitterNameで入力時に警告できるようにしてある
const PAYPAY_SAFE_CHARS_RE=/^[\x20-\x7E｡-ﾟ]*$/;
function paypayHasUnsafeChars(cleaned){
  return !PAYPAY_SAFE_CHARS_RE.test(cleaned);
}
// PayPay銀行「使用許容文字」ルールの自動変換（全角カナ→半角カナ・長音→ハイフン・中黒→ピリオド・
// 小文字カナ→大文字化）。それ以外の使用不可文字（漢字・ひらがな・&や!等）はそのまま残すため、
// 出力前に一覧で確認できるようにしてある
function paypayCleanKana(s){
  let t=zenkakuToHankaku(String(s||""));
  t=t.toUpperCase();
  t=t.replace(/[ーｰ]/g,"-").replace(/[･・]/g,".");
  const smallMap={"ｧ":"ｱ","ｨ":"ｲ","ｩ":"ｳ","ｪ":"ｴ","ｫ":"ｵ","ｯ":"ﾂ","ｬ":"ﾔ","ｭ":"ﾕ","ｮ":"ﾖ"};
  t=t.replace(/[ｧｨｩｪｫｯｬｭｮ]/g,c=>smallMap[c]||c);
  return t;
}
// 2026-09-04緊急修正：PayPay銀行アップロード時「受取人名を正しく入力して下さい」
// 「振込依頼人名を入力して下さい」が全件（78件）で発生した不具合の原因調査・対応。
// DBのaccount_holder_kanaを直接確認したところ、半角カタカナで正しく保存されていた
// （例:"ﾀﾏﾝﾚｽﾏｶﾗ"）ため、データの中身（全角/半角の間違い）が原因ではないと判明。
// PayPay銀行のWEB総振アップロードは、日本の銀行系CSVで一般的なShift-JISエンコーディングを
// 前提にしていると推測されるが、これまでBlobをUTF-8で作成していたため、半角カタカナ
// （UTF-8では3バイトの文字）がShift-JIS前提でバイト単位に誤読され、受取人名が壊れ、
// その影響で行内の項目区切りまでずれて末尾の振込依頼人名欄の扱いにも影響していたと考えられる。
// このアプリで実際に使う文字は「数字・半角英字・半角カタカナ・ハイフン/ピリオド」に
// 限定されており（paypayCleanKana側で変換済み）、この範囲はJIS X0201とASCIIの範囲へ
// 単純に1対1対応できるため、外部ライブラリ無しでShift-JISへ変換して出力するようにした
function toShiftJisBytes(str){
  const bytes=[];
  for(const ch of String(str)){
    const cp=ch.codePointAt(0);
    if(cp===0x00A5){ bytes.push(0x5C); } // ¥（円記号）→JIS X0201では0x5C
    else if(cp<=0x7F){ bytes.push(cp); } // ASCII（数字・英字・カンマ・CR/LF等）
    else if(cp>=0xFF61&&cp<=0xFF9F){ bytes.push(cp-0xFF61+0xA1); } // 半角カタカナ（1対1対応）
    else{ bytes.push(0x3F); } // 想定外の文字（全角等）は?に置き換える（本来ここに来ないはず）
  }
  return new Uint8Array(bytes);
}
// PayPay銀行フォーマットのCSV文字列を、正しくShift-JISでエンコードしたBlobに変換する
function paypayCsvToBlob(csvString){
  return new Blob([toShiftJisBytes(csvString)],{type:"text/csv"});
}
// 2026-09-04追加：振込依頼人名（データレコード8項目め）。フォーマット仕様書PDFには「任意・
// 省略時はPayPay銀行アップロード画面側で一律指定する運用」と書かれていたが、実際にユーザーが
// アップロードしたところ全件「振込依頼人名を入力して下さい」となったため、実際のPayPay銀行の
// 挙動としては必須である前提に変更し、各行へ同じ依頼人名を入れるようにした。前回入力した内容を
// ブラウザに記憶しておき、次回から手間なく使えるようにする
function paypayRemitterName(){
  let saved=localStorage.getItem("ns_paypay_remitter_name")||"";
  for(let attempt=0;attempt<5;attempt++){
    const input=prompt("振込依頼人名（半角カタカナ・振込元の名義）を入力してください。\n例：ユウゲンガイシヤト-ホ-エ-ジエンシ-\n\n全角カタカナで入力・貼り付けしても自動で半角に変換されます。\n一度入力すると次回から自動で入力された状態になります（変更したい場合はここで書き換えてください）。",saved);
    if(input===null) return null; // キャンセル
    const cleaned=paypayCleanKana(input.trim());
    // 2026-09-04追加：全角カナ変換後もPayPay銀行が受け付けない文字（漢字・ひらがな等）が
    // 残っていると「振込依頼人名を入力して下さい」エラーが再発するため、ここで検知して
    // 入力し直してもらう（無言で"?"に化けて分からなくなる事態を防ぐ）
    if(cleaned && paypayHasUnsafeChars(cleaned)){
      alert("「"+cleaned+"」には半角カタカナ・半角英数字以外の文字（漢字・ひらがな等）が含まれています。\nお手数ですが、口座名義に使われているカタカナ部分だけを半角または全角カタカナで入力し直してください。");
      saved=cleaned; // 直せるように直前の入力を次回のプロンプトへ引き継ぐ
      continue;
    }
    if(cleaned) localStorage.setItem("ns_paypay_remitter_name",cleaned);
    return cleaned;
  }
  return null;
}
// PayPay銀行指定フォーマット（CSV）どおりに振込データを組み立てる共通ヘルパー（2026-09-03・
// 会計・請求書処理の全面刷新でrenderTransfersTab（一般の取引先向け振込一覧）からも使うため、
// 元payrollExportCsv内にあった整形ロジック部分だけを切り出した。
// rows: [{bankCode,branchCode,accountType,accountNumber,holderKana,amount}]
// remitterName: 振込依頼人名（半角カナ・2026-09-04追加。未指定なら従来どおり空欄のまま）
function buildPaypayCsv(rows,remitterName){
  const remitter=remitterName?paypayCleanKana(remitterName):"";
  const dataLines=[]; let total=0, count=0;
  for(const r of rows){
    const amount=Math.round(Number(r.amount)||0);
    if(!amount||amount<=0) continue;
    dataLines.push(["1", r.bankCode, r.branchCode, r.accountType, r.accountNumber, paypayCleanKana(r.holderKana), String(amount), remitter].join(","));
    total+=amount; count++;
  }
  const trailer=["2","","","","",String(count),String(total),""].join(",");
  return [...dataLines, trailer].join("\r\n")+"\r\n";
}
// PayPay銀行指定フォーマット（CSV）どおりに振込データを組み立てて出力する。
// 実フォーマットはdocs/フォーマット登録_PayPay銀行WEB総振_2026-08-31.md参照（公式PDFから取得済み）。
// 振込の実行はしない＝生成したCSVをダウンロードするだけ（人が確認してPayPay銀行の画面で実行する）
function payrollExportCsv(){
  const msg=$("payroll-csv-msg"); msg.className="err"; msg.textContent="";
  const skipped=[];
  const csvRows=[];
  const hidden=PAYROLL_STATE.hiddenUserIds||new Set();
  for(const row of PAYROLL_STATE.rows){
    const name=(row.user&&row.user.name)||row.user_id;
    if(hidden.has(row.user_id)) continue; // この月は対象外にした人は振込CSVにも含めない（2026-09-02）
    const amount=Math.round(Number(row.net_pay)||0);
    if(!amount||amount<=0){ skipped.push(`${name}（差引支給額が0円）`); continue; }
    const bank=payrollBankFor(row.user_id);
    if(!bank){ skipped.push(`${name}（支払方法が未登録）`); continue; }
    if(bank.payment_method==="cash"){ skipped.push(`${name}（現金手渡し・CSV対象外）`); continue; }
    csvRows.push({bankCode:bank.bank_code, branchCode:bank.branch_code, accountType:bank.account_type, accountNumber:bank.account_number, holderKana:bank.account_holder_kana, amount});
  }
  const count=csvRows.length, total=csvRows.reduce((s,r)=>s+Math.round(Number(r.amount)||0),0);
  if(!count){ msg.textContent="出力できる従業員がいません（振込先口座の登録状況を確認してください）"; return; }
  const remitterName=paypayRemitterName(); // 2026-09-04追加：PayPay銀行が振込依頼人名を必須としていたため確認する
  if(remitterName===null) return; // キャンセル
  const csv=buildPaypayCsv(csvRows,remitterName);
  const blob=paypayCsvToBlob(csv); // 2026-09-04：Shift-JISでエンコード（PayPay銀行アップロードエラー対応）
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=`paypay_furikomi_${PAYROLL_STATE.yearMonth}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  msg.className="err msg-ok";
  msg.textContent=`${count}件・合計${yen(total)}のCSVをダウンロードしました。`+(skipped.length?`スキップ: ${skipped.join("、")}`:"");
}
// 対象年月（"YYYY-MM"）の末日を"YYYY-MM-DD"で返す（2026-09-02追加。ユーザー要望
// 「会計計上日は対象月の末日が既定値になるように」に対応。従来は常に「今日の日付」だった）
function payrollLastDayOfMonth(ym){
  const [y,m]=String(ym||"").split("-").map(Number);
  if(!y||!m) return new Date().toISOString().slice(0,10);
  const d=new Date(y,m,0); // 月mの0日目=月m(1始まり)の末日
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

        <thead><tr><th style="text-align:left;padding:3px 6px">事業所</th><th style="text-align:right;padding:3px 6px">金額合計</th><th style="text-align:right;padding:3px 6px">交通費合計</th></tr></thead>

      </table>
    </div>`;
  };
  // 2026-09-02: ユーザー要望「明細を追加できるようにしてほしい」に対応。空の行を追加し、
  // 借方・貸方どちらの勘定科目も入力補完（既に取得済みのPAYROLL_STATE.accountLabelMap）から選べる
  $("payroll-preview-addrow").onclick=()=>{
    branches.push({debit:null,credit:null,debitLabel:"",creditLabel:"",debitAmount:0,creditAmount:0,department_id:null,tax_id:null,credit_department_id:null,credit_tax_id:null,remark:""});
    rerenderEntries();
  };
  // 2026-09-02: ユーザー要望「途中で消えてしまうこともあるから一時保存を」に対応。
  // 編集中のbranches（勘定科目名・金額・部門・税区分等すべて）をそのままJSONで保存する。
  // マネーフォワードへの実登録（payroll_journal_records）はしないため、状態は「下書き」のまま
  $("payrollPreviewSaveDraft").onclick=async()=>{
    const pmsg=$("payrollPreviewMsg");
    $("payrollPreviewSaveDraft").disabled=true;
    pmsg.className="err"; pmsg.textContent="一時保存中…";
    const draftPayload={
      user_id:userId, year_month:PAYROLL_STATE.yearMonth, template_id:template.id,
      branches: branches.map(({debit,credit,...rest})=>rest), // 解決済みaccountオブジェクトは保存せず、ラベル等の入力値だけ保存（次回開いたときに再解決する）
      transaction_date: $("payroll-date").value||null,
      updated_by:ME.id, updated_at:new Date().toISOString(),
    };
    const r=await authed("/rest/v1/payroll_journal_drafts",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(draftPayload)});
    $("payrollPreviewSaveDraft").disabled=false;
    if(!r.ok){ pmsg.textContent="一時保存に失敗しました"; return; }
    pmsg.className="err msg-ok"; pmsg.textContent="一時保存しました。閉じても内容は残ります（次にこの従業員のプレビューを開くと続きから編集できます）";
    const existing=PAYROLL_STATE.drafts.find(d=>d.user_id===userId);
    if(existing) Object.assign(existing,draftPayload); else PAYROLL_STATE.drafts.push(draftPayload);
    payrollRender(); // 一覧の状態表示（下書き保存中）を更新
  };
  $("payrollPreviewSubmit").onclick=async()=>{
    const pmsg=$("payrollPreviewMsg");
    // 2026-09-02: 勘定科目名（テキスト）をプルダウンの候補から選んだ勘定科目オブジェクトへ解決してから
    // 送信する（mft/mfjの仕訳辞書エディタと同じ方式）。テンプレート由来の行も含め全行が編集可能なため、
    // 全行について毎回この解決をやり直す
    for(const [i,b] of branches.entries()){
      const debitLabel=(b.debitLabel||"").trim(), creditLabel=(b.creditLabel||"").trim();
      if(debitLabel){
        const acc=PAYROLL_STATE.accountLabelMap.get(debitLabel);
        if(!acc){ pmsg.className="err"; pmsg.textContent=`${i+1}行目・借方の勘定科目「${debitLabel}」が候補にありません。一覧から選び直してください`; return; }
        b.debit=acc;
      }else{ b.debit=null; }
      if(creditLabel){
        const acc=PAYROLL_STATE.accountLabelMap.get(creditLabel);
        if(!acc){ pmsg.className="err"; pmsg.textContent=`${i+1}行目・貸方の勘定科目「${creditLabel}」が候補にありません。一覧から選び直してください`; return; }
        b.credit=acc;
      }else{ b.credit=null; }
      if(!b.debit&&!b.credit){ pmsg.className="err"; pmsg.textContent=`${i+1}行目に借方・貸方どちらも入力されていません（不要ならこの行を削除してください）`; return; }
    }
    const {debit:totalDebit,credit:totalCredit}=calcTotals();
    if(totalDebit!==totalCredit){ pmsg.className="err"; pmsg.textContent=`借方合計（${yen(totalDebit)}）と貸方合計（${yen(totalCredit)}）が一致していません。金額を確認してください`; return; }
    $("payrollPreviewSubmit").disabled=true;
    pmsg.className="err"; pmsg.textContent="登録中…";
    const payload={
      tenant_id:"default", vendor_name:`給与：${name}（${PAYROLL_STATE.yearMonth}）`,
      branches: branches.map(b=>({
        debit:b.debit?{account_id:b.debit.account_id,sub_account_id:b.debit.sub_account_id||undefined,value:b.debitAmount}:undefined,
        credit:b.credit?{account_id:b.credit.account_id,sub_account_id:b.credit.sub_account_id||undefined,value:b.creditAmount}:undefined,
        department_id:b.department_id||null, tax_id:b.tax_id||null,
        credit_department_id:b.credit_department_id||null, credit_tax_id:b.credit_tax_id||null,
        remark:b.remark||`${PAYROLL_STATE.yearMonth}分給与`,
      })),
      transaction_date: $("payroll-date").value,
      remark:`${PAYROLL_STATE.yearMonth}分給与（${name}）`,
      voucher_files: pdfBase64?[{file_name:`給与明細_${name}_${PAYROLL_STATE.yearMonth}.pdf`,file_data:pdfBase64}]:[],
    };
    const {ok,body:j}=await mfCall("create_standalone",payload);
    if(!ok){ pmsg.textContent=j.error||"登録に失敗しました"; $("payrollPreviewSubmit").disabled=false; return; }
    const recR=await authed("/rest/v1/payroll_journal_records",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({
      user_id:userId, year_month:PAYROLL_STATE.yearMonth, tenant_id:"default", template_id:template.id,
      mf_journal_id:j.journal_id, mf_journal_number:j.journal_number, mf_journal_created_at:new Date().toISOString(),
      invoice_id:j.invoice_id, created_by:ME.id,
    })});
    // 2026-09-02: 実際に登録できたら一時保存の下書きは不要になるため削除する（「登録になるまで
    // 完了にならない」＝逆に言えば登録できたら下書き扱いのままにしない、という要望に対応）
    await authed(`/rest/v1/payroll_journal_drafts?user_id=eq.${userId}&year_month=eq.${PAYROLL_STATE.yearMonth}`,{method:"DELETE"});
    pmsg.className="err msg-ok";
    const voucherNote=j.voucher_attached?`。証憑PDFも添付しました`:(j.voucher_error?`（証憑添付: ${j.voucher_error}）`:"");
    pmsg.textContent=recR.ok
      ?`登録しました（伝票番号: ${j.journal_number??"-"}）${voucherNote}。画面を更新します…`
      :`マネーフォワードへの登録は成功しました（伝票番号: ${j.journal_number??"-"}）${voucherNote}が、進捗の記録に失敗しました。再度この従業員を登録しようとすると重複する可能性があるため、マネーフォワード側の実際の登録状況を確認してください。`;
    setTimeout(async()=>{ history.back(); await payrollLoad(); payrollRender(); },1400);
  };
}

async function renderPlFeeAccountsSection(){
  const box=$("plfee-accounts-box");
  if(!box) return;
  box.innerHTML=`<div style="font-size:12px;color:var(--muted)">読み込み中…</div>`;
  PL_FEE_TARGET_ACCOUNTS=null; // 設定タブを開くたびに最新を取り直す
  const [accounts,tRes]=await Promise.all([plFeeTargetAccounts(), mfCall("list_tenants")]);
  const tenants=(tRes.ok&&tRes.body.tenants)||[];
  const tenantId=PLFEE_ACC_STATE.tenantId||(tenants[0]&&tenants[0].id)||"default";
  PLFEE_ACC_STATE.tenantId=tenantId; PLFEE_ACC_STATE.tenants=tenants;
  const accRes=await mfCall("accounts",{tenant_id:tenantId});
  const mfAccounts=(accRes.ok&&accRes.body.accounts)||[];
  const dl=mfAccounts.map(a=>{
    let opts=`<option value="${esc(a.name)}">`;
    for(const sa of (a.sub_accounts||[])) opts+=`<option value="${esc(a.name)}/${esc(sa.name)}">`;
    return opts;
  }).join("");
  box.innerHTML=`
    ${tenants.length>1?`<div style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">事業者</label>
      <select id="plfee-acc-tenant">${tenants.map(t=>`<option value="${esc(t.id)}" ${t.id===tenantId?"selected":""}>${esc(t.label)}</option>`).join("")}</select></div>`:""}
    ${!accRes.ok?`<div class="err" style="margin-bottom:8px">勘定科目の取得に失敗しました（マネーフォワード未連携の可能性）: ${esc((accRes.body&&accRes.body.error)||"")}。下の欄は手入力になります（MFの表記と完全に一致させてください）</div>`:""}
    <datalist id="plfee-acc-datalist">${dl}</datalist>
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px">
      <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">勘定科目名（候補から選択・入力すると絞り込めます）</label>
        <input id="plfee-acc-name" list="plfee-acc-datalist" placeholder="例: 支払手数料"></div>
      <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">PL上での表示名（任意）</label>
        <input id="plfee-acc-label" placeholder="省略時は科目名と同じ"></div>
      <button class="hq-btn primary" id="plfee-acc-add">＋ 追加</button>
    </div>
    <div class="err" id="plfee-acc-msg" style="margin-bottom:8px"></div>
    <div class="hq-tablewrap">
      <table class="invoice-table">
        <thead><tr><th>勘定科目名</th><th>PL表示名</th><th></th></tr></thead>
        <tbody>${accounts.map(a=>`<tr>
          <td><b>${esc(a.account_name)}</b></td>
          <td>${esc(a.pl_label||a.account_name)}</td>
          <td><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-plfee-acc-del="${esc(a.id)}">削除</button></td>
        </tr>`).join("")||'<tr><td colspan="3">登録されていません</td></tr>'}</tbody>
      </table>
    </div>`;
  if(tenants.length>1) $("plfee-acc-tenant").onchange=e=>{ PLFEE_ACC_STATE.tenantId=e.target.value; renderPlFeeAccountsSection(); };
  const accountNameSet=new Set(mfAccounts.flatMap(a=>[a.name, ...(a.sub_accounts||[]).map(sa=>`${a.name}/${sa.name}`)]));
  $("plfee-acc-add").onclick=async()=>{
    const name=$("plfee-acc-name").value.trim();
    const label=$("plfee-acc-label").value.trim();
    const msg=$("plfee-acc-msg");
    if(!name){ msg.textContent="勘定科目名を選択してください"; return; }
    if(accRes.ok&&!accountNameSet.has(name)){ msg.textContent="候補一覧に無い科目名です。候補から選び直してください（誤字防止のため）"; return; }
    msg.className="err"; msg.textContent="追加中…";
    const r=await plFeeCall("add_target_account",{account_name:name,pl_label:label});
    if(!r.ok){ msg.textContent=r.body.error||"追加できませんでした"; return; }
    await renderPlFeeAccountsSection();
  };
  document.querySelectorAll("[data-plfee-acc-del]").forEach(el=>el.onclick=async()=>{
    if(!confirm("この科目をPL連携対象から外しますか？（過去に反映済みの記録は消えません）")) return;
    await plFeeCall("remove_target_account",{id:el.dataset.plfeeAccDel});
    await renderPlFeeAccountsSection();
  });
}

      <thead><tr><th>ルール</th><th>説明</th><th>有効</th><th>動作</th><th></th></tr></thead>
      <tbody>${rules.map(x=>`<tr>
        <td><b>${esc(x.label)}</b></td>
        <td style="white-space:normal;max-width:280px">${esc(x.description||"")}</td>
        <td><input type="checkbox" class="rule-enabled" data-key="${esc(x.key)}" ${x.enabled?"checked":""}></td>
        <td><select class="rule-action" data-key="${esc(x.key)}">${Object.entries(actionLabel).map(([k,l])=>`<option value="${k}" ${x.action===k?"selected":""}>${l}</option>`).join("")}</select></td>
        <td><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-rule-save="${esc(x.key)}">保存</button></td>
      </tr>`).join("")}</tbody>
    </table></div>
    <div class="err" id="automation-msg" style="margin-top:8px"></div>
  </div>`;
  document.querySelectorAll("[data-rule-save]").forEach(el=>el.onclick=async()=>{
    const key=el.dataset.ruleSave;
    const enabled=document.querySelector(`.rule-enabled[data-key="${key}"]`).checked;
    const action=document.querySelector(`.rule-action[data-key="${key}"]`).value;
    const msg=$("automation-msg"); msg.className="err"; msg.textContent="保存中…";
    const rr=await authed(`/rest/v1/automation_rule_settings?key=eq.${encodeURIComponent(key)}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({enabled,action,updated_by:ME.id,updated_at:new Date().toISOString()})});
    if(!rr.ok){ msg.textContent="保存に失敗しました"; return; }
    msg.className="err msg-ok"; msg.textContent="保存しました";
  });
}

/* ============================================================
   起動
   ============================================================ */
function renderLogin(){
  $("app").innerHTML=`<div class="card" style="padding:20px;margin-top:20px">
    <p style="margin-bottom:10px">ログインが必要です。ポータルからアクセスしてください。</p>
    ${EMBED?"":'<a class="hq-btn primary" href="index.html" style="text-decoration:none;display:inline-block">← ポータルへ</a>'}
  </div>`;
}
async function main(){
  if(EMBED) document.body.classList.add("embed-mode");
  if(!sess.get()){renderLogin();return}
  const u=await fetchMe();
  if(!u){sess.clear();renderLogin();return}
  if(u.is_active===false){renderLogin();return}
  ME=u;
  history.replaceState({tab:TAB},"");
  await Promise.all([loadInboxMaster(), loadWaitingPaymentCount(), loadKpiCounts()]);
  $("app").innerHTML=shellHtml(u);
  wireShell(u);
  await renderTabBody(u);
}
main();
</script>
