<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>📨 請求書メール — N-Styleグループ ポータル</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📨</text></svg>">
<style>
/* ============================================================
   配色・レイアウトはユーザー提供のUIプロトタイプ（mail-shell）に準拠
   ============================================================ */
:root{
  --bg:#f4f1eb; --panel:#fff; --ink:#231f1a; --muted:#7d756d; --line:#e4ddd4;
  --accent:#c94728; --accent-soft:#fce9e3;
  --green:#2f8f63; --green-soft:#e7f5ed;
  --amber:#b77b13; --amber-soft:#fff3d8;
  --blue:#2f6fb7; --blue-soft:#e8f0fb;
  --shadow:0 8px 28px rgba(35,31,26,.08); --radius:16px;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#211d18; --panel:#2b2620; --ink:#f2ede6; --muted:#b3aa9f; --line:#433c33; --accent-soft:#4a2c22; --green-soft:#1f3a2c; --amber-soft:#3d3018; --blue-soft:#1e3049;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
a{color:inherit}
button,input,select,textarea{font:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px 60px}
.spin{text-align:center;color:var(--muted);padding:60px 0}
.err{color:var(--accent);font-size:13px}
.msg-ok{color:var(--green)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.modal-bg{position:fixed;inset:0;background:rgba(20,15,8,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.modal{background:var(--panel);border-radius:16px;padding:20px;max-width:520px;width:100%;margin:20px 0}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal .mhead h2{font-size:16px}
.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
.modal label:first-of-type{margin-top:0}
.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink)}
.modal textarea{min-height:120px;resize:vertical}
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:5}
.topbar h1{font-size:21px}
.topbar .who{font-size:13px;color:var(--muted)}

/* ---- mail-shell（プロトタイプ準拠） ---- */
.mail-shell{--m-line:var(--line);--m-muted:var(--muted);--m-red:var(--accent);--m-redsoft:var(--accent-soft);
  --m-green:var(--green);--m-greensoft:var(--green-soft);--m-blue:var(--blue);--m-bluesoft:var(--blue-soft);
  --m-amber:var(--amber);--m-ambersoft:var(--amber-soft);}
.mail-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.mail-kpi{padding:16px}.mail-kpi small{display:block;color:var(--m-muted);font-size:12px}.mail-kpi b{display:block;font-size:28px;margin-top:5px}
.mail-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mail-tab{border:1px solid var(--m-line);background:var(--panel);border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.mail-tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mail-chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0}
.mail-chip{border:1px solid var(--m-line);background:var(--panel);border-radius:999px;padding:6px 11px;cursor:pointer;font-size:12px;color:var(--muted)}
.mail-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.bulkbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.bulk-actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.bulk-actions .hq-btn{font-size:12px;padding:7px 10px}
.mail-layout{display:grid;grid-template-columns:minmax(340px,.9fr) minmax(0,1.5fr);gap:14px;align-items:start}
.mail-list-card{overflow:hidden}
.mail-toolbar{padding:12px;border-bottom:1px solid var(--m-line);display:flex;gap:8px;align-items:center}
.mail-toolbar input{flex:1;border:1px solid var(--m-line);border-radius:10px;padding:10px;background:var(--panel);color:var(--ink)}
.mail-list-scroll{max-height:74vh;overflow-y:auto}
.mail-item{padding:13px 14px 13px 36px;border-bottom:1px solid var(--m-line);cursor:pointer;background:var(--panel);position:relative}
.mail-checkwrap{position:absolute;left:10px;top:15px}
.mail-checkwrap input{width:16px;height:16px}
.mail-item:hover{background:var(--bg)}
.mail-item.active{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent)}
.mail-item.unread .mail-subject{font-weight:800}
.mail-item.locked:after{content:"処理中";position:absolute;right:12px;top:12px;background:var(--m-bluesoft);color:var(--m-blue);font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px}
.mail-item.dup:after{content:"重複疑い";position:absolute;right:12px;top:12px;background:var(--m-redsoft);color:var(--m-red);font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px}
.mail-item.completed:after{content:"完了";position:absolute;right:12px;top:12px;background:var(--m-greensoft);color:var(--m-green);font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px}
.mail-item.notapplicable:after{content:"対象外";position:absolute;right:12px;top:12px;background:var(--bg);color:var(--muted);font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px}
.mail-from{font-size:12px;color:var(--m-muted);padding-right:74px}
.mail-subject{font-size:14px;margin-top:3px;padding-right:74px}
.mail-preview{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:10px;color:var(--muted)}
.mail-detail{min-width:0}
.mail-detail-head{padding:17px 18px;border-bottom:1px solid var(--m-line)}
.mail-detail-head h2{margin:7px 0 4px;font-size:20px}
.mail-detail-head .meta{color:var(--muted);font-size:12px}
.mail-detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.mail-mini{border:1px solid var(--m-line);border-radius:10px;padding:10px;background:var(--bg)}
.mail-mini small{display:block;color:var(--m-muted);font-size:10px;margin-bottom:3px}
.mail-mini b{font-size:13px}
.mail-ownerbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.hq-badges{display:flex;gap:6px;flex-wrap:wrap}
.hq-pill{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.hq-pill.red{background:var(--m-redsoft);color:var(--m-red)}
.hq-pill.amber{background:var(--m-ambersoft);color:var(--m-amber)}
.hq-pill.green{background:var(--m-greensoft);color:var(--m-green)}
.hq-pill.blue{background:var(--m-bluesoft);color:var(--m-blue)}
.hq-pill.gray{background:var(--bg);color:var(--muted)}
.hq-btn{border:1px solid var(--m-line);background:var(--panel);border-radius:10px;padding:9px 13px;cursor:pointer;color:var(--ink)}
.hq-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hq-btn.green{background:var(--green);border-color:var(--green);color:#fff}
.hq-btn:disabled{opacity:.45;cursor:not-allowed}
.mail-lock{margin:12px 18px 0;padding:12px;border:1px solid #b8d0eb;background:var(--blue-soft);border-radius:12px;color:#315c86;font-size:12px}
.mail-alert{margin:12px 18px 0;padding:12px;border:1px solid #efb7aa;background:var(--accent-soft);border-radius:12px;color:#9d3425;font-size:12px}
.mail-body{padding:18px}
.mail-body-frame{width:100%;height:260px;border:1px solid var(--m-line);border-radius:10px;background:#fff}
.invoice-attach{border:1px solid var(--m-line);border-radius:14px;padding:12px;background:var(--bg);margin-top:14px}
.invoice-attach h3{margin:0 0 8px;font-size:14px}
.attgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.attcard{border:1px solid var(--m-line);border-radius:12px;overflow:hidden;background:var(--panel)}
.attcard-preview{height:220px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.attcard-preview iframe{width:100%;height:100%;border:none}
.attcard-preview img{max-width:100%;max-height:100%;object-fit:contain}
.attcard-preview .noprev{font-size:13px;color:var(--muted);text-align:center;padding:0 10px}
.attcard-preview .noprev .ico{font-size:34px;display:block;margin-bottom:6px}
.attcard-foot{padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;border-top:1px solid var(--m-line)}
.attcard-foot .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.ai-box{border:1px solid var(--m-line);border-radius:12px;background:var(--panel);padding:12px;margin-top:14px}
.ai-box h3{margin:0 0 8px;font-size:14px}
.ai-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ai-field{padding:9px;border:1px solid var(--m-line);border-radius:9px;background:var(--bg)}
.ai-field small{display:block;color:var(--m-muted);font-size:10px;margin-bottom:4px}
.ai-field input,.ai-field select{width:100%;border:1px solid var(--m-line);border-radius:6px;background:var(--panel);font-size:13px;font-weight:700;color:var(--ink);padding:7px 8px;margin-top:2px;-webkit-appearance:auto;appearance:auto}
.ai-field input:focus,.ai-field select:focus{outline:2px solid var(--m-red);outline-offset:1px;border-color:var(--m-red)}
.mail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mail-actions button{border:1px solid var(--m-line);background:var(--panel);border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.mail-actions .primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.mail-actions .green{background:var(--green);color:#fff;border-color:var(--green)}
.mail-history{margin-top:14px;border-top:1px solid var(--m-line);padding-top:12px}
.mail-history-row{display:grid;grid-template-columns:12px 1fr;gap:8px;padding:7px 0;font-size:11px;color:var(--muted)}
.mail-history-row span:first-child{width:8px;height:8px;background:#cfc6bc;border-radius:50%;margin-top:4px}
.mail-history-row.done span:first-child{background:var(--green)}
.comment-section{margin-top:14px;border-top:1px solid var(--m-line);padding-top:12px}
.comment-row{padding:8px 0;border-bottom:1px solid var(--m-line);font-size:12px}
.comment-row:last-child{border-bottom:none}
.comment-row .cmeta{color:var(--muted);font-size:10px;margin-bottom:3px}
.comment-row .cbody{white-space:pre-wrap}
.comment-form{margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.comment-form textarea{flex:1;border:1px solid var(--m-line);border-radius:8px;padding:8px;min-height:44px;background:var(--panel);color:var(--ink);resize:vertical}
.due-badge{padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800;display:inline-block}
.due-badge.overdue{background:var(--accent-soft);color:var(--accent)}
.due-badge.soon{background:var(--amber-soft);color:var(--amber)}
.iv-filterbar{padding:12px;border-bottom:1px solid var(--m-line);display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.iv-filterbar .ivf{display:flex;flex-direction:column;gap:3px}
.iv-filterbar .ivf small{font-size:10px;color:var(--muted)}
.iv-filterbar input,.iv-filterbar select{border:1px solid var(--m-line);border-radius:8px;padding:7px 8px;background:var(--panel);color:var(--ink);font-size:12px}
.iv-filterbar input[type=search]{width:200px}
.iv-filterbar input[type=number]{width:90px}
.invoice-table th[data-sort]{cursor:pointer;user-select:none}
.invoice-table th[data-sort]:hover{color:var(--ink)}
.mail-toolbar{flex-wrap:wrap}
.mail-toolbar .toolbar-dates{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
.mail-toolbar .toolbar-dates input{flex:0 0 auto;width:auto;border:1px solid var(--m-line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink);font-size:12px}
.replybox{margin-top:14px;border-top:1px solid var(--m-line);padding-top:12px;display:none}
.replybox.open{display:block}
.replybox textarea{width:100%;border:1px solid var(--m-line);border-radius:10px;padding:10px;min-height:100px;background:var(--panel);color:var(--ink)}
.confirmbox{background:var(--bg);border:1px solid var(--m-line);border-radius:10px;padding:12px;margin-top:10px;font-size:13px;white-space:pre-wrap}

/* ---- 仕訳作成（振替伝票入力）: マネーフォワードの入力画面に近いテーブル形式 2026-08-31 ---- */
.mfj-balance{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.mfj-balance .box{padding:10px;border-radius:10px;border:1px solid var(--m-line);background:var(--bg)}
.mfj-balance .box small{display:block;color:var(--m-muted);font-size:10px}
.mfj-balance .box b{display:block;font-size:17px;margin-top:3px}
.mfj-balance .box.ok{background:var(--m-greensoft);border-color:var(--m-green)}
.mfj-balance .box.ng{background:var(--m-redsoft);border-color:var(--m-red)}
.mfj-gridwrap{overflow-x:auto;margin-top:4px;border:1px solid var(--m-line);border-radius:10px}
.mfj-grid{width:100%;border-collapse:collapse;min-width:820px;font-size:11px}
.mfj-grid th,.mfj-grid td{border-bottom:1px solid var(--m-line);border-right:1px solid var(--m-line);padding:6px;vertical-align:top}
.mfj-grid th:last-child,.mfj-grid td:last-child{border-right:none}
.mfj-grid th{background:var(--bg);font-size:10px;color:var(--m-muted);font-weight:700;text-align:left}
.mfj-grid th.side{font-size:12px;background:var(--m-bluesoft);color:var(--m-blue);text-align:center}
.mfj-grid select,.mfj-grid input,.mfj-grid textarea{width:100%;border:1px solid var(--m-line);border-radius:6px;padding:6px;background:var(--panel);color:var(--ink);font-size:11px}
.mfj-grid textarea{min-height:40px;resize:vertical}
.mfj-grid input.mfj-amt{text-align:right;font-weight:800;background:var(--m-bluesoft)}
.mfj-grid td.mfj-rmcell{width:30px;text-align:center;vertical-align:middle}
.mfj-grid td.mfj-rmcell button{border:0;background:#8f99a5;color:#fff;border-radius:50%;width:22px;height:22px;cursor:pointer}
.mfj-preview-entry{border:1px solid var(--m-line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.mfj-preview-head{display:grid;grid-template-columns:1fr 1fr;background:var(--bg)}
.mfj-preview-head div{padding:6px 9px;font-size:10px;font-weight:700;color:var(--m-muted)}
.mfj-preview-body{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--m-line)}
.mfj-preview-side{padding:9px;border-right:1px solid var(--m-line)}
.mfj-preview-side:last-child{border-right:none}
.mfj-preview-side .acc{font-weight:800;font-size:13px}
.mfj-preview-side .sub{font-size:10px;color:var(--m-muted);margin-top:2px}
.mfj-preview-side .money{font-size:15px;font-weight:800;text-align:right;margin-top:6px}
.mfj-preview-remark{padding:7px 9px;background:var(--bg);font-size:11px;border-top:1px solid var(--m-line);color:var(--muted)}
.mfj-tpl-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px;border:1px solid var(--m-line);border-radius:9px;margin-bottom:6px;background:var(--bg)}
.mfj-tpl-item .lbl{font-size:12px;font-weight:700}
.mfj-tpl-item .sum{font-size:10px;color:var(--m-muted);margin-top:2px}

/* ---- 広告費として反映（C-7②・2026-08-31） ---- */
.adcost-box{border:1px solid var(--m-line);border-radius:12px;background:var(--panel);padding:14px;margin-top:14px}
.adcost-box h3{margin:0 0 4px;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.adcost-sub{font-size:11px;color:var(--m-muted);margin-bottom:10px;line-height:1.6}
.adcost-source{font-size:10px;color:var(--m-muted);margin:6px 0;line-height:1.6}
.adcost-table{width:100%;border-collapse:collapse;margin-top:4px;font-size:12px}
.adcost-table th,.adcost-table td{border-bottom:1px solid var(--m-line);padding:8px 6px;text-align:left;vertical-align:middle}
.adcost-table th{font-size:10px;color:var(--m-muted);font-weight:700}
.adcost-table td.amt{text-align:right}
.adcost-table input,.adcost-table select{border:1px solid var(--m-line);border-radius:6px;padding:6px 8px;background:var(--bg);color:var(--ink);font-size:12px}
.adcost-table input{width:112px;text-align:right;font-variant-numeric:tabular-nums}
.adcost-table td.rm{width:26px;text-align:center}
.adcost-table td.rm button{border:0;background:#8f99a5;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px}
.adcost-total{display:flex;justify-content:flex-end;gap:16px;margin-top:10px;font-size:12px;padding-top:10px;border-top:1px solid var(--m-line);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.adcost-total b{font-size:15px}
.adcost-diff-ok{color:var(--m-green)}
.adcost-diff-ng{color:var(--m-red)}
.adcost-hint{font-size:10px;color:var(--m-muted);margin-top:8px;line-height:1.6}
.adcost-badge-row{font-size:11px;color:var(--m-muted);margin-top:4px}

.invoice-list{display:none}.invoice-list.active{display:block}
.mail-inbox{display:none}.mail-inbox.active{display:block}
.invoice-table{width:100%;border-collapse:collapse}
.invoice-table th,.invoice-table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:12px}
.invoice-table th{color:var(--muted);background:var(--bg)}
.invoice-table tr[data-openmail]{cursor:pointer}
.invoice-status{padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;display:inline-block}
.invoice-status.wait{background:var(--amber-soft);color:var(--amber)}
.invoice-status.done{background:var(--green-soft);color:var(--green)}
.invoice-status.check{background:var(--blue-soft);color:var(--blue)}
.invoice-status.gray{background:var(--bg);color:var(--muted)}
.empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:13px}
.hq-tablewrap{overflow:auto}

.mail-tabs-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.mail-tabs-row .mail-tabs{margin-bottom:0}
body.embed-mode .wrap{padding-top:16px}
.mobile-back{display:none}
.modal .mobile-back{display:none!important} /* モーダル内では「一覧へ戻る」は不要（閉じるボタンで戻る） */
@media(max-width:900px){
  .mail-layout{grid-template-columns:1fr}
  .mail-summary{grid-template-columns:1fr 1fr}
  .mail-detail-grid{grid-template-columns:1fr 1fr}
  /* スマホ・タブレット幅: 一覧をタップしたら一覧を隠して詳細だけ全画面表示（下にスクロール
     しないと詳細が見えない問題への対応）。「戻る」で一覧表示に戻す */
  .mobile-back{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink);font-size:13px;margin-bottom:10px}
  #mailLayout.mobile-detail .mail-list-card{display:none}
  #mailLayout:not(.mobile-detail) .mail-detail{display:none}
}
@media(max-width:760px){
  .wrap{padding:0 14px 80px}
  .mail-summary{gap:8px}.mail-kpi{padding:12px}.mail-kpi b{font-size:22px}
  .mail-tabs{flex-wrap:nowrap;overflow-x:auto}.mail-tab{flex:0 0 auto;font-size:12px;padding:7px 11px}
  .mail-list-scroll{max-height:none}
  .mail-item{padding:12px 12px 12px 32px}.mail-from{font-size:11px}.mail-subject{font-size:13px}.mail-preview{font-size:10px}
  .bulkbar{padding:8px 10px}.bulk-actions{width:100%}.bulk-actions .hq-btn{flex:1;min-height:38px}
  .mail-detail{margin-top:10px}
  .mail-detail-head{padding:14px}.mail-detail-head h2{font-size:17px}
  .mail-detail-grid{grid-template-columns:1fr 1fr;gap:7px}.mail-mini{padding:9px}
  .mail-lock,.mail-alert{margin:10px 14px 0}
  .mail-body{padding:14px}
  .ai-grid{grid-template-columns:1fr}
  .attgrid{grid-template-columns:1fr}.attcard-preview{height:180px}

async function api(path,opt={},token){
  const r=await fetch(SUPA_URL+path,{...opt,headers:{
    "apikey":SUPA_KEY,...(opt.isBinary?{}:{"Content-Type":"application/json"}),
    ...(token?{"Authorization":"Bearer "+token}:{}),...(opt.headers||{})}});
  let body=null; const tx=await r.text(); try{body=tx?JSON.parse(tx):null}catch(e){}
  return {ok:r.ok,status:r.status,body};
}
async function authed(path,opt={}){
  const s=sess.get(); if(!s) return {ok:false,status:401,body:null};
  let r=await api(path,opt,s.at);
  // Supabase Storage API（例: 添付ファイルの署名URL発行）はトークン期限切れ時、
  // PostgREST/authと違い401ではなく400+code:"InvalidJWT"を返すため、その場合も再試行する
  // （2026-08-25 担当B調査→担当C対応: 添付が開けない不具合）
  if(r.status===401 || (r.status===400 && r.body?.code==="InvalidJWT")){ if(!await refresh()) return r; r=await api(path,opt,sess.get().at); }
  return r;
}
async function refresh(){
  const s=sess.get(); if(!s?.rt) return false;
  const r=await api("/auth/v1/token?grant_type=refresh_token",{method:"POST",body:JSON.stringify({refresh_token:s.rt})});
  if(!r.ok){sess.clear();return false}
  sess.set({at:r.body.access_token,rt:r.body.refresh_token,uid:r.body.user.id});
  return true;
}
async function fetchMe(){
  const s=sess.get(); if(!s) return null;

  return r.body[0];
}

  const map={};
  (Array.isArray(r.body)?r.body:[]).forEach(x=>{ if(x.path&&x.signedURL) map[x.path]=`${SUPA_URL}/storage/v1${x.signedURL}`; });
  return map;
}

function fmtD(t){ if(!t) return "—"; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; }

// ここに無い媒体の請求書が来るようになったら、この対応表に追記すれば拾えるようになる
// （担当Cに「〇〇からの請求書も広告費として認識してほしい」と伝えてもらえれば追記対応する）
const AD_MEDIA_DOMAIN_MAP=[
  {domain:"tabelog.com",media:"食べログ"},
  {domain:"kakaku.co.jp",media:"食べログ"},
  {domain:"gnavi.co.jp",media:"ぐるなび"},

];
function adcostGuessMedia(fromAddress,subject){
  const from=(fromAddress||"").toLowerCase();
  const hit=AD_MEDIA_DOMAIN_MAP.find(m=>from.includes(m.domain));
  if(hit) return hit.media;
  // ドメインで拾えない場合は件名からのゆるい推測（サブブランド・別ドメインからの請求も拾う保険）
  const subj=(subject||"");
  for(const m of AD_MEDIA_DOMAIN_MAP){ if(subj.includes(m.media)) return m.media; }

}

function prepareBodyHtml(html){
  const doc=new DOMParser().parseFromString(html,"text/html");
  doc.querySelectorAll("script,style,iframe,object,embed").forEach(el=>el.remove());
  doc.querySelectorAll("a[href]").forEach(a=>{ a.setAttribute("target","_blank"); a.setAttribute("rel","noopener noreferrer"); });
  return doc.body ? doc.body.innerHTML : html;
}

}

// （ポータル側の未処理件数バッジと同じ方式に統一＝表示がズレていた問題への対応）
let KPI_COUNTS={unprocessed:0,processing:0,completedThisMonth:0};
async function loadKpiCounts(){
  const now=new Date();
  const startOfMonth=new Date(now.getFullYear(),now.getMonth(),1).toISOString();
  const [unprocR,procR,doneR]=await Promise.all([
    authed(`/rest/v1/invoice_emails?mail_status=in.(unread,read)&select=id`),
    authed(`/rest/v1/invoice_emails?mail_status=eq.processing&select=id`),
    authed(`/rest/v1/invoice_emails?mail_status=eq.completed&completed_at=gte.${startOfMonth}&select=id`),
  ]);
  KPI_COUNTS={
    unprocessed:(unprocR.ok&&Array.isArray(unprocR.body))?unprocR.body.length:0,
    processing:(procR.ok&&Array.isArray(procR.body))?procR.body.length:0,
    completedThisMonth:(doneR.ok&&Array.isArray(doneR.body))?doneR.body.length:0,
  };
}
function kpiCounts(){ return KPI_COUNTS; }
function filteredMails(){
  let list=MASTER_MAILS;
  if(CHIP==="unprocessed") list=list.filter(m=>m.mail_status==="unread"||m.mail_status==="read");
  else if(CHIP==="processing") list=list.filter(m=>m.mail_status==="processing");
  else if(CHIP==="completed") list=list.filter(m=>m.mail_status==="completed");
  if(KIND_FILTER==="unclassified") list=list.filter(m=>!m.mail_kind);
  else if(KIND_FILTER!=="all") list=list.filter(m=>m.mail_kind===KIND_FILTER);
  if(SEARCH_Q.trim()){
    // 2026-08-24 Phase1.5: 件名・送信元に加え本文も検索対象にする（フリーワード検索強化）
    const q=SEARCH_Q.trim().toLowerCase();
    list=list.filter(m=>(m.from_address||"").toLowerCase().includes(q)
      ||(m.subject||"").toLowerCase().includes(q)
      ||(m.body_text||"").toLowerCase().includes(q));
  }
  if(DATE_FROM) list=list.filter(m=>m.received_at && m.received_at.slice(0,10)>=DATE_FROM);
  if(DATE_TO) list=list.filter(m=>m.received_at && m.received_at.slice(0,10)<=DATE_TO);
  return list;
}

本文:
<span id="cp-preview-body"></span></div>

    $("cp-msg").textContent=(sr.ok&&sj.success)?"送信しました":"送信予約は完了しました。数分以内に自動で再送されます。";
    setTimeout(()=>history.back(),1200);

function renderMailListOnly(){
  const list=filteredMails();
  BULK_SELECTED=new Set([...BULK_SELECTED].filter(id=>list.some(m=>m.id===id)));
  $("mailListScroll").innerHTML=list.length?list.map(mailItemHtml).join(""):'<div class="empty">該当するメールはありません</div>';
  wireMailListClicks(ME);
  updateBulkBar();
}
function wireMailListClicks(u){
  document.querySelectorAll("[data-openmail]").forEach(el=>el.onclick=()=>openMailDetail(u,el.dataset.openmail,false));
  document.querySelectorAll("[data-bulkcheck]").forEach(el=>{
    el.onclick=e=>e.stopPropagation();
    el.onchange=e=>{
      const id=el.dataset.bulkcheck;
      if(e.target.checked) BULK_SELECTED.add(id); else BULK_SELECTED.delete(id);
      updateBulkBar();
    };
  });
}
function updateBulkBar(){
  const n=BULK_SELECTED.size;
  const cnt=$("bulk-count"); if(cnt) cnt.textContent=n?`${n}件選択中`:"";
  ["bulk-start","bulk-waiting","bulk-complete","bulk-notapplicable","bulk-important"].forEach(id=>{ const el=$(id); if(el) el.disabled=n===0; });
  const all=$("bulk-selectall"); if(all) all.checked=n>0&&n===filteredMails().length;
}
function wireBulkBar(u){
  updateBulkBar();
  $("bulk-selectall").onchange=e=>{
    const list=filteredMails();
    if(e.target.checked) list.forEach(m=>BULK_SELECTED.add(m.id)); else BULK_SELECTED.clear();
    document.querySelectorAll("[data-bulkcheck]").forEach(el=>{ el.checked=BULK_SELECTED.has(el.dataset.bulkcheck); });
    updateBulkBar();
  };
  $("bulk-start").onclick=()=>runBulkAction(u,"start","まとめて処理を開始します。他の人が処理中のものはスキップされます。よろしいですか？");
  $("bulk-waiting").onclick=()=>runBulkAction(u,"waiting_payment","選択したメールの請求書を「支払待ち」にします。よろしいですか？");
  $("bulk-complete").onclick=()=>runBulkAction(u,"complete","まとめて完了にします。他の人が処理中のものはスキップされます。よろしいですか？");
  $("bulk-notapplicable").onclick=()=>runBulkAction(u,"not_applicable","選択したメールをまとめて「対象外」にします（請求書ではないメール）。よろしいですか？");
  $("bulk-important").onclick=()=>runBulkAction(u,"mark_important","選択したメールをまとめて「重要」にします。よろしいですか？");
}
async function runBulkAction(u,action,confirmMsg){
  if(!BULK_SELECTED.size) return;
  if(!confirm(confirmMsg)) return;
  const msg=$("bulk-msg"); msg.className="err"; msg.textContent="処理中…";
  const r=await authed("/rest/v1/rpc/invoice_bulk_action",{method:"POST",body:JSON.stringify({p_email_ids:[...BULK_SELECTED],p_action:action})});
  if(!r.ok){ msg.textContent=(r.body&&r.body.message)||"失敗しました"; return; }
  const skipped=(r.body&&r.body.skipped)||[];
  msg.className="err msg-ok";
  msg.textContent=`${r.body.success_count}件完了`+(skipped.length?`／${skipped.length}件スキップ（他の人が処理中等）`:"");
  BULK_SELECTED.clear();
  await loadInboxMaster(); await loadWaitingPaymentCount(); await loadKpiCounts();
  const k=kpiCounts();
  document.querySelector(".mail-summary").outerHTML=`<div class="mail-summary">
      <div class="card mail-kpi"><small>未処理メール</small><b style="color:var(--accent)">${k.unprocessed}</b></div>
      <div class="card mail-kpi"><small>処理中</small><b style="color:var(--blue)">${k.processing}</b></div>
      <div class="card mail-kpi"><small>支払待ち請求書</small><b>${WAITING_PAYMENT_COUNT}</b></div>
      <div class="card mail-kpi"><small>今月完了</small><b style="color:var(--green)">${k.completedThisMonth}</b></div>
    </div>`;
  renderMailListOnly();
}
function mailItemHtml(m){
  const cls=["mail-item"];
  if(m.mail_status==="unread") cls.push("unread");
  if(m.mail_status==="processing") cls.push("locked");
  if(m.mail_status==="completed") cls.push("completed");
  if(m.mail_status==="archived") cls.push("notapplicable");
  if(m.duplicate_suspected) cls.push("dup");
  if(m.id===SELECTED_ID) cls.push("active");
  const preview=(m.body_text||"").replace(/\s+/g," ").trim().slice(0,60);
  const metaLeft=m.mail_status==="processing"&&m.processor?`担当：${esc(m.processor.name)}`:((m.atts&&m.atts.length)?`添付 ${m.atts.length}件`:"添付なし");
  return `<div class="${cls.join(' ')}" data-openmail="${m.id}">
    <label class="mail-checkwrap"><input type="checkbox" data-bulkcheck="${m.id}" ${BULK_SELECTED.has(m.id)?"checked":""}></label>
    <div class="mail-from">${esc(m.from_address||"—")}</div>
    <div class="mail-subject">${m.mail_kind?MAIL_KIND_LABEL[m.mail_kind]+" ":"❔ "}${m.is_important?"⭐ ":""}${esc(m.subject||"（件名なし）")}</div>
    <div class="mail-preview">${esc(preview)}</div>
    <div class="mail-meta"><span>${metaLeft}</span><span>${fmtDT(m.received_at)}</span></div>
  </div>`;
}

async function openMailDetail(u,emailId,skipHighlight){
  SELECTED_ID=emailId;
  if(!skipHighlight){
    document.querySelectorAll(".mail-item").forEach(el=>el.classList.toggle("active",el.dataset.openmail===emailId));
  }
  $("mailDetail").innerHTML='<div class="spin">読み込み中…</div>';

  const [mr,ar,rr,lr,ivr,cr]=await Promise.all([
    authed(`/rest/v1/invoice_emails?id=eq.${emailId}&select=*,processor:users!invoice_emails_processing_user_id_fkey(name),completer:users!invoice_emails_completed_by_fkey(name)`),
    authed(`/rest/v1/invoice_attachments?email_id=eq.${emailId}&select=*&order=created_at`),
    authed(`/rest/v1/invoice_email_reads?email_id=eq.${emailId}&select=opened_at,reader:users(name)&order=opened_at.asc&limit=1`),
    authed(`/rest/v1/invoice_audit_logs?entity_id=eq.${emailId}&select=*,actor:users(name)&order=created_at.asc&limit=50`),
    authed(`/rest/v1/invoices?email_id=eq.${emailId}&select=*,linked_step:hq_task_steps(id,title,task:hq_tasks(title,corp))&limit=1`),
    authed(`/rest/v1/invoice_comments?email_id=eq.${emailId}&select=*,author:users(name)&order=created_at.asc`),
  ]);
  if(!mr.ok||!mr.body||!mr.body[0]){ $("mailDetail").innerHTML='<div class="empty">読み込みに失敗しました</div>'; return; }
  const mail=mr.body[0];
  const atts=(ar.ok&&Array.isArray(ar.body))?ar.body:[];
  const firstRead=(rr.ok&&Array.isArray(rr.body)&&rr.body[0])?rr.body[0]:null;
  const logs=(lr.ok&&Array.isArray(lr.body))?lr.body:[];
  const invoice=(ivr.ok&&Array.isArray(ivr.body)&&ivr.body[0])?ivr.body[0]:null;
  const comments=(cr.ok&&Array.isArray(cr.body))?cr.body:[];
  SELECTED={mail,atts,firstRead,logs,invoice,comments};

  // 開封記録（unread→readの遷移のみ。何度呼んでも安全）
  authed("/rest/v1/rpc/invoice_record_read",{method:"POST",body:JSON.stringify({p_email_id:emailId})}).then(()=>{
    const m=MASTER_MAILS.find(x=>x.id===emailId);
    if(m&&m.mail_status==="unread"){ m.mail_status="read"; }
  });

  renderMailDetail(u);

  // スマホ幅では一覧を隠して詳細だけ全画面表示にする（下スクロールしないと詳細が
  // 見えない問題への対応）。PC幅では常に左右並びのまま何もしない。
  // skipHighlight=trueのとき（モーダル経由・再描画時の復元）は既にpushNav済みか
  // 単なる再描画なので、ここでは新規クリック（skipHighlight=false）のときだけ積む
  if(isMobileWidth()){
    if(!skipHighlight) pushNav({modal:false});
    MOBILE_VIEW="detail";
    const layout=$("mailLayout"); if(layout) layout.classList.add("mobile-detail");
    window.scrollTo({top:0,behavior:"instant"});
  }
}

      t=setTimeout(async()=>{

        const s=sess.get();

        $("hqlink-results").querySelectorAll("[data-pick]").forEach(el=>el.onclick=()=>{

  renderHqLinkBox();

  /* ----------------------------------------------------------
     広告費として反映（C-7②・2026-08-31）
     設計書_広告費自動連携と精算書PL科目連携_2026-08-31.md §4のとおり:
     店舗×金額の割り振りは a)今組んでいる仕訳の部門別金額 → b)前月・同媒体の店舗比率 → c)手入力、の優先順。
     確定はEdge Function「ad-cost-reflect」のconfirm actionへ。GAS側の書き込みaction（担当A・A-8）は
     まだ無いため、その間は「Supabase側には記録済み・シートへの反映は未完了」を正直に表示する
     ---------------------------------------------------------- */
  let ADCOST_STATE={};
  async function adcostInit(){
    if(isSales||!invoice||invoice.amount==null) return; // 入金メール・請求書情報未保存のときは対象外
    const box=$("adcostbox");
    if(!box) return;

      $("adcost-manual-open").onclick=async()=>{ ADCOST_STATE.media=""; await adcostRenderPanel(); };
      return;
    }
    ADCOST_STATE.media=guessed;
    await adcostRenderPanel();
  }
  function adcostRenderReflected(){
    const box=$("adcostbox");
    const a=invoice.ad_cost_allocations||[];
    const ym=(invoice.ad_cost_year_month||"").slice(0,7);
    box.innerHTML=`<div class="adcost-box">
      <h3>📢 広告費 <span class="hq-pill green">✅ 反映済み（${esc(ym)}・${esc(invoice.ad_cost_media||"")}）</span></h3>
      <div class="adcost-badge-row">${fmtDT(invoice.ad_cost_reflected_at)}　${a.length}店舗に按分　合計${yen(a.reduce((s,x)=>s+(Number(x.amount)||0),0))}${invoice.ad_cost_sheet_synced_at?"　✅シート反映済み":"　⚠️シートへの反映は未完了（担当Aの対応待ち）"}</div>
    </div>`;
  }
  async function adcostRenderPanel(){
    const box=$("adcostbox");
    box.innerHTML=`<div class="adcost-box"><div style="font-size:12px;color:var(--muted)">読み込み中…</div></div>`;
    if(!ADCOST_STATE.stores){
      const r=await authed("/rest/v1/stores?select=id,name&order=name");
      ADCOST_STATE.stores=(r.ok&&Array.isArray(r.body))?r.body:[];
    }
    if(!ADCOST_STATE.yearMonth){
      const d=invoice.due_date?new Date(invoice.due_date):new Date();
      ADCOST_STATE.yearMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-01`;
    }
    if(!ADCOST_STATE.rows) await adcostComputeAllocation();
    adcostRenderForm();
  }
  function adcostFindStoreByName(name){
    if(!name||!ADCOST_STATE.stores) return null;
    const norm=s=>String(s||"").replace(/\s+/g,"");
    const n=norm(name);
    return ADCOST_STATE.stores.find(s=>norm(s.name)===n)
      || ADCOST_STATE.stores.find(s=>n.includes(norm(s.name))||norm(s.name).includes(n))
      || null;
  }
  async function adcostComputeAllocation(){
    const total=Number(invoice.amount)||0;
    // a) 今組んでいる仕訳（🧾仕訳を作成）の明細行に部門（店舗）が設定されていれば、それをそのまま使う
    // （2026-08-31: 借方・貸方が別々の金額を持てるようになったため、部門が付く側＝通常は借方の金額を使う）
    const branchesWithDept=(MFJ_STATE.branches||[]).filter(b=>b.department_id&&(Number(b.debitAmount)>0||Number(b.creditAmount)>0));
    if(branchesWithDept.length){
      const rows=[];
      for(const b of branchesWithDept){
        const dept=(MFJ_STATE.departments||[]).find(d=>d.id===b.department_id);
        const store=dept?adcostFindStoreByName(dept.name):null;
        const amt=Number(b.debitAmount)>0?Number(b.debitAmount):Number(b.creditAmount)||0;
        if(store&&amt>0) rows.push({store_id:store.id,store_name:store.name,amount:Math.round(amt)});
      }
      if(rows.length){ ADCOST_STATE.rows=rows; ADCOST_STATE.source="mf_department"; return; }
    }
    // b) 前月・同媒体で反映済みの請求書があれば、その店舗比率で今回の金額を按分する
    if(ADCOST_STATE.media){
      const cur=new Date(ADCOST_STATE.yearMonth);
      const prev=new Date(cur.getFullYear(),cur.getMonth()-1,1);
      const prevYm=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}-01`;
      const r=await authed(`/rest/v1/invoices?ad_cost_reflected_at=not.is.null&ad_cost_media=eq.${encodeURIComponent(ADCOST_STATE.media)}&ad_cost_year_month=eq.${prevYm}&select=ad_cost_allocations`);
      const prevRows=(r.ok&&Array.isArray(r.body))?r.body:[];
      const sums=new Map(); let grand=0;
      for(const row of prevRows) for(const a of (row.ad_cost_allocations||[])){
        const amt=Number(a.amount)||0; grand+=amt;
        const c=sums.get(a.store_id)||{store_name:a.store_name,amount:0}; c.amount+=amt; sums.set(a.store_id,c);
      }
      if(grand>0){
        const rows=Array.from(sums,([store_id,v])=>({store_id,store_name:v.store_name,amount:Math.round(total*(v.amount/grand))}));
        const sum=rows.reduce((s,x)=>s+x.amount,0);
        if(rows.length) rows[rows.length-1].amount+=(total-sum); // 端数調整
        ADCOST_STATE.rows=rows; ADCOST_STATE.source="prev_month_ratio";
        return;
      }
    }
    // c) 参考になる情報が無ければ、店舗を手で選んでもらう1行だけ用意する
    ADCOST_STATE.rows=[{store_id:"",store_name:"",amount:total}];
    ADCOST_STATE.source="manual";
  }
  function adcostSourceLabel(){
    return {
      mf_department:"📊 今組んでいる仕訳（🧾仕訳を作成）の部門（店舗）別金額から自動で割り振りました。",
      prev_month_ratio:"📊 店舗別の内訳が請求書に無かったため、前月の同媒体の店舗比率から按分しています。",
      manual:"📊 参考にできる情報が無かったため、店舗を選んで金額を入力してください。",
    }[ADCOST_STATE.source]||"";
  }
  function adcostRowHtml(row,idx){

  }
  function adcostRenderForm(){
    const box=$("adcostbox");

    const invAmt=Number(invoice.amount)||0;

    box.innerHTML=`<div class="adcost-box">

      <div class="ai-grid">
        <div class="ai-field"><small>媒体</small><select id="adcost-media">${mediaOptions.map(m=>`<option ${ADCOST_STATE.media===m?"selected":""}>${esc(m)}</option>`).join("")}</select></div>
        <div class="ai-field"><small>対象年月</small><input id="adcost-ym" type="month" value="${ADCOST_STATE.yearMonth.slice(0,7)}"></div>

      </div>
      <div class="mail-actions" style="margin-top:10px"><button class="primary" id="adcost-confirm">📢 この内容で広告費に反映</button></div>
      <div class="adcost-hint">💡 反映は「🧾仕訳を作成」で仕訳登録するのと同時に行うのが基本ですが、先にこちらだけ確定しても構いません。広告費用対効果_管理シートとBigQueryへの実際の書き込みは担当Aの対応が完了してから有効になります（それまでは反映内容の記録のみです）。</div>
      <div class="err" id="adcost-msg" style="margin-top:6px"></div>
    </div>`;
    $("adcost-media").onchange=()=>{ ADCOST_STATE.media=$("adcost-media").value; };
    $("adcost-ym").onchange=()=>{ ADCOST_STATE.yearMonth=$("adcost-ym").value+"-01"; };
    document.querySelectorAll(".adcost-store").forEach(el=>el.onchange=()=>{
      const idx=+el.dataset.idx, s=ADCOST_STATE.stores.find(x=>x.id===el.value);
      ADCOST_STATE.rows[idx].store_id=el.value; ADCOST_STATE.rows[idx].store_name=s?s.name:"";
    });
    document.querySelectorAll(".adcost-amount").forEach(el=>el.oninput=()=>{
      ADCOST_STATE.rows[+el.dataset.idx].amount=el.value; adcostUpdateTotals();
    });
    document.querySelectorAll("[data-adcostrm]").forEach(el=>el.onclick=()=>{ ADCOST_STATE.rows.splice(+el.dataset.adcostrm,1); adcostRenderForm(); });
    $("adcost-add-row").onclick=()=>{ ADCOST_STATE.rows.push({store_id:"",store_name:"",amount:0}); adcostRenderForm(); };
    $("adcost-recalc").onclick=async()=>{ ADCOST_STATE.rows=null; await adcostComputeAllocation(); adcostRenderForm(); };
    $("adcost-confirm").onclick=adcostConfirm;
  }
  async function adcostConfirm(){
    const msg=$("adcost-msg"); msg.className="err"; msg.textContent="";
    const media=($("adcost-media")?.value||"").trim();
    if(!media){ msg.textContent="媒体を選んでください"; return; }
    const rows=ADCOST_STATE.rows.filter(r=>r.store_id&&Number(r.amount)>0);
    if(!rows.length){ msg.textContent="店舗と金額を入力してください"; return; }
    const total=rows.reduce((s,r)=>s+Number(r.amount),0);
    const invAmt=Number(invoice.amount)||0;
    if(total!==invAmt && !confirm(`割り振り合計（${yen(total)}）が請求書合計（${yen(invAmt)}）と一致していません。このまま反映しますか？`)) return;
    $("adcost-confirm").disabled=true; msg.textContent="反映中…";

  const mfjCall=mfCall; // 設定タブと共通化（2026-08-31。トップレベルのmfCall()を参照するだけ）

  // 勘定科目の検索用インデックスを構築（datalistの表示名→id の逆引き用）
  function mfjBuildAccountIndex(){
    const map=new Map(); // label -> {account_id, sub_account_id, account_name, sub_account_name}
    let dl="";
    for(const a of (MFJ_STATE.accounts||[])){
      map.set(a.name,{account_id:a.id,sub_account_id:null,account_name:a.name,sub_account_name:null});
      dl+=`<option value="${esc(a.name)}">`;
      for(const sa of (a.sub_accounts||[])){
        const label=`${a.name}/${sa.name}`;
        map.set(label,{account_id:a.id,sub_account_id:sa.id,account_name:a.name,sub_account_name:sa.name});
        dl+=`<option value="${esc(label)}">`;
      }
    }
    MFJ_STATE.accountLabelMap=map;
    MFJ_STATE.accountDatalistHtml=dl;
  }
  function mfjLabelOf(side){ // {account_name, sub_account_name} -> 表示名
    if(!side||!side.account_name) return "";
    return side.sub_account_name?`${side.account_name}/${side.sub_account_name}`:side.account_name;
  }

  // 会社名の表記ゆれを吸収して比較するための正規化（法人格・全角/半角スペース等を除去）
  function mfjNormCompanyName(s){
    return String(s||"").replace(/株式会社|有限会社|合同会社|（株）|（有）|\(株\)|\(有\)|御中|様/g,"").replace(/\s+/g,"").toLowerCase();
  }
  function mfjMatchTenant(addressee,tenants){
    const norm=mfjNormCompanyName(addressee);
    if(!norm) return null;
    const hits=tenants.filter(t=>{
      const tn=mfjNormCompanyName(t.label);
      return tn&&(norm.includes(tn)||tn.includes(norm));
    });
    return hits.length===1?hits[0]:null; // 複数/0件は自動選択しない（誤登録防止）
  }

  function mfjShowTenantPicker(tenants){
    const body=$("mfj-body");
    body.innerHTML=`<div class="ai-field"><small>登録先の事業者を選んでください</small>
      <div class="mail-actions" style="margin-top:6px">${tenants.map(t=>`<button data-mfjtenant="${esc(t.id)}">${esc(t.label)}</button>`).join("")}</div>
    </div>`;
    document.querySelectorAll("[data-mfjtenant]").forEach(btn=>btn.onclick=()=>mfjLoadForTenant(btn.dataset.mfjtenant,tenants));
  }

  async function mfjRenderInitial(){
    const body=$("mfj-body");
    body.innerHTML="読み込み中…（連携先の事業者を確認しています）";
    const tRes=await mfjCall("list_tenants");
    const tenants=(tRes.ok&&tRes.body.tenants)||[];
    if(tenants.length>1){
      // AI自動入力で宛先会社名が読み取れていれば、事業者ラベルと突き合わせて自動選択を試みる
      // （読み取り違いのリスクがあるため、選んだ後も画面に「自動選択」の旨と変更ボタンを必ず出す）
      const autoMatch=mfjMatchTenant(SELECTED._aiAddressee,tenants);
      if(autoMatch){ mfjLoadForTenant(autoMatch.id,tenants,SELECTED._aiAddressee); return; }
      mfjShowTenantPicker(tenants);
      return;
    }
    mfjLoadForTenant(tenants[0]?tenants[0].id:"default",tenants);
  }

  // 仕訳辞書（事業者ごとに登録した仕訳テンプレート。設定タブでも管理できる）を取得
  async function mfjFetchTemplates(tenantId){
    const r=await authed(`/rest/v1/mf_journal_templates?tenant_id=eq.${encodeURIComponent(tenantId)}&select=id,label,branches&order=label`);
    return (r.ok&&Array.isArray(r.body))?r.body:[];
  }

  async function mfjLoadForTenant(tenantId,tenants,autoMatchedFrom){
    const body=$("mfj-body");
    body.innerHTML="読み込み中…（勘定科目・過去の仕訳・仕訳辞書を確認しています）";
    const inv=SELECTED.invoice;
    const vendorName=(inv&&inv.vendor_name)||"";
    // 同時に呼ぶとマネーフォワード側のトークン更新が競合することがあるため直列で呼ぶ
    const accRes=await mfjCall("accounts",{tenant_id:tenantId});
    if(!accRes.ok){ body.innerHTML=`<div class="err">勘定科目の取得に失敗しました: ${esc(accRes.body.error||"")}${accRes.body.detail?"（詳細: "+esc(JSON.stringify(accRes.body.detail))+"）":""}<br><button id="mfj-retry" style="margin-top:8px">🔄 もう一度試す</button></div>`; if($("mfj-retry")) $("mfj-retry").onclick=mfjRenderInitial; return; }
    const sugRes=await mfjCall("suggest",{vendor_name:vendorName,tenant_id:tenantId});
    const listRes=await mfjCall("list_journals",{keyword:vendorName,tenant_id:tenantId});
    // suggestが（vendor_name空欄等で）部門を返せなかった場合は、部門専用の問い合わせで代用する
    const deptRes=(sugRes.ok&&sugRes.body.departments&&sugRes.body.departments.length)?sugRes:await mfjCall("list_departments",{tenant_id:tenantId});
    const templates=await mfjFetchTemplates(tenantId);
    const tenantLabel=(tenants||[]).find(t=>t.id===tenantId)?.label||tenantId;
    MFJ_STATE={
      tenantId, tenantLabel, tenants: tenants||[], autoMatchedFrom: autoMatchedFrom||null,
      mode:"journal", // 既定は①仕訳日記帳から選ぶ。候補が無ければ②仕訳辞書→③直接入力の順で切替
      accounts: accRes.body.accounts||[],
      departments: (deptRes.ok&&deptRes.body.departments)||[],
      journalResults: (listRes.ok&&listRes.body.results)||[],
      journalKeyword: vendorName,
      templates,
      branches: [], // 確定した明細行（複数行=複合仕訳/振替伝票）
      amount: (inv&&inv.amount!=null)?inv.amount:0,
      remark: vendorName,
      date: (inv&&inv.due_date)||new Date().toISOString().slice(0,10),
    };
    mfjBuildAccountIndex();
    // 過去の仕訳の候補が1件も無ければ、仕訳辞書があればそちらを優先→どちらも無ければ直接入力へ
    if(!MFJ_STATE.journalResults.length) MFJ_STATE.mode=MFJ_STATE.templates.length?"dict":"manual";
    if(MFJ_STATE.mode==="manual") mfjAddBranchRow();
    mfjRenderForm();
  }

  // 2026-08-31: 借方・貸方を1行=同額のペアに固定していたのをやめ、行ごとに借方だけ・貸方だけでも
  // よい形に変更（ユーザー報告「借方2行(手数料1900+100)を貸方1行(買掛金2000)にまとめたい」に対応）。
  // マネーフォワードの公式API仕様（CRUDJournalLine）でcreditor/debitorがどちらもrequiredでない
  // ことを確認済み。貸借バランスは行ごとではなく全行の合計で見る
  function mfjAddBranchRow(){
    const isFirst=!MFJ_STATE.branches.length;
    const amt=isFirst?MFJ_STATE.amount:"";
    MFJ_STATE.branches.push({debitLabel:"",debitAmount:amt,creditLabel:"",creditAmount:amt,department_id:"",remark:""});
  }
  // 仕訳辞書・過去の仕訳の複数行をまとめて明細行エディタへ反映し、直接入力モードへ切り替える
  function mfjApplyBranches(branches){
    MFJ_STATE.branches=branches.length?branches:[{debitLabel:"",debitAmount:MFJ_STATE.amount||"",creditLabel:"",creditAmount:MFJ_STATE.amount||"",department_id:"",remark:""}];
    MFJ_STATE.mode="manual";
    mfjRenderForm();
  }

  // 振替伝票入力（マネーフォワードの入力画面と同じ、借方/貸方を横に並べた表形式）の1行分。
  // 借方・貸方どちらか片方だけの入力も可（空欄のまま登録すればその行はその側を持たない明細になる）
  function mfjBranchRowHtml(br,idx){
    const deptOptions=`<option value="">（指定なし）</option>`+MFJ_STATE.departments.map(d=>`<option value="${esc(d.id)}" ${br.department_id===d.id?"selected":""}>${esc(d.name)}</option>`).join("");
    return `<tr class="mfj-branch-row" data-idx="${idx}">
      <td class="mfj-rmcell">${MFJ_STATE.branches.length>1?`<button data-mfjrm="${idx}" title="この行を削除">−</button>`:""}</td>
      <td>
        <input list="mfj-acc-datalist" class="mfj-branch-debit" data-idx="${idx}" value="${esc(br.debitLabel||"")}" placeholder="借方勘定科目（空欄可）">
        <select class="mfj-branch-dept" data-idx="${idx}" style="margin-top:4px">${deptOptions}</select>
      </td>
      <td><input type="number" class="mfj-branch-debit-amount mfj-amt" data-idx="${idx}" value="${br.debitAmount??""}" placeholder="金額"></td>
      <td><input list="mfj-acc-datalist" class="mfj-branch-credit" data-idx="${idx}" value="${esc(br.creditLabel||"")}" placeholder="貸方勘定科目（空欄可）"></td>
      <td><input type="number" class="mfj-branch-credit-amount mfj-amt" data-idx="${idx}" value="${br.creditAmount??""}" placeholder="金額"></td>
      <td><textarea class="mfj-branch-remark" data-idx="${idx}" placeholder="行ごとの摘要（空欄なら全体の摘要を使用）">${esc(br.remark||"")}</textarea></td>
    </tr>`;
  }

  function mfjUpdateBalance(){
    const totalDebit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.debitAmount)||0),0);
    const totalCredit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.creditAmount)||0),0);
    if($("mfj-debit-total")) $("mfj-debit-total").textContent=yen(totalDebit);
    if($("mfj-credit-total")) $("mfj-credit-total").textContent=yen(totalCredit);
    if($("mfj-diff-amt")) $("mfj-diff-amt").textContent=yen(totalDebit-totalCredit);
    if($("mfj-diff-box")) $("mfj-diff-box").className="box "+(totalDebit===totalCredit?"ok":"ng");
  }

  function mfjWireBranchRows(){
    document.querySelectorAll(".mfj-branch-debit").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].debitLabel=el.value; });
    document.querySelectorAll(".mfj-branch-credit").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].creditLabel=el.value; });
    document.querySelectorAll(".mfj-branch-dept").forEach(el=>el.onchange=()=>{ MFJ_STATE.branches[+el.dataset.idx].department_id=el.value; });
    document.querySelectorAll(".mfj-branch-remark").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].remark=el.value; });
    document.querySelectorAll(".mfj-branch-debit-amount").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].debitAmount=el.value; mfjUpdateBalance(); });
    document.querySelectorAll(".mfj-branch-credit-amount").forEach(el=>el.oninput=()=>{ MFJ_STATE.branches[+el.dataset.idx].creditAmount=el.value; mfjUpdateBalance(); });
    document.querySelectorAll("[data-mfjrm]").forEach(el=>el.onclick=()=>{ MFJ_STATE.branches.splice(+el.dataset.mfjrm,1); mfjRenderForm(); });
  }

  async function mfjRunJournalSearch(kw){
    $("mfj-journal-results").innerHTML="検索中…";
    const r=await mfjCall("list_journals",{keyword:kw,tenant_id:MFJ_STATE.tenantId});
    MFJ_STATE.journalResults=(r.ok&&r.body.results)||[];
    MFJ_STATE.journalKeyword=kw;
    mfjRenderJournalResults();
  }
  function mfjRenderJournalResults(){
    const el=$("mfj-journal-results");
    if(!el) return;
    const rs=MFJ_STATE.journalResults;
    el.innerHTML=rs.length?rs.map((r,i)=>`<div class="ai-field" style="margin-bottom:4px"><small>${esc(r.transaction_date||"")}</small>${esc(r.summary)}<div class="mail-actions" style="margin-top:4px"><button data-mfjpick="${i}" style="font-size:12px">この仕訳を使う</button></div></div>`).join("")
      :`<div style="font-size:12px;color:var(--muted)">${MFJ_STATE.journalKeyword?"該当する過去の仕訳が見つかりませんでした":"キーワードを入力して検索してください"}</div>`;
    document.querySelectorAll("[data-mfjpick]").forEach(btn=>btn.onclick=()=>{
      const r=MFJ_STATE.journalResults[+btn.dataset.mfjpick];
      const amt=MFJ_STATE.amount||(r.template.debit&&r.template.debit.value)||(r.template.credit&&r.template.credit.value)||"";
      mfjApplyBranches([{
        debitLabel:mfjLabelOf(r.template.debit), debitAmount:r.template.debit?amt:"",
        creditLabel:mfjLabelOf(r.template.credit), creditAmount:r.template.credit?amt:"",
        department_id:(r.template.debit&&r.template.debit.department_id)||(r.template.credit&&r.template.credit.department_id)||"",
        remark:r.template.remark||"",
      }]);
    });
  }

  // 仕訳辞書（管理システム内で登録したテンプレート。1件で複数の明細行を持てる＝振替伝票まるごと保存できる）
  function mfjRenderTemplateResults(){
    const el=$("mfj-tpl-results");
    if(!el) return;
    const tpls=MFJ_STATE.templates||[];
    el.innerHTML=tpls.length?tpls.map((t,i)=>{
      const sum=(t.branches||[]).map(b=>`${mfjLabelOf(b.debit)||"?"}／${mfjLabelOf(b.credit)||"?"}`).join("、");
      return `<div class="mfj-tpl-item"><div><div class="lbl">${esc(t.label)}</div><div class="sum">${esc(sum)}（${(t.branches||[]).length}行）</div></div><button data-mfjtpluse="${i}" style="font-size:12px;white-space:nowrap">この仕訳辞書を使う</button></div>`;
    }).join("")
      :`<div style="font-size:12px;color:var(--muted)">この事業者にはまだ仕訳辞書が登録されていません。「🔧 直接入力」で内容を作ってから「💾 仕訳辞書に登録」で追加できます（設定タブでも管理できます）。</div>`;
    document.querySelectorAll("[data-mfjtpluse]").forEach(btn=>btn.onclick=()=>{
      const t=MFJ_STATE.templates[+btn.dataset.mfjtpluse];
      // 古い仕訳辞書（貸借同額の共通amount形式）・新しい仕訳辞書（辺ごとにvalueを持つ形式）の両方に対応
      const branches=(t.branches||[]).map(b=>({
        debitLabel:mfjLabelOf(b.debit), debitAmount:b.debit?(b.debit.value??b.amount??MFJ_STATE.amount??""):"",
        creditLabel:mfjLabelOf(b.credit), creditAmount:b.credit?(b.credit.value??b.amount??MFJ_STATE.amount??""):"",
        department_id:b.department_id||"", remark:b.remark||"",
      }));
      mfjApplyBranches(branches);
    });
  }

  // 今組んでいる明細行を仕訳辞書として保存（次回から「📗 仕訳辞書から選ぶ」に出てくる）
  async function mfjSaveAsTemplate(){
    const label=(prompt("仕訳辞書として登録する名前を入力してください（例: 【未払金】アルバイト給与）")||"").trim();
    if(!label) return;
    const structured=[];
    for(const b of MFJ_STATE.branches){
      const debit=b.debitLabel?MFJ_STATE.accountLabelMap.get(b.debitLabel):null;
      const credit=b.creditLabel?MFJ_STATE.accountLabelMap.get(b.creditLabel):null;
      if(b.debitLabel&&!debit){ alert("借方はプルダウンの候補から選んでから登録してください"); return; }
      if(b.creditLabel&&!credit){ alert("貸方はプルダウンの候補から選んでから登録してください"); return; }
      if(!debit&&!credit) continue;
      structured.push({
        debit:debit?{...debit,value:Number(b.debitAmount)||null}:null,
        credit:credit?{...credit,value:Number(b.creditAmount)||null}:null,
        department_id:b.department_id||null, department_name:(MFJ_STATE.departments.find(d=>d.id===b.department_id)||{}).name||null,
        remark:b.remark||null,
      });
    }
    if(!structured.length){ alert("明細行がありません"); return; }
    const msg=$("mfj-msg");
    const r=await authed("/rest/v1/mf_journal_templates",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({tenant_id:MFJ_STATE.tenantId,label,branches:structured,created_by:ME.id})});
    if(!r.ok){ msg.className="err"; msg.textContent="仕訳辞書への登録に失敗しました"; return; }
    msg.className="err msg-ok"; msg.textContent=`仕訳辞書「${label}」に登録しました`;
    MFJ_STATE.templates=await mfjFetchTemplates(MFJ_STATE.tenantId);
  }

  function mfjRenderForm(){
    const body=$("mfj-body");
    const mode=MFJ_STATE.mode;
    const totalDebit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.debitAmount)||0),0);
    const totalCredit=MFJ_STATE.branches.reduce((s,b)=>s+(Number(b.creditAmount)||0),0);
    body.innerHTML=`
      <datalist id="mfj-acc-datalist">${MFJ_STATE.accountDatalistHtml||""}</datalist>
      ${MFJ_STATE.tenants&&MFJ_STATE.tenants.length>1?`<div class="ai-field" style="margin-bottom:6px;font-size:11px;color:${MFJ_STATE.autoMatchedFrom?"var(--accent)":"var(--muted)"}">登録先: <b>${esc(MFJ_STATE.tenantLabel||"")}</b> <button id="mfj-change-tenant" style="font-size:10px">変更</button>${MFJ_STATE.autoMatchedFrom?`<br>⚠️ 宛先「${esc(MFJ_STATE.autoMatchedFrom)}」から自動選択しました。<b>本当にこの事業者で合っていますか？</b>違う場合は「変更」から選び直してください`:""}</div>`:""}
      <div class="mail-actions" style="margin-bottom:8px">
        <button data-mfjmode="journal" ${mode==="journal"?'class="primary"':""}>📖 過去の仕訳から選ぶ</button>
        <button data-mfjmode="dict" ${mode==="dict"?'class="primary"':""}>📗 仕訳辞書から選ぶ${MFJ_STATE.templates.length?`（${MFJ_STATE.templates.length}）`:""}</button>
        <button data-mfjmode="manual" ${mode==="manual"?'class="primary"':""}>🔧 直接入力</button>
      </div>
      ${mode==="journal"?`<div id="mfj-journal-picker">
        <input id="mfj-journal-search" placeholder="会社名や勘定科目名で検索" value="${esc(MFJ_STATE.journalKeyword||"")}">
        <div id="mfj-journal-results" style="margin-top:6px"></div>
      </div>`:mode==="dict"?`<div id="mfj-tpl-picker">
        <div id="mfj-tpl-results"></div>
      </div>`:`
      <div class="mfj-balance">
        <div class="box"><small>借方合計</small><b id="mfj-debit-total">${yen(totalDebit)}</b></div>
        <div class="box"><small>貸方合計</small><b id="mfj-credit-total">${yen(totalCredit)}</b></div>
        <div class="box ${totalDebit===totalCredit?"ok":"ng"}" id="mfj-diff-box"><small>差額</small><b id="mfj-diff-amt">${yen(totalDebit-totalCredit)}</b></div>
      </div>
      <div class="mfj-gridwrap">
        <table class="mfj-grid">
          <thead>
            <tr><th rowspan="2" style="width:26px"></th><th colspan="2" class="side">借方</th><th colspan="2" class="side" style="background:var(--m-greensoft);color:var(--m-green)">貸方</th><th rowspan="2">摘要（行ごと・任意）</th></tr>
            <tr><th>勘定科目・部門</th><th>金額</th><th>勘定科目</th><th>金額</th></tr>
          </thead>
          <tbody id="mfj-branch-rows">${MFJ_STATE.branches.map((br,i)=>mfjBranchRowHtml(br,i)).join("")}</tbody>
        </table>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px">💡 各行は借方・貸方のどちらか片方だけでも登録できます（例: 借方2行に分けて、貸方は1行にまとめる）。借方合計と貸方合計さえ一致していれば登録できます</div>
      <div class="mail-actions" style="margin-top:6px">
        <button id="mfj-add-row">＋ 明細行を追加（振替伝票・複合仕訳の場合）</button>
        <button id="mfj-save-template">💾 この内容を仕訳辞書に登録</button>
      </div>
      <div class="ai-grid" style="margin-top:8px">
        <div class="ai-field"><small>日付（会計計上日・自由に変更可）</small><input id="mfj-date" type="date" value="${esc(MFJ_STATE.date)}"></div>
        <div class="ai-field"><small>摘要（全体・行ごとの摘要が空の場合に使われます）</small><input id="mfj-remark" value="${esc(MFJ_STATE.remark)}"></div>
      </div>
      ${(SELECTED.atts&&SELECTED.atts.length)?`<div class="ai-field" style="margin-top:8px"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="mfj-attach-files" checked>📎 メールの添付ファイル（${SELECTED.atts.length}件）もマネーフォワードへ証憑として添付する</label></div>`:""}
      <div class="mail-actions" style="margin-top:8px">
        <button class="primary" id="mfj-confirm">👁 プレビュー・確認画面へ</button>
      </div>`}
      <div class="err" id="mfj-msg" style="margin-top:6px"></div>
    `;
    document.querySelectorAll("[data-mfjmode]").forEach(btn=>btn.onclick=()=>{
      MFJ_STATE.mode=btn.dataset.mfjmode;
      if(MFJ_STATE.mode==="manual"&&!MFJ_STATE.branches.length) mfjAddBranchRow();
      mfjRenderForm();
    });
    if($("mfj-change-tenant")) $("mfj-change-tenant").onclick=()=>mfjShowTenantPicker(MFJ_STATE.tenants);
    if(mode==="journal"){
      mfjRenderJournalResults();
      let t=null;
      $("mfj-journal-search").oninput=()=>{ clearTimeout(t); const kw=$("mfj-journal-search").value.trim(); t=setTimeout(()=>mfjRunJournalSearch(kw),350); };
      return;
    }
    if(mode==="dict"){
      mfjRenderTemplateResults();
      return;
    }
    mfjWireBranchRows();
    $("mfj-add-row").onclick=()=>{ mfjAddBranchRow(); mfjRenderForm(); };
    $("mfj-save-template").onclick=mfjSaveAsTemplate;
    $("mfj-confirm").onclick=()=>mfjOpenPreview();
  }

  // プレビュー（マネーフォワード入力画面の振替伝票プレビューと同じ見た目：借方/貸方を並べたカード＋貸借バランス）
  function mfjOpenPreview(){
    const msg=$("mfj-msg"); msg.className="err"; msg.textContent="";
    const branchesPayload=[];
    let totalDebit=0, totalCredit=0;
    for(const b of MFJ_STATE.branches){
      const debit=b.debitLabel?MFJ_STATE.accountLabelMap.get(b.debitLabel):null;
      const credit=b.creditLabel?MFJ_STATE.accountLabelMap.get(b.creditLabel):null;
      if(b.debitLabel&&!debit){ msg.textContent="借方はプルダウンの候補から選択してください（自由入力のままだと登録できません）"; return; }
      if(b.creditLabel&&!credit){ msg.textContent="貸方はプルダウンの候補から選択してください（自由入力のままだと登録できません）"; return; }
      if(!debit&&!credit) continue;
      const dAmt=debit?Number(b.debitAmount):null, cAmt=credit?Number(b.creditAmount):null;
      if(debit&&(!dAmt||dAmt<=0)){ msg.textContent="借方の金額が未入力（0円）の行があります"; return; }
      if(credit&&(!cAmt||cAmt<=0)){ msg.textContent="貸方の金額が未入力（0円）の行があります"; return; }
      if(debit) totalDebit+=dAmt; if(credit) totalCredit+=cAmt;
      branchesPayload.push({debit,debitAmount:dAmt,credit,creditAmount:cAmt,department_id:b.department_id||null,remark:b.remark||""});
    }
    if(!branchesPayload.length){ msg.textContent="明細行がありません"; return; }
    if(totalDebit!==totalCredit){ msg.textContent=`借方合計（${yen(totalDebit)}）と貸方合計（${yen(totalCredit)}）が一致していません`; return; }
    const date=$("mfj-date").value, remark=$("mfj-remark").value;
    const entries=branchesPayload.map(b=>{
      const deptName=(MFJ_STATE.departments.find(d=>d.id===b.department_id)||{}).name||"";
      return `<div class="mfj-preview-entry">
        <div class="mfj-preview-head"><div>借方</div><div>貸方</div></div>
        <div class="mfj-preview-body">
          <div class="mfj-preview-side"><div class="acc">${b.debit?esc(mfjLabelOf(b.debit)):"—"}</div><div class="sub">${esc(deptName)}</div><div class="money">${b.debit?yen(b.debitAmount):"—"}</div></div>
          <div class="mfj-preview-side"><div class="acc">${b.credit?esc(mfjLabelOf(b.credit)):"—"}</div><div class="sub"></div><div class="money">${b.credit?yen(b.creditAmount):"—"}</div></div>
        </div>
        ${b.remark?`<div class="mfj-preview-remark">${esc(b.remark)}</div>`:""}
      </div>`;
    }).join("");

    const modal=document.createElement("div");
    modal.className="modal-bg"; modal.id="mfjPreviewModal";
    modal.innerHTML=`<div class="modal" style="max-width:820px">
      <div class="mhead"><h2>🧾 振替伝票プレビュー</h2><button class="linkbtn" id="mfjPreviewClose" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px">閉じる ×</button></div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">登録先: <b>${esc(MFJ_STATE.tenantLabel||MFJ_STATE.tenantId)}</b>　日付: <b>${esc(date)}</b>　全体の摘要: <b>${esc(remark||"（なし）")}</b></div>
      <div class="mfj-balance" style="margin:0 0 10px">
        <div class="box"><small>借方合計</small><b>${yen(totalDebit)}</b></div>
        <div class="box"><small>貸方合計</small><b>${yen(totalCredit)}</b></div>
        <div class="box ok"><small>差額</small><b>¥0</b></div>
      </div>
      ${entries}
      <div class="err" id="mfjPreviewMsg" style="margin-top:6px"></div>
      <div class="mail-actions" style="margin-top:12px">
        <button id="mfjPreviewBack">← 戻って修正</button>
        <button class="primary" id="mfjPreviewSubmit">✅ この内容で登録</button>
      </div>
    </div>`;
    document.body.appendChild(modal);
    pushNav({modal:true});
    modal.onclick=e=>{ if(e.target===modal) history.back(); };
    $("mfjPreviewClose").onclick=()=>history.back();
    $("mfjPreviewBack").onclick=()=>history.back();
    $("mfjPreviewSubmit").onclick=async()=>{
      $("mfjPreviewSubmit").disabled=true;
      const pmsg=$("mfjPreviewMsg"); pmsg.className="err"; pmsg.textContent="登録中…";
      const payload={
        invoice_id: SELECTED.invoice.id,
        tenant_id: MFJ_STATE.tenantId,
        branches: branchesPayload.map(b=>({
          debit:b.debit?{account_id:b.debit.account_id,sub_account_id:b.debit.sub_account_id||undefined,value:b.debitAmount}:undefined,
          credit:b.credit?{account_id:b.credit.account_id,sub_account_id:b.credit.sub_account_id||undefined,value:b.creditAmount}:undefined,
          department_id:b.department_id||null, remark:b.remark||undefined,
        })),
        transaction_date: date,
        remark,
        linked_hq_step_id: LINKED_HQ_STEP?LINKED_HQ_STEP.id:null, // 保存前でも画面上の選択を優先させる（DB保存漏れ対策）
        attach_files: $("mfj-attach-files")?$("mfj-attach-files").checked:false,
      };
      const {ok,body:j}=await mfjCall("create",payload);
      if(!ok){ pmsg.textContent=j.error||"登録に失敗しました"; $("mfjPreviewSubmit").disabled=false; return; }
      pmsg.className="err msg-ok";
      pmsg.textContent=`登録しました（伝票番号: ${j.journal_number??"-"}）`
        +(j.voucher_attached?`。添付ファイルも${j.voucher_attached}件添付しました`:j.voucher_error?`（添付: ${j.voucher_error}）`:"")
        +(LINKED_HQ_STEP?(j.hq_step_completed?"。紐付けた本部タスクの工程も完了にしました":j.hq_step_error?`（本部タスクの自動完了には失敗: ${j.hq_step_error}）`:""):"")
        +"。画面を更新します…";
      setTimeout(()=>{ history.back(); reloadDetail(); },900);
    };
  }

  // ダウンロードリンク＋パスワード式などメールに直接添付がない請求書を、ダウンロード後に
  // 手動でアップロードしてこのメールへ紐付ける（ファイルはユーザー自身のJWTでstorageへ直接
  // アップロードし、invoice_attach_manual_file RPCでメタデータ登録＋監査ログに記録）
  if($("manual-att-drop")){
    const drop=$("manual-att-drop");
    ["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background="var(--m-bg,#f4f1eb)"; drop.style.borderColor="var(--accent)"; }));
    ["dragleave","dragend"].forEach(ev=>drop.addEventListener(ev,e=>{ e.preventDefault(); drop.style.background=""; drop.style.borderColor=""; }));
    drop.addEventListener("drop",e=>{
      e.preventDefault(); drop.style.background=""; drop.style.borderColor="";
      const f=e.dataTransfer.files&&e.dataTransfer.files[0];
      if(f) $("manual-att-file").files=e.dataTransfer.files;
    });
  }
  $("manual-att-upload").onclick=async()=>{
    const msg=$("manual-att-msg");
    const f=$("manual-att-file").files[0];
    if(!f){ msg.textContent="ファイルを選択してください"; return; }
    $("manual-att-upload").disabled=true; msg.className="err"; msg.textContent="アップロード中…";
    try{
      const buf=await f.arrayBuffer();
      const hashBuf=await crypto.subtle.digest("SHA-256",buf);
      const hash=Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,"0")).join("");
      const ext=(f.name.split(".").pop()||"").toLowerCase().replace(/[^a-z0-9]/g,"");
      const path=`${emailId}/manual_${Date.now()}${ext?"."+ext:""}`;
      const s=sess.get();
      const upRes=await fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${path}`,{
        method:"POST",
        headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:""),"Content-Type":f.type||"application/octet-stream"},
        body:buf
      });
      if(!upRes.ok) throw new Error("アップロードに失敗しました");
      const r=await authed("/rest/v1/rpc/invoice_attach_manual_file",{method:"POST",body:JSON.stringify({
        p_email_id:emailId, p_file_name:f.name, p_mime_type:f.type||null, p_storage_path:path, p_file_hash:hash, p_size_bytes:f.size
      })});
      if(!r.ok) throw new Error((r.body&&r.body.message)||"登録に失敗しました");
      msg.className="err msg-ok"; msg.textContent="追加しました";
      await openMailDetail(u,emailId,true);
    }catch(e){
      msg.textContent="エラー: "+e.message; $("manual-att-upload").disabled=false;
    }
  };

  $("comment-add").onclick=async()=>{
    const body=$("comment-body").value.trim();
    const msg=$("comment-msg");
    if(!body){ msg.textContent="コメントを入力してください"; return; }
    $("comment-add").disabled=true; msg.className="err"; msg.textContent="追加中…";
    const r=await authed("/rest/v1/rpc/invoice_add_comment",{method:"POST",body:JSON.stringify({p_email_id:emailId,p_body:body})});
    if(!r.ok){ msg.textContent=(r.body&&r.body.message)||"追加できませんでした"; $("comment-add").disabled=false; return; }
    await reloadDetail();
  };

  $("reply-open").onclick=()=>{ $("replybox").classList.toggle("open"); };
  $("reply-confirm").onclick=()=>{
    const body=$("reply-body").value.trim();
    if(!body){ $("reply-msg").textContent="本文を入力してください"; return; }
    $("reply-preview").textContent=body;
    $("replyconfirm").style.display="block";
  };
  $("reply-cancel").onclick=()=>{ $("replyconfirm").style.display="none"; };
  $("reply-send").onclick=async()=>{
    $("reply-send").disabled=true; $("reply-msg").textContent="送信中…";
    const body=$("reply-body").value.trim();
    const qr=await authed("/rest/v1/rpc/invoice_queue_reply",{method:"POST",body:JSON.stringify({p_email_id:emailId,p_body:body})});
    if(!qr.ok){ $("reply-msg").textContent=(qr.body&&qr.body.message)||"送信予約に失敗しました"; $("reply-send").disabled=false; return; }
    const outboxId=qr.body;
    const s=sess.get();
    const sr=await fetch(SUPA_URL+"/functions/v1/invoice-send",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+(s?s.at:"")},body:JSON.stringify({outbox_id:outboxId})});
    const sj=await sr.json().catch(()=>({}));
    $("reply-msg").className="err msg-ok";
    $("reply-msg").textContent=(sr.ok&&sj.success)?"送信しました":"送信予約は完了しました。数分以内に自動で再送されます。";
    await reloadDetail();
  };
}

/* ============================================================
   請求書一覧／売上一覧タブ（検索・絞り込み・ソート・期限バッジ＝2026-08-24 Phase1.5 C-2）
   2026-08-25 Phase1.6: mail_kind別（invoice/sales）に共通ロジックを流用できるようパラメータ化
   ============================================================ */
let LIST_KIND="invoice"; // invoice | sales（今どちらの一覧タブを描画中か）
// 2026-08-26 C-6: primarySource="invoice_emails"のkindは、invoicesテーブルへの保存(💾)が
// まだでも「種類を選んだ時点」で一覧に出す（未入力行はvendor_name等がnullのまま表示）。
// invoiceは既存どおりinvoicesテーブル起点（登録済みのみ表示）を維持＝851件中850件が未保存の
// 現状で挙動を変えると請求書一覧の意味が激変してしまうため、売上のみ変更する
const LIST_KIND_CONFIG={
  invoice:{statusLabel:INVOICE_STATUS_LABEL,vendorLabel:"請求元",numberLabel:"請求番号",amountLabel:"金額",dateLabel:"期限",searchPlaceholder:"🔎 請求元・番号・件名",emptyLabel:"該当する請求書はありません",primarySource:"invoices"},
  sales:{statusLabel:SALES_STATUS_LABEL,vendorLabel:"入金元",numberLabel:"明細番号",amountLabel:"入金額",dateLabel:"入金予定日",searchPlaceholder:"🔎 入金元・明細番号・件名",emptyLabel:"種類が「売上」のメールはありません",primarySource:"invoice_emails"},
};
function dueBadgeHtml(row){
  const label=fmtD(row.due_date);
  if(!row.due_date||["paid","cancelled"].includes(row.invoice_status)) return esc(label);
  const today=new Date(); today.setHours(0,0,0,0);
  const due=new Date(row.due_date+"T00:00:00");
  const diffDays=Math.round((due-today)/86400000);
  if(diffDays<0) return `<span class="due-badge overdue">⚠️ ${esc(label)}（超過）</span>`;
  if(diffDays<=7) return `<span class="due-badge soon">${esc(label)}（あと${diffDays}日）</span>`;
  return esc(label);
}
function filteredSortedInvoiceRows(){
  let list=IV_ROWS;
  if(IV_STATUS) list=list.filter(r=>r.invoice_status===IV_STATUS);
  if(IV_AMOUNT_MIN!=="") list=list.filter(r=>r.amount!=null&&r.amount>=+IV_AMOUNT_MIN);
  if(IV_AMOUNT_MAX!=="") list=list.filter(r=>r.amount!=null&&r.amount<=+IV_AMOUNT_MAX);
  if(IV_DUE_FROM) list=list.filter(r=>r.due_date&&r.due_date>=IV_DUE_FROM);
  if(IV_DUE_TO) list=list.filter(r=>r.due_date&&r.due_date<=IV_DUE_TO);
  if(IV_SEARCH_Q.trim()){
    const q=IV_SEARCH_Q.trim().toLowerCase();
    list=list.filter(r=>(r.vendor_name||"").toLowerCase().includes(q)
      ||(r.invoice_number||"").toLowerCase().includes(q)
      ||(r.email&&r.email.subject||"").toLowerCase().includes(q)
      ||(r.email&&r.email.from_address||"").toLowerCase().includes(q));
  }
  if(IV_SORT_COL){
    // amountはPostgRESTがnumericを文字列で返す場合があるため数値化してから比較
    const norm=v=>{ if(v==null) return null; return IV_SORT_COL==="amount"?Number(v):v; };
    list=[...list].sort((a,b)=>{
      const av=norm(a[IV_SORT_COL]), bv=norm(b[IV_SORT_COL]);
      if(av==null&&bv==null) return 0;
      if(av==null) return 1; // nullは常に末尾
      if(bv==null) return -1;
      if(av<bv) return IV_SORT_DIR==="asc"?-1:1;
      if(av>bv) return IV_SORT_DIR==="asc"?1:-1;
      return 0;
    });
  }
  return list;
}
function invoiceListBodyHtml(){
  const cfg=LIST_KIND_CONFIG[LIST_KIND];
  const list=filteredSortedInvoiceRows();
  const arrow=col=>IV_SORT_COL===col?(IV_SORT_DIR==="asc"?" ▲":" ▼"):"";
  return `<table class="invoice-table">
    <thead><tr>
      <th>${cfg.vendorLabel}</th><th>${cfg.numberLabel}</th>
      <th data-sort="amount">${cfg.amountLabel}${arrow("amount")}</th>
      <th data-sort="due_date">${cfg.dateLabel}${arrow("due_date")}</th>
      <th>担当</th><th>状態</th>
    </tr></thead>
    <tbody>
      ${list.map(row=>`<tr data-openmail="${row.email_id}">
        <td><b>${esc(row.vendor_name||(row.email&&row.email.from_address)||"—")}</b></td>
        <td>${esc(row.invoice_number||"—")}</td>
        <td>${yen(row.amount)}</td>
        <td>${dueBadgeHtml(row)}</td>
        <td>${esc(row.email&&row.email.processor&&row.email.processor.name||"—")}</td>
        <td><span class="invoice-status ${INVOICE_STATUS_CLASS[row.invoice_status]||'gray'}">${cfg.statusLabel[row.invoice_status]||row.invoice_status}</span>${row.mf_journal_id?' <span class="hq-pill green" style="margin-left:4px">💰会計処理済み</span>':''}</td>
      </tr>`).join("")||`<tr><td colspan="6">${cfg.emptyLabel}</td></tr>`}
    </tbody>
  </table>`;
}
function wireInvoiceListTable(u){
  document.querySelectorAll("[data-openmail]").forEach(el=>el.onclick=()=>openMailDetailModal(u,el.dataset.openmail));
  document.querySelectorAll("[data-sort]").forEach(el=>el.onclick=()=>{
    const col=el.dataset.sort;
    if(IV_SORT_COL===col) IV_SORT_DIR=IV_SORT_DIR==="asc"?"desc":"asc";
    else { IV_SORT_COL=col; IV_SORT_DIR="asc"; }
    $("ivTableWrap").innerHTML=invoiceListBodyHtml();
    wireInvoiceListTable(u);
  });
}

  IV_SEARCH_Q=""; IV_STATUS=""; IV_AMOUNT_MIN=""; IV_AMOUNT_MAX=""; IV_DUE_FROM=""; IV_DUE_TO=""; IV_SORT_COL=""; IV_SORT_DIR="asc";
  if(cfg.primarySource==="invoice_emails"){
    // invoice_emails起点：invoicesへの保存が無くても種類分類だけで一覧に出す（C-6）
    const r=await authed(`/rest/v1/invoice_emails?mail_kind=eq.${kind}&select=id,subject,from_address,processing_user_id,processor:users!invoice_emails_processing_user_id_fkey(name),invoices(id,vendor_name,invoice_number,amount,due_date,invoice_status)&order=received_at.desc&limit=300`);

        amount:iv.amount??null, due_date:iv.due_date??null, invoice_status:iv.invoice_status||"draft",
        email:{subject:e.subject, from_address:e.from_address, processor:e.processor},
      };
    });
  }else{
    const r=await authed(`/rest/v1/invoices?select=*,email:invoice_emails!inner(subject,from_address,mail_kind,processing_user_id,processor:users!invoice_emails_processing_user_id_fkey(name))&email.mail_kind=eq.${kind}&order=created_at.desc&limit=300`);
    IV_ROWS=(r.ok&&Array.isArray(r.body))?r.body:[];
  }
  $("tabbody").innerHTML=`
    <section class="invoice-list active">
      <div class="card" style="margin-bottom:12px">
        <div class="iv-filterbar">
          <div class="ivf"><small>検索</small><input type="search" id="iv-f-search" placeholder="${cfg.searchPlaceholder}" value="${esc(IV_SEARCH_Q)}"></div>
          <div class="ivf"><small>${cfg.amountLabel}（下限）</small><input type="number" id="iv-f-amtmin" value="${esc(IV_AMOUNT_MIN)}"></div>
          <div class="ivf"><small>${cfg.amountLabel}（上限）</small><input type="number" id="iv-f-amtmax" value="${esc(IV_AMOUNT_MAX)}"></div>
          <div class="ivf"><small>${cfg.dateLabel}（開始）</small><input type="date" id="iv-f-duefrom" value="${esc(IV_DUE_FROM)}"></div>
          <div class="ivf"><small>${cfg.dateLabel}（終了）</small><input type="date" id="iv-f-dueto" value="${esc(IV_DUE_TO)}"></div>
          <div class="ivf"><small>状態</small><select id="iv-f-status"><option value="">すべて</option>${Object.entries(cfg.statusLabel).map(([k,l])=>`<option value="${k}" ${IV_STATUS===k?"selected":""}>${l}</option>`).join("")}</select></div>
          <button class="hq-btn" id="iv-f-clear">絞り込み解除</button>
        </div>
      </div>
      <div class="card hq-tablewrap" id="ivTableWrap">${invoiceListBodyHtml()}</div>
    </section>`;
  wireInvoiceListTable(u);
  const applyFilters=()=>{
    IV_SEARCH_Q=$("iv-f-search").value; IV_AMOUNT_MIN=$("iv-f-amtmin").value; IV_AMOUNT_MAX=$("iv-f-amtmax").value;
    IV_DUE_FROM=$("iv-f-duefrom").value; IV_DUE_TO=$("iv-f-dueto").value; IV_STATUS=$("iv-f-status").value;
    $("ivTableWrap").innerHTML=invoiceListBodyHtml();
    wireInvoiceListTable(u);
  };
  $("iv-f-search").oninput=applyFilters;
  $("iv-f-amtmin").oninput=applyFilters; $("iv-f-amtmax").oninput=applyFilters;
  $("iv-f-duefrom").onchange=applyFilters; $("iv-f-dueto").onchange=applyFilters;
  $("iv-f-status").onchange=applyFilters;
  $("iv-f-clear").onclick=()=>renderFinancialListTab(u,kind);
}

/* ============================================================
   設定タブ: 仕訳辞書の管理（登録・編集・削除）2026-08-31
   マネーフォワードの正式な外部連携APIには仕訳辞書を取得する機能が無いため
   （2026-08-31にユーザーへ確認済み・内部非公式APIは規約違反リスクがあり不採用）、
   管理システム自身のDB（mf_journal_templates）に登録して代用する。
   invoices.htmlの仕訳作成モーダル（openMailDetail内のmfj*関数群）とは別の、
   このタブ専用の状態（MFT_STATE）・関数群（mft*）。
   ============================================================ */
let MFT_STATE={};
async function mftLoadAccountsAndDepts(tenantId){
  const [accRes,deptRes]=await Promise.all([mfCall("accounts",{tenant_id:tenantId}),mfCall("list_departments",{tenant_id:tenantId})]);
  return {accounts:(accRes.ok&&accRes.body.accounts)||[], departments:(deptRes.ok&&deptRes.body.departments)||[], accountsOk:accRes.ok, accountsError:accRes.body&&accRes.body.error};
}
function mftBuildAccountIndex(accounts){
  const map=new Map(); let dl="";
  for(const a of accounts){
    map.set(a.name,{account_id:a.id,sub_account_id:null,account_name:a.name,sub_account_name:null});
    dl+=`<option value="${esc(a.name)}">`;
    for(const sa of (a.sub_accounts||[])){
      const label=`${a.name}/${sa.name}`;
      map.set(label,{account_id:a.id,sub_account_id:sa.id,account_name:a.name,sub_account_name:sa.name});
      dl+=`<option value="${esc(label)}">`;
    }
  }
  return {map,dl};
}
function mftLabelOf(side){ if(!side||!side.account_name) return ""; return side.sub_account_name?`${side.account_name}/${side.sub_account_name}`:side.account_name; }

async function renderMftSection(tenantId){
  const box=$("mft-box");
  if(!box) return;
  box.innerHTML="読み込み中…（連携先の事業者を確認しています）";
  const tRes=await mfCall("list_tenants");
  const tenants=(tRes.ok&&tRes.body.tenants)||[];
  const activeTenantId=tenantId||(tenants[0]&&tenants[0].id)||"default";
  MFT_STATE.tenants=tenants; MFT_STATE.activeTenantId=activeTenantId;
  box.innerHTML="読み込み中…（勘定科目・仕訳辞書を確認しています）";
  const {accounts,departments,accountsOk,accountsError}=await mftLoadAccountsAndDepts(activeTenantId);
  const {map,dl}=mftBuildAccountIndex(accounts);
  MFT_STATE.accountLabelMap=map; MFT_STATE.accountDatalistHtml=dl; MFT_STATE.departments=departments;
  const tplRes=await authed(`/rest/v1/mf_journal_templates?tenant_id=eq.${encodeURIComponent(activeTenantId)}&select=*&order=label`);
  MFT_STATE.templates=(tplRes.ok&&Array.isArray(tplRes.body))?tplRes.body:[];
  MFT_STATE.editing=null;
  box.innerHTML=`
    ${tenants.length>1?`<div style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">事業者</label>
      <select id="mft-tenant">${tenants.map(t=>`<option value="${esc(t.id)}" ${t.id===activeTenantId?"selected":""}>${esc(t.label)}</option>`).join("")}</select></div>`:""}
    ${!accountsOk?`<div class="err">勘定科目の取得に失敗しました（マネーフォワード未連携の可能性）: ${esc(accountsError||"")}</div>`:`
    <div id="mft-list">${mftListHtml()}</div>
    <button class="hq-btn" id="mft-new" style="margin-top:8px">＋ 新しい仕訳辞書を追加</button>
    <div id="mft-editor" style="margin-top:10px"></div>`}
  `;
  if(tenants.length>1) $("mft-tenant").onchange=e=>renderMftSection(e.target.value);
  if(!accountsOk) return;
  document.querySelectorAll("[data-mft-edit]").forEach(el=>el.onclick=()=>mftOpenEditor(MFT_STATE.templates.find(t=>t.id===el.dataset.mftEdit)));
  document.querySelectorAll("[data-mft-del]").forEach(el=>el.onclick=async()=>{
    if(!confirm(`仕訳辞書「${el.dataset.mftLabel}」を削除しますか？`)) return;
    await authed(`/rest/v1/mf_journal_templates?id=eq.${el.dataset.mftDel}`,{method:"DELETE"});
    renderMftSection(activeTenantId);
  });
  $("mft-new").onclick=()=>mftOpenEditor(null);
}
function mftListHtml(){
  const tpls=MFT_STATE.templates||[];
  if(!tpls.length) return `<div style="font-size:12px;color:var(--muted)">この事業者にはまだ仕訳辞書が登録されていません。</div>`;
  return tpls.map(t=>{
    const sum=(t.branches||[]).map(b=>`${mftLabelOf(b.debit)||"?"}／${mftLabelOf(b.credit)||"?"}`).join("、");
    return `<div class="mfj-tpl-item"><div><div class="lbl">${esc(t.label)}</div><div class="sum">${esc(sum)}（${(t.branches||[]).length}行）</div></div>

function mftWireEditor(){
  const ed=MFT_STATE.editing;
  document.querySelectorAll(".mft-debit").forEach(elx=>elx.oninput=()=>{ ed.branches[+elx.dataset.idx].debitLabel=elx.value; });
  document.querySelectorAll(".mft-credit").forEach(elx=>elx.oninput=()=>{ ed.branches[+elx.dataset.idx].creditLabel=elx.value; });
  document.querySelectorAll(".mft-dept").forEach(elx=>elx.onchange=()=>{ ed.branches[+elx.dataset.idx].department_id=elx.value; });
  document.querySelectorAll(".mft-remark").forEach(elx=>elx.oninput=()=>{ ed.branches[+elx.dataset.idx].remark=elx.value; });
  document.querySelectorAll(".mft-purpose").forEach(elx=>elx.onchange=()=>{ ed.branches[+elx.dataset.idx].purpose=elx.value; });
  document.querySelectorAll(".mft-debit-amount").forEach(elx=>elx.oninput=()=>{ ed.branches[+elx.dataset.idx].debitAmount=elx.value; });
  document.querySelectorAll(".mft-credit-amount").forEach(elx=>elx.oninput=()=>{ ed.branches[+elx.dataset.idx].creditAmount=elx.value; });
  document.querySelectorAll("[data-mftrm]").forEach(elx=>elx.onclick=()=>{ ed.branches.splice(+elx.dataset.mftrm,1); mftRenderEditor(); });
  $("mft-add-row").onclick=()=>{ ed.branches.push({debitLabel:"",debitAmount:"",creditLabel:"",creditAmount:"",department_id:"",remark:"",purpose:""}); mftRenderEditor(); };
  $("mft-cancel").onclick=()=>{ MFT_STATE.editing=null; mftRenderEditor(); };
  $("mft-save").onclick=mftSaveEditor;
}
async function mftSaveEditor(){
  const ed=MFT_STATE.editing;
  const label=$("mft-label").value.trim();
  if(!label){ alert("名前を入力してください"); return; }
  const structured=[];
  for(const b of ed.branches){
    const debit=b.debitLabel?MFT_STATE.accountLabelMap.get(b.debitLabel):null;
    const credit=b.creditLabel?MFT_STATE.accountLabelMap.get(b.creditLabel):null;
    if(b.debitLabel&&!debit){ alert("借方はプルダウンの候補から選んでください"); return; }
    if(b.creditLabel&&!credit){ alert("貸方はプルダウンの候補から選んでください"); return; }
    if(!debit&&!credit) continue;
    structured.push({
      debit:debit?{...debit,value:Number(b.debitAmount)||null}:null,
      credit:credit?{...credit,value:Number(b.creditAmount)||null}:null,
      department_id:b.department_id||null, department_name:(MFT_STATE.departments.find(d=>d.id===b.department_id)||{}).name||null,
      remark:b.remark||null, purpose:b.purpose||null,
    });
  }
  if(!structured.length){ alert("明細行がありません"); return; }
  $("mft-save").disabled=true;
  const payload={tenant_id:MFT_STATE.activeTenantId,label,branches:structured};
  const r=ed.id
    ?await authed(`/rest/v1/mf_journal_templates?id=eq.${ed.id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({...payload,updated_at:new Date().toISOString()})})
    :await authed("/rest/v1/mf_journal_templates",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({...payload,created_by:ME.id})});
  if(!r.ok){ if($("mft-save")) $("mft-save").disabled=false; alert("保存に失敗しました"); return; }
  renderMftSection(MFT_STATE.activeTenantId);
}

   独立した状態（MFU_STATE）・関数群（mfu*）。表の見た目は共通のmfj-grid CSSを再利用。
