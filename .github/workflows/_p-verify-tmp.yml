name: P一時検証(削除予定)
on: workflow_dispatch
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: store_monthly 再計算
        env:
          SR_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -s -m 280 -X POST https://uuvsxzhpxtghojoubjcc.supabase.co/functions/v1/keiei-kd-refresh -H "Authorization: Bearer $SR_KEY" -H "Content-Type: application/json" -d '{"op":"store_monthly"}' | cut -c1-300; echo
