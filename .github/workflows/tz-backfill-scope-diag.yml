name: タイムゾーンバグの影響範囲を確認（送信なし・一時的）
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 件数・日付範囲を確認
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo '--- tabelog_note: created_at_source件数・範囲 ---'
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?source=eq.tabelog_note&created_at_source=not.is.null&select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Prefer: count=exact" -D - -o /dev/null | grep -i content-range
          echo '--- dinii: created_at_source件数 ---'
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?source=eq.dinii&created_at_source=not.is.null&select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Prefer: count=exact" -D - -o /dev/null | grep -i content-range
          echo '--- dinii: cancel_at件数 ---'
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?source=eq.dinii&cancel_at=not.is.null&select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Prefer: count=exact" -D - -o /dev/null | grep -i content-range
          echo '--- created_at_sourceの最古・最新(tabelog_note) ---'
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?source=eq.tabelog_note&created_at_source=not.is.null&select=created_at_source&order=created_at_source.asc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?source=eq.tabelog_note&created_at_source=not.is.null&select=created_at_source&order=created_at_source.desc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          echo '--- imported_at/first_imported_atの最新(念のため。取込基盤の稼働開始時期確認) ---'
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?select=first_imported_at&order=first_imported_at.asc&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          echo '--- サンプル5件(補正計算の検証用) ---'
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?source=eq.tabelog_note&created_at_source=not.is.null&select=store_account,visit_date,visit_time,created_at_source&order=created_at_source.desc&limit=5" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
