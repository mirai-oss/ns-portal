  const accounts=await plFeeTargetAccounts();
  box.innerHTML=`
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:10px">
      <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">勘定科目名（MFと完全一致）</label>
        <input id="plfee-acc-name" placeholder="例: 支払手数料"></div>
      <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px">PL上での表示名（任意）</label>
        <input id="plfee-acc-label" placeholder="省略時は科目名と同じ"></div>
      <button class="hq-btn primary" id="plfee-acc-add">＋ 追加</button>
    </div>
    <div class="err" id="plfee-acc-msg" style="margin-bottom:8px"></div>
    <div class="hq-tablewrap">
      <table class="invoice-table">
        <thead><tr><th>勘定科目名</th><th>PL表示名</th><th></th></tr></thead>
        <tbody>${accounts.map(a=>`<tr>
          <td><b>${esc(a.account_name)}</b></td>
          <td>${esc(a.pl_label||a.account_name)}</td>
          <td><button class="hq-btn" style="font-size:11px;padding:6px 9px" data-plfee-acc-del="${esc(a.id)}">削除</button></td>
        </tr>`).join("")||'<tr><td colspan="3">登録されていません</td></tr>'}</tbody>
      </table>
    </div>`;
  $("plfee-acc-add").onclick=async()=>{
    const name=$("plfee-acc-name").value.trim();
    const label=$("plfee-acc-label").value.trim();
    const msg=$("plfee-acc-msg");
    if(!name){ msg.textContent="勘定科目名を入力してください"; return; }
    msg.className="err"; msg.textContent="追加中…";
    const r=await plFeeCall("add_target_account",{account_name:name,pl_label:label});
    if(!r.ok){ msg.textContent=r.body.error||"追加できませんでした"; return; }
    await renderPlFeeAccountsSection();
  };
  document.querySelectorAll("[data-plfee-acc-del]").forEach(el=>el.onclick=async()=>{
    if(!confirm("この科目をPL連携対象から外しますか？（過去に反映済みの記録は消えません）")) return;
    await plFeeCall("remove_target_account",{id:el.dataset.plfeeAccDel});
    await renderPlFeeAccountsSection();
  });
}

            <select id="rule-type">
              <option value="subject_contains">件名に含む（部分一致）</option>
              <option value="from_contains">送信元に含む（部分一致）</option>
              <option value="subject_exact">件名が完全一致</option>
              <option value="from_exact">送信元アドレスが完全一致</option>
            </select></div>
          <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:4px" id="rule-pattern-label">パターン（大文字小文字を区別しない）</label>
            <input id="rule-pattern" placeholder="例: 応募"></div>
          <button class="hq-btn primary" id="rule-add">＋ 追加</button>
        </div>
        <div class="meta" style="color:var(--muted);font-size:11px;margin-top:6px">完全一致は短い語（「ATM」等）が意図せず広く一致してしまう部分一致の弱点を避けたい時に使ってください。「送信元アドレスが完全一致」は表示名を除いた実際のアドレス部分（例: info@example.com）で比較します。</div>
        <div class="err" id="rule-msg" style="margin-top:8px"></div>
      </div>
      <div class="card hq-tablewrap">
        <table class="invoice-table">
          <thead><tr><th>条件</th><th>パターン</th><th>状態</th><th>登録日</th><th></th></tr></thead>
          <tbody>
            ${rows.map(x=>`<tr>
              <td>${RULE_TYPE_LABEL[x.rule_type]||x.rule_type}</td>
              <td><b>${esc(x.pattern)}</b></td>
              <td>${x.is_active?'<span class="invoice-status done">有効</span>':'<span class="invoice-status gray">無効</span>'}</td>
              <td>${fmtD(x.created_at)}</td>
              <td style="display:flex;gap:6px">
                <button class="hq-btn" style="font-size:11px;padding:6px 9px" data-toggle-rule="${x.id}" data-active="${x.is_active}">${x.is_active?"無効にする":"有効にする"}</button>
                <button class="hq-btn" style="font-size:11px;padding:6px 9px" data-del-rule="${x.id}">削除</button>
              </td>
            </tr>`).join("")||'<tr><td colspan="5">除外ルールは登録されていません</td></tr>'}
          </tbody>
        </table>
      </div>
      <div class="card" style="padding:16px;margin-top:14px">
        <h3 style="font-size:14px;margin-bottom:6px">📗 仕訳辞書（よく使う仕訳パターン）</h3>
        <div class="meta" style="color:var(--muted);font-size:12px;margin-bottom:10px">請求書メールの「🧾 仕訳を作成」画面で選べる、自社専用の仕訳テンプレートです（マネーフォワード本体の仕訳辞書とは別の、この管理システム内だけの機能です）。ここで登録・編集・削除できます。</div>
        <div id="mft-box">読み込み中…</div>
      </div>
      <div class="card" style="padding:16px;margin-top:14px">
        <h3 style="font-size:14px;margin-bottom:6px">📊 PL連携対象科目（手数料等→PL自動反映）</h3>
        <div class="meta" style="color:var(--muted);font-size:12px;margin-bottom:10px">ここに登録した勘定科目を借方に使って仕訳登録すると、請求書メール・アップロード請求書の画面に「📊 PLへ反映」パネルが自動で出るようになります（カード手数料・PayPay手数料など）。科目名はマネーフォワードの勘定科目名と完全に一致させてください。</div>
        <div id="plfee-accounts-box">読み込み中…</div>
      </div>
    </section>`;
  renderMftSection();
  renderPlFeeAccountsSection();
  const RULE_PLACEHOLDER={subject_contains:"例: 応募",from_contains:"例: example.com",subject_exact:"例: ATMお預け入れのご確認",from_exact:"例: info@example.com"};
  $("rule-type").onchange=e=>{ $("rule-pattern").placeholder=RULE_PLACEHOLDER[e.target.value]||""; };
  $("rule-pattern").placeholder=RULE_PLACEHOLDER[$("rule-type").value]||"";
  $("rule-add").onclick=async()=>{
    const pattern=$("rule-pattern").value.trim();
    const msg=$("rule-msg");
    if(!pattern){ msg.textContent="パターンを入力してください"; return; }
    msg.className="err"; msg.textContent="追加中…";
    const r2=await authed("/rest/v1/invoice_intake_exclusion_rules",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({rule_type:$("rule-type").value,pattern,created_by:ME.id})});
    if(!r2.ok){ msg.textContent="追加できませんでした"; return; }
    await renderSettingsTab(u);
  };
  document.querySelectorAll("[data-toggle-rule]").forEach(el=>el.onclick=async()=>{
    const active=el.dataset.active==="true";
    await authed(`/rest/v1/invoice_intake_exclusion_rules?id=eq.${el.dataset.toggleRule}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({is_active:!active})});
    await renderSettingsTab(u);
  });
  document.querySelectorAll("[data-del-rule]").forEach(el=>el.onclick=async()=>{
    if(!confirm("このルールを削除しますか？")) return;
    await authed(`/rest/v1/invoice_intake_exclusion_rules?id=eq.${el.dataset.delRule}`,{method:"DELETE"});
    await renderSettingsTab(u);
  });
}

/* ============================================================
   起動
   ============================================================ */
function renderLogin(){
  $("app").innerHTML=`<div class="card" style="padding:20px;margin-top:20px">
    <p style="margin-bottom:10px">ログインが必要です。ポータルからアクセスしてください。</p>
    ${EMBED?"":'<a class="hq-btn primary" href="index.html" style="text-decoration:none;display:inline-block">← ポータルへ</a>'}
  </div>`;
}
async function main(){
  if(EMBED) document.body.classList.add("embed-mode");
  if(!sess.get()){renderLogin();return}
  const u=await fetchMe();
  if(!u){sess.clear();renderLogin();return}
  if(u.is_active===false){renderLogin();return}
  ME=u;
  history.replaceState({tab:TAB},"");
  await Promise.all([loadInboxMaster(), loadWaitingPaymentCount(), loadKpiCounts()]);
  $("app").innerHTML=shellHtml(u);
  wireShell(u);
  await renderTabBody(u);
}
main();
</script>
</body>
</html>
