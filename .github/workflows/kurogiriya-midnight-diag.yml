name: 黒霧屋の深夜予約(visit_date/created_at_source)を確認（送信なし・一時的）
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 8/28分の深夜(0時台)予約を確認
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?store_account=ilike.*%E9%BB%92%E9%9C%A7%E5%B1%8B*&visit_date=eq.2026-08-28&select=visit_date,visit_time,created_at_source,channel_raw,status_normalized&order=visit_time.asc&limit=100" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          echo ''
          echo '--- 8/29分もついでに確認 ---'
          curl -sL "https://uuvsxzhpxtghojoubjcc.supabase.co/rest/v1/rsv_reservations?store_account=ilike.*%E9%BB%92%E9%9C%A7%E5%B1%8B*&visit_date=eq.2026-08-29&visit_time=lt.06:00:00&select=visit_date,visit_time,created_at_source,channel_raw,status_normalized&order=visit_time.asc&limit=20" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"
          echo ''
          echo '--- DB_営業時間の黒霧屋設定を確認(GAS経由・トークン認証) ---'
